<!DOCTYPE html>
<html>
<head>
<title>Fractal Station | Premium Lo-Fi Experience</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<meta http-equiv="Content-type" content="text/html; charset=utf-8">

<link href="https://site-assets.fontawesome.com/releases/v7.0.0/css/all.css" rel="stylesheet">
<script type="text/javascript" src="https://treesh.life/script/jquery-2.2.4.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Special+Gothic+Expanded+One&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Doto:wght@100..900&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&display=swap');

:root {
  --gold: #d4af37;
  --gold-light: #f4d976;
  --gold-dark: #b8941f;
  --black: #0a0a0f;
  --white: #fefefe;
  --theme-color: #d4af37;
  --theme-accent: #9b7c38;
  --border-color: rgba(212, 175, 55, 0.15);
  --glass-bg: rgba(20, 20, 30, 0.65);
  --main-font: "Manrope", sans-serif;
  --savionce-font: "Special Gothic Expanded One", sans-serif;
  --info-font: "Doto", sans-serif;
  --luxury-font: "Cormorant Garamond", serif;
}

*, *::before, *::after {
  margin: 0;
  padding: 0;
  outline: none !important;
  box-sizing: border-box;
  scroll-behavior: smooth;
}

.remove, .hide { display: none !important; }

body, html {
  width: 100%;
  height: 100vh;
  margin: 0 !important;
  padding: 0 !important;
  background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #0a0a0f 100%);
  color: var(--white);
  font-size: 16px;
  font-family: var(--main-font);
  font-weight: 400;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

@media screen and (max-width: 600px) {
  .desktop_only { display: none !important; }
}

@media screen and (min-width: 601px) {
  .mobile_only { display: none !important; }
}

ul, li, ol { list-style-type: none; }

/* Scrollbar */
::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}

::-webkit-scrollbar-track {
  background: rgba(0, 0, 0, 0.2);
  border-radius: 10px;
}

::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, var(--gold) 0%, var(--theme-accent) 100%);
  border-radius: 10px;
  transition: all 0.3s ease;
}

::-webkit-scrollbar-thumb:hover {
  background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold) 100%);
}

/* Particle Background */
#particles {
  position: fixed;
  width: 100%;
  height: 100%;
  top: 0;
  left: 0;
  z-index: 0;
  opacity: 0.4;
}

.particle {
  position: absolute;
  width: 2px;
  height: 2px;
  background: radial-gradient(circle, var(--gold) 0%, transparent 70%);
  border-radius: 50%;
  opacity: 0;
  animation: float 20s infinite ease-in-out;
}

@keyframes float {
  0%, 100% { 
    transform: translate(0, 0) scale(0);
    opacity: 0;
  }
  10% {
    opacity: 1;
  }
  50% {
    transform: translate(var(--tx), var(--ty)) scale(1);
    opacity: 0.8;
  }
  90% {
    opacity: 1;
  }
}

/* Dynamic Background */
#bg {
  width: 100%;
  height: 100%;
  position: fixed;
  top: 0;
  left: 0;
  opacity: 0;
  z-index: 1;
  background: url('') center / cover no-repeat;
  transition: opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1);
}

#bg:after {
  content: "";
  width: 100%;
  height: 100%;
  position: absolute;
  top: 0;
  left: 0;
  opacity: 0;
  backdrop-filter: blur(25px) saturate(150%);
  -webkit-backdrop-filter: blur(25px) saturate(150%);
  background: radial-gradient(ellipse at center, rgba(10, 10, 15, 0.75) 0%, rgba(10, 10, 15, 0.9) 100%);
  transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
}

#bg.go-modal:after {
  opacity: 1;
}

/* Top Navigation Bar */
#wave {
  width: 100%;
  height: 80px;
  position: fixed;
  top: 0;
  left: 0;
  z-index: 100;
  display: flex;
  padding: 20px 30px;
  justify-content: space-between;
  align-items: center;
}

#wave:after {
  content: "";
  width: 100%;
  height: 200%;
  top: 0;
  left: 0;
  background: linear-gradient(to bottom, rgba(10, 10, 15, 0.95) 0%, transparent 100%);
  position: absolute;
  z-index: -1;
  pointer-events: none;
}

#wave .section {
  width: auto;
  height: 100%;
  position: relative;
  display: flex;
  align-items: center;
  gap: 15px;
}

#wave img {
  height: 45px;
  width: auto;
  filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.4));
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

#wave img:hover {
  filter: drop-shadow(0 0 25px rgba(212, 175, 55, 0.7));
  transform: scale(1.05);
}

/* Premium Buttons */
button, .btn {
  position: relative;
  color: var(--gold);
  font-family: var(--main-font);
  border: 2px solid var(--border-color);
  border-radius: 50%;
  width: 60px;
  height: 60px;
  padding: 0;
  outline: none;
  margin: auto;
  overflow: hidden;
  cursor: pointer;
  background: var(--glass-bg);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  box-shadow: 
    0 8px 32px rgba(0, 0, 0, 0.4),
    inset 0 1px 0 rgba(255, 255, 255, 0.1),
    0 0 0 1px rgba(212, 175, 55, 0.1);
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

button:hover {
  border-color: var(--gold);
  box-shadow: 
    0 12px 40px rgba(212, 175, 55, 0.3),
    inset 0 1px 0 rgba(255, 255, 255, 0.2),
    0 0 30px rgba(212, 175, 55, 0.2);
  transform: translateY(-2px);
}

button:active {
  transform: translateY(0);
}

button i {
  font-size: 1.5rem;
  position: relative;
  z-index: 2;
  transition: all 0.3s ease;
}

button:hover i {
  color: var(--gold-light);
}

/* Glass Effect Overlays */
.glass-overlay {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  opacity: 0.15;
  z-index: 1;
  background: linear-gradient(135deg, rgba(212, 175, 55, 0.3) 0%, rgba(155, 124, 56, 0.1) 100%);
  pointer-events: none;
}

.glass-specular {
  position: absolute;
  inset: 0;
  z-index: 2;
  border-radius: inherit;
  opacity: 0.4;
  box-shadow: inset 2px 2px 4px rgba(255, 255, 255, 0.2);
  pointer-events: none;
}

/* Volume & EQ Controls */
.controls-container {
  display: flex;
  gap: 15px;
  align-items: center;
}

.volume-control {
  position: relative;
  width: 140px;
  height: 60px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 15px;
  background: var(--glass-bg);
  backdrop-filter: blur(20px) saturate(180%);
  border: 2px solid var(--border-color);
  border-radius: 30px;
  box-shadow: 
    0 8px 32px rgba(0, 0, 0, 0.4),
    inset 0 1px 0 rgba(255, 255, 255, 0.1);
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

.volume-control:hover {
  border-color: var(--gold);
  box-shadow: 
    0 12px 40px rgba(212, 175, 55, 0.3),
    inset 0 1px 0 rgba(255, 255, 255, 0.2);
}

.volume-icon {
  color: var(--gold);
  font-size: 1.2rem;
  min-width: 20px;
}

#volumeSlider {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  height: 4px;
  background: linear-gradient(90deg, var(--gold) 0%, var(--gold) 70%, rgba(255, 255, 255, 0.2) 70%);
  border-radius: 10px;
  outline: none;
  cursor: pointer;
}

#volumeSlider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 16px;
  height: 16px;
  background: var(--gold);
  border-radius: 50%;
  cursor: pointer;
  box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
  transition: all 0.3s ease;
}

#volumeSlider::-webkit-slider-thumb:hover {
  transform: scale(1.2);
  box-shadow: 0 0 20px rgba(212, 175, 55, 0.8);
}

/* Player Container */
#player {
  width: calc(100% - 60px);
  max-width: 500px;
  margin: auto;
  height: auto;
  padding: 25px;
  position: fixed;
  bottom: 40px;
  left: 0;
  right: 0;
  border-radius: 30px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  background: var(--glass-bg);
  backdrop-filter: blur(30px) saturate(180%);
  border: 2px solid var(--border-color);
  z-index: 50;
  box-shadow: 
    0 20px 60px rgba(0, 0, 0, 0.5),
    inset 0 1px 0 rgba(255, 255, 255, 0.1),
    0 0 0 1px rgba(212, 175, 55, 0.1);
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

#player:hover {
  box-shadow: 
    0 25px 70px rgba(0, 0, 0, 0.6),
    inset 0 1px 0 rgba(255, 255, 255, 0.15),
    0 0 40px rgba(212, 175, 55, 0.15);
}

/* Now Playing Info */
.now-playing {
  text-align: center;
  padding: 10px 0;
}

.now-playing-title {
  font-family: var(--luxury-font);
  font-size: 1.5rem;
  font-weight: 600;
  color: var(--gold);
  margin-bottom: 5px;
  text-shadow: 0 2px 10px rgba(212, 175, 55, 0.3);
}

.now-playing-artist {
  font-family: var(--savionce-font);
  font-size: 0.9rem;
  color: rgba(255, 255, 255, 0.7);
  letter-spacing: 2px;
}

/* Progress Bar */
.progress-container {
  width: 100%;
  padding: 10px 0;
}

.progress-bar {
  width: 100%;
  height: 6px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 10px;
  position: relative;
  cursor: pointer;
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--gold) 0%, var(--gold-light) 100%);
  border-radius: 10px;
  position: relative;
  transition: width 0.1s linear;
  box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
}

.progress-bar-fill::after {
  content: '';
  position: absolute;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 12px;
  height: 12px;
  background: var(--gold);
  border-radius: 50%;
  box-shadow: 0 0 15px rgba(212, 175, 55, 0.8);
}

.time-display {
  display: flex;
  justify-content: space-between;
  margin-top: 8px;
  font-size: 0.75rem;
  color: rgba(255, 255, 255, 0.5);
  font-family: var(--info-font);
}

/* Player Controls */
.player-controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
}

#playPause {
  width: 80px;
  height: 80px;
  background: linear-gradient(135deg, var(--gold) 0%, var(--theme-accent) 100%);
  border: none;
  position: relative;
  overflow: visible;
}

#playPause::before {
  content: '';
  position: absolute;
  inset: -3px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--gold) 0%, var(--theme-accent) 100%);
  opacity: 0;
  z-index: -1;
  transition: opacity 0.4s ease;
}

#playPause:hover::before {
  opacity: 0.5;
  animation: pulse 2s ease infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 0.5; }
  50% { transform: scale(1.1); opacity: 0.3; }
}

#playPause i {
  color: var(--black);
  font-size: 2rem;
}

.circle {
  position: absolute;
  top: -5px;
  left: -5px;
  width: calc(100% + 10px);
  height: calc(100% + 10px);
  transform: rotate(-90deg);
}

.circle circle {
  stroke: rgba(212, 175, 55, 0.8);
  filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.5));
}

/* Bottom Gradient */
.bottom_gradient {
  width: 100vw;
  height: 250px;
  bottom: 0;
  left: 0;
  background: linear-gradient(to top, rgba(10, 10, 15, 1) 0%, transparent 100%);
  position: fixed;
  pointer-events: none;
  z-index: 2;
}

/* Playlist Modal */
#playlist {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  width: 100%;
  height: 100%;
  overflow: auto;
  z-index: -100;
  opacity: 0;
  transform: translateY(100%);
  transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}

#playlist.go {
  z-index: 200;
  opacity: 1;
  transform: translateY(0);
}

#playlist:before {
  content: "";
  width: 100%;
  height: 100%;
  position: absolute;
  top: 0;
  left: 0;
  background: rgba(10, 10, 15, 0.98);
  backdrop-filter: blur(40px) saturate(180%);
  z-index: -1;
}

#playlist header {
  position: relative;
  width: 100%;
  padding: 100px 30px 30px 30px;
  z-index: 2;
}

header h1 {
  font-family: var(--luxury-font);
  font-size: clamp(3rem, 12vw, 6rem);
  line-height: 1;
  font-weight: 300;
  background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 20px;
  letter-spacing: -2px;
}

/* Mini Player */
.mini_player {
  width: 100%;
  margin-top: 20px;
  padding: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--glass-bg);
  backdrop-filter: blur(20px) saturate(180%);
  border: 2px solid var(--border-color);
  border-radius: 20px;
  gap: 15px;
  box-shadow: 
    0 8px 32px rgba(0, 0, 0, 0.4),
    inset 0 1px 0 rgba(255, 255, 255, 0.1);
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

.mini_player:hover {
  border-color: var(--gold);
  box-shadow: 
    0 12px 40px rgba(212, 175, 55, 0.3),
    inset 0 1px 0 rgba(255, 255, 255, 0.2);
}

.mini_player .cover {
  min-width: 70px;
  width: 70px;
  height: 70px;
  border-radius: 15px;
  overflow: hidden;
  border: 2px solid var(--border-color);
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
  position: relative;
}

.mini_player .cover::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, var(--gold) 0%, var(--theme-accent) 100%);
  opacity: 0.3;
}

.mini_player .cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  position: relative;
  z-index: 1;
}

.mini_player .metadata {
  flex: 1;
  overflow: hidden;
}

.mini_player-song_name {
  font-weight: 700;
  font-size: 1.1rem;
  color: var(--gold);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 5px;
}

.mini_player-artist {
  font-family: var(--savionce-font);
  font-size: 0.85rem;
  color: rgba(255, 255, 255, 0.6);
  letter-spacing: 1px;
}

.mini_player .options button {
  background: transparent;
  border: none;
  width: auto;
  height: auto;
  box-shadow: none;
  color: var(--gold);
  font-size: 1.5rem;
  padding: 10px;
  transition: all 0.3s ease;
}

.mini_player .options button:hover {
  color: var(--gold-light);
  transform: scale(1.2);
}

.mini_player .options button.liked {
  color: #ff6b9d;
}

/* Playlist Grid */
.playlist {
  width: 100%;
  padding: 20px 30px 200px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 20px;
}

@media (max-width: 768px) {
  .playlist {
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 15px;
  }
}

.song {
  position: relative;
  aspect-ratio: 1 / 1.3;
  border-radius: 20px;
  overflow: hidden;
  cursor: pointer;
  border: 2px solid var(--border-color);
  background: var(--glass-bg);
  backdrop-filter: blur(20px) saturate(180%);
  box-shadow: 
    0 8px 32px rgba(0, 0, 0, 0.4),
    inset 0 1px 0 rgba(255, 255, 255, 0.05);
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  opacity: 0;
  transform: translateY(30px) scale(0.9);
}

.song:hover {
  transform: translateY(-5px) scale(1.02);
  border-color: var(--gold);
  box-shadow: 
    0 15px 50px rgba(212, 175, 55, 0.4),
    inset 0 1px 0 rgba(255, 255, 255, 0.1);
}

.song.clicked {
  border-color: var(--gold);
  background: linear-gradient(135deg, rgba(212, 175, 55, 0.2) 0%, rgba(155, 124, 56, 0.1) 100%);
}

.song .cover {
  width: 100%;
  height: 100%;
  position: relative;
  overflow: hidden;
}

.song .cover::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, var(--gold) 0%, var(--theme-accent) 100%);
  opacity: 0.2;
  z-index: 1;
}

.song .cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}

.song:hover .cover img {
  transform: scale(1.1);
}

.song::after {
  content: "";
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 70%;
  background: linear-gradient(180deg, rgba(10, 10, 15, 0) 0%, rgba(10, 10, 15, 0.95) 100%);
  z-index: 2;
  pointer-events: none;
}

.song .metadata {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 15px;
  z-index: 3;
  color: white;
}

.song_title {
  font-weight: 700;
  font-size: 0.95rem;
  color: var(--gold-light);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 5px;
  text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
}

.song_artist {
  font-family: var(--savionce-font);
  font-size: 0.75rem;
  color: rgba(255, 255, 255, 0.7);
  letter-spacing: 1px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Backgrounds Modal */
#backgrounds {
  width: 100%;
  height: 100%;
  position: fixed;
  top: 0;
  left: 0;
  z-index: -1000;
  overflow: auto;
  opacity: 0;
  transform: translateY(-100%);
  transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}

#backgrounds.active {
  z-index: 200;
  opacity: 1;
  transform: translateY(0);
}

#backgrounds:before {
  content: "";
  width: 100%;
  height: 100%;
  position: absolute;
  top: 0;
  left: 0;
  background: rgba(10, 10, 15, 0.98);
  backdrop-filter: blur(40px) saturate(180%);
  z-index: -1;
}

#backgrounds header {
  padding: 100px 30px 30px;
}

#backgrounds h1 {
  font-family: var(--luxury-font);
  font-size: clamp(2.5rem, 10vw, 5rem);
  font-weight: 300;
  background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: -1px;
}

.backgrounds {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 20px;
  padding: 20px 30px 200px;
}

@media (max-width: 768px) {
  .backgrounds {
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  }
}

.backgrounds .item {
  aspect-ratio: 3 / 4;
  border-radius: 15px;
  background: center / cover no-repeat;
  cursor: pointer;
  border: 2px solid var(--border-color);
  box-shadow: 
    0 8px 32px rgba(0, 0, 0, 0.4),
    inset 0 1px 0 rgba(255, 255, 255, 0.05);
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  opacity: 0;
  transform: translateY(30px) scale(0.9);
}

.backgrounds .item:hover {
  transform: translateY(-5px) scale(1.02);
  border-color: var(--gold);
  box-shadow: 
    0 15px 50px rgba(212, 175, 55, 0.4),
    inset 0 1px 0 rgba(255, 255, 255, 0.1);
}

/* Mood Filter */
.mood-filter {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 15px;
  padding: 0 30px;
}

.mood-tag {
  padding: 8px 16px;
  background: var(--glass-bg);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border-color);
  border-radius: 20px;
  font-size: 0.85rem;
  color: rgba(255, 255, 255, 0.7);
  cursor: pointer;
  transition: all 0.3s ease;
}

.mood-tag:hover, .mood-tag.active {
  background: linear-gradient(135deg, var(--gold) 0%, var(--theme-accent) 100%);
  color: var(--black);
  border-color: var(--gold);
}

/* Audio Visualizer */
.visualizer {
  width: 100%;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 10px 0;
}

.bar {
  width: 4px;
  height: 20px;
  background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold) 100%);
  border-radius: 10px;
  animation: visualize 0.8s ease-in-out infinite;
  opacity: 0.7;
}

.bar:nth-child(1) { animation-delay: 0s; }
.bar:nth-child(2) { animation-delay: 0.1s; }
.bar:nth-child(3) { animation-delay: 0.2s; }
.bar:nth-child(4) { animation-delay: 0.3s; }
.bar:nth-child(5) { animation-delay: 0.4s; }
.bar:nth-child(6) { animation-delay: 0.5s; }
.bar:nth-child(7) { animation-delay: 0.6s; }

@keyframes visualize {
  0%, 100% { height: 20px; opacity: 0.7; }
  50% { height: 50px; opacity: 1; }
}

/* Hide visualizer when paused */
body.paused .visualizer .bar {
  animation: none;
  height: 20px;
  opacity: 0.3;
}

#radio {
  opacity: 0;
  visibility: hidden;
  position: fixed;
  z-index: -1000;
  transform: translate3d(0, -100%, 0);
}

/* Responsive adjustments */
@media (max-width: 768px) {
  #player {
    width: calc(100% - 30px);
    padding: 20px;
    bottom: 20px;
  }
  
  #playPause {
    width: 70px;
    height: 70px;
  }
  
  .volume-control {
    width: 120px;
  }
}

];

// DOM elements
const audio = document.getElementById("radio");
const bg = document.querySelector("#bg");
const playPause = document.querySelector("#playPause");
const icon = playPause.querySelector("i");
const nextBtn = document.querySelector("#next");
const prevBtn = document.querySelector("#prev");
const bgBtn = document.querySelector("#bgBtn");
const playlist = document.querySelector("#playlist");
const playlistContainer = document.querySelector(".playlist");
const backgroundsContainer = document.querySelector(".backgrounds");
const backgroundsModal = document.querySelector("#backgrounds");
const volumeSlider = document.querySelector("#volumeSlider");
const progressBar = document.querySelector("#progressBar");
const progressFill = document.querySelector("#progressFill");
const currentTimeEl = document.querySelector("#currentTime");
const durationEl = document.querySelector("#duration");
const nowPlayingTitle = document.querySelector(".now-playing-title");
const nowPlayingArtist = document.querySelector(".now-playing-artist");

const circle = playPause.querySelector("circle");
const radius = circle.r.baseVal.value;
const circumference = 2 * Math.PI * radius;
circle.style.strokeDasharray = circumference;
circle.style.strokeDashoffset = circumference;

let currentSongIndex = 0;
let isHeld = false;
let holdTimer = null;
let holdTween = null;

// Create particles
function createParticles() {
  const particlesContainer = document.getElementById('particles');
  for (let i = 0; i < 50; i++) {
    const particle = document.createElement('div');
    particle.className = 'particle';
    particle.style.left = Math.random() * 100 + '%';
    particle.style.top = Math.random() * 100 + '%';
    particle.style.setProperty('--tx', (Math.random() - 0.5) * 200 + 'px');
    particle.style.setProperty('--ty', (Math.random() - 0.5) * 200 + 'px');
    particle.style.animationDelay = Math.random() * 20 + 's';
    particlesContainer.appendChild(particle);
  }
}

// Format time
function formatTime(seconds) {
  const mins = Math.floor(seconds / 60);
  const secs = Math.floor(seconds % 60);
  return `${mins}:${secs.toString().padStart(2, '0')}`;
}

// Update progress bar
function updateProgress() {
  const progress = (audio.currentTime / audio.duration) * 100;
  progressFill.style.width = progress + '%';
  currentTimeEl.textContent = formatTime(audio.currentTime);
  durationEl.textContent = formatTime(audio.duration);
}

// Seek in audio
progressBar.addEventListener('click', (e) => {
  const rect = progressBar.getBoundingClientRect();
  const percent = (e.clientX - rect.left) / rect.width;
  audio.currentTime = percent * audio.duration;
});

// Volume control
volumeSlider.addEventListener('input', (e) => {
  audio.volume = e.target.value / 100;
  const percent = e.target.value;
  e.target.style.background = `linear-gradient(90deg, var(--gold) 0%, var(--gold) ${percent}%, rgba(255, 255, 255, 0.2) ${percent}%)`;
});

// Audio events
audio.addEventListener('play', () => {
  icon.classList.remove('fa-play');
  icon.classList.add('fa-pause');
  document.body.classList.remove('paused');
});

audio.addEventListener('pause', () => {
  icon.classList.remove('fa-pause');
  icon.classList.add('fa-play');
  document.body.classList.add('paused');
});

audio.addEventListener('timeupdate', updateProgress);
audio.addEventListener('loadedmetadata', updateProgress);

audio.addEventListener('ended', () => {
  nextBtn.click();
});

// Load backgrounds
bgs.forEach(bgUrl => {
  const div = document.createElement("div");
  div.className = "item";
  div.style.backgroundImage = `url('${bgUrl}')`;
  backgroundsContainer.appendChild(div);
});

// Random background
function randomBg() {
  if (!bg.classList.contains("picked")) {
    const randomImage = bgs[Math.floor(Math.random() * bgs.length)];
    gsap.to(bg, {
      opacity: 0,
      duration: 0.8,
      ease: "power2.inOut",
      onComplete: () => {
        bg.style.backgroundImage = `url(${randomImage})`;
        gsap.to(bg, { opacity: 1, duration: 1.2, ease: "power2.inOut" });
      }
    });
  }
}

// Load playlist
audios.forEach((audioObj, index) => {
  const songDiv = document.createElement("div");
  songDiv.className = "song";
  songDiv.innerHTML = `
    <div class="cover">
      <img src="${audioObj.cover || 'https://via.placeholder.com/400x520/0a0a0f/d4af37?text=' + encodeURIComponent(audioObj.title)}" alt="${audioObj.title}" />
    </div>
    <div class="metadata">
      <p class="song_title">${audioObj.title}</p>
      <p class="song_artist">${audioObj.artist}</p>
    </div>
    <div class="glass-overlay"></div>
    <div class="glass-specular"></div>
  `;
  
  songDiv.addEventListener("click", () => {
    currentSongIndex = index;
    loadSong(index);
    audio.play();
    
    document.querySelectorAll(".song").forEach(s => s.classList.remove("clicked"));
    songDiv.classList.add("clicked");
  });
  
  playlistContainer.appendChild(songDiv);
});

// Load song
function loadSong(index) {
  const song = audios[index];
  audio.src = song.url;
  
  nowPlayingTitle.textContent = song.title;
  nowPlayingArtist.textContent = song.artist;
  
  document.querySelector(".mini_player-song_name").textContent = song.title;
  document.querySelector(".mini_player-artist").textContent = song.artist;
  document.querySelector(".mini_player .cover img").src = song.cover || 'https://via.placeholder.com/400';
  
  gsap.fromTo([nowPlayingTitle, nowPlayingArtist], 
    { y: 20, opacity: 0 },
    { y: 0, opacity: 1, duration: 0.6, stagger: 0.1, ease: "power3.out" }
  );
}

// Play/Pause button
const startHold = () => {
  isHeld = false;
  holdTimer = setTimeout(() => {
    playPause.classList.add('held');
    isHeld = true;
    holdTween = gsap.to(circle, {
      strokeDashoffset: 0,
      duration: 1,
      ease: "linear",
      onComplete: () => {
        if (backgroundsModal.classList.contains('active')) {
          closeBackgrounds();
          setTimeout(() => openPlaylist(), 300);
        } else if (playlist.classList.contains('go')) {
          closePlaylist();
        } else {
          openPlaylist();
        }
      }
    });
  }, 100);
};

const endHold = () => {
  clearTimeout(holdTimer);
  playPause.classList.remove('held');
  if (holdTween) holdTween.kill();
  gsap.set(circle, { strokeDashoffset: circumference });
};

playPause.addEventListener("mousedown", startHold);
playPause.addEventListener("mouseup", endHold);
playPause.addEventListener("mouseleave", endHold);
playPause.addEventListener("touchstart", startHold);
playPause.addEventListener("touchend", endHold);

playPause.addEventListener("click", () => {
  if (isHeld) return;
  if (audio.paused) {
    audio.play();
  } else {
    audio.pause();
  }
});

// Next/Prev buttons
nextBtn.addEventListener("click", () => {
  currentSongIndex = (currentSongIndex + 1) % audios.length;
  loadSong(currentSongIndex);
  audio.play();
  document.querySelectorAll(".song")[currentSongIndex].click();
  randomBg();
});

prevBtn.addEventListener("click", () => {
  currentSongIndex = (currentSongIndex - 1 + audios.length) % audios.length;
  loadSong(currentSongIndex);
  audio.play();
  document.querySelectorAll(".song")[currentSongIndex].click();
});

// Playlist modal
function openPlaylist() {
  playlist.classList.add('go');
  bg.classList.add('go-modal');
  
  gsap.fromTo(".ani", 
    { y: 100, opacity: 0 },
    { y: 0, opacity: 1, duration: 0.8, stagger: 0.15, ease: "power3.out" }
  );
  
  gsap.fromTo(".song", 
    { y: 30, opacity: 0, scale: 0.9 },
    { y: 0, opacity: 1, scale: 1, duration: 0.6, stagger: 0.03, ease: "power3.out", delay: 0.3 }
  );
}

function closePlaylist() {
  gsap.to(".song", {
    y: 30,
    opacity: 0,
    scale: 0.9,
    duration: 0.4,
    stagger: 0.02,
    ease: "power3.in",
    onComplete: () => {
      playlist.classList.remove('go');
      bg.classList.remove('go-modal');
      playlist.scrollTop = 0;
    }
  });
}

// Backgrounds modal
function openBackgrounds() {
  backgroundsModal.classList.add('active');
  bg.classList.add('go-modal');
  
  gsap.fromTo(".backgrounds .item", 
    { y: 30, opacity: 0, scale: 0.9 },
    { y: 0, opacity: 1, scale: 1, duration: 0.6, stagger: 0.03, ease: "power3.out", delay: 0.2 }
  );
}

function closeBackgrounds() {
  gsap.to(".backgrounds .item", {
    y: 30,
    opacity: 0,
    scale: 0.9,
    duration: 0.4,
    stagger: 0.02,
    ease: "power3.in",
    onComplete: () => {
      backgroundsModal.classList.remove('active');
      bg.classList.remove('go-modal');
      backgroundsModal.scrollTop = 0;
    }
  });
}

bgBtn.addEventListener("click", () => {
  const icon = bgBtn.querySelector("i");
  
  if (icon.classList.contains("fa-image")) {
    if (playlist.classList.contains('go')) {
      closePlaylist();
      setTimeout(() => openBackgrounds(), 300);
    } else {
      openBackgrounds();
    }
    icon.classList.remove("fa-image");
    icon.classList.add("fa-x");
  } else {
    if (backgroundsModal.classList.contains('active')) {
      closeBackgrounds();
    } else if (playlist.classList.contains('go')) {
      closePlaylist();
    }
    icon.classList.add("fa-image");
    icon.classList.remove("fa-x");
  }
});

// Background selection
document.querySelectorAll(".backgrounds .item").forEach(item => {
  item.addEventListener("click", function() {
    const newBg = this.style.backgroundImage;
    gsap.to(bg, {
      opacity: 0,
      duration: 0.5,
      ease: "power2.inOut",
      onComplete: () => {
        bg.style.backgroundImage = newBg;
        bg.classList.add("picked");
        gsap.to(bg, { opacity: 1, duration: 0.8, ease: "power2.inOut" });
      }
    });
    
    document.querySelectorAll(".backgrounds .item").forEach(i => {
      gsap.to(i, { opacity: i === this ? 1 : 0.5, duration: 0.3 });
    });
  });
});

// Like button
document.querySelector(".like-btn").addEventListener("click", function() {
  this.classList.toggle("liked");
});

// Initialize
document.addEventListener("DOMContentLoaded", () => {
  createParticles();
  randomBg();
  
  // Animate player on load
  gsap.fromTo("#player", 
    { y: 100, opacity: 0, scale: 0.9 },
    { y: 0, opacity: 1, scale: 1, duration: 1, ease: "power3.out", delay: 0.5 }
  );
  
  gsap.fromTo(bg, 
    { opacity: 0 },
    { opacity: 1, duration: 2, ease: "power2.out" }
  );
  
  // Load first song
  loadSong(0);
  document.querySelectorAll(".song")[0].classList.add("clicked");
  
  // Set initial volume
  audio.volume = 0.7;
});
</script>

</body>
</html>
