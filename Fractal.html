  /* Everything */

    z-index:-1;
    pointer-events:none;

    const backgroundsContainer = document.querySelector("#backgrounds .backgrounds");

bgs.forEach(bg => {
  const div = document.createElement("div");
  div.className = "item";
  div.style.background = `url('${bg}') center / cover no-repeat`;
  backgroundsContainer.appendChild(div);
});
        
        // ------ start Playlist
  
  // start Playlist Load
        
      audios.forEach((audioObj, index) => {
  const songDiv = document.createElement("div");
  songDiv.setAttribute("data-id", index + 1);
  songDiv.className = "song";
  songDiv.innerHTML = `
  <div class="glass-overlay"></div><div class="glass-specular"></div>
    <div class="cover section">
      <img src="${audioObj.cover}" alt="${audioObj.title}" />
    </div>
    <div class="metadata section">
      <p class="song_title">${audioObj.title}</p>
      <p class="song_artist">${audioObj.artist}</p>
    </div>
  `;

  playlistContainer.appendChild(songDiv);
        
  songDiv.addEventListener("click", () => {
    audio.src = audioObj.url;
    audio.play();
    songDiv.classList.add("clicked");
    
    const siblings = songDiv.parentElement.children;
for (let sib of siblings) {
  if (sib !== songDiv) sib.classList.remove("clicked");
}
  });
});
  
  const songs = document.querySelectorAll("#playlist .song");
if (songs.length) {
  songs[0].click(); 
}
        
        // start Audio Events
        
  audio.addEventListener("play", function() {
  icon.classList.remove("fa-play");
  icon.classList.add("fa-pause");
});
        
        audio.addEventListener("pause", function() {
  icon.classList.remove("fa-pause");
  icon.classList.add("fa-play");
});
        
        // ------ start Global Functions
        
        const iconn = document.querySelector("#bgBtn i");

const playlistAni = gsap.timeline({ paused: true })
  .fromTo(playlist, 
    { y: "100%", opacity: 0 }, 
    { y: 0, opacity: 1, duration: 0.6, ease: "power4.out" }
  )
  .fromTo(iconn, 
    { scale: 0 }, 
    { 
      scale: 1, 
      duration: 0.6,
      ease: "power4.out",
      onStart: () => {
        iconn.classList.remove("fa-image");
        iconn.classList.add("fa-x");
        bgBtn.classList.add("clicked");
      }
    },
    0
  )
  .fromTo(songs, 
    { y: 20, opacity: 0, scale: 0.8 }, 
    { y: 0, opacity: 1, scale: 1, duration: 0.6, ease: "power4.out", stagger: 0.05 }, 
    0
  );

        gsap.set(iconn, { scale: 1 }); 



        
function reversePlaylist() {
  playlistAni.eventCallback("onReverseComplete", () => {
        bg.classList.remove("go-modal");
        
  iconn.classList.remove("fa-x");
  iconn.classList.add("fa-image");
  gsap.to(iconn, { scale: 1, duration: 0.6 }); 
        
        const scrollable = document.querySelector("#playlist"); 
        if(scrollable) scrollable.scrollTop = 0;
        playlistAni.eventCallback("onReverseComplete", null);
      });
      playlistAni.reverse();
}

        
function reverseBgList() {
  backgroundsTimeline.eventCallback("onReverseComplete", () => {
        bg.classList.remove("go-modal");
        const scrollable = document.querySelector("#backgrounds"); 
        if (scrollable) scrollable.scrollTop = 0;
        backgroundsTimeline.eventCallback("onReverseComplete", null);
      });
      backgroundsTimeline.reverse();
}
        
        
        
  const bgItems = document.querySelectorAll("#backgrounds .item");

const backgroundsTimeline = gsap.timeline({ paused: true })
  .fromTo("#backgrounds", 
    { y: 20, opacity: 0, zIndex: -2 },
    { 
      y: 0, 
      opacity: 1, 
      duration: 0.6, 
      zIndex: 2, 
      ease: "power4.out",
    onStart: () => {
      bgBtn.classList.add("clicked");
    }
    }
  )
  .fromTo(bgItems, 
    { y: 20, opacity: 0, scale: 0.8 },
    { y: 0, opacity: 1, scale: 1, duration: 0.6, stagger: 0.05, ease: "power4.out" },
    "-=0.3" 
  );
        
        
document.addEventListener("DOMContentLoaded", () => {
  
buttons.forEach(btn => {
  btn.insertAdjacentHTML("beforeend", '<div class="glass-overlay"></div><div class="glass-specular"></div>');
});

  randomBg();
  
  
  let playerBtnsAni = gsap.fromTo("#playPause", 
  { y: "100%", opacity: 0, scale: 0.8 }, 
  { y: 0, opacity: 1, scale: 1, duration: 0.6, ease: "power4.out", delay: 0.9 }
);

let playerBtnsAniLittleBtns = gsap.fromTo($(buttons).not("#playPause"), 
  { y: "100%", opacity: 0, scale: 0.6 }, 
  { y: 0, opacity: 1, scale: 0.8, duration: 0.6, ease: "power4.out", stagger: 0.1, delay: 0.9 }
);

   
  let bgAni = gsap.fromTo(bg, 
  { opacity: 0 }, 
  { opacity: 1, duration: 3, ease: "power4.out", delay: 0.6, paused: false }); 
  
  
const startHold = (e) => {
  isHeld = false;

  holdTimer = setTimeout(() => {
    playPause.classList.add("held");
    isHeld = true;
  }, 100);

  holdTween = gsap.to(circle, { 
  strokeDashoffset: 0, 
  duration: 1,
  ease: "linear",
  onComplete: () => {
    const scrollable = document.querySelector("#backgrounds"); 

    if (bg.classList.contains("go-modal")) {
      backgroundsTimeline.eventCallback("onReverseComplete", () => {
        playlistAni.play();          
        if (scrollable) scrollable.scrollTop = 0;
        backgroundsTimeline.eventCallback("onReverseComplete", null); 
      });
      backgroundsTimeline.reverse(); 
    } else if (!backgroundsTimeline.isActive() && !backgroundsTimeline.reversed() && playlistAni.progress() > 0) {
      playlistAni.eventCallback("onReverseComplete", () => {
        bg.classList.remove("go-modal");
        playlistAni.eventCallback("onReverseComplete", null); 
      });
      playlistAni.reverse();
    } else {
      playlistAni.play();
      bg.classList.add("go-modal");
    }
  }
});



};

const endHold = () => {
  clearTimeout(holdTimer);
  playPause.classList.remove("held");
  if (holdTween) holdTween.kill();
  gsap.set(circle, { strokeDashoffset: circumference });
};

playPause.addEventListener("mousedown", startHold);
playPause.addEventListener("mouseup", endHold);
playPause.addEventListener("mouseleave", endHold);

playPause.addEventListener("touchstart", startHold);
playPause.addEventListener("touchend", endHold);
playPause.addEventListener("touchcancel", endHold);

playPause.addEventListener("click", function() {
  if (isHeld) return; 
  if (audio.paused) {
    audio.play();
  } else {
    audio.pause();
  }
});
  
  function gsapScrollSong(song, offset = 130, duration = 0.6) {
  if (!song) return;

  const targetScroll = song.offsetTop - offset;

  gsap.to(playlist, {
    scrollTop: targetScroll,
    duration: duration,
    ease: "power3.out"
  });
}

  
  next.addEventListener("click", function() {
  randomBg();
    
    audio.pause();
    
     const current = document.querySelector("#playlist .song.clicked");
  let nextSong = current ? current.nextElementSibling : null;

  if (!nextSong) {
    nextSong = document.querySelector("#playlist .song");
  }

   if (nextSong) {
    nextSong.click();
     gsapScrollSong(nextSong, 130);
  }
});
  
  prev.addEventListener("click", function() {
  randomBg();
    audio.pause();
    
     const current = document.querySelector("#playlist .song.clicked");
  let prevSong = current ? current.previousElementSibling : null;

  if (!prevSong) {
    const allSongs = document.querySelectorAll("#playlist .song");
    prevSong = allSongs[allSongs.length - 1];
  }

 if (prevSong) {
    prevSong.click();
   gsapScrollSong(prevSong, 130);
  }
}); 
  

bgBtn.addEventListener("click", function() {
  const icon = this.querySelector("i");

  const bgStyle = getComputedStyle(document.querySelector("#backgrounds"));
  
  if (icon.classList.contains("fa-image")) {
    if (!bg.classList.contains("go-modal")) {
      bg.classList.add("go-modal");
      backgroundsTimeline.play();
      
        iconn.classList.add("fa-x");
  iconn.classList.remove("fa-image");
    }
  } else {
    if ( parseFloat(bgStyle.opacity) === 1 ) {
      reverseBgList();
    } else {
      reversePlaylist();
}
    iconn.classList.remove("fa-x");
  iconn.classList.add("fa-image");
      bgBtn.classList.remove("clicked");
  }
});


  
  
  bgItems.forEach(item => {
  item.addEventListener("click", function() {
    const newImage = this.style.backgroundImage;

    gsap.to(bg, { 
      opacity: 0, 
      duration: 0.5, 
      onComplete: () => {
        bg.style.backgroundImage = newImage;
        
        bg.classList.add("picked");

        gsap.to(bg, { opacity: 1, duration: 0.5 });
      }
    });

    bgItems.forEach(sib => {
      gsap.to(sib, { opacity: sib === this ? 1 : 0.5, duration: 0.3 });
    });
  });
});



  
});
