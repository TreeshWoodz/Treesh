  button {
  padding: 14px 40px;
  font-size: 1.1rem;
  cursor: pointer;
  border-radius: 50px;
  font-weight: 800;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: #fff;
  background: radial-gradient(circle at 30% 30%, rgba(80, 255, 255, 0.8), rgba(0, 100, 255, 0.4) 70%, rgba(0, 0, 60, 0.3));
  border: 2px solid rgba(0, 255, 255, 0.7);
  box-shadow:
    0 0 10px rgba(0, 255, 255, 0.7),
    0 0 20px rgba(0, 200, 255, 0.4),
    inset 0 0 10px rgba(255, 255, 255, 0.2),
    inset 0 5px 15px rgba(0, 255, 255, 0.2);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  text-shadow: 0 0 8px rgba(0, 255, 255, 0.7);
  transition: all 0.25s ease;
  position: relative;
  overflow: hidden;
}

button::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(45deg, rgba(0, 255, 255, 0.4), rgba(0, 150, 255, 0.1), rgba(255, 0, 255, 0.2));
  opacity: 0.6;
  mix-blend-mode: overlay;
  pointer-events: none;
}

button::after {
  content: "";
  position: absolute;
  top: -150%;
  left: -150%;
  width: 400%;
  height: 400%;
  background: radial-gradient(circle, rgba(255, 255, 255, 0.3), transparent 60%);
  opacity: 0;
  transform: rotate(25deg);
  transition: opacity 0.4s, transform 0.6s;
}

button:hover::after {
  opacity: 1;
  transform: rotate(25deg) translate(20%, 20%);
}

button:hover {
  background: radial-gradient(circle at 30% 30%, rgba(100, 255, 255, 1), rgba(0, 150, 255, 0.5) 70%, rgba(0, 0, 60, 0.3));
  box-shadow:
    0 0 15px rgba(0, 255, 255, 1),
    0 0 30px rgba(0, 200, 255, 0.6),
    inset 0 0 10px rgba(255, 255, 255, 0.3);
  transform: translateY(-2px) scale(1.02);
}

button:active {
  transform: translateY(1px) scale(0.98);
  box-shadow: 0 0 8px rgba(0, 150, 255, 0.6);
}
  
  button.green {
    background: radial-gradient(circle at 30% 30%, rgba(100, 255, 150, 0.8), rgba(0, 180, 50, 0.4) 70%, rgba(0, 40, 0, 0.3));
  border: 2px solid rgba(0, 255, 100, 0.7);
  box-shadow:
    0 0 10px rgba(0, 255, 120, 0.7),
    0 0 20px rgba(0, 200, 80, 0.4),
    inset 0 0 10px rgba(255, 255, 255, 0.2),
    inset 0 5px 15px rgba(0, 255, 100, 0.2);
  }
  
  button.green:before {
    background: linear-gradient(45deg, rgba(0, 255, 100, 0.4), rgba(150, 255, 0, 0.1), rgba(0, 255, 200, 0.2));
  }
  
  button.green:hover {
    background: radial-gradient(circle at 30% 30%, rgba(120, 255, 180, 1), rgba(0, 200, 80, 0.5) 70%, rgba(0, 40, 0, 0.3));
  box-shadow:
    0 0 15px rgba(0, 255, 100, 1),
    0 0 30px rgba(50, 255, 150, 0.6),
    inset 0 0 10px rgba(255, 255, 255, 0.3);
  transform: translateY(-2px) scale(1.02);
  }
  
  button.purple {
  background: radial-gradient(circle at 30% 30%, rgba(200, 100, 255, 0.8), rgba(120, 0, 180, 0.4) 70%, rgba(40, 0, 40, 0.3));
  border: 2px solid rgba(180, 0, 255, 0.7);
  box-shadow: 
    0 0 10px rgba(180, 0, 255, 0.7), 
    0 0 20px rgba(120, 0, 200, 0.4), 
    inset 0 0 10px rgba(255, 255, 255, 0.2), 
    inset 0 5px 15px rgba(200, 100, 255, 0.2);
  transition: all 0.3s ease; /* Added for a smoother hover effect */
}

button.purple:before {
  background: linear-gradient(45deg, rgba(180, 0, 255, 0.4), rgba(255, 0, 150, 0.1), rgba(100, 0, 255, 0.2));
}

button.purple:hover {
  background: radial-gradient(circle at 30% 30%, rgba(220, 150, 255, 1), rgba(150, 0, 200, 0.5) 70%, rgba(40, 0, 40, 0.3));
  box-shadow: 
    0 0 15px rgba(200, 0, 255, 1), 
    0 0 30px rgba(180, 50, 255, 0.6), 
    inset 0 0 10px rgba(255, 255, 255, 0.3);
  transform: translateY(-2px) scale(1.02);
}

   document.addEventListener("DOMContentLoaded", function() {
     
     const bg = document.querySelector(".bg-inner");
const vw = window.innerWidth;
const vh = window.innerHeight;
const size = Math.ceil(Math.sqrt(vw*vw + vh*vh));

bg.style.width = size + "px";
bg.style.height = size + "px";
bg.style.top = vh/2 + "px";
bg.style.left = vw/2 + "px";
bg.style.transform = "translate(-50%, -50%)";

     
    gsap.to("#bg .bg-inner", {
  rotation: 360,
  duration: 120,
  repeat: -1,
  ease: "linear"
});


    
    const tlProfileBtn = gsap.timeline({ paused: true, reversed: true });

tlProfileBtn
  .to("#bar", {
    y: 0,
    duration: 1,
    ease: "power4.inOut"
  }).to("#bar .ani", {
  display:"block",
  margin:"auto"
}, 0).to("#bar .pfp", {
  width:"30vw",
  height:"30vw",
    duration: 0.3,
    ease: "power4.in"
}, "<").to("#bar .nickname", {
  fontSize:"8vw",
  duration: 0.3,
    ease: "power4.in"
}, "<")
  .to("#bar .tally", {
    opacity: 1,
  scale: 0.8,
    duration: 1
  }, "<")
  .to("#bar .tally p", {
  opacity: 1,
      y: 0,
  fontSize:"10vw",
  display:"block",
      scale: 1,
  duration: 0.3,
  stagger: 0.05,
    ease: "bounce.in"
}, "=-0.5")
  .to("#bottom_gradient", {
    height: "100vh",
    duration: 1,
  opacity: 1,
  zIndex: 6,
    ease: "power4.in"
  }, 0);

profileBtn.addEventListener("click", () => {
  if (tlProfileBtn.reversed()) {
    tlProfileBtn.timeScale(1.4).play();

    tlProfileBtn.timeScale(1.8).reverse();

});

     gsap.set(playNow, {
       opacity: 0,
       y: 30

     let startApp = false;

  introAni.to("#logo", {
    scale: 1.5,
    y: -40,
    duration: 1,
    delay: 0.6,

      opacity: 1,

    duration: 0.3,
    ease: "power1.in"

       zIndex: -10
     });
     
     document.addEventListener("click", () => {
       const startAni = gsap.timeline();
       
       if ( startApp === false ) {

       startAni.to(playNow, {
         opacity: 0,
         y: 60,
         onComplete: () => {
           playNow.remove;
         }

    scale: 0.7,
    top: 50,
    left: -10,
    right: "auto",
         y: 0,
    transformY: 0,
    duration: 1,
    ease: "power3.out"

    y:0,
    duration: 1,
    ease: "power3.out"

      opacity: 1,
    duration: 1,
    ease: "power3.out",

        scale:0.8
      });
         }
  }, "=-1").to("#menu button", {

    scale:1,

         stagger: 0.03,
    duration: 0.6,
    ease: "power3.out"

    x: 0,
    scale: 1,
    opacity: 1,
    duration: 0.3,
    ease: "power4.in"
  });
         }

    const difficultyBtn = document.querySelector("#difficulty-btn");

let tlDiffAni = gsap.timeline({ paused: true });

tlDiffAni.to("#menu .main button", {
  y: -50,
  opacity: 0,
  scale: 0.8,
  duration: 0.3,
  stagger: 0.03,
})
  .set("#menu .main", { display: "none" })
  .set("#menu .levels", { display: "block" })
  .set("#menu .levels button", { y: 50, opacity: 0, scale: 0.8 })
  .to("#menu .levels button", {
    y: 0,
    opacity: 1,
    scale: 1,
    duration: 0.3,
    stagger: 0.03
  });

difficultyBtn.addEventListener("click", () => {
  tlDiffAni.play();
});

document.querySelector("#menu .levels").addEventListener("click", (e) => {
  if (e.target.matches("button")) {
    tlDiffAni.reverse();
    
    difficultyDiv.textContent = e.target.textContent;
    
    if ( e.target.textContent === "Easy" ) {
      theTime = 30;
      allCheats.style.display = "inline-block";
    } else if ( e.target.textContent === "Normal" ) {
      theTime = 20;
      allCheats.style.display = "inline-block";
    } else if ( e.target.textContent === "Hard" ) {
      theTime = 10;
      allCheats.style.display = "inline-block";
      cheatBtn.style.display = "none";
      skipBtn.style.display = "none";
    } else {
      theTime = 5;
      allCheats.style.display = "none";
    }
  }
});

tlDiffAni.eventCallback("onReverseComplete", () => {
  
  setTimeout(function() {
    document.querySelector("#menu .levels").style.display = "none";
  }, 200);
  
  document.querySelector("#menu .main").style.display = "block";

  gsap.set("#menu .main button", { y: 0, opacity: 1, scale: 1 });
});


});

// ====== PARTICLES ======
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
let particles = [];
function drawParticles(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();
    p.x += p.dx;
    p.y += p.dy;
    p.life--;
    if(p.life <= 0) particles.splice(i,1);
  }
  requestAnimationFrame(drawParticles);
}
drawParticles();

function createFloatingWord(){

  el.className = "floating-word";
  el.textContent = word;
  el.style.left = Math.random()*100 + "%";
  el.style.top = "100vh";

  el.style.setProperty("--drift", drift + "px");

function spawnInputParticles(color){
  const rect = inputWord.getBoundingClientRect();
  const scaleX = canvas.width / window.innerWidth;
  const scaleY = canvas.height / window.innerHeight;
  const x = (rect.left + rect.width/2) * scaleX;
  const y = (rect.top + rect.height/2) * scaleY;
  for(let i=0;i<20;i++){
    particles.push({x,y,dx:(Math.random()-0.5)*6,dy:(Math.random()-0.5)*6,r:Math.random()*4+2,color,life:80});
  }
}

      timerFill.classList.add("warning");
      timerFill.classList.remove("danger");
    } else if(percent < 15){
      timerFill.classList.add("danger");
      timerFill.classList.remove("warning");
    }
    
    if(timeLeft <= 0){
      gameActive = false;
      inputWord.disabled = true;
      clearInterval(timer);
      gameOver();
    }
  },100);
}


function isValidWord(word) {
  const lowerWord = word.toLowerCase();

  const currentKey = Object.keys(wordBank).find(
    key => key.toLowerCase() === currentWord.toLowerCase()
  );

  if (!currentKey) return false;

  const validAnswers = wordBank[currentKey].map(w => w.toLowerCase());
  
  return validAnswers.includes(lowerWord);
}

function hasAvailableAnswers(promptWord) {
  const promptKey = Object.keys(wordBank).find(
    k => k.toLowerCase() === promptWord.toLowerCase()
  );
  
  if (!promptKey) return false;
  
  const answers = wordBank[promptKey];
  if (!answers || answers.length === 0) return false;
  
  const hasAvailable = answers.some(answer => {
    const answerLower = answer.toLowerCase();
    return !usedWords.has(answerLower);
  });
  
  return hasAvailable;
}
  
  
  let msgTl;

function msg(msg) {
  messageDiv.textContent = msg;
  
  if (msgTl) msgTl.kill();
  
  msgTl = gsap.timeline();
  msgTl.fromTo("#message", {
    y: -50,
    scale: 1,
    opacity: 1,
    zIndex: 10,
  }, {
    y: -100,
    scale: 0.8,
    opacity: 0,
    delay: 1,
    zIndex: -10,
    duration: 2,
    ease: "elastic.out"
  });
}



// Simplified submitWord
function submitWord(word) {
  if (!gameActive) return;
  word = word.trim();
  if (!word) return;
  const lowerWord = word.toLowerCase();
  
  if (usedWords.has(lowerWord) && resayBtnClicked === false) {
    inputWord.classList.add("wrong");
    wrongSound.play();
    spawnInputParticles("#f00");
    setTimeout(() => inputWord.classList.remove("wrong"), 400);
    msg("Word already used!");
    messageDiv.className = "error";
    return;
  }
  
  if (!isValidWord(word)) {
    inputWord.classList.add("wrong");
    wrongSound.play();
    spawnInputParticles("#f00");
    setTimeout(() => inputWord.classList.remove("wrong"), 400);
    comboMultiplier = 1;
    msg("Nope!");
    messageDiv.className = "error";
    return;
  }
  
  usedWords.add(lowerWord);
  
  streak++;
  if (streak > 0 && streak % 5 === 0) {
    comboMultiplier = Math.floor(streak / 5) + 1;
    difficulty = Math.floor(streak / 8) + 1;
    msg(`${streak}x COMBO! 🔥`);
    messageDiv.className = "combo";
    /*
    difficultyDiv.textContent = `Level ${difficulty}`;
    */
  } else {
    msg(`+${10 * streak * comboMultiplier} points!`);
    messageDiv.className = "success";
  }
  score += 10 * streak * comboMultiplier;
  updateScore();
  
  inputWord.classList.add("correct");
  correctSound.play();
  spawnInputParticles("#0f0");
  setTimeout(() => inputWord.classList.remove("correct"), 400);
  
  const nextKey = Object.keys(wordBank).find(k => k.toLowerCase() === lowerWord);
  let pool = [];

  if (nextKey) {
    const potentialNextWords = wordBank[nextKey];
    pool = potentialNextWords.filter(w => !usedPrompts.has(w.toLowerCase()));
    
    if (pool.length === 0) pool = potentialNextWords;
  }

  if (pool.length === 0) {
    const allKeys = Object.keys(wordBank);
    pool = allKeys.filter(k => !usedPrompts.has(k.toLowerCase()));
    
    if (pool.length === 0) pool = allKeys;
  }
  
  const computerPick = pool[Math.floor(Math.random() * pool.length)];
  const finalNextKey = Object.keys(wordBank).find(k => k.toLowerCase() === computerPick.toLowerCase()) || computerPick;

  currentWord = finalNextKey;
  usedPrompts.add(currentWord.toLowerCase());
  usedWords.add(currentWord.toLowerCase());
  currentWordDiv.textContent = currentWord;
  
  startTurn();
  
  inputWord.placeholder = "Type a related word";
}


function updateScore() {
  if (score > highScore) {
    highScore = score;
  }
  
  const currentLevel = difficultyDiv.textContent;
  
  const content = `<p>Score: ${score}</p> <p>Streak: ${streak}</p> <p>High: ${highScore}</p>`;

  const scoreDiv = document.getElementById("score");
  if (scoreDiv) {
    scoreDiv.innerHTML = content;
  }

  const scoresDiv = document.querySelector("#gameOver .scores");
  if (scoresDiv) {
    scoresDiv.innerHTML = content;
    scoresDiv.innerHTML += `<p>Level: ${currentLevel}</p>`;
  }
  
  gsap.set("#gameOver", {
    opacity: 0
  });
  
  const tl = gsap.timeline();
  tl.to("#bar .tally p:first-child", {
    scale: 1.4,
    duration: 0.5
  }).to("#bar .tally p:first-child", {
    scale: 1,
    duration: 0.2,
    delay: 0.6
  });
}

function showHint(){
  const validWords = Object.values(wordBank).flat().filter(w=>!usedWords.has(w.toLowerCase()));
  if(validWords.length > 0 && streak < 3){
    const hints = validWords.slice(0,3).join(", ");
    hintDiv.textContent = `Hint: ${hints}`;
  } else {
    hintDiv.textContent = "";
  }
}

function gameOver() {
  inputWord.value = "";
  
  gsap.set("#gameOver", {
    opacity: 1
  });
  
gsap.set(["#gameOver .gameOver-msg p", "#gameOver .scores p"], { 
  opacity: 0, 
  y: 50,
  scale: 0.8 
});

const tl = gsap.timeline();

  toolsAni.eventCallback("onComplete", () => {
  toolsAni.reverse();
});
  
tl.to("#game .ani", {
    y: -100,
    opacity: 0,
    stagger: 0.05,
    duration: 0.3,
    scale: 0.8,
    ease: "power4.out",
    onComplete: () => {
      gsap.set("#gameOver", { zIndex: 7 });
    }
  })
  .to("#gameOver .gameOver-msg p", {
    opacity: 1,
    y: 0,
    duration: 0.6,
    scale: 1,
    stagger:0.03,
    ease: "power4.out"
  })
  .to("#gameOver .gameOver-msg p", {
    opacity: 0,
    y: -100,
    scale: 0.8,
    stagger:0.03,
    duration: 0.6,
    delay: 3,
    ease: "power4.out",
  onComplete: () => {
    gsap.to("#bar .tally", {
    opacity: 0,
    duration: 0.2,
    y: -50,
      scale: 0.8,
    ease: "ease.in"
  });
  }
  })
  .to("#gameOver .scores p", {
    opacity: 1,
    y: 0,
    stagger:0.03,
    duration: 0.6,
    scale: 1,
    ease: "power4.out"
  })
  .to("#gameOver .scores p", {
    opacity: 0,
    y: -100,
    scale: 0.8,
    stagger:0.03,
    duration: 0.6,
    delay: 3,
    ease: "power4.out",
    onComplete: () => {
      gsap.set("#menu", { zIndex: 7 });
      gsap.set("#gameOver", { zIndex: -10 });
      
      gsap.to(["#bar .profile, #bar .profile .ani"], {
    opacity: 1,
    duration: 0.6,
    x: 0,
    stagger: 0.05,
    ease: "ease.in"
  });
      
      gsap.to("#bar .tally", {
    opacity: 1,
    duration: 0.6,
    y: 0,
      scale: 1,
    ease: "ease.in"
  });
    }
  })
  .to("#menu button", {
    y: 0,
    x: 0,
    color: "#fff",
  stagger: 0.03,
    opacity: 1,
    scale: 1,
    duration: 0.3,
    ease: "power4.in",
    onComplete: () => {
      gsap.to("#bar .tally", {
        scale: 0.8,
        rotation: 0 
      });
    }
  });
}
  
  const countdown = document.querySelector("#countdown");
    const toolsAni = gsap.timeline({ paused: true })
.fromTo("#tools", {
  height: 0,
  padding: 0,
  zIndex: -20
}, {
  height: "auto",
  padding: "20px 0px",
  duration: 0.3,
  ease: "power1.inOut",
  zIndex: 1,
  onStart() {
    gsap.set("#tools", { overflow: "hidden" });
  },
  onComplete() {
    gsap.set("#tools", { clearProps: "height,overflow" });
  }
})
.fromTo("#tools button", {
  y: 20,
  opacity: 0,
  scale: 0.8
}, {
  y: 0,
  opacity: 1,
  scale: 1,
  stagger: 0.05,
  duration: 0.4,
  ease: "power2.out"
});


function startCountdown() {
    gsap.set("#game .ani", {
      y: 50,
      opacity: 0,
      scale: 0.6
    });
  
  let count = 5;

  const tl = gsap.timeline({
    repeat: 4,
    onRepeat: () => {
      count--;
      countdown.textContent = count;
    },
    onStart: () => {
      countdown.textContent = count;
    },
    onComplete: () => {
    doAfterCountdown();
  }
  });

  tl.to(countdown, {
    scale: 1,
    zIndex: 7,
    opacity: 1,
    duration: 0.2,
    ease: "back.out(2)"
  })
  .to(countdown, {
    scale: 0,
    opacity: 0,
    duration: 0.2,
    zIndex: -10,
    delay: 0.5,
    ease: "power2.in"
  });
}
  
  function doAfterCountdown() {
    gsap.to("#game .ani", {
    y: 0,
    opacity: 1,
    stagger: 0.05,
    duration: 1,
    scale: 1,
    ease: "power4.out",
      onComplete: () => {
        
        if ( difficultyDiv.textContent === "Easy" || difficultyDiv.textContent === "Normal" || difficultyDiv.textContent === "Hard" ) {
        toolsAni.play();
        toolsAni.eventCallback("onComplete", () => {
        startTurn();
});
          } else {
            toolsAni.kill();
        startTurn();
          }
        
      }
  });
    
    gsap.to("#game", {
      opacity: 1,
      duration: 0
    });
  }


// ====== INPUT EVENTS ======
inputWord.addEventListener("input",(e)=>{
  const word = e.target.value.trim();
  if(word.length>0 && word[word.length-1]===" "){
    submitWord(word);
    e.target.value = "";
  }
});

  inputWord.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    submitWord(inputWord.value);
    inputWord.value = "";
  }
});
    
const allCheats = document.querySelector("#tools button");    
const pauseBtn = document.querySelector("#pause-btn");
const resayBtn = document.querySelector("#resay-btn");
const skipBtn = document.querySelector("#skip-btn");
    const cheatBtn = document.querySelector("#cheat-btn");
    const hintBtn = document.querySelector("#hint-btn");
    
    allCheats.addEventListener("click", () => {
  messageDiv.className = "";
      streak = 0;
      updateScore();
    });

pauseBtn.addEventListener("click", () => {
  if (pauseBtnClicked === false) {
  gsap.to(pauseBtn, { opacity: 0.5, duration: 0.4, ease: "power2.out" });
  pauseBtnClicked = true;
    clearInterval(timer);
    msg("Time has been paused!");
  timerFill.classList.add("pause");
  }
});

resayBtn.addEventListener("click", () => {
  if (resayBtnClicked === false) {
  gsap.to(resayBtn, { opacity: 0.5, duration: 0.4, ease: "power2.out" });
  resayBtnClicked = true;
    msg("You can now use a previous answer!");
  }
});
    
    skipBtn.addEventListener("click", () => {
  if (skipBtnClicked === false) {
  gsap.to(skipBtn, { opacity: 0.5, duration: 0.4, ease: "power2.out" });
  skipBtnClicked = true;
    msg("Skipped!");
    
    currentWord = getRandomWord();
currentWordDiv.textContent = currentWord;
usedPrompts.add(currentWord.toLowerCase());
    startTurn();
  }
});

cheatBtn.addEventListener("click", () => {
  if (cheatBtnClicked === false) {
    gsap.to(cheatBtn, { opacity: 0.5, duration: 0.4, ease: "power2.out" });
    cheatBtnClicked = true;

    const currentKey = currentWordDiv.textContent.trim();

    if (wordBank[currentKey]) {
      const options = wordBank[currentKey];
      const randomAnswer = options[Math.floor(Math.random() * options.length)];
      inputWord.value = randomAnswer;
      msg("Here's some help!");
    } else {
      msg("No answers found for this word.");
    }
  }
});
    
    hintBtn.addEventListener("click", () => {
  if (hintBtnClicked === false) {
    gsap.to(hintBtn, { opacity: 0.5, duration: 0.4, ease: "power2.out" });
    hintBtnClicked = true;

    const currentKey = document.getElementById("current-word").textContent.trim();
    const correctAnswers = wordBank[currentKey];

    if (correctAnswers) {
      const correctOne = correctAnswers[Math.floor(Math.random() * correctAnswers.length)];

      const allOtherWords = Object.keys(wordBank)
        .filter(key => key !== currentKey) 
        .flatMap(key => wordBank[key]);

      const wrongOnes = [];
      while (wrongOnes.length < 2) {
        const randomWrong = allOtherWords[Math.floor(Math.random() * allOtherWords.length)];
        if (!wrongOnes.includes(randomWrong) && !correctAnswers.includes(randomWrong)) {
          wrongOnes.push(randomWrong);
        }
      }

      const choices = [correctOne, ...wrongOnes].sort(() => Math.random() - 0.5);
      
      inputWord.value = "";
      inputWord.placeholder = `${choices[0]}, ${choices[1]}, or ${choices[2]}?`;
      
      msg("Look at the text box for a hint!");
    }
  }
});


restartBtn.addEventListener("click", () => {
  gsap.to(["#bar .profile, #bar .profile .ani"], {
    opacity: 0,
    duration: 0.6,
    x: 50,
    delay: 0.6,
    stagger: 0.05,
    ease: "ease.in"
  });
  
  streak = 0; 
  
  currentWord = getRandomWord();
  currentWordDiv.textContent = currentWord;
  score = 0;
  difficulty = 1;
  comboMultiplier = 1;
  
  usedWords.clear();
  usedPrompts.clear();
  usedPrompts.add(currentWord.toLowerCase());
  
  updateScore();
  
  gsap.set("#gameOver", {
      zIndex: -10
    });
    
    gsap.set(["#gameOver .gameOver-msg p, #gameOver .scores p"], {
      y: 100,
      opacity: 0,
      scale: 0.8
    });
  
  gsap.timeline().to("#restart", {
    color: "transparent",
    duration: 0.3,
    y: 100
  }).to("#menu button:not(#restart)", { 
        scale: 0,
    opacity:0,
    ease: "power1.in",
    duration: 0.3
        }, 0).to("#restart", {
    duration: 1,
    y: "100%",
    scale: 100,
    opacity: 0,
    ease: "power4.in",
    onComplete: () => {
      gsap.set("#restart", { scale: 1 });
      gsap.set("#menu", { zIndex: -10 });
      startCountdown();
    }
  }, "<");
});

currentWord = getRandomWord();
currentWordDiv.textContent = currentWord;
usedPrompts.add(currentWord.toLowerCase());
</script>
