  /* start Root */
:root {
  --gold: #c3ab69;
  --black: #121212;
  --white: #fff;
  --theme-color: #E02A49;
  --border-color: rgba(0, 0, 0, 0.2);
  --main-font: "Manrope", sans-serif;
  --savionce-font: "Special Gothic Expanded One", sans-serif;
  --info-font: "Doto", sans-serif;
}
  
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--main-font);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#0a0a1a 0%,#1a0a2e 50%,#0a0a1a 100%);color:#fff;padding:20px;overflow:hidden}
#game{text-align:center;max-width:500px;width:100%;position:relative;z-index:1}
#score{font-size:1.1rem;color:#fff;margin-bottom:5px;font-weight:600}
#difficulty{font-size:0.9rem;color:#0ff;margin-bottom:15px;text-shadow:0 0 10px #0ff}
#current-word{font-size:3.5rem;margin:30px 0;color:#0ff;text-transform:uppercase;text-shadow:0 0 15px #0ff,0 0 30px #0ff,0 0 45px #0ff;transition:transform 0.2s,color 0.3s;font-weight:bold;letter-spacing:2px; font-family:var(--info-font);}
#current-word.pulse{animation:pulse 0.3s ease}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
#input-word{font-size:1.3rem;padding:15px;width:100%;border-radius:12px;border:2px solid #333;outline:none;text-align:center;transition:all 0.2s;background:#1a1a2e;color:#fff;font-weight:500}
#input-word:focus{border-color:#0ff;box-shadow:0 0 20px rgba(0,255,255,0.3)}
#input-word.correct{border-color:#0f0;box-shadow:0 0 30px #0f0;animation:correctShake 0.4s}
#input-word.wrong{border-color:#f00;box-shadow:0 0 30px #f00;animation:wrongShake 0.4s}
@keyframes correctShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px) scale(1.02)}75%{transform:translateX(5px) scale(1.02)}}
@keyframes wrongShake{0%,100%{transform:translateX(0)}10%,30%,50%,70%,90%{transform:translateX(-8px)}20%,40%,60%,80%{transform:translateX(8px)}}
#timer-bar{height:12px;background:#1a1a2e;margin:15px 0;border-radius:6px;overflow:hidden;border:1px solid #333}
#timer-fill{width:100%;height:100%;background:linear-gradient(90deg,#0ff,#0af);transition:width 0.1s linear,background 0.3s;box-shadow:0 0 10px #0ff}
#timer-fill.warning{background:linear-gradient(90deg,#ff0,#fa0)}
#timer-fill.danger{background:linear-gradient(90deg,#f00,#a00)}
#hint{margin:15px 0;font-size:1rem;min-height:24px;color:#aaf;font-style:italic}
#message{margin:20px 0;font-size:1.3rem;min-height:30px;font-weight:600;text-shadow:0 0 10px currentColor}
#message.success{color:#0f0}
#message.error{color:#f55}
#message.combo{color:#ff0;font-size:1.5rem;animation:comboPopIn 0.5s}
@keyframes comboPopIn{0%{transform:scale(0) rotate(-10deg);opacity:0}50%{transform:scale(1.2) rotate(5deg)}100%{transform:scale(1) rotate(0);opacity:1}}
button{padding:12px 30px;font-size:1.1rem;cursor:pointer;border:none;border-radius:10px;background:linear-gradient(135deg,#0ff,#0af);color:#111;font-weight:bold;transition:all 0.2s;box-shadow:0 4px 15px rgba(0,255,255,0.4)}
button:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,255,255,0.6)}
button:active{transform:translateY(0)}
canvas{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
#floating-words{position:absolute;top:0;left:0;width:100%;height:100%;overflow:hidden;pointer-events:none;z-index:0}
.floating-word{position:absolute;font-size:2rem;font-weight:bold;opacity:0.12;color:#0ff;text-shadow:0 0 20px #0ff;pointer-events:none;white-space:nowrap}
.floating-letter{position:absolute;font-size:4rem;font-weight:900;opacity:0.08;color:#0af;text-shadow:0 0 30px #0af;pointer-events:none}
@keyframes floatUp{
  0%{transform:translateY(0) translateX(0);opacity:0}
  10%{opacity:0.15}
  90%{opacity:0.15}
  100%{transform:translateY(calc(-100vh - 100px)) translateX(var(--drift));opacity:0}
}
@keyframes floatUpRotate{
  0%{transform:translateY(0) rotate(0deg);opacity:0}
  10%{opacity:0.1}
  90%{opacity:0.1}
  100%{transform:translateY(calc(-100vh - 150px)) rotate(var(--rotation));opacity:0}
}

// ====== PARTICLES ======
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
let particles = [];
function drawParticles(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();
    p.x += p.dx;
    p.y += p.dy;
    p.life--;
    if(p.life <= 0) particles.splice(i,1);
  }
  requestAnimationFrame(drawParticles);
}
drawParticles();

function createFloatingWord(){
  const word = backgroundWords[Math.floor(Math.random()*backgroundWords.length)];
  const el = document.createElement("div");
  el.className = "floating-word";
  el.textContent = word;
  el.style.left = Math.random()*100 + "%";
  el.style.top = "100vh";
  
  const duration = 15 + Math.random()*10;
  const drift = (Math.random()-0.5)*200;
  
  el.style.setProperty("--drift", drift + "px");
  el.style.animation = `floatUp ${duration}s linear`;
  
  floatingContainer.appendChild(el);
  
  setTimeout(()=>el.remove(), duration*1000);
}

// ====== PARTICLE SPAWN FOR INPUT ======
function spawnInputParticles(color){
  const rect = inputWord.getBoundingClientRect();
  const scaleX = canvas.width / window.innerWidth;
  const scaleY = canvas.height / window.innerHeight;
  const x = (rect.left + rect.width/2) * scaleX;
  const y = (rect.top + rect.height/2) * scaleY;
  for(let i=0;i<20;i++){
    particles.push({x,y,dx:(Math.random()-0.5)*6,dy:(Math.random()-0.5)*6,r:Math.random()*4+2,color,life:80});
  }
}

// ====== GAME FUNCTIONS ======
function getRandomWord(){
  const keys = Object.keys(wordBank);
  return keys[Math.floor(Math.random()*keys.length)];
}

function startTurn(){
  const totalTime = Math.max(4, baseTime - difficulty * 0.3);
  timeLeft = totalTime;
  timerFill.style.width = "100%";
  timerFill.classList.remove("warning","danger");
  messageDiv.textContent = "";
  messageDiv.className = "";
  inputWord.value = "";
  inputWord.focus();
  gameActive = true;
  inputWord.disabled = false;
  currentWordDiv.classList.add("pulse");
  setTimeout(()=>currentWordDiv.classList.remove("pulse"),300);

  showHint();

  clearInterval(timer);
  timer = setInterval(()=>{
    timeLeft -= 0.1;
    if(timeLeft<0) timeLeft=0;
    const percent = (timeLeft/totalTime)*100;
    timerFill.style.width = `${percent}%`;
    
    if(percent < 30 && percent >= 15){
      timerFill.classList.add("warning");
      timerFill.classList.remove("danger");
    } else if(percent < 15){
      timerFill.classList.add("danger");
      timerFill.classList.remove("warning");
    }
    
    if(timeLeft <= 0){
      gameActive = false;
      inputWord.disabled = true;
      clearInterval(timer);
      gameOver();
    }
  },100);
}


// Update the isValidWord function
// Simple isValidWord - no suffix matching yet
function isValidWord(word) {
  const lowerWord = word.toLowerCase();

  const currentKey = Object.keys(wordBank).find(
    key => key.toLowerCase() === currentWord.toLowerCase()
  );

  if (!currentKey) return false;

  const validAnswers = wordBank[currentKey].map(w => w.toLowerCase());
  
  return validAnswers.includes(lowerWord);
}

// Simple hasAvailableAnswers - no suffix matching yet
function hasAvailableAnswers(promptWord) {
  const promptKey = Object.keys(wordBank).find(
    k => k.toLowerCase() === promptWord.toLowerCase()
  );
  
  if (!promptKey) return false;
  
  const answers = wordBank[promptKey];
  if (!answers || answers.length === 0) return false;
  
  const hasAvailable = answers.some(answer => {
    const answerLower = answer.toLowerCase();
    return !usedWords.has(answerLower);
  });
  
  return hasAvailable;
}

// Simplified submitWord
// Updated submitWord Fix
function submitWord(word) {
  if (!gameActive) return;
  word = word.trim();
  if (!word) return;
  const lowerWord = word.toLowerCase();
  
  // 1. Check if already used
  if (usedWords.has(lowerWord)) {
    inputWord.classList.add("wrong");
    wrongSound.play();
    spawnInputParticles("#f00");
    setTimeout(() => inputWord.classList.remove("wrong"), 400);
    messageDiv.textContent = "Word already used!";
    messageDiv.className = "error";
    return;
  }
  
  // 2. Check if valid connection to the current prompt
  if (!isValidWord(word)) {
    inputWord.classList.add("wrong");
    wrongSound.play();
    spawnInputParticles("#f00");
    setTimeout(() => inputWord.classList.remove("wrong"), 400);
    comboMultiplier = 1;
    messageDiv.textContent = "Invalid connection!";
    messageDiv.className = "error";
    return;
  }
  
  // SUCCESS - Mark word as used
  usedWords.add(lowerWord);
  
  // Scoring Logic
  streak++;
  if (streak > 0 && streak % 5 === 0) {
    comboMultiplier = Math.floor(streak / 5) + 1;
    difficulty = Math.floor(streak / 8) + 1;
    messageDiv.textContent = `${streak}x COMBO! 🔥`;
    messageDiv.className = "combo";
    difficultyDiv.textContent = `Level ${difficulty}`;
  } else {
    messageDiv.textContent = `+${10 * streak * comboMultiplier} points!`;
    messageDiv.className = "success";
  }
  score += 10 * streak * comboMultiplier;
  updateScore();
  
  inputWord.classList.add("correct");
  correctSound.play();
  spawnInputParticles("#0f0");
  setTimeout(() => inputWord.classList.remove("correct"), 400);
  
  // 3. Find next word logic
  const nextKey = Object.keys(wordBank).find(k => k.toLowerCase() === lowerWord);
  let pool = [];

  if (nextKey) {
    // If the word IS a key, try to find a sub-word that hasn't been used as a prompt yet
    const potentialNextWords = wordBank[nextKey];
    pool = potentialNextWords.filter(w => !usedPrompts.has(w.toLowerCase()));
    
    // Fallback: If all sub-words were prompts, just use any valid sub-word
    if (pool.length === 0) pool = potentialNextWords;
  }

  // 4. CRITICAL FIX: If the submitted word wasn't a key OR the pool is empty, 
  // don't end the game. Pick a fresh random word from the bank to keep the chain moving.
  if (pool.length === 0) {
    const allKeys = Object.keys(wordBank);
    pool = allKeys.filter(k => !usedPrompts.has(k.toLowerCase()));
    
    // Absolute fallback: pick any key if everything has been used
    if (pool.length === 0) pool = allKeys;
  }
  
  // Pick the next prompt
  const computerPick = pool[Math.floor(Math.random() * pool.length)];
  const finalNextKey = Object.keys(wordBank).find(k => k.toLowerCase() === computerPick.toLowerCase()) || computerPick;

  currentWord = finalNextKey;
  usedPrompts.add(currentWord.toLowerCase());
  usedWords.add(currentWord.toLowerCase());
  currentWordDiv.textContent = currentWord;
  
  startTurn();
}


function updateScore() {
  // Only update highScore if current score is higher
  if (score > highScore) {
    highScore = score;
  }
  
  // We use a separate variable for "Best Streak" if you want to track that specifically
  // For now, this keeps your UI consistent
  // 2. Define the HTML content once
  const content = `<p>Score: ${score}</p> <p>Streak: ${streak}</p> <p>High: ${highScore}</p>`;

  // 3. Update the ID display (The one in the bar)
  const scoreDiv = document.getElementById("score");
  if (scoreDiv) {
    scoreDiv.innerHTML = content;
  }

  // 4. Update the Class display (The second one)
  const scoresDiv = document.querySelector("#gameOver .scores");
  if (scoresDiv) {
    scoresDiv.innerHTML = content;
  }
  
  const tl = gsap.timeline();
  tl.to("#bar .tally p:first-child", {
    scale: 1.4,
    duration: 0.5
  }).to("#bar .tally p:first-child", {
    scale: 1,
    duration: 0.2,
    delay: 0.6
  });
}

function showHint(){
  const validWords = Object.values(wordBank).flat().filter(w=>!usedWords.has(w.toLowerCase()));
  if(validWords.length > 0 && streak < 3){
    const hints = validWords.slice(0,3).join(", ");
    hintDiv.textContent = `Hint: ${hints}`;
  } else {
    hintDiv.textContent = "";
  }
}

  const countdown = document.querySelector("#countdown");

function startCountdown() {
  let count = 5;

  const tl = gsap.timeline({
    repeat: 4, // runs 5 times total
    onRepeat: () => {
      count--;
      countdown.textContent = count;
    },
    onStart: () => {
      countdown.textContent = count;
    },
    onComplete: () => {
    doAfterCountdown();
  }
  });

  tl.to(countdown, {
    scale: 1,
    opacity: 1,
    duration: 0.2,
    ease: "back.out(2)"
  })
  .to(countdown, {
    scale: 0,
    opacity: 0,
    duration: 0.2,
    zIndex: -10,
    delay: 0.5,
    ease: "power2.in"
  });
}
  
  function doAfterCountdown() {
    
    gsap.to("#game .ani", {
    y: 0,
    opacity: 1,
    stagger: 0.05,
    duration: 1,
    scale: 1,
    ease: "power4.out",
      onComplete: () => {
        startTurn();
      }
  });
    
    gsap.to("#game", {
      opacity: 1,
      duration: 1,
      ease: "ease.in"
    });
  }

});
