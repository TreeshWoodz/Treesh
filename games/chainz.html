// ====== PARTICLES ======
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
let particles = [];
function drawParticles(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();
    p.x += p.dx;
    p.y += p.dy;
    p.life--;
    if(p.life <= 0) particles.splice(i,1);
  }
  requestAnimationFrame(drawParticles);
}
drawParticles();

  el.className = "floating-word";
  el.textContent = word;
  el.style.left = Math.random()*100 + "%";
  el.style.top = "100vh";
  
  const duration = 15 + Math.random()*10;
  const drift = (Math.random()-0.5)*200;
  
  el.style.setProperty("--drift", drift + "px");
  el.style.animation = `floatUp ${duration}s linear`;
  
  floatingContainer.appendChild(el);
  
  setTimeout(()=>el.remove(), duration*1000);
}

function createFloatingLetter(){
  const letter = backgroundLetters[Math.floor(Math.random()*backgroundLetters.length)];
  const el = document.createElement("div");
  el.className = "floating-letter";
  el.textContent = letter;
  el.style.left = Math.random()*100 + "%";
  el.style.top = "100vh";
  
  const duration = 20 + Math.random()*15;
  const rotation = (Math.random()-0.5)*720;
  
  el.style.setProperty("--rotation", rotation + "deg");
  el.style.animation = `floatUpRotate ${duration}s linear`;
  
  floatingContainer.appendChild(el);
  
  setTimeout(()=>el.remove(), duration*1000);
}

// Create initial floating elements
for(let i=0;i<8;i++){
  setTimeout(()=>createFloatingWord(), i*1500);
  setTimeout(()=>createFloatingLetter(), i*2500);
}

// Continuously spawn new elements
setInterval(createFloatingWord, 6000);
setInterval(createFloatingLetter, 9000);

window.addEventListener("resize",()=>{
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
});

// ====== PARTICLE SPAWN FOR INPUT ======
function spawnInputParticles(color){
  const rect = inputWord.getBoundingClientRect();
  const scaleX = canvas.width / window.innerWidth;
  const scaleY = canvas.height / window.innerHeight;
  const x = (rect.left + rect.width/2) * scaleX;
  const y = (rect.top + rect.height/2) * scaleY;
  for(let i=0;i<20;i++){
    particles.push({x,y,dx:(Math.random()-0.5)*6,dy:(Math.random()-0.5)*6,r:Math.random()*4+2,color,life:80});
  }
}

// ====== GAME FUNCTIONS ======
function getRandomWord(){
  const keys = Object.keys(wordBank);
  return keys[Math.floor(Math.random()*keys.length)];
}

function startTurn(){
  const totalTime = Math.max(4, baseTime - difficulty * 0.3);
  timeLeft = totalTime;
  timerFill.style.width = "100%";
  timerFill.classList.remove("warning","danger");
  messageDiv.textContent = "";
  messageDiv.className = "";
  inputWord.value = "";
  inputWord.focus();
  gameActive = true;
  inputWord.disabled = false;
  currentWordDiv.classList.add("pulse");
  setTimeout(()=>currentWordDiv.classList.remove("pulse"),300);

  showHint();

  clearInterval(timer);
  timer = setInterval(()=>{
    timeLeft -= 0.1;
    if(timeLeft<0) timeLeft=0;
    const percent = (timeLeft/totalTime)*100;
    timerFill.style.width = `${percent}%`;
    
    if(percent < 30 && percent >= 15){
      timerFill.classList.add("warning");
      timerFill.classList.remove("danger");
    } else if(percent < 15){
      timerFill.classList.add("danger");
      timerFill.classList.remove("warning");
    }
    
    if(timeLeft <= 0){
      gameActive = false;
      inputWord.disabled = true;
      clearInterval(timer);
      gameOver("Time's up. You're eliminated!");
    }
  },100);
}

// ====== ALLOW ANY WORD FROM BANK ======
function isValidWord(word){
  const lowerWord = word.toLowerCase();
  const allWords = Object.values(wordBank).flat().map(w=>w.toLowerCase());
  return allWords.includes(lowerWord) && !usedWords.has(lowerWord);
}

function submitWord(word){
  if(!gameActive) return;
  word = word.trim();
  if(!word) return;
  const lowerWord = word.toLowerCase();
  if(!isValidWord(word)){
    inputWord.classList.add("wrong");
    wrongSound.play();
    spawnInputParticles("#f00");
    setTimeout(()=>inputWord.classList.remove("wrong"),400);
    streak = 0;
    comboMultiplier = 1;
    updateScore();
    
    const tl = gsap.timeline();
tl.to("#message", { opacity: 1, scale: 1, y:0, zIndex: 7, duration: 0.3, ease: "power4.in" }).to("#message", {
  y: -100,
  opacity:0,
  duration: 2,
  onComplete: () => {
    gsap.set("#message", {
  opacity: 0,
  y: 0,
  zIndex: -10
});
  }
});

    
    messageDiv.textContent = "Not valid! Try again";
    messageDiv.className = "error";
    return;
  }
  usedWords.add(lowerWord);
  currentWord = word;
  currentWordDiv.textContent = currentWord;
  streak++;
  
  if(streak > 0 && streak % 5 === 0){
    comboMultiplier = Math.floor(streak / 5) + 1;
    difficulty = Math.floor(streak / 8) + 1;
    messageDiv.textContent = `${streak}x COMBO! 🔥`;
    messageDiv.className = "combo";
    difficultyDiv.textContent = `Level ${difficulty}`;
  } else {
    messageDiv.textContent = `+${10*streak*comboMultiplier} points!`;
    messageDiv.className = "success";
  }
  
  score += 10 * streak * comboMultiplier;
  updateScore();
  inputWord.classList.add("correct");
  correctSound.play();
  spawnInputParticles("#0f0");
  setTimeout(()=>inputWord.classList.remove("correct"),400);
  startTurn();
}


function updateScore(){
  if(score > highScore) highScore = score;
  scoreDiv.innerHTML  = `<p>Score: ${score}</p> <p>Streak: ${streak}</p> <p>High: ${highScore}</p>`;
  
  const tl = gsap.timeline();
tl.to("#bar .tally p:first-child", {
  scale: 1.4,
  duration: 0.5
})
.to("#bar .tally p:first-child", {
  scale: 1,
  duration: 0.2,
  delay: 0.6
});

}

function showHint(){
  const validWords = Object.values(wordBank).flat().filter(w=>!usedWords.has(w.toLowerCase()));
  if(validWords.length > 0 && streak < 3){
    const hints = validWords.slice(0,3).join(", ");
    hintDiv.textContent = `Hint: ${hints}`;
  } else {
    hintDiv.textContent = "";
  }
}

function gameOver(msg){
  messageDiv.innerHTML = `${msg} <p class="final_score">Final Score: <span>${score}</span></p>`;
  messageDiv.className = "error";
  
  gsap.set("#message", {
    y: 100
  });
  
  const tl = gsap.timeline();
  
  tl.to("#game .ani", {
    y: -100,
    opacity: 0,
    stagger: 0.05,
    duration: 0.3,
    scale: 0.8,
    ease: "power4.out"
  }).to("#message", {
    opacity: 1,
    y: 0,
    duration: 0.6,
    scale:1,
    zIndex: 7,
    ease: "power4.out",
    onComplete: () => {
      gsap.to("#bar .tally", {
        scale: 1.2,
        rotation: "-5deg"
      });
    }
  }).to("#message", {
    opacity: 0,
    y: -100,
    scale: 0.8,
    zIndex: -10,
    duration: 0.6,
    delay: 3,
    ease: "power4.out",
    onComplete: () => {
      gsap.set("#menu", {
        zIndex: 7
      });
    }
  }).to("#restart", {
    y:0,
    x:0,
    color: "#000",
    opacity:1,
    scale:1,
    duration: 0.3,
    zIndex: 7,
    ease: "power4.in",
    onComplete: () => {
      gsap.to("#bar .tally", {
        scale: 1,
        rotation: "0deg"
      });
    }
  });
}
  
  const countdown = document.querySelector("#countdown");

function startCountdown() {
  let count = 5;

  const tl = gsap.timeline({
    repeat: 4, // runs 5 times total
    onRepeat: () => {
      count--;
      countdown.textContent = count;
    },
    onStart: () => {
      countdown.textContent = count;
    },
    onComplete: () => {
    doAfterCountdown();
  }
  });

  tl.to(countdown, {
    scale: 1,
    opacity: 1,
    duration: 0.5,
    ease: "back.out(2)"
  })
  .to(countdown, {
    scale: 0,
    opacity: 0,
    duration: 0.5,
    zIndex: -10,
    delay: 0.5,
    ease: "power2.in"
  });
}
  
  function doAfterCountdown() {
    
    gsap.to("#game .ani", {
    y: 0,
    opacity: 1,
    stagger: 0.05,
    duration: 1,
    scale: 1,
    ease: "power4.out",
      onComplete: () => {
        startTurn();
      }
  });
    
    gsap.to("#game", {
      opacity: 1,
      duration: 1,
      ease: "ease.in"
    });
  }


// ====== INPUT EVENTS ======
inputWord.addEventListener("input",(e)=>{
  const word = e.target.value.trim();
  if(word.length>0 && word[word.length-1]===" "){
    submitWord(word);
    e.target.value = "";
  }
});

  inputWord.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    submitWord(inputWord.value);
    inputWord.value = "";
  }
});


restartBtn.addEventListener("click",()=>{
  currentWord = getRandomWord();
  currentWordDiv.textContent = currentWord;
  score = 0;
  streak = 0;
  difficulty = 1;
  comboMultiplier = 1;
  usedWords.clear();
  updateScore();
  difficultyDiv.textContent = "Level 1";
  
  gsap.timeline().to("#restart", {
    color: "transparent",
    duration: 0.3,
  }).to("#restart", {
    duration: 2,
    y: "100%",
    scale: 100,
    opacity: 0,
    zIndex: -10,
    ease: "power4.in",
    onComplete: () => {
      gsap.set("#restart", {
        scale: 1
      });
      
      gsap.set("#menu", {
        zIndex: -10
      });
    }
  }, "<").to("#status #difficulty", {
      x: 0,
      scale: 1,
      opacity: 1,
    duration: 0.3,
    ease: "power4.in",
    onComplete: () => {
      startCountdown();
    }
    });
});

// ====== INITIAL START ======
currentWord = getRandomWord();
currentWordDiv.textContent = currentWord;
</script>
</body>
