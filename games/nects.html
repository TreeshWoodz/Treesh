  /* start Root */
:root {
  --gold: #ffd700;
  --black: #0a0a1a;
  --white: #fff;
  --theme-color: #E02A49;
  --border-color: rgba(255, 255, 255, 0.3);
  --main-font: "Exo 2", sans-serif;
  --title-font: "Righteous", sans-serif;
  --info-font: "Orbitron", sans-serif;
  --neon-green: #00ff88;
  --neon-pink: #ff00ff;
  --neon-cyan: #00ffff;
  --neon-blue: #0099ff;
  --neon-orange: #ff6b35;
  --neon-purple: #b24bf3;
  --deep-space: #0a0a1a;
  --purple-space: #1a0a2e;
  --cosmic-purple: #6b3fa0;
  --cosmic-blue: #1e3a8a;
}
  
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

@keyframes floatCrystal {
  0%, 100% { transform: translateY(0px) rotate(0deg); }
  50% { transform: translateY(-20px) rotate(5deg); }
}

@keyframes twinkle {
  0%, 100% { opacity: 0.3; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.2); }
}

@keyframes pulse {
  0%, 100% { opacity: 0.6; }
  50% { opacity: 1; }
}

@keyframes shimmer {
  0% { background-position: -1000px 0; }
  100% { background-position: 1000px 0; }
}

@keyframes shootingStar {
  0% { transform: translateX(-100px) translateY(-100px); opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { transform: translateX(1000px) translateY(1000px); opacity: 0; }
}

@keyframes rainbowGlow {
  0% { filter: hue-rotate(0deg); }
  100% { filter: hue-rotate(360deg); }
}
  
body{
  font-family: var(--main-font);
  z-index: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  background: radial-gradient(ellipse at center, #1a0a2e 0%, #0a0a1a 100%);
  background-attachment: fixed;
  color: #fff;
  padding: 20px;
  overflow: hidden;
  position: relative;
}

body::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-image: 
    radial-gradient(2px 2px at 20% 30%, white, transparent),
    radial-gradient(2px 2px at 60% 70%, white, transparent),
    radial-gradient(1px 1px at 50% 50%, white, transparent),
    radial-gradient(1px 1px at 80% 10%, white, transparent),
    radial-gradient(2px 2px at 90% 60%, white, transparent),
    radial-gradient(1px 1px at 33% 50%, white, transparent),
    radial-gradient(1px 1px at 66% 25%, white, transparent);
  background-size: 200% 200%, 250% 250%, 300% 300%, 350% 350%, 180% 180%, 220% 220%, 280% 280%;
  background-position: 0% 0%, 50% 50%, 100% 0%, 0% 100%, 50% 0%, 100% 100%, 25% 75%;
  animation: twinkle 3s ease-in-out infinite;
  pointer-events: none;
  z-index: 1;
}

body::after {
  content: '';
  position: absolute;
  width: 2px;
  height: 2px;
  background: linear-gradient(90deg, transparent, white, transparent);
  box-shadow: 0 0 10px white;
  animation: shootingStar 3s linear infinite;
  top: 10%;
  left: -100px;
  pointer-events: none;
  z-index: 2;
}

/* Cosmic Decorations */
.cosmic-decoration {
  position: absolute;
  pointer-events: none;
  z-index: 2;
}

.crystal {
  width: 60px;
  height: 80px;
  background: linear-gradient(135deg, rgba(0, 255, 255, 0.6), rgba(180, 79, 243, 0.6));
  clip-path: polygon(50% 0%, 100% 35%, 80% 100%, 20% 100%, 0% 35%);
  filter: drop-shadow(0 0 20px rgba(0, 255, 255, 0.8));
  animation: floatCrystal 4s ease-in-out infinite;
  opacity: 0.8;
}

.crystal-left {
  top: 15%;
  left: 5%;
  animation-delay: 0s;
}

.crystal-right {
  top: 20%;
  right: 8%;
  animation-delay: 1.5s;
  transform: rotate(180deg);
}

.crystal-bottom-left {
  bottom: 15%;
  left: 8%;
  animation-delay: 0.8s;
  width: 50px;
  height: 70px;
}

.crystal-bottom-right {
  bottom: 20%;
  right: 5%;
  animation-delay: 2s;
  width: 55px;
  height: 75px;
  transform: rotate(45deg);
}

/* Title Section */
.game-title {
  font-family: var(--title-font);
  font-size: clamp(3rem, 10vw, 6rem);
  text-align: center;
  margin-bottom: 30px;
  background: linear-gradient(135deg, #ffffff, #00ffff, #ff00ff, #ffd700);
  background-size: 300% 300%;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.5));
  animation: rainbowGlow 3s linear infinite;
  position: relative;
  z-index: 10;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

.game-title::before {
  content: '⭐';
  position: absolute;
  top: -20px;
  right: -20px;
  font-size: 2rem;
  animation: pulse 2s ease-in-out infinite;
}

 #game {
  width: 100%;
  max-width: 500px;
  aspect-ratio: 1 / 1;
  background: linear-gradient(135deg, rgba(26, 10, 46, 0.95), rgba(10, 10, 26, 0.95));
  border-radius: 30px;
  overflow: hidden;
  display: flex;
  padding: 15px;
  justify-content: center;
  align-items: center;
  position: relative;
  z-index: 10;
  box-shadow: 
    0 0 60px rgba(180, 79, 243, 0.6),
    0 0 100px rgba(0, 255, 255, 0.4),
    inset 0 0 80px rgba(255, 255, 255, 0.05);
  border: 3px solid transparent;
  background-clip: padding-box;
}

#game::before {
  content: '';
  position: absolute;
  top: -3px;
  left: -3px;
  right: -3px;
  bottom: -3px;
  background: linear-gradient(45deg, 
    #ff00ff, 
    #00ffff, 
    #ffd700, 
    #ff6b35, 
    #00ff88,
    #ff00ff
  );
  background-size: 400% 400%;
  border-radius: 30px;
  z-index: -1;
  animation: rainbowGlow 3s linear infinite;
  filter: blur(2px);
}

#game::after {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: 
    radial-gradient(circle at 20% 30%, rgba(180, 79, 243, 0.3) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(0, 255, 255, 0.3) 0%, transparent 50%),
    radial-gradient(circle at 50% 50%, rgba(255, 215, 0, 0.2) 0%, transparent 60%);
  pointer-events: none;
  border-radius: 30px;
}

#game .play_container {
  width: 100%;
  height: 100%;
  display: flex;
  padding: 0;
  z-index: 2;
  position: relative;
}

#game .play_container div {
  background: linear-gradient(135deg, rgba(30, 58, 138, 0.6), rgba(107, 63, 160, 0.6));
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10vw;
  cursor: pointer;
  position: relative;
  transition: all 0.3s ease;
  border: 2px solid rgba(255, 255, 255, 0.2);
  box-shadow: 
    0 4px 15px rgba(0, 0, 0, 0.3),
    inset 0 0 20px rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(10px);
}

#game .play_container div::before {
  content: '';
  position: absolute;
  top: 5%;
  left: 5%;
  right: 5%;
  bottom: 5%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), transparent);
  border-radius: 15px;
  pointer-events: none;
}

#game .play_container div:hover {
  transform: scale(1.05) translateY(-3px);
  box-shadow: 
    0 8px 25px rgba(180, 79, 243, 0.6),
    inset 0 0 30px rgba(255, 255, 255, 0.2);
  border-color: rgba(255, 255, 255, 0.4);
}

#game .play_container div.selected {
  background: linear-gradient(135deg, rgba(255, 215, 0, 0.9), rgba(255, 107, 53, 0.9));
  box-shadow: 
    0 0 40px rgba(255, 215, 0, 0.8),
    0 0 60px rgba(255, 107, 53, 0.6),
    inset 0 0 30px rgba(255, 255, 255, 0.3);
  border-color: rgba(255, 215, 0, 0.8);
  animation: pulse 1s ease-in-out infinite;
}

#game .play_container div.winning {
  animation: pulse 0.6s ease-in-out infinite, shimmer 2s linear infinite;
  background: linear-gradient(
    90deg,
    rgba(255, 215, 0, 0.9) 0%,
    rgba(255, 255, 255, 1) 50%,
    rgba(255, 215, 0, 0.9) 100%
  );
  background-size: 200% 100%;
}

/* Win State Overlay */
.win-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.8);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 1000;
  animation: fadeIn 0.5s ease;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.win-message {
  background: linear-gradient(135deg, rgba(180, 79, 243, 0.95), rgba(255, 107, 53, 0.95));
  padding: 40px 60px;
  border-radius: 30px;
  text-align: center;
  font-family: var(--title-font);
  font-size: 3rem;
  color: white;
  box-shadow: 
    0 0 60px rgba(255, 215, 0, 0.8),
    0 0 100px rgba(180, 79, 243, 0.6);
  border: 3px solid rgba(255, 215, 0, 0.6);
  animation: pulse 1s ease-in-out infinite;
}

/* Responsive adjustments */
@media (max-width: 600px) {
  .crystal {
    width: 40px;
    height: 60px;
  }
  
  .game-title {
    font-size: 2.5rem;
    margin-bottom: 20px;
  }
  
  #game {
    max-width: 90vw;
    padding: 10px;
  }
}
  
</style>

       function updateLayout() {
         // Force a reflow to get accurate dimensions
         const containerWidth = $playContainer.width();
         const containerHeight = $playContainer.height();
         
         if (containerWidth === 0 || containerHeight === 0) return;
         
         let squareSize;
         if (singleRow) {
           const totalGapWidth = (cols - 1) * gap;
           const availableWidth = containerWidth - totalGapWidth;
           const maxWidthPerSquare = availableWidth / cols;
           
           squareSize = Math.min(containerHeight, maxWidthPerSquare);
         } else {
           const totalGapWidth = (cols - 1) * gap;
           const totalGapHeight = (rows - 1) * gap;

           const availableHeight = containerHeight - totalGapHeight;
           
           const maxWidthPerSquare = availableWidth / cols;
           const maxHeightPerSquare = availableHeight / rows;
           
           squareSize = Math.min(maxWidthPerSquare, maxHeightPerSquare);

         squareSize = Math.floor(squareSize);

function getRandomEmoji() {
  const allEmojis = emojis.flatMap(group => group.emojis);
  const randomIndex = Math.floor(Math.random() * allEmojis.length);
  return allEmojis[randomIndex];
}

function getRandomEmojiFromCategory(categoryName) {
  const category = emojis.find(group => group.category === categoryName);
  if (!category) return "❓";
  
  const randomIndex = Math.floor(Math.random() * category.emojis.length);
  return category.emojis[randomIndex];
}

function getRandomEmojis(count, categoryName = null) {
  const result = [];
  for (let i = 0; i < count; i++) {
    if (categoryName) {
      result.push(getRandomEmojiFromCategory(categoryName));
    } else {
      result.push(getRandomEmoji());
    }
  }
  return result;
}

function getUniqueRandomEmojis(count, categoryName = null) {
  let availableEmojis;
  
  if (categoryName) {
    const category = emojis.find(group => group.category === categoryName);
    availableEmojis = category ? [...category.emojis] : [];
  } else {
    availableEmojis = emojis.flatMap(group => group.emojis);
  }
  
  const shuffled = availableEmojis.sort(() => Math.random() - 0.5);
  return shuffled.slice(0, count);
}

}

function coordsToIndex(row, col) {
  return row * cols + col;
}

function checkWin() {
  const winLength = Math.min(rows, cols);
  
  if (rows === 1) {
    return gameBoard.every(selected => selected === true);
  }
  
  for (let row = 0; row < rows; row++) {
    for (let col = 0; col <= cols - winLength; col++) {
      let win = true;
      for (let i = 0; i < winLength; i++) {
        if (!gameBoard[coordsToIndex(row, col + i)]) {
          win = false;
          break;
        }
      }
      if (win) return true;
    }
  }
  
  for (let col = 0; col < cols; col++) {
    for (let row = 0; row <= rows - winLength; row++) {
      let win = true;
      for (let i = 0; i < winLength; i++) {
        if (!gameBoard[coordsToIndex(row + i, col)]) {
          win = false;
          break;
        }
      }
      if (win) return true;
    }
  }
  
  for (let row = 0; row <= rows - winLength; row++) {
    for (let col = 0; col <= cols - winLength; col++) {
      let win = true;
      for (let i = 0; i < winLength; i++) {
        if (!gameBoard[coordsToIndex(row + i, col + i)]) {
          win = false;
          break;
        }
      }
      if (win) return true;
    }
  }
  
  for (let row = 0; row <= rows - winLength; row++) {
    for (let col = winLength - 1; col < cols; col++) {
      let win = true;
      for (let i = 0; i < winLength; i++) {
        if (!gameBoard[coordsToIndex(row + i, col - i)]) {
          win = false;
          break;
        }
      }
      if (win) return true;
    }
  }
  
  return false;
}

initGameBoard();

$.each(squares, function(index, $square) {
  $square.html(gameEmojis[index]);
  
  $square.on("click", function() {
    if (gameBoard[index]) {
      return; 
    }
    
    gameBoard[index] = true;
    $square.addClass('selected');
    
    gsap.to($square[0], {
      scale: 1.1,
      duration: 0.2,
      ease: "back.out(1.7)",
      onComplete: function() {
        gsap.to($square[0], {
          scale: 1,
          duration: 0.2
        });
      }
    });
    
    if (checkWin()) {
      setTimeout(function() {
        // Add winning class to all selected squares
        $.each(squares, function(i, sq) {
          if (gameBoard[i]) {
            $(sq).addClass('winning');
          }
        });
        
        // Show win overlay
        $winOverlay.css('display', 'flex');
        
        // Reset after 3 seconds
        setTimeout(function() {
          $winOverlay.css('display', 'none');
          initGameBoard();
          $.each(squares, function(i, sq) {
            $(sq).removeClass('selected winning');
          });
        }, 3000);
      }, 400);
    }
  });
});
      
      
     });
</script>
