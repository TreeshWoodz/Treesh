<!DOCTYPE html>
<html lang="en"> 
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
<title>FREA — Arena Slingshot Jump</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#070313;--card:rgba(18,12,45,0.6);--glass:rgba(255,255,255,0.06);--accent:#4deeea;--accent2:#ff60b5;--gold:#ffe600}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:linear-gradient(180deg,#050210 0%, #0b0520 60%);font-family:'Fredoka', 'Outfit', sans-serif;color:#fff;overflow:hidden}
canvas{position:fixed;left:0;top:0;width:100%;height:100%;z-index:1;display:block}
/* Simple top HUD */
#hud{position:fixed;left:50%;top:18px;transform:translateX(-50%);display:flex;gap:12px;align-items:center;z-index:40;pointer-events:none}
.hcard{background:var(--card);padding:10px 14px;border-radius:14px;backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.06);display:flex;gap:12px;align-items:center}
.hlabel{font-size:11px;color:rgba(255,255,255,0.8);text-transform:uppercase;font-weight:700}
.hval{font-weight:900;font-size:18px;color:#fff;font-family:'Outfit',sans-serif}
.hactions{pointer-events:auto}
.btn{appearance:none;border:0;padding:8px 14px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#7000ff);color:#fff;font-weight:800;cursor:pointer}
.btn.secondary{background:transparent;border:1px solid rgba(255,255,255,0.06)}
/* Center overlay simplified */
#overlay{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:30;min-width:320px;max-width:720px}
.card{background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));padding:26px;border-radius:18px;border:1px solid rgba(255,255,255,0.06);box-shadow:0 10px 40px rgba(0,0,0,0.6);backdrop-filter: blur(10px)}
.logo{font-size:48px;font-weight:900;letter-spacing:-2px;text-align:center;margin-bottom:6px}
.tag{color:rgba(255,255,255,0.6);text-align:center;margin-bottom:18px;font-weight:700}
.controls{display:flex;gap:12px;justify-content:center;align-items:center}
.settings{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.control-compact{padding:8px 12px;border-radius:12px;background:var(--glass);border:1px solid rgba(255,255,255,0.04);min-width:120px;text-align:center}
.small{font-size:12px;color:rgba(255,255,255,0.8)}
.input{padding:8px;border-radius:10px;border:none;background:#0b0620;color:#fff}
.slide{width:180px}
.customize{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:12px}
.color-swatch{width:28px;height:28px;border-radius:8px;border:2px solid rgba(255,255,255,0.06);cursor:pointer}
#creator-box{display:flex;gap:10px;align-items:center}
/* Pause / End Overlays */
#pause-overlay,#end-overlay{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:80;display:none}
/* Responsive tweaks */
@media(max-width:540px){.card{padding:16px}.logo{font-size:36px}}
/* Stars for a subtle background */
.star{position:fixed;border-radius:50%;pointer-events:none;opacity:0.08}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" aria-hidden="false">
  <div class="hcard"><div class="hlabel">Time</div><div class="hval" id="tval">90</div></div>
  <div class="hcard"><div class="hlabel">Orbs</div><div class="hval" id="orb-count">0</div></div>
  <div class="hcard hactions" style="pointer-events:auto"><button class="btn secondary" id="pause-btn">Pause</button></div>
</div>

<div id="overlay">
  <div class="card" id="title-card">
    <div class="logo">FREA</div>
    <div class="tag">Arena Slingshot Jump — simplified, polished, epic</div>
    <div style="display:flex;justify-content:center;gap:12px;align-items:center;">
      <div class="control-compact">
        <div class="small">Game Mode</div>
        <div style="margin-top:6px"><button class="btn" id="mode-classic">Classic</button></div>
      </div>
      <div class="control-compact">
        <div class="small">Opponents</div>
        <input type="range" id="ai-count-slider" class="slide" min="1" max="8" value="3">
        <div class="small" id="ai-count-val">3</div>
      </div>
    </div>

    <div class="customize" style="margin-top:12px;">
      <div style="display:flex;gap:8px;align-items:center">
        <input id="edit-name" class="input" placeholder="Frea name" value="Frea">
        <input id="edit-body-color" type="color" value="#4deeea" title="Body color">
      </div>
      <div>
        <button class="btn" id="playbtn">Enter Arena</button>
      </div>
    </div>

  </div>
</div>

<div id="pause-overlay">
  <div class="card">
    <div style="text-align:center;font-size:28px;font-weight:900;color:var(--accent2)">Paused</div>
    <div style="display:flex;gap:10px;justify-content:center;margin-top:14px">
      <button class="btn" id="resume-btn">Resume</button>
      <button class="btn secondary" id="pause-restart-btn">Restart</button>
      <button class="btn secondary" id="pause-lobby-btn">Lobby</button>
    </div>
  </div>
</div>

<div id="end-overlay">
  <div class="card">
    <div id="endtitle" style="text-align:center;font-size:28px;font-weight:900;color:var(--gold)">Victory!</div>
    <div style="text-align:center;margin-top:8px;">Winner: <span id="winner-name">Tama</span></div>
    <div style="display:flex;gap:10px;justify-content:center;margin-top:14px">
      <button class="btn" id="againbtn">Play Again</button>
      <button class="btn secondary" id="menubtn">Lobby</button>
    </div>
  </div>
</div>

<script>
/* Small but complete refactor of the original: improved UI/UX and smarter AI movement when stuck
   Key changes:
   - Simplified, centered lobby UI with essential options
   - HUD visible during play, pause and end overlays
   - Flea AI: when stuck the flea will walk along its platform toward orb and then jump toward it
   - Clean game loop, level building, and collision handling
*/
(function(){
  const C = document.getElementById('c');
  const ctx = C.getContext('2d');
  let W = window.innerWidth, H = window.innerHeight;
  let WORLD_W = W*1.8, WORLD_H = H*1.2;

  function resize(){ W = C.width = window.innerWidth; H = C.height = window.innerHeight; WORLD_W = Math.max(W,500)*1.8; WORLD_H = Math.max(H,400)*1.2; }
  window.addEventListener('resize', resize); resize();

  // UI elements
  const overlay = document.getElementById('overlay');
  const titleCard = document.getElementById('title-card');
  const playbtn = document.getElementById('playbtn');
  const pauseBtn = document.getElementById('pause-btn');
  const pauseOverlay = document.getElementById('pause-overlay');
  const resumeBtn = document.getElementById('resume-btn');
  const pauseRestartBtn = document.getElementById('pause-restart-btn');
  const pauseLobbyBtn = document.getElementById('pause-lobby-btn');
  const endOverlay = document.getElementById('end-overlay');
  const againBtn = document.getElementById('againbtn');
  const menubtn = document.getElementById('menubtn');
  const tval = document.getElementById('tval');
  const orbCountEl = document.getElementById('orb-count');
  const aiSlider = document.getElementById('ai-count-slider');
  const aiVal = document.getElementById('ai-count-val');
  const editName = document.getElementById('edit-name');
  const editColor = document.getElementById('edit-body-color');

  aiSlider.addEventListener('input', ()=>{ aiVal.textContent = aiSlider.value; });

  // Simple helper: rounded rect polyfill
  if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
      if (typeof r === 'undefined') r = 6;
      this.beginPath(); this.moveTo(x+r,y); this.arcTo(x+w,y,x+w,y+h,r); this.arcTo(x+w,y+h,x,y+h,r); this.arcTo(x,y+h,x,y,r); this.arcTo(x,y,x+w,y,r); this.closePath();
    };
  }

  // Game state
  let STATE = 'title'; // title, countdown, play, paused, ended
  let parts = [], sparks = [];
  let platforms = [], fleas = [], orb = null;
  let gravity = 0.45;
  let gameTimer = 90; // seconds
  let orbCount = 0;
  let lastTime = performance.now();

  class Platform{ constructor(x,y,w,h,col){this.x=x;this.y=y;this.w=w;this.h=h;this.col=col||'rgba(255,255,255,0.03)'}
    draw(){ ctx.save(); ctx.fillStyle=this.col; ctx.shadowColor='rgba(0,0,0,0.4)'; ctx.shadowBlur=8; ctx.beginPath(); ctx.roundRect(this.x, this.y, this.w, this.h,8); ctx.fill(); ctx.restore(); }
  }

  class Orb{ constructor(x,y){this.x=x;this.y=y;this.r=8;}
    draw(){ ctx.save(); ctx.shadowBlur=18; ctx.shadowColor='#ffe600'; ctx.fillStyle='#ffe600'; ctx.beginPath(); ctx.arc(this.x,this.y,this.r,0,Math.PI*2); ctx.fill(); ctx.restore(); }
  }

  class Flea{
    constructor(x,y,isPlayer,name,color){
      this.x=x;this.y=y;this.w=26;this.h=20;this.vx=0;this.vy=0;this.isP = !!isPlayer;this.name=name||'Frea';this.col=color||'#4deeea';
      this.stuck = true; this.surfaceAngle = 0; this.stickTimer = performance.now(); this.face = 1; this.hasOrb = false; this.ait = Math.floor(Math.random()*40)+10;
    }
    get cx(){ return this.x + this.w/2 }
    get cy(){ return this.y + this.h/2 }
    update(dt){
      if (STATE === 'countdown' || STATE==='title') return;
      if (!this.stuck){ this.vy += gravity; }
      this.x += this.vx; this.y += this.vy;
      this.vx *= 0.995; this.vy *= 0.995;
      this.bounds();
      if (this.stuck) this.vx = 0;
      this.collidePlatforms();
    }
    bounds(){
      if (this.x < 2) { this.x = 2; this.vx = 0; }
      if (this.x + this.w > WORLD_W-2) { this.x = WORLD_W - this.w - 2; this.vx = 0; }
      if (this.y < 2) { this.y = 2; this.vy = 0; }
      if (this.y + this.h > WORLD_H-2){ this.y = WORLD_H - this.h - 2; this.vy = 0; this.stuck=true }
    }
    collidePlatforms(){
      for (let p of platforms){
        if (this.x + this.w > p.x && this.x < p.x + p.w && this.y + this.h > p.y && this.y < p.y + p.h){
          // determine overlap
          let overlapX = Math.min(this.x + this.w - p.x, p.x + p.w - this.x);
          let overlapY = Math.min(this.y + this.h - p.y, p.y + p.h - this.y);
          if (overlapY < overlapX){
            // vertical collision
            if (this.cy < p.y + p.h/2){ // landed on top
              this.y = p.y - this.h; this.vy = 0; this.stuck = true; this.surfaceAngle = 0; this.stickTimer = performance.now();
            } else { // hit from below
              this.y = p.y + p.h; this.vy = 0; this.stuck = true; this.surfaceAngle = Math.PI; this.stickTimer = performance.now();
            }
          } else {
            // horizontal collision
            if (this.cx < p.x + p.w/2){ this.x = p.x - this.w; this.stuck = true; this.surfaceAngle = Math.PI/2; this.stickTimer = performance.now(); }
            else { this.x = p.x + p.w; this.stuck = true; this.surfaceAngle = -Math.PI/2; this.stickTimer = performance.now(); }
            this.vx = 0; this.vy = 0;
          }
        }
      }
    }
    launch(vx,vy){ this.vx=vx; this.vy=vy; this.stuck=false; this.hasOrb=false }
    aiUpdate(){
      if (this.isP || STATE !== 'play') return;
      this.ait--; if (this.ait>0) return; this.ait = Math.floor(20 + Math.random()*40);
      if (this.stuck){
        // find platform under this flea
        let p = platforms.find(pl=> this.x + this.w > pl.x && this.x < pl.x + pl.w && Math.abs((this.y+this.h) - pl.y) < 10);
        if (p && orb){
          // smart move: walk along the platform toward orb's x
          let targetX = Math.max(p.x + 6, Math.min(orb.x - this.w/2, p.x + p.w - 6));
          let centerX = this.cx;
          let dx = targetX - centerX;
          if (Math.abs(dx) > 6){
            // move along platform
            let dir = Math.sign(dx);
            let speed = 0.9 + Math.random()*0.6;
            this.x += dir * speed;
            this.face = dir>=0?1:-1;
            // clamp to platform bounds
            this.x = Math.max(this.x, p.x+2);
            this.x = Math.min(this.x, p.x + p.w - this.w - 2);
            this.stickTimer = performance.now();
          } else {
            // close enough -> try to jump toward orb
            // compute simple ballistic velocity
            let dx2 = orb.x - this.cx;
            let dy2 = orb.y - this.cy;
            let t = Math.max(0.6, Math.min(1.6, Math.abs(dx2)/200));
            let vx = dx2 / t;
            let vy = (dy2 - 0.5*gravity*t*t) / t;
            // limit speed
            let spd = Math.hypot(vx,vy);
            let maxSpd = 26;
            if (spd > maxSpd) { vx = vx/spd*maxSpd; vy = vy/spd*maxSpd; }
            // add some randomness
            vx += (Math.random()-0.5)*4; vy += (Math.random()-0.5)*2 - 2;
            this.launch(vx,vy);
            this.face = vx>0?1:-1;
          }
        } else {
          // no platform or no orb: random shuffle to avoid being idle
          if (Math.random() < 0.4) this.x += (Math.random()>0.5?1:-1) * (0.6 + Math.random()*1.2);
          // occasionally small jump to unstick
          if (Math.random() < 0.08){ this.launch((Math.random()-0.5)*12, -10 - Math.random()*8); }
        }
      } else {
        // airborne decisions: try to influence trajectory a bit toward orb
        if (orb){
          let steer = 0.06;
          let dx = orb.x - this.cx;
          this.vx += Math.sign(dx) * steer;
        }
      }
    }
    draw(){
      // draw body simple
      ctx.save();
      ctx.translate(this.cx, this.cy);
      if (this.face < 0) ctx.scale(-1,1);
      // body
      ctx.fillStyle = this.col; ctx.shadowBlur = this.hasOrb?22:8; ctx.shadowColor = this.col;
      ctx.beginPath(); ctx.ellipse(0,0,14,11,0,0,Math.PI*2); ctx.fill();
      // eyes
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(5,-3,4,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(6,-3,2,0,Math.PI*2); ctx.fill();
      // legs
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-8,8); ctx.lineTo(-12,14); ctx.moveTo(-2,8); ctx.lineTo(-2,15); ctx.moveTo(6,8); ctx.lineTo(10,14); ctx.stroke();
      ctx.restore();
      // name
      ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.font = '700 11px sans-serif'; ctx.fillText(this.name, this.x, this.y - 8);
    }
  }

  function buildLevel(){
    platforms.length = 0; fleas.length = 0; parts.length = 0; orb = null;
    const pad = 40; let yBase = H*0.6;
    // ground full width
    platforms.push(new Platform(0, WORLD_H - 28, WORLD_W, 28, 'rgba(255,255,255,0.03)'));
    // create 5 floating platforms at varying heights
    let count = 5; for (let i=0;i<count;i++){
      let w = 160 + Math.random()*220;
      let x = pad + (WORLD_W - pad*2 - w) * (i/(count-1));
      let y = yBase - i*80 - (Math.random()*40);
      platforms.push(new Platform(x,y,w,16,'rgba(255,255,255,0.04)'));
    }

    // spawn fleas: player + AI
    let playerF = new Flea(120, WORLD_H-200, true, editName.value || 'You', editColor.value);
    fleas.push(playerF);
    let aiCount = parseInt(aiSlider.value) || 3;
    for (let i=0;i<aiCount;i++){
      let p = platforms[1 + (i % (platforms.length-1))];
      let fx = p.x + 16 + Math.random()*(p.w-32);
      let fy = p.y - 24;
      fleas.push(new Flea(fx,fy,false,'AI'+(i+1), randomPalette()));
    }

    // place orb on a random platform
    let plat = platforms[Math.floor(1 + Math.random()*(platforms.length-1))];
    orb = new Orb(plat.x + plat.w/2, plat.y - 12);
    orbCount = 0; updateHUD();
    camera = {x:0,y:0};
  }

  function randomPalette(){ const colors = ['#4deeea','#ff60b5','#ffe600','#baff66']; return colors[Math.floor(Math.random()*colors.length)]; }

  function updateHUD(){ tval.textContent = Math.max(0, Math.ceil(gameTimer)); orbCountEl.textContent = orbCount; }

  let camera = {x:0,y:0};
  function updateCamera(){ // center on player
    let p = fleas[0]; if (!p) return;
    camera.x = Math.max(0, Math.min(WORLD_W - W, p.cx - W/2));
    camera.y = Math.max(0, Math.min(WORLD_H - H, p.cy - H/2));
  }

  // simple collision when fleas touch orb
  function checkOrbPickup(){
    for (let f of fleas){ if (orb && Math.hypot(f.cx - orb.x, f.cy - orb.y) < 22){ orbCount++; f.hasOrb = true; orb = null; setTimeout(()=>{ placeOrbOnRandomPlatform(); }, 1200); } }
  }
  function placeOrbOnRandomPlatform(){ let p = platforms[1 + Math.floor(Math.random()*(platforms.length-1))]; orb = new Orb(p.x + p.w*Math.random(), p.y - 12); }

  // main loop
  function loop(ts){
    let dt = Math.min(40, ts - lastTime); lastTime = ts;
    if (STATE === 'play'){
      gameTimer -= dt/1000;
      if (gameTimer <= 0){ STATE = 'ended'; endOverlay.style.display = 'block'; }
    }
    // update fleas
    for (let f of fleas){ f.update(dt); f.aiUpdate && f.aiUpdate(); }
    // collisions: simple pair push
    resolveFleaCollisions();
    checkOrbPickup();
    updateCamera();
    render();
    updateHUD();
    requestAnimationFrame(loop);
  }

  function resolveFleaCollisions(){
    for (let i=0;i<fleas.length;i++){
      for (let j=i+1;j<fleas.length;j++){
        let a=fleas[i], b=fleas[j]; let dx=b.cx-a.cx, dy=b.cy-a.cy; let dist=Math.hypot(dx,dy); let minDist=20;
        if (dist < minDist && dist>0){ let overlap=(minDist-dist)/2; let nx=dx/dist, ny=dy/dist; a.x -= nx*overlap; a.y -= ny*overlap; b.x += nx*overlap; b.y += ny*overlap; }
      }
    }
  }

  function render(){
    ctx.clearRect(0,0,W,H);
    // background subtle gradient and stars
    // draw platforms relative to camera
    ctx.save(); ctx.translate(-camera.x, -camera.y);
    for (let p of platforms) p.draw();
    if (orb) orb.draw();
    for (let f of fleas) f.draw();
    ctx.restore();
    // HUD extras
  }

  // Input simple slingshot for player via mouse/touch
  let pointer = {down:false, sx:0, sy:0};
  C.addEventListener('pointerdown', e=>{
    if (STATE !== 'play') return; pointer.down = true; pointer.sx = e.clientX + camera.x; pointer.sy = e.clientY + camera.y; });
  C.addEventListener('pointerup', e=>{
    if (STATE !== 'play' || !pointer.down) return; pointer.down = false; let ex = e.clientX + camera.x, ey = e.clientY + camera.y; let dx = (pointer.sx - ex)/8, dy = (pointer.sy - ey)/8; // fling scaling
    // apply to player
    let p = fleas[0]; if (p){ p.launch(dx,dy); p.face = dx>0?1:-1; }
  });

  // UI actions
  playbtn.addEventListener('click', ()=>{ overlay.style.display='none'; STATE='play'; gameTimer = 90; buildLevel(); lastTime = performance.now(); requestAnimationFrame(loop); });
  pauseBtn.addEventListener('click', ()=>{ if (STATE==='play'){ STATE='paused'; pauseOverlay.style.display='block' } });
  resumeBtn.addEventListener('click', ()=>{ if (STATE==='paused'){ STATE='play'; pauseOverlay.style.display='none' } });
  pauseRestartBtn.addEventListener('click', ()=>{ pauseOverlay.style.display='none'; STATE='play'; buildLevel(); });
  pauseLobbyBtn.addEventListener('click', ()=>{ pauseOverlay.style.display='none'; overlay.style.display='block'; STATE='title'; });
  againBtn.addEventListener('click', ()=>{ endOverlay.style.display='none'; STATE='play'; buildLevel(); gameTimer=90; });
  menubtn.addEventListener('click', ()=>{ endOverlay.style.display='none'; overlay.style.display='block'; STATE='title'; });

  // Keep a small camera in the beginning while title
  buildLevel(); render();

})();
</script>
</body>
</html>
