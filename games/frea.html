<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Frea</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{background:#000;overflow:hidden;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block;position:fixed;top:0;left:0;z-index:1}

#hud{position:fixed;top:0;left:0;width:100%;display:flex;justify-content:space-between;align-items:flex-start;padding:10px 14px;z-index:20;pointer-events:none}
.sbox{background:rgba(0,0,0,0.65);border:2px solid rgba(255,255,255,0.18);border-radius:12px;padding:5px 13px;text-align:center}
.slbl{font-size:8px;color:rgba(255,255,255,0.45);text-transform:uppercase;letter-spacing:1px}
.sval{font-size:21px;font-weight:900;line-height:1.1}
#tbox{background:rgba(0,0,0,0.65);border:2px solid rgba(255,210,0,0.45);border-radius:12px;padding:5px 13px;text-align:center}
#tval{font-size:21px;font-weight:900;color:#ffd700;line-height:1.1}

#orbtxt{position:fixed;top:26%;left:50%;transform:translateX(-50%);color:#ffd700;font-size:22px;font-weight:900;opacity:0;pointer-events:none;z-index:30;text-shadow:0 0 18px #ffd700;white-space:nowrap}

#overlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#0d0020,#010d2e,#001520)}
#overlay.gone{display:none}

.logo{font-size:clamp(50px,13vw,88px);font-weight:900;letter-spacing:-2px;line-height:1;text-align:center;margin-bottom:6px}
.logo span:nth-child(1){color:#ff4dff;text-shadow:0 0 28px #ff00ff}
.logo span:nth-child(2){color:#00ffcc;text-shadow:0 0 28px #00ffcc}
.logo span:nth-child(3){color:#ffd700;text-shadow:0 0 28px #ffd700}
.logo span:nth-child(4){color:#ff6b35;text-shadow:0 0 28px #ff6b35}
.logo span:nth-child(5){color:#4dffff;text-shadow:0 0 28px #4dffff}
.logo span:nth-child(6){color:#ff4dff;text-shadow:0 0 28px #ff00ff}
.logo span:nth-child(7){color:#00ffcc;text-shadow:0 0 28px #00ffcc}
.logo span:nth-child(8){color:#ffd700;text-shadow:0 0 28px #ffd700}
.tag{color:rgba(255,255,255,0.5);font-size:12px;letter-spacing:3px;text-transform:uppercase;margin-bottom:6px}
.hint{color:rgba(255,255,255,0.32);font-size:12px;text-align:center;max-width:290px;line-height:1.8;margin-bottom:32px}
.hint b{color:rgba(255,215,0,0.65)}
.btn{background:linear-gradient(135deg,#ff00cc,#6600ff);border:none;color:#fff;font-size:18px;font-weight:900;letter-spacing:2px;padding:15px 36px;border-radius:50px;cursor:pointer;text-transform:uppercase;box-shadow:0 0 28px rgba(255,0,200,0.4);margin:5px;display:block}
.btn:active{opacity:0.85;transform:scale(0.96)}
.btng{background:linear-gradient(135deg,#ffd700,#ff6b00)}
.res{background:rgba(255,255,255,0.08)}
.fleaico{font-size:clamp(38px,9vw,62px);margin-bottom:12px;animation:bob .65s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-9px)}}
.sdisplay{background:rgba(255,215,0,0.09);border:2px solid rgba(255,215,0,0.35);border-radius:14px;padding:16px 38px;margin-bottom:26px;text-align:center}
.sdisplay .n{font-size:clamp(38px,10vw,70px);font-weight:900;color:#ffd700;text-shadow:0 0 18px rgba(255,215,0,0.8)}
.sdisplay .l{color:rgba(255,255,255,0.45);font-size:10px;letter-spacing:2px;text-transform:uppercase}
.gtitle{font-size:clamp(28px,8vw,54px);font-weight:900;text-align:center;margin-bottom:9px}
.gsub{color:rgba(255,255,255,0.45);font-size:12px;letter-spacing:2px;text-transform:uppercase;margin-bottom:24px}
.stardiv{position:absolute;top:0;left:0;width:100%;height:100%;overflow:hidden;pointer-events:none}
.star{position:absolute;border-radius:50%;animation:twk linear infinite}
@keyframes twk{0%,100%{opacity:.15}50%{opacity:.9}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" style="display:none">
  <div class="sbox"><div class="slbl">You</div><div class="sval" id="pscore" style="color:#00ffcc">0</div></div>
  <div id="tbox"><div class="slbl">Time</div><div id="tval">60</div></div>
  <div class="sbox"><div class="slbl">CPU</div><div class="sval" id="ascore" style="color:#ff4dff">0</div></div>
</div>

<div id="orbtxt">⚡ ORB CAPTURED! ⚡</div>

<div id="overlay">
  <div class="stardiv" id="stars1"></div>
  <div id="title-view">
    <div style="display:flex;flex-direction:column;align-items:center">
      <div class="fleaico">🦟</div>
      <div class="logo"><span>F</span><span>L</span><span>E</span><span>A</span><span>F</span><span>A</span><span>L</span><span>L</span></div>
      <div class="tag">Compete for the ORB</div>
      <div class="hint"><b>Drag your flea</b> to aim &amp; slingshot<br><b>Tap anywhere</b> to leap there instantly<br>Grab ✨ <b>THE ORB</b> — hold it for points!</div>
      <button class="btn" id="playbtn">🦟 Play Now</button>
    </div>
  </div>
  <div id="end-view" style="display:none;flex-direction:column;align-items:center">
    <div class="fleaico" id="endico">🏆</div>
    <div class="gtitle" id="endtitle">YOU WIN!</div>
    <div class="gsub">Round Complete</div>
    <div class="sdisplay"><div class="n" id="endscore">0</div><div class="l">Your Score</div></div>
    <button class="btn btng" id="againbtn">🔄 Play Again</button>
    <button class="btn res" id="menubtn">Menu</button>
  </div>
</div>

<script>
(function(){
  var C=document.getElementById('c'),ctx=C.getContext('2d');
  var W,H;
  function rsz(){W=C.width=window.innerWidth;H=C.height=window.innerHeight}
  rsz();
  window.addEventListener('resize',function(){rsz();if(STATE==='play'){bgG=null;buildLevel()}});

  var GRAV=0.45,MAX_DRAG=130;
  var STATE='title';
  var ps=0,as=0,sec=60,tInt=null,fid=null,lt=0;
  var parts=[],sparks=[];
  var lvl=1,bgG=null;
  var platforms=[],player=null,aiPlayer=null,orb=null;
  var orbHolder=null,orbTimer=0;
  var sling={on:false,sx:0,sy:0,cx:0,cy:0};
  var runTgt=null;

  var LC=[
    {p:'#1a3a6e',b1:'#04001a',b2:'#091430',a:'#00ffcc'},
    {p:'#3a1a5e',b1:'#0f000f',b2:'#1e002e',a:'#ff4dff'},
    {p:'#1a4a2e',b1:'#000f07',b2:'#001e12',a:'#00ff88'},
    {p:'#4a2a1a',b1:'#0f0700',b2:'#1e1300',a:'#ffaa00'},
    {p:'#1a2a5e',b1:'#000813',b2:'#000e23',a:'#4dffff'}
  ];

  function Platform(x,y,w,h,col){
    this.x=x;this.y=y;this.w=w;this.h=h;this.col=col;
  }
  Platform.prototype.draw=function(){
    ctx.save();
    ctx.shadowColor=this.col;ctx.shadowBlur=12;
    ctx.fillStyle=this.col;
    ctx.fillRect(this.x,this.y,this.w,this.h);
    ctx.shadowBlur=0;
    ctx.fillStyle='rgba(255,255,255,0.12)';
    ctx.fillRect(this.x+3,this.y+2,this.w-6,4);
    ctx.restore();
  };

  function Flea(x,y,isP){
    this.x=x;this.y=y;this.vx=0;this.vy=0;
    this.isP=isP;this.onG=true;this.stuck=true;
    this.face=isP?1:-1;
    this.jcd=0;this.jc=0;this.maxJ=2;
    this.col=isP?'#00ffcc':'#ff4dff';
    this.la=0;this.ea=0;this.hasOrb=false;
    this.w=26;this.h=26;
    this.sq=1;
    this.ait=0;
  }
  Object.defineProperty(Flea.prototype,'cx',{get:function(){return this.x+this.w/2}});
  Object.defineProperty(Flea.prototype,'cy',{get:function(){return this.y+this.h/2}});
  Object.defineProperty(Flea.prototype,'feet',{get:function(){return this.y+this.h}});

  Flea.prototype.update=function(dt){
    this.la+=dt*0.012;this.ea+=dt*0.005;
    if(this.jcd>0)this.jcd-=dt;
    this.sq+=(1-this.sq)*0.2;
    
    if(!this.stuck){
      this.vy+=GRAV;
      this.x+=this.vx;this.y+=this.vy;
      this.vx*=0.99;
      this.vy*=0.99;
      this.collide();
      this.bounds();
    } else {
      this.vx=0;
      this.vy=0;
    }
  };

  Flea.prototype.collide=function(){
    this.onG=false;
    var fx=this.x, fy=this.y, fw=this.w, fh=this.h;
    
    for(var i=0;i<platforms.length;i++){
      var p=platforms[i];
      if(fx+fw>p.x && fx<p.x+p.w && fy+fh>p.y && fy<p.y+p.h){
        var overlapX = Math.min(fx+fw-p.x, p.x+p.w-fx);
        var overlapY = Math.min(fy+fh-p.y, p.y+p.h-fy);
        
        if(overlapX < overlapY){
          if(fx+fw/2 < p.x+p.w/2){
            this.x = p.x - fw;
          } else {
            this.x = p.x + p.w;
          }
        } else {
          if(fy+fh/2 < p.y+p.h/2){
            this.y = p.y - fh;
          } else {
            this.y = p.y + p.h;
          }
        }
        this.vx=0;this.vy=0;
        this.stuck=true;this.onG=true;this.jc=0;
        if(this.sq<0.72)this.sq=0.65;
        return;
      }
    }
  };

  Flea.prototype.bounds=function(){
    if(this.x<0){this.x=0;this.vx=0;this.vy=0;this.stuck=true;this.jc=0}
    if(this.x+this.w>W){this.x=W-this.w;this.vx=0;this.vy=0;this.stuck=true;this.jc=0}
    if(this.y<0){this.y=0;this.vx=0;this.vy=0;this.stuck=true;this.jc=0}
    if(this.y+this.h>H){
      this.y=H-150-this.h;this.vy=0;this.vx=0;
      this.x=W/2+(Math.random()-.5)*80;
      this.stuck=true;this.jc=0;
    }
  };

  Flea.prototype.launch=function(dvx,dvy){
    this.vx=dvx;this.vy=dvy;
    this.stuck=false;
    this.onG=false;
    this.sq=0.5;
    jpfx(this.cx,this.cy,this.col);
  };

  Flea.prototype.aiUpdate=function(){
    if(!orb)return;
    this.ait--;
    if(this.ait<=0){
      this.ait=14+Math.random()*18|0;
      if(this.stuck || this.onG){
        var dx=orb.x-this.cx;
        var dy=orb.y-this.cy;
        var dist=Math.sqrt(dx*dx+dy*dy);
        if(dist>15){
          var aispeed=17+Math.min(lvl,5);
          this.launch((dx/dist)*aispeed,((dy/dist)*aispeed)-1.5);
          this.face=dx>0?1:-1;
        }
      }
    }
  };

  Flea.prototype.draw=function(){
    ctx.save();
    ctx.translate(this.cx,this.cy);
    if(this.face<0)ctx.scale(-1,1);
    var sy=this.sq,sx=2-this.sq;
    ctx.scale(sx,sy);
    ctx.shadowColor=this.col;ctx.shadowBlur=this.hasOrb?22:9;
    ctx.fillStyle=this.col;
    ctx.beginPath();ctx.ellipse(0,0,13,11,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(0,0,0,0.3)';
    ctx.beginPath();ctx.ellipse(0,2,10,8,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=this.col;
    ctx.beginPath();ctx.ellipse(0,-1,13,11,0,0,Math.PI*2);ctx.fill();
    if(this.hasOrb){
      ctx.strokeStyle='rgba(255,215,0,0.6)';ctx.lineWidth=2.5;
      ctx.beginPath();ctx.arc(0,0,18,0,Math.PI*2);ctx.stroke();
    }
    ctx.fillStyle='rgba(255,255,255,0.92)';
    ctx.beginPath();ctx.ellipse(4.5,-2.5,3.8,3.8,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.55)';
    ctx.beginPath();ctx.ellipse(8,-4,1.6,1.6,0,0,Math.PI*2);ctx.fill();
    var ep=Math.sin(this.ea*.7)*1.1;
    ctx.fillStyle='#000';ctx.beginPath();ctx.arc(4.5+ep,-2.5,2,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.9)';ctx.beginPath();ctx.arc(5+ep,-3,.7,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=this.col;ctx.lineWidth=2.2;ctx.lineCap='round';
    var legs=[[-7,7],[-3.5,9],[0,9],[3.5,9],[7,7]];
    for(var i=0;i<legs.length;i++){
      var lx=legs[i][0],ly=legs[i][1];
      var sw=Math.sin(this.la*3+i*1.3)*(this.onG?3.5:1.5);
      ctx.beginPath();ctx.moveTo(lx,ly-1);ctx.lineTo(lx+(i%2===0?-4.5:4.5),ly+5.5+sw);ctx.stroke();
    }
    ctx.strokeStyle='rgba(255,255,255,0.42)';ctx.lineWidth=1.8;
    var aL=Math.sin(this.la*1.5)*7;
    ctx.beginPath();ctx.moveTo(-2.5,-11);ctx.quadraticCurveTo(-11,-21+aL,-7.5,-26);ctx.stroke();
    ctx.beginPath();ctx.moveTo(2.5,-11);ctx.quadraticCurveTo(11,-21-aL,7.5,-26);ctx.stroke();
    ctx.restore();
  };

  function Orb(x,y){
    this.x=x;this.y=y;this.vx=(Math.random()-.5)*3;this.vy=-7;
    this.r=15;this.an=Math.random()*Math.PI*2;this.pu=0;
    ofx(this.x,this.y);
  }
  Orb.prototype.update=function(dt){
    this.an+=dt*.004;this.pu+=dt*.008;
    if(orbHolder)return;
    this.vy+=GRAV*.68;this.x+=this.vx;this.y+=this.vy;this.vx*=.97;
    for(var i=0;i<platforms.length;i++){
      var p=platforms[i];
      if(this.x+this.r>p.x&&this.x-this.r<p.x+p.w){
        var prev=this.y-this.vy;
        if(prev+this.r<=p.y+1&&this.y+this.r>=p.y&&this.vy>=0){
          this.y=p.y-this.r;this.vy*=-.4;this.vx*=.65;
          if(Math.abs(this.vy)<.5)this.vy=0;
        }
        if(this.y-this.r<p.y+p.h&&this.y+this.r>p.y&&this.vy<0){
          this.y=p.y+p.h+this.r;this.vy=Math.abs(this.vy)*.25;
        }
      }
    }
    if(this.x-this.r<0){this.x=this.r;this.vx=Math.abs(this.vx)}
    if(this.x+this.r>W){this.x=W-this.r;this.vx=-Math.abs(this.vx)}
    if(this.y+this.r>H-130){
      this.y=70+Math.random()*140;this.x=70+Math.random()*(W-140);
      this.vy=-9;this.vx=(Math.random()-.5)*4;ofx(this.x,this.y);
    }
    if(Math.random()<.035){
      sparks.push({x:this.x+(Math.random()-.5)*14,y:this.y+(Math.random()-.5)*14,
        vx:(Math.random()-.5)*1.4,vy:-1-Math.random()*1.3,l:1,c:'#ffd700'});
    }
  };
  Orb.prototype.draw=function(){
    var r=this.r+Math.sin(this.an)*1.6;
    ctx.save();
    ctx.shadowColor='#ffd700';ctx.shadowBlur=22+Math.sin(this.pu)*5;
    var g=ctx.createRadialGradient(this.x-3.5,this.y-3.5,1.5,this.x,this.y,r);
    g.addColorStop(0,'#fff7b0');g.addColorStop(.3,'#ffd700');
    g.addColorStop(.7,'#ff9500');g.addColorStop(1,'#ff4f00');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(this.x,this.y,r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.65)';ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.82)';ctx.beginPath();ctx.arc(this.x-4.5,this.y-4.5,3.5,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    for(var i=1;i<=3;i++){
      ctx.strokeStyle='rgba(255,215,0,'+(0.14-i*.03)+')';ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(this.x,this.y,r+i*9+Math.sin(this.an+i)*2.5,0,Math.PI*2);ctx.stroke();
    }
    ctx.restore();
  };

  function jpfx(x,y,col){
    for(var i=0;i<7;i++){
      var a=Math.random()*Math.PI*2,sp=1.5+Math.random()*3.2;
      parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l:1,r:2+Math.random()*3,c:col});
    }
  }
  function ofx(x,y){
    for(var i=0;i<14;i++){
      var a=Math.random()*Math.PI*2,sp=2+Math.random()*4.5;
      parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2.5,l:1,r:3+Math.random()*3.5,c:'#ffd700'});
      sparks.push({x:x,y:y,vx:Math.cos(a)*sp*1.3,vy:Math.sin(a)*sp*1.3-3.5,l:1,c:'#fff'});
    }
  }

  function drawParts(){
    for(var i=parts.length-1;i>=0;i--){
      var p=parts[i];
      ctx.globalAlpha=p.l;ctx.fillStyle=p.c;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.l,0,Math.PI*2);ctx.fill();
      p.x+=p.vx;p.y+=p.vy;p.vy+=.14;p.l-=.04;
      if(p.l<=0)parts.splice(i,1);
    }
    for(var i=sparks.length-1;i>=0;i--){
      var s=sparks[i];
      ctx.globalAlpha=s.l;ctx.fillStyle=s.c;
      ctx.beginPath();ctx.arc(s.x,s.y,2*s.l,0,Math.PI*2);ctx.fill();
      s.x+=s.vx;s.y+=s.vy;s.vy+=.09;s.vx*=.93;s.l-=.026;
      if(s.l<=0)sparks.splice(i,1);
    }
    ctx.globalAlpha=1;
  }

  function buildLevel(){
    bgG=null;
    var lc=LC[(lvl-1)%LC.length];
    platforms=[];
    platforms.push(new Platform(0,H-150,W,20,lc.p));
    
    var rows=Math.max(3,Math.floor((H-220)/120));
    var used={};
    var cnt=6+Math.random()*3|0;
    for(var i=0;i<cnt;i++){
      for(var att=0;att<40;att++){
        var row=1+Math.random()*(rows-1)|0;
        var col=Math.random()*3|0;
        var key=row*10+col;
        if(used[key])continue;
        used[key]=1;
        var pw=70+Math.random()*90;
        var px=Math.max(6,(col*(W/3))+(Math.random()*Math.max(0,W/3-pw-8)));
        var py=H-150-50-(row*(H-240)/rows);
        if(py<60)break;
        platforms.push(new Platform(Math.min(px,W-pw-6),py,pw,14,lc.p));
        break;
      }
    }
    platforms.push(new Platform(0,H*.3,52,14,lc.p));
    platforms.push(new Platform(W-52,H*.3,52,14,lc.p));
    platforms.push(new Platform(W/2-60,H*.18,120,14,lc.p));
  }

  function spawnOrb(){
    orb=new Orb(W*.2+Math.random()*W*.6,70+Math.random()*(H-260));
    orbHolder=null;orbTimer=0;
  }

  function checkPickup(){
    if(!orb)return;
    var fl=[player,aiPlayer];
    for(var i=0;i<fl.length;i++){
      var f=fl[i];
      if(!f||orbHolder===f)continue;
      var dx=f.cx-orb.x,dy=f.cy-orb.y;
      if(Math.sqrt(dx*dx+dy*dy)<f.w/2+orb.r){
        orbHolder=f;f.hasOrb=true;ofx(orb.x,orb.y);
        if(f===player){ps+=5;updUI();flashOrb()}else{as+=5;updUI()}
      }
    }
  }
  function checkSteal(){
    if(!orbHolder||!orb)return;
    var thief=orbHolder===player?aiPlayer:player;
    if(!thief)return;
    var dx=thief.cx-orb.x,dy=thief.cy-orb.y;
    if(Math.sqrt(dx*dx+dy*dy)<thief.w/2+orb.r+4){
      orbHolder.hasOrb=false;orbHolder=thief;thief.hasOrb=true;ofx(orb.x,orb.y);
      if(thief===player){ps+=3;updUI();flashOrb()}else{as+=3;updUI()}
    }
  }
  function holdTick(dt){
    if(!orbHolder||!orb)return;
    orb.x=orbHolder.cx;orb.y=orbHolder.y-orb.r-5;
    orbTimer+=dt;
    if(orbTimer>=16){
      orbTimer=0;
      if(orbHolder===player)ps++;else as++;
      updUI();
      if(ps>=100||as>=100)endGame();
    }
  }

  function flashOrb(){
    var el=document.getElementById('orbtxt');
    el.style.transition='none';el.style.opacity='1';el.style.transform='translateX(-50%) translateY(0)';
    setTimeout(function(){
      el.style.transition='all 1.1s ease';el.style.opacity='0';el.style.transform='translateX(-50%) translateY(-45px)';
    },50);
  }
  function updUI(){
    document.getElementById('pscore').textContent=ps;
    document.getElementById('ascore').textContent=as;
  }

  function drawBG(){
    var lc=LC[(lvl-1)%LC.length];
    if(!bgG){
      bgG=ctx.createLinearGradient(0,0,0,H);
      bgG.addColorStop(0,lc.b1);bgG.addColorStop(1,lc.b2);
    }
    ctx.fillStyle=bgG;ctx.fillRect(0,0,W,H);
    ctx.strokeStyle=lc.a+'0d';ctx.lineWidth=1;
    for(var x=0;x<W;x+=52){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
    for(var y=0;y<H;y+=52){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
  }

  function drawSling(){
    if(!sling.on||!player)return;
    var px=player.cx,py=player.cy;
    var dx=sling.sx-sling.cx,dy=sling.sy-sling.cy;
    var dist=Math.sqrt(dx*dx+dy*dy);
    var cl=Math.min(dist,MAX_DRAG);
    if(dist>0){dx=dx/dist*cl;dy=dy/dist*cl}
    var pow=cl/MAX_DRAG;
    var lvx=dx*0.65,lvy=dy*0.65;

    ctx.save();
    ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.lineWidth=2;
    ctx.setLineDash([5,7]);
    ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(sling.cx,sling.cy);ctx.stroke();
    ctx.setLineDash([]);

    var tx=px,ty=py,tvx=lvx,tvy=lvy;
    for(var i=0;i<24;i++){
      tvx*=0.99;tvy+=GRAV;tx+=tvx;ty+=tvy;
      var t=i/24,al=0.72*(1-t),dr=4.5*(1-t*.55);
      var col=pow>.6?'rgba(255,70,70,'+al+')':'rgba(255,215,0,'+al+')';
      ctx.fillStyle=col;ctx.beginPath();ctx.arc(tx,ty,dr,0,Math.PI*2);ctx.fill();
      if(tx<0||tx>W||ty>H)break;
      var hit=false;
      for(var pi=0;pi<platforms.length;pi++){
        var p=platforms[pi];
        if(tx>p.x&&tx<p.x+p.w&&ty>p.y&&ty<p.y+p.h){hit=true;break}
      }
      if(hit)break;
    }

    var gr=ctx.createRadialGradient(sling.cx,sling.cy,1,sling.cx,sling.cy,10+pow*14);
    gr.addColorStop(0,'rgba(255,255,255,0.9)');
    gr.addColorStop(.4,pow>.6?'rgba(255,60,60,0.7)':'rgba(255,215,0,0.7)');
    gr.addColorStop(1,'rgba(255,120,0,0)');
    ctx.shadowColor=pow>.6?'#ff4040':'#ffd700';ctx.shadowBlur=18;
    ctx.fillStyle=gr;ctx.beginPath();ctx.arc(sling.cx,sling.cy,10+pow*14,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;

    var bw=58,bh=7,bx=px-bw/2,by=py-46;
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(bx,by,bw,bh);
    ctx.fillStyle=pow>.6?'#ff4444':'#ffd700';
    ctx.shadowColor=pow>.6?'#ff4444':'#ffd700';ctx.shadowBlur=7;
    ctx.fillRect(bx,by,bw*pow,bh);
    ctx.shadowBlur=0;
    ctx.restore();
  }

  function drawRunTarget(){
    if(!runTgt||!player)return;
    var t=(Date.now()%700)/700;
    ctx.save();
    ctx.globalAlpha=.55*(1-t*.35);
    ctx.strokeStyle='#00ffcc';ctx.lineWidth=2;
    ctx.setLineDash([4,5]);
    ctx.beginPath();ctx.arc(runTgt.x,runTgt.y,13+t*7,0,Math.PI*2);ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha=.75;
    ctx.fillStyle='#00ffcc';ctx.beginPath();ctx.arc(runTgt.x,runTgt.y,3.5,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }

  function nearPlayer(x,y){
    if(!player)return false;
    var dx=x-player.cx,dy=y-player.cy;
    return Math.sqrt(dx*dx+dy*dy)<60;
  }

  C.addEventListener('touchstart',function(e){
    e.preventDefault();
    if(STATE!=='play')return;
    var t=e.changedTouches[0];
    var tx=t.clientX,ty=t.clientY;
    if(nearPlayer(tx,ty)){
      sling.on=true;sling.sx=tx;sling.sy=ty;sling.cx=tx;sling.cy=ty;
      runTgt=null;
    }else{
      runTgt={x:tx,y:ty};sling.on=false;
    }
  },{passive:false});

  C.addEventListener('touchmove',function(e){
    e.preventDefault();
    if(STATE!=='play'||!sling.on)return;
    var t=e.changedTouches[0];
    sling.cx=t.clientX;sling.cy=t.clientY;
  },{passive:false});

  C.addEventListener('touchend',function(e){
    e.preventDefault();
    if(STATE!=='play'||!sling.on)return;
    var dx=sling.sx-sling.cx,dy=sling.sy-sling.cy;
    var dist=Math.sqrt(dx*dx+dy*dy);
    if(dist>8){
      var cl=Math.min(dist,MAX_DRAG);
      dx=dx/dist*cl;dy=dy/dist*cl;
      player.launch(dx*0.65,dy*0.65);
      player.face=dx>0?1:-1;
    }
    sling.on=false;
  },{passive:false});

  C.addEventListener('mousedown',function(e){
    if(STATE!=='play')return;
    if(nearPlayer(e.clientX,e.clientY)){
      sling.on=true;sling.sx=e.clientX;sling.sy=e.clientY;sling.cx=e.clientX;sling.cy=e.clientY;
      runTgt=null;
    }else{
      runTgt={x:e.clientX,y:e.clientY};sling.on=false;
    }
  });
  window.addEventListener('mousemove',function(e){if(sling.on){sling.cx=e.clientX;sling.cy=e.clientY}});
  window.addEventListener('mouseup',function(e){
    if(!sling.on)return;
    var dx=sling.sx-sling.cx,dy=sling.sy-sling.cy;
    var dist=Math.sqrt(dx*dx+dy*dy);
    if(dist>8){
      var cl=Math.min(dist,MAX_DRAG);
      dx=dx/dist*cl;dy=dy/dist*cl;
      player.launch(dx*0.65,dy*0.65);
      player.face=dx>0?1:-1;
    }
    sling.on=false;
  });

  document.addEventListener('keydown',function(e){
    if(STATE!=='play')return;
    if(e.code==='ArrowLeft'||e.code==='KeyA'){player.stuck=false;player.vx=-12;player.face=-1}
    if(e.code==='ArrowRight'||e.code==='KeyD'){player.stuck=false;player.vx=12;player.face=1}
    if((e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')&&!e.repeat){
      player.launch(player.vx,-16);e.preventDefault();
    }
  });

  function loop(ts){
    var dt=Math.min(ts-lt,48);lt=ts;
    if(STATE!=='play')return;
    ctx.clearRect(0,0,W,H);
    drawBG();
    for(var i=0;i<platforms.length;i++)platforms[i].draw();

    if(runTgt&&player){
      var rdx=runTgt.x-player.cx;
      var rdy=runTgt.y-player.cy;
      var dist=Math.sqrt(rdx*rdx+rdy*rdy);
      if(player.stuck||player.onG){
        if(dist>5){
          player.launch((rdx/dist)*20,(rdy/dist)*20);
          player.face=rdx>0?1:-1;
        }
      }
      if(dist<25)runTgt=null;
    }

    player.update(dt);
    aiPlayer.aiUpdate();aiPlayer.update(dt);
    if(orb)orb.update(dt);
    holdTick(dt);checkPickup();checkSteal();

    drawRunTarget();
    if(orb)orb.draw();
    drawSling();
    player.draw();aiPlayer.draw();
    drawParts();

    fid=requestAnimationFrame(loop);
  }

  function startGame(){
    bgG=null;ps=0;as=0;sec=60;orbHolder=null;orbTimer=0;
    parts=[];sparks=[];sling.on=false;runTgt=null;
    buildLevel();
    player=new Flea(W*.25,H-150-40,true);
    aiPlayer=new Flea(W*.75,H-150-40,false);
    spawnOrb();
    document.getElementById('overlay').classList.add('gone');
    document.getElementById('hud').style.display='flex';
    updUI();
    document.getElementById('tval').textContent=sec;
    STATE='play';
    if(tInt)clearInterval(tInt);
    tInt=setInterval(function(){
      if(STATE!=='play')return;
      sec--;document.getElementById('tval').textContent=sec;
      if(sec<=0)endGame();
    },1000);
    if(fid)cancelAnimationFrame(fid);
    lt=performance.now();
    fid=requestAnimationFrame(loop);
  }

  function endGame(){
    STATE='gameover';
    clearInterval(tInt);if(fid)cancelAnimationFrame(fid);
    var won=ps>=as;
    document.getElementById('hud').style.display='none';
    document.getElementById('endico').textContent=won?'🏆':'🦟';
    document.getElementById('endtitle').textContent=won?'🏆 YOU WIN!':'😔 YOU LOSE';
    document.getElementById('endtitle').style.color=won?'#ffd700':'#ff6666';
    document.getElementById('endscore').textContent=ps;
    document.getElementById('title-view').style.display='none';
    document.getElementById('end-view').style.display='flex';
    document.getElementById('overlay').classList.remove('gone');
    if(won)lvl++;
  }

  function mkStars(id){
    var el=document.getElementById(id);if(!el)return;el.innerHTML='';
    for(var i=0;i<75;i++){
      var s=document.createElement('div');s.className='star';
      var sz=1+Math.random()*2.8;
      s.style.cssText='width:'+sz+'px;height:'+sz+'px;background:#fff;left:'+(Math.random()*100)+'%;top:'+(Math.random()*100)+'%;animation-duration:'+(2+Math.random()*4)+'s;animation-delay:'+(Math.random()*4)+'s;opacity:'+(0.3+Math.random()*.7);
      el.appendChild(s);
    }
  }
  mkStars('stars1');

  document.getElementById('playbtn').addEventListener('click',function(){lvl=1;startGame()});
  document.getElementById('againbtn').addEventListener('click',startGame);
  document.getElementById('menubtn').addEventListener('click',function(){
    STATE='title';
    document.getElementById('end-view').style.display='none';
    document.getElementById('title-view').style.display='block';
    document.getElementById('overlay').classList.remove('gone');
  });

  ctx.fillStyle='#04001a';ctx.fillRect(0,0,W,H);
})();
</script>
</body>
