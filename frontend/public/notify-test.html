<!doctype html><html><head><meta charset="utf-8"><title>notify test</title><script src="https://unpkg.com/lucide@latest"></script></head><body style="background:#0a0a0b;color:#fff;font-family:sans-serif"><h1 data-testid="harness">treesh.app notice harness</h1>
<script>
/* ---------- M.A.D. review results: tells a verified Treesh Icon when Treesh admin approved or rejected their change ---------- */
(function(){
  const SEEN='treesh_icon_review_seen', CSS='#tin-wrap{position:fixed;right:16px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:9998;display:flex;flex-direction:column;gap:10px;width:min(360px,calc(100vw - 32px))}.tin{position:relative;display:flex;gap:12px;padding:14px 40px 14px 14px;border-radius:18px;background:rgba(18,16,24,.94);border:1px solid rgba(255,255,255,.12);box-shadow:0 20px 60px rgba(0,0,0,.55);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);color:#f5f5f7;font:500 13.5px/1.45 Figtree,Manrope,system-ui,sans-serif;animation:tinIn .5s cubic-bezier(.22,1,.36,1) both}@keyframes tinIn{from{opacity:0;transform:translateY(14px) scale(.98)}}.tin.out{opacity:0;transform:translateY(10px);transition:opacity .25s,transform .25s}.tin-ic{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:50%}.tin.ok .tin-ic{background:rgba(61,220,151,.16);color:#3ddc97}.tin.no .tin-ic{background:rgba(255,92,122,.16);color:#ff5c7a}.tin b{display:block;font-weight:800}.tin small{display:block;margin-top:2px;color:rgba(245,245,247,.62)}.tin q{display:block;margin-top:8px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.05);color:rgba(245,245,247,.85);quotes:none}.tin a{display:inline-block;margin-top:8px;color:#b779ff;font-weight:700;text-decoration:none}.tin-x{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;border:0;background:transparent;color:rgba(245,245,247,.5);font-size:18px;line-height:1;cursor:pointer}.tin-x:hover{color:#fff;background:rgba(255,255,255,.08)}';
  const E=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  function token(){ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(!/^sb-.+-auth-token$/.test(k||'')) continue; try{ const d=JSON.parse(localStorage.getItem(k)), s=d&&(d.currentSession||d); if(s&&s.access_token&&(!s.expires_at||s.expires_at*1000>Date.now()+30000)) return s.access_token; }catch(e){} } return null; }
  function show(list){
    if(!document.getElementById('tin-css')){ const st=document.createElement('style'); st.id='tin-css'; st.textContent=CSS; document.head.appendChild(st); }
    let w=document.getElementById('tin-wrap'); if(!w){ w=document.createElement('div'); w.id='tin-wrap'; w.setAttribute('data-testid','icon-review-notices'); document.body.appendChild(w); }
    const max=Math.max(...list.map(u=>u.at)); localStorage.setItem(SEEN,String(Math.max(max,+localStorage.getItem(SEEN)||0)));
    list.slice(0,3).forEach((u,i)=>{ const ok=u.result==='approved', el=document.createElement('div');
      el.className='tin '+(ok?'ok':'no'); el.setAttribute('data-testid','icon-review-notice'); el.style.animationDelay=(i*120)+'ms';
      el.innerHTML=`<span class="tin-ic"><i data-lucide="${ok?'badge-check':'message-square-x'}" style="width:17px;height:17px"></i></span><div><b>${ok?'Your change was approved':'Your change wasn’t approved'}</b><small>${E(u.title)}${ok?' is live on Treesh.':''}</small>${!ok&&u.note?`<q data-testid="icon-review-notice-note">${E(u.note)}</q>`:''}${ok?'':'<a href="/tools/mad" data-testid="icon-review-notice-open">Open M.A.D.</a>'}</div><button type="button" class="tin-x" aria-label="Dismiss" data-testid="icon-review-notice-close">×</button>`;
      const bye=()=>{ el.classList.add('out'); setTimeout(()=>el.remove(),260); };
      el.querySelector('.tin-x').addEventListener('click',bye); if(ok) setTimeout(bye,12000);
      w.appendChild(el); });
    if(list.length>3){ const el=document.createElement('div'); el.className='tin ok'; el.innerHTML=`<div><b>${list.length-3} more review update${list.length===4?'':'s'}</b><a href="/tools/mad">See them in M.A.D.</a></div><button type="button" class="tin-x" aria-label="Dismiss">×</button>`; el.querySelector('.tin-x').addEventListener('click',()=>el.remove()); w.appendChild(el); }
    try{ window.lucide&&lucide.createIcons(); }catch(e){}
  }
  let busy=false;
  async function check(){
    const t=token(); if(!t||busy) return;
    const last=+sessionStorage.getItem(SEEN+'_at')||0; if(Date.now()-last<10*60*1000) return;
    busy=true; sessionStorage.setItem(SEEN+'_at',String(Date.now()));
    try{ const seen=+localStorage.getItem(SEEN)||Date.now()-14*864e5;
      const r=await fetch('/api/github/icon-updates',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({access_token:t,since:seen})});
      if(r.ok){ const d=await r.json(), list=(d.updates||[]).filter(u=>u.at>seen); if(list.length) show(list); } }catch(e){}
    busy=false;
  }
  setTimeout(check,3000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) setTimeout(check,800); });
})();
</script>
</body></html>
