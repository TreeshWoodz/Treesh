        $(document).ready(function() {
const $rhymes = $("#rhymes");
const $text = $("#text");
const $input = $("#input");
const padding = 30;
let repositionTimeout;
let latestCoords = { x: 0, y: 0 };

function showRhymesAt(x, y, smooth = true) {
  latestCoords = { x, y };
  const popupWidth = $rhymes.outerWidth();
  const popupHeight = $rhymes.outerHeight() || 50;
  const vv = window.visualViewport;

  clearTimeout(repositionTimeout);
  $rhymes.removeClass("go");
  $rhymes.find(".contain").scrollLeft(0);

  repositionTimeout = setTimeout(() => {
    const viewportOffsetY = vv ? vv.offsetTop : 0;
    const viewportHeight = vv ? vv.height : window.innerHeight;
    const viewportWidth = vv ? vv.width : window.innerWidth;

    let left = x - popupWidth / 2;
    let top = y - popupHeight - padding - viewportOffsetY;

    const bottomLimit = viewportHeight - popupHeight - padding;
    if (top > bottomLimit) top = bottomLimit;
    if (top < padding) top = padding;

    if (left < padding) left = padding;
    if (left + popupWidth > viewportWidth - padding)
      left = viewportWidth - popupWidth - padding;

    // use transform for smoother repositioning
    const transform = `translate3d(${left}px, ${top}px, 0)`;
    $rhymes.css({
      transform,
      transition: smooth
        ? "opacity 0.25s ease, transform 0.25s cubic-bezier(0.22, 1, 0.36, 1)"
        : "none"
    });

    requestAnimationFrame(() => $rhymes.addClass("go"));
  }, 350);
}

// block reposition clicks inside rhymes
$rhymes.on("click touchstart", (e) => e.stopPropagation());

// handle clicks/touches inside parent container
$text.on("click touchstart", function (e) {
  if (!$(e.target).is("#input")) return;
  const x = e.pageX || e.originalEvent.touches[0].pageX;
  const y = e.pageY || e.originalEvent.touches[0].pageY;
  showRhymesAt(x, y); 
});

$input.on("focus", function () {
  const rect = this.getBoundingClientRect();
  showRhymesAt(rect.left + 20, rect.top - 60);
});

$input.on("blur", () => $rhymes.removeClass("go"));

// handle viewport changes (keyboard open/close)
if (window.visualViewport) {
  let resizeTimer;
  visualViewport.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if ($rhymes.hasClass("go")) {
        const rect = $input[0].getBoundingClientRect();
        showRhymesAt(rect.left + 20, rect.top - 60);
      }
    }, 150);
  });
}
        });
      </script>

if (savedLyricsData) {

            var hasSet = $classes.split(" ").includes("set");

            var spanMatch = item.text.match(/<span[^>]*>(.*?)<\/span>/);
            var spanText = spanMatch ? spanMatch[1].trim() : "";

            // remove brackets from spanText (so we can rebuild with brackets)
            spanText = spanText.replace(/^\[|\]$/g, "").trim();

            // remove span from text to get lyric text only
            var lyricText = item.text.replace(/<span[^>]*>.*?<\/span>/g, "").trim();

            // skip completely empty lines
            if (spanText === "" && lyricText === "") continue;

            // rebuild <p> content in #lyrics
            var newPText = "<span>" + (spanText ? spanText : "") + "</span> " + lyricText;
            lyrics.append('<p class="' + $classes + '">' + newPText + '</p>'); 

            // add to textarea with * if set
            var lineOutput = "";
            if (hasSet) lineOutput += "*";
            if (spanText) lineOutput += "[" + spanText + "] ";
            lineOutput += lyricText;

            textContent += lineOutput + "\n";

        } else if (item.type === "br") {

            textContent += "\n";

    // save lyrics + classes + span content + <br>
    function saveLyrics() {
  const text = $("#input").val();
  const lines = text.split("\n");
  const lyricsData = [];

  lines.forEach(function(line) {
    if (line === "") {
      lyricsData.push({ type: "br", text: "", classes: "" });
      return;
    }

    let isSet = false;
    if (line.startsWith("*")) {
      isSet = true;
      line = line.slice(1);
    }

    line = line.replace(/\r/g, "");

    const match = line.match(/^(\[?\d{2}:\d{2}\.\d{2}\]?)(.*)/);
    let timestamp = "";
    let body = line;
    if (match) {
      timestamp = match[1];
      body = match[2].trim();
      if (!timestamp.startsWith("[")) timestamp = "[" + timestamp + "]";
    }

    // push the same shape your old function used
    const classes = isSet ? "set" : "";
    const html = "<span>" + (timestamp || "") + "</span> " + body;
    lyricsData.push({ type: "p", text: html, classes: classes });
  });

  // debug — check console to confirm saved payload
  console.log("saving lyricsData", lyricsData);
  localStorage.setItem("lyricsData", JSON.stringify(lyricsData));
}

   function saveAudio() {
    let mp3 = $("#player").attr("src");
    if (!mp3) return;

    fetch(mp3)
        .then(res => res.blob())
        .then(blob => {
            let tx = db.transaction("files", "readwrite");
            let store = tx.objectStore("files");
            let req = store.put(blob, "savedAudio");

            req.onsuccess = () => {
                $("#audio-btn").attr("data-status", "play").html('<i class="fa-solid fa-play"></i>');
                if ($("#lyrics").css("display") === "block") {
                    $("#next-line").removeClass("inactive");
                }

                let url = URL.createObjectURL(blob);
                $("#player")[0].src = url;
                localStorage.setItem("audioReady", "true");
            };

            req.onerror = e => console.error("Failed to save audio:", e.target.error);
        })
        .catch(err => console.error("Fetch failed:", err));
}

function loadSavedAudio() {
    let ready = localStorage.getItem("audioReady");
    if (!ready) return;

    if (!db) {
        console.warn("DB not ready yet");
        return;
    }

    let tx = db.transaction("files", "readonly");
    let store = tx.objectStore("files");
    let getReq = store.get("savedAudio");

    getReq.onsuccess = function(e) {
        let file = e.target.result;
        if (!file) return;

        let url = URL.createObjectURL(file);
        let player = $("#player")[0];
        player.src = url;
        player.hidden = false;

        $("#audio-btn").attr("data-status", "play").html('<i class="fa-solid fa-play"></i>');

        if ($("#lyrics").css("display") === "block") {
            $("#next-line").removeClass("inactive");
        }

        $("#next").removeClass("inactive");
        document.getElementById("play").dataset.file = "ready";
    };

    getReq.onerror = e => console.error("Failed to load audio:", e.target.error);
}

            startTime = parseTimeString(prevP.find("span").text().trim());
        }
    }
    
      $("#audio-btn").attr("data-status", "pause").html('<i class="fa-solid fa-stop"></i>');
    player.currentTime = startTime;
    player.play();
}

function parseTimeString(s) {
    if (!s) return 0;
    s = s.replace(/[\[\]]/g, "");
    var m = s.match(/(\d+):(\d+)(?:\.(\d+))?/);
    if (!m) return 0;
    var min = parseInt(m[1], 10);
    var sec = parseInt(m[2], 10);
    var frac = m[3] ? parseInt(m[3], 10) / Math.pow(10, m[3].length) : 0;
    return min * 60 + sec + frac;
}

function formatTime(time) {
    var minutes = Math.floor(time / 60);
    var seconds = Math.floor(time % 60);
    var milliseconds = Math.floor((time % 1) * 100);
    return ("0" + minutes).slice(-2) + ":" + ("0" + seconds).slice(-2) + "." + ("0" + milliseconds).slice(-2);
}

function getTimeFromP($p) {
    var spanText = $p.find("span").text().trim();
    if (spanText) return parseTimeString(spanText);
    return NaN;
}

function syncLyrics() {
  if ($("#text").css("display") === "none") { 
    var current = player.currentTime;
    var isRecording = $("#next-line").hasClass("go");

    $("#lyrics p").removeClass("sync");

    // get all valid lyric lines (skip [Hook:], [Verse:], etc)
    var $validLyrics = $("#lyrics p").filter(function() {
        var text = $(this).clone().children("span").remove().end().text().trim();
        var time = getTimeFromP($(this));
        return !/^\s*\[.*?\]\s*$/.test(text) && !isNaN(time);
    });

    $validLyrics.each(function(index) {
        var $this = $(this);
        var start = getTimeFromP($this);
        var next = $validLyrics.eq(index + 1);
        var end = next.length ? getTimeFromP(next) : Number.POSITIVE_INFINITY;

        if (current >= start && current < end) {
            $this.addClass("sync"); 

            // only scroll if NOT recording AND not the last lyric
            if (!isRecording && index !== $validLyrics.length - 1) {
                let target = $this.position().top - 5 + $("#lyrics").scrollTop() - $("#lyrics").height()/2;
$("#lyrics").scrollTop(target);
            }

            // update timestamp if recording
            if (isRecording && $this.hasClass("selected") && !$this.hasClass("set")) {
                $this.find("span").html("[" + formatTime(current) + "]");
            }

            return false; // stop once we find current line
        }
    });
    
      } 
}

   function getWordAtCaret($input) {
  const el = $input[0];
  const text = $input.val();
  const pos = el.selectionStart || 0;

  // find word start (scan left to whitespace or newline)
  let start = pos;
  while (start > 0 && !/\s/.test(text[start-1])) start--;

  // find word end (scan right)
  let end = pos;
  while (end < text.length && !/\s/.test(text[end])) end++;

  // if caret is between words (on whitespace) try previous word
  let word = text.slice(start, end);
  if (!word && start > 0) {
    // try previous word
    let prevEnd = start;
    let prevStart = prevEnd;
    while (prevStart > 0 && !/\s/.test(text[prevStart-1])) prevStart--;
    word = text.slice(prevStart, prevEnd);
  }

  return (word || "").replace(/[^\w]/g,"").toLowerCase();
}

  const $input = $("#input");

  if (!word) {
    $("#rhymes .contain").empty();
    return;

  $.getJSON("https://rhymebrain.com/talk?function=getRhymes&word=" + encodeURIComponent(word))
    .done(function(data) {

        .map(item => "<button type='button' class='rhyme-btn'>" + item.word + "</button>")
        .join("");
      $("#rhymes .contain").html(list);
    })
    .fail(() => console.log("Rhyme API request failed"));
}


// insert the rhyme at caret (on same line) — DO NOT replace whole word
$("#rhymes").on("click", "button", function() {
  const $input = $("#input");
  const word = $(this).text();
  const inputEl = $input[0];
  const text = $input.val();
  const pos = inputEl.selectionStart;
  const before = text.substring(0, pos);
  const after = text.substring(pos);

  // detect if caret is inside a word
  const beforeWordMatch = before.match(/(\S+)$/); // last word before caret
  const afterWordMatch = after.match(/^(\S+)/);   // first word after caret

  let newText, cursorPos;

  if (beforeWordMatch && afterWordMatch) {
    // inside a word → replace that word
    const fullWordStart = pos - beforeWordMatch[1].length;
    const fullWordEnd = pos + afterWordMatch[1].length;
    newText = text.substring(0, fullWordStart) + word + " " + text.substring(fullWordEnd);
    cursorPos = fullWordStart + word.length + 1;
  } else if (beforeWordMatch && /\S$/.test(before)) {
    // end of a word (cursor right after one) → add new word
    newText = before + " " + word + " " + after;
    cursorPos = before.length + word.length + 2;
  } else {
    // otherwise just insert
    newText = before + word + " " + after;
    cursorPos = before.length + word.length + 1;
  } 

  $input.val(newText);
  inputEl.selectionStart = inputEl.selectionEnd = cursorPos;
  $input.focus();

  // sync with #lyrics
  const lines = newText.split("\n");
  const $lyrics = $("#lyrics").empty();
  lines.forEach(line => {
    if (line.trim() === "") $lyrics.append("<br>");
    else $lyrics.append("<p>" + line + "</p>");
  });

  setTimeout(saveLyrics, 300);
});

    $("#lyrics").contents().each(function() {
        if (this.nodeType === 1) { // element node
            if (this.tagName === "P") {
                var $p = $(this);
                var spanText = $p.find("span").text().trim();
                spanText = spanText.replace(/^\[|\]$/g, "");

                var text = $p.clone().find("span").remove().end().text().trim();

                var pTag = "<p";
                if (spanText) pTag += ' data-minutes="' + spanText + '"';
                pTag += ">" + text + "</p>";

                output += pTag + "\n";
                lastWasBR = false;

            } else if (this.tagName === "BR") {
                if (!lastWasBR) { // prevent double <br>
                    output += "<br>\n";
                    lastWasBR = true;
                }
            }
        }
    });

    // remove trailing <br> at the end
    output = output.replace(/(<br>\s*)+$/i, "");

    navigator.clipboard.writeText(output).then(function() {
        console.log("Lyrics copied!");
    }).catch(function(err) {
        console.error("Failed to copy: ", err);
    });
});

    
    
    $("#menu-btn").click(function() {
      $(this).toggleClass("open");
      $("#metadata").toggleClass("go");
    });


});


</script>

        }
    });

    // create a Blob
    var blob = new Blob([lrcContent], { type: "text/plain;charset=utf-8" });
    var url = URL.createObjectURL(blob);

    // create temporary link to trigger download
    var a = document.createElement("a");
    a.href = url;
    a.download = "lyrics.lrc";
