@property --shimmer {
  syntax: "<angle>";
  inherits: false;
  initial-value: 33deg;
}

@keyframes shimmer {
  0% { --shimmer: 0deg; }
  100% { --shimmer: 360deg; }
}

@keyframes shine {
  0% { opacity: 0; }
  15% { opacity: 1; }
  55% { opacity: 1; }
  100% { opacity: 0; }
}

@keyframes text {
  0% { background-position: 100% center; }
  100% { background-position: -100% center; }
}

@keyframes floatParticle {
  0%, 100% { transform: translate(0, 0) scale(1); opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  50% { transform: translate(var(--tx), var(--ty)) scale(var(--s)); }
}

@keyframes auraPulse {
  0% { transform: scale(1) rotate(0deg); opacity: 0.3; }
  33% { transform: scale(1.1) rotate(120deg); opacity: 0.5; }
  66% { transform: scale(0.95) rotate(240deg); opacity: 0.35; }
  100% { transform: scale(1) rotate(360deg); opacity: 0.3; }
}

@keyframes karaokeFill {
  0% { background-size: 0% 100%; }
  100% { background-size: 100% 100%; }
}

@keyframes breathe {
  0%, 100% { box-shadow: 0 0 20px var(--pink-soft), inset 0 0 20px transparent; }
  50% { box-shadow: 0 0 40px var(--pink-glow), inset 0 0 30px var(--pink-soft); }
}

@keyframes progressGlow {
  0%, 100% { filter: brightness(1); }
  50% { filter: brightness(1.3); }
}

@keyframes toastIn {
  from { transform: translate(-50%, 20px); opacity: 0; filter: blur(4px); }
  to { transform: translate(-50%, 0); opacity: 1; filter: blur(0px); }
}

@keyframes toastOut {
  from { transform: translate(-50%, 0); opacity: 1; }
  to { transform: translate(-50%, -10px); opacity: 0; }
}

@keyframes vibeRing {
  0% { transform: scale(0.8); opacity: 0.6; }
  50% { transform: scale(1.05); opacity: 1; }
  100% { transform: scale(0.8); opacity: 0.6; }

(function() {
  var canvas = document.getElementById("particles-canvas");
  var ctx = canvas.getContext("2d");
  var particles = [];
  var particleCount = 40;

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resizeCanvas();
  window.addEventListener("resize", resizeCanvas);

  function Particle() {
    this.reset();
  }

  Particle.prototype.reset = function() {
    this.x = Math.random() * canvas.width;
    this.y = Math.random() * canvas.height;
    this.size = Math.random() * 2 + 0.5;
    this.speedX = (Math.random() - 0.5) * 0.3;
    this.speedY = (Math.random() - 0.5) * 0.2 - 0.1;
    this.opacity = Math.random() * 0.4 + 0.1;
    this.life = 0;
    this.maxLife = Math.random() * 600 + 300;
  };

  Particle.prototype.update = function() {
    this.x += this.speedX;
    this.y += this.speedY;
    this.life++;
    var progress = this.life / this.maxLife;
    this.currentOpacity = this.opacity * Math.sin(progress * Math.PI);
    if (this.life >= this.maxLife || this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
      this.reset();
    }
  };

  Particle.prototype.draw = function() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255, 255, 255, " + this.currentOpacity + ")";
    ctx.fill();
  };

  for (var i = 0; i < particleCount; i++) {
    var p = new Particle();
    p.life = Math.floor(Math.random() * p.maxLife);
    particles.push(p);
  }

  function animateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (var i = 0; i < particles.length; i++) {
      particles[i].update();
      particles[i].draw();
    }
    requestAnimationFrame(animateParticles);
  }
  animateParticles();
})();


var audioCtx, analyser, source, dataArray, visualizerConnected = false;
var vizCanvas = document.getElementById("visualizer-canvas");
var vizCtx = vizCanvas.getContext("2d");

function resizeViz() {
  vizCanvas.width = window.innerWidth;
  vizCanvas.height = 120;
}
resizeViz();
window.addEventListener("resize", resizeViz);

function connectVisualizer() {
  if (visualizerConnected) return;
  var player = document.getElementById("player");
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    source = audioCtx.createMediaElementSource(player);
    source.connect(analyser);
    analyser.connect(audioCtx.destination);
    dataArray = new Uint8Array(analyser.frequencyBinCount);
    visualizerConnected = true;
    drawVisualizer();
  } catch(e) {}
}

function drawVisualizer() {
  if (!analyser) return;
  requestAnimationFrame(drawVisualizer);
  analyser.getByteFrequencyData(dataArray);
  vizCtx.clearRect(0, 0, vizCanvas.width, vizCanvas.height);

  var barCount = 64;
  var barWidth = vizCanvas.width / barCount;
  var pinkStyle = getComputedStyle(document.documentElement).getPropertyValue("--pink").trim();

  for (var i = 0; i < barCount; i++) {
    var idx = Math.floor(i * (dataArray.length / barCount));
    var val = dataArray[idx] / 255;
    var h = val * vizCanvas.height * 0.8;
    var alpha = val * 0.6;
    vizCtx.fillStyle = pinkStyle.replace("rgb", "rgba").replace(")", ", " + alpha + ")");
    var x = i * barWidth;
    var radius = barWidth * 0.3;
    vizCtx.beginPath();
    vizCtx.moveTo(x + radius, vizCanvas.height - h);
    vizCtx.lineTo(x + barWidth - radius, vizCanvas.height - h);
    vizCtx.quadraticCurveTo(x + barWidth, vizCanvas.height - h, x + barWidth, vizCanvas.height - h + radius);
    vizCtx.lineTo(x + barWidth, vizCanvas.height);
    vizCtx.lineTo(x, vizCanvas.height);
    vizCtx.lineTo(x, vizCanvas.height - h + radius);
    vizCtx.quadraticCurveTo(x, vizCanvas.height - h, x + radius, vizCanvas.height - h);
    vizCtx.fill();
  }
}

    function saveLyrics() {
  const text = $("#input").val();
  const lines = text.split("\n");
  const lyricsData = [];

  lines.forEach(function(line) {
    if (line === "") {
      lyricsData.push({ type: "br", text: "", classes: "" });
      return;
    }

    let isSet = false;
    if (line.startsWith("*")) {
      isSet = true;
      line = line.slice(1);
    }

    line = line.replace(/\r/g, "");

    const match = line.match(/^(\[?\d{2}:\d{2}\.\d{2}\]?)(.*)/);
    let timestamp = "";
    let body = line;
    if (match) {
      timestamp = match[1];
      body = match[2].trim();
      if (!timestamp.startsWith("[")) timestamp = "[" + timestamp + "]";
    }

    const classes = isSet ? "set" : "";
    const html = "<span>" + (timestamp || "") + "</span> " + body;
    lyricsData.push({ type: "p", text: html, classes: classes });
  });

  localStorage.setItem("lyricsData", JSON.stringify(lyricsData));
}

function loadSavedAudio() {

        return;

    let tx = db.transaction("files", "readonly");
    let store = tx.objectStore("files");
    let getReq = store.get("savedAudio");

    getReq.onsuccess = function(e) {

function parseTimeString(s) {
    if (!s) return 0;
    s = s.replace(/[\[\]]/g, "");
    var m = s.match(/(\d+):(\d+)(?:\.(\d+))?/);
    if (!m) return 0;
    var min = parseInt(m[1], 10);
    var sec = parseInt(m[2], 10);
    var frac = m[3] ? parseInt(m[3], 10) / Math.pow(10, m[3].length) : 0;
    return min * 60 + sec + frac;
}

function formatTime(time) {
    var minutes = Math.floor(time / 60);
    var seconds = Math.floor(time % 60);
    var milliseconds = Math.floor((time % 1) * 100);
    return ("0" + minutes).slice(-2) + ":" + ("0" + seconds).slice(-2) + "." + ("0" + milliseconds).slice(-2);
}

function getTimeFromP($p) {
    var spanText = $p.find("span").text().trim();
    if (spanText) return parseTimeString(spanText);
    return NaN;
}

function syncLyrics() {
  if ($("#text").css("display") === "none") { 
    var current = player.currentTime;
    var isRecording = $("#next-line").hasClass("go");

    $("#lyrics p").removeClass("sync");

    var $validLyrics = $("#lyrics p").filter(function() {
        var text = $(this).clone().children("span").remove().end().text().trim();
        var time = getTimeFromP($(this));
        return !/^\s*\[.*?\]\s*$/.test(text) && !isNaN(time);
    });

    $validLyrics.each(function(index) {
        var $this = $(this);
        var start = getTimeFromP($this);
        var next = $validLyrics.eq(index + 1);
        var end = next.length ? getTimeFromP(next) : Number.POSITIVE_INFINITY;

        if (current >= start && current < end) {
            $this.addClass("sync"); 

            if (!isRecording && autoScrollEnabled && index !== $validLyrics.length - 1) {
                let target = $this.position().top - 5 + $("#lyrics").scrollTop() - $("#lyrics").height()/2;
                gsap.to("#lyrics", { scrollTop: target, duration: 0.5, ease: "power2.out" });
            }

            if (isRecording && $this.hasClass("selected") && !$this.hasClass("set")) {
                $this.find("span").html("[" + formatTime(current) + "]");
            }

            return false;
        }
    });
    
      } 
}

   function getWordAtCaret($input) {
  const el = $input[0];
  const text = $input.val();
  const pos = el.selectionStart || 0;

  let start = pos;
  while (start > 0 && !/\s/.test(text[start-1])) start--;

  let end = pos;
  while (end < text.length && !/\s/.test(text[end])) end++;

  let word = text.slice(start, end);
  if (!word && start > 0) {
    let prevEnd = start;
    let prevStart = prevEnd;
    while (prevStart > 0 && !/\s/.test(text[prevStart-1])) prevStart--;
    word = text.slice(prevStart, prevEnd);
  }

  return (word || "").replace(/[^\w]/g,"").toLowerCase();
}

let timeout;
function scheduleGetRhymes() {
  clearTimeout(timeout);
  timeout = setTimeout(getRhymesForCaret, 200);
}

  const pos = inputEl.selectionStart;
  const before = text.substring(0, pos);
  const after = text.substring(pos);

  const beforeWordMatch = before.match(/(\S+)$/); 
  const afterWordMatch = after.match(/^(\S+)/);   

  let newText, cursorPos;

  if (beforeWordMatch && afterWordMatch) {
    const fullWordStart = pos - beforeWordMatch[1].length;
    const fullWordEnd = pos + afterWordMatch[1].length;
    newText = text.substring(0, fullWordStart) + word + " " + text.substring(fullWordEnd);
    cursorPos = fullWordStart + word.length + 1;
  } else if (beforeWordMatch && /\S$/.test(before)) {
    newText = before + " " + word + " " + after;
    cursorPos = before.length + word.length + 2;
  } else {
    newText = before + word + " " + after;
    cursorPos = before.length + word.length + 1;
  } 

  $input.val(newText);
  inputEl.selectionStart = inputEl.selectionEnd = cursorPos;
  $input.focus();

  const lines = newText.split("\n");
  const $lyrics = $("#lyrics").empty();
  lines.forEach(line => {

const $rhymes = $("#rhymes");

const $input = $("#input");
const padding = 30;
let repositionTimeout;
let latestCoords = { x: 0, y: 0 };

function showRhymesAt(x, y, smooth = true) {
  latestCoords = { x, y };
  const popupWidth = $rhymes.outerWidth();
  const popupHeight = $rhymes.outerHeight() || 50;
  const vv = window.visualViewport;

  clearTimeout(repositionTimeout);
  $rhymes.find(".contain").scrollLeft(0);

  repositionTimeout = setTimeout(() => {
    const viewportOffsetY = vv ? vv.offsetTop : 0;
    const viewportHeight = vv ? vv.height : window.innerHeight;
    const viewportWidth = vv ? vv.width : window.innerWidth;

    let left = x - popupWidth / 2;
    let top = y - popupHeight - padding - viewportOffsetY;

    const bottomLimit = viewportHeight - popupHeight - padding;
    if (top > bottomLimit) top = bottomLimit;
    if (top < padding) top = padding;

    if (left < padding) left = padding;
    if (left + popupWidth > viewportWidth - padding)
      left = viewportWidth - popupWidth - padding;

    const transform = `translate3d(${left}px, ${top}px, 0)`;
    $rhymes.css({
      transform,
      transition: smooth
        ? "opacity 0.25s ease, transform 0.25s cubic-bezier(0.22, 1, 0.36, 1)"
        : "none"
    });

    requestAnimationFrame(() => $rhymes.addClass("go"));
  }, 350);

            $lyrics.eq(0).addClass("selected").removeClass("no").siblings().removeClass("selected").addClass("no");
        } else {
            $selected.removeClass("no").siblings().removeClass("selected").addClass("no");
        }
    }

    if (player.src && $("#text").css("display") === "none") {
        $(this).addClass("go").attr("data-status", "next line").find("span").text("Next line");
        $("#lyrics").attr("data-status", "record");
        playAudio();
    }

    setTimeout(function() {
        $lyrics.each(function() {
            if (!$(this).hasClass("selected")) $(this).addClass("no");
        });
    }, 200);

    $lyrics.filter(".selected").removeClass("no-time");
});



    $("#lyrics").hide(); 
 
    
    if ($("#lyrics").css("display") === "none") {
    $("button[for='lyrics']").addClass("inactive");
      }
    
    
    $("#clear-time").click(function() {
      $("#lyrics p.clicked:not(.set) span").text("");
      $("#lyrics p.clicked").addClass("no-time").removeClass("clicked");
      
      setTimeout(function() {
        if ( $("#lyrics p.selected").length ) {
          $("#clear-time").addClass("inactive");
        }
      }, 200);
    });
    
    
    $("#download").click(function() {
    var output = "";
    var lastWasBR = false;

    $("#lyrics").contents().each(function() {
        if (this.nodeType === 1) {
            if (this.tagName === "P") {
                var $p = $(this);
                var spanText = $p.find("span").text().trim();
                spanText = spanText.replace(/^\[|\]$/g, "");

                var text = $p.clone().find("span").remove().end().text().trim();

                var pTag = "<p";
                if (spanText) pTag += ' data-minutes="' + spanText + '"';
                pTag += ">" + text + "</p>";

                output += pTag + "\n";
                lastWasBR = false;

            } else if (this.tagName === "BR") {
                if (!lastWasBR) {
                    output += "<br>\n";
                    lastWasBR = true;
                }
            }
        }
    });

    output = output.replace(/(<br>\s*)+$/i, "");

    navigator.clipboard.writeText(output).then(function() {
        showToast("Lyrics copied to clipboard", "copy");
    }).catch(function(err) {
        showToast("Copy failed", "xmark");
    });
});

    
    
    $("#menu-btn").click(function() {
      $(this).toggleClass("open");
      $("#metadata").toggleClass("go");
    });


});


</script>
      
      
      <script>
            $("#lrc").click(function() {
    var lrcContent = "";

    $("#lyrics p").each(function() {
        var line = $(this).text().trim();
        if (line) {
            lrcContent += line + "\n";
        }
    });

    var trackName = $("#meta_track").val().trim() || "lyrics";
    var blob = new Blob([lrcContent], { type: "text/plain;charset=utf-8" });
    var url = URL.createObjectURL(blob);

    var a = document.createElement("a");
    a.href = url;
    a.download = trackName.replace(/\s+/g, "_") + ".lrc";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast("LRC file downloaded", "download");
});

          $("#song-list").on("click", ".item button", function() {
  var $item = $(this).closest(".item");
  var artistText = $item.find(".artist").text().trim().toLowerCase();
  var trackText = $item.find(".name").text().trim().toLowerCase();
            
            $("#metadata #meta_artist").val($item.find(".artist").text());
            $("#metadata #meta_track").val($item.find(".name").text());
            $("#metadata #meta_album").val($item.find(".album").text());

  $("#input").val("");

  $.get("/content/lyrics.html", function(data) {
    var $html = $("<div>").html(data);

    var $lyric = $html.find(".lyric").filter(function() {
      var dataArtists = $(this).attr("data-artist") ? $(this).attr("data-artist").trim().toLowerCase() : "";
      var dataTrack = $(this).attr("data-track") ? $(this).attr("data-track").trim().toLowerCase() : "";

      var artistList = dataArtists.split(",").map(a=>a.trim());
      var artistMatch = artistList.some(a=>artistText.includes(a));

      return artistMatch && dataTrack === trackText;
    });

    if ($lyric.length) {
      var lines = [];
      $lyric.contents().each(function() {
        if (this.nodeName === "P") lines.push($(this).text().trim());
        else if (this.nodeName === "BR") lines.push("");
      });
      
      if ( $("#lyrics").css("display") === "block" ) {
        $("#next").click();
      }

      $("#song-list").removeClass("go");

      $("#input").val(lines.join("\n"));
      updateStats();

      $.get("/", function(mainData) {
        var $main = $("<div>").html(mainData);

        var $songDiv = $main.find("#music .tracks .grid .song").filter(function() {
          var songArtists = $(this).attr("data-artist") ? $(this).attr("data-artist").trim().toLowerCase() : "";
          var songTrack = $(this).attr("data-track") ? $(this).attr("data-track").trim().toLowerCase() : "";

          var songArtistList = songArtists.split(",").map(a=>a.trim());
          var artistMatch = songArtistList.some(a=>artistText.includes(a));

          return artistMatch && songTrack === trackText;
        });

        if ($songDiv.length) {
          var mp3 = $songDiv.attr("data-mp3");
          if (mp3) {
            $("#player")[0].src = mp3;
            localStorage.removeItem("audioReady");
            localStorage.setItem("audioReady", "true");
            $("#audio-btn").attr("data-status", "play").html('<i class="fa-solid fa-play"></i>');
            $("#player").attr("src", mp3)[0].load();
            $("#next").removeClass("inactive");
            $("#audio-progress").addClass("visible");
            $("#time-display").addClass("visible");
          } else {
            $("#audio-btn i").removeClass().addClass("fa-solid fa-arrow-up-from-bracket");
      $("#audio-btn").attr("data-status", "upload");
            $("#next-line").addClass("inactive");
            $("#lyrics").hide();
            $("#text").show();
          }
        }
      });
    } else {
      $item.addClass("error");
      $item.append('<div class="error"><x>Error</x></div>');
    }
  });
});


          
          
});

      </script>

      <script>

$("#theme-picker .theme-dot").click(function() {
  var color = $(this).data("color");
  document.documentElement.style.setProperty("--pink", color);
  var r = color.match(/\d+/g);
  if (r) {
    document.documentElement.style.setProperty("--pink-glow", "rgba(" + r[0] + "," + r[1] + "," + r[2] + ",0.4)");
    document.documentElement.style.setProperty("--pink-soft", "rgba(" + r[0] + "," + r[1] + "," + r[2] + ",0.15)");
  }
  localStorage.setItem("favColor", color);
  $(this).addClass("active").siblings().removeClass("active");
  gsap.fromTo(this, { scale: 0.5 }, { scale: 1, duration: 0.4, ease: "back.out(3)" });
});

$("#fullscreen-btn").click(function() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(function(){});
    $(this).find("i").removeClass().addClass("fa-solid fa-compress");
  } else {
    document.exitFullscreen();
    $(this).find("i").removeClass().addClass("fa-solid fa-expand");
  }
});

$("#autoscroll-toggle").click(function() {
  autoScrollEnabled = !autoScrollEnabled;
  $(this).toggleClass("active");
  showToast(autoScrollEnabled ? "Auto-scroll on" : "Auto-scroll off", "arrow-down");
});

$(document).on("keydown", function(e) {
  var tag = (e.target.tagName || "").toLowerCase();
  var isInput = tag === "input" || tag === "textarea";

  if (e.key === "?" && !isInput) {
    e.preventDefault();
    var $h = $("#shortcuts-hint");
    if ($h.css("display") === "none") {
      $h.css("display", "block");
      gsap.fromTo($h[0], { opacity: 0, y: 15, scale: 0.95 }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "power3.out" });
    } else {
      gsap.to($h[0], { opacity: 0, y: 10, duration: 0.2, ease: "power2.in", onComplete: function() { $h.css("display", "none"); } });
    }
    return;
  }

  if (e.key === "Escape") {
    $("#shortcuts-hint").css("display", "none");
    return;
  }

  if (e.key === "f" && !isInput) {
    e.preventDefault();
    $("#fullscreen-btn").click();
    return;
  }

  if (e.key === " " && !isInput) {
    e.preventDefault();
    $("#audio-btn").click();
    return;
  }

  if (e.ctrlKey && e.key === "s") {
    e.preventDefault();
    $("#save").click();
    return;
  }

  if (e.ctrlKey && e.key === "ArrowRight") {
    e.preventDefault();
    $("#next").click();
    return;
  }

  if (e.key === "ArrowDown" && !isInput && $("#lyrics").css("display") === "block") {
    e.preventDefault();
    if (!$("#next-line").hasClass("inactive")) {
      $("#next-line").click();
    }
    return;
  }
});

      </script>
