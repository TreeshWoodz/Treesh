:root {
  --accent: rgb(241,64,64);
  --accent-glow: rgba(241,64,64,0.35);
  --accent-soft: rgba(241,64,64,0.12);
  --accent-dim: rgba(241,64,64,0.06);
  --bg: #06060c;
  --bg-2: #0c0c14;
  --surface: rgba(255,255,255,0.04);
  --surface-2: rgba(255,255,255,0.07);
  --surface-3: rgba(255,255,255,0.11);
  --border: rgba(255,255,255,0.08);
  --border-2: rgba(255,255,255,0.14);
  --text: rgba(255,255,255,0.92);
  --text-2: rgba(255,255,255,0.55);
  --text-3: rgba(255,255,255,0.3);
  --glass: rgba(12,12,20,0.82);
  --glass-2: rgba(18,18,28,0.92);
  --radius: 20px;
  --radius-sm: 12px;
  --radius-pill: 50px;
  --main-font: "Manrope", sans-serif;
  --type-font: "Playwrite AU TAS", cursive;
  --brand-font: "Special Gothic Expanded One", sans-serif;
  --ease: cubic-bezier(0.16,1,0.3,1);
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
html, body { width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:var(--main-font); font-size:15px; user-select:none; -webkit-user-select:none; }

canvas#particles { position:fixed; inset:0; z-index:0; pointer-events:none; opacity:0.5; }
canvas#visualizer { position:fixed; bottom:0; left:0; width:100%; height:100px; z-index:1; pointer-events:none; opacity:0; transition:opacity 0.8s var(--ease); }
canvas#visualizer.on { opacity:0.35; }

.aura { position:fixed; inset:0; z-index:0; pointer-events:none;
  background: radial-gradient(ellipse 60% 50% at 20% 50%, var(--accent-soft), transparent),
              radial-gradient(ellipse 50% 60% at 80% 30%, rgba(80,40,160,0.06), transparent),
              radial-gradient(ellipse 70% 40% at 50% 90%, rgba(40,80,180,0.04), transparent);
  filter:blur(80px); animation:auraMove 25s ease-in-out infinite alternate; }
@keyframes auraMove { 0%{transform:scale(1) rotate(0deg)} 50%{transform:scale(1.08) rotate(3deg)} 100%{transform:scale(1) rotate(-2deg)} }

  background-size:128px; }

     background:linear-gradient(to bottom, var(--bg), transparent);

#nav { position:fixed; top:0; left:0; right:0; height:52px; z-index:20; display:flex; align-items:center; justify-content:space-between; padding:0 20px; }

#tab-bar { position:fixed; top:52px; left:0; right:0; height:40px; z-index:20; display:flex; align-items:center; gap:0; padding:0 4px; background:linear-gradient(to bottom, rgba(6,6,12,0.95), rgba(6,6,12,0.7)); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-bottom:1px solid var(--border); }

#tab-new { width:28px; height:28px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--text-3); font-size:0.65rem; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all 0.3s var(--ease); margin-left:2px; }

#progress-bar { position:fixed; top:92px; left:0; width:100%; height:2px; z-index:20; background:var(--surface); cursor:pointer; opacity:0; transition:opacity 0.4s ease, height 0.15s ease; }

#time-badge { position:fixed; top:98px; right:16px; z-index:20; font-size:0.6rem; font-weight:700; color:var(--text-3); letter-spacing:0.8px; font-variant-numeric:tabular-nums; opacity:0; transition:opacity 0.4s ease; }

#container { position:relative; width:100%; height:100%; z-index:2; }

#lyrics p:not(.no-lyrics) { padding:22px 16px; padding-top:48px; width:calc(100% - 32px); max-width:520px; margin:12px auto 0; text-align:center; position:relative; cursor:pointer; z-index:3; border-radius:var(--radius); border:1px solid var(--border); background:var(--surface); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); box-shadow:0 4px 20px rgba(0,0,0,0.15), inset 0 1px 0 rgba(255,255,255,0.04); transform:scale(0.96); overflow:hidden; transition:all 0.5s var(--ease); }

#lyrics p:not(.no-lyrics).selected { background:rgba(0,0,0,0.35); border-color:var(--accent); box-shadow:0 0 50px var(--accent-glow); animation:selPulse 2.5s ease-in-out infinite; }

@keyframes toastA { 0%{opacity:0;transform:translateX(-50%) translateY(12px) scale(0.95)} 12%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)} 80%{opacity:1} 100%{opacity:0;transform:translateX(-50%) translateY(-8px)} }

.audio-mgr { display:inline-flex; border-radius:var(--radius-sm); overflow:hidden; border:1px solid var(--border); background:var(--surface); transition:all 0.4s var(--ease); }

<script>
gsap.registerPlugin(ScrollToPlugin,TextPlugin,Flip);

(function(){var c=document.getElementById("particles"),x=c.getContext("2d"),ps=[];function rs(){c.width=innerWidth;c.height=innerHeight}rs();addEventListener("resize",rs);function P(){this.r()}P.prototype.r=function(){this.x=Math.random()*c.width;this.y=Math.random()*c.height;this.sz=Math.random()*1.8+0.3;this.vx=(Math.random()-0.5)*0.25;this.vy=(Math.random()-0.5)*0.15-0.08;this.o=Math.random()*0.35+0.05;this.l=0;this.ml=Math.random()*700+300};P.prototype.u=function(){this.x+=this.vx;this.y+=this.vy;this.l++;var p=this.l/this.ml;this.co=this.o*Math.sin(p*Math.PI);if(this.l>=this.ml||this.x<0||this.x>c.width||this.y<0||this.y>c.height)this.r()};P.prototype.d=function(){x.beginPath();x.arc(this.x,this.y,this.sz,0,Math.PI*2);x.fillStyle="rgba(255,255,255,"+this.co+")";x.fill()};for(var i=0;i<35;i++){var p=new P();p.l=Math.floor(Math.random()*p.ml);ps.push(p)}(function a(){x.clearRect(0,0,c.width,c.height);for(var i=0;i<ps.length;i++){ps[i].u();ps[i].d()}requestAnimationFrame(a)})()})();

var audioCtx,analyser,vizSource,vizData,vizConnected=false;var vc=document.getElementById("visualizer"),vx=vc.getContext("2d");
function rvz(){vc.width=innerWidth;vc.height=100}rvz();addEventListener("resize",rvz);
function connectViz(){if(vizConnected)return;var p=document.getElementById("player");try{audioCtx=new(AudioContext||webkitAudioContext);analyser=audioCtx.createAnalyser();analyser.fftSize=256;vizSource=audioCtx.createMediaElementSource(p);vizSource.connect(analyser);analyser.connect(audioCtx.destination);vizData=new Uint8Array(analyser.frequencyBinCount);vizConnected=true;drawViz()}catch(e){}}
function drawViz(){if(!analyser)return;requestAnimationFrame(drawViz);analyser.getByteFrequencyData(vizData);vx.clearRect(0,0,vc.width,vc.height);var n=48,bw=vc.width/n;var cs=getComputedStyle(document.documentElement).getPropertyValue("--accent").trim();for(var i=0;i<n;i++){var idx=Math.floor(i*(vizData.length/n)),v=vizData[idx]/255,h=v*vc.height*0.75,a=v*0.5;vx.fillStyle=cs.replace("rgb","rgba").replace(")",","+a+")");var xx=i*bw,r=bw*0.35;vx.beginPath();vx.moveTo(xx+r,vc.height-h);vx.lineTo(xx+bw-r,vc.height-h);vx.quadraticCurveTo(xx+bw,vc.height-h,xx+bw,vc.height-h+r);vx.lineTo(xx+bw,vc.height);vx.lineTo(xx,vc.height);vx.lineTo(xx,vc.height-h+r);vx.quadraticCurveTo(xx,vc.height-h,xx+r,vc.height-h);vx.fill()}}

function toast(m,i){$(".toast").remove();$("body").append('<div class="toast"><i class="fa-solid fa-'+(i||"check")+'"></i> '+m+'</div>');setTimeout(function(){$(".toast").remove()},2800)}
function updateStats(){var t=$("#input").val()||"",l=t.split("\n").filter(function(x){return x.trim()!==""}),w=t.trim()===""?0:t.trim().split(/\s+/).length;$("#st-lines").text(l.length);$("#st-words").text(w)}
function fmtTime(t){if(isNaN(t))return"0:00";var m=Math.floor(t/60),s=Math.floor(t%60);return m+":"+(s<10?"0":"")+s}
function fmtLRC(t){var m=Math.floor(t/60),s=Math.floor(t%60),ms=Math.floor((t%1)*100);return("0"+m).slice(-2)+":"+("0"+s).slice(-2)+"."+("0"+ms).slice(-2)}
function parseTS(s){if(!s)return 0;s=s.replace(/[\[\]]/g,"");var m=s.match(/(\d+):(\d+)(?:\.(\d+))?/);if(!m)return 0;return parseInt(m[1])*60+parseInt(m[2])+(m[3]?parseInt(m[3])/Math.pow(10,m[3].length):0)}
function getTP($p){var s=$p.find("span").first().text().trim();if(s)return parseTS(s);return NaN}
function setAccent(c){document.documentElement.style.setProperty("--accent",c);var r=c.match(/\d+/g);if(r){document.documentElement.style.setProperty("--accent-glow","rgba("+r[0]+","+r[1]+","+r[2]+",0.35)");document.documentElement.style.setProperty("--accent-soft","rgba("+r[0]+","+r[1]+","+r[2]+",0.12)");document.documentElement.style.setProperty("--accent-dim","rgba("+r[0]+","+r[1]+","+r[2]+",0.06)")}dbPut("prefs","favColor",c)}
function enableBtn(s){$(s).prop("disabled",false).removeClass("inactive")}
function disableBtn(s){$(s).prop("disabled",true).addClass("inactive")}

var inStudio=false,player=document.getElementById("player"),db,currentFileId=null;

var DB_NAME="LyricFlowDB",DB_VER=2;
function openDB(cb){var req=indexedDB.open(DB_NAME,DB_VER);req.onupgradeneeded=function(e){var d=e.target.result;if(!d.objectStoreNames.contains("files"))d.createObjectStore("files");if(!d.objectStoreNames.contains("prefs"))d.createObjectStore("prefs");if(!d.objectStoreNames.contains("library"))d.createObjectStore("library",{keyPath:"id"})};req.onsuccess=function(e){db=e.target.result;if(cb)cb()};req.onerror=function(){}}

function dbPut(store,key,val,cb){if(!db)return;var tx=db.transaction(store,"readwrite");var req=tx.objectStore(store).put(val,key);if(cb)req.onsuccess=function(){cb()}}
function dbGet(store,key,cb){if(!db)return;var tx=db.transaction(store,"readonly");var req=tx.objectStore(store).get(key);req.onsuccess=function(){cb(req.result)};req.onerror=function(){cb(undefined)}}
function dbDel(store,key,cb){if(!db)return;var tx=db.transaction(store,"readwrite");var req=tx.objectStore(store).delete(key);if(cb)req.onsuccess=function(){cb()}}
function dbGetAll(store,cb){if(!db)return;var tx=db.transaction(store,"readonly");var req=tx.objectStore(store).getAll();req.onsuccess=function(){cb(req.result||[])};req.onerror=function(){cb([])}}

$("#next").click(function () {
  if ($(this).prop("disabled")) return;

  const $btn = $(this);
  const isNext = $btn.attr("data-status") === "next";

  if (isNext) {
    enterStudio($btn);
  } else {

  }
});

function enterStudio($btn) {
  inStudio = true;

  $("#text").hide();
  $("#lyrics").show();
  
  gsap.to("#studio-controls", {
    height: "auto",
    duration: 0.3,
    opacity: 1,
    ease:"power1.in"
  });

  $btn
    .attr("data-status", "back")
    .find("i").removeClass().addClass("fa-solid fa-arrow-left");
  $btn.find("span").text("Back");

  if (player.src) enableBtn("#next-line");
  if ($("#lyrics p.set, #lyrics p.selected, #lyrics p.clicked").length) {
    enableBtn("#refresh");
  }

  const lines = $("#input").val().split("\n");
  const $existing = $("#lyrics p, #lyrics br");
  const existingLen = $existing.length;

  $existing.each(function (i) {
    updateLyricsNode(this, lines[i] || "");
  });

  for (let i = existingLen; i < lines.length; i++) {
    appendLyricsLine(lines[i]);
  }

  $("#lyrics p").each(function () {
    const $p = $(this);
    const time = $p.find("span").first().text().trim();
    const text = $p.clone().children("span").remove().end().text().trim();

    $p.toggleClass("no-time", !time);
    $p.toggleClass("no-lyrics", !text);
  });

  addDurations();

  gsap.fromTo(
    "#lyrics p:not(.no-lyrics)",
    { y: 25, opacity: 0, scale: 0.92 },
    {
      y: 0,
      opacity: 1,
      scale: 0.96,
      stagger: 0.035,
      duration: 0.45,
      ease: "power3.out"
    }
  );
}

function exitStudio($btn) {
  inStudio = false;

  gsap.to("#studio-controls", {
    height: 0,
    duration: 0.3,
    opacity: 0,
    ease:"power1.in"
  });
  
  $("#lyrics")
    .attr("data-status", "normal")
    .find("p")
    .removeClass("clicked no selected sync");

  let inputText = "";

  $("#lyrics").contents().each(function () {
    if (this.nodeType !== 1) return;

    if (this.tagName === "P") {
      const $p = $(this);
      const time = $p.find("span").first().text().trim();
      const text = $p.clone().children("span").remove().end().text().trim();

      let line = "";
      if ($p.hasClass("set")) line += "*";
      if (time) line += time + " ";
      line += text;

      inputText += line + "\n";
    }

    if (this.tagName === "BR") {
      inputText += "\n";
    }
  });

  $("#input").val(inputText);
  $("#text").show();
  $("#lyrics").hide();

  $btn
    .attr("data-status", "next")
    .find("i").removeClass().addClass("fa-solid fa-arrow-right");
  $btn.find("span").text("Studio");

  disableBtn("#next-line");
  $("#next-line")
    .removeClass("rec-on")
    .attr("data-status", "record")
    .find("span").text("Record");

  disableBtn("#refresh");
  disableBtn("#set");
  disableBtn("#clear-time");
}

function updateLyricsNode(node, rawLine) {
  let line = rawLine.trim();
  let isSet = false;

  if (line.startsWith("*")) {
    isSet = true;
    line = line.slice(1).trim();
  }

  if (!line) {
    if (node.tagName === "P") $(node).replaceWith("<br>");
    return;
  }

  const { time, text } = parseLine(line);

  if (node.tagName === "P") {
    $(node).html(`<span>${time}</span> ${text}`);
    if (isSet) $(node).addClass("set");
  } else if (node.tagName === "BR") {
    const $p = $(`<p><span>${time}</span> ${text}</p>`);
    if (isSet) $p.addClass("set");
    $(node).replaceWith($p);
  }
}

function appendLyricsLine(rawLine) {
  let line = rawLine.trim();
  let isSet = false;

  if (line.startsWith("*")) {
    isSet = true;
    line = line.slice(1).trim();
  }

  if (!line) {
    $("#lyrics").append("<br>");
    return;
  }

  const { time, text } = parseLine(line);
  const $p = $(`<p><span>${time}</span> ${text}</p>`);
  if (isSet) $p.addClass("set");

  $("#lyrics").append($p);
}

function parseLine(line) {
  const match = line.match(/^(\[?\d{2}:\d{2}\.\d{2}\]?)(.*)/);

  if (!match) {
    return { time: "", text: line };
  }

  let time = match[1];
  if (!time.startsWith("[")) time = `[${time}]`;

  return {
    time,
    text: match[2].trim()
  };
}
