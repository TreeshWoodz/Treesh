<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Special+Gothic+Expanded+One&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Doto:wght@100..900&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Playwrite+AU+TAS:wght@100..400&display=swap');

:root {
  --gold: #c3ab69;
  --black: #000;
  --white: #fff;
  --pink: rgb(241, 64, 64);
  --background: black;
  --navBarHeight: 540px;
  --waveHeight: 100px;
  --purple: #9328ff;
  --main-font: "Manrope", sans-serif;
  --type-font: "Playwrite AU TAS", cursive;
  --savionce-font: "Special Gothic Expanded One", sans-serif;
  --glow-hue: 300deg;
  --lg-bg-color: rgba(255, 255, 255, 0.15);
  --lg-highlight: rgba(255, 255, 255, 0.75);
  --shadow-hue: 180deg;
  --spring-easing: linear(
    0, 0.002, 0.01 0.9%, 0.038 1.8%, 0.156, 0.312 5.8%, 0.789 11.1%, 1.015 14.2%,
    1.096, 1.157, 1.199, 1.224 20.3%, 1.231, 1.231, 1.226, 1.214 24.6%, 1.176 26.9%,
    1.057 32.6%, 1.007 35.5%, 0.984, 0.968, 0.956, 0.949 42%, 0.946 44.1%, 0.95 46.5%,
    0.998 57.2%, 1.007, 1.011 63.3%, 1.012 68.3%, 0.998 84%, 1
  );
  --spring-duration: 1.33s;
}

@property --shimmer {
  syntax: "<angle>";
  inherits: false;
  initial-value: 33deg;
}

@property --gradient-angle {
  syntax: "<angle>";
  inherits: false;
  initial-value: 0deg;
}

/* ========== KEYFRAME ANIMATIONS ========== */

@keyframes shimmer {
  0% { --shimmer: 0deg; }
  100% { --shimmer: 360deg; }
}

@keyframes shine {
  0% { opacity: 0; }
  15% { opacity: 1; }
  55% { opacity: 1; }
  100% { opacity: 0; }
}

@keyframes text {
  0% { background-position: 100% center; }
  100% { background-position: -100% center; }
}

@keyframes gradient-rotate {
  0% { --gradient-angle: 0deg; }
  100% { --gradient-angle: 360deg; }
}

@keyframes float {
  0%, 100% { transform: translateY(0px) rotate(0deg); }
  50% { transform: translateY(-20px) rotate(5deg); }
}

@keyframes pulse-glow {
  0%, 100% { 
    filter: drop-shadow(0 0 8px rgba(241, 64, 64, 0.3));
  }
  50% { 
    filter: drop-shadow(0 0 20px rgba(241, 64, 64, 0.6));
  }
}

@keyframes slide-in-up {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes fade-in {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes scale-in {
  from {
    opacity: 0;
    transform: scale(0.9);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

@keyframes ripple {
  0% {
    box-shadow: 0 0 0 0 rgba(241, 64, 64, 0.4);
  }
  100% {
    box-shadow: 0 0 0 20px rgba(241, 64, 64, 0);
  }
}

/* ========== BASE STYLES ========== */

*, *::before, *::after {
  margin: 0;
  padding: 0;
  outline: none !important;
  box-sizing: border-box;
  -webkit-box-sizing: border-box;
  -moz-box-sizing: border-box;
  scroll-behavior: smooth;
  -webkit-scroll-behavior: smooth;
  -moz-scroll-behavior: smooth;
}

.remove { display: none !important; }
.hide { display: none !important; }

html, body {
  width: 100%;
  height: 100%;
  margin: 0 !important;
  overflow: hidden !important;
  padding: 0 !important;
  background: linear-gradient(135deg, #0a0a0a 0%, #1a0a1a 100%);
  background-size: cover;
  background-position: center;
  color: #fff;
  font-size: 15px;
  font-family: var(--main-font);
  font-weight: 400;
  scroll-behavior: smooth;
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  position: relative;
}

/* Animated Background Gradient */
body::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: 
    radial-gradient(circle at 20% 50%, rgba(147, 40, 255, 0.15) 0%, transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(241, 64, 64, 0.15) 0%, transparent 50%),
    radial-gradient(circle at 40% 80%, rgba(195, 171, 105, 0.1) 0%, transparent 50%);
  animation: float 20s ease-in-out infinite;
  pointer-events: none;
  z-index: 0;
}

/* ========== MAIN CONTAINER ========== */

#main {
  width: 100%;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  z-index: 1;
  padding: 20px;
}

/* ========== TEXT INPUT SECTION ========== */

#text {
  width: 100%;
  max-width: 800px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  opacity: 1;
}

#text textarea {
  width: 100%;
  height: 400px;
  padding: 25px;
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 20px;
  color: #fff;
  font-family: var(--main-font);
  font-size: 16px;
  line-height: 1.8;
  resize: none;
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 
    0 8px 32px rgba(0, 0, 0, 0.4),
    inset 0 1px 0 rgba(255, 255, 255, 0.1);
}

#text textarea:focus {
  background: rgba(255, 255, 255, 0.08);
  border-color: rgba(241, 64, 64, 0.5);
  box-shadow: 
    0 8px 32px rgba(0, 0, 0, 0.4),
    0 0 0 4px rgba(241, 64, 64, 0.1),
    inset 0 1px 0 rgba(255, 255, 255, 0.15);
  transform: translateY(-2px);
}

#text textarea::placeholder {
  color: rgba(255, 255, 255, 0.3);
}

#text textarea::-webkit-scrollbar {
  width: 8px;
}

#text textarea::-webkit-scrollbar-track {
  background: rgba(255, 255, 255, 0.05);
  border-radius: 10px;
}

#text textarea::-webkit-scrollbar-thumb {
  background: rgba(241, 64, 64, 0.5);
  border-radius: 10px;
  transition: background 0.3s ease;
}

#text textarea::-webkit-scrollbar-thumb:hover {
  background: rgba(241, 64, 64, 0.7);
}

/* ========== CONTROL PANEL ========== */

#control-panel {
  display: flex;
  gap: 15px;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
}

#control-panel button {
  padding: 15px 30px;
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 50px;
  color: #fff;
  font-family: var(--main-font);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  overflow: hidden;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
}

#control-panel button::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: 0;
  height: 0;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.2);
  transform: translate(-50%, -50%);
  transition: width 0.6s ease, height 0.6s ease;
}

#control-panel button:hover::before {
  width: 300px;
  height: 300px;
}

#control-panel button:hover {
  background: rgba(255, 255, 255, 0.12);
  border-color: rgba(255, 255, 255, 0.25);
  transform: translateY(-3px);
  box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
}

#control-panel button:active {
  transform: translateY(-1px);
}

#control-panel button i {
  margin-right: 8px;
  position: relative;
  z-index: 1;
}

#control-panel button span {
  position: relative;
  z-index: 1;
}

/* Primary Action Buttons */
#audio-btn, #next {
  background: linear-gradient(135deg, rgba(241, 64, 64, 0.9), rgba(241, 64, 64, 0.7));
  border-color: rgba(255, 255, 255, 0.2);
  animation: pulse-glow 3s ease-in-out infinite;
}

#audio-btn:hover, #next:hover {
  background: linear-gradient(135deg, rgba(241, 64, 64, 1), rgba(241, 64, 64, 0.8));
  box-shadow: 
    0 8px 25px rgba(241, 64, 64, 0.4),
    0 0 40px rgba(241, 64, 64, 0.2);
}

/* Inactive State */
#control-panel button.inactive {
  opacity: 0.4;
  pointer-events: none;
  filter: grayscale(1);
}

/* ========== LYRICS DISPLAY ========== */

#lyrics {
  display: none;
  width: 100%;
  max-width: 900px;
  height: 500px;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 40px 30px;
  background: rgba(255, 255, 255, 0.03);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 25px;
  box-shadow: 
    0 20px 60px rgba(0, 0, 0, 0.5),
    inset 0 1px 0 rgba(255, 255, 255, 0.1);
  position: relative;
}

/* Subtle gradient overlay on top */
#lyrics::before {
  content: '';
  position: sticky;
  top: 0;
  left: 0;
  width: 100%;
  height: 60px;
  background: linear-gradient(to bottom, rgba(10, 10, 10, 0.8), transparent);
  pointer-events: none;
  z-index: 10;
  margin: -40px -30px 0;
  border-radius: 25px 25px 0 0;
}

#lyrics::-webkit-scrollbar {
  width: 10px;
}

#lyrics::-webkit-scrollbar-track {
  background: rgba(255, 255, 255, 0.03);
  border-radius: 10px;
}

#lyrics::-webkit-scrollbar-thumb {
  background: linear-gradient(to bottom, rgba(241, 64, 64, 0.5), rgba(147, 40, 255, 0.5));
  border-radius: 10px;
  transition: background 0.3s ease;
}

#lyrics::-webkit-scrollbar-thumb:hover {
  background: linear-gradient(to bottom, rgba(241, 64, 64, 0.8), rgba(147, 40, 255, 0.8));
}

#lyrics p {
  font-size: 20px;
  line-height: 1.8;
  color: rgba(255, 255, 255, 0.5);
  margin: 12px 0;
  cursor: pointer;
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  padding: 10px 20px;
  border-radius: 12px;
  position: relative;
}

#lyrics p::before {
  content: '';
  position: absolute;
  left: 0;
  top: 50%;
  width: 0;
  height: 2px;
  background: linear-gradient(to right, rgba(241, 64, 64, 0.8), rgba(147, 40, 255, 0.8));
  transform: translateY(-50%);
  transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  border-radius: 2px;
}

#lyrics p:hover {
  color: rgba(255, 255, 255, 0.8);
  background: rgba(255, 255, 255, 0.05);
  transform: translateX(10px);
  padding-left: 30px;
}

#lyrics p:hover::before {
  width: 4px;
}

#lyrics p.selected {
  color: #fff;
  font-weight: 600;
  background: linear-gradient(135deg, rgba(241, 64, 64, 0.15), rgba(147, 40, 255, 0.15));
  border-left: 4px solid;
  border-image: linear-gradient(to bottom, rgba(241, 64, 64, 1), rgba(147, 40, 255, 1)) 1;
  padding-left: 26px;
  transform: translateX(10px) scale(1.02);
  box-shadow: 
    0 4px 20px rgba(241, 64, 64, 0.2),
    inset 0 1px 0 rgba(255, 255, 255, 0.1);
  animation: ripple 1.5s ease-out;
}

#lyrics p.selected::before {
  width: 0;
}

#lyrics p span {
  color: rgba(241, 64, 64, 0.9);
  font-weight: 600;
  font-size: 14px;
  margin-right: 12px;
  display: inline-block;
  min-width: 60px;
  padding: 4px 10px;
  background: rgba(241, 64, 64, 0.15);
  border-radius: 8px;
  backdrop-filter: blur(10px);
  transition: all 0.3s ease;
}

#lyrics p.selected span {
  background: rgba(241, 64, 64, 0.3);
  color: #fff;
  transform: scale(1.05);
}

#lyrics br {
  display: block;
  content: "";
  margin: 20px 0;
}

/* ========== METADATA PANEL ========== */

#metadata {
  position: fixed;
  top: 0;
  right: -450px;
  width: 400px;
  height: 100vh;

#metadata::-webkit-scrollbar-track {

#metadata::-webkit-scrollbar-thumb {

#metadata heading {

  font-weight: 600;
}

#song-list .item button.pick {
  padding: 10px 24px;
  background: linear-gradient(135deg, rgba(241, 64, 64, 0.9), rgba(241, 64, 64, 0.7));
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 30px;
  color: white;
  font-family: var(--main-font);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 4px 15px rgba(241, 64, 64, 0.3);
}

#song-list .item button.pick:hover {
  background: linear-gradient(135deg, rgba(241, 64, 64, 1), rgba(241, 64, 64, 0.8));
  transform: scale(1.05);
  box-shadow: 0 6px 20px rgba(241, 64, 64, 0.4);
}

/* Loading State */
#song-list.loading::after {
  content: 'Loading...';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 24px;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.7);
  animation: pulse-glow 2s ease-in-out infinite;
}

/* ========== MENU BUTTON ========== */

#menu-btn {
  position: fixed;
  top: 30px;
  right: 30px;
  width: 50px;
  height: 50px;
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 1001;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
}

#menu-btn:hover {
  background: rgba(255, 255, 255, 0.12);
  border-color: rgba(241, 64, 64, 0.5);
  transform: rotate(90deg) scale(1.1);
  box-shadow: 0 6px 30px rgba(241, 64, 64, 0.3);
}

#menu-btn i {
  color: #fff;
  font-size: 20px;
  transition: transform 0.3s ease;
}

#menu-btn.open {
  background: linear-gradient(135deg, rgba(241, 64, 64, 0.9), rgba(241, 64, 64, 0.7));
  transform: rotate(180deg);
}

#menu-btn.open i {
  transform: rotate(90deg);
}

/* ========== AUDIO PLAYER ========== */

#player {
  display: none;
}

/* ========== RESPONSIVE ========== */

@media (max-width: 768px) {
  #main {
    padding: 15px;
  }
  
  #text textarea {
    height: 300px;
    padding: 20px;
    font-size: 14px;
  }
  
  #lyrics {
    height: 400px;
    padding: 30px 20px;
  }
  
  #lyrics p {
    font-size: 18px;
  }
  
  #control-panel {
    gap: 10px;
  }
  
  #control-panel button {
    padding: 12px 24px;
    font-size: 14px;
  }
  
  #metadata {
    width: 100%;
    right: -100%;
  }
  
  #song-list {
    padding: 20px;
  }
  
  #song-list heading {
    font-size: 22px;
  }
  
  #menu-btn {
    top: 20px;
    right: 20px;
    width: 45px;
    height: 45px;
  }
}

/* ========== UTILITY ANIMATIONS ========== */

.fade-enter {
  animation: fade-in 0.4s ease-out;
}

.slide-enter {
  animation: slide-in-up 0.5s ease-out;
}

.scale-enter {
  animation: scale-in 0.5s cubic-bezier(0.4, 0, 0.2, 1);
}

/* ========== POLISH & REFINEMENTS ========== */

/* Smooth all transitions */
* {
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
}

/* Enhanced focus states */
button:focus-visible,
input:focus-visible {
  outline: 2px solid rgba(241, 64, 64, 0.5);
  outline-offset: 2px;
}

/* Prevent text selection on UI elements */
button,
#menu-btn,
#lyrics p span {
  user-select: none;
  -webkit-user-select: none;
  -moz-user-select: none;
}

/* Allow text selection in lyrics */
#lyrics p {
  user-select: text;
  -webkit-user-select: text;
  -moz-user-select: text;
}
</style>
</head>

<body>
  <audio id="player"></audio>

  <div id="menu-btn">
    <i class="fa-solid fa-bars"></i>
  </div>

  <div id="main">
    <div id="text">
      <textarea id="input" placeholder="Paste your lyrics here... Each line should be formatted as:
[00:12.00] First line of lyrics
[00:15.50] Second line of lyrics

Or simply paste plain text and add timestamps later."></textarea>
      
      <div id="control-panel">
        <button id="audio-btn" data-status="upload">
          <i class="fa-solid fa-arrow-up-from-bracket"></i>
          <span>Upload Audio</span>
        </button>
        <button id="next" class="inactive">
          <i class="fa-solid fa-arrow-right"></i>
          <span>Start Timing</span>
        </button>
        <button id="pull">
          <i class="fa-solid fa-list-music"></i>
          <span>Song Library</span>
        </button>
      </div>
    </div>

    <div id="lyrics"></div>
  </div>

  <div id="control-panel" style="position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); display: none;" class="lyrics-controls">
    <button id="next-line">
      <i class="fa-solid fa-arrow-down"></i>
      <span>Next Line</span>
    </button>
    <button id="prev-line">
      <i class="fa-solid fa-arrow-up"></i>
      <span>Previous Line</span>
    </button>
    <button id="clear-time">
      <i class="fa-solid fa-eraser"></i>
      <span>Clear Time</span>
    </button>
    <button id="download">
      <i class="fa-solid fa-copy"></i>
      <span>Copy HTML</span>
    </button>
    <button id="lrc">
      <i class="fa-solid fa-download"></i>
      <span>Download LRC</span>
    </button>
  </div>

  <div id="metadata">
    <heading>
      Metadata
      <button type="button" id="close-meta">Close</button>
    </heading>
    <form>
      <div>
        <label>Artist</label>
        <input type="text" id="meta_artist" placeholder="Enter artist name">
      </div>
      <div>
        <label>Track</label>
        <input type="text" id="meta_track" placeholder="Enter track name">
      </div>
      <div>
        <label>Album</label>
        <input type="text" id="meta_album" placeholder="Enter album name">
      </div>
      <button type="button" id="save-meta">Save Metadata</button>
    </form>
  </div>

  <div id="song-list">
    <heading>
      Song Library
      <button type="button">Close</button>
    </heading>
    <div class="contain"></div>
  </div>

<script>
$(document).ready(function() {
  
  // ========== AUDIO UPLOAD & PLAYBACK ========== 
  
  $("#audio-btn").click(function() {
    var status = $(this).attr("data-status");
    
    if (status === "upload") {
      var input = document.createElement("input");
      input.type = "file";
      input.accept = "audio/*";
      
      input.onchange = function(e) {
        var file = e.target.files[0];
        if (file) {
          var url = URL.createObjectURL(file);
          $("#player")[0].src = url;
          localStorage.removeItem("audioReady");
          localStorage.setItem("audioReady", "true");
          $("#audio-btn").attr("data-status", "play").html('<i class="fa-solid fa-play"></i><span>Play</span>');
          $("#next").removeClass("inactive");
          
          // Add subtle notification
          gsap.to("#audio-btn", {
            scale: 1.1,
            duration: 0.2,
            yoyo: true,
            repeat: 1
          });
        }
      };
      input.click();
      
    } else if (status === "play") {
      $("#player")[0].play();
      $(this).attr("data-status", "pause").html('<i class="fa-solid fa-pause"></i><span>Pause</span>');
      
    } else if (status === "pause") {
      $("#player")[0].pause();
      $(this).attr("data-status", "play").html('<i class="fa-solid fa-play"></i><span>Play</span>');
    }
  });

  // ========== NEXT BUTTON - ENTER TIMING MODE ========== 
  
  $("#next").click(function() {
    if ($(this).hasClass("inactive")) return;
    
    var text = $("#input").val();
    if (!text.trim()) return;
    
    var lines = text.split("\n");
    var output = "";
    
    lines.forEach(function(line) {
      line = line.trim();
      if (line === "") {
        output += "<br>";
      } else {
        var match = line.match(/^\[([^\]]+)\]\s*(.*)$/);
        if (match) {
          var time = match[1];
          var lyric = match[2];
          output += '<p><span>[' + time + ']</span>' + lyric + '</p>';
        } else {
          output += '<p>' + line + '</p>';
        }
      }
    });
    
    $("#lyrics").html(output);
    
    // Animate transition
    gsap.to("#text", {
      opacity: 0,
      y: -30,
      duration: 0.4,
      onComplete: function() {
        $("#text").hide();
        $("#lyrics").css('display', 'block');
        $(".lyrics-controls").css('display', 'flex');
        
        gsap.from("#lyrics", {
          opacity: 0,
          scale: 0.95,
          duration: 0.6,
          ease: "power3.out"
        });
        
        gsap.from(".lyrics-controls", {
          opacity: 0,
          y: 30,
          duration: 0.5,
          delay: 0.3,
          ease: "power3.out"
        });
      }
    });
    
    if ($("#player")[0].src) {
      $("#player")[0].currentTime = 0;
      $("#audio-btn").attr("data-status", "play").html('<i class="fa-solid fa-play"></i><span>Play</span>');
    }
  });

  // ========== LYRICS TIMING CONTROLS ========== 
  
  function formatTime(seconds) {
    var mins = Math.floor(seconds / 60);
    var secs = Math.floor(seconds % 60);
    var millis = Math.floor((seconds % 1) * 100);
    return String(mins).padStart(2, '0') + ':' + 
           String(secs).padStart(2, '0') + '.' + 
           String(millis).padStart(2, '0');
  }
  
  $("#lyrics").on("click", "p", function() {
    if ($("#player")[0].src) {
      var time = $("#player")[0].currentTime;
      var formatted = formatTime(time);
      
      if ($(this).find("span").length) {
        $(this).find("span").text('[' + formatted + ']');
      } else {
        $(this).prepend('<span>[' + formatted + ']</span>');
      }
      
      $(this).addClass("selected").siblings().removeClass("selected");
      $("#clear-time").removeClass("inactive");
      
      // Smooth scroll to selected line
      var container = $("#lyrics");
      var scrollTo = $(this).position().top + container.scrollTop() - container.height() / 2 + $(this).height() / 2;
      
      gsap.to(container, {
        scrollTop: scrollTo,
        duration: 0.6,
        ease: "power2.out"
      });
      
      // Ripple effect
      gsap.fromTo($(this), 
        { scale: 0.98 },
        { 
          scale: 1.02, 
          duration: 0.3,
          yoyo: true,
          repeat: 1,
          ease: "power2.inOut"
        }
      );
    }
  });
  
  $("#next-line").click(function() {
    var $selected = $("#lyrics p.selected");
    var $next = $selected.next("p");
    
    if ($next.length === 0) {
      $next = $("#lyrics p").first();
    }
    
    if ($next.length && $("#player")[0].src) {
      $next.click();
    }
  });
  
  $("#prev-line").click(function() {
    var $selected = $("#lyrics p.selected");
    var $prev = $selected.prev("p");
    
    if ($prev.length === 0) {
      $prev = $("#lyrics p").last();
    }
    
    if ($prev.length && $("#player")[0].src) {
      $prev.click();
    }
  });
  
  // Keyboard shortcuts
  $(document).keydown(function(e) {
    if ($("#lyrics").is(":visible")) {
      if (e.key === "ArrowDown" || e.key === "j") {
        e.preventDefault();
        $("#next-line").click();
      } else if (e.key === "ArrowUp" || e.key === "k") {
        e.preventDefault();
        $("#prev-line").click();
      } else if (e.key === " ") {
        e.preventDefault();
        $("#audio-btn").click();
      }
    }
  });
  
  $("#clear-time").click(function() {
    if ($(this).hasClass("inactive")) return;
    
    var $selected = $("#lyrics p.selected");
    $selected.find("span").remove();
    $selected.removeClass("selected");
    
    gsap.to($selected, {
      x: -10,
      duration: 0.2,
      yoyo: true,
      repeat: 1,
      ease: "power2.inOut"
    });
    
    setTimeout(function() {
      if (!$("#lyrics p.selected").length) {
        $("#clear-time").addClass("inactive");
      }
    }, 200);
  });
  
  // ========== DOWNLOAD LRC ========== 
  
  $("#lrc").click(function() {
    var lrcContent = "";
    
    $("#lyrics p").each(function() {
      var line = $(this).text().trim();
      if (line) {
        lrcContent += line + "\n";
      }
    });
    
    var blob = new Blob([lrcContent], { type: "text/plain;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    
    var a = document.createElement("a");
    a.href = url;
    a.download = "lyrics.lrc";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    
    // Success animation
    gsap.to("#lrc", {
      backgroundColor: "rgba(76, 175, 80, 0.3)",
      duration: 0.3,
      yoyo: true,
      repeat: 1
    });
  });
  
  // ========== COPY HTML ========== 
  
  $("#download").click(function() {
    var output = "";
    var lastWasBR = false;
    
    $("#lyrics").contents().each(function() {
      if (this.nodeType === 1) {
        if (this.tagName === "P") {
          var $p = $(this);
          var spanText = $p.find("span").text().trim();
          spanText = spanText.replace(/^\[|\]$/g, "");
          
          var text = $p.clone().find("span").remove().end().text().trim();
          
          var pTag = "<p";
          if (spanText) pTag += ' data-minutes="' + spanText + '"';
          pTag += ">" + text + "</p>";
          
          output += pTag + "\n";
          lastWasBR = false;
          
        } else if (this.tagName === "BR") {
          if (!lastWasBR) {
            output += "<br>\n";
            lastWasBR = true;
          }
        }
      }
    });
    
    output = output.replace(/(<br>\s*)+$/i, "");
    
    navigator.clipboard.writeText(output).then(function() {
      // Success animation
      gsap.to("#download", {
        backgroundColor: "rgba(76, 175, 80, 0.3)",
        duration: 0.3,
        yoyo: true,
        repeat: 1
      });
    }).catch(function(err) {
      console.error("Failed to copy: ", err);
    });
  });
  
  // ========== MENU BUTTON ========== 
  
  $("#menu-btn, #close-meta").click(function() {
    $("#menu-btn").toggleClass("open");
    $("#metadata").toggleClass("go");
    
    if ($("#metadata").hasClass("go")) {
      setTimeout(function() {
        gsap.from("#metadata form > *", {
          opacity: 0,
          x: 20,
          duration: 0.3,
          stagger: 0.05,
          ease: "power2.out",
          clearProps: "all"
        });
      }, 100);
    }
  });
  
  // ========== SONG LIBRARY ========== 
  
  $("#song-list heading button").click(function() {
    $("#song-list").removeClass("go");
  });
  
  $("#pull").click(function() {
    $("#song-list").addClass("loading");
    
    $.get("/content/lyrics.html")
      .done(function(data) {
        var html = $(data);
        var $songContainer = $("#song-list .contain");
        $songContainer.empty();
        
        var itemCount = 0;
        
        html.filter(".lyric").add(html.find(".lyric")).each(function() {
          var $lyric = $(this);
          var $metadata = $lyric.find(".metadata");
          
          var artist = $metadata.find(".artist").text();
          var track = $metadata.find(".track").text();
          
          if (artist.trim() && track.trim()) {
            itemCount++;
            
            var section =
              '<div class="item">' +
                '<div class="section">' +
                  '<p class="artist">' + artist + '</p>' +
                  '<p class="name">' + track + '</p>' +
                '</div>' +
                '<div class="section">' +
                  '<button type="button" class="pick">Choose</button>' +
                '</div>' +
              '</div>';
            
            $songContainer.append(section);
          }
        });
        
        $("#song-list").removeClass("loading");
        $("#song-list").addClass("go");
        
        if (itemCount === 0) {
          $songContainer.html('<p class="info">Content loaded, but no valid song items were found.</p>');
        } else {
          // Optional subtle fade-in for items
          setTimeout(function() {
            gsap.from("#song-list .item", {
              opacity: 0,
              y: 20,
              duration: 0.4,
              stagger: 0.03,
              ease: "power2.out",
              clearProps: "all"
            });
          }, 50);
        }
      })
      .fail(function(jqXHR, textStatus, errorThrown) {
        console.error("Content failed to load:", textStatus, errorThrown);
        $("#song-list .contain").html('<p class="error">Failed to load songs.</p>');
        $("#song-list").removeClass("loading");
      });
  });
  
  $("#song-list").on("click", ".item button", function() {
    var $item = $(this).closest(".item");
    var artistText = $item.find(".artist").text().trim().toLowerCase();
    var trackText = $item.find(".name").text().trim().toLowerCase();
    
    $("#metadata #meta_artist").val($item.find(".artist").text());
    $("#metadata #meta_track").val($item.find(".name").text());
    $("#metadata #meta_album").val($item.find(".album").text());
    
    $("#input").val("");
    
    $.get("/content/lyrics.html", function(data) {
      var $html = $("<div>").html(data);
      
      var $lyric = $html.find(".lyric").filter(function() {
        var dataArtists = $(this).attr("data-artist") ? $(this).attr("data-artist").trim().toLowerCase() : "";
        var dataTrack = $(this).attr("data-track") ? $(this).attr("data-track").trim().toLowerCase() : "";
        
        var artistList = dataArtists.split(",").map(a=>a.trim());
        var artistMatch = artistList.some(a=>artistText.includes(a));
        
        return artistMatch && dataTrack === trackText;
      });
      
      if ($lyric.length) {
        var lines = [];
        $lyric.contents().each(function() {
          if (this.nodeName === "P") lines.push($(this).text().trim());
          else if (this.nodeName === "BR") lines.push("");
        });
        
        if ($("#lyrics").css("display") === "block") {
          $("#next").click();
        }
        
        $("#song-list").removeClass("go");
        $("#input").val(lines.join("\n"));
        
        // Get audio from main site
        $.get("/", function(mainData) {
          var $main = $("<div>").html(mainData);
          
          var $songDiv = $main.find("#music .tracks .grid .song").filter(function() {
            var songArtists = $(this).attr("data-artist") ? $(this).attr("data-artist").trim().toLowerCase() : "";
            var songTrack = $(this).attr("data-track") ? $(this).attr("data-track").trim().toLowerCase() : "";
            
            var songArtistList = songArtists.split(",").map(a=>a.trim());
            var artistMatch = songArtistList.some(a=>artistText.includes(a));
            
            return artistMatch && songTrack === trackText;
          });
          
          if ($songDiv.length) {
            var mp3 = $songDiv.attr("data-mp3");
            if (mp3) {
              $("#player")[0].src = mp3;
              localStorage.removeItem("audioReady");
              localStorage.setItem("audioReady", "true");
              $("#audio-btn").attr("data-status", "play").html('<i class="fa-solid fa-play"></i><span>Play</span>');
              $("#player").attr("src", mp3)[0].load();
              $("#next").removeClass("inactive");
            } else {
              $("#audio-btn i").removeClass().addClass("fa-solid fa-arrow-up-from-bracket");
              $("#audio-btn").attr("data-status", "upload");
              $("#next-line").addClass("inactive");
              $("#lyrics").hide();
              $("#text").show();
            }
          }
        });
      } else {
        $item.addClass("error");
        $item.append('<div class="error"><x>Error</x></div>');
      }
    });
  });
  
  // ========== SMOOTH ENTRANCE ANIMATION ========== 
  
  gsap.from("#text", {
    opacity: 0,
    y: 30,
    duration: 0.6,
    ease: "power2.out",
    clearProps: "all"
  });
  
  gsap.from("#menu-btn", {
    opacity: 0,
    scale: 0.8,
    duration: 0.5,
    delay: 0.2,
    ease: "back.out(1.7)",
    clearProps: "all"
  });
  
});
</script>

</body>
</html>
