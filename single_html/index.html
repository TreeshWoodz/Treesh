/* ---- Draggable / tappable scrubbers (mini player progress bar) ---- */
let _scrubbing=null;
function _scrubPct(el, clientX){ const r=el.getBoundingClientRect(); if(!r.width) return 0; return Math.max(0,Math.min(1,(clientX-r.left)/r.width)); }
function _scrubApply(el, p){ if(el.getAttribute("data-scrub")==="mini"){ const mp=document.getElementById("mini-prog"); if(mp) mp.style.width=(p*100)+"%"; } if(state.duration){ try{ audio.currentTime=p*state.duration; }catch(_){} state.currentTime=p*state.duration; } }
document.addEventListener("pointerdown", e=>{ const el=e.target&&e.target.closest&&e.target.closest("[data-scrub]"); if(!el) return; _scrubbing=el; try{ el.setPointerCapture(e.pointerId); }catch(_){} _scrubApply(el,_scrubPct(el,e.clientX)); e.preventDefault(); }, {passive:false});
document.addEventListener("pointermove", e=>{ if(!_scrubbing) return; _scrubApply(_scrubbing,_scrubPct(_scrubbing,e.clientX)); });
document.addEventListener("pointerup", e=>{ if(!_scrubbing) return; _scrubApply(_scrubbing,_scrubPct(_scrubbing,e.clientX)); _scrubbing=null; });
document.addEventListener("pointercancel", ()=>{ _scrubbing=null; });

/* ---- Hold the repeat button 3s to arm an A\u2013B loop (keeps the player uncluttered) ---- */
let _repeatHoldTimer=null, _repeatLongPressed=false, _repeatHoldEl=null, _repeatHoldXY=null;
function _cancelRepeatHold(){ clearTimeout(_repeatHoldTimer); _repeatHoldTimer=null; if(_repeatHoldEl){ _repeatHoldEl.classList.remove("ab-charging"); _repeatHoldEl=null; } _repeatHoldXY=null; }
document.addEventListener("pointerdown", e=>{ const rb=e.target&&e.target.closest&&e.target.closest("#np-repeat"); if(!rb) return; _repeatLongPressed=false; _repeatHoldEl=rb; _repeatHoldXY={x:e.clientX,y:e.clientY}; rb.classList.add("ab-charging"); clearTimeout(_repeatHoldTimer); _repeatHoldTimer=setTimeout(()=>{ _repeatLongPressed=true; if(_repeatHoldEl) _repeatHoldEl.classList.remove("ab-charging"); _repeatHoldEl=null; state.abA=state.currentTime||0; state.abB=null; if(navigator.vibrate){ try{navigator.vibrate(18);}catch(_){} } toast("Loop point A set","Tap repeat again to set point B"); renderNP(); }, 1500); });
document.addEventListener("pointermove", e=>{ if(!_repeatHoldEl||!_repeatHoldXY) return; const dx=e.clientX-_repeatHoldXY.x, dy=e.clientY-_repeatHoldXY.y; if(dx*dx+dy*dy>196) _cancelRepeatHold(); });
document.addEventListener("pointerup", _cancelRepeatHold);
document.addEventListener("pointercancel", _cancelRepeatHold);

/* keyboard shortcuts */
document.addEventListener("keydown", e=>{
  const tag=(e.target.tagName||""); if(["INPUT","TEXTAREA","SELECT"].includes(tag)||e.target.isContentEditable) return;
  if(e.key==="Escape"){ if($("#modal").innerHTML){ closeModal(); return; } if(state.searchOpen){ closeSearch(); return; } if(state.profileOpen){ closeProfile(); return; } if(state.queueOpen){ closeQueue(); return; } if(state.npOpen){ closeNP(); return; } }
  if(!curSong()) return;
  if(e.code==="Space"){ e.preventDefault(); togglePlay(); }
  else if(e.code==="ArrowRight"&&e.shiftKey) nextTrack(true);
  else if(e.code==="ArrowLeft"&&e.shiftKey) prevTrack();
  else if(e.code==="ArrowRight") seekTo(Math.min(audio.currentTime+5,state.duration));
  else if(e.code==="ArrowLeft") seekTo(Math.max(audio.currentTime-5,0));
});

/* ============================================================
   STARFIELD
   ============================================================ */
function starfield(){ const cv=$("#stars"); if(!cv) return; const ctx=cv.getContext("2d"); const dpr=Math.min(window.devicePixelRatio||1,2); let w,h,stars=[],shoot=null,mx=0,my=0,raf; const reduced=!!state.perfMode;
  function resize(){ w=cv.clientWidth; h=cv.clientHeight; cv.width=w*dpr; cv.height=h*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); const n=w<700?110:220; stars=Array.from({length:n},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.3+0.2,a:Math.random()*0.6+0.2,tw:Math.random()*0.02+0.004,dir:Math.random()>0.5?1:-1,purple:Math.random()>0.86,depth:Math.random()*0.6+0.2})); }
  function draw(){ ctx.clearRect(0,0,w,h); const g=ctx.createRadialGradient(w/2,h*0.35,0,w/2,h*0.35,Math.max(w,h)*0.8); g.addColorStop(0,"rgba(147,40,255,0.05)"); g.addColorStop(1,"rgba(0,0,0,0)"); ctx.fillStyle=g; ctx.fillRect(0,0,w,h); const ox=(mx-w/2)*0.006,oy=(my-h/2)*0.006; for(const s of stars){ if(!reduced){ s.a+=s.tw*s.dir; if(s.a>0.85)s.dir=-1; if(s.a<0.15)s.dir=1; } const px=s.x+ox*s.depth*12,py=s.y+oy*s.depth*12; ctx.beginPath(); ctx.arc(px,py,s.r,0,Math.PI*2); ctx.fillStyle=s.purple?`rgba(180,120,255,${s.a})`:(document.documentElement.classList.contains("theme-light")?`rgba(30,30,40,${s.a*0.8})`:`rgba(255,255,255,${s.a})`); ctx.fill(); }
    if(!reduced&&!shoot&&Math.random()<0.006) shoot={x:Math.random()*w*0.6,y:Math.random()*h*0.3,len:0,life:0}; if(shoot){ shoot.life++; shoot.len=Math.min(shoot.len+14,160); const sx=shoot.x+shoot.life*6,sy=shoot.y+shoot.life*3; const g2=ctx.createLinearGradient(sx-shoot.len,sy-shoot.len*0.5,sx,sy); g2.addColorStop(0,"rgba(255,255,255,0)"); g2.addColorStop(1,"rgba(255,255,255,0.7)"); ctx.strokeStyle=g2; ctx.lineWidth=1.4; ctx.beginPath(); ctx.moveTo(sx-shoot.len,sy-shoot.len*0.5); ctx.lineTo(sx,sy); ctx.stroke(); if(shoot.life>40||sx>w||sy>h) shoot=null; }
    raf=requestAnimationFrame(draw); }
  resize(); draw(); addEventListener("resize",resize); addEventListener("pointermove",e=>{mx=e.clientX;my=e.clientY;}); document.addEventListener("visibilitychange",()=>{ if(document.hidden) cancelAnimationFrame(raf); else raf=requestAnimationFrame(draw); }); }

/* ============================================================
   AUDIO VISUALIZER (player + background)
   ============================================================ */
let _vizAC=null,_vizAnalyser=null,_vizSrc=null,_vizBytes=null,_vizRAF=null,_vizCanvases=[],_vizPhase=0,_vizSilent=0;
function ensureVizAudio(){ if(_vizAnalyser) return true; try{ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return false; _vizAC=new AC(); _vizAnalyser=_vizAC.createAnalyser(); _vizAnalyser.fftSize=256; _vizAnalyser.smoothingTimeConstant=0.82; _vizBytes=new Uint8Array(_vizAnalyser.frequencyBinCount); _vizSrc=_vizAC.createMediaElementSource(audio); _vizSrc.connect(_vizAnalyser); _vizAnalyser.connect(_vizAC.destination); return true; }catch(e){ _vizAnalyser=null; return false; } }

function vizSample(){ const n=64, out=new Float32Array(n); let real=false; if(_vizAnalyser){ try{ _vizAnalyser.getByteFrequencyData(_vizBytes); }catch(e){} const bins=_vizBytes.length; let sum=0; for(let i=0;i<n;i++){ const v=_vizBytes[Math.floor(i/n*bins)]/255; out[i]=v; sum+=v; } if(sum>1.2){ real=true; _vizSilent=0; } else _vizSilent++; }
  if(!real){ const active=state.isPlaying?1:0.14; _vizPhase+=0.05*(state.isPlaying?1:0.35); for(let i=0;i<n;i++){ const f=i/n; const base=Math.pow(1-f,1.5); const wob=0.5+0.5*Math.sin(_vizPhase*2+i*0.55)*Math.cos(_vizPhase*0.6+i*0.11); out[i]=Math.max(0,base*(0.32+0.68*wob)*active); } }
  return out; }
function vizBaseColor(){ const v=state.viz; if(v.color==="custom") return v.customColor||"#9328ff"; if(v.color==="palette"&&state.palette&&state.palette[0]) return rgb(state.palette[0],1); if(v.color==="rainbow") return null; return (getComputedStyle(document.documentElement).getPropertyValue("--treesh-purple").trim())||"#9328ff"; }
function roundRectFill(ctx,x,y,w,h,r){ if(w<=0)return; const hh=Math.abs(h); r=Math.min(r,w/2,hh/2); const y2=h<0?y+h:y; h=hh; ctx.beginPath(); ctx.moveTo(x+r,y2); ctx.arcTo(x+w,y2,x+w,y2+h,r); ctx.arcTo(x+w,y2+h,x,y2+h,r); ctx.arcTo(x,y2+h,x,y2,r); ctx.arcTo(x,y2,x+w,y2,r); ctx.closePath(); ctx.fill(); }
function drawViz(ctx,w,h,data,style){ const v=state.viz; const rainbow=(v.color==="rainbow"); const base=vizBaseColor(); const glow=v.glow&&!state.perfMode; const sens=v.sensitivity||1.3; const n=data.length;
  const colAt=(i)=> rainbow?`hsl(${Math.floor((i/n*300+_vizPhase*30)%360)},85%,62%)`:base;
  ctx.clearRect(0,0,w,h);
  if(style==="wave"){ ctx.lineWidth=Math.max(2,h*0.012); ctx.lineJoin="round"; if(rainbow){ const g=ctx.createLinearGradient(0,0,w,0); for(let s=0;s<=6;s++) g.addColorStop(s/6,`hsl(${Math.floor((s/6*300+_vizPhase*30)%360)},85%,62%)`); ctx.strokeStyle=g; } else ctx.strokeStyle=base; if(glow){ctx.shadowBlur=16;ctx.shadowColor=rainbow?"#fff":base;} for(let pass=0;pass<2;pass++){ ctx.beginPath(); for(let i=0;i<n;i++){ const x=i/(n-1)*w; const val=Math.min(1,data[i]*sens); const off=(val)*h*0.42*(pass?-1:1); const y=h/2-off; i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); } ctx.stroke(); } ctx.shadowBlur=0; return; }

  if(style==="blob"){ const cx=w/2,cy=h/2,baseR=Math.min(w,h)*0.22; const b=rainbow?`hsl(${Math.floor(_vizPhase*30%360)},85%,60%)`:base; ctx.beginPath(); for(let i=0;i<=n;i++){ const idx=i%n; const ang=(i/n)*6.283; const val=Math.min(1,data[idx]*sens); const r=baseR+val*Math.min(w,h)*0.2; const x=cx+Math.cos(ang)*r,y=cy+Math.sin(ang)*r; i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); } ctx.closePath(); ctx.save(); ctx.globalAlpha=0.26; ctx.fillStyle=b; if(glow){ctx.shadowBlur=34;ctx.shadowColor=b;} ctx.fill(); ctx.globalAlpha=0.9; ctx.lineWidth=Math.max(2,h*0.01); ctx.strokeStyle=b; ctx.stroke(); ctx.restore(); return; }

function vizTick(){ _vizRAF=requestAnimationFrame(vizTick); if(!_vizCanvases.length){ return; } const data=vizSample(); _vizCanvases.forEach(en=>{ const c=en.canvas; if(!c.isConnected){ return; } const ctx=c._ctx||(c._ctx=c.getContext("2d")); drawViz(ctx,c.width,c.height,data,en.style()); }); }
function startVizLoop(){ if(_vizRAF||!_vizCanvases.length) return; vizTick(); }
function stopVizLoop(){ if(_vizRAF){ cancelAnimationFrame(_vizRAF); _vizRAF=null; } }
function sizeVizCanvas(c){ const r=c.getBoundingClientRect(); const dpr=Math.min(window.devicePixelRatio||1,2); c.width=Math.max(2,Math.floor((r.width||window.innerWidth)*dpr)); c.height=Math.max(2,Math.floor((r.height||window.innerHeight)*dpr)); c._ctx=c.getContext("2d"); }

let _bgVizMounted=false;
function mountBgViz(){ if(_bgVizMounted) return; let layer=document.getElementById("viz-bg-layer"); if(!layer){ layer=document.createElement("div"); layer.id="viz-bg-layer"; const bl=document.getElementById("bg-layer"); if(bl&&bl.parentNode) bl.parentNode.insertBefore(layer,bl.nextSibling); else document.body.insertBefore(layer,document.body.firstChild); } layer.innerHTML='<canvas></canvas>'; registerVizCanvas(layer.querySelector("canvas"),()=>state.viz.bgStyle); _bgVizMounted=true; }

let _npVizEntry=null;
function mountNpViz(){ const c=$("#np-viz-canvas"); if(!c) return; if(_npVizEntry) unregisterVizCanvas(_npVizEntry.canvas); _npVizEntry=registerVizCanvas(c,()=>state.viz.style); }
function unmountNpViz(){ if(_npVizEntry){ unregisterVizCanvas(_npVizEntry.canvas); _npVizEntry=null; } }

function wordCount(str){ return ((str||"").trim().match(/[^\s]+/g)||[]).length; }
function songArtistStats(song,name){ const k=normKey(name); let verses=0, words=0, prev="__x"; (song.lyrics||[]).forEach(l=>{ const info=parseSection(l.sec); const has=info&&info.artists.some(a=>normKey(a.name)===k); if(l.sec!==prev){ if(has) verses++; prev=l.sec; } if(has) words+=wordCount(l.text); }); return {verses,words}; }
function songHasArtist(song,id,name){ const k=normKey(name); if(id&&(song.artistIds||[]).indexOf(id)>=0) return true; if(normKey(song.artist)===k) return true; if(song.featuring&&normKey(song.featuring).indexOf(k)>=0) return true; return (song.lyrics||[]).some(l=>{ const info=parseSection(l.sec); return info&&info.artists.some(a=>normKey(a.name)===k); }); }

function allPresets(){ return INSTRUM_PRESETS.concat(state.userPresets||[]); }
function iApplyPreset(id){ const pr=allPresets().find(x=>x.id===id); if(!pr) return; const S=state.instrum; if(!S) return; const p=S.project; const bars=Math.max(1,Math.min(4,pr.bars||1)); const total=bars*16; p.bars=bars; p.bpm=pr.bpm; p.swing=pr.swing||0; p.tracks.forEach(tr=>{ tr.steps=new Array(total).fill(false); const arr=pr.pat&&pr.pat[tr.type]; if(arr) arr.forEach(i=>{ if(i<total) tr.steps[i]=true; }); if(tr.melodic && pr.notes && pr.notes[tr.type]) tr.note=pr.notes[tr.type]; }); if(S.playing) iStop(); S.activePreset=id; iPushHistory(); renderInstrum(); toast("Preset loaded",pr.name+" \u00b7 "+pr.bpm+" BPM"); }
function iCurrentAsPreset(name){ const p=state.instrum.project; const pat={}; const notes={}; p.tracks.forEach(tr=>{ const steps=[]; (tr.steps||[]).forEach((v,i)=>{ if(v) steps.push(i); }); if(steps.length) pat[tr.type]=steps; if(tr.melodic) notes[tr.type]=tr.note; }); return { id:"u_"+instrumUID(), name, bpm:p.bpm, swing:p.swing||0, bars:p.bars||1, pat, notes, custom:true }; }
function iAddPreset(){ const S=state.instrum; if(!S) return; const p=S.project; const hasSteps=p.tracks.some(tr=>(tr.steps||[]).some(Boolean)); if(!hasSteps){ toast("Nothing to save","Add some beats to the grid first"); return; } openPrompt("Save as preset", (p.name&&p.name!=="Untitled beat"?p.name:"My preset"), (name)=>{ name=(name||"").trim()||"My preset"; const pr=iCurrentAsPreset(name); state.userPresets=[pr,...(state.userPresets||[])].slice(0,40); LS.set("treesh_user_presets",state.userPresets); S.activePreset=pr.id; renderInstrum(); toast("Preset saved",name); }); }
function iDeletePreset(id){ state.userPresets=(state.userPresets||[]).filter(x=>x.id!==id); LS.set("treesh_user_presets",state.userPresets); const S=state.instrum; if(S&&S.activePreset===id) S.activePreset=null; renderInstrum(); toast("Preset removed"); }
function iDeselectPreset(){ const S=state.instrum; if(S && S.activePreset){ S.activePreset=null; iRenderPresetStrip(); } }
function iRenderPresetStrip(){ const el=document.querySelector('[data-testid="instrum-presets"]'); if(el && el.parentElement){ const wrap=el.parentElement; const tmp=document.createElement("div"); tmp.innerHTML=instrumPresetsHtml(); const fresh=tmp.firstElementChild; if(fresh){ wrap.replaceWith(fresh); icons(); } } }
function instrumPresetsHtml(){ const S=state.instrum; const active=S&&S.activePreset;
  const chip=(pr,custom)=>{ const on=active===pr.id; return `<div class="relative shrink-0"><button data-act="i-preset" data-id="${pr.id}" data-testid="preset-${pr.id}" aria-pressed="${on}" class="press w-full rounded-xl border ${custom?'pr-7':''} px-3.5 py-2 text-left transition-colors ${on?'border-[color:var(--treesh-purple)] bg-[color:var(--treesh-purple)]/15':'border-white/12 bg-white/[0.04] hover:bg-white/[0.08] hover:border-white/20'}"><span class="flex items-center gap-1.5"><span class="block text-sm font-semibold text-white">${esc(pr.name)}</span>${on?`<i data-lucide="check" style="width:13px;height:13px" class="text-[color:var(--treesh-purple)]"></i>`:''}</span><span class="block text-[11px] ${on?'text-white/60':'text-white/45'}">${pr.bpm} BPM${custom?' \u00b7 Custom':''}</span></button>${custom?`<button data-act="i-preset-del" data-id="${pr.id}" data-testid="preset-del-${pr.id}" aria-label="Delete preset ${esc(pr.name)}" class="press absolute right-1 top-1 grid h-5 w-5 place-items-center rounded-full text-white/40 hover:bg-white/10 hover:text-rose-300"><i data-lucide="x" style="width:12px;height:12px"></i></button>`:''}</div>`; };
  const builtins=INSTRUM_PRESETS.map(pr=>chip(pr,false)).join("");
  const customs=(state.userPresets||[]).map(pr=>chip(pr,true)).join("");
  const addBtn=`<button data-act="i-preset-add" data-testid="preset-add" class="press shrink-0 rounded-xl border border-dashed border-white/20 bg-white/[0.02] px-3 py-2 text-left text-white/70 hover:bg-white/[0.06] hover:text-white hover:border-white/35"><span class="flex items-center gap-1.5 text-sm font-semibold"><i data-lucide="plus" style="width:14px;height:14px"></i>New</span><span class="block text-[11px] text-white/40">Save current</span></button>`;
  return `<div class="mx-3 sm:mx-4"><div class="mb-1.5 flex items-center gap-1.5 text-[11px] font-bold uppercase tracking-wide text-white/45"><i data-lucide="wand-sparkles" style="width:13px;height:13px" class="text-[color:var(--treesh-purple)]"></i>Presets</div><div class="flex gap-2 overflow-x-auto no-scrollbar pb-1" data-testid="instrum-presets">${builtins}${customs}${addBtn}</div></div>`; }
function iNoise(ctx){ if(ctx._noise) return ctx._noise; const b=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate); const d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; ctx._noise=b; return b; }
function iTrigger(tr,t,ctx,dest){ const vol=tr.vol==null?0.85:tr.vol; const g=ctx.createGain(); g.connect(dest); const type=tr.type;
  const env=(a,d,peak)=>{ g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(peak*vol,t+a); g.gain.exponentialRampToValueAtTime(0.0001,t+a+d); };
  if(type==="kick"){ const o=ctx.createOscillator(); o.type="sine"; o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(48,t+0.12); env(0.001,0.4,1); o.connect(g); o.start(t); o.stop(t+0.45); }
  else if(type==="snare"){ const ns=ctx.createBufferSource(); ns.buffer=iNoise(ctx); const bp=ctx.createBiquadFilter(); bp.type="highpass"; bp.frequency.value=1200; ns.connect(bp); bp.connect(g); const o=ctx.createOscillator(); o.type="triangle"; o.frequency.value=190; o.connect(g); env(0.001,0.2,0.9); ns.start(t); ns.stop(t+0.2); o.start(t); o.stop(t+0.12); }
  else if(type==="clap"){ const bp=ctx.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=1500; bp.Q.value=0.7; bp.connect(g); g.gain.setValueAtTime(1,t); [0,0.012,0.024,0.04].forEach((off,i)=>{ const ns=ctx.createBufferSource(); ns.buffer=iNoise(ctx); const gg=ctx.createGain(); gg.gain.setValueAtTime(0.0001,t+off); gg.gain.linearRampToValueAtTime((i===3?0.5:0.9)*vol,t+off+0.001); gg.gain.exponentialRampToValueAtTime(0.0001,t+off+0.08); ns.connect(gg); gg.connect(bp); ns.start(t+off); ns.stop(t+off+0.09); }); }
  else if(type==="hat"||type==="openhat"){ const ns=ctx.createBufferSource(); ns.buffer=iNoise(ctx); const hp=ctx.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=7000; ns.connect(hp); hp.connect(g); const d=type==="hat"?0.05:0.3; env(0.001,d,0.55); ns.start(t); ns.stop(t+d+0.05); }
  else if(type==="tom"){ const o=ctx.createOscillator(); o.type="sine"; o.frequency.setValueAtTime(180,t); o.frequency.exponentialRampToValueAtTime(90,t+0.2); env(0.001,0.3,0.9); o.connect(g); o.start(t); o.stop(t+0.35); }
  else if(type==="bass"){ const f=noteFreq(tr.note||"C2"); const o=ctx.createOscillator(); o.type="sine"; o.frequency.setValueAtTime(f,t); const o2=ctx.createOscillator(); o2.type="triangle"; o2.frequency.setValueAtTime(f,t); env(0.005,0.45,1); o.connect(g); o2.connect(g); o.start(t); o2.start(t); o.stop(t+0.55); o2.stop(t+0.55); }
  else if(type==="lead"){ const f=noteFreq(tr.note||"C3"); const o=ctx.createOscillator(); o.type="sawtooth"; o.frequency.setValueAtTime(f,t); const lp=ctx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=2600; o.connect(lp); lp.connect(g); env(0.005,0.28,0.65); o.start(t); o.stop(t+0.35); }
  else if(type==="pad"){ const f=noteFreq(tr.note||"C3"); const lp=ctx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=1800; lp.connect(g); [0,4,7].forEach(semi=>{ const o=ctx.createOscillator(); o.type="sawtooth"; o.frequency.setValueAtTime(f*Math.pow(2,semi/12),t); o.connect(lp); o.start(t); o.stop(t+0.95); }); env(0.06,0.8,0.4); }
  else if(type==="pluck"){ const f=noteFreq(tr.note||"E3"); const o=ctx.createOscillator(); o.type="triangle"; o.frequency.setValueAtTime(f,t); env(0.002,0.22,0.7); o.connect(g); o.start(t); o.stop(t+0.28); }
}
function iClick(t,accent,ctx,dest){ const c=ctx||_iAC, d=dest||_iMaster; if(!c) return; const o=c.createOscillator(); const g=c.createGain(); o.type="square"; o.frequency.setValueAtTime(accent?2000:1350,t); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(accent?0.3:0.18,t+0.001); g.gain.exponentialRampToValueAtTime(0.0001,t+0.045); o.connect(g); g.connect(d); o.start(t); o.stop(t+0.06); }
function iSchedule(){ const S=state.instrum; if(!S||!S.playing) return; const ctx=_iAC; const p=S.project; const secStep=(60/p.bpm)/4; const total=p.bars*16;
  while(S.nextTime<ctx.currentTime+0.12){ const step=S.step; const swing=(step%2===1)?p.swing*secStep*0.6:0; const t=S.nextTime+swing; const solo=p.tracks.some(x=>x.solo); p.tracks.forEach(tr=>{ if(tr.steps[step]&&!tr.mute&&(!solo||tr.solo)) iTrigger(tr,t,_iAC,_iMaster); }); if(p.metronome && step%4===0){ iClick(S.nextTime, step===0, _iAC, _iMaster); } S.nextTime+=secStep; S.step=(step+1)%total; }
  S.timer=setTimeout(iSchedule,25); }
function iHighlightCol(col){ document.querySelectorAll("#instrum-grid .instrum-col-play").forEach(e=>e.classList.remove("instrum-col-play")); if(col<0) return; document.querySelectorAll('#instrum-grid [data-step="'+col+'"]').forEach(e=>e.classList.add("instrum-col-play")); }
function iVisual(){ const S=state.instrum; if(!S||!S.playing) return; const secStep=(60/S.project.bpm)/4; const total=S.project.bars*16; const cur=Math.floor((_iAC.currentTime-S.startTime)/secStep)%total; if(cur!==S.visStep){ S.visStep=cur; iHighlightCol(cur); } S.raf=requestAnimationFrame(iVisual); }

function encodeWAV(buf){ const nCh=buf.numberOfChannels,len=buf.length,sr=buf.sampleRate; const blockAlign=nCh*2; const dataLen=len*blockAlign; const ab=new ArrayBuffer(44+dataLen); const dv=new DataView(ab); let o=0; const ws=s=>{for(let i=0;i<s.length;i++)dv.setUint8(o++,s.charCodeAt(i));}; const w32=v=>{dv.setUint32(o,v,true);o+=4;}; const w16=v=>{dv.setUint16(o,v,true);o+=2;}; ws("RIFF");w32(36+dataLen);ws("WAVE");ws("fmt ");w32(16);w16(1);w16(nCh);w32(sr);w32(sr*blockAlign);w16(blockAlign);w16(16);ws("data");w32(dataLen); const chans=[]; for(let c=0;c<nCh;c++) chans.push(buf.getChannelData(c)); for(let i=0;i<len;i++){ for(let c=0;c<nCh;c++){ let v=Math.max(-1,Math.min(1,chans[c][i])); dv.setInt16(o, v<0?v*0x8000:v*0x7fff, true); o+=2; } } return ab; }

      <span class="hidden h-7 w-px shrink-0 bg-white/10 lg:block"></span>
      <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-0.5 lg:contents">
      <div class="flex h-10 shrink-0 items-center gap-1 rounded-xl border border-white/10 bg-white/5 px-2"><span class="pl-0.5 text-[9px] font-semibold uppercase tracking-wide text-white/40">Bars</span>${[1,2,4].map(b=>`<button data-act="i-bars" data-val="${b}" class="press h-7 w-7 rounded-lg text-sm font-bold ${p.bars===b?'bg-[color:var(--treesh-purple)] text-white':'text-white/55 hover:bg-white/10'}">${b}</button>`).join("")}</div>
      <button data-act="i-metronome" data-testid="instrum-metronome" aria-label="Metronome" class="tip i-btn h-10 w-10 shrink-0 ${p.metronome?'on':''}" data-tip="Metronome">${METRONOME_SVG}</button>
      <div class="tip flex h-10 shrink-0 items-center gap-2 rounded-xl border border-white/10 bg-white/5 px-2.5" data-tip="Swing groove"><i data-lucide="waves" style="width:14px;height:14px" class="text-white/45"></i><input type="range" min="0" max="0.6" step="0.05" value="${p.swing}" data-act="i-swing" aria-label="Swing" class="i-slider w-16"></div>
      <div class="tip flex h-10 shrink-0 items-center gap-2 rounded-xl border border-white/10 bg-white/5 px-2.5" data-tip="Master volume"><i data-lucide="volume-2" style="width:14px;height:14px" class="text-white/45"></i><input type="range" min="0" max="1" step="0.05" value="${p.master}" data-act="i-master" aria-label="Master volume" class="i-slider w-16"></div>
      <span class="h-6 w-px shrink-0 bg-white/10"></span>
      <button data-act="i-clear" data-testid="instrum-clear" aria-label="Clear grid" class="tip i-btn h-10 w-10 shrink-0" data-tip="Clear grid"><i data-lucide="eraser" style="width:16px;height:16px"></i></button>
      <button data-act="i-random" data-testid="instrum-random" aria-label="Randomize" class="tip i-btn h-10 w-10 shrink-0" data-tip="Randomize"><i data-lucide="dices" style="width:16px;height:16px"></i></button>
      </div>
    </div>
  </div>`; }
function instrumLaneCells(tr,ti,total){
  const label=`<div class="lane-label chan-strip flex flex-col justify-center gap-1 rounded-xl px-2 py-1.5" style="--tr-cell:${tr.color}">
     <div class="flex items-center gap-1.5"><span class="grid h-6 w-6 shrink-0 place-items-center rounded-md" style="background:${tr.color}26;color:${tr.color}"><i data-lucide="${tr.icon||'circle'}" style="width:13px;height:13px"></i></span><p class="clamp-1 flex-1 text-[11px] font-bold leading-tight">${esc(tr.name)}</p>${tr.melodic?`<select data-act="i-note" data-ti="${ti}" aria-label="${esc(tr.name)} note" class="shrink-0 rounded-md border border-white/10 bg-white/10 px-1 py-0.5 text-[10px] font-semibold text-white/85 outline-none">${INSTRUM_NOTES.map(n=>`<option ${n===tr.note?'selected':''}>${n}</option>`).join("")}</select>`:''}</div>
     <div class="flex items-center gap-1"><button data-act="i-mute" data-ti="${ti}" aria-label="Mute ${esc(tr.name)}" class="press grid h-6 w-6 shrink-0 place-items-center rounded-md border text-[10px] font-bold ${tr.mute?'border-rose-400/40 bg-rose-500/30 text-rose-100':'border-white/10 bg-white/5 text-white/50'}">M</button><button data-act="i-solo" data-ti="${ti}" aria-label="Solo ${esc(tr.name)}" class="press grid h-6 w-6 shrink-0 place-items-center rounded-md border text-[10px] font-bold ${tr.solo?'border-transparent bg-[color:var(--treesh-purple)] text-white':'border-white/10 bg-white/5 text-white/50'}">S</button><input type="range" min="0" max="1" step="0.05" value="${tr.vol}" data-act="i-vol" data-ti="${ti}" aria-label="${esc(tr.name)} volume" class="i-slider ml-0.5 min-w-0 flex-1"></div>
   </div>`;
  const cells=Array.from({length:total}).map((_,si)=>`<button data-act="i-step" data-ti="${ti}" data-step="${si}" aria-label="Step ${si+1}" class="instrum-cell ${si%4===0?'beat4':''} ${tr.steps[si]?'on':''}" style="--tr-cell:${tr.color}"></button>`).join("");
  return label+cells;
}
function instrumGridHtml(fs){ const p=state.instrum.project; const total=p.bars*16;
  const cols=`grid-template-columns:var(--laneW) repeat(${total},minmax(26px,1fr));grid-template-rows:16px;`;
  const ruler=`<div class="lane-label chan-spacer rounded-md"></div>`+Array.from({length:total}).map((_,i)=>`<div class="instrum-ruler-cell ${i%4===0?'beat4 text-white/55':'text-white/20'}">${i%4===0?(i/4+1):'\u00b7'}</div>`).join("");
  const lanes=p.tracks.map((tr,ti)=>instrumLaneCells(tr,ti,total)).join("");
  return `<div id="instrum-grid" class="studio-panel ${fs?'flex min-h-0 flex-1 flex-col ml-3 sm:ml-4':'mx-3 sm:mx-4'} overflow-auto no-scrollbar p-2 sm:p-3"><div class="instrum-seq ${fs?'fs-fill':''}" style="${cols}">${ruler}${lanes}</div></div>`; }
function instrumBeatsHtml(){ const list=state.beats||[]; if(!list.length) return `<div class="mx-3 mt-4 rounded-2xl border border-dashed border-white/12 bg-white/[0.03] p-5 text-center text-sm text-white/45 sm:mx-4"><i data-lucide="folder-open" style="width:22px;height:22px" class="mx-auto mb-2 text-white/35"></i>No saved beats yet \u2014 build something and hit <span class="font-semibold text-white/70">Save</span>.</div>`;
  return `<div class="mx-3 mt-4 sm:mx-4"><p class="mb-2 flex items-center gap-1.5 text-xs font-semibold uppercase tracking-wide text-white/45"><i data-lucide="folder" style="width:14px;height:14px"></i>My Beats <span class="rounded-full bg-white/10 px-1.5 text-[10px] text-white/60">${list.length}</span></p><div class="grid gap-2 sm:grid-cols-2">${list.map(b=>`<div class="flex items-center gap-3 rounded-2xl border border-white/10 bg-white/[0.04] p-3"><div class="grid h-11 w-11 shrink-0 place-items-center rounded-xl bg-[color:var(--treesh-purple)]/15 text-[color:var(--treesh-purple)]"><i data-lucide="disc-3" style="width:18px;height:18px"></i></div><div class="min-w-0 flex-1"><p class="clamp-1 text-sm font-semibold">${esc(b.name)}</p><p class="text-xs text-white/45">${b.bpm} BPM \u00b7 ${b.bars} bar${b.bars>1?'s':''}</p></div><button data-act="i-load" data-id="${b.id}" data-testid="instrum-open-${b.id}" class="press rounded-lg border border-white/12 bg-white/5 px-2.5 py-1.5 text-xs font-semibold hover:bg-white/10">Open</button><button data-act="i-del" data-id="${b.id}" aria-label="Delete" class="press grid h-8 w-8 place-items-center rounded-lg border border-white/10 text-rose-300 hover:bg-rose-500/10"><i data-lucide="trash-2" style="width:14px;height:14px"></i></button></div>`).join("")}</div></div>`; }
function instrumDockHtml(){ const p=state.instrum.project; const beats=state.beats||[]; const master=Math.round(p.master*100);
  const beatsList = beats.length? beats.map(b=>`<div class="flex items-center gap-2.5 rounded-xl border border-white/10 bg-white/[0.04] p-2.5"><div class="grid h-9 w-9 shrink-0 place-items-center rounded-lg bg-[color:var(--treesh-purple)]/15 text-[color:var(--treesh-purple)]"><i data-lucide="disc-3" style="width:15px;height:15px"></i></div><div class="min-w-0 flex-1"><p class="clamp-1 text-[13px] font-semibold">${esc(b.name)}</p><p class="text-[11px] text-white/45">${b.bpm} BPM \u00b7 ${b.bars} bar${b.bars>1?'s':''}</p></div><button data-act="i-load" data-id="${b.id}" class="press rounded-lg border border-white/12 bg-white/5 px-2 py-1 text-[11px] font-semibold hover:bg-white/10">Open</button><button data-act="i-del" data-id="${b.id}" aria-label="Delete" class="press grid h-7 w-7 place-items-center rounded-lg text-rose-300 hover:bg-rose-500/10"><i data-lucide="trash-2" style="width:13px;height:13px"></i></button></div>`).join("") : `<p class="rounded-xl border border-dashed border-white/12 bg-white/[0.03] p-4 text-center text-xs text-white/45">No saved beats yet.</p>`;
  const kit = INSTRUM_KIT.map(k=>`<span class="inline-flex items-center gap-1.5 rounded-full border border-white/10 bg-white/5 px-2.5 py-1 text-[10px] font-medium text-white/65"><span class="h-2 w-2 rounded-full" style="background:${k.color}"></span>${esc(k.name)}</span>`).join("");
  return `<div class="studio-dock-card p-4">
     <p class="mb-3 flex items-center gap-1.5 text-[10px] font-bold uppercase tracking-[0.2em] text-[color:var(--treesh-gold)]"><i data-lucide="gauge" style="width:13px;height:13px"></i>Master</p>
     <div class="flex items-stretch gap-4">
        <div class="flex flex-col items-center justify-end gap-2"><input type="range" min="0" max="1" step="0.02" value="${p.master}" data-act="i-master" aria-label="Master volume" class="fader-v h-32"><span class="text-[11px] font-bold text-white/70">${master}%</span></div>
        <div class="flex flex-1 flex-col gap-3">
           <button data-act="i-metronome" class="i-btn h-10 w-full ${p.metronome?'on':''}">${METRONOME_SVG}<span class="ml-1 text-xs font-semibold">Metronome</span></button>
           <div><div class="mb-1 flex items-center justify-between text-[10px] uppercase tracking-wide text-white/40"><span>Swing</span><span>${Math.round(p.swing*100)}%</span></div><input type="range" min="0" max="0.6" step="0.05" value="${p.swing}" data-act="i-swing" aria-label="Swing" class="i-slider w-full"></div>
           <div class="flex items-center gap-1 rounded-xl border border-white/10 bg-white/5 p-1">${[1,2,4].map(b=>`<button data-act="i-bars" data-val="${b}" class="press h-9 flex-1 rounded-lg text-xs font-bold ${p.bars===b?'bg-[color:var(--treesh-purple)] text-white':'text-white/55 hover:bg-white/10'}">${b} bar${b>1?'s':''}</button>`).join("")}</div>
        </div>
     </div>
   </div>
   <div class="studio-dock-card flex min-h-0 flex-1 flex-col p-4">
     <p class="mb-2 flex items-center gap-1.5 text-[10px] font-bold uppercase tracking-[0.2em] text-[color:var(--treesh-gold)]"><i data-lucide="folder" style="width:13px;height:13px"></i>My Beats <span class="rounded-full bg-white/10 px-1.5 text-[10px] text-white/60">${beats.length}</span></p>
     <div class="min-h-0 flex-1 space-y-2 overflow-y-auto no-scrollbar">${beatsList}</div>
   </div>
   <div class="studio-dock-card p-4">
     <p class="mb-2 text-[10px] font-bold uppercase tracking-[0.2em] text-[color:var(--treesh-gold)]">Kit</p>
     <div class="flex flex-wrap gap-1.5">${kit}</div>
   </div>`; }
function instrumStudioHtml(fs){ if(fs){ return `<div data-instrum-root class="flex h-full min-h-0 flex-col tr-fade-in">
    <div class="shrink-0">${instrumHeaderHtml(true)}${instrumTransportHtml(true)}</div>
    <div class="mt-3 flex min-h-0 flex-1 gap-3 overflow-hidden pb-[max(14px,env(safe-area-inset-bottom))]">
      ${instrumGridHtml(true)}
      <aside class="mr-3 hidden w-[320px] shrink-0 flex-col gap-3 overflow-hidden pb-1 sm:mr-4 lg:flex">${instrumDockHtml()}</aside>
    </div>
  </div>`; }
  return `<div data-instrum-root class="-mx-4 pb-8 sm:-mx-6 lg:-mx-8">${instrumHeaderHtml(false)}<div class="space-y-3">${instrumTransportHtml(false)}${instrumPresetsHtml()}${instrumGridHtml(false)}</div></div>`; }
function instrumFSPlaceholder(){ return `<div class="flex min-h-[60vh] flex-col items-center justify-center gap-4 text-center"><div class="grid h-16 w-16 place-items-center rounded-2xl bg-[color:var(--treesh-purple)]/15 text-[color:var(--treesh-purple)]"><i data-lucide="maximize-2" style="width:28px;height:28px"></i></div><p class="text-lg font-bold">Studio is in full screen</p><button data-act="i-fullscreen" class="press inline-flex items-center gap-2 rounded-2xl bg-[color:var(--treesh-purple)] px-5 py-3 text-sm font-bold text-white glow-purple"><i data-lucide="minimize-2" style="width:16px;height:16px"></i>Exit full screen</button></div>`; }
function viewInstrum(){ if(!state.instrum||!state.instrum.started) return instrumLanding(); if(state.instrum.fs) return instrumFSPlaceholder(); return instrumStudioHtml(false); }
/* ---------- Instrum render targets (view vs fullscreen overlay) ---------- */
function renderInstrum(animate){ if(state.instrum&&state.instrum.fs) renderInstrumFS(); else renderView(animate); iRenderMenu(); }
function renderInstrumFS(){ const c=document.getElementById("instrum-fs"); if(!c) return; if(!state.instrum||!state.instrum.fs){ c.innerHTML=""; return; } const _sm=captureScroll(c); c.innerHTML=`<div class="fs-shell">${instrumStudioHtml(true)}</div>`; icons(); restoreScroll(c,_sm); requestAnimationFrame(()=>{ if(state.instrum&&state.instrum.playing) iHighlightCol(state.instrum.visStep); }); }
function iToggleFullscreen(){ const S=state.instrum; if(!S) return; S.fs=!S.fs; if(S.fs){ renderView(); renderInstrumFS(); } else { const c=document.getElementById("instrum-fs"); if(c) c.innerHTML=""; renderView(true); } iRenderMenu(); syncScrollLock(); }
/* ---------- Instrum history (undo / redo) ---------- */
function iSnapshot(){ return JSON.stringify(state.instrum.project); }
function iPushHistory(){ const S=state.instrum; if(!S) return; if(!S.history) S.history=[]; S.history=S.history.slice(0,(S.hi==null?-1:S.hi)+1); S.history.push(iSnapshot()); if(S.history.length>80){ S.history.shift(); } S.hi=S.history.length-1; iUpdateUndoUI(); }
function iUpdateUndoUI(){ const S=state.instrum; if(!S) return; const canUndo=S.history&&S.hi>0, canRedo=S.history&&S.hi<(S.history.length-1); const u=document.querySelector('[data-act="i-undo"]'), r=document.querySelector('[data-act="i-redo"]'); if(u) u.disabled=!canUndo; if(r) r.disabled=!canRedo; }
function iApplySnapshot(json){ const S=state.instrum; if(!S||!json) return; if(S.playing) iStop(); S.project=JSON.parse(json); if(_iMaster) _iMaster.gain.value=S.project.master; renderInstrum(); iUpdateUndoUI(); }
function iUndo(){ const S=state.instrum; if(!S||!S.history||S.hi<=0) return; S.hi--; iApplySnapshot(S.history[S.hi]); toast("Undo"); }
function iRedo(){ const S=state.instrum; if(!S||!S.history||S.hi>=S.history.length-1) return; S.hi++; iApplySnapshot(S.history[S.hi]); toast("Redo"); }
function iToggleMetronome(){ const S=state.instrum; if(!S) return; S.project.metronome=!S.project.metronome; document.querySelectorAll('[data-act="i-metronome"]').forEach(b=>b.classList.toggle("on",S.project.metronome)); toast(S.project.metronome?"Metronome on":"Metronome off"); }
function iOpenSaveDialog(){ const S=state.instrum; if(!S) return; const p=S.project; openPrompt("Name your beat", p.name||"Untitled beat", (name)=>{ p.name=(name||"").trim()||"Untitled beat"; iSaveProject(); }); }
function iBpmStep(delta){ const S=state.instrum; if(!S) return; const p=S.project; p.bpm=Math.max(40,Math.min(220,(p.bpm||90)+delta)); const inp=document.querySelector('[data-act="i-bpm"]'); if(inp) inp.value=p.bpm; }

async function boot(){
  applyAccent(state.accent);
  applyTheme();
  starfield();
  const cachedTs = loadCatalogCache();
  if(cachedTs){
    init();                                  // instant boot from cache
    loadCatalog().then(res=>{ if(res.changed) softRefresh(); }).catch(()=>{}); // stale-while-revalidate
  } else {
    renderBootLoading();
    try{ await loadCatalog(); init(); }
    catch(e){ console.error("Catalog load failed:", e); renderBootError(); }
  }
  startCatalogPolling();
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",boot); else boot();

/* --- Global UX protections: block accidental zoom, protect images, full-tap date picker --- */
(function(){
  try{
    window.addEventListener("wheel", e=>{ if(e.ctrlKey||e.metaKey) e.preventDefault(); }, {passive:false});
    window.addEventListener("keydown", e=>{ if((e.ctrlKey||e.metaKey) && (e.key==="+"||e.key==="-"||e.key==="="||e.key==="0")) e.preventDefault(); });
    ["gesturestart","gesturechange","gestureend"].forEach(ev=>document.addEventListener(ev, e=>{ e.preventDefault(); }));
    document.addEventListener("contextmenu", e=>{ if(e.target && e.target.closest && e.target.closest("input,textarea,[contenteditable]")) return; e.preventDefault(); });
    document.addEventListener("dragstart", e=>{ if(e.target && e.target.tagName==="IMG") e.preventDefault(); });
    document.addEventListener("click", e=>{ const d=e.target && e.target.closest && e.target.closest('input[type="date"]'); if(d && !d.disabled && typeof d.showPicker==="function"){ try{ d.showPicker(); }catch(_){} } });
    ["input","change"].forEach(ev=>document.addEventListener(ev, e=>{ const t=e.target; if(t && t.classList && t.classList.contains("tdf-native")) syncDateField(t); }));
  }catch(e){}
})();
</script>
</body>
</html>
