<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Treesh 3.0 — Music to Live For</title>
<meta name="description" content="Treesh 3.0 — stream the underground. Music to Live For." />
<meta name="theme-color" content="#0a0a0b" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Special+Gothic+Expanded+One&family=Doto:wght@100..900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    future: { hoverOnlyWhenSupported: true },
    theme: { extend: { fontFamily: {
      display: ['"Special Gothic Expanded One"', 'sans-serif'],
      sans: ['Manrope', 'system-ui', 'sans-serif'],
      doto: ['Doto', 'monospace'],
    } } }
  };
</script>
<style>
  :root{
    --treesh-bg-0:#0a0a0b; --treesh-bg-1:#121214;
    --treesh-purple:#9328ff; --treesh-purple-soft:rgba(147,40,255,0.22);
    --treesh-gold:var(--treesh-purple); --treesh-stroke:rgba(255,255,255,0.14);
    --treesh-shadow:0 18px 60px rgba(0,0,0,0.55);
    --treesh-glow-purple:0 0 0 1px rgba(147,40,255,0.28),0 0 28px rgba(147,40,255,0.24);
    --treesh-glow-gold:var(--treesh-glow-purple);
  }
  *{ -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; background:var(--app-bg); color:var(--app-text); font-family:'Manrope',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overscroll-behavior-y:none; transition:background-color .3s ease, color .3s ease; }
  .font-display{ font-family:'Special Gothic Expanded One','Manrope',sans-serif; }
  .font-doto{ font-family:'Doto','Manrope',monospace; }
  .glass{ background:rgba(255,255,255,0.06); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border:1px solid var(--treesh-stroke); }
  .glass-strong{ background:rgba(255,255,255,0.09); backdrop-filter:blur(28px); -webkit-backdrop-filter:blur(28px); border:1px solid var(--treesh-stroke); }
  .glow-purple{ box-shadow:var(--treesh-glow-purple); }
  .glow-gold{ box-shadow:var(--treesh-glow-gold); }
  .no-scrollbar::-webkit-scrollbar{ display:none; } .no-scrollbar{ -ms-overflow-style:none; scrollbar-width:none; }
  .soft-scroll::-webkit-scrollbar{ width:8px;height:8px; } .soft-scroll::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.14); border-radius:999px; } .soft-scroll::-webkit-scrollbar-track{ background:transparent; }
  .clamp-1{ display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden; }
  .clamp-2{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  ::selection{ background:var(--treesh-purple-soft); color:#fff; }

  /* range sliders */
  input[type=range].tr{ -webkit-appearance:none; appearance:none; height:6px; border-radius:999px; background:rgba(255,255,255,0.16); outline:none; cursor:pointer; width:100%; }
  input[type=range].tr::-webkit-slider-runnable-track{ -webkit-appearance:none; appearance:none; height:6px; border-radius:999px; background:transparent; border:none; }
  input[type=range].tr::-webkit-slider-thumb{ -webkit-appearance:none; appearance:none; margin-top:-4px; width:14px; height:14px; border-radius:50%; background:#fff; box-shadow:0 0 10px var(--treesh-purple); border:none; }
  input[type=range].tr::-moz-range-track{ height:6px; border-radius:999px; background:transparent; border:none; }
  input[type=range].tr::-moz-range-thumb{ width:14px; height:14px; border:none; border-radius:50%; background:#fff; box-shadow:0 0 10px var(--treesh-purple); }
  input[type=range].tr:focus,input[type=range].tr:hover,input[type=range].tr:active{ outline:none; box-shadow:none; background:rgba(255,255,255,0.16); }
  input[type=range].tr:focus::-webkit-slider-runnable-track,input[type=range].tr:active::-webkit-slider-runnable-track,input[type=range].tr:hover::-webkit-slider-runnable-track{ background:transparent; }
  input[type=range].tr:focus-visible{ outline:none; }

  /* vinyl */
  .vinyl{ border-radius:50%; position:relative;
    background:repeating-radial-gradient(circle at center,rgba(255,255,255,0.045) 0px,rgba(255,255,255,0.045) 1px,rgba(0,0,0,0) 2px,rgba(0,0,0,0) 4px),radial-gradient(circle at 50% 50%,#1c1c20 0%,#0c0c0e 62%,#050506 100%);
    box-shadow:0 30px 80px rgba(0,0,0,0.6),inset 0 0 60px rgba(0,0,0,0.8); }
  .vinyl::after{ content:""; position:absolute; inset:8%; border-radius:50%; background:repeating-radial-gradient(circle at center,rgba(255,255,255,0.03) 0px,rgba(255,255,255,0.03) 1px,transparent 2px,transparent 5px); }
  .vinyl-label{ position:absolute; inset:33%; border-radius:50%; overflow:hidden; box-shadow:0 0 0 4px rgba(0,0,0,0.55),0 0 0 6px var(--treesh-purple-soft); background:#111; }
  .vinyl-hole{ position:absolute; top:50%; left:50%; width:10px; height:10px; border-radius:50%; background:#050506; transform:translate(-50%,-50%); box-shadow:0 0 0 2px rgba(255,255,255,0.15); z-index:3; }
  .spin{ animation:tspin 6s linear infinite; } .spin-paused{ animation-play-state:paused; }
  @keyframes tspin{ from{transform:rotate(0)} to{transform:rotate(360deg)} }

  /* equalizer */
  .eq{ display:inline-flex; align-items:flex-end; gap:2px; height:14px; }
  .eq span{ display:block; width:3px; height:100%; background:var(--treesh-purple); border-radius:2px; transform-origin:bottom; animation:teq .9s ease-in-out infinite; }
  .eq span:nth-child(2){ animation-delay:.15s } .eq span:nth-child(3){ animation-delay:.3s } .eq span:nth-child(4){ animation-delay:.45s }
  @keyframes teq{ 0%,100%{transform:scaleY(.3)} 50%{transform:scaleY(1)} }

  .shimmer{ background:linear-gradient(100deg,#fff 20%,var(--treesh-gold) 40%,#fff 60%); background-size:200% auto; -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; animation:tshim 6s linear infinite; }
  @keyframes tshim{ 0%{background-position:0% 50%} 100%{background-position:200% 50%} }

  .voice-pulse::before,.voice-pulse::after{ content:""; position:absolute; inset:0; border-radius:50%; border:2px solid var(--treesh-purple); animation:tping 1.6s cubic-bezier(0,0,0.2,1) infinite; }
  .voice-pulse::after{ animation-delay:.8s; }
  @keyframes tping{ 0%{transform:scale(1);opacity:.7} 100%{transform:scale(2.2);opacity:0} }
  /* voice assistant waveform + typing dots */
  .voice-wave{ display:flex; align-items:center; justify-content:center; gap:5px; height:38px; }
  .voice-wave span{ display:block; width:4px; height:100%; border-radius:999px; background:var(--treesh-purple); transform-origin:center; animation:vwave 1.05s ease-in-out infinite; }
  .voice-wave span:nth-child(1){animation-delay:-.9s} .voice-wave span:nth-child(2){animation-delay:-.7s} .voice-wave span:nth-child(3){animation-delay:-.5s} .voice-wave span:nth-child(4){animation-delay:-.3s} .voice-wave span:nth-child(5){animation-delay:-.15s} .voice-wave span:nth-child(6){animation-delay:-.45s} .voice-wave span:nth-child(7){animation-delay:-.65s}
  @keyframes vwave{ 0%,100%{transform:scaleY(.22)} 50%{transform:scaleY(1)} }
  .voice-dots span{ display:inline-block; animation:vdots 1.4s infinite; } .voice-dots span:nth-child(2){ animation-delay:.2s } .voice-dots span:nth-child(3){ animation-delay:.4s }
  @keyframes vdots{ 0%,60%,100%{opacity:.25} 30%{opacity:1} }

  /* ---------- motion system ---------- */
  .fade-in{ animation:tfade .34s cubic-bezier(.22,1,.36,1) both; } @keyframes tfade{ from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }
  .np-line{ transition:color .3s ease, transform .35s cubic-bezier(.22,1,.36,1), text-shadow .3s ease; }

  /* page / view navigation */
  .view-in{ animation:viewIn .42s cubic-bezier(.22,1,.36,1) both; } @keyframes viewIn{ from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:none} }
  /* scroll-reveal + staggered entrance */
  @keyframes trRevealUp{ from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:none} }
  .reveal-stagger{ animation:trRevealUp .5s cubic-bezier(.22,1,.36,1) both; }
  .io-reveal{ opacity:0; transform:translateY(18px); }
  .io-reveal.io-in{ opacity:1; transform:none; transition:opacity .6s cubic-bezier(.22,1,.36,1), transform .6s cubic-bezier(.22,1,.36,1); }
  html.perf-mode .reveal-stagger{ animation:none !important } html.perf-mode .io-reveal{ opacity:1 !important; transform:none !important }

  /* now-playing sheet */
  @keyframes npUp{ from{opacity:0;transform:translateY(7%)} to{opacity:1;transform:none} }
  @keyframes npDown{ from{opacity:1;transform:none} to{opacity:0;transform:translateY(9%)} }
  .np-entering{ animation:npUp .46s cubic-bezier(.22,1,.36,1) both; }
  .np-leaving{ animation:npDown .34s cubic-bezier(.4,0,1,.6) both; }
  @keyframes npContent{ from{opacity:0;transform:translateY(12px) scale(.99)} to{opacity:1;transform:none} }
  .np-content-in{ animation:npContent .38s cubic-bezier(.22,1,.36,1) both; }

  /* modal / popup */
  @keyframes backdropIn{ from{opacity:0} to{opacity:1} }
  @keyframes backdropOut{ from{opacity:1} to{opacity:0} }
  @keyframes panelIn{ from{opacity:0;transform:translateY(16px) scale(.95)} to{opacity:1;transform:none} }
  @keyframes panelOut{ from{opacity:1;transform:none} to{opacity:0;transform:translateY(10px) scale(.97)} }
  .backdrop-in{ animation:backdropIn .26s ease both; }
  .backdrop-out{ animation:backdropOut .2s ease both; }
  .panel-in{ animation:panelIn .4s cubic-bezier(.22,1,.36,1) both; }
  .panel-out{ animation:panelOut .2s cubic-bezier(.4,0,1,.6) both; }
  @keyframes obStep{ from{opacity:0;transform:translateX(22px)} to{opacity:1;transform:none} }
  .ob-step-in{ animation:obStep .34s cubic-bezier(.22,1,.36,1) both; }

  /* queue drawer */
  @keyframes drawerIn{ from{transform:translateX(100%)} to{transform:translateX(0)} }
  @keyframes drawerOut{ from{transform:translateX(0)} to{transform:translateX(100%)} }
  .drawer-in{ animation:drawerIn .42s cubic-bezier(.22,1,.36,1) both; }
  .drawer-out{ animation:drawerOut .3s cubic-bezier(.4,0,1,.6) both; }

  /* mini player */
  @keyframes miniUp{ from{opacity:0;transform:translateY(130%)} to{opacity:1;transform:none} }
  .mini-in{ animation:miniUp .5s cubic-bezier(.22,1,.36,1) both; }

  /* toast */
  @keyframes toastIn{ from{opacity:0;transform:translateY(-16px) scale(.95)} to{opacity:1;transform:none} }
  @keyframes toastOut{ from{opacity:1;transform:none} to{opacity:0;transform:translateY(-10px) scale(.98)} }
  .toast-in{ animation:toastIn .34s cubic-bezier(.22,1,.36,1) both; }
  .toast-out{ animation:toastOut .28s ease both; }

  /* micro interactions */
  .card-lift{ transition:transform .24s cubic-bezier(.22,1,.36,1), box-shadow .24s ease, border-color .24s ease; will-change:transform; }
  @media (hover:hover){ .card-lift:hover{ transform:translateY(-5px); } }
  .press{ transition:transform .13s ease; } .press:active{ transform:scale(.93); }

  /* what's new carousel */
  .wn-img{ transform:scale(1.05); }
  .wn-slide.wn-active .wn-img{ animation:wnZoom 7.5s ease-out both; }
  @keyframes wnZoom{ from{ transform:scale(1.05) } to{ transform:scale(1.16) } }

  /* ---------- like / favorite hearts (reliable, no JIT dependency) ---------- */
  .tr-like svg,.tr-favline svg{ transition:transform .2s cubic-bezier(.34,1.56,.64,1),fill .18s ease,color .18s ease; }
  .tr-like.is-liked svg,.tr-favline.is-liked svg{ fill:var(--treesh-purple); color:var(--treesh-purple); filter:drop-shadow(0 0 5px var(--treesh-purple-soft)); }
  .tr-like.is-liked{ color:var(--treesh-purple); }
  .tr-dislike svg{ transition:transform .2s cubic-bezier(.34,1.56,.64,1),color .18s ease; }
  .tr-dislike.is-disliked svg{ color:var(--treesh-purple); filter:drop-shadow(0 0 5px var(--treesh-purple-soft)); }
  .tr-dislike.is-disliked{ color:var(--treesh-purple); }
  @keyframes dislikeShake{ 0%{transform:rotate(0)} 20%{transform:rotate(-14deg)} 40%{transform:rotate(11deg)} 60%{transform:rotate(-7deg)} 80%{transform:rotate(4deg)} 100%{transform:rotate(0)} }
  .dislike-shake{ animation:dislikeShake .45s ease; }
  @keyframes heartPop{ 0%{transform:scale(1)} 25%{transform:scale(1.55)} 45%{transform:scale(.82)} 70%{transform:scale(1.14)} 100%{transform:scale(1)} }
  .heart-pop{ animation:heartPop .5s cubic-bezier(.34,1.56,.64,1); }
  @keyframes heartUnpop{ 0%{transform:scale(1)} 40%{transform:scale(.68)} 100%{transform:scale(1)} }
  .heart-unpop{ animation:heartUnpop .34s ease; }

  /* floating heart burst particles */
  #fx-layer{ position:fixed; inset:0; z-index:200; pointer-events:none; overflow:hidden; }
  .fx-heart{ position:fixed; will-change:transform,opacity; pointer-events:none; animation:fxFloat var(--dur,900ms) cubic-bezier(.22,1,.36,1) forwards; }
  .fx-heart svg{ display:block; width:var(--size,16px); height:var(--size,16px); }
  @keyframes fxFloat{
    0%{ transform:translate(-50%,-50%) scale(.2) rotate(0deg); opacity:0; }
    18%{ opacity:1; transform:translate(-50%,-50%) scale(1) rotate(calc(var(--rot)*.3)); }
    100%{ transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(var(--end,.55)) rotate(var(--rot)); opacity:0; }
  }
  .fx-ring{ position:fixed; width:16px; height:16px; border-radius:999px; border:2px solid var(--treesh-purple); pointer-events:none; animation:fxRing .58s cubic-bezier(.22,1,.36,1) forwards; }
  @keyframes fxRing{ from{ transform:translate(-50%,-50%) scale(.4); opacity:.65; } to{ transform:translate(-50%,-50%) scale(3.8); opacity:0; } }

  /* ---------- like = one big heart floating up like a balloon ---------- */
  .fx-balloon{ position:fixed; z-index:200; pointer-events:none; animation:fxBalloonUp 1.5s cubic-bezier(.22,1,.36,1) forwards; }
  .fx-balloon-inner{ display:block; animation:fxSway 1.5s ease-in-out both; }
  .fx-balloon svg{ display:block; width:66px; height:66px; filter:drop-shadow(0 10px 26px var(--treesh-purple-soft)); }
  @keyframes fxBalloonUp{ 0%{ transform:translate(-50%,-50%) scale(.35); opacity:0; } 15%{ opacity:1; transform:translate(-50%,-66%) scale(1.1); } 78%{ opacity:1; } 100%{ transform:translate(calc(-50% + var(--sway,0px)),-370px) scale(.82); opacity:0; } }
  @keyframes fxSway{ 0%{transform:translateX(0)} 22%{transform:translateX(-14px)} 48%{transform:translateX(12px)} 72%{transform:translateX(-8px)} 100%{transform:translateX(4px)} }
  /* ---------- dislike = broken heart ---------- */
  .fx-crack{ position:fixed; z-index:200; pointer-events:none; animation:fxCrack 1s cubic-bezier(.22,1,.36,1) forwards; }
  .fx-crack svg{ display:block; width:60px; height:60px; filter:drop-shadow(0 8px 20px var(--treesh-purple-soft)); }
  @keyframes fxCrack{ 0%{ transform:translate(-50%,-50%) scale(.4) rotate(0); opacity:0; } 16%{ opacity:1; transform:translate(-50%,-56%) scale(1.16) rotate(-5deg); } 28%{ transform:translate(-50%,-56%) scale(1.06) rotate(6deg); } 40%{ transform:translate(-50%,-54%) scale(1.06) rotate(-4deg); } 60%{ transform:translate(-50%,-48%) scale(1) rotate(3deg); } 100%{ transform:translate(-50%,16%) scale(.78) rotate(9deg); opacity:0; } }
  .fx-frag{ position:fixed; z-index:200; pointer-events:none; }
  .fx-frag svg{ display:block; width:22px; height:22px; }
  .fx-frag-l{ animation:fxFragL .82s cubic-bezier(.22,1,.36,1) forwards; }
  .fx-frag-r{ animation:fxFragR .82s cubic-bezier(.22,1,.36,1) forwards; }
  @keyframes fxFragL{ 0%{transform:translate(-50%,-50%) scale(.6); opacity:0} 20%{opacity:.9} 100%{transform:translate(calc(-50% - 48px),22px) scale(.65) rotate(-42deg); opacity:0} }
  @keyframes fxFragR{ 0%{transform:translate(-50%,-50%) scale(.6); opacity:0} 20%{opacity:.9} 100%{transform:translate(calc(-50% + 48px),22px) scale(.65) rotate(42deg); opacity:0} }
  html.perf-mode .fx-balloon, html.perf-mode .fx-crack, html.perf-mode .fx-frag{ display:none !important; }

  /* ---------- profile module (grows from top-right avatar) ---------- */
  #profile-panel{ transform-origin:calc(100% - 22px) 22px; }
  @keyframes profileIn{ 0%{ opacity:0; transform:scale(.16) translate3d(0,-6px,0); } 55%{ opacity:1; } 100%{ opacity:1; transform:scale(1) translate3d(0,0,0); } }
  @keyframes profileOut{ 0%{ opacity:1; transform:scale(1) translate3d(0,0,0); } 100%{ opacity:0; transform:scale(.16) translate3d(0,-6px,0); } }
  .profile-in{ animation:profileIn .44s cubic-bezier(.22,1,.36,1) both; }
  .profile-out{ animation:profileOut .26s cubic-bezier(.4,0,1,.6) both; }
  @keyframes pfContent{ from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none} }
  .pf-content-in{ animation:pfContent .28s ease .12s both; }
  @media (min-width:640px){ #profile-panel{ transform-origin:calc(100% - 8px) -12px; } }

  /* touch devices: never leave a sticky hover/tap background on controls */
  button:focus{ outline:none; }
  @media (pointer: coarse){
    .hover\:bg-white\/10:hover,.hover\:bg-white\/15:hover,.hover\:bg-white\/5:hover,.hover\:bg-white\/\[0\.07\]:hover{ background-color:transparent !important; }
  }

  html.perf-mode .fx-heart, html.perf-mode .fx-ring{ display:none !important }
  html.perf-mode .card-lift:hover{ transform:none !important }
  html.perf-mode #wn-track{ transition:none !important }

  /* ---------- extended tokens + utilities (phase additions) ---------- */
  :root{
    --treesh-ease:cubic-bezier(.22,1,.36,1);
    --treesh-dur-1:140ms; --treesh-dur-2:220ms; --treesh-dur-3:420ms;
    --treesh-stroke-faint:rgba(255,255,255,0.10);
    --treesh-focus:0 0 0 1px rgba(255,255,255,0.10),0 0 0 4px var(--treesh-purple-soft);
  }
  /* iOS: prevent input auto-zoom + viewport shift (font >=16px on small screens) */
  @media (max-width:640px){ input:not([type=range]),textarea,select{ font-size:16px !important; } }
  body.tr-locked{ overflow:hidden; }

  /* reusable panel + overlay motion */
  @keyframes trPanelIn{ from{opacity:0;transform:translateY(10px) scale(.98)} to{opacity:1;transform:none} }
  @keyframes trPanelOut{ from{opacity:1;transform:none} to{opacity:0;transform:translateY(10px) scale(.98)} }
  .tr-panel-in{ animation:trPanelIn var(--treesh-dur-3) var(--treesh-ease) both; }
  .tr-panel-out{ animation:trPanelOut var(--treesh-dur-2) var(--treesh-ease) both; }
  @keyframes trDockUp{ from{opacity:0;transform:translateY(26px)} to{opacity:1;transform:none} }
  .tr-dock-in{ animation:trDockUp var(--treesh-dur-3) var(--treesh-ease) both; }
  @keyframes trFadeIn{ from{opacity:0} to{opacity:1} }
  .tr-fade-in{ animation:trFadeIn var(--treesh-dur-2) ease both; }
  @keyframes trFadeOut{ from{opacity:1} to{opacity:0} }
  .tr-fade-out{ animation:trFadeOut var(--treesh-dur-2) ease both; }

  /* karaoke per-letter fill */
  @keyframes trLineSwap{ 0%{opacity:0;transform:translateY(16px) scale(.97)} 100%{opacity:1;transform:none} }
  .kar-line-in{ animation:trLineSwap .40s var(--treesh-ease) both; }
  .kar-ch{ --cp:0; background-image:linear-gradient(90deg,var(--treesh-purple),var(--treesh-purple) calc(var(--cp)*100%),rgba(255,255,255,0.26) calc(var(--cp)*100%),rgba(255,255,255,0.26)); -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent; will-change:background-image; }
  .kar-ch.lit{ filter:drop-shadow(0 0 15px var(--treesh-purple-soft)); }
  html.perf-mode .kar-ch.lit{ filter:none; }
  /* onboarding / welcome */
  #modal input[type=date]{ min-width:0; max-width:100%; box-sizing:border-box; }
  #modal input[type=date]::-webkit-date-and-time-value{ text-align:left; }
  .ob-blob{ position:absolute; border-radius:50%; filter:blur(80px); will-change:transform; }
  .ob-blob-1{ width:46vh; height:46vh; left:-12%; top:-8%; background:var(--treesh-purple); opacity:.5; animation:obFloat1 16s ease-in-out infinite; }
  .ob-blob-2{ width:40vh; height:40vh; right:-14%; top:16%; background:var(--treesh-gold); opacity:.26; animation:obFloat2 20s ease-in-out infinite; }
  .ob-blob-3{ width:52vh; height:52vh; left:8%; bottom:-22%; background:var(--treesh-purple); opacity:.4; animation:obFloat3 18s ease-in-out infinite; }
  @keyframes obFloat1{ 0%,100%{ transform:translate(0,0) scale(1);} 50%{ transform:translate(12%,10%) scale(1.12);} }
  @keyframes obFloat2{ 0%,100%{ transform:translate(0,0) scale(1);} 50%{ transform:translate(-10%,14%) scale(1.08);} }
  @keyframes obFloat3{ 0%,100%{ transform:translate(0,0) scale(1);} 50%{ transform:translate(8%,-10%) scale(1.15);} }
  .ob-anim{ animation:obAnim .5s var(--treesh-ease) both; }
  @keyframes obAnim{ from{ opacity:0; transform:translateY(16px);} to{ opacity:1; transform:translateY(0);} }
  html.perf-mode .ob-blob, html.perf-mode .ob-anim{ animation:none !important; }
  /* lyric explanations */
  .lyric-ex-ind{ box-shadow:0 0 0 0 var(--treesh-purple-soft); animation:exPulse 2.4s ease-in-out infinite; }
  html.perf-mode .lyric-ex-ind{ animation:none; }
  @keyframes exPulse{ 0%,100%{ box-shadow:0 0 0 0 var(--treesh-purple-soft); } 50%{ box-shadow:0 0 0 5px transparent; } }
  .lyric-explain-panel{ animation:exReveal .22s var(--treesh-ease); }
  @keyframes exReveal{ from{ opacity:0; transform:translateY(-4px); } to{ opacity:1; transform:translateY(0); } }
  #kar-cur{ overflow-wrap:anywhere; word-break:break-word; hyphens:auto; }

  /* ---------- Instrum studio ---------- */
  .instrum-cell{ position:relative; border-radius:6px; background:rgba(255,255,255,0.045); border:1px solid rgba(255,255,255,0.06); transition:transform .1s var(--treesh-ease), background .1s ease, box-shadow .1s ease; }
  .instrum-cell:hover{ background:rgba(255,255,255,0.1); }
  .instrum-cell.on{ background:var(--tr-cell,var(--treesh-purple)); border-color:transparent; box-shadow:0 0 12px var(--tr-cell,var(--treesh-purple-soft)); }
  .instrum-cell.beat4{ margin-left:6px; }
  .instrum-col-play{ box-shadow:inset 0 0 0 1px rgba(255,255,255,0.35), 0 0 10px rgba(255,255,255,0.12); background:rgba(255,255,255,0.12) !important; }

  @keyframes instrumHit{ 0%{transform:scale(1)} 40%{transform:scale(1.18)} 100%{transform:scale(1)} }
  .instrum-hit{ animation:instrumHit .18s var(--treesh-ease); }

  /* studio panels + channel strips */
  .studio-panel{ background:rgba(14,14,17,0.72); border:1px solid rgba(255,255,255,0.08); border-radius:20px; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }

  .chan-spacer{ position:sticky; left:0; z-index:6; background:#0e0e11; }
  html.theme-light .chan-spacer{ background:#f4f4f6; }
  /* beautiful control buttons */
  .i-btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; border-radius:12px; border:1px solid rgba(255,255,255,0.1); background:rgba(255,255,255,0.05); color:rgba(255,255,255,0.85); transition:background .16s var(--treesh-ease), border-color .16s var(--treesh-ease), transform .1s var(--treesh-ease); -webkit-tap-highlight-color:transparent; }
  .i-btn:hover{ background:rgba(255,255,255,0.1); }
  .i-btn:active{ transform:scale(.94); }
  .i-btn:disabled{ opacity:.35; pointer-events:none; }
  .i-btn.on{ background:var(--treesh-purple); border-color:transparent; color:#fff; box-shadow:0 0 0 1px var(--treesh-purple-soft), 0 6px 18px var(--treesh-purple-soft); }
  html.theme-light .i-btn{ background:rgba(0,0,0,0.04); border-color:rgba(0,0,0,0.1); color:rgba(0,0,0,0.8); }
  html.theme-light .i-btn:hover{ background:rgba(0,0,0,0.08); }
  /* LCD tempo readout */
  .i-lcd{ font-variant-numeric:tabular-nums; letter-spacing:.02em; color:var(--treesh-purple); text-shadow:0 0 14px var(--treesh-purple-soft); }
  .i-slider{ -webkit-appearance:none; appearance:none; height:4px; border-radius:999px; background:rgba(255,255,255,0.18); outline:none; }
  .i-slider::-webkit-slider-thumb{ -webkit-appearance:none; appearance:none; width:14px; height:14px; border-radius:50%; background:var(--treesh-purple); box-shadow:0 0 8px var(--treesh-purple-soft); cursor:pointer; }
  .i-slider::-moz-range-thumb{ width:14px; height:14px; border:0; border-radius:50%; background:var(--treesh-purple); cursor:pointer; }
  /* master meter */
  .i-meter{ position:relative; height:4px; border-radius:999px; background:rgba(255,255,255,0.14); overflow:hidden; }
  .i-meter > i{ position:absolute; inset:0 auto 0 0; width:var(--lvl,60%); background:linear-gradient(90deg,var(--treesh-purple),#fff); opacity:.85; }
  /* sequencer grid (fills width; stretches height in fullscreen) */
  .instrum-seq{ display:grid; gap:6px; align-items:stretch; --laneW:100px; grid-auto-rows:46px; }
  @media (min-width:640px){ .instrum-seq{ --laneW:152px; } }

  /* transport play/pause button */
  .i-play-btn{ position:relative; display:grid; place-items:center; height:54px; width:54px; border-radius:999px; background:linear-gradient(150deg,#a24bff,var(--treesh-purple) 55%,#7414d6); color:#fff; box-shadow:0 10px 24px -8px var(--treesh-purple), inset 0 1px 0 rgba(255,255,255,0.4); transition:transform .12s var(--treesh-ease), box-shadow .18s ease; }
  @media (min-width:640px){ .i-play-btn{ height:58px; width:58px; } }

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script>
/* ============================================================
   TREESH 3.0 — single-file build. Data embedded below.
   User data (favorites, playlists, profile, theme) -> localStorage.
   Audio + cover art stream from external hosts (free, CORS-enabled).
   ============================================================ */
/* ---------- utils ---------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const icons = () => { try { if (window.lucide) lucide.createIcons(); } catch(e){} };
const esc = (s) => String(s==null?"":s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const slug = (t) => (t||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"") || Math.random().toString(36).slice(2,8);
const FALLBACK = "data:image/svg+xml;utf8," + encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><rect width='100%' height='100%' fill='#161618'/><text x='50%' y='53%' font-size='120' text-anchor='middle' fill='#3a3a40' font-family='sans-serif'>\u266A</text></svg>");
const img = (src, cls, extra="") => `<img src="${esc(src||FALLBACK)}" loading="lazy" onerror="this.src='${FALLBACK}'" class="${cls}" ${extra}>`;
function fmt(sec){ if(!sec||isNaN(sec)||sec===Infinity) return "0:00"; const m=Math.floor(sec/60),s=Math.floor(sec%60); return m+":"+(s<10?"0":"")+s; }
function zodiac(b){ if(!b) return ""; const p=String(b).split("-"); if(p.length<3) return ""; const mo=+p[1],d=+p[2]; if(!mo||!d) return ""; const z=[["Capricorn",1,19],["Aquarius",2,18],["Pisces",3,20],["Aries",4,19],["Taurus",5,20],["Gemini",6,20],["Cancer",7,22],["Leo",8,22],["Virgo",9,22],["Libra",10,22],["Scorpio",11,21],["Sagittarius",12,21],["Capricorn",12,31]]; for(const[s,m,dd]of z){ if(mo===m&&d<=dd) return s; } return "Capricorn"; }
/* ---- age gate / parental controls ---- */
function ageFromDate(b){ if(!b) return null; const p=String(b).split("-"); if(p.length<3) return null; const y=+p[0],mo=+p[1],d=+p[2]; if(!y||!mo||!d) return null; const now=new Date(); let a=now.getFullYear()-y; const md=(now.getMonth()+1)*100+now.getDate(); if(md<(mo*100+d)) a--; return a; }
function userAge(){ const a=ageFromDate(state.profile&&state.profile.birthday); return (a!=null&&a>=0&&a<130)?a:null; }
function isUnderage(){ const a=userAge(); return a!==null && a<18; }
function explicitOK(){ return !isUnderage() || !!state.explicitUnlocked; }
function vis(list){ if(explicitOK()) return list; return (list||[]).filter(s=> s && !s.explicit); }
function bdayEditCount(){ return (state.bdayEdits!=null)?state.bdayEdits:((state.profile&&state.profile.birthday)?1:0); }
function bdayLocked(){ return bdayEditCount()>=2; }
function bumpBdayEdits(){ state.bdayEdits=bdayEditCount()+1; LS.set("treesh_bday_edits",state.bdayEdits); }

/* ============================================================
   LIVE CATALOG LOADER
   Data is fetched at runtime from same-origin content pages
   (/content/songs, /content/icons, /content/lyrics), parsed from
   HTML, normalized, and cached to localStorage. This keeps the app
   in sync with the live Treesh catalog with zero backend.
   ============================================================ */
let SONGS = [], ARTISTS = [], GENRES = [], SONG_BY_ID = {}, ARTIST_BY_ID = {};

const CONTENT_SOURCES = {
  songs:  ["content/songs",  "/content/songs",  "https://treesh.app/content/songs"],
  icons:  ["content/icons",  "/content/icons",  "https://treesh.app/content/icons"],
  lyrics: ["content/lyrics", "/content/lyrics", "https://treesh.app/content/lyrics"],
};
const CATALOG_KEY = "treesh_catalog_v2";

async function fetchFirst(urls){
  let lastErr;
  for(const u of urls){
    try{
      const ctrl = new AbortController(); const to = setTimeout(()=>ctrl.abort(), 15000);
      const r = await fetch(u, { cache:"no-store", signal: ctrl.signal }); clearTimeout(to);
      if(r.ok){ const t = await r.text(); if(t && t.trim().length > 40) return t; }
    }catch(e){ lastErr = e; }
  }
  throw lastErr || new Error("Unable to load "+urls[0]);
}
const parseDoc = (str) => new DOMParser().parseFromString(str, "text/html");
const attr = (el, name) => (el.getAttribute(name) || "").trim();
const normKey = (s) => String(s==null?"":s).toLowerCase().replace(/[\u2018\u2019\u201c\u201d]/g,"'").replace(/[^a-z0-9]+/g,"");

function parseSongs(doc){
  const used = new Set(), out = [];
  doc.querySelectorAll("ul.song").forEach((el, i) => {
    const title = attr(el,"data-track"), audioUrl = attr(el,"data-mp3");
    if(!title || !audioUrl) return; // skip template/empty rows
    const artist = attr(el,"data-artist"), aid = attr(el,"data-artist-id");
    let id = slug(artist + "-" + title) || ("track-" + i);
    while(used.has(id)) id = id + "-" + i;
    used.add(id);
    out.push({
      id, title, artist, artistIds: aid ? [aid] : [],
      genre: attr(el,"data-genre"), mood: attr(el,"data-mood"),
      creationDate: attr(el,"data-creation-date"), writtenBy: attr(el,"data-written-by"),
      producer: attr(el,"data-producer"), mixer: attr(el,"data-mixer"),
      videographer: attr(el,"data-videographer"), featuring: attr(el,"data-featuring"),
      album: attr(el,"data-album"), label: attr(el,"data-label"),
      coverArt: attr(el,"data-coverart"), audioUrl, videoId: attr(el,"data-video"),
      bio: attr(el,"data-bio"),
      explicit: el.hasAttribute("data-explicit"),
      treeshChoice: el.hasAttribute("data-treeshChoice") || el.hasAttribute("data-exclusive"),
      exclusive: el.hasAttribute("data-exclusive"),
      lyrics: [],
    });
  });
  return out;
}

function parseArtists(doc){
  const out = [];
  doc.querySelectorAll("article.artist").forEach(el => {
    const id = attr(el,"data-artist-id"); if(!id) return;
    const imgEl = el.querySelector("img.artist__image") || el.querySelector("img");
    const roleEl = el.querySelector(".artist__label .capital");
    const bg = attr(el,"data-bg");
    out.push({
      id, name: attr(el,"data-name"), bio: attr(el,"data-bio"),
      background: bg, bgPos: attr(el,"data-bg-pos") || "center",
      cashapp: attr(el,"data-cashapp"),
      role: roleEl ? roleEl.textContent.trim() : "Music Artist",
      image: (imgEl && imgEl.getAttribute("src")) || bg,
    });
  });
  return out;
}

function parseTimecode(str){
  if(!str) return 0;
  const parts = String(str).split(":").map(x => parseFloat(x));
  if(parts.some(isNaN)) return 0;
  if(parts.length === 3) return parts[0]*3600 + parts[1]*60 + parts[2];
  if(parts.length === 2) return parts[0]*60 + parts[1];
  return parts[0] || 0;
}
function parseLyrics(doc){
  const byKey = {}, byTitle = {};
  doc.querySelectorAll("div.lyric").forEach(el => {
    const track = attr(el,"data-track"), artist = attr(el,"data-artist");
    const lines = [];
    let curSec = null;
    el.querySelectorAll("p").forEach(p => {
      const text = p.textContent.trim(); if(!text) return;
      const dm = p.getAttribute("data-minutes"), ds = p.getAttribute("data-seconds");
      const hasM = dm!=null && dm.trim()!=="";
      const hasS = ds!=null && ds.trim()!=="";
      const hm = text.match(/^\[(.+)\]$/);
      if(hm){
        const inside = hm[1].trim();
        // section marker (e.g. "Verse 1: Artist"); skip pure repeat/adlib markers like "x2"
        if(/[a-zA-Z]/.test(inside) && !/^x\s*\d+$/i.test(inside)) curSec = inside;
        return; // bracket lines are markers, not sung lyric lines
      }
      const t = hasM ? (dm.includes(":") ? parseTimecode(dm) : (parseFloat(dm)||0)) : (hasS ? (parseFloat(ds)||0) : null);
      if(t==null) return; // skip untimed, non-header text
      const explain = (p.getAttribute("data-explain")||"").trim();
      lines.push({ t, text, sec: curSec, explain });
    });
    if(!lines.length) return;
    lines.sort((a,b) => a.t - b.t);
    byKey[normKey(track) + "|" + normKey(artist)] = lines;
    if(!byTitle[normKey(track)]) byTitle[normKey(track)] = lines;
  });
  return { byKey, byTitle };
}
function attachLyrics(songs, lyr){
  songs.forEach(s => { s.lyrics = lyr.byKey[normKey(s.title)+"|"+normKey(s.artist)] || lyr.byTitle[normKey(s.title)] || []; });
}
function indexCatalog(){
  SONG_BY_ID = Object.fromEntries(SONGS.map(s => [s.id, s]));
  ARTIST_BY_ID = Object.fromEntries(ARTISTS.map(a => [a.id, a]));
  GENRES = [...new Set(SONGS.map(s => s.genre).filter(Boolean))].sort();
  applyLyricEdits();
}
function applyLyricEdits(){ try{ const ed=(state&&state.lyricEdits)||{}; for(const id in ed){ if(SONG_BY_ID[id] && Array.isArray(ed[id])) SONG_BY_ID[id].lyrics=ed[id]; } }catch(e){} }
let _catalogSig = "";
function catalogSig(songs, artists){
  const str = songs.map(x=>x.id).join(",") + "~" + artists.map(x=>x.id).join(",");
  let h=0; for(let i=0;i<str.length;i++){ h=(h*31 + str.charCodeAt(i))>>>0; }
  return songs.length + "|" + artists.length + "|" + h;
}
async function loadCatalog(){
  const [songsHTML, iconsHTML, lyricsHTML] = await Promise.all([
    fetchFirst(CONTENT_SOURCES.songs),
    fetchFirst(CONTENT_SOURCES.icons),
    fetchFirst(CONTENT_SOURCES.lyrics),
  ]);
  const songs = parseSongs(parseDoc(songsHTML));
  const artists = parseArtists(parseDoc(iconsHTML));
  attachLyrics(songs, parseLyrics(parseDoc(lyricsHTML)));
  if(!songs.length) throw new Error("No songs found in catalog");
  const sig = catalogSig(songs, artists);
  const changed = sig !== _catalogSig;
  SONGS = songs; ARTISTS = artists; indexCatalog(); _catalogSig = sig;
  if(changed){ state._wnBuilt=null; state._picks=null; }
  try{ localStorage.setItem(CATALOG_KEY, JSON.stringify({ songs: SONGS, artists: ARTISTS, ts: Date.now() })); }catch(e){}
  return { changed };
}
function loadCatalogCache(){
  try{
    const c = JSON.parse(localStorage.getItem(CATALOG_KEY) || "null");
    if(c && Array.isArray(c.songs) && c.songs.length){ SONGS = c.songs; ARTISTS = c.artists || []; indexCatalog(); _catalogSig = catalogSig(SONGS, ARTISTS); return c.ts || 0; }
  }catch(e){}
  return 0;
}
/* ---------- real-time catalog polling (keeps What's New fresh) ---------- */
let _catalogPollTimer=null, _refreshing=false;
async function refreshCatalog(){
  if(_refreshing) return; _refreshing=true;
  const prevS=SONGS.length, prevA=ARTISTS.length;
  try{
    const res = await loadCatalog();
    if(res.changed){
      softRefresh();
      const dS=SONGS.length-prevS, dA=ARTISTS.length-prevA;
      if(dS>0||dA>0){ const parts=[]; if(dS>0)parts.push(dS+" new song"+(dS>1?"s":"")); if(dA>0)parts.push(dA+" new artist"+(dA>1?"s":"")); toast("What\u2019s New updated", parts.join(" \u00B7 ")); }
    }
  }catch(e){}
  finally{ _refreshing=false; }
}
function startCatalogPolling(){
  if(_catalogPollTimer) return;
  _catalogPollTimer = setInterval(refreshCatalog, 60000);
  document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") refreshCatalog(); });
  window.addEventListener("focus", refreshCatalog);
}

/* ---------- local storage ---------- */
const LS = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} },
};

/* ---------- state ---------- */
const state = {
  view: "library", param: null,
  genre: "all", query: "",
  favorites: new Set(LS.get("treesh_favorites", [])),
  dislikes: new Set(LS.get("treesh_dislikes", [])),
  playlists: LS.get("treesh_playlists", []),
  profile: LS.get("treesh_profile", null),
  accent: LS.get("treesh_accent", "#9328ff"),
  theme: LS.get("treesh_theme", "dark"),
  bg: LS.get("treesh_bg", "mono"),
  bgImage: LS.get("treesh_bg_image", ""),
  bgOverlay: LS.get("treesh_bg_overlay", true),
  textSize: LS.get("treesh_text_size", "md"),
  sleepMin: LS.get("treesh_sleep", 0), sleep: false,
  contextList: [],
  // player
  audio: new Audio(),
  queue: [], base: [], index: -1,
  isPlaying: false, duration: 0, currentTime: 0, volume: 1,
  shuffle: false, repeat: "off",
  // now playing UI
  npOpen: false, showLyrics: false, vinylMode: LS.get("treesh_vinyl", false), queueOpen: false,
  palette: null, lyricLines: [],
  favLyrics: LS.get("treesh_fav_lyrics", []),
  gameStats: LS.get("treesh_game_stats", {games:0,totalScore:0,bestScore:0,rounds:0,correct:0,bestStreak:0,perfects:0,lastPlayed:0,bestSong:null,recent:[]}),
  gameOpts: LS.get("treesh_game_opts", {timer:false, exact:false}),
  libGrid: LS.get("treesh_lib_grid", true),
  gameGrid: LS.get("treesh_game_grid", false),
  gameQuery: "",
  gameTab: "home",
  totGenre: "",
  totWins: LS.get("treesh_tot", {wins:{}, plays:0, bestStreak:0}),
  explicitUnlocked: false,
  parentPin: LS.get("treesh_parent_pin", null),
  bdayEdits: (function(){ const v=LS.get("treesh_bday_edits",null); if(v!=null) return v; const pr=LS.get("treesh_profile",null); return (pr&&pr.birthday)?1:0; })(),
  profileOpen: false, profileTab: "favorites", settingsTab: "appearance",
  searchOpen: false, searchTab: "songs", searchQuery: "", recentSearches: LS.get("treesh_recent_searches", []),
  karaoke: false, lyricsEdit: false, lyricEdits: LS.get("treesh_lyric_edits", {}),
  studio: null, game: null, tot: null,
  perfMode: LS.get("treesh_perf", false),
  explainAuto: LS.get("treesh_explain_auto", false),
  viz: Object.assign({enabled:true, style:"bars", color:"accent", customColor:"#9328ff", mirror:true, glow:true, sensitivity:1.3, bgStyle:"bars"}, LS.get("treesh_viz", {})),
  beats: LS.get("treesh_beats", []),
  instrum: null,
};

/* one-time default migration: move users still on the old default background ("space") to the new default ("mono"). Anyone who explicitly picked another background is left untouched. */
if(!LS.get("treesh_bg_default_v2", false)){ if(LS.get("treesh_bg","space")==="space"){ state.bg="mono"; LS.set("treesh_bg","mono"); } LS.set("treesh_bg_default_v2", true); }

/* ---------- theme ---------- */
function hexToRgb(hex){ const c=hex.replace("#",""); const n=c.length===3?c.split("").map(x=>x+x).join(""):c; return {r:parseInt(n.slice(0,2),16),g:parseInt(n.slice(2,4),16),b:parseInt(n.slice(4,6),16)}; }
function applyAccent(hex){ const {r,g,b}=hexToRgb(hex); const root=document.documentElement.style; root.setProperty("--treesh-purple",hex); root.setProperty("--treesh-purple-soft",`rgba(${r},${g},${b},0.22)`); root.setProperty("--treesh-glow-purple",`0 0 0 1px rgba(${r},${g},${b},0.28),0 0 28px rgba(${r},${g},${b},0.24)`); }

/* ---------- scroll lock (blocks background scroll under overlays on mobile) ---------- */
let _locked=false, _scrollLockY=0;
function overlaysOpen(){ const m=document.getElementById("modal"); return !!(state.npOpen||state.queueOpen||state.profileOpen||state.searchOpen||state.game||state.tot||state.sleep||(state.instrum&&state.instrum.fs)||(typeof listening!=="undefined"&&listening)||document.getElementById("voice-ov")||(m&&m.childElementCount>0)); }
function syncScrollLock(){ const on=overlaysOpen(); if(on===_locked) return; _locked=on; const b=document.body; if(on){ _scrollLockY=window.scrollY||window.pageYOffset||0; b.style.top="-"+_scrollLockY+"px"; b.style.left="0"; b.style.right="0"; b.style.width="100%"; b.style.position="fixed"; b.classList.add("tr-locked"); } else { b.classList.remove("tr-locked"); b.style.position=""; b.style.top=""; b.style.left=""; b.style.right=""; b.style.width=""; window.scrollTo(0,_scrollLockY); } }

/* ---------- THEME + BACKGROUND ENGINE ---------- */
const BG_GRADIENTS={
  aurora:"radial-gradient(60% 55% at 18% 12%, var(--treesh-purple-soft), transparent 60%), radial-gradient(55% 55% at 85% 20%, rgba(45,212,191,0.20), transparent 60%), radial-gradient(70% 60% at 55% 108%, rgba(195,171,105,0.16), transparent 60%)",
  dusk:"radial-gradient(70% 60% at 80% 8%, rgba(255,45,120,0.20), transparent 60%), linear-gradient(160deg, var(--treesh-purple-soft), transparent 55%)",
  nebula:"radial-gradient(50% 45% at 25% 25%, rgba(147,40,255,0.26), transparent 60%), radial-gradient(55% 50% at 80% 70%, rgba(96,165,250,0.20), transparent 60%), radial-gradient(45% 45% at 60% 15%, rgba(255,45,120,0.14), transparent 60%)",
  ocean:"radial-gradient(60% 55% at 20% 20%, rgba(34,211,238,0.22), transparent 60%), radial-gradient(60% 55% at 85% 80%, rgba(99,102,241,0.20), transparent 60%)",
  sunset:"linear-gradient(180deg, rgba(245,158,11,0.18), transparent 45%), radial-gradient(60% 55% at 75% 12%, rgba(255,45,120,0.20), transparent 60%)",
  mono:"radial-gradient(70% 60% at 30% 10%, rgba(140,140,150,0.16), transparent 60%), radial-gradient(60% 55% at 85% 90%, rgba(120,120,130,0.12), transparent 60%)"
};
const BACKGROUNDS=[
  {id:"space", name:"Space", ic:"sparkles"},
  {id:"solid", name:"Solid", ic:"square"},
  {id:"accent", name:"Accent", ic:"droplet"},
  {id:"aurora", name:"Aurora", ic:"waves"},
  {id:"nebula", name:"Nebula", ic:"orbit"},
  {id:"dusk", name:"Dusk", ic:"sunset"},
  {id:"ocean", name:"Ocean", ic:"waves"},
  {id:"sunset", name:"Sunset", ic:"sun"},
  {id:"mono", name:"Mono", ic:"circle"},
  {id:"custom", name:"Image", ic:"image"}
];
function bgPreviewStyle(id){
  if(id==="space") return "background:#0d0d12;";
  if(id==="solid") return "background:var(--app-bg);";
  if(id==="accent") return "background:radial-gradient(circle at 50% 20%,var(--treesh-purple),#0d0d12 80%);";
  if(id==="custom") return state.bgImage?`background-image:url('${state.bgImage}');background-size:cover;background-position:center;`:"background:linear-gradient(135deg,#2a2a33,#14141a);";
  return "background:#0d0d12;"+(BG_GRADIENTS[id]?`background-image:${BG_GRADIENTS[id]};`:"");
}
function renderBackground(){
  let layer=document.getElementById("bg-layer");
  if(!layer){ layer=document.createElement("div"); layer.id="bg-layer"; document.body.insertBefore(layer, document.body.firstChild); }
  const bg=state.bg; const stars=document.getElementById("stars"); const isSpace=(bg==="space");
  if(stars) stars.style.display=isSpace?"":"none";
  layer.style.background=""; layer.style.backgroundImage=""; layer.style.opacity="1"; layer.innerHTML="";
  if(bg==="solid"||isSpace){ /* body base color shows through */ }
  else if(bg==="accent"){ layer.style.background="radial-gradient(90% 65% at 50% -12%, var(--treesh-purple-soft), transparent 62%)"; layer.innerHTML=`<div style="position:absolute;inset:0;background:var(--treesh-purple);opacity:0.06"></div>`; }
  else if(bg==="custom"){ if(state.bgImage){ layer.style.backgroundImage=`url("${state.bgImage}")`; layer.style.backgroundSize="cover"; layer.style.backgroundPosition="center"; if(state.bgOverlay){ layer.innerHTML=`<div style="position:absolute;inset:0;background:var(--app-bg);opacity:0.6"></div>`; } } }
  else if(BG_GRADIENTS[bg]){ layer.style.backgroundImage=BG_GRADIENTS[bg]; }
}
function applyTextSize(){ const map={sm:"14px",md:"16px",lg:"18px"}; document.documentElement.style.fontSize=map[state.textSize]||"16px"; }
function applyTheme(){
  const h=document.documentElement;
  h.classList.toggle("theme-light", state.theme==="light");
  h.classList.toggle("theme-dark", state.theme!=="light");
  const meta=document.querySelector('meta[name="theme-color"]'); if(meta) meta.setAttribute("content", state.theme==="light"?"#fefefe":"#121212");

  renderBackground();
}

/* ---------- SLEEP TIMER (ambient now-playing clock after inactivity) ---------- */
let _sleepTO=null,_sleepClk=null,_sleepSig="",_lastMove=0;
function resetSleepTimer(){ if(_sleepTO){ clearTimeout(_sleepTO); _sleepTO=null; } if(state.sleep) return; if(!state.sleepMin||state.sleepMin<=0) return; _sleepTO=setTimeout(showSleepOverlay, state.sleepMin*60000); }
function onSleepActivity(){ if(state.sleep) return; if(state.sleepMin>0) resetSleepTimer(); }
function clk(d){ let h=d.getHours(); const m=d.getMinutes(); const ap=h>=12?"PM":"AM"; h=h%12||12; return {t:h+":"+String(m).padStart(2,"0"),ap}; }
function sleepDate(d){ try{ return d.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"}); }catch(e){ return ""; } }
function sleepNPInner(s){ if(!s) return `<p class="py-4 text-center text-sm text-white/50">Nothing playing right now</p>`; return `<div class="flex items-center gap-4 rounded-3xl border border-white/12 bg-white/5 p-4 backdrop-blur-xl"><div class="h-16 w-16 shrink-0 overflow-hidden rounded-2xl">${img(s.coverArt,'h-full w-full object-cover')}</div><div class="min-w-0 flex-1"><p class="clamp-1 text-lg font-bold text-white">${esc(s.title)}</p><p class="clamp-1 text-sm text-white/60">${esc(s.artist)}</p></div><button data-act="sleep-pause" data-testid="sleep-pause-button" aria-label="${state.isPlaying?'Pause':'Play'}" class="press grid h-14 w-14 shrink-0 place-items-center rounded-full bg-white text-black shadow-lg transition-transform hover:scale-105"><i data-lucide="${state.isPlaying?'pause':'play'}" style="width:24px;height:24px"></i></button></div>`; }
function renderSleep(){ const c=$("#sleep"); if(!c) return; const d=new Date(); const {t,ap}=clk(d); const s=curSong(); _sleepSig=(s?s.id:'')+'|'+state.isPlaying; c.innerHTML=`<div data-act="sleep-dismiss" data-testid="sleep-overlay" class="fixed inset-0 z-[120] overflow-hidden tr-fade-in" style="background:#08080a"><div class="absolute inset-0 scale-110 opacity-40 blur-3xl" style="background-image:url('${(s&&s.coverArt)||''}');background-size:cover;background-position:center"></div><div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(8,8,10,0.5),rgba(8,8,10,0.86))"></div><div class="gauss gauss-a"></div><div class="gauss gauss-b"></div><div class="relative z-10 flex h-full w-full flex-col items-center justify-between px-6 pt-[max(32px,env(safe-area-inset-top))] pb-[max(28px,env(safe-area-inset-bottom))] text-white"><div class="mt-8 flex flex-col items-center text-center sm:mt-12"><div class="flex items-start gap-2"><span id="sleep-time" class="font-display leading-[0.9] tracking-tight" style="font-size:clamp(64px,17vw,150px)">${t}</span><span id="sleep-ap" class="mt-2 text-xl font-semibold text-white/55 sm:mt-4 sm:text-3xl">${ap}</span></div><p id="sleep-date" class="mt-4 text-xs uppercase tracking-[0.35em] text-[color:var(--treesh-gold)] sm:text-sm">${sleepDate(d)}</p></div><div class="w-full max-w-md"><div id="sleep-np">${sleepNPInner(s)}</div><p class="mt-4 text-center text-xs text-white/35">Tap anywhere to dismiss</p></div></div></div>`; icons(); }
function showSleepOverlay(){ if(state.sleep) return; if(!curSong()){ resetSleepTimer(); return; } state.sleep=true; renderSleep(); syncScrollLock(); if(_sleepClk) clearInterval(_sleepClk); _sleepClk=setInterval(tickSleep,1000); }
function tickSleep(){ if(!state.sleep){ if(_sleepClk){clearInterval(_sleepClk);_sleepClk=null;} return; } const d=new Date(); const {t,ap}=clk(d); const te=$("#sleep-time"); if(te)te.textContent=t; const ae=$("#sleep-ap"); if(ae)ae.textContent=ap; const de=$("#sleep-date"); if(de)de.textContent=sleepDate(d); const s=curSong(); const sig=(s?s.id:'')+'|'+state.isPlaying; if(sig!==_sleepSig){ _sleepSig=sig; const np=$("#sleep-np"); if(np){ np.innerHTML=sleepNPInner(s); icons(); } } }
function closeSleep(){ if(!state.sleep) return; state.sleep=false; if(_sleepClk){ clearInterval(_sleepClk); _sleepClk=null; } const c=$("#sleep"); if(c) c.innerHTML=""; syncScrollLock(); resetSleepTimer(); }
function initSleep(){ ["pointerdown","keydown","touchstart","wheel"].forEach(ev=>document.addEventListener(ev,onSleepActivity,{passive:true})); document.addEventListener("mousemove",()=>{ const n=Date.now(); if(n-_lastMove<1500) return; _lastMove=n; onSleepActivity(); },{passive:true}); resetSleepTimer(); }

/* ---------- toast ---------- */
function toast(msg, sub){ const t=$("#toast"); const el=document.createElement("div"); el.className="glass-strong rounded-xl px-4 py-2.5 text-sm text-white shadow-[var(--treesh-shadow)] toast-in"; el.innerHTML=`<div class="font-semibold">${esc(msg)}</div>${sub?`<div class="text-xs text-white/60">${esc(sub)}</div>`:""}`; t.appendChild(el); while(t.children.length>3) t.removeChild(t.firstChild); setTimeout(()=>{ el.classList.remove("toast-in"); el.classList.add("toast-out"); setTimeout(()=>el.remove(),280); }, 2200); }

/* ---------- favorites / playlists persistence ---------- */
function saveFav(){ LS.set("treesh_favorites",[...state.favorites]); }
function savePl(){ LS.set("treesh_playlists",state.playlists); }
function isFav(id){ return state.favorites.has(id); }
function toggleFav(id){ const s=SONG_BY_ID[id]; const was=isFav(id); if(was) state.favorites.delete(id); else { state.favorites.add(id); if(state.dislikes.has(id)){ state.dislikes.delete(id); saveDislikes(); } } saveFav(); toast(was?"Removed from Favorites":"Added to Favorites", s&&s.title); refreshDynamic(); }
function isDisliked(id){ return state.dislikes.has(id); }
function saveDislikes(){ LS.set("treesh_dislikes",[...state.dislikes]); }
function toggleDislike(id){ const s=SONG_BY_ID[id]; const was=isDisliked(id); if(was){ state.dislikes.delete(id); } else { state.dislikes.add(id); if(isFav(id)){ state.favorites.delete(id); saveFav(); } } saveDislikes(); toast(was?"Removed from dislikes":"Disliked \u2014 we\u2019ll play this less", s&&s.title); refreshDynamic(); }
function favSongs(){ return vis([...state.favorites].map(id=>SONG_BY_ID[id]).filter(Boolean).reverse()); }
function createPlaylist(name, songIds=[]){ const pl={id:"pl_"+Date.now()+"_"+Math.random().toString(36).slice(2,6),name,songIds,createdAt:Date.now()}; state.playlists.unshift(pl); savePl(); toast("Playlist created",name); return pl; }
function plById(id){ return state.playlists.find(p=>p.id===id); }

/* ---------- like / dislike heart FX ---------- */
const HEART_SVG='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="__F__" stroke="__S__" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"/></svg>';
const CRACK_SVG='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="__C__" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"/><path d="M12 4.5 10 9l3 2.1-2.4 4.2"/></svg>';
function fxLayer(){ let l=document.getElementById("fx-layer"); if(!l){ l=document.createElement("div"); l.id="fx-layer"; document.body.appendChild(l); } return l; }
/* LIKE: a single big accent heart drifts up like a balloon */
function flyHeart(x,y){
  if(state.perfMode) return; if(x==null||y==null||isNaN(x)||isNaN(y)) return;
  const layer=fxLayer();
  const wrap=document.createElement("span"); wrap.className="fx-balloon";
  wrap.style.left=x+"px"; wrap.style.top=y+"px";
  wrap.style.setProperty("--sway",((Math.random()*2-1)*24).toFixed(0)+"px");
  const inner=document.createElement("span"); inner.className="fx-balloon-inner";
  inner.innerHTML=HEART_SVG.replace(/__F__/g,"var(--treesh-purple)").replace(/__S__/g,"var(--treesh-purple)");
  wrap.appendChild(inner); layer.appendChild(wrap);
  setTimeout(()=>wrap.remove(),1550);
}
/* DISLIKE: a broken heart shakes, splits and falls */
function breakHeart(x,y){
  if(state.perfMode) return; if(x==null||y==null||isNaN(x)||isNaN(y)) return;
  const layer=fxLayer();
  const el=document.createElement("span"); el.className="fx-crack"; el.style.left=x+"px"; el.style.top=y+"px";
  el.innerHTML=CRACK_SVG.replace(/__C__/g,"var(--treesh-purple)");
  layer.appendChild(el); setTimeout(()=>el.remove(),1050);
  for(let i=0;i<2;i++){ const f=document.createElement("span"); f.className="fx-frag "+(i?"fx-frag-r":"fx-frag-l"); f.style.left=x+"px"; f.style.top=y+"px"; f.innerHTML=HEART_SVG.replace(/__F__/g,"var(--treesh-purple)").replace(/__S__/g,"var(--treesh-purple)"); layer.appendChild(f); setTimeout(()=>f.remove(),840); }
}
/* back-compat wrapper: liking => balloon, un-like => no big fx */
function heartBurst(x,y,liking){ if(liking) flyHeart(x,y); }
function popHearts(id, liking){ requestAnimationFrame(()=>{ $$('[data-act="like"][data-id="'+id+'"]').forEach(b=>{ const sv=b.querySelector("svg"); if(sv){ sv.classList.remove("heart-pop","heart-unpop"); void sv.offsetWidth; sv.classList.add(liking?"heart-pop":"heart-unpop"); } }); }); }
function popDislike(id, on){ requestAnimationFrame(()=>{ $$('[data-act="dislike"][data-id="'+id+'"]').forEach(b=>{ const sv=b.querySelector("svg"); if(sv){ sv.classList.remove("dislike-shake"); void sv.offsetWidth; if(on) sv.classList.add("dislike-shake"); } }); }); }

/* ============================================================
   AUDIO ENGINE
   ============================================================ */
const audio = state.audio; audio.preload="metadata";
function shuffleKeepFirst(arr, i){ let rest=arr.filter((_,x)=>x!==i); rest=rest.filter(s=>!(s&&s.id&&state.dislikes.has(s.id))); for(let k=rest.length-1;k>0;k--){ const j=Math.floor(Math.random()*(k+1)); [rest[k],rest[j]]=[rest[j],rest[k]]; } return [arr[i],...rest]; }
function curSong(){ return state.index>=0 && state.index<state.queue.length ? state.queue[state.index] : null; }
function loadIndex(i, list, autoplay=true){ const q=list||state.queue; if(i<0||i>=q.length) return; state.index=i; const song=q[i]; if(audio.src!==song.audioUrl) audio.src=song.audioUrl; audio.load(); if(autoplay){ const p=audio.play(); if(p&&p.catch) p.catch(()=>{}); } }
function playSong(song, list){ const src=(list&&list.length)?list:[song]; state.base=src; let order=src, idx=Math.max(0,src.findIndex(s=>s.id===song.id)); if(state.shuffle){ order=shuffleKeepFirst(src,idx); idx=0; } state.queue=order; loadIndex(idx,order,true); state.npOpen=false; renderMini(); renderNP(); }
function togglePlay(){ if(!curSong()) return; if(audio.paused){ const p=audio.play(); if(p&&p.catch)p.catch(()=>{}); } else audio.pause(); }
function nextTrack(manual=false){ const q=state.queue; if(!q.length) return; if(state.repeat==="one"&&!manual){ loadIndex(state.index,q,true); return; } let n=state.index+1; if(n>=q.length){ if(state.repeat==="all"||manual) n=0; else { audio.pause(); return; } } loadIndex(n,q,true); }
function prevTrack(){ const q=state.queue; if(!q.length) return; if(audio.currentTime>3){ audio.currentTime=0; return; } let p=state.index-1; if(p<0)p=q.length-1; loadIndex(p,q,true); }
function seekTo(t){ if(!isNaN(t)) audio.currentTime=t; }
function setVolume(v){ audio.volume=v; state.volume=v; }
function toggleShuffle(){ state.shuffle=!state.shuffle; const cur=curSong(); if(state.base.length&&cur){ if(state.shuffle){ const i=state.base.findIndex(s=>s.id===cur.id); state.queue=shuffleKeepFirst(state.base,i>=0?i:0); state.index=0; } else { const i=state.base.findIndex(s=>s.id===cur.id); state.queue=state.base.slice(); state.index=i>=0?i:0; } } renderNP(); }
function cycleRepeat(){ state.repeat=state.repeat==="off"?"all":state.repeat==="all"?"one":"off"; renderNP(); }
function addToQueue(song, playNext=false){ if(!state.queue.length){ playSong(song,[song]); return true; } if(state.queue.some(s=>s.id===song.id)) return false; if(playNext) state.queue.splice(state.index+1,0,song); else state.queue.push(song); state.base=state.queue.slice(); return true; }
function removeFromQueue(id){ const i=state.queue.findIndex(s=>s.id===id); if(i<0) return; const wasCur=i===state.index; state.queue.splice(i,1); state.base=state.queue.slice(); if(wasCur){ if(!state.queue.length){ audio.pause(); state.index=-1; } else loadIndex(Math.min(i,state.queue.length-1),state.queue,true); } else if(i<state.index){ state.index--; } renderQueue(); renderNP(); renderMini(); }
function moveQueue(id, dir){ const i=state.queue.findIndex(s=>s.id===id); const j=i+dir; if(i<0||j<0||j>=state.queue.length) return; const cur=curSong(); [state.queue[i],state.queue[j]]=[state.queue[j],state.queue[i]]; state.base=state.queue.slice(); if(cur) state.index=state.queue.findIndex(s=>s.id===cur.id); renderQueue(); }

audio.addEventListener("play", ()=>{ state.isPlaying=true; updatePlayIcons(); if("mediaSession"in navigator) navigator.mediaSession.playbackState="playing"; });
audio.addEventListener("pause", ()=>{ state.isPlaying=false; updatePlayIcons(); if("mediaSession"in navigator) navigator.mediaSession.playbackState="paused"; });
audio.addEventListener("timeupdate", ()=>{ state.currentTime=audio.currentTime||0; updateProgress(); });
audio.addEventListener("loadedmetadata", ()=>{ state.duration=audio.duration||0; updateProgress(); });
audio.addEventListener("ended", ()=>nextTrack(false));
audio.addEventListener("error", ()=>{ state.isPlaying=false; });

/* ============================================================
   COLOR EXTRACTION (ambient gradient)
   ============================================================ */
const paletteCache = new Map();
function extractPalette(url){ return new Promise(res=>{ if(!url) return res(null); if(paletteCache.has(url)) return res(paletteCache.get(url)); const im=new Image(); im.crossOrigin="anonymous"; let done=false; const fin=v=>{ if(!done){done=true; paletteCache.set(url,v); res(v);} }; const to=setTimeout(()=>fin(null),6000); im.onload=()=>{ clearTimeout(to); try{ const s=36,cv=document.createElement("canvas"); cv.width=s; cv.height=s; const ctx=cv.getContext("2d",{willReadFrequently:true}); ctx.drawImage(im,0,0,s,s); const d=ctx.getImageData(0,0,s,s).data; const buk={}; for(let i=0;i<d.length;i+=4){ if(d[i+3]<125) continue; const r=d[i],g=d[i+1],b=d[i+2]; const mx=Math.max(r,g,b),mn=Math.min(r,g,b),light=(mx+mn)/2,sat=mx===mn?0:(mx-mn)/(255-Math.abs(mx+mn-255)+1e-6); const key=(r>>4)+"-"+(g>>4)+"-"+(b>>4); if(!buk[key]) buk[key]={r:0,g:0,b:0,n:0,s:0,l:0}; const k=buk[key]; k.r+=r;k.g+=g;k.b+=b;k.n++;k.s+=sat;k.l+=light; } let arr=Object.values(buk).map(k=>({r:Math.round(k.r/k.n),g:Math.round(k.g/k.n),b:Math.round(k.b/k.n),n:k.n,sat:k.s/k.n,light:k.l/k.n})); if(!arr.length) return fin(null); arr.forEach(c=>{ const lp=(c.light>230||c.light<22)?0.25:1; c.score=c.n*(0.35+c.sat)*lp; }); arr.sort((a,b)=>b.score-a.score); const pick=[]; for(const c of arr){ if(pick.every(p=>Math.abs(p.r-c.r)+Math.abs(p.g-c.g)+Math.abs(p.b-c.b)>60)) pick.push(c); if(pick.length>=3) break; } while(pick.length<2&&arr.length) pick.push(arr[pick.length]||arr[0]); fin(pick.map(c=>({r:c.r,g:c.g,b:c.b}))); }catch(e){ fin(null);} }; im.onerror=()=>{ clearTimeout(to); fin(null); }; im.src=url; }); }
const rgb=(c,a=1)=> c?`rgba(${c.r},${c.g},${c.b},${a})`:`rgba(147,40,255,${a})`;

/* ============================================================
   SHARE
   ============================================================ */
async function copyText(t){ try{ await navigator.clipboard.writeText(t); return true; }catch(e){ try{ const ta=document.createElement("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); return true; }catch(e2){ return false; } } }
async function shareTrack(song){ const url=location.origin+location.pathname+"?song="+encodeURIComponent(song.id); const text=`\u{1F3B5} Listen to \u201C${song.title}\u201D by ${song.artist} on Treesh`; if(navigator.share){ try{ await navigator.share({title:song.title,text,url}); return; }catch(e){ if(e&&e.name==="AbortError") return; } } const ok=await copyText(text+"\n"+url); toast(ok?"Link copied to clipboard":"Could not copy", song.title); }
async function sharePlaylist(pl){ const url=location.origin+location.pathname; const text=`\u{1F3A7} My Treesh playlist \u201C${pl.name}\u201D`; if(navigator.share){ try{ await navigator.share({title:pl.name,text,url}); return; }catch(e){ if(e&&e.name==="AbortError") return; } } const ok=await copyText(text+"\n"+url); toast(ok?"Link copied":"Could not copy", pl.name); }

/* ============================================================
   SONG METADATA (credits / details modal)
   ============================================================ */
function featuredNames(s){ const names=[]; if(s.featuring) names.push(s.featuring); (s.artistIds||[]).forEach((id,i)=>{ if(i===0) return; const a=ARTIST_BY_ID[id]; if(a && a.name && a.name!==s.artist) names.push(a.name); }); return [...new Set(names.filter(Boolean))].join(", "); }
function metaRow(label,value){ if(!value) return ""; return `<div class="flex items-start justify-between gap-4 border-t border-white/10 py-3 first:border-t-0"><span class="shrink-0 text-xs uppercase tracking-widest text-white/45">${esc(label)}</span><span class="text-right text-sm text-white/85" data-testid="metadata-value-${slug(label)}">${esc(value)}</span></div>`; }
function metaSection(title,rows){ if(!rows.trim()) return ""; return `<div class="mt-4 first:mt-0"><p class="mb-1.5 text-[11px] font-semibold uppercase tracking-[0.2em] text-[color:var(--treesh-gold)]">${title}</p><div class="rounded-2xl border border-white/10 bg-white/[0.03] px-3">${rows}</div></div>`; }
function metaFields(s){ const feat=featuredNames(s); const mood=s.mood?s.mood.split(",").map(x=>x.trim()).filter(Boolean).join(", "):""; const dur=(state.duration&&curSong()&&curSong().id===s.id)?fmt(state.duration):""; return {feat,mood,dur}; }
function openMetadata(songId){
  const s=SONG_BY_ID[songId]; if(!s) return;
  const {feat,mood,dur}=metaFields(s);
  const release=[metaRow("Date",s.creationDate),metaRow("Album",s.album),metaRow("Label",s.label)].join("");
  const credits=[metaRow("Artist",s.artist),metaRow("Featured",feat),metaRow("Written by",s.writtenBy),metaRow("Producer",s.producer),metaRow("Mixed by",s.mixer),metaRow("Videographer",s.videographer)].join("");
  const details=[metaRow("Genre",s.genre),metaRow("Mood",mood),metaRow("Duration",dur),s.explicit?metaRow("Rating","Explicit"):"",s.treeshChoice?metaRow("Badge","Treesh\u2019s Pick"):""].join("");
  const empty=!release.trim()&&!credits.trim()&&!details.trim();
  const inner=`<div class="mb-2 flex items-center justify-between gap-3">
      <div class="flex min-w-0 items-center gap-3"><div class="h-12 w-12 shrink-0 overflow-hidden rounded-xl">${img(s.coverArt,'h-full w-full object-cover')}</div><div class="min-w-0"><p class="clamp-1 font-display text-[13px] uppercase tracking-[0.14em] text-white/90">${esc(s.title)}</p><p class="clamp-1 text-sm text-white/60">${esc(s.artist)}</p></div></div>
      <button data-act="modal-close" aria-label="Close" class="press grid h-9 w-9 shrink-0 place-items-center rounded-full border border-white/12 bg-white/5 text-white/75 hover:bg-white/10"><i data-lucide="x" style="width:18px;height:18px"></i></button>
    </div>
    <div class="mt-1 max-h-[68vh] overflow-y-auto no-scrollbar pr-1">${empty?`<div class="flex flex-col items-center gap-2 py-10 text-center text-white/50"><i data-lucide="info" style="width:26px;height:26px"></i><p class="text-sm">No additional details available for this track.</p></div>`:`${metaSection("Release",release)}${metaSection("Credits",credits)}${metaSection("Details",details)}`}</div>
    ${empty?"":`<button data-act="meta-copy" data-id="${s.id}" data-testid="metadata-copy-credits-button" class="press mt-4 inline-flex w-full items-center justify-center gap-2 rounded-2xl border border-white/12 bg-white/5 py-3 text-sm font-semibold hover:bg-white/10"><i data-lucide="copy" style="width:16px;height:16px"></i>Copy credits</button>`}`;
  $("#modal").innerHTML=modalWrap(inner,"now-playing-metadata-modal"); icons();
}
function copyCredits(songId){ const s=SONG_BY_ID[songId]; if(!s) return; const {feat}=metaFields(s); const parts=[["Title",s.title],["Artist",s.artist],["Featured",feat],["Written by",s.writtenBy],["Producer",s.producer],["Mixed by",s.mixer],["Album",s.album],["Label",s.label],["Genre",s.genre],["Date",s.creationDate]].filter(p=>p[1]).map(p=>p[0]+": "+p[1]); copyText(parts.join("\n")).then(ok=>toast(ok?"Credits copied":"Couldn\u2019t copy",s.title)); }

/* ============================================================
   FULL-SCREEN SEARCH OVERLAY (bottom-docked input, thumb-reach)
   ============================================================ */
function pushRecent(q){ q=(q||"").trim(); if(!q) return; const list=(state.recentSearches||[]).filter(x=>x.toLowerCase()!==q.toLowerCase()); list.unshift(q); state.recentSearches=list.slice(0,8); LS.set("treesh_recent_searches",state.recentSearches); }
function hlMatch(text,q){ text=String(text==null?"":text); if(!q) return esc(text); const i=text.toLowerCase().indexOf(q.toLowerCase()); if(i<0) return esc(text); return esc(text.slice(0,i))+`<mark style="background:var(--treesh-purple-soft);color:#fff;border-radius:4px;padding:0 2px">`+esc(text.slice(i,i+q.length))+`</mark>`+esc(text.slice(i+q.length)); }
function searchSongsList(q){ q=(q||"").toLowerCase(); if(!q) return []; return vis(SONGS.filter(s=> s.title.toLowerCase().includes(q) || s.artist.toLowerCase().includes(q) || (s.writtenBy||"").toLowerCase().includes(q) || (s.featuring||"").toLowerCase().includes(q))).slice(0,60); }
function searchArtistsList(q){ q=(q||"").toLowerCase(); if(!q) return []; return ARTISTS.filter(a=> a.name.toLowerCase().includes(q) || (a.role||"").toLowerCase().includes(q)).slice(0,60); }
function searchLyricsList(q){ const ql=(q||"").toLowerCase(); if(!ql) return []; const out=[]; for(const s of SONGS){ const lines=s.lyrics||[]; for(let i=0;i<lines.length;i++){ if(lines[i].text && lines[i].text.toLowerCase().includes(ql)){ out.push({song:s, line:lines[i].text, i, t:lines[i].t}); break; } } if(out.length>=40) break; } return out; }

  }
  const tab=state.searchTab;
  if(tab==="artists"){
    const list=searchArtistsList(q); if(!list.length) return searchEmpty(q);
    return `<div class="space-y-1">${list.map(a=>{const cnt=artistSongs(a.id).length;return `<button data-act="search-open-artist" data-id="${a.id}" data-testid="search-result-artist-${a.id}" class="press flex w-full items-center gap-3 rounded-2xl p-2.5 text-left transition-colors hover:bg-white/5"><div class="h-11 w-11 shrink-0 overflow-hidden rounded-full border border-white/12">${img(a.image,'h-full w-full object-cover')}</div><div class="min-w-0 flex-1"><p class="clamp-1 text-sm font-semibold">${hlMatch(a.name,q)}</p><p class="clamp-1 text-xs text-white/50">${esc(a.role||'Music Artist')} \u00B7 ${cnt} track${cnt!==1?'s':''}</p></div><i data-lucide="chevron-right" class="shrink-0 text-white/30" style="width:16px;height:16px"></i></button>`;}).join("")}</div>`;

  }
  const list=searchSongsList(q); if(!list.length) return searchEmpty(q);
  return `<div class="space-y-1">${list.map(s=>{const fav=isFav(s.id);const active=curSong()&&curSong().id===s.id;return `<div data-testid="search-result-song-${s.id}" class="group flex items-center gap-2 rounded-2xl p-2 transition-colors hover:bg-white/5"><button data-act="search-play" data-id="${s.id}" class="relative h-11 w-11 shrink-0 overflow-hidden rounded-xl">${img(s.coverArt,'h-full w-full object-cover')}<span class="absolute inset-0 grid place-items-center bg-black/40 opacity-0 transition-opacity group-hover:opacity-100"><i data-lucide="${active&&state.isPlaying?'pause':'play'}" style="width:16px;height:16px"></i></span></button><button data-act="search-play" data-id="${s.id}" class="min-w-0 flex-1 text-left"><p class="clamp-1 text-sm font-semibold ${active?'text-[color:var(--treesh-purple)]':''}">${hlMatch(s.title,q)}</p><p class="clamp-1 text-xs text-white/55">${hlMatch(s.artist,q)}</p></button><button data-act="like" data-id="${s.id}" aria-label="Like" class="tr-like${fav?' is-liked':''} press grid h-9 w-9 shrink-0 place-items-center rounded-full text-white/60 hover:bg-white/10"><i data-lucide="heart" style="width:16px;height:16px"></i></button><button data-act="search-song-info" data-id="${s.id}" aria-label="Details" class="press grid h-9 w-9 shrink-0 place-items-center rounded-full text-white/60 hover:bg-white/10"><i data-lucide="info" style="width:16px;height:16px"></i></button></div>`;}).join("")}</div>`;

        <div class="relative mt-2.5"><i data-lucide="search" class="pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 text-white/40" style="width:16px;height:16px"></i><input id="search-input" data-testid="search-overlay-input" value="${esc(state.searchQuery)}" placeholder="Search ${esc(state.searchTab)}\u2026" autocomplete="off" class="h-12 w-full rounded-2xl border border-white/12 bg-white/[0.07] pl-10 pr-10 text-white placeholder:text-white/40 outline-none focus:border-white/25" /><button data-act="search-clear" aria-label="Clear" data-testid="search-clear-button" class="absolute right-3 top-1/2 -translate-y-1/2 text-white/40 hover:text-white ${state.searchQuery?'':'hidden'}"><i data-lucide="x" style="width:16px;height:16px"></i></button></div>
      </div>
    </div>

  attachSearchViewport();
  syncScrollLock();
}
function openSearch(){ state.searchOpen=true; renderSearchOverlay(); }
function closeSearch(instant){ const c=$("#searchlay"); const root=c?c.querySelector("[data-search-root]"):null; state.searchOpen=false; state.searchQuery=""; detachSearchViewport(); if(!c){ return; } if(instant||!root){ c.innerHTML=""; syncScrollLock(); return; } root.style.pointerEvents="none"; root.classList.remove("tr-fade-in"); root.classList.add("tr-fade-out"); const dock=root.querySelector("#search-dock"); if(dock) dock.classList.remove("tr-dock-in"); syncScrollLock(); setTimeout(()=>{ if(!state.searchOpen && root.parentNode) root.remove(); }, 240); }
let _svpHandler=null;
function attachSearchViewport(){ if(!window.visualViewport) return; detachSearchViewport(); _svpHandler=()=>{ const dock=$("#search-dock"); if(!dock||!window.visualViewport) return; const vv=window.visualViewport; const kb=Math.max(0, window.innerHeight - vv.height - vv.offsetTop); dock.style.transform = kb>2 ? `translateY(-${kb}px)` : ""; }; window.visualViewport.addEventListener("resize",_svpHandler); window.visualViewport.addEventListener("scroll",_svpHandler); }
function detachSearchViewport(){ if(_svpHandler&&window.visualViewport){ window.visualViewport.removeEventListener("resize",_svpHandler); window.visualViewport.removeEventListener("scroll",_svpHandler); } _svpHandler=null; }

function dateMs(str){ if(!str) return 0; const t=Date.parse(str); return isNaN(t)?0:t; }
function relDate(str){ const t=dateMs(str); if(!t) return esc(str||""); const diff=Date.now()-t, day=86400000; if(diff<day*2) return "Just added"; const d=Math.floor(diff/day); if(d<7) return d+" days ago"; const w=Math.floor(d/7); if(w<5) return w+(w===1?" week ago":" weeks ago"); const mo=Math.floor(d/30); if(mo<12) return mo+(mo===1?" month ago":" months ago"); const y=Math.floor(d/365); return y+(y===1?" year ago":" years ago"); }
function artistSongs(id){ return vis(SONGS.filter(s=>(s.artistIds||[]).includes(id))); }

function buildWhatsNew(){
  const bydate=vis([...SONGS]).sort((a,b)=>dateMs(b.creationDate)-dateMs(a.creationDate));
  const recentSongs=bydate.slice(0,3);
  const latest={}; SONGS.forEach(s=>{ const t=dateMs(s.creationDate); (s.artistIds||[]).forEach(id=>{ if(t>(latest[id]||0)) latest[id]=t; }); });
  const withSongs=ARTISTS.filter(a=>artistSongs(a.id).length);
  const recentArtists=[...withSongs].sort((a,b)=>(latest[b.id]||0)-(latest[a.id]||0)).slice(0,3);
  const recentIds=new Set(recentArtists.map(a=>a.id));
  const pool=withSongs.filter(a=>!recentIds.has(a.id));
  const randomArtist=pool.length?pool[Math.floor(Math.random()*pool.length)]:null;
  const slides=[];
  for(let i=0;i<3;i++){ if(recentSongs[i]) slides.push({kind:"song",song:recentSongs[i]}); if(recentArtists[i]) slides.push({kind:"artist",artist:recentArtists[i]}); }
  if(randomArtist) slides.push({kind:"rediscover",artist:randomArtist});
  return slides;
}

let _io=null;
function prefersReduced(){ return !!state.perfMode; }
function applyPerfMode(){ document.documentElement.classList.toggle("perf-mode", !!state.perfMode); if(state.perfMode){ const st=document.getElementById("stars"); if(st) st.style.display="none"; } }
function animateView(){
  const v=$("#view"); if(!v) return;
  if(_io){ _io.disconnect(); _io=null; }
  if(prefersReduced()) return;
  let kids=[...v.children];
  if(kids.length===1 && kids[0].children && kids[0].children.length>1) kids=[...kids[0].children];
  kids.forEach((el,i)=>{ el.classList.remove("reveal-stagger"); void el.offsetWidth; el.style.animationDelay=(Math.min(i,8)*55)+"ms"; el.classList.add("reveal-stagger"); });
  const items=v.querySelectorAll(".grid > *");
  if(items.length>6){
    _io=new IntersectionObserver((ents)=>{ ents.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("io-in"); if(_io) _io.unobserve(e.target); } }); }, {rootMargin:"0px 0px -6% 0px", threshold:0.04});
    items.forEach(el=>{ el.classList.add("io-reveal"); _io.observe(el); });
  }
}

function renderView(animate=false){
  const v=$("#view"); if(!v) return;
  { const fsc=document.getElementById("instrum-fs"); if(fsc&&fsc.childElementCount>0 && !(state.view==="instrum"&&state.instrum&&state.instrum.fs)){ fsc.innerHTML=""; if(state.instrum) state.instrum.fs=false; } }
  let html="";
  switch(state.view){
    case "library": html=viewLibrary(); break;
    case "artists": html=viewArtists(); break;
    case "artist": html=viewArtistDetail(); break;
    case "favorites": html=viewFavorites(); break;
    case "playlists": html=viewPlaylists(); break;
    case "playlist": html=viewPlaylistDetail(); break;
    case "settings": html=viewSettings(); break;
    case "game": html=viewGame(); break;
    case "instrum": html=viewInstrum(); break;
    case "picks": html=viewPicks(); break;
    default: html=viewLibrary();
  }
  v.innerHTML=html; icons();
  if(state.view==="instrum" && state.instrum && state.instrum.started) requestAnimationFrame(()=>{ if(state.instrum && state.instrum.playing) iHighlightCol(state.instrum.visStep); });
  state._renderedActiveId = curSong() && curSong().id;
  if(animate){ v.classList.remove("view-in"); void v.offsetWidth; v.classList.add("view-in"); animateView(); }
  if(state.view==="library") wireWN(); else stopWN();
  // wire settings live zodiac + avatar preview
  const bday=$("#set-bday"); if(bday){ bday.addEventListener("input",()=>{ const z=zodiac(bday.value); const el=$("#set-zodiac"); if(el){ el.textContent=z; el.classList.toggle("hidden",!z); } }); }
  const ai=$("#set-avatar-input"); if(ai){ ai.addEventListener("change",e=>{ const f=e.target.files&&e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ state._tmpAvatar=r.result; const av=$("#set-avatar"); if(av) av.innerHTML=img(r.result,'h-full w-full object-cover'); }; r.readAsDataURL(f); }); }
  const bgi=$("#set-bg-image-input"); if(bgi){ bgi.addEventListener("change",e=>{ const f=e.target.files&&e.target.files[0]; if(!f) return; if(f.size>4.5*1024*1024){ toast("Image too large","Use one under 4.5 MB"); return; } const r=new FileReader(); r.onload=()=>{ try{ state.bgImage=r.result; state.bg="custom"; LS.set("treesh_bg_image",state.bgImage); LS.set("treesh_bg","custom"); applyTheme(); renderView(); toast("Background updated"); }catch(err){ toast("Couldn\u2019t save image","It may be too large"); } }; r.readAsDataURL(f); }); }
}

let _snipTimer=null;
function playFavSong(id){ const s=SONG_BY_ID[id]; if(!s) return; clearTimeout(_snipTimer); playSong(s,[s]); toast("Playing",s.title); }
function playLyricSnippet(id,i){
  const s=SONG_BY_ID[id]; if(!s) return; const lines=s.lyrics||[]; const line=lines[i]; if(!line){ playFavSong(id); return; }
  clearTimeout(_snipTimer);
  const start=Math.max(0,+line.t||0); const next=lines[i+1]; const end=(next?(+next.t||start+12):start+12)+5; const durMs=Math.max(1200,(end-start)*1000);
  const isCur=curSong()&&curSong().id===s.id;
  if(!isCur) playSong(s,[s]);
  let tries=0;
  const run=()=>{ tries++; try{ if(isCur||audio.readyState>=1||tries>14){ audio.currentTime=start; const pp=audio.play&&audio.play(); if(pp&&pp.catch)pp.catch(()=>{}); clearTimeout(_snipTimer); _snipTimer=setTimeout(()=>{ try{ audio.pause(); }catch(e){} }, durMs); return; } }catch(e){} setTimeout(run,80); };
  setTimeout(run, isCur?20:160);
  toast("Lyric snippet",s.title);
}

function wrapCanvasText(ctx, lines, maxW){
  const out=[];
  lines.forEach(line=>{
    const words=String(line).split(/\s+/); let cur="";
    words.forEach(w=>{ const test=cur?cur+" "+w:w; if(ctx.measureText(test).width>maxW && cur){ out.push(cur); cur=w; } else cur=test; });
    if(cur) out.push(cur); else if(!words.length) out.push("");
  });
  return out;
}
function drawLyricCard(){
  const cv=$("#lyric-canvas"); if(!cv) return;
  const s=SONG_BY_ID[state.studio.songId]; if(!s) return;
  const lines=favLyricsForSong(s.id).map(x=>x.text);
  const th=CARD_THEMES[state.studio.theme]||CARD_THEMES[0];
  const ctx=cv.getContext("2d"); const W=1080,H=1080;
  const draw=()=>{
    ctx.clearRect(0,0,W,H);
    const g=ctx.createLinearGradient(0,0,W,H); g.addColorStop(0,th.a); g.addColorStop(1,th.b);
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    // soft glow
    const rg=ctx.createRadialGradient(W*0.2,H*0.15,50,W*0.2,H*0.15,700); rg.addColorStop(0,"rgba(255,255,255,0.14)"); rg.addColorStop(1,"rgba(255,255,255,0)"); ctx.fillStyle=rg; ctx.fillRect(0,0,W,H);
    // decorative quote
    ctx.fillStyle="rgba(255,255,255,0.13)"; ctx.font='900 300px Georgia, serif'; ctx.textBaseline="alphabetic"; ctx.fillText("\u201C", 60, 340);
    // top label
    ctx.fillStyle=th.accent||"#fff"; ctx.font='800 26px Manrope, sans-serif';
    ctx.fillText("T R E E S H   \u00B7   L Y R I C S", 96, 150);
    // lyric body
    const body = lines.length ? lines : ["Select lyrics to feature\u2026"];
    let fs = 76; const total=body.join(" ").length;
    if(total>60) fs=62; if(total>120) fs=52; if(total>200) fs=44; if(total>320) fs=36;
    ctx.font=`800 ${fs}px Manrope, sans-serif`;
    let wrapped=wrapCanvasText(ctx, body, W-192);
    // shrink if too many lines
    while(wrapped.length*(fs*1.28) > 560 && fs>26){ fs-=4; ctx.font=`800 ${fs}px Manrope, sans-serif`; wrapped=wrapCanvasText(ctx, body, W-192); }
    const lh=fs*1.3; const blockH=wrapped.length*lh; let y=Math.max(360, (H-260)/2 - blockH/2 + fs);
    ctx.fillStyle="#ffffff"; ctx.textBaseline="alphabetic";
    wrapped.forEach(ln=>{ ctx.fillText(ln, 96, y); y+=lh; });
    // divider + attribution
    ctx.fillStyle="rgba(255,255,255,0.25)"; ctx.fillRect(96, H-190, 90, 4);
    ctx.fillStyle="#ffffff"; ctx.font='800 42px Manrope, sans-serif'; ctx.fillText(s.title.slice(0,40), 96, H-120);
    ctx.fillStyle="rgba(255,255,255,0.75)"; ctx.font='500 32px Manrope, sans-serif'; ctx.fillText(s.artist.slice(0,44), 96, H-72);
  };
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(draw); draw(); } else draw();
}
