  </div>`; }
  return `<div data-instrum-root class="-mx-4 pb-8 sm:-mx-6 lg:-mx-8${(state.instrum&&state.instrum._opened)?' i-open':''}">${(function(){ if(state.instrum) state.instrum._opened=false; return ''; })()}${instrumHeaderHtml(false)}<div class="space-y-3">${instrumTransportHtml(false)}${instrumPresetsHtml()}${instrumGridHtml(false)}</div></div>`; }
function instrumFSPlaceholder(){ return `<div class="flex min-h-[60vh] flex-col items-center justify-center gap-4 text-center"><div class="grid h-16 w-16 place-items-center rounded-2xl bg-[color:var(--treesh-purple)]/15 text-[color:var(--treesh-purple)]"><i data-lucide="maximize-2" style="width:28px;height:28px"></i></div><p class="text-lg font-bold">Studio is in full screen</p><button data-act="i-fullscreen" class="press inline-flex items-center gap-2 rounded-2xl bg-[color:var(--treesh-purple)] px-5 py-3 text-sm font-bold text-white glow-purple"><i data-lucide="minimize-2" style="width:16px;height:16px"></i>Exit full screen</button></div>`; }
function viewInstrum(){ if(!state.instrum||!state.instrum.started) return instrumLanding(); if(state.instrum.fs) return instrumFSPlaceholder(); return instrumStudioHtml(false); }
/* ---------- Instrum render targets (view vs fullscreen overlay) ---------- */
function renderInstrum(animate){ if(state.instrum&&state.instrum.fs) renderInstrumFS(); else renderView(animate); iRenderMenu(); }
function renderInstrumFS(){ const c=document.getElementById("instrum-fs"); if(!c) return; if(!state.instrum||!state.instrum.fs){ c.innerHTML=""; return; } const _sm=captureScroll(c); c.innerHTML=`<div class="fs-shell">${instrumStudioHtml(true)}</div>`; icons(); restoreScroll(c,_sm); requestAnimationFrame(()=>{ if(state.instrum&&state.instrum.playing) iHighlightCol(state.instrum.visStep); }); }
function iToggleFullscreen(){ const S=state.instrum; if(!S) return; S.fs=!S.fs; if(S.fs){ renderView(); renderInstrumFS(); } else { const c=document.getElementById("instrum-fs"); if(c) c.innerHTML=""; renderView(true); } iRenderMenu(); syncScrollLock(); }
/* ---------- Instrum history (undo / redo) ---------- */
function iSnapshot(){ return JSON.stringify(state.instrum.project); }
function iPushHistory(){ const S=state.instrum; if(!S) return; if(!S.history) S.history=[]; S.history=S.history.slice(0,(S.hi==null?-1:S.hi)+1); S.history.push(iSnapshot()); if(S.history.length>80){ S.history.shift(); } S.hi=S.history.length-1; iUpdateUndoUI(); }
function iUpdateUndoUI(){ const S=state.instrum; if(!S) return; const canUndo=S.history&&S.hi>0, canRedo=S.history&&S.hi<(S.history.length-1); const u=document.querySelector('[data-act="i-undo"]'), r=document.querySelector('[data-act="i-redo"]'); if(u) u.disabled=!canUndo; if(r) r.disabled=!canRedo; }
function iApplySnapshot(json){ const S=state.instrum; if(!S||!json) return; if(S.playing) iStop(); S.project=JSON.parse(json); if(_iMaster) _iMaster.gain.value=S.project.master; renderInstrum(); iUpdateUndoUI(); }
function iUndo(){ const S=state.instrum; if(!S||!S.history||S.hi<=0) return; S.hi--; iApplySnapshot(S.history[S.hi]); toast("Undo"); }
function iRedo(){ const S=state.instrum; if(!S||!S.history||S.hi>=S.history.length-1) return; S.hi++; iApplySnapshot(S.history[S.hi]); toast("Redo"); }
function iToggleMetronome(){ const S=state.instrum; if(!S) return; S.project.metronome=!S.project.metronome; document.querySelectorAll('[data-act="i-metronome"]').forEach(b=>b.classList.toggle("on",S.project.metronome)); toast(S.project.metronome?"Metronome on":"Metronome off"); }
function iOpenSaveDialog(){ const S=state.instrum; if(!S) return; const p=S.project; openPrompt("Name your beat", p.name||"Untitled beat", (name)=>{ p.name=(name||"").trim()||"Untitled beat"; iSaveProject(); }); }
function iBpmStep(delta){ const S=state.instrum; if(!S) return; const p=S.project; p.bpm=Math.max(40,Math.min(220,(p.bpm||90)+delta)); const inp=document.querySelector('[data-act="i-bpm"]'); if(inp) inp.value=p.bpm; }

async function boot(){
  applyAccent(state.accent);
  applyTheme();
  starfield();
  initIconWatch();
  if(!window.lucide){ let _lt=0; const _li=setInterval(()=>{ _lt++; if(window.lucide){ clearInterval(_li); icons(); } else if(_lt>60){ clearInterval(_li); } }, 120); }
  const cachedTs = loadCatalogCache();
  if(cachedTs){
    init();                                  // instant boot from cache
    loadUserSongs();                         // load custom tracks from IndexedDB
    loadCatalog().then(res=>{ if(res.changed) softRefresh(); }).catch(()=>{}); // stale-while-revalidate
  } else {
    renderBootLoading();
    try{ await loadCatalog(); init(); loadUserSongs(); }
    catch(e){ console.error("Catalog load failed:", e); renderBootError(); }
  }
  startCatalogPolling();
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",boot); else boot();

/* --- Global UX protections: block accidental zoom, protect images, full-tap date picker --- */
(function(){
  try{
    window.addEventListener("wheel", e=>{ if(e.ctrlKey||e.metaKey) e.preventDefault(); }, {passive:false});
    window.addEventListener("keydown", e=>{ if((e.ctrlKey||e.metaKey) && (e.key==="+"||e.key==="-"||e.key==="="||e.key==="0")) e.preventDefault(); });
    ["gesturestart","gesturechange","gestureend"].forEach(ev=>document.addEventListener(ev, e=>{ e.preventDefault(); }));
    document.addEventListener("contextmenu", e=>{ if(e.target && e.target.closest && e.target.closest("input,textarea,[contenteditable]")) return; e.preventDefault(); });
    document.addEventListener("dragstart", e=>{ if(e.target && e.target.tagName==="IMG") e.preventDefault(); });
    document.addEventListener("click", e=>{ const d=e.target && e.target.closest && e.target.closest('input[type="date"]'); if(d && !d.disabled && typeof d.showPicker==="function"){ try{ d.showPicker(); }catch(_){} } });
    ["input","change"].forEach(ev=>document.addEventListener(ev, e=>{ const t=e.target; if(t && t.classList && t.classList.contains("tdf-native")) syncDateField(t); }));
  }catch(e){}
})();
</script>
</body>
