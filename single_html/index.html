      (rs||[]).forEach(function(r){ try{ r.unregister(); }catch(e){} });
      if(window.caches && caches.keys){ caches.keys().then(function(ks){ (ks||[]).forEach(function(k){ try{ caches.delete(k); }catch(e){} }); }).catch(function(){}); }
      if(had && navigator.serviceWorker.controller && !sessionStorage.getItem('treesh_sw_cleared')){
        try{ sessionStorage.setItem('treesh_sw_cleared','1'); }catch(e){}
        setTimeout(function(){ location.reload(); }, 400);
      }
    }).catch(function(){});
  } else if(window.caches && caches.keys){ caches.keys().then(function(ks){ (ks||[]).forEach(function(k){ try{ caches.delete(k); }catch(e){} }); }).catch(function(){}); }
}catch(e){} })();
</script>

<style>
  :root{
    --treesh-bg-0:#0a0a0b; --treesh-bg-1:#121214;
    --treesh-purple:#9328ff; --treesh-purple-soft:rgba(147,40,255,0.22);

    --treesh-shadow:0 18px 60px rgba(0,0,0,0.55);
    --treesh-glow-purple:0 0 0 1px rgba(147,40,255,0.28),0 0 28px rgba(147,40,255,0.24);
    --treesh-glow-gold:var(--treesh-glow-purple);
  }
  *{ -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; background:var(--app-bg); color:var(--app-text); font-family:var(--treesh-font,'Manrope',system-ui,sans-serif); -webkit-font-smoothing:antialiased; overscroll-behavior-y:none; transition:background-color .3s ease, color .3s ease; }
  .font-display{ font-family:'Special Gothic Expanded One','Manrope',sans-serif; }
  .font-doto{ font-family:'Doto','Manrope',monospace; }
  .glass{ background:rgba(255,255,255,0.06); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border:1px solid var(--treesh-stroke); }
  .glass-strong{ background:rgba(255,255,255,0.09); backdrop-filter:blur(28px); -webkit-backdrop-filter:blur(28px); border:1px solid var(--treesh-stroke); }
  .glow-purple{ box-shadow:var(--treesh-glow-purple); }
  .glow-gold{ box-shadow:var(--treesh-glow-gold); }
  .no-scrollbar::-webkit-scrollbar{ display:none; } .no-scrollbar{ -ms-overflow-style:none; scrollbar-width:none; }
  .soft-scroll::-webkit-scrollbar{ width:8px;height:8px; } .soft-scroll::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.14); border-radius:999px; } .soft-scroll::-webkit-scrollbar-track{ background:transparent; }
  .clamp-1{ display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden; }
  .clamp-2{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  ::selection{ background:var(--treesh-purple-soft); color:#fff; }

  /* range sliders */
  input[type=range].tr{ -webkit-appearance:none; appearance:none; height:6px; border-radius:999px; background:linear-gradient(to right, var(--treesh-purple) var(--fill,0%), rgba(255,255,255,0.16) var(--fill,0%)); outline:none; cursor:pointer; width:100%; }
  input[type=range].tr::-webkit-slider-runnable-track{ -webkit-appearance:none; appearance:none; height:6px; border-radius:999px; background:transparent; border:none; }
  input[type=range].tr::-webkit-slider-thumb{ -webkit-appearance:none; appearance:none; margin-top:-4px; width:14px; height:14px; border-radius:50%; background:#fff; box-shadow:0 0 10px var(--treesh-purple); border:none; }
  input[type=range].tr::-moz-range-track{ height:6px; border-radius:999px; background:transparent; border:none; }
  input[type=range].tr::-moz-range-thumb{ width:14px; height:14px; border:none; border-radius:50%; background:#fff; box-shadow:0 0 10px var(--treesh-purple); }
  input[type=range].tr:focus,input[type=range].tr:hover,input[type=range].tr:active{ outline:none; box-shadow:none; background:linear-gradient(to right, var(--treesh-purple) var(--fill,0%), rgba(255,255,255,0.16) var(--fill,0%)); }
  input[type=range].tr:focus::-webkit-slider-runnable-track,input[type=range].tr:active::-webkit-slider-runnable-track,input[type=range].tr:hover::-webkit-slider-runnable-track{ background:transparent; }
  @property --ab-charge{ syntax:'<angle>'; inherits:false; initial-value:0deg; }
  .ab-charging{ position:relative; }
  .ab-charging::after{ content:""; position:absolute; inset:-4px; border-radius:9999px; pointer-events:none; background:conic-gradient(var(--treesh-purple) var(--ab-charge,0deg), rgba(255,255,255,0.14) 0deg); -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px)); mask:radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px)); animation:abCharge 1.5s linear forwards; }
  @keyframes abCharge{ from{ --ab-charge:0deg; } to{ --ab-charge:360deg; } }
  input[type=range].tr:focus-visible{ outline:none; }

  /* vinyl */
  .vinyl{ border-radius:50%; position:relative;
    background:repeating-radial-gradient(circle at center,rgba(255,255,255,0.045) 0px,rgba(255,255,255,0.045) 1px,rgba(0,0,0,0) 2px,rgba(0,0,0,0) 4px),radial-gradient(circle at 50% 50%,#1c1c20 0%,#0c0c0e 62%,#050506 100%);
    box-shadow:0 30px 80px rgba(0,0,0,0.6),inset 0 0 60px rgba(0,0,0,0.8); }
  .vinyl::after{ content:""; position:absolute; inset:8%; border-radius:50%; background:repeating-radial-gradient(circle at center,rgba(255,255,255,0.03) 0px,rgba(255,255,255,0.03) 1px,transparent 2px,transparent 5px); }
  .vinyl-label{ position:absolute; inset:33%; border-radius:50%; overflow:hidden; box-shadow:0 0 0 4px rgba(0,0,0,0.55),0 0 0 6px var(--treesh-purple-soft); background:#111; }
  .vinyl-hole{ position:absolute; top:50%; left:50%; width:10px; height:10px; border-radius:50%; background:#050506; transform:translate(-50%,-50%); box-shadow:0 0 0 2px rgba(255,255,255,0.15); z-index:3; }
  .spin{ animation:tspin 6s linear infinite; } .spin-paused{ animation-play-state:paused; }
  @keyframes tspin{ from{transform:rotate(0)} to{transform:rotate(360deg)} }

  /* equalizer */
  .eq{ display:inline-flex; align-items:flex-end; gap:2px; height:14px; }
  .eq span{ display:block; width:3px; height:100%; background:var(--treesh-purple); border-radius:2px; transform-origin:bottom; animation:teq .9s ease-in-out infinite; }
  .eq span:nth-child(2){ animation-delay:.15s } .eq span:nth-child(3){ animation-delay:.3s } .eq span:nth-child(4){ animation-delay:.45s }
  @keyframes teq{ 0%,100%{transform:scaleY(.3)} 50%{transform:scaleY(1)} }

  .shimmer{ background:linear-gradient(100deg,#fff 20%,var(--treesh-gold) 40%,#fff 60%); background-size:200% auto; -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; animation:tshim 6s linear infinite; }
  @keyframes tshim{ 0%{background-position:0% 50%} 100%{background-position:200% 50%} }

  .voice-pulse::before,.voice-pulse::after{ content:""; position:absolute; inset:0; border-radius:50%; border:2px solid var(--treesh-purple); animation:tping 1.6s cubic-bezier(0,0,0.2,1) infinite; }
  .voice-pulse::after{ animation-delay:.8s; }
  @keyframes tping{ 0%{transform:scale(1);opacity:.7} 100%{transform:scale(2.2);opacity:0} }
  /* voice assistant waveform + typing dots */
  .voice-wave{ display:flex; align-items:center; justify-content:center; gap:5px; height:38px; }
  .voice-wave span{ display:block; width:4px; height:100%; border-radius:999px; background:var(--treesh-purple); transform-origin:center; animation:vwave 1.05s ease-in-out infinite; }
  .voice-wave span:nth-child(1){animation-delay:-.9s} .voice-wave span:nth-child(2){animation-delay:-.7s} .voice-wave span:nth-child(3){animation-delay:-.5s} .voice-wave span:nth-child(4){animation-delay:-.3s} .voice-wave span:nth-child(5){animation-delay:-.15s} .voice-wave span:nth-child(6){animation-delay:-.45s} .voice-wave span:nth-child(7){animation-delay:-.65s}
  @keyframes vwave{ 0%,100%{transform:scaleY(.22)} 50%{transform:scaleY(1)} }
  .voice-dots span{ display:inline-block; animation:vdots 1.4s infinite; } .voice-dots span:nth-child(2){ animation-delay:.2s } .voice-dots span:nth-child(3){ animation-delay:.4s }
  @keyframes vdots{ 0%,60%,100%{opacity:.25} 30%{opacity:1} }

  /* ---------- motion system ---------- */
  .fade-in{ animation:tfade .34s cubic-bezier(.22,1,.36,1) both; } @keyframes tfade{ from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }
  .np-line{ transition:color .3s ease, transform .35s cubic-bezier(.22,1,.36,1), text-shadow .3s ease; }

  /* page / view navigation */
  .view-in{ animation:viewIn .42s cubic-bezier(.22,1,.36,1) both; } @keyframes viewIn{ from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:none} }
  /* scroll-reveal + staggered entrance */
  @keyframes trRevealUp{ from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:none} }
  .reveal-stagger{ animation:trRevealUp .5s cubic-bezier(.22,1,.36,1) both; }
  .io-reveal{ opacity:0; transform:translateY(18px); }
  .io-reveal.io-in{ opacity:1; transform:none; transition:opacity .6s cubic-bezier(.22,1,.36,1), transform .6s cubic-bezier(.22,1,.36,1); }
  html.perf-mode .reveal-stagger{ animation:none !important } html.perf-mode .io-reveal{ opacity:1 !important; transform:none !important }

  /* now-playing sheet */
  @keyframes npUp{ from{opacity:0;transform:translateY(7%)} to{opacity:1;transform:none} }
  @keyframes npDown{ from{opacity:1;transform:none} to{opacity:0;transform:translateY(9%)} }
  .np-entering{ animation:npUp .46s cubic-bezier(.22,1,.36,1) both; }
  .np-leaving{ animation:npDown .34s cubic-bezier(.4,0,1,.6) both; }
  @keyframes npContent{ from{opacity:0;transform:translateY(12px) scale(.99)} to{opacity:1;transform:none} }
  .np-content-in{ animation:npContent .38s cubic-bezier(.22,1,.36,1) both; }

  /* modal / popup */
  @keyframes backdropIn{ from{opacity:0} to{opacity:1} }
  @keyframes backdropOut{ from{opacity:1} to{opacity:0} }
  @keyframes panelIn{ from{opacity:0;transform:translateY(16px) scale(.95)} to{opacity:1;transform:none} }
  @keyframes panelOut{ from{opacity:1;transform:none} to{opacity:0;transform:translateY(10px) scale(.97)} }
  .backdrop-in{ animation:backdropIn .26s ease both; }
  .backdrop-out{ animation:backdropOut .2s ease both; }
  .panel-in{ animation:panelIn .4s cubic-bezier(.22,1,.36,1) both; }
  .panel-out{ animation:panelOut .2s cubic-bezier(.4,0,1,.6) both; }
  @keyframes obStep{ from{opacity:0;transform:translateX(22px)} to{opacity:1;transform:none} }
  .ob-step-in{ animation:obStep .34s cubic-bezier(.22,1,.36,1) both; }

  /* queue drawer */
  @keyframes drawerIn{ from{transform:translateX(100%)} to{transform:translateX(0)} }
  @keyframes drawerOut{ from{transform:translateX(0)} to{transform:translateX(100%)} }
  .drawer-in{ animation:drawerIn .42s cubic-bezier(.22,1,.36,1) both; }
  .drawer-out{ animation:drawerOut .3s cubic-bezier(.4,0,1,.6) both; }

  /* mini player */
  @keyframes miniUp{ from{opacity:0;transform:translateY(130%)} to{opacity:1;transform:none} }
  .mini-in{ animation:miniUp .5s cubic-bezier(.22,1,.36,1) both; }

  /* toast */
  @keyframes toastIn{ from{opacity:0;transform:translateY(-16px) scale(.95)} to{opacity:1;transform:none} }
  @keyframes toastOut{ from{opacity:1;transform:none} to{opacity:0;transform:translateY(-10px) scale(.98)} }
  .toast-in{ animation:toastIn .34s cubic-bezier(.22,1,.36,1) both; }
  .toast-out{ animation:toastOut .28s ease both; }

  /* micro interactions */
  .card-lift{ transition:transform .24s cubic-bezier(.22,1,.36,1), box-shadow .24s ease, border-color .24s ease; will-change:transform; }
  @media (hover:hover){ .card-lift:hover{ transform:translateY(-5px); } }
  .press{ transition:transform .13s ease; } .press:active{ transform:scale(.93); }

  /* what's new carousel */
  .wn-img{ transform:scale(1.05); }
  .wn-slide.wn-active .wn-img{ animation:wnZoom 7.5s ease-out both; }
  @keyframes wnZoom{ from{ transform:scale(1.05) } to{ transform:scale(1.16) } }

  /* ---------- like / favorite hearts (reliable, no JIT dependency) ---------- */
  .tr-like svg,.tr-favline svg{ transition:transform .2s cubic-bezier(.34,1.56,.64,1),fill .18s ease,color .18s ease; }
  .tr-like.is-liked svg,.tr-favline.is-liked svg{ fill:var(--treesh-purple); color:var(--treesh-purple); filter:drop-shadow(0 0 5px var(--treesh-purple-soft)); }
  .tr-like.is-liked{ color:var(--treesh-purple); }
  .tr-dislike svg{ transition:transform .2s cubic-bezier(.34,1.56,.64,1),color .18s ease; }
  .tr-dislike.is-disliked svg{ color:var(--treesh-purple); filter:drop-shadow(0 0 5px var(--treesh-purple-soft)); }
  .tr-dislike.is-disliked{ color:var(--treesh-purple); }
  @keyframes dislikeShake{ 0%{transform:rotate(0)} 20%{transform:rotate(-14deg)} 40%{transform:rotate(11deg)} 60%{transform:rotate(-7deg)} 80%{transform:rotate(4deg)} 100%{transform:rotate(0)} }
  .dislike-shake{ animation:dislikeShake .45s ease; }
  @keyframes heartPop{ 0%{transform:scale(1)} 25%{transform:scale(1.55)} 45%{transform:scale(.82)} 70%{transform:scale(1.14)} 100%{transform:scale(1)} }
  .heart-pop{ animation:heartPop .5s cubic-bezier(.34,1.56,.64,1); }
  @keyframes heartUnpop{ 0%{transform:scale(1)} 40%{transform:scale(.68)} 100%{transform:scale(1)} }
  .heart-unpop{ animation:heartUnpop .34s ease; }

  /* floating heart burst particles */
  #fx-layer{ position:fixed; inset:0; z-index:200; pointer-events:none; overflow:hidden; }
  .fx-heart{ position:fixed; will-change:transform,opacity; pointer-events:none; animation:fxFloat var(--dur,900ms) cubic-bezier(.22,1,.36,1) forwards; }
  .fx-heart svg{ display:block; width:var(--size,16px); height:var(--size,16px); }
  @keyframes fxFloat{
    0%{ transform:translate(-50%,-50%) scale(.2) rotate(0deg); opacity:0; }
    18%{ opacity:1; transform:translate(-50%,-50%) scale(1) rotate(calc(var(--rot)*.3)); }
    100%{ transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(var(--end,.55)) rotate(var(--rot)); opacity:0; }
  }
  .fx-ring{ position:fixed; width:16px; height:16px; border-radius:999px; border:2px solid var(--treesh-purple); pointer-events:none; animation:fxRing .58s cubic-bezier(.22,1,.36,1) forwards; }
  @keyframes fxRing{ from{ transform:translate(-50%,-50%) scale(.4); opacity:.65; } to{ transform:translate(-50%,-50%) scale(3.8); opacity:0; } }

  /* ---------- like = one big heart floating up like a balloon ---------- */
  .fx-balloon{ position:fixed; z-index:200; pointer-events:none; animation:fxBalloonUp 1.5s cubic-bezier(.22,1,.36,1) forwards; }
  .fx-balloon-inner{ display:block; animation:fxSway 1.5s ease-in-out both; }
  .fx-balloon svg{ display:block; width:66px; height:66px; filter:drop-shadow(0 10px 26px var(--treesh-purple-soft)); }
  @keyframes fxBalloonUp{ 0%{ transform:translate(-50%,-50%) scale(.35); opacity:0; } 15%{ opacity:1; transform:translate(-50%,-66%) scale(1.1); } 78%{ opacity:1; } 100%{ transform:translate(calc(-50% + var(--sway,0px)),-370px) scale(.82); opacity:0; } }
  @keyframes fxSway{ 0%{transform:translateX(0)} 22%{transform:translateX(-14px)} 48%{transform:translateX(12px)} 72%{transform:translateX(-8px)} 100%{transform:translateX(4px)} }
  /* ---------- dislike = broken heart ---------- */
  .fx-crack{ position:fixed; z-index:200; pointer-events:none; animation:fxCrack 1s cubic-bezier(.22,1,.36,1) forwards; }
  .fx-crack svg{ display:block; width:60px; height:60px; filter:drop-shadow(0 8px 20px var(--treesh-purple-soft)); }
  @keyframes fxCrack{ 0%{ transform:translate(-50%,-50%) scale(.4) rotate(0); opacity:0; } 16%{ opacity:1; transform:translate(-50%,-56%) scale(1.16) rotate(-5deg); } 28%{ transform:translate(-50%,-56%) scale(1.06) rotate(6deg); } 40%{ transform:translate(-50%,-54%) scale(1.06) rotate(-4deg); } 60%{ transform:translate(-50%,-48%) scale(1) rotate(3deg); } 100%{ transform:translate(-50%,16%) scale(.78) rotate(9deg); opacity:0; } }
  .fx-frag{ position:fixed; z-index:200; pointer-events:none; }
  .fx-frag svg{ display:block; width:22px; height:22px; }
  .fx-frag-l{ animation:fxFragL .82s cubic-bezier(.22,1,.36,1) forwards; }
  .fx-frag-r{ animation:fxFragR .82s cubic-bezier(.22,1,.36,1) forwards; }
  @keyframes fxFragL{ 0%{transform:translate(-50%,-50%) scale(.6); opacity:0} 20%{opacity:.9} 100%{transform:translate(calc(-50% - 48px),22px) scale(.65) rotate(-42deg); opacity:0} }
  @keyframes fxFragR{ 0%{transform:translate(-50%,-50%) scale(.6); opacity:0} 20%{opacity:.9} 100%{transform:translate(calc(-50% + 48px),22px) scale(.65) rotate(42deg); opacity:0} }
  html.perf-mode .fx-balloon, html.perf-mode .fx-crack, html.perf-mode .fx-frag{ display:none !important; }

  /* ---------- profile module (grows from top-right avatar) ---------- */
  #profile-panel{ transform-origin:calc(100% - 22px) 22px; }
  @keyframes profileIn{ 0%{ opacity:0; transform:scale(.16) translate3d(0,-6px,0); } 55%{ opacity:1; } 100%{ opacity:1; transform:scale(1) translate3d(0,0,0); } }
  @keyframes profileOut{ 0%{ opacity:1; transform:scale(1) translate3d(0,0,0); } 100%{ opacity:0; transform:scale(.16) translate3d(0,-6px,0); } }
  .profile-in{ animation:profileIn .44s cubic-bezier(.22,1,.36,1) both; }
  .profile-out{ animation:profileOut .26s cubic-bezier(.4,0,1,.6) both; }
  @keyframes pfContent{ from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none} }
  .pf-content-in{ animation:pfContent .28s ease .12s both; }
  @media (min-width:640px){ #profile-panel{ transform-origin:calc(100% - 8px) -12px; } }

  /* touch devices: never leave a sticky hover/tap background on controls */

    .hover\:bg-white\/10:hover,.hover\:bg-white\/15:hover,.hover\:bg-white\/5:hover,.hover\:bg-white\/\[0\.07\]:hover{ background-color:transparent !important; }
  }

  html.perf-mode .fx-heart, html.perf-mode .fx-ring{ display:none !important }
  html.perf-mode .card-lift:hover{ transform:none !important }
  html.perf-mode #wn-track{ transition:none !important }

  /* ---------- extended tokens + utilities (phase additions) ---------- */
  :root{
    --treesh-ease:cubic-bezier(.22,1,.36,1);
    --treesh-dur-1:140ms; --treesh-dur-2:220ms; --treesh-dur-3:420ms;
    --treesh-stroke-faint:rgba(255,255,255,0.10);
    --treesh-focus:0 0 0 1px rgba(255,255,255,0.10),0 0 0 4px var(--treesh-purple-soft);
  }
  /* iOS: prevent input auto-zoom + viewport shift (font >=16px on small screens) */
  @media (max-width:640px){ input:not([type=range]),textarea,select{ font-size:16px !important; } }
  body.tr-locked{ overflow:hidden; }

  /* --- Global UX protections: no accidental zoom, no text selection (except editable), no image drag --- */
  html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  body{ touch-action:manipulation; overscroll-behavior:none; }
  *{ -webkit-user-select:none; -moz-user-select:none; user-select:none; -webkit-touch-callout:none; }
  input, textarea, select, [contenteditable="true"], [contenteditable=""], .selectable, .selectable *{ -webkit-user-select:text; -moz-user-select:text; user-select:text; -webkit-touch-callout:default; }
  img{ -webkit-user-drag:none; user-drag:none; -webkit-touch-callout:none; }


  /* reusable panel + overlay motion */
  @keyframes trPanelIn{ from{opacity:0;transform:translateY(10px) scale(.98)} to{opacity:1;transform:none} }
  @keyframes trPanelOut{ from{opacity:1;transform:none} to{opacity:0;transform:translateY(10px) scale(.98)} }

  .tr-panel-out{ animation:trPanelOut var(--treesh-dur-2) var(--treesh-ease) both; }
  @keyframes trDockUp{ from{opacity:0;transform:translateY(26px)} to{opacity:1;transform:none} }
  .tr-dock-in{ animation:trDockUp var(--treesh-dur-3) var(--treesh-ease) both; }
  @keyframes trFadeIn{ from{opacity:0} to{opacity:1} }
  .tr-fade-in{ animation:trFadeIn var(--treesh-dur-2) ease both; }
  @keyframes trFadeOut{ from{opacity:1} to{opacity:0} }
  .tr-fade-out{ animation:trFadeOut var(--treesh-dur-2) ease both; }
  @keyframes trSearchIn{ from{opacity:0;transform:scale(1.015)} to{opacity:1;transform:none} }

  /* fullscreen studio overlay */

/* ============================================================
   LIVE CATALOG LOADER
   Data is fetched at runtime from same-origin content pages

   HTML, normalized, and cached to localStorage. This keeps the app
   in sync with the live Treesh catalog with zero backend.
   ============================================================ */
let SONGS = [], ARTISTS = [], GENRES = [], SONG_BY_ID = {}, ARTIST_BY_ID = {}, ARTIST_SONG_IDS = {}, USER_SONGS = [];

const CONTENT_SOURCES = {
  songs:  ["content/songs",  "/content/songs",  "https://treesh.app/content/songs"],
  icons:  ["content/icons",  "/content/icons",  "https://treesh.app/content/icons"],
  lyrics: ["content/lyrics", "/content/lyrics", "https://treesh.app/content/lyrics"],

const CATALOG_KEY = "treesh_catalog_v3";

async function fetchFirst(urls){
  let lastErr;

    try{
      const ctrl = new AbortController(); const to = setTimeout(()=>ctrl.abort(), 15000);
      const r = await fetch(u, { cache:"no-store", signal: ctrl.signal }); clearTimeout(to);

const parseDoc = (str) => new DOMParser().parseFromString(str, "text/html");
const attr = (el, name) => (el.getAttribute(name) || "").trim();
const normKey = (s) => String(s==null?"":s).toLowerCase().replace(/[\u2018\u2019\u201c\u201d]/g,"'").replace(/[^a-z0-9]+/g,"");

function parseSongs(doc){
  const used = new Set(), out = [];
  doc.querySelectorAll("ul.song").forEach((el, i) => {
    const title = attr(el,"data-track"), audioUrl = attr(el,"data-mp3");
    if(!title || !audioUrl) return; // skip template/empty rows
    const artist = attr(el,"data-artist"), aid = attr(el,"data-artist-id");
    let id = slug(artist + "-" + title) || ("track-" + i);
    while(used.has(id)) id = id + "-" + i;
    used.add(id);
    out.push({
      id, title, artist, artistIds: aid ? aid.split(",").map(x => x.trim()).filter(Boolean) : [],
      genre: attr(el,"data-genre"), mood: attr(el,"data-mood"),
      creationDate: attr(el,"data-creation-date"), writtenBy: attr(el,"data-written-by"),
      producer: attr(el,"data-producer"), mixer: attr(el,"data-mixer"),
      videographer: attr(el,"data-videographer"), featuring: attr(el,"data-featuring"),
      album: attr(el,"data-album"), label: attr(el,"data-label"),
      coverArt: attr(el,"data-coverart"), audioUrl, videoId: attr(el,"data-video"),
      bio: attr(el,"data-bio"), desc: attr(el,"data-desc"),
      explicit: el.hasAttribute("data-explicit"),
      treeshChoice: el.hasAttribute("data-treeshChoice") || el.hasAttribute("data-exclusive"),
      exclusive: el.hasAttribute("data-exclusive"),
      lyrics: [],
    });
  });
  return out;
}

function parseArtists(doc){
  const out = [];
  doc.querySelectorAll("article.artist").forEach(el => {
    const id = attr(el,"data-artist-id"); if(!id) return;
    const imgEl = el.querySelector("img.artist__image") || el.querySelector("img");
    const roleEl = el.querySelector(".artist__label .capital");
    const bg = attr(el,"data-bg");
    out.push({
      id, name: attr(el,"data-name"), bio: attr(el,"data-bio"),
      background: bg, bgPos: attr(el,"data-bg-pos") || "center",
      cashapp: attr(el,"data-cashapp"),
      role: roleEl ? roleEl.textContent.trim() : "Music Artist",
      image: (imgEl && imgEl.getAttribute("src")) || bg,

  return out;
}

function parseTimecode(str){
  if(!str) return 0;
  const parts = String(str).split(":").map(x => parseFloat(x));
  if(parts.some(isNaN)) return 0;
  if(parts.length === 3) return parts[0]*3600 + parts[1]*60 + parts[2];
  if(parts.length === 2) return parts[0]*60 + parts[1];
  return parts[0] || 0;
}
function parseLyrics(doc){

    const track = attr(el,"data-track"), artist = attr(el,"data-artist");
    const lines = [];

    el.querySelectorAll("p").forEach(p => {
      const text = p.textContent.trim(); if(!text) return;

        const inside = hm[1].trim();

        if(/[a-zA-Z]/.test(inside) && !/^x\s*\d+$/i.test(inside)){ curSec = inside; pendingSec = inside; }

/* Map each artist id -> set of song ids they perform on. Includes the primary

/* ================= Custom Music (IndexedDB) =================

   localStorage quota). They live in USER_SONGS (separate from the parsed

const USER_MAX_BYTES=30*1024*1024; // ~30 MB per track
let _idbPromise=null;
function idbOpen(){

function userRecToSong(rec){
  const m=rec.meta||{};

  try{ if(rec.audioBlob) audioUrl=URL.createObjectURL(rec.audioBlob); }catch(e){}
  try{ if(rec.coverBlob) coverArt=URL.createObjectURL(rec.coverBlob); }catch(e){}
  return {

/* Extract an average/vibrant color (as "r,g,b") from a same-origin cover URL.
   Used to softly tint My Music cards and the Custom Studio. Returns null for
   remote/tainted images or near-gray covers so we can fall back to the accent. */
function avgColorFromUrl(url){
  return new Promise(res=>{
    if(!url){ res(null); return; }
    try{
      const im=new Image(); im.crossOrigin="anonymous";
      im.onload=()=>{ try{
        const s=24, c=document.createElement('canvas'); c.width=s; c.height=s;
        const ctx=c.getContext('2d'); ctx.drawImage(im,0,0,s,s);
        const d=ctx.getImageData(0,0,s,s).data;
        let r=0,g=0,b=0,n=0;
        for(let i=0;i<d.length;i+=4){ if(d[i+3]<128) continue; r+=d[i]; g+=d[i+1]; b+=d[i+2]; n++; }
        if(!n){ res(null); return; }
        r=Math.round(r/n); g=Math.round(g/n); b=Math.round(b/n);
        if(Math.max(r,g,b)-Math.min(r,g,b)<16){ res(null); return; }
        res([r,g,b]);
      }catch(e){ res(null); } };
      im.onerror=()=>res(null);
      im.src=url;
    }catch(e){ res(null); }
  });
}
async function computeUserGlows(){
  let changed=false;
  for(const s of USER_SONGS){
    if(s.glow!==undefined) continue;
    if(!s.coverArt || s.coverArt===FALLBACK){ s.glow=null; continue; }
    try{ const c=await avgColorFromUrl(s.coverArt); s.glow=c?(c[0]+","+c[1]+","+c[2]):null; if(c) changed=true; }catch(e){ s.glow=null; }
  }
  if(changed && typeof softRefresh==="function") softRefresh();
}
async function loadUserSongs(){
  try{
    const recs=await idbGetAll();
    recs.sort((a,b)=>(a.addedAt||0)-(b.addedAt||0));
    // revoke any previously-created object URLs before regenerating
    USER_SONGS.forEach(s=>(s._urls||[]).forEach(u=>{ try{ URL.revokeObjectURL(u); }catch(e){} }));
    USER_SONGS=recs.map(userRecToSong);
    mergeUserSongs();
    if(typeof softRefresh==="function") softRefresh();
    computeUserGlows();
  }catch(e){ console.warn("Custom music load failed:", e); }
}

let _catalogSig = "";
function catalogSig(songs, artists){
  const str = songs.map(x=>x.id).join(",") + "~" + artists.map(x=>x.id).join(",");
  let h=0; for(let i=0;i<str.length;i++){ h=(h*31 + str.charCodeAt(i))>>>0; }
  return songs.length + "|" + artists.length + "|" + h;
}
async function loadCatalog(){
  const [songsHTML, iconsHTML, lyricsHTML] = await Promise.all([
    fetchFirst(CONTENT_SOURCES.songs),
    fetchFirst(CONTENT_SOURCES.icons),
    fetchFirst(CONTENT_SOURCES.lyrics),
  ]);
  const songs = parseSongs(parseDoc(songsHTML));
  const artists = parseArtists(parseDoc(iconsHTML));
  attachLyrics(songs, parseLyrics(parseDoc(lyricsHTML)));
  if(!songs.length) throw new Error("No songs found in catalog");
  const sig = catalogSig(songs, artists);
  const changed = sig !== _catalogSig;
  SONGS = songs; ARTISTS = artists; indexCatalog(); _catalogSig = sig;
  if(changed){ state._wnBuilt=null; state._picks=null; }
  try{ localStorage.setItem(CATALOG_KEY, JSON.stringify({ songs: songs, artists: artists, ts: Date.now() })); }catch(e){}
  mergeUserSongs();
  return { changed };
}

    if(c && Array.isArray(c.songs) && c.songs.length){ SONGS = c.songs; ARTISTS = c.artists || []; indexCatalog(); _catalogSig = catalogSig(SONGS, ARTISTS); return c.ts || 0; }
  }catch(e){}

}

let _catalogPollTimer=null, _refreshing=false;
async function refreshCatalog(){

  const prevS=SONGS.length, prevA=ARTISTS.length;

    const res = await loadCatalog();
    if(res.changed){
      softRefresh();
      const dS=SONGS.length-prevS, dA=ARTISTS.length-prevA;
      if(dS>0||dA>0){ const parts=[]; if(dS>0)parts.push(dS+" new song"+(dS>1?"s":"")); if(dA>0)parts.push(dA+" new artist"+(dA>1?"s":"")); toast("What\u2019s New updated", parts.join(" \u00B7 ")); }
    }
  }catch(e){}
  finally{ _refreshing=false; }
}

/* Downscale + recompress an uploaded image so it reliably fits in localStorage.
   Full-screen backgrounds don't need more than ~1600px; JPEG keeps size tiny. */
function compressImageDataUrl(dataUrl, maxDim, quality){
  return new Promise((resolve,reject)=>{
    try{
      const im=new Image();
      im.onload=()=>{
        try{
          let w=im.naturalWidth||im.width, h=im.naturalHeight||im.height;
          if(!w||!h){ resolve(dataUrl); return; }
          const scale=Math.min(1, maxDim/Math.max(w,h));
          w=Math.max(1,Math.round(w*scale)); h=Math.max(1,Math.round(h*scale));
          const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
          const ctx=cv.getContext("2d"); ctx.drawImage(im,0,0,w,h);
          let out; try{ out=cv.toDataURL("image/jpeg", quality); }catch(e){ out=dataUrl; }
          resolve(out && out.length ? out : dataUrl);
        }catch(e){ resolve(dataUrl); }
      };
      im.onerror=()=>reject(new Error("bad image"));
      im.src=dataUrl;
    }catch(e){ reject(e); }
  });
}

const HEART_SVG='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="__F__" stroke="__S__" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"/></svg>';

/* LIKE: a single big accent heart drifts up like a balloon */
function flyHeart(x,y){
  if(state.perfMode) return; if(x==null||y==null||isNaN(x)||isNaN(y)) return;
  const layer=fxLayer();
  const wrap=document.createElement("span"); wrap.className="fx-balloon";
  wrap.style.left=x+"px"; wrap.style.top=y+"px";
  wrap.style.setProperty("--sway",((Math.random()*2-1)*24).toFixed(0)+"px");
  const inner=document.createElement("span"); inner.className="fx-balloon-inner";
  inner.innerHTML=HEART_SVG.replace(/__F__/g,"var(--treesh-purple)").replace(/__S__/g,"var(--treesh-purple)");
  wrap.appendChild(inner); layer.appendChild(wrap);
  setTimeout(()=>wrap.remove(),1550);
}

function breakHeart(x,y){
  if(state.perfMode) return; if(x==null||y==null||isNaN(x)||isNaN(y)) return;
  const layer=fxLayer();
  const el=document.createElement("span"); el.className="fx-crack"; el.style.left=x+"px"; el.style.top=y+"px";
  el.innerHTML=CRACK_SVG.replace(/__C__/g,"var(--treesh-purple)");
  layer.appendChild(el); setTimeout(()=>el.remove(),1050);
  for(let i=0;i<2;i++){ const f=document.createElement("span"); f.className="fx-frag "+(i?"fx-frag-r":"fx-frag-l"); f.style.left=x+"px"; f.style.top=y+"px"; f.innerHTML=HEART_SVG.replace(/__F__/g,"var(--treesh-purple)").replace(/__S__/g,"var(--treesh-purple)"); layer.appendChild(f); setTimeout(()=>f.remove(),840); }
}

function shuffleKeepFirst(arr, i){ let rest=arr.filter((_,x)=>x!==i); rest=rest.filter(s=>!(s&&s.id&&state.dislikes.has(s.id))); for(let k=rest.length-1;k>0;k--){ const j=Math.floor(Math.random()*(k+1)); [rest[k],rest[j]]=[rest[j],rest[k]]; } return [arr[i],...rest]; }
function curSong(){ return state.index>=0 && state.index<state.queue.length ? state.queue[state.index] : null; }
function loadIndex(i, list, autoplay=true){ const q=list||state.queue; if(i<0||i>=q.length) return; if(state.lyricSelect){ state.lyricSelect=false; state.lyricSel=[]; closeLyricPop(); } _starLastTU=-1; state.abA=null; state.abB=null; state.index=i; const song=q[i]; if(audio.src!==song.audioUrl) audio.src=song.audioUrl; audio.load(); if(autoplay){ const p=audio.play(); if(p&&p.catch) p.catch(()=>{}); } }
function playSong(song, list){ const src=(list&&list.length)?list:[song]; state.base=src; let order=src, idx=Math.max(0,src.findIndex(s=>s.id===song.id)); if(state.shuffle){ order=shuffleKeepFirst(src,idx); idx=0; } state.queue=order; loadIndex(idx,order,true); state.npOpen=false; renderMini(); renderNP(); }
function togglePlay(){ if(!curSong()) return; if(audio.paused){ const p=audio.play(); if(p&&p.catch)p.catch(()=>{}); } else audio.pause(); }
function nextTrack(manual=false){ const q=state.queue; if(!q.length) return; if(state.repeat==="one"&&!manual){ loadIndex(state.index,q,true); return; } let n=state.index+1; if(n>=q.length){ if(state.repeat==="all"||manual) n=0; else { audio.pause(); return; } } loadIndex(n,q,true); }
function prevTrack(){ const q=state.queue; if(!q.length) return; if(audio.currentTime>3){ audio.currentTime=0; return; } let p=state.index-1; if(p<0)p=q.length-1; loadIndex(p,q,true); }
function seekTo(t){ if(!isNaN(t)) audio.currentTime=t; }
function setVolume(v){ audio.volume=v; state.volume=v; }
function toggleShuffle(){ state.shuffle=!state.shuffle; const cur=curSong(); if(state.base.length&&cur){ if(state.shuffle){ const i=state.base.findIndex(s=>s.id===cur.id); state.queue=shuffleKeepFirst(state.base,i>=0?i:0); state.index=0; } else { const i=state.base.findIndex(s=>s.id===cur.id); state.queue=state.base.slice(); state.index=i>=0?i:0; } } renderNP(); }
function cycleRepeat(){ state.repeat=state.repeat==="off"?"all":state.repeat==="all"?"one":"off"; renderNP(); }
function addToQueue(song, playNext=false){ if(!state.queue.length){ playSong(song,[song]); return true; } if(state.queue.some(s=>s.id===song.id)) return false; if(playNext) state.queue.splice(state.index+1,0,song); else state.queue.push(song); state.base=state.queue.slice(); return true; }
function removeFromQueue(id){ const i=state.queue.findIndex(s=>s.id===id); if(i<0) return; const wasCur=i===state.index; state.queue.splice(i,1); state.base=state.queue.slice(); if(wasCur){ if(!state.queue.length){ audio.pause(); state.index=-1; } else loadIndex(Math.min(i,state.queue.length-1),state.queue,true); } else if(i<state.index){ state.index--; } renderQueue(); renderNP(); renderMini(); }
function moveQueue(id, dir){ const i=state.queue.findIndex(s=>s.id===id); const j=i+dir; if(i<0||j<0||j>=state.queue.length) return; const cur=curSong(); [state.queue[i],state.queue[j]]=[state.queue[j],state.queue[i]]; state.base=state.queue.slice(); if(cur) state.index=state.queue.findIndex(s=>s.id===cur.id); renderQueue(); }

audio.addEventListener("play", ()=>{ state.isPlaying=true; updatePlayIcons(); if("mediaSession"in navigator) navigator.mediaSession.playbackState="playing"; });
audio.addEventListener("pause", ()=>{ state.isPlaying=false; updatePlayIcons(); if("mediaSession"in navigator) navigator.mediaSession.playbackState="paused"; });
let _starLastTU=-1;
audio.addEventListener("timeupdate", ()=>{ const ct=audio.currentTime||0; if(state.abA!=null && state.abB!=null && ct>=state.abB-0.03){ try{ audio.currentTime=state.abA; }catch(e){} return; } if(state.isPlaying && _starLastTU>=0){ const d=ct-_starLastTU; if(d>0 && d<2) starListenTick(d); } _starLastTU=ct; state.currentTime=ct; updateProgress(); const s=curSong(); if(s && ct>20) starNewSong(s.id); });
audio.addEventListener("loadedmetadata", ()=>{ state.duration=audio.duration||0; updateProgress(); updateABMarkers(); });
audio.addEventListener("ended", ()=>nextTrack(false));
audio.addEventListener("error", ()=>{ state.isPlaying=false; });

/* ============================================================
   COLOR EXTRACTION (ambient gradient)
   ============================================================ */
const paletteCache = new Map();
function extractPalette(url){ return new Promise(res=>{ if(!url) return res(null); if(paletteCache.has(url)) return res(paletteCache.get(url)); const im=new Image(); im.crossOrigin="anonymous"; let done=false; const fin=v=>{ if(!done){done=true; paletteCache.set(url,v); res(v);} }; const to=setTimeout(()=>fin(null),6000); im.onload=()=>{ clearTimeout(to); try{ const s=36,cv=document.createElement("canvas"); cv.width=s; cv.height=s; const ctx=cv.getContext("2d",{willReadFrequently:true}); ctx.drawImage(im,0,0,s,s); const d=ctx.getImageData(0,0,s,s).data; const buk={}; for(let i=0;i<d.length;i+=4){ if(d[i+3]<125) continue; const r=d[i],g=d[i+1],b=d[i+2]; const mx=Math.max(r,g,b),mn=Math.min(r,g,b),light=(mx+mn)/2,sat=mx===mn?0:(mx-mn)/(255-Math.abs(mx+mn-255)+1e-6); const key=(r>>4)+"-"+(g>>4)+"-"+(b>>4); if(!buk[key]) buk[key]={r:0,g:0,b:0,n:0,s:0,l:0}; const k=buk[key]; k.r+=r;k.g+=g;k.b+=b;k.n++;k.s+=sat;k.l+=light; } let arr=Object.values(buk).map(k=>({r:Math.round(k.r/k.n),g:Math.round(k.g/k.n),b:Math.round(k.b/k.n),n:k.n,sat:k.s/k.n,light:k.l/k.n})); if(!arr.length) return fin(null); arr.forEach(c=>{ const lp=(c.light>230||c.light<22)?0.25:1; c.score=c.n*(0.35+c.sat)*lp; }); arr.sort((a,b)=>b.score-a.score); const pick=[]; for(const c of arr){ if(pick.every(p=>Math.abs(p.r-c.r)+Math.abs(p.g-c.g)+Math.abs(p.b-c.b)>60)) pick.push(c); if(pick.length>=3) break; } while(pick.length<2&&arr.length) pick.push(arr[pick.length]||arr[0]); fin(pick.map(c=>({r:c.r,g:c.g,b:c.b}))); }catch(e){ fin(null);} }; im.onerror=()=>{ clearTimeout(to); fin(null); }; im.src=url; }); }
const rgb=(c,a=1)=> c?`rgba(${c.r},${c.g},${c.b},${a})`:`rgba(147,40,255,${a})`;

async function copyText(t){ try{ await navigator.clipboard.writeText(t); return true; }catch(e){ try{ const ta=document.createElement("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); return true; }catch(e2){ return false; } } }
async function shareTrack(song){ const url=location.origin+location.pathname+"?song="+encodeURIComponent(song.id); const text=`\u{1F3B5} Listen to \u201C${song.title}\u201D by ${song.artist} on Treesh`; if(navigator.share){ try{ await navigator.share({title:song.title,text,url}); return; }catch(e){ if(e&&e.name==="AbortError") return; } } const ok=await copyText(text+"\n"+url); toast(ok?"Link copied to clipboard":"Could not copy", song.title); }
async function sharePlaylist(pl){ const url=location.origin+location.pathname; const text=`\u{1F3A7} My Treesh playlist \u201C${pl.name}\u201D`; if(navigator.share){ try{ await navigator.share({title:pl.name,text,url}); return; }catch(e){ if(e&&e.name==="AbortError") return; } } const ok=await copyText(text+"\n"+url); toast(ok?"Link copied":"Could not copy", pl.name); }

/* ============================================================
   SONG METADATA (credits / details modal)
   ============================================================ */
function featuredNames(s){ const names=[]; if(s.featuring) names.push(s.featuring); (s.artistIds||[]).forEach((id,i)=>{ if(i===0) return; const a=ARTIST_BY_ID[id]; if(a && a.name && a.name!==s.artist) names.push(a.name); }); return [...new Set(names.filter(Boolean))].join(", "); }
function metaRow(label,value){ if(!value) return ""; return `<div class="flex items-start justify-between gap-4 border-t border-white/10 py-3 first:border-t-0"><span class="shrink-0 text-xs uppercase tracking-widest text-white/45">${esc(label)}</span><span class="text-right text-sm text-white/85" data-testid="metadata-value-${slug(label)}">${esc(value)}</span></div>`; }
function metaSection(title,rows){ if(!rows.trim()) return ""; return `<div class="mt-4 first:mt-0"><p class="mb-1.5 text-[11px] font-semibold uppercase tracking-[0.2em] text-[color:var(--treesh-gold)]">${title}</p><div class="rounded-2xl border border-white/10 bg-white/[0.03] px-3">${rows}</div></div>`; }
function metaFields(s){ const feat=featuredNames(s); const mood=s.mood?s.mood.split(",").map(x=>x.trim()).filter(Boolean).join(", "):""; const dur=(state.duration&&curSong()&&curSong().id===s.id)?fmt(state.duration):""; return {feat,mood,dur}; }
function openMetadata(songId){
  const s=SONG_BY_ID[songId]; if(!s) return;
  const {feat,mood,dur}=metaFields(s);
  const release=[metaRow("Date",s.creationDate),metaRow("Album",s.album),metaRow("Label",s.label)].join("");
  const credits=[metaRow("Artist",s.artist),metaRow("Featured",feat),metaRow("Written by",s.writtenBy),metaRow("Producer",s.producer),metaRow("Mixed by",s.mixer),metaRow("Videographer",s.videographer)].join("");
  const details=[metaRow("Genre",s.genre),metaRow("Mood",mood),metaRow("Duration",dur),s.explicit?metaRow("Rating","Explicit"):"",s.treeshChoice?metaRow("Badge","Treesh\u2019s Pick"):""].join("");
  const aboutText=((s.desc||s.bio||"")+"").trim();
  const about=aboutText?`<p class="py-3 text-sm leading-relaxed text-white/80" data-testid="metadata-about">${esc(aboutText)}</p>`:"";
  const empty=!release.trim()&&!credits.trim()&&!details.trim()&&!about.trim();
  const inner=`<div class="mb-2 flex items-center justify-between gap-3">
      <div class="flex min-w-0 items-center gap-3"><div class="h-12 w-12 shrink-0 overflow-hidden rounded-xl">${img(s.coverArt,'h-full w-full object-cover')}</div><div class="min-w-0"><p class="clamp-1 font-display text-[13px] uppercase tracking-[0.14em] text-white/90">${esc(s.title)}</p><p class="clamp-1 text-sm text-white/60">${esc(s.artist)}</p></div></div>
      <button data-act="modal-close" aria-label="Close" class="press grid h-9 w-9 shrink-0 place-items-center rounded-full border border-white/12 bg-white/5 text-white/75 hover:bg-white/10"><i data-lucide="x" style="width:18px;height:18px"></i></button>
    </div>
    <div class="mt-1 max-h-[68vh] overflow-y-auto no-scrollbar pr-1">${empty?`<div class="flex flex-col items-center gap-2 py-10 text-center text-white/50"><i data-lucide="info" style="width:26px;height:26px"></i><p class="text-sm">No additional details available for this track.</p></div>`:`${metaSection("About",about)}${metaSection("Release",release)}${metaSection("Credits",credits)}${metaSection("Details",details)}`}</div>
    ${empty?"":`<button data-act="meta-copy" data-id="${s.id}" data-testid="metadata-copy-credits-button" class="press mt-4 inline-flex w-full items-center justify-center gap-2 rounded-2xl border border-white/12 bg-white/5 py-3 text-sm font-semibold hover:bg-white/10"><i data-lucide="copy" style="width:16px;height:16px"></i>Copy credits</button>`}`;
  $("#modal").innerHTML=modalWrap(inner,"now-playing-metadata-modal"); icons();
}
function copyCredits(songId){ const s=SONG_BY_ID[songId]; if(!s) return; const {feat}=metaFields(s); const parts=[["Title",s.title],["Artist",s.artist],["Featured",feat],["Written by",s.writtenBy],["Producer",s.producer],["Mixed by",s.mixer],["Album",s.album],["Label",s.label],["Genre",s.genre],["Date",s.creationDate]].filter(p=>p[1]).map(p=>p[0]+": "+p[1]); copyText(parts.join("\n")).then(ok=>toast(ok?"Credits copied":"Couldn\u2019t copy",s.title)); }

/* ============================================================
   FULL-SCREEN SEARCH OVERLAY (bottom-docked input, thumb-reach)
   ============================================================ */
function pushRecent(q){ q=(q||"").trim(); if(!q) return; const list=(state.recentSearches||[]).filter(x=>x.toLowerCase()!==q.toLowerCase()); list.unshift(q); state.recentSearches=list.slice(0,8); LS.set("treesh_recent_searches",state.recentSearches); }
function hlMatch(text,q){ text=String(text==null?"":text); if(!q) return esc(text); const i=text.toLowerCase().indexOf(q.toLowerCase()); if(i<0) return esc(text); return esc(text.slice(0,i))+`<mark style="background:var(--treesh-purple-soft);color:#fff;border-radius:4px;padding:0 2px">`+esc(text.slice(i,i+q.length))+`</mark>`+esc(text.slice(i+q.length)); }
function normStr(s){ return String(s==null?"":s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim(); }
function isSubseq(needle,hay){ if(!needle) return true; let i=0; for(let j=0;j<hay.length&&i<needle.length;j++){ if(hay[j]===needle[i]) i++; } return i===needle.length; }
function fieldScore(text,qn,qTokens,qc){ const hn=normStr(text); if(!hn) return 0; const hc=hn.replace(/ /g,""); let sc=0; if(hn.includes(qn)) sc=Math.max(sc,100); if(qc && hc.includes(qc)) sc=Math.max(sc,88); const hTokens=hn.split(" ").filter(Boolean); let covered=0,tsum=0; for(const qt of qTokens){ let tb=0; for(const ht of hTokens){ if(ht===qt){tb=Math.max(tb,12);} else if(ht.startsWith(qt)){tb=Math.max(tb,9);} else if(qt.length>=2&&ht.includes(qt)){tb=Math.max(tb,6);} } if(tb===0&&qt.length>=3&&isSubseq(qt,hc)) tb=3; if(tb>0){covered++;tsum+=tb;} } if(qTokens.length&&covered===qTokens.length) sc=Math.max(sc,45+tsum); else if(covered>0) sc=Math.max(sc,tsum); if(sc===0&&qc.length>=3&&isSubseq(qc,hc)) sc=18; return sc; }
function scoreFields(fields,q){ const qn=normStr(q); if(!qn) return 0; const qTokens=qn.split(" ").filter(Boolean); const qc=qn.replace(/ /g,""); let best=0; for(const f of fields){ const s=fieldScore(f.text,qn,qTokens,qc)*(f.weight||1); if(s>best) best=s; } return best; }
function parseByQuery(q){ const m=(q||"").match(/^(.*\S)\s+by\s+(\S.*)$/i); return m?{song:m[1].trim(),artist:m[2].trim()}:null; }
function searchSongsList(q){ q=(q||"").trim(); if(!q) return []; const by=parseByQuery(q); let scored=[]; if(by){ for(const s of SONGS){ const ts=scoreFields([{text:s.title,weight:1}],by.song); const as=scoreFields([{text:s.artist,weight:1},{text:s.featuring||"",weight:0.75},{text:s.writtenBy||"",weight:0.6}],by.artist); if(ts>0&&as>0) scored.push({s,score:ts+as+25}); } } if(!scored.length){ for(const s of SONGS){ const sc=scoreFields([{text:s.title,weight:1},{text:s.artist,weight:0.92},{text:s.featuring||"",weight:0.72},{text:s.writtenBy||"",weight:0.5},{text:s.genre||"",weight:0.4},{text:s.mood||"",weight:0.35},{text:s.album||"",weight:0.4}],q); if(sc>0) scored.push({s,score:sc}); } } if(state.searchSort==="title") scored.sort((a,b)=>a.s.title.localeCompare(b.s.title)); else if(state.searchSort==="artist") scored.sort((a,b)=>(a.s.artist||"").localeCompare(b.s.artist||"")||(b.score-a.score)); else scored.sort((a,b)=>b.score-a.score); return vis(scored.map(x=>x.s)).slice(0,80); }
function searchArtistsList(q){ q=(q||"").trim(); if(!q) return []; let scored=[]; for(const a of ARTISTS){ const sc=scoreFields([{text:a.name,weight:1},{text:a.role||"",weight:0.4}],q); if(sc>0) scored.push({a,score:sc}); } scored.sort((x,y)=>y.score-x.score); return scored.map(x=>x.a).slice(0,60); }
function searchLyricsList(q){ q=(q||"").trim(); if(!q) return []; const qn=normStr(q); const qc=qn.replace(/ /g,""); const out=[]; for(const s of vis(SONGS)){ const lines=s.lyrics||[]; for(let i=0;i<lines.length;i++){ const tx=lines[i]&&lines[i].text; if(!tx) continue; const hn=normStr(tx); if(hn.includes(qn) || (qc.length>=3 && hn.replace(/ /g,"").includes(qc))){ out.push({song:s,line:tx,i,t:lines[i].t}); if(out.length>=60) break; } } if(out.length>=60) break; } return out; }
function searchEmpty(q){ return `<div class="flex min-h-[38vh] flex-col items-center justify-center gap-3 text-center text-white/50"><i data-lucide="search-x" style="width:38px;height:38px"></i><p class="text-sm">No ${esc(state.searchTab)} match \u201C${esc(q)}\u201D</p></div>`; }
function searchResultsHtml(){
  const q=(state.searchQuery||"").trim();
  if(!q){
    return `<div class="flex h-full min-h-[40vh] flex-col items-center justify-center gap-3 text-center text-white/45"><div class="grid h-16 w-16 place-items-center rounded-2xl bg-white/5"><i data-lucide="search" style="width:30px;height:30px"></i></div><p class="text-sm">Search songs, artists &amp; lyrics</p></div>`;
  }
  const tab=state.searchTab;
  if(tab==="artists"){
    const list=searchArtistsList(q); if(!list.length) return searchEmpty(q);
    return `<div class="space-y-1 pb-2">${list.map(a=>{const cnt=artistSongs(a.id).length;return `<button data-act="search-open-artist" data-id="${a.id}" data-testid="search-result-artist-${a.id}" class="press flex w-full items-center gap-3 rounded-2xl p-2.5 text-left transition-colors hover:bg-white/5"><div class="h-11 w-11 shrink-0 overflow-hidden rounded-full border border-white/12">${img(a.image,'h-full w-full object-cover')}</div><div class="min-w-0 flex-1"><p class="clamp-1 text-sm font-semibold">${hlMatch(a.name,q)}</p><p class="clamp-1 text-xs text-white/50">${esc(a.role||'Music Artist')} \u00B7 ${cnt} track${cnt!==1?'s':''}</p></div><i data-lucide="chevron-right" class="shrink-0 text-white/30" style="width:16px;height:16px"></i></button>`;}).join("")}</div>`;
  }
  if(tab==="lyrics"){
    const list=searchLyricsList(q); if(!list.length) return searchEmpty(q);
    return `<div class="space-y-1.5 pb-2">${list.map(r=>{const liked=isFavLyric(r.song.id,r.i);return `<div data-testid="search-result-lyrics-${r.song.id}-${r.i}" class="group flex items-start gap-3 rounded-2xl p-2.5 transition-colors hover:bg-white/5"><button data-act="search-play-lyric" data-id="${r.song.id}" data-i="${r.i}" data-t="${r.t}" class="h-11 w-11 shrink-0 overflow-hidden rounded-xl">${img(r.song.coverArt,'h-full w-full object-cover')}</button><button data-act="search-play-lyric" data-id="${r.song.id}" data-i="${r.i}" data-t="${r.t}" class="min-w-0 flex-1 text-left"><p class="clamp-1 text-xs text-white/55">${esc(r.song.title)} \u00B7 ${esc(r.song.artist)}</p><p class="clamp-2 mt-0.5 text-sm text-white/85">\u201C${hlMatch(r.line,q)}\u201D</p></button><div class="flex shrink-0 items-center gap-1"><button data-act="search-fav-lyric" data-id="${r.song.id}" data-i="${r.i}" data-testid="search-fav-lyric-${r.song.id}-${r.i}" aria-label="Favorite lyric" class="tr-like${liked?' is-liked':''} press grid h-9 w-9 place-items-center rounded-full text-white/55 hover:bg-white/10"><i data-lucide="heart" style="width:15px;height:15px"></i></button><button data-act="search-make-card" data-id="${r.song.id}" data-i="${r.i}" data-testid="search-make-card-${r.song.id}-${r.i}" aria-label="Make lyric card" class="press grid h-9 w-9 place-items-center rounded-full text-white/55 hover:bg-white/10"><i data-lucide="image" style="width:15px;height:15px"></i></button></div></div>`;}).join("")}</div>`;
  }
  let list=searchSongsList(q);
  if(state.searchFilter==="picks") list=list.filter(s=>s.treeshChoice);
  else if(state.searchFilter==="explicit") list=list.filter(s=>s.explicit);
  else if(state.searchFilter==="clean") list=list.filter(s=>!s.explicit);
  if(!list.length) return searchEmpty(q);

function dateMs(str){ if(!str) return 0; const t=Date.parse(str); return isNaN(t)?0:t; }
function relDate(str){ const t=dateMs(str); if(!t) return esc(str||""); const diff=Date.now()-t, day=86400000; if(diff<day*2) return "Just added"; const d=Math.floor(diff/day); if(d<7) return d+" days ago"; const w=Math.floor(d/7); if(w<5) return w+(w===1?" week ago":" weeks ago"); const mo=Math.floor(d/30); if(mo<12) return mo+(mo===1?" month ago":" months ago"); const y=Math.floor(d/365); return y+(y===1?" year ago":" years ago"); }
function artistSongs(id){ const set=ARTIST_SONG_IDS[id]; if(set) return vis(SONGS.filter(s=>set.has(s.id))); return vis(SONGS.filter(s=>(s.artistIds||[]).includes(id))); }

function buildWhatsNew(){
  const bydate=vis([...SONGS]).sort((a,b)=>dateMs(b.creationDate)-dateMs(a.creationDate));
  const recentSongs=bydate.slice(0,3);
  const latest={}; SONGS.forEach(s=>{ const t=dateMs(s.creationDate); (s.artistIds||[]).forEach(id=>{ if(t>(latest[id]||0)) latest[id]=t; }); });
  const withSongs=ARTISTS.filter(a=>artistSongs(a.id).length);
  const recentArtists=[...withSongs].sort((a,b)=>(latest[b.id]||0)-(latest[a.id]||0)).slice(0,3);
  const recentIds=new Set(recentArtists.map(a=>a.id));
  const pool=withSongs.filter(a=>!recentIds.has(a.id));
  const randomArtist=pool.length?pool[Math.floor(Math.random()*pool.length)]:null;
  const slides=[];
  for(let i=0;i<3;i++){ if(recentSongs[i]) slides.push({kind:"song",song:recentSongs[i]}); if(recentArtists[i]) slides.push({kind:"artist",artist:recentArtists[i]}); }
  if(randomArtist) slides.push({kind:"rediscover",artist:randomArtist});
  return slides;
}

function lockObf(s){ try{ return btoa(unescape(encodeURIComponent(String(s)))); }catch(e){ return String(s); } }

function updateStorageEstimate(){
  const el=document.getElementById("storage-quota-text"); if(!el) return;
  if(navigator.storage && navigator.storage.estimate){
    navigator.storage.estimate().then(est=>{ const el2=document.getElementById("storage-quota-text"); if(!el2) return; if(est && est.quota){ const free=Math.max(0,(est.quota||0)-(est.usage||0)); el2.textContent="~"+fmtBytes(free)+" free on device"; } else { el2.textContent="Device estimate unavailable"; } }).catch(()=>{ const el2=document.getElementById("storage-quota-text"); if(el2) el2.textContent="Device estimate unavailable"; });
  } else { el.textContent="Device estimate unavailable"; }
}
function updateCustomMusicStorage(){
  const sizeEl=document.getElementById("custom-music-size"), barEl=document.getElementById("custom-music-bar"), subEl=document.getElementById("custom-music-sub"), hintEl=document.getElementById("custom-music-hint");
  if(!sizeEl && !barEl) return;
  idbGetAll().then(recs=>{
    recs=recs||[]; let total=0; recs.forEach(r=>{ if(r.audioBlob&&r.audioBlob.size) total+=r.audioBlob.size; if(r.coverBlob&&r.coverBlob.size) total+=r.coverBlob.size; });
    if(sizeEl) sizeEl.textContent=fmtBytes(total);
    if(subEl) subEl.textContent=recs.length+" track"+(recs.length!==1?"s":"")+" stored on this device";
    const finish=(pct,hint)=>{ if(barEl) barEl.style.width=Math.max(total>0?2:0,Math.min(100,Math.round(pct||0)))+"%"; if(hintEl && hint) hintEl.textContent=hint; };
    if(navigator.storage && navigator.storage.estimate){
      navigator.storage.estimate().then(est=>{ if(est && est.quota){ const free=Math.max(0,(est.quota||0)-(est.usage||0)); finish(total/est.quota*100, "About "+fmtBytes(free)+" of space is still free on this device"); } else { finish(total/(200*1024*1024)*100); } }).catch(()=>finish(total/(200*1024*1024)*100));
    } else { finish(total/(200*1024*1024)*100); }
  }).catch(()=>{});
}

function animateView(){
  const v=$("#view"); if(!v) return;
  if(_io){ _io.disconnect(); _io=null; }
  if(prefersReduced()) return;
  let kids=[...v.children];
  if(kids.length===1 && kids[0].children && kids[0].children.length>1) kids=[...kids[0].children];
  kids.forEach((el,i)=>{ el.classList.remove("reveal-stagger"); void el.offsetWidth; el.style.animationDelay=(Math.min(i,8)*55)+"ms"; el.classList.add("reveal-stagger"); });

  if(items.length>6){

    items.forEach(el=>{ el.classList.add("io-reveal"); _io.observe(el); });

/* ---------- preserve inner scroll positions across re-renders ---------- */
function _domPath(el, root){ const path=[]; let n=el; while(n && n!==root){ const parent=n.parentNode; if(!parent) break; const idx=Array.prototype.indexOf.call(parent.children, n); if(idx<0) break; path.push(idx); n=parent; } return path.reverse().join('.'); }
function _elByPath(root, path){ if(path==='') return root; const parts=path.split('.'); let n=root; for(let i=0;i<parts.length;i++){ const idx=+parts[i]; if(!n||!n.children||!n.children[idx]) return null; n=n.children[idx]; } return n; }
function captureScroll(root){ const map=[]; if(!root) return map; const all=root.querySelectorAll('*'); for(let i=0;i<all.length;i++){ const el=all[i]; if((el.scrollLeft>0||el.scrollTop>0) && (el.scrollWidth>el.clientWidth+1||el.scrollHeight>el.clientHeight+1)){ map.push([_domPath(el,root), el.scrollLeft, el.scrollTop]); } } return map; }
function restoreScroll(root, map){ if(!root||!map||!map.length) return; for(let i=0;i<map.length;i++){ const rec=map[i]; const el=_elByPath(root, rec[0]); if(el){ if(rec[1]) el.scrollLeft=rec[1]; if(rec[2]) el.scrollTop=rec[2]; } } }

  const ff=$("#set-font-file"); if(ff){ ff.addEventListener("change",e=>{ const f=e.target.files&&e.target.files[0]; if(!f) return; if(f.size>3*1024*1024){ toast("Font too large","Use one under 3 MB"); return; } const r=new FileReader(); r.onload=()=>{ try{ state.customFont={data:r.result, name:(f.name||'Custom').replace(/\.[^.]+$/,'')}; state.uiFont=""; _customFontLoaded=false; LS.set("treesh_custom_font",state.customFont); applyUiFont(); renderView(); toast("Custom font applied", state.customFont.name); }catch(err){ toast("Couldn\u2019t load font"); } }; r.readAsDataURL(f); }); }
  iRenderMenu();

    if(cur) out.push(cur); else if(!words.length) out.push("");

}

    const bs=ctx.createLinearGradient(0,H*0.42,0,H); bs.addColorStop(0,hexA(ov,0)); bs.addColorStop(0.7,hexA(ov,0.4)); bs.addColorStop(1,hexA(ov,0.74)); ctx.fillStyle=bs; ctx.fillRect(0,0,W,H);

function gnorm(s){ return String(s==null?"":s).toLowerCase().replace(/[\u2018\u2019\u201c\u201d]/g,"'").replace(/[^a-z0-9\s]/g,"").replace(/\s+/g," ").trim(); }
function lev(a,b){ const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let prev=Array.from({length:n+1},(_,j)=>j); for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++){ cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1)); } prev=cur; } return prev[n]; }

function submitAnswer(ans, mode, timedOut){
  const g=state.game; if(!g||g.answered) return;
  clearGameTimer();
  const targetFull=g.lines[g.targets[g.round]].text;
  const parenParts=(targetFull.match(/\(([^)]*)\)/g)||[]).map(x=>x.replace(/[()]/g,"").trim()).filter(Boolean);
  const targetBase=(targetFull.replace(/\([^)]*\)/g," ").replace(/\s+/g," ").trim())||targetFull;
  const a=(ans||"").trim();

  const exact = normExact(a).toLowerCase()===normExact(targetBase).toLowerCase() && a.length>0;

  if(g.exact){ correct=exact; pts = exact?100:Math.round(sim*45); }
  else { correct = sim>=0.6; pts=Math.round(sim*100); }

  let adlibBonus=0, adlibHit=false;

  pts+=bonus;
  g.lastAnswer=a; g.lastSim=sim; g.lastExact=exact; g.lastPoints=pts; g.lastBonus=bonus; g.lastAdlib=adlibHit; g.lastAdlibBonus=adlibHit?adlibBonus:0; g.lastTimedOut=!!timedOut; g.mode=mode||"type"; g.score+=pts;
  if(correct){ g.streak++; if(g.streak>g.bestStreak) g.bestStreak=g.streak; } else g.streak=0;
  g.results.push({correct, sim, pts, exact}); g.answered=true;
  try{ clearTimeout(state._gameHintTimer); if(state.audio) state.audio.pause(); }catch(e){}
  renderGame();
}

/* ============================================================
   LYRIC STUDIO  (native LyricFlow rebuild - timestamp lyrics)
   Bridges into Treesh's existing lyric system:
     state.lyricEdits[songId] = [{t,text,sec,explain}]  (persisted)
   Uses a DEDICATED audio element so it never fights the main player.
   ============================================================ */
const _lsAudio = new Audio(); _lsAudio.preload="metadata";

function lsFmt(t){ if(!isFinite(t)||t<0) t=0; const m=Math.floor(t/60), s=Math.floor(t%60); return m+":"+(s<10?"0":"")+s; }
function lsFmtLRC(t){ if(!isFinite(t)||t<0) t=0; const m=Math.floor(t/60), s=Math.floor(t%60), cs=Math.floor((t%1)*100); return ("0"+m).slice(-2)+":"+("0"+s).slice(-2)+"."+("0"+cs).slice(-2); }
function lsParseTS(str){ if(str==null) return null; str=String(str).replace(/[\[\]]/g,"").trim(); if(!str) return null; const m=str.match(/^(\d+):(\d+(?:\.\d+)?)$/); if(m) return parseInt(m[1],10)*60+parseFloat(m[2]); const n=parseFloat(str); return isNaN(n)?null:n; }
function lsIsSection(text){ return /^\s*\[[^\]]+\]\s*$/.test(text||""); }
function lsSectionLabel(text){ const m=(text||"").match(/^\s*\[([^\]]+)\]\s*$/); return m?m[1].trim():(text||"").trim(); }

/* Convert a song's stored lyrics into editable session items (keeps sections) */
function lsItemsFromSong(s){
  const items=[]; const lines=(s&&s.lyrics)||[]; let lastSec=null;
  lines.forEach(l=>{
    if(l.sec && l.sec!==lastSec){ items.push({type:'section', text:l.sec}); lastSec=l.sec; }
    if(l.text && String(l.text).trim()) items.push({type:'line', t:(typeof l.t==='number'?l.t:null), text:l.text, explain:l.explain||"", words:(l.words&&l.words.length?l.words.slice():null)});
  });
  return items;
}
/* Align new write-mode line texts to previous line items so timestamps (and word
   timings / explanations) survive edits. Unchanged lines keep their exact stamp
   (LCS anchors); edited-in-place lines keep their stamp positionally; only brand
   new lines start unstamped, and only removed lines lose their stamp. */
function lsAlignLines(oldItems, newTexts){
  const o=(oldItems||[]).map(it=>(it.text||'').trim()); const n=newTexts;
  const O=o.length, N=n.length;
  const res=new Array(N).fill(null); // {item, exact}
  if(!O){ return res; }
  // LCS dp on trimmed text
  const dp=Array.from({length:O+1},()=>new Array(N+1).fill(0));
  for(let i=O-1;i>=0;i--) for(let j=N-1;j>=0;j--){ dp[i][j]= o[i]===n[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]); }
  const usedOld=new Array(O).fill(false); let i=0,j=0;
  while(i<O && j<N){ if(o[i]===n[j]){ res[j]={item:oldItems[i],exact:true}; usedOld[i]=true; i++; j++; } else if(dp[i+1][j]>=dp[i][j+1]){ i++; } else { j++; } }
  // positional fallback: leftover old line items -> unmatched new lines, in order (in-place edits)
  const leftover=[]; for(let x=0;x<O;x++) if(!usedOld[x]) leftover.push(oldItems[x]);
  let up=0;
  for(let k=0;k<N;k++){ if(res[k]==null && up<leftover.length){ res[k]={item:leftover[up++],exact:false}; } }
  return res;
}
function lsParseWriteText(text, prevItems){
  const prevLineItems=(prevItems||[]).filter(it=>it.type==='line');
  const parsed=[]; // {isSection, text}
  (text||'').split(/\r?\n/).forEach(raw=>{
    const line=raw.replace(/\s+$/,''); if(!line.trim()) return;
    if(lsIsSection(line)) parsed.push({isSection:true, text:lsSectionLabel(line)});
    else parsed.push({isSection:false, text:line.trim()});
  });
  const newTexts=parsed.filter(p=>!p.isSection).map(p=>p.text);
  const aligned=lsAlignLines(prevLineItems, newTexts);
  const items=[]; let li=0;
  parsed.forEach(p=>{
    if(p.isSection){ items.push({type:'section', text:p.text}); return; }
    const a=aligned[li++]; const src=a&&a.item;
    const it={type:'line', t:(src&&src.t!=null?src.t:null), text:p.text, explain:(src&&src.explain)||''};
    if(src && a.exact && src.words && src.words.length) it.words=src.words.slice();
    items.push(it);
  });
  return items;
}

/* ---- save / bridge into Treesh ---- */
function lsBuildLyrics(){
  const out=[]; let curSec=null; let lastT=0; let pendingSec=null;
  (state.ls.items||[]).forEach(it=>{
    if(it.type==='section'){ curSec=(it.text||'').trim()||null; pendingSec=curSec; return; }
    const text=(it.text||'').trim(); if(!text) return;
    let t=(it.t!=null)? it.t : lastT; // untimed lines inherit the previous time so they still display
    lastT=t; pendingSec=null;
    const line={ t:+t, text, sec:curSec };
    if(it.explain) line.explain=it.explain;
    if(it.words && it.words.length) line.words=it.words.slice();
    out.push(line);
  });
  out.sort((a,b)=>a.t-b.t);
  if(pendingSec){ out.push({ t:(out.length?out[out.length-1].t:0)+0.01, text:"", sec:pendingSec, secOnly:true }); }
  return out;
}
function lsSave(){
  if(!state.ls) return;
  lsSyncTextInputs();
  const s=SONG_BY_ID[state.ls.songId]; if(!s){ toast("Song not found"); return; }
  const lines=lsBuildLyrics();
  if(!lines.length){ toast("Nothing to save","Add at least one lyric line"); return; }
  s.lyrics=lines;
  state.lyricEdits[s.id]=lines;
  try{ LS.set("treesh_lyric_edits", state.lyricEdits); }catch(e){}
  state.ls.dirty=false; const d=$("#ls-dirty"); if(d) d.classList.add("hidden");
  toast("Lyrics saved on this device", s.title);
  // if this song is the one playing, refresh Now Playing
  if(curSong() && curSong().id===s.id){ if(state.npOpen) renderNP(); }
}
function lsSyncTextInputs(){ if(!state.ls) return; $$("#ls-lines [data-ls-text]").forEach(inp=>{ const i=+inp.dataset.lsText; if(state.ls.items[i]) state.ls.items[i].text=inp.value; }); }

/* ---- export ---- */
function lsBuildLRC(){
  const items=state.ls.items||[]; const t=state.ls.title, a=state.ls.artist, al=state.ls.album;
  let out=""; if(t) out+="[ti:"+t+"]\n"; if(a) out+="[ar:"+a+"]\n"; if(al) out+="[al:"+al+"]\n"; out+="[by:Treesh Lyric Studio]\n\n";
  let pendingSec=null;
  items.forEach((it,idx)=>{
    if(it.type==='section'){ pendingSec=it.text; return; }
    const text=(it.text||'').trim(); if(!text) return;
    const t2=(it.t!=null)? it.t : 0;
    if(pendingSec){ out+="["+lsFmtLRC(Math.max(0,t2-0.01))+"]["+pendingSec+"]\n"; pendingSec=null; }
    out+="["+lsFmtLRC(t2)+"]"+text+"\n";
  });
  return out.trim();
}

function lsKeydown(e){

    if(ty) return true;
    if(e.code==="Space"){ e.preventDefault(); lswSetWord(); return true; }
    if(e.code==="Enter"){ e.preventDefault(); lsTogglePlay(); return true; }
    if(e.code==="ArrowRight"){ e.preventDefault(); lsSeekBy(2); return true; }
    if(e.code==="ArrowLeft"){ e.preventDefault(); lsSeekBy(-2); return true; }
    return true;
  }
  if($("#modal") && $("#modal").childElementCount>0) return false; // let modals handle keys
  const tag=(e.target.tagName||""); const typing=["INPUT","TEXTAREA","SELECT"].includes(tag)||e.target.isContentEditable;
  if(e.key==="Escape"){ e.preventDefault(); closeLS(); return true; }
  if(typing) return true; // don't hijack typing
  if(state.ls.mode!=='sync') return true;
  if(e.code==="Space"){ e.preventDefault(); lsStampCurrent(); return true; }
  if(e.code==="Enter"){ e.preventDefault(); lsTogglePlay(); return true; }
  if(e.code==="ArrowRight"){ e.preventDefault(); lsSeekBy(3); return true; }
  if(e.code==="ArrowLeft"){ e.preventDefault(); lsSeekBy(-3); return true; }
  if(e.code==="ArrowDown"){ e.preventDefault(); const n=lsNextLineRow(state.ls.idx); if(n>=0) lsSetActive(n); return true; }

  return true;
}

function lsParseLRC(text){
  const entries=[]; const meta={};
  (text||'').split(/\r?\n/).forEach(raw=>{ const line=raw; if(!line.trim()) return;
    const metaM=line.match(/^\s*\[(ti|ar|al|by|offset|length):([^\]]*)\]\s*$/i); if(metaM){ meta[metaM[1].toLowerCase()]=metaM[2].trim(); return; }
    const re=/\[(\d+):(\d+(?:[.:]\d+)?)\]/g; let m, last=0; const times=[]; while((m=re.exec(line))){ const mm=parseInt(m[1],10); const ss=parseFloat(String(m[2]).replace(':','.')); times.push(mm*60+ss); last=re.lastIndex; }
    if(!times.length) return; const content=line.slice(last).trim(); times.forEach(t=>entries.push({t, text:content})); });
  entries.sort((a,b)=>a.t-b.t);
  const items=entries.map(e=>{ if(/^\[[^\]]+\]$/.test(e.text)) return {type:'section', text:e.text.replace(/^\[|\]$/g,'')}; return {type:'line', t:+e.t, text:e.text, explain:'', words:null}; });
  return {items, meta};
}

function amSetGlow(c){ const el=document.getElementById('am-glow'); if(!el) return; if(!c){ el.style.opacity='0'; return; } el.style.background='radial-gradient(60% 100% at 50% 0%, rgba('+c[0]+','+c[1]+','+c[2]+',0.5), transparent 72%)'; el.style.opacity='1'; }
var _amQueue=null;
function amStartQueue(files){

    ${rows}
    <div class="flex items-center justify-between gap-2 pt-1">
      <button type="button" data-act="add-music-open" data-testid="am-queue-cancel" class="press inline-flex items-center gap-1.5 rounded-full border border-white/12 bg-white/5 px-4 py-2 text-sm font-semibold text-white/70 hover:bg-white/10"><i data-lucide="rotate-ccw" style="width:14px;height:14px"></i>Start over</button>

  </div>`;
  if(typeof icons==='function') icons();

function amSyncQueueFromDOM(){ if(!_amQueue) return; _amQueue.forEach(it=>{ const t=document.getElementById('q-title-'+it.qid); const a=document.getElementById('q-artist-'+it.qid); const g=document.getElementById('q-genre-'+it.qid); if(t) it.title=(t.value||'').trim(); if(a) it.artist=(a.value||'').trim(); if(g) it.genre=g.value||''; }); }
async function amSaveAll(){
  if(!_amQueue||!_amQueue.length){ toast("No tracks to save"); return; }
  amSyncQueueFromDOM();
  const items=_amQueue.slice();
  for(const it of items){ if(!it.title){ toast("Add a title for every track"); const el=document.getElementById('q-title-'+it.qid); if(el) el.focus(); return; } if(it.file.size>USER_MAX_BYTES){ toast('"'+it.title+'" is too large','Max 30 MB per track'); return; } }
  const btn=document.querySelector('[data-act="am-save-all"]'); if(btn){ btn.disabled=true; btn.classList.add('opacity-60'); btn.innerHTML='<i data-lucide="loader" style="width:16px;height:16px"></i> Saving\u2026'; icons(); }
  try{
    let n=0;
    for(const it of items){
      let duration=0; try{ duration=await probeAudioDuration(it.file); }catch(e){}
      const id='u-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)+'-'+n;
      const meta={ title:it.title, artist:it.artist||'You', album:'', genre:it.genre||'', featuring:'', writtenBy:'', producer:'', mixer:'', label:'', mood:'', videographer:'', creationDate:'', desc:'', explicit:false };
      await idbPut({ id, meta, audioBlob:it.file, audioType:it.file.type||'', coverBlob:null, coverType:'', duration, addedAt:Date.now()+n });
      n++;
    }
    await loadUserSongs();
    _amQueue=null;
    toast(n+" track"+(n!==1?"s":"")+" added");
    closeModal();
    state.genre="__mine"; state.query="";
    navigate('library');
  }catch(e){ console.error("save all failed",e); toast("Couldn\u2019t save all","Storage error"); if(btn){ btn.disabled=false; btn.classList.remove('opacity-60'); btn.innerHTML='<i data-lucide="check" style="width:16px;height:16px"></i> Save all ('+items.length+')'; icons(); } }
}
var _amPreviewAudio=null, _amPreviewURL=null;
function setPvIcon(playing){ const t=document.getElementById('am-pv-toggle'); if(!t) return; t.innerHTML='<i data-lucide="'+(playing?'pause':'play')+'" class="fill-current" style="width:16px;height:16px"></i>'; if(typeof icons==='function') icons(); }
function amDestroyPreview(){ if(_amPreviewAudio){ try{ _amPreviewAudio.pause(); }catch(e){} try{ _amPreviewAudio.src=''; }catch(e){} _amPreviewAudio=null; } if(_amPreviewURL){ try{ URL.revokeObjectURL(_amPreviewURL); }catch(e){} _amPreviewURL=null; } const wrap=document.getElementById('am-preview'); if(wrap){ wrap.classList.add('hidden'); wrap.innerHTML=''; } }
function amSetPreview(src, revoke, label){
  amDestroyPreview();
  const wrap=document.getElementById('am-preview'); if(!wrap || !src) return;
  if(revoke) _amPreviewURL=src;
  const a=new Audio(); a.preload='metadata'; a.src=src; _amPreviewAudio=a;
  wrap.classList.remove('hidden');
  wrap.innerHTML=`<div class="flex items-center gap-3 rounded-2xl border border-[color:var(--treesh-purple)]/25 bg-[color:var(--treesh-purple)]/[0.06] p-3" data-testid="am-preview-player">
    <button type="button" id="am-pv-toggle" data-testid="am-preview-toggle" aria-label="Play preview" class="press grid h-10 w-10 shrink-0 place-items-center rounded-full bg-[color:var(--treesh-purple)] text-white glow-purple"><i data-lucide="play" class="fill-current" style="width:16px;height:16px"></i></button>
    <div class="min-w-0 flex-1">
      <div class="mb-1 flex items-center justify-between gap-2 text-[11px] text-white/55"><span class="inline-flex min-w-0 items-center gap-1"><i data-lucide="headphones" style="width:11px;height:11px"></i><span class="clamp-1">${esc(label||'Preview')}</span></span><span class="font-doto shrink-0"><span id="am-pv-cur">0:00</span> / <span id="am-pv-dur">0:00</span></span></div>
      <input id="am-pv-seek" class="tr w-full" type="range" min="0" max="1000" step="1" value="0" style="--fill:0%" aria-label="Seek preview">
    </div>
  </div>`;
  if(typeof icons==='function') icons();
  const toggle=document.getElementById('am-pv-toggle'), seek=document.getElementById('am-pv-seek'), cur=document.getElementById('am-pv-cur'), dur=document.getElementById('am-pv-dur');
  a.addEventListener('loadedmetadata',()=>{ if(dur) dur.textContent=fmt(a.duration||0); });
  a.addEventListener('timeupdate',()=>{ if(!a.duration) return; const p=a.currentTime/a.duration; if(seek && !seek._drag){ seek.value=Math.round(p*1000); seek.style.setProperty('--fill',(p*100)+'%'); } if(cur) cur.textContent=fmt(a.currentTime); });
  a.addEventListener('ended',()=>{ setPvIcon(false); if(seek){ seek.value=0; seek.style.setProperty('--fill','0%'); } if(cur) cur.textContent='0:00'; });
  if(toggle) toggle.addEventListener('click',()=>{ if(a.paused){ try{ if(typeof audio!=='undefined') audio.pause(); }catch(e){} a.play().then(()=>setPvIcon(true)).catch(()=>{ toast("Can\u2019t preview this file"); }); } else { a.pause(); setPvIcon(false); } });
  if(seek){ seek.addEventListener('input',()=>{ seek._drag=true; seek.style.setProperty('--fill',(seek.value/10)+'%'); if(a.duration && cur) cur.textContent=fmt(seek.value/1000*a.duration); }); seek.addEventListener('change',()=>{ if(a.duration) a.currentTime=seek.value/1000*a.duration; seek._drag=false; }); }
}
function amSwitchTab(v){

async function saveCustomTrack(){

/* input handlers via delegation */

  else if(e.target.id==="np-seek"){ fillSlider(e.target); if(state.duration) seekTo(e.target.value/100*state.duration); }
  else if(e.target.id==="np-vol"){ fillSlider(e.target); setVolume(e.target.value/100); }

  else { const a=e.target.dataset&&e.target.dataset.act;
    if(a==="card-dim"){ state.studio.dim=+e.target.value; const l=document.querySelector('[data-fill-label="card-dim"]'); if(l) l.textContent=Math.round(state.studio.dim*100)+'%'; drawLyricCard(); }

  }

/* ---- Draggable / tappable scrubbers (mini player progress bar) ---- */
let _scrubbing=null;
function _scrubPct(el, clientX){ const r=el.getBoundingClientRect(); if(!r.width) return 0; return Math.max(0,Math.min(1,(clientX-r.left)/r.width)); }
function _scrubApply(el, p){ if(el.getAttribute("data-scrub")==="mini"){ const mp=document.getElementById("mini-prog"); if(mp) mp.style.width=(p*100)+"%"; } if(state.duration){ try{ audio.currentTime=p*state.duration; }catch(_){} state.currentTime=p*state.duration; } }
document.addEventListener("pointerdown", e=>{ const el=e.target&&e.target.closest&&e.target.closest("[data-scrub]"); if(!el) return; _scrubbing=el; try{ el.setPointerCapture(e.pointerId); }catch(_){} _scrubApply(el,_scrubPct(el,e.clientX)); e.preventDefault(); }, {passive:false});
document.addEventListener("pointermove", e=>{ if(!_scrubbing) return; _scrubApply(_scrubbing,_scrubPct(_scrubbing,e.clientX)); });
document.addEventListener("pointerup", e=>{ if(!_scrubbing) return; _scrubApply(_scrubbing,_scrubPct(_scrubbing,e.clientX)); _scrubbing=null; });
document.addEventListener("pointercancel", ()=>{ _scrubbing=null; });

/* ---- Hold the repeat button 3s to arm an A\u2013B loop (keeps the player uncluttered) ---- */
let _repeatHoldTimer=null, _repeatLongPressed=false, _repeatHoldEl=null, _repeatHoldXY=null;
function _cancelRepeatHold(){ clearTimeout(_repeatHoldTimer); _repeatHoldTimer=null; if(_repeatHoldEl){ _repeatHoldEl.classList.remove("ab-charging"); _repeatHoldEl=null; } _repeatHoldXY=null; }
document.addEventListener("pointerdown", e=>{ const rb=e.target&&e.target.closest&&e.target.closest("#np-repeat"); if(!rb) return; _repeatLongPressed=false; _repeatHoldEl=rb; _repeatHoldXY={x:e.clientX,y:e.clientY}; rb.classList.add("ab-charging"); clearTimeout(_repeatHoldTimer); _repeatHoldTimer=setTimeout(()=>{ _repeatLongPressed=true; if(_repeatHoldEl) _repeatHoldEl.classList.remove("ab-charging"); _repeatHoldEl=null; state.abA=state.currentTime||0; state.abB=null; if(navigator.vibrate){ try{navigator.vibrate(18);}catch(_){} } toast("Loop point A set","Tap repeat again to set point B"); renderNP(); }, 1500); });
document.addEventListener("pointermove", e=>{ if(!_repeatHoldEl||!_repeatHoldXY) return; const dx=e.clientX-_repeatHoldXY.x, dy=e.clientY-_repeatHoldXY.y; if(dx*dx+dy*dy>196) _cancelRepeatHold(); });
document.addEventListener("pointerup", _cancelRepeatHold);
document.addEventListener("pointercancel", _cancelRepeatHold);

/* keyboard shortcuts */
document.addEventListener("keydown", e=>{
  if(state.lsOpen){ if(lsKeydown(e)) return; }
  const tag=(e.target.tagName||""); if(["INPUT","TEXTAREA","SELECT"].includes(tag)||e.target.isContentEditable) return;
  if(e.key==="Escape"){ if($("#modal").innerHTML){ closeModal(); return; } if(state.searchOpen){ closeSearch(); return; } if(state.profileOpen){ closeProfile(); return; } if(state.queueOpen){ closeQueue(); return; } if(state.npOpen){ closeNP(); return; } }
  if(!curSong()) return;
  if(e.code==="Space"){ e.preventDefault(); togglePlay(); }
  else if(e.code==="ArrowRight"&&e.shiftKey) nextTrack(true);
  else if(e.code==="ArrowLeft"&&e.shiftKey) prevTrack();
  else if(e.code==="ArrowRight") seekTo(Math.min(audio.currentTime+5,state.duration));
  else if(e.code==="ArrowLeft") seekTo(Math.max(audio.currentTime-5,0));
});

/* ============================================================
   STARFIELD
   ============================================================ */
function starfield(){ const cv=$("#stars"); if(!cv) return; const ctx=cv.getContext("2d"); const dpr=Math.min(window.devicePixelRatio||1,2); let w,h,stars=[],shoot=null,mx=0,my=0,raf; const reduced=!!state.perfMode;
  function resize(){ w=cv.clientWidth; h=cv.clientHeight; cv.width=w*dpr; cv.height=h*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); const n=w<700?110:220; stars=Array.from({length:n},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.3+0.2,a:Math.random()*0.6+0.2,tw:Math.random()*0.02+0.004,dir:Math.random()>0.5?1:-1,purple:Math.random()>0.86,depth:Math.random()*0.6+0.2})); }
  function draw(){ ctx.clearRect(0,0,w,h); const g=ctx.createRadialGradient(w/2,h*0.35,0,w/2,h*0.35,Math.max(w,h)*0.8); g.addColorStop(0,"rgba(147,40,255,0.05)"); g.addColorStop(1,"rgba(0,0,0,0)"); ctx.fillStyle=g; ctx.fillRect(0,0,w,h); const ox=(mx-w/2)*0.006,oy=(my-h/2)*0.006; for(const s of stars){ if(!reduced){ s.a+=s.tw*s.dir; if(s.a>0.85)s.dir=-1; if(s.a<0.15)s.dir=1; } const px=s.x+ox*s.depth*12,py=s.y+oy*s.depth*12; ctx.beginPath(); ctx.arc(px,py,s.r,0,Math.PI*2); ctx.fillStyle=s.purple?`rgba(180,120,255,${s.a})`:(document.documentElement.classList.contains("theme-light")?`rgba(30,30,40,${s.a*0.8})`:`rgba(255,255,255,${s.a})`); ctx.fill(); }
    if(!reduced&&!shoot&&Math.random()<0.006) shoot={x:Math.random()*w*0.6,y:Math.random()*h*0.3,len:0,life:0}; if(shoot){ shoot.life++; shoot.len=Math.min(shoot.len+14,160); const sx=shoot.x+shoot.life*6,sy=shoot.y+shoot.life*3; const g2=ctx.createLinearGradient(sx-shoot.len,sy-shoot.len*0.5,sx,sy); g2.addColorStop(0,"rgba(255,255,255,0)"); g2.addColorStop(1,"rgba(255,255,255,0.7)"); ctx.strokeStyle=g2; ctx.lineWidth=1.4; ctx.beginPath(); ctx.moveTo(sx-shoot.len,sy-shoot.len*0.5); ctx.lineTo(sx,sy); ctx.stroke(); if(shoot.life>40||sx>w||sy>h) shoot=null; }
    raf=requestAnimationFrame(draw); }
  resize(); draw(); addEventListener("resize",resize); addEventListener("pointermove",e=>{mx=e.clientX;my=e.clientY;}); document.addEventListener("visibilitychange",()=>{ if(document.hidden) cancelAnimationFrame(raf); else raf=requestAnimationFrame(draw); }); }

  const sp=new URLSearchParams(location.search); const songId=sp.get("song"); if(songId&&SONG_BY_ID[songId]){ playSong(SONG_BY_ID[songId],SONGS); state.npOpen=true; renderNP(); history.replaceState(null,"",location.pathname+location.hash); }
  // onboarding for new users
  if(!state.profile){ onboard={step:0,nick:"",bday:"",avatar:""}; setTimeout(renderOnboarding,400); }
  initSleep();
  if(appLockActive()) openAppLock();

function iExportData(){ const p=state.instrum.project; try{ const data=JSON.stringify({type:"treesh-beat",v:1,project:p},null,2); const blob=new Blob([data],{type:"application/json"}); const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=(p.name||"beat").replace(/[^a-z0-9]+/gi,"_").replace(/^_|_$/g,"")+".json"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); toast("Project data exported",p.name); }catch(e){ toast("Export failed"); } }
