<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Treesh 3.0 — Music to Live For</title>
<meta name="description" content="Treesh 3.0 — stream the underground. Music to Live For." />
<meta name="theme-color" content="#0a0a0b" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Special+Gothic+Expanded+One&family=Doto:wght@100..900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    future: { hoverOnlyWhenSupported: true },
    theme: { extend: { fontFamily: {
      display: ['"Special Gothic Expanded One"', 'sans-serif'],
      sans: ['Manrope', 'system-ui', 'sans-serif'],
      doto: ['Doto', 'monospace'],
    } } }
  };
</script>
<style>
  :root{
    --treesh-bg-0:#0a0a0b; --treesh-bg-1:#121214;
    --treesh-purple:#9328ff; --treesh-purple-soft:rgba(147,40,255,0.22);
    --treesh-gold:var(--treesh-purple); --treesh-stroke:rgba(255,255,255,0.14);
    --treesh-shadow:0 18px 60px rgba(0,0,0,0.55);
    --treesh-glow-purple:0 0 0 1px rgba(147,40,255,0.28),0 0 28px rgba(147,40,255,0.24);
    --treesh-glow-gold:var(--treesh-glow-purple);
  }
  *{ -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; background:var(--app-bg); color:var(--app-text); font-family:var(--treesh-font,'Manrope',system-ui,sans-serif); -webkit-font-smoothing:antialiased; overscroll-behavior-y:none; transition:background-color .3s ease, color .3s ease; }
  .font-display{ font-family:'Special Gothic Expanded One','Manrope',sans-serif; }
  .font-doto{ font-family:'Doto','Manrope',monospace; }
  .glass{ background:rgba(255,255,255,0.06); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border:1px solid var(--treesh-stroke); }
  .glass-strong{ background:rgba(255,255,255,0.09); backdrop-filter:blur(28px); -webkit-backdrop-filter:blur(28px); border:1px solid var(--treesh-stroke); }
  .glow-purple{ box-shadow:var(--treesh-glow-purple); }
  .glow-gold{ box-shadow:var(--treesh-glow-gold); }
  .no-scrollbar::-webkit-scrollbar{ display:none; } .no-scrollbar{ -ms-overflow-style:none; scrollbar-width:none; }
  .soft-scroll::-webkit-scrollbar{ width:8px;height:8px; } .soft-scroll::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.14); border-radius:999px; } .soft-scroll::-webkit-scrollbar-track{ background:transparent; }
  .clamp-1{ display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden; }
  .clamp-2{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  ::selection{ background:var(--treesh-purple-soft); color:#fff; }

  /* range sliders */
  input[type=range].tr{ -webkit-appearance:none; appearance:none; height:6px; border-radius:999px; background:linear-gradient(to right, var(--treesh-purple) var(--fill,0%), rgba(255,255,255,0.16) var(--fill,0%)); outline:none; cursor:pointer; width:100%; }
  input[type=range].tr::-webkit-slider-runnable-track{ -webkit-appearance:none; appearance:none; height:6px; border-radius:999px; background:transparent; border:none; }
  input[type=range].tr::-webkit-slider-thumb{ -webkit-appearance:none; appearance:none; margin-top:-4px; width:14px; height:14px; border-radius:50%; background:#fff; box-shadow:0 0 10px var(--treesh-purple); border:none; }
  input[type=range].tr::-moz-range-track{ height:6px; border-radius:999px; background:transparent; border:none; }
  input[type=range].tr::-moz-range-thumb{ width:14px; height:14px; border:none; border-radius:50%; background:#fff; box-shadow:0 0 10px var(--treesh-purple); }
  input[type=range].tr:focus,input[type=range].tr:hover,input[type=range].tr:active{ outline:none; box-shadow:none; background:linear-gradient(to right, var(--treesh-purple) var(--fill,0%), rgba(255,255,255,0.16) var(--fill,0%)); }
  input[type=range].tr:focus::-webkit-slider-runnable-track,input[type=range].tr:active::-webkit-slider-runnable-track,input[type=range].tr:hover::-webkit-slider-runnable-track{ background:transparent; }
  @property --ab-charge{ syntax:'<angle>'; inherits:false; initial-value:0deg; }
  .ab-charging{ position:relative; }
  .ab-charging::after{ content:""; position:absolute; inset:-4px; border-radius:9999px; pointer-events:none; background:conic-gradient(var(--treesh-purple) var(--ab-charge,0deg), rgba(255,255,255,0.14) 0deg); -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px)); mask:radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px)); animation:abCharge 1.5s linear forwards; }
  @keyframes abCharge{ from{ --ab-charge:0deg; } to{ --ab-charge:360deg; } }
  input[type=range].tr:focus-visible{ outline:none; }

  /* vinyl */
  .vinyl{ border-radius:50%; position:relative;
    background:repeating-radial-gradient(circle at center,rgba(255,255,255,0.045) 0px,rgba(255,255,255,0.045) 1px,rgba(0,0,0,0) 2px,rgba(0,0,0,0) 4px),radial-gradient(circle at 50% 50%,#1c1c20 0%,#0c0c0e 62%,#050506 100%);
    box-shadow:0 30px 80px rgba(0,0,0,0.6),inset 0 0 60px rgba(0,0,0,0.8); }
  .vinyl::after{ content:""; position:absolute; inset:8%; border-radius:50%; background:repeating-radial-gradient(circle at center,rgba(255,255,255,0.03) 0px,rgba(255,255,255,0.03) 1px,transparent 2px,transparent 5px); }
  .vinyl-label{ position:absolute; inset:33%; border-radius:50%; overflow:hidden; box-shadow:0 0 0 4px rgba(0,0,0,0.55),0 0 0 6px var(--treesh-purple-soft); background:#111; }
  .vinyl-hole{ position:absolute; top:50%; left:50%; width:10px; height:10px; border-radius:50%; background:#050506; transform:translate(-50%,-50%); box-shadow:0 0 0 2px rgba(255,255,255,0.15); z-index:3; }
  .spin{ animation:tspin 6s linear infinite; } .spin-paused{ animation-play-state:paused; }
  @keyframes tspin{ from{transform:rotate(0)} to{transform:rotate(360deg)} }

  /* equalizer */
  .eq{ display:inline-flex; align-items:flex-end; gap:2px; height:14px; }
  .eq span{ display:block; width:3px; height:100%; background:var(--treesh-purple); border-radius:2px; transform-origin:bottom; animation:teq .9s ease-in-out infinite; }
  .eq span:nth-child(2){ animation-delay:.15s } .eq span:nth-child(3){ animation-delay:.3s } .eq span:nth-child(4){ animation-delay:.45s }
  @keyframes teq{ 0%,100%{transform:scaleY(.3)} 50%{transform:scaleY(1)} }

  .shimmer{ background:linear-gradient(100deg,#fff 20%,var(--treesh-gold) 40%,#fff 60%); background-size:200% auto; -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; animation:tshim 6s linear infinite; }
  @keyframes tshim{ 0%{background-position:0% 50%} 100%{background-position:200% 50%} }

  .voice-pulse::before,.voice-pulse::after{ content:""; position:absolute; inset:0; border-radius:50%; border:2px solid var(--treesh-purple); animation:tping 1.6s cubic-bezier(0,0,0.2,1) infinite; }
  .voice-pulse::after{ animation-delay:.8s; }
  @keyframes tping{ 0%{transform:scale(1);opacity:.7} 100%{transform:scale(2.2);opacity:0} }
  /* voice assistant waveform + typing dots */
  .voice-wave{ display:flex; align-items:center; justify-content:center; gap:5px; height:38px; }
  .voice-wave span{ display:block; width:4px; height:100%; border-radius:999px; background:var(--treesh-purple); transform-origin:center; animation:vwave 1.05s ease-in-out infinite; }
  .voice-wave span:nth-child(1){animation-delay:-.9s} .voice-wave span:nth-child(2){animation-delay:-.7s} .voice-wave span:nth-child(3){animation-delay:-.5s} .voice-wave span:nth-child(4){animation-delay:-.3s} .voice-wave span:nth-child(5){animation-delay:-.15s} .voice-wave span:nth-child(6){animation-delay:-.45s} .voice-wave span:nth-child(7){animation-delay:-.65s}
  @keyframes vwave{ 0%,100%{transform:scaleY(.22)} 50%{transform:scaleY(1)} }
  .voice-dots span{ display:inline-block; animation:vdots 1.4s infinite; } .voice-dots span:nth-child(2){ animation-delay:.2s } .voice-dots span:nth-child(3){ animation-delay:.4s }
  @keyframes vdots{ 0%,60%,100%{opacity:.25} 30%{opacity:1} }

  /* ---------- motion system ---------- */
  .fade-in{ animation:tfade .34s cubic-bezier(.22,1,.36,1) both; } @keyframes tfade{ from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }
  .np-line{ transition:color .3s ease, transform .35s cubic-bezier(.22,1,.36,1), text-shadow .3s ease; }

  /* page / view navigation */
  .view-in{ animation:viewIn .42s cubic-bezier(.22,1,.36,1) both; } @keyframes viewIn{ from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:none} }
  /* scroll-reveal + staggered entrance */
  @keyframes trRevealUp{ from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:none} }
  .reveal-stagger{ animation:trRevealUp .5s cubic-bezier(.22,1,.36,1) both; }
  .io-reveal{ opacity:0; transform:translateY(18px); }
  .io-reveal.io-in{ opacity:1; transform:none; transition:opacity .6s cubic-bezier(.22,1,.36,1), transform .6s cubic-bezier(.22,1,.36,1); }
  html.perf-mode .reveal-stagger{ animation:none !important } html.perf-mode .io-reveal{ opacity:1 !important; transform:none !important }

  /* now-playing sheet */
  @keyframes npUp{ from{opacity:0;transform:translateY(7%)} to{opacity:1;transform:none} }
  @keyframes npDown{ from{opacity:1;transform:none} to{opacity:0;transform:translateY(9%)} }
  .np-entering{ animation:npUp .46s cubic-bezier(.22,1,.36,1) both; }
  .np-leaving{ animation:npDown .34s cubic-bezier(.4,0,1,.6) both; }
  @keyframes npContent{ from{opacity:0;transform:translateY(12px) scale(.99)} to{opacity:1;transform:none} }
  .np-content-in{ animation:npContent .38s cubic-bezier(.22,1,.36,1) both; }

  /* modal / popup */
  @keyframes backdropIn{ from{opacity:0} to{opacity:1} }
  @keyframes backdropOut{ from{opacity:1} to{opacity:0} }
  @keyframes panelIn{ from{opacity:0;transform:translateY(16px) scale(.95)} to{opacity:1;transform:none} }
  @keyframes panelOut{ from{opacity:1;transform:none} to{opacity:0;transform:translateY(10px) scale(.97)} }
  .backdrop-in{ animation:backdropIn .26s ease both; }
  .backdrop-out{ animation:backdropOut .2s ease both; }
  .panel-in{ animation:panelIn .4s cubic-bezier(.22,1,.36,1) both; }
  .panel-out{ animation:panelOut .2s cubic-bezier(.4,0,1,.6) both; }
  @keyframes obStep{ from{opacity:0;transform:translateX(22px)} to{opacity:1;transform:none} }
  .ob-step-in{ animation:obStep .34s cubic-bezier(.22,1,.36,1) both; }

  /* queue drawer */
  @keyframes drawerIn{ from{transform:translateX(100%)} to{transform:translateX(0)} }
  @keyframes drawerOut{ from{transform:translateX(0)} to{transform:translateX(100%)} }
  .drawer-in{ animation:drawerIn .42s cubic-bezier(.22,1,.36,1) both; }
  .drawer-out{ animation:drawerOut .3s cubic-bezier(.4,0,1,.6) both; }

  /* mini player */
  @keyframes miniUp{ from{opacity:0;transform:translateY(130%)} to{opacity:1;transform:none} }
  .mini-in{ animation:miniUp .5s cubic-bezier(.22,1,.36,1) both; }

  /* toast */
  @keyframes toastIn{ from{opacity:0;transform:translateY(-16px) scale(.95)} to{opacity:1;transform:none} }
  @keyframes toastOut{ from{opacity:1;transform:none} to{opacity:0;transform:translateY(-10px) scale(.98)} }
  .toast-in{ animation:toastIn .34s cubic-bezier(.22,1,.36,1) both; }
  .toast-out{ animation:toastOut .28s ease both; }

  /* micro interactions */
  .card-lift{ transition:transform .24s cubic-bezier(.22,1,.36,1), box-shadow .24s ease, border-color .24s ease; will-change:transform; }
  @media (hover:hover){ .card-lift:hover{ transform:translateY(-5px); } }
  .press{ transition:transform .13s ease; } .press:active{ transform:scale(.93); }

  /* what's new carousel */
  .wn-img{ transform:scale(1.05); }
  .wn-slide.wn-active .wn-img{ animation:wnZoom 7.5s ease-out both; }
  @keyframes wnZoom{ from{ transform:scale(1.05) } to{ transform:scale(1.16) } }

  /* ---------- like / favorite hearts (reliable, no JIT dependency) ---------- */
  .tr-like svg,.tr-favline svg{ transition:transform .2s cubic-bezier(.34,1.56,.64,1),fill .18s ease,color .18s ease; }
  .tr-like.is-liked svg,.tr-favline.is-liked svg{ fill:var(--treesh-purple); color:var(--treesh-purple); filter:drop-shadow(0 0 5px var(--treesh-purple-soft)); }
  .tr-like.is-liked{ color:var(--treesh-purple); }
  .tr-dislike svg{ transition:transform .2s cubic-bezier(.34,1.56,.64,1),color .18s ease; }
  .tr-dislike.is-disliked svg{ color:var(--treesh-purple); filter:drop-shadow(0 0 5px var(--treesh-purple-soft)); }
  .tr-dislike.is-disliked{ color:var(--treesh-purple); }
  @keyframes dislikeShake{ 0%{transform:rotate(0)} 20%{transform:rotate(-14deg)} 40%{transform:rotate(11deg)} 60%{transform:rotate(-7deg)} 80%{transform:rotate(4deg)} 100%{transform:rotate(0)} }
  .dislike-shake{ animation:dislikeShake .45s ease; }
  @keyframes heartPop{ 0%{transform:scale(1)} 25%{transform:scale(1.55)} 45%{transform:scale(.82)} 70%{transform:scale(1.14)} 100%{transform:scale(1)} }
  .heart-pop{ animation:heartPop .5s cubic-bezier(.34,1.56,.64,1); }
  @keyframes heartUnpop{ 0%{transform:scale(1)} 40%{transform:scale(.68)} 100%{transform:scale(1)} }
  .heart-unpop{ animation:heartUnpop .34s ease; }

  /* floating heart burst particles */
  #fx-layer{ position:fixed; inset:0; z-index:200; pointer-events:none; overflow:hidden; }
  .fx-heart{ position:fixed; will-change:transform,opacity; pointer-events:none; animation:fxFloat var(--dur,900ms) cubic-bezier(.22,1,.36,1) forwards; }
  .fx-heart svg{ display:block; width:var(--size,16px); height:var(--size,16px); }
  @keyframes fxFloat{
    0%{ transform:translate(-50%,-50%) scale(.2) rotate(0deg); opacity:0; }
    18%{ opacity:1; transform:translate(-50%,-50%) scale(1) rotate(calc(var(--rot)*.3)); }
    100%{ transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(var(--end,.55)) rotate(var(--rot)); opacity:0; }
  }
  .fx-ring{ position:fixed; width:16px; height:16px; border-radius:999px; border:2px solid var(--treesh-purple); pointer-events:none; animation:fxRing .58s cubic-bezier(.22,1,.36,1) forwards; }
  @keyframes fxRing{ from{ transform:translate(-50%,-50%) scale(.4); opacity:.65; } to{ transform:translate(-50%,-50%) scale(3.8); opacity:0; } }

  /* ---------- like = one big heart floating up like a balloon ---------- */
  .fx-balloon{ position:fixed; z-index:200; pointer-events:none; animation:fxBalloonUp 1.5s cubic-bezier(.22,1,.36,1) forwards; }
  .fx-balloon-inner{ display:block; animation:fxSway 1.5s ease-in-out both; }
  .fx-balloon svg{ display:block; width:66px; height:66px; filter:drop-shadow(0 10px 26px var(--treesh-purple-soft)); }
  @keyframes fxBalloonUp{ 0%{ transform:translate(-50%,-50%) scale(.35); opacity:0; } 15%{ opacity:1; transform:translate(-50%,-66%) scale(1.1); } 78%{ opacity:1; } 100%{ transform:translate(calc(-50% + var(--sway,0px)),-370px) scale(.82); opacity:0; } }
  @keyframes fxSway{ 0%{transform:translateX(0)} 22%{transform:translateX(-14px)} 48%{transform:translateX(12px)} 72%{transform:translateX(-8px)} 100%{transform:translateX(4px)} }
  /* ---------- dislike = broken heart ---------- */
  .fx-crack{ position:fixed; z-index:200; pointer-events:none; animation:fxCrack 1s cubic-bezier(.22,1,.36,1) forwards; }
  .fx-crack svg{ display:block; width:60px; height:60px; filter:drop-shadow(0 8px 20px var(--treesh-purple-soft)); }
  @keyframes fxCrack{ 0%{ transform:translate(-50%,-50%) scale(.4) rotate(0); opacity:0; } 16%{ opacity:1; transform:translate(-50%,-56%) scale(1.16) rotate(-5deg); } 28%{ transform:translate(-50%,-56%) scale(1.06) rotate(6deg); } 40%{ transform:translate(-50%,-54%) scale(1.06) rotate(-4deg); } 60%{ transform:translate(-50%,-48%) scale(1) rotate(3deg); } 100%{ transform:translate(-50%,16%) scale(.78) rotate(9deg); opacity:0; } }
  .fx-frag{ position:fixed; z-index:200; pointer-events:none; }
  .fx-frag svg{ display:block; width:22px; height:22px; }
  .fx-frag-l{ animation:fxFragL .82s cubic-bezier(.22,1,.36,1) forwards; }
  .fx-frag-r{ animation:fxFragR .82s cubic-bezier(.22,1,.36,1) forwards; }
  @keyframes fxFragL{ 0%{transform:translate(-50%,-50%) scale(.6); opacity:0} 20%{opacity:.9} 100%{transform:translate(calc(-50% - 48px),22px) scale(.65) rotate(-42deg); opacity:0} }
  @keyframes fxFragR{ 0%{transform:translate(-50%,-50%) scale(.6); opacity:0} 20%{opacity:.9} 100%{transform:translate(calc(-50% + 48px),22px) scale(.65) rotate(42deg); opacity:0} }
  html.perf-mode .fx-balloon, html.perf-mode .fx-crack, html.perf-mode .fx-frag{ display:none !important; }

  /* ---------- profile module (grows from top-right avatar) ---------- */
  #profile-panel{ transform-origin:calc(100% - 22px) 22px; }
  @keyframes profileIn{ 0%{ opacity:0; transform:scale(.16) translate3d(0,-6px,0); } 55%{ opacity:1; } 100%{ opacity:1; transform:scale(1) translate3d(0,0,0); } }
  @keyframes profileOut{ 0%{ opacity:1; transform:scale(1) translate3d(0,0,0); } 100%{ opacity:0; transform:scale(.16) translate3d(0,-6px,0); } }
  .profile-in{ animation:profileIn .44s cubic-bezier(.22,1,.36,1) both; }
  .profile-out{ animation:profileOut .26s cubic-bezier(.4,0,1,.6) both; }
  @keyframes pfContent{ from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none} }
  .pf-content-in{ animation:pfContent .28s ease .12s both; }
  @media (min-width:640px){ #profile-panel{ transform-origin:calc(100% - 8px) -12px; } }

  /* touch devices: never leave a sticky hover/tap background on controls */
  button:focus{ outline:none; }
  @media (pointer: coarse){
    .hover\:bg-white\/10:hover,.hover\:bg-white\/15:hover,.hover\:bg-white\/5:hover,.hover\:bg-white\/\[0\.07\]:hover{ background-color:transparent !important; }
  }

  html.perf-mode .fx-heart, html.perf-mode .fx-ring{ display:none !important }
  html.perf-mode .card-lift:hover{ transform:none !important }
  html.perf-mode #wn-track{ transition:none !important }

  /* ---------- extended tokens + utilities (phase additions) ---------- */
  :root{
    --treesh-ease:cubic-bezier(.22,1,.36,1);
    --treesh-dur-1:140ms; --treesh-dur-2:220ms; --treesh-dur-3:420ms;
    --treesh-stroke-faint:rgba(255,255,255,0.10);
    --treesh-focus:0 0 0 1px rgba(255,255,255,0.10),0 0 0 4px var(--treesh-purple-soft);
  }
  /* iOS: prevent input auto-zoom + viewport shift (font >=16px on small screens) */
  @media (max-width:640px){ input:not([type=range]),textarea,select{ font-size:16px !important; } }
  body.tr-locked{ overflow:hidden; }

  /* --- Global UX protections: no accidental zoom, no text selection (except editable), no image drag --- */
  html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  body{ touch-action:manipulation; overscroll-behavior:none; }
  *{ -webkit-user-select:none; -moz-user-select:none; user-select:none; -webkit-touch-callout:none; }
  input, textarea, select, [contenteditable="true"], [contenteditable=""], .selectable, .selectable *{ -webkit-user-select:text; -moz-user-select:text; user-select:text; -webkit-touch-callout:default; }
  img{ -webkit-user-drag:none; user-drag:none; -webkit-touch-callout:none; }


  /* reusable panel + overlay motion */
  @keyframes trPanelIn{ from{opacity:0;transform:translateY(10px) scale(.98)} to{opacity:1;transform:none} }
  @keyframes trPanelOut{ from{opacity:1;transform:none} to{opacity:0;transform:translateY(10px) scale(.98)} }
  .tr-panel-in{ animation:trPanelIn var(--treesh-dur-3) var(--treesh-ease) both; }
  .tr-panel-out{ animation:trPanelOut var(--treesh-dur-2) var(--treesh-ease) both; }
  @keyframes trDockUp{ from{opacity:0;transform:translateY(26px)} to{opacity:1;transform:none} }
  .tr-dock-in{ animation:trDockUp var(--treesh-dur-3) var(--treesh-ease) both; }
  @keyframes trFadeIn{ from{opacity:0} to{opacity:1} }
  .tr-fade-in{ animation:trFadeIn var(--treesh-dur-2) ease both; }
  @keyframes trFadeOut{ from{opacity:1} to{opacity:0} }
  .tr-fade-out{ animation:trFadeOut var(--treesh-dur-2) ease both; }
  @keyframes trSearchIn{ from{opacity:0;transform:scale(1.015)} to{opacity:1;transform:none} }
  .search-enter{ }
  @keyframes trBackdropIn{ from{opacity:0} to{opacity:1} }
  @keyframes trContentIn{ from{opacity:0;transform:translateY(10px) scale(0.995)} to{opacity:1;transform:none} }
  .search-enter .search-backdrop{ animation:trBackdropIn 190ms ease both; }
  .search-enter .search-content{ animation:trContentIn 300ms 95ms cubic-bezier(0.22,1,0.36,1) both; }
  @keyframes trSearchOut{ from{opacity:1} to{opacity:0} }
  .search-exit{ animation:trSearchOut 180ms ease both; }

  /* karaoke per-letter fill */
  @keyframes trLineSwap{ 0%{opacity:0;transform:translateY(16px) scale(.97)} 100%{opacity:1;transform:none} }
  .kar-line-in{ animation:trLineSwap .40s var(--treesh-ease) both; }
  .kar-ch{ --cp:0; background-image:linear-gradient(90deg,var(--treesh-purple),var(--treesh-purple) calc(var(--cp)*100%),rgba(255,255,255,0.26) calc(var(--cp)*100%),rgba(255,255,255,0.26)); -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent; will-change:background-image; }
  .kar-ch.lit{ filter:drop-shadow(0 0 15px var(--treesh-purple-soft)); }

  /* ---------- Instrum studio ---------- */
  .instrum-cell{ position:relative; border-radius:6px; background:rgba(255,255,255,0.045); border:1px solid rgba(255,255,255,0.06); transition:transform .1s var(--treesh-ease), background .1s ease, box-shadow .1s ease; }
  .instrum-cell:hover{ background:rgba(255,255,255,0.1); }

  .instrum-cell.beat4{ margin-left:6px; }

  .studio-panel{ background:rgba(14,14,17,0.72); border:1px solid rgba(255,255,255,0.08); border-radius:20px; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }

  /* beautiful control buttons */
  .i-btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; border-radius:12px; border:1px solid rgba(255,255,255,0.1); background:rgba(255,255,255,0.05); color:rgba(255,255,255,0.85); transition:background .16s var(--treesh-ease), border-color .16s var(--treesh-ease), transform .1s var(--treesh-ease); -webkit-tap-highlight-color:transparent; }
  .i-btn:hover{ background:rgba(255,255,255,0.1); }
  .i-btn:active{ transform:scale(.94); }
  .i-btn:disabled{ opacity:.35; pointer-events:none; }
  .i-btn.on{ background:var(--treesh-purple); border-color:transparent; color:#fff; box-shadow:0 0 0 1px var(--treesh-purple-soft), 0 6px 18px var(--treesh-purple-soft); }

  html.theme-light .i-btn:hover{ background:rgba(0,0,0,0.08); }
  /* LCD tempo readout */
  .i-lcd{ font-variant-numeric:tabular-nums; letter-spacing:.02em; color:var(--treesh-purple); text-shadow:0 0 14px var(--treesh-purple-soft); }
  .i-slider{ -webkit-appearance:none; appearance:none; height:4px; border-radius:999px; background:rgba(255,255,255,0.18); outline:none; }
  .i-slider::-webkit-slider-thumb{ -webkit-appearance:none; appearance:none; width:14px; height:14px; border-radius:50%; background:var(--treesh-purple); box-shadow:0 0 8px var(--treesh-purple-soft); cursor:pointer; }
  .i-slider::-moz-range-thumb{ width:14px; height:14px; border:0; border-radius:50%; background:var(--treesh-purple); cursor:pointer; }

  .i-meter{ position:relative; height:4px; border-radius:999px; background:rgba(255,255,255,0.14); overflow:hidden; }
  .i-meter > i{ position:absolute; inset:0 auto 0 0; width:var(--lvl,60%); background:linear-gradient(90deg,var(--treesh-purple),#fff); opacity:.85; }

<script>
/* ============================================================
   TREESH 3.0 — single-file build. Data embedded below.
   User data (favorites, playlists, profile, theme) -> localStorage.
   Audio + cover art stream from external hosts (free, CORS-enabled).
   ============================================================ */
/* ---------- utils ---------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const icons = () => { try { if (window.lucide) lucide.createIcons(); } catch(e){} };
const esc = (s) => String(s==null?"":s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const slug = (t) => (t||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"") || Math.random().toString(36).slice(2,8);
const VOICE_OK = (typeof window!=='undefined') && !!(window.SpeechRecognition||window.webkitSpeechRecognition);
const FALLBACK = "data:image/svg+xml;utf8," + encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><rect width='100%' height='100%' fill='#161618'/><text x='50%' y='53%' font-size='120' text-anchor='middle' fill='#3a3a40' font-family='sans-serif'>\u266A</text></svg>");
const img = (src, cls, extra="") => `<img src="${esc(src||FALLBACK)}" loading="lazy" onerror="this.src='${FALLBACK}'" class="${cls}" ${extra}>`;
function fmt(sec){ if(!sec||isNaN(sec)||sec===Infinity) return "0:00"; const m=Math.floor(sec/60),s=Math.floor(sec%60); return m+":"+(s<10?"0":"")+s; }
function zodiac(b){ if(!b) return ""; const p=String(b).split("-"); if(p.length<3) return ""; const mo=+p[1],d=+p[2]; if(!mo||!d) return ""; const z=[["Capricorn",1,19],["Aquarius",2,18],["Pisces",3,20],["Aries",4,19],["Taurus",5,20],["Gemini",6,20],["Cancer",7,22],["Leo",8,22],["Virgo",9,22],["Libra",10,22],["Scorpio",11,21],["Sagittarius",12,21],["Capricorn",12,31]]; for(const[s,m,dd]of z){ if(mo===m&&d<=dd) return s; } return "Capricorn"; }
/* ---- age gate / parental controls ---- */
function ageFromDate(b){ if(!b) return null; const p=String(b).split("-"); if(p.length<3) return null; const y=+p[0],mo=+p[1],d=+p[2]; if(!y||!mo||!d) return null; const now=new Date(); let a=now.getFullYear()-y; const md=(now.getMonth()+1)*100+now.getDate(); if(md<(mo*100+d)) a--; return a; }
function userAge(){ const a=ageFromDate(state.profile&&state.profile.birthday); return (a!=null&&a>=0&&a<130)?a:null; }
function isUnderage(){ const a=userAge(); return a!==null && a<18; }
function explicitOK(){ return !isUnderage() || !!state.explicitUnlocked; }
function vis(list){ if(explicitOK()) return list; return (list||[]).filter(s=> s && !s.explicit); }
function bdayEditCount(){ return (state.bdayEdits!=null)?state.bdayEdits:((state.profile&&state.profile.birthday)?1:0); }
function bdayLocked(){ return bdayEditCount()>=2; }
function bumpBdayEdits(){ state.bdayEdits=bdayEditCount()+1; LS.set("treesh_bday_edits",state.bdayEdits); }

/* ============================================================
   LIVE CATALOG LOADER
   Data is fetched at runtime from same-origin content pages
   (/content/songs, /content/icons, /content/lyrics), parsed from
   HTML, normalized, and cached to localStorage. This keeps the app
   in sync with the live Treesh catalog with zero backend.
   ============================================================ */
let SONGS = [], ARTISTS = [], GENRES = [], SONG_BY_ID = {}, ARTIST_BY_ID = {}, ARTIST_SONG_IDS = {};

const CONTENT_SOURCES = {
  songs:  ["content/songs",  "/content/songs",  "https://treesh.app/content/songs"],
  icons:  ["content/icons",  "/content/icons",  "https://treesh.app/content/icons"],
  lyrics: ["content/lyrics", "/content/lyrics", "https://treesh.app/content/lyrics"],
};
const CATALOG_KEY = "treesh_catalog_v3";

async function fetchFirst(urls){
  let lastErr;
  for(const u of urls){
    try{
      const ctrl = new AbortController(); const to = setTimeout(()=>ctrl.abort(), 15000);
      const r = await fetch(u, { cache:"no-store", signal: ctrl.signal }); clearTimeout(to);
      if(r.ok){ const t = await r.text(); if(t && t.trim().length > 40) return t; }
    }catch(e){ lastErr = e; }
  }
  throw lastErr || new Error("Unable to load "+urls[0]);
}
const parseDoc = (str) => new DOMParser().parseFromString(str, "text/html");
const attr = (el, name) => (el.getAttribute(name) || "").trim();
const normKey = (s) => String(s==null?"":s).toLowerCase().replace(/[\u2018\u2019\u201c\u201d]/g,"'").replace(/[^a-z0-9]+/g,"");

function parseSongs(doc){
  const used = new Set(), out = [];
  doc.querySelectorAll("ul.song").forEach((el, i) => {
    const title = attr(el,"data-track"), audioUrl = attr(el,"data-mp3");
    if(!title || !audioUrl) return; // skip template/empty rows
    const artist = attr(el,"data-artist"), aid = attr(el,"data-artist-id");
    let id = slug(artist + "-" + title) || ("track-" + i);
    while(used.has(id)) id = id + "-" + i;
    used.add(id);
    out.push({
      id, title, artist, artistIds: aid ? aid.split(",").map(x => x.trim()).filter(Boolean) : [],
      genre: attr(el,"data-genre"), mood: attr(el,"data-mood"),
      creationDate: attr(el,"data-creation-date"), writtenBy: attr(el,"data-written-by"),
      producer: attr(el,"data-producer"), mixer: attr(el,"data-mixer"),
      videographer: attr(el,"data-videographer"), featuring: attr(el,"data-featuring"),
      album: attr(el,"data-album"), label: attr(el,"data-label"),
      coverArt: attr(el,"data-coverart"), audioUrl, videoId: attr(el,"data-video"),
      bio: attr(el,"data-bio"), desc: attr(el,"data-desc"),
      explicit: el.hasAttribute("data-explicit"),
      treeshChoice: el.hasAttribute("data-treeshChoice") || el.hasAttribute("data-exclusive"),
      exclusive: el.hasAttribute("data-exclusive"),
      lyrics: [],
    });
  });
  return out;
}

function parseArtists(doc){
  const out = [];
  doc.querySelectorAll("article.artist").forEach(el => {
    const id = attr(el,"data-artist-id"); if(!id) return;
    const imgEl = el.querySelector("img.artist__image") || el.querySelector("img");
    const roleEl = el.querySelector(".artist__label .capital");
    const bg = attr(el,"data-bg");
    out.push({
      id, name: attr(el,"data-name"), bio: attr(el,"data-bio"),
      background: bg, bgPos: attr(el,"data-bg-pos") || "center",
      cashapp: attr(el,"data-cashapp"),
      role: roleEl ? roleEl.textContent.trim() : "Music Artist",
      image: (imgEl && imgEl.getAttribute("src")) || bg,
    });
  });
  return out;
}

function parseTimecode(str){
  if(!str) return 0;
  const parts = String(str).split(":").map(x => parseFloat(x));
  if(parts.some(isNaN)) return 0;
  if(parts.length === 3) return parts[0]*3600 + parts[1]*60 + parts[2];
  if(parts.length === 2) return parts[0]*60 + parts[1];
  return parts[0] || 0;
}
function parseLyrics(doc){
  const byKey = {}, byTitle = {};
  doc.querySelectorAll("div.lyric").forEach(el => {
    const track = attr(el,"data-track"), artist = attr(el,"data-artist");
    const lines = [];
    let curSec = null;
    el.querySelectorAll("p").forEach(p => {
      const text = p.textContent.trim(); if(!text) return;
      const dm = p.getAttribute("data-minutes"), ds = p.getAttribute("data-seconds");
      const hasM = dm!=null && dm.trim()!=="";
      const hasS = ds!=null && ds.trim()!=="";
      const hm = text.match(/^\[(.+)\]$/);
      if(hm){
        const inside = hm[1].trim();
        // section marker (e.g. "Verse 1: Artist"); skip pure repeat/adlib markers like "x2"
        if(/[a-zA-Z]/.test(inside) && !/^x\s*\d+$/i.test(inside)) curSec = inside;
        return; // bracket lines are markers, not sung lyric lines
      }
      const t = hasM ? (dm.includes(":") ? parseTimecode(dm) : (parseFloat(dm)||0)) : (hasS ? (parseFloat(ds)||0) : null);
      if(t==null) return; // skip untimed, non-header text
      const explain = (p.getAttribute("data-explain")||"").trim();
      lines.push({ t, text, sec: curSec, explain });
    });
    if(!lines.length) return;
    lines.sort((a,b) => a.t - b.t);
    byKey[normKey(track) + "|" + normKey(artist)] = lines;
    if(!byTitle[normKey(track)]) byTitle[normKey(track)] = lines;
  });
  return { byKey, byTitle };
}
function attachLyrics(songs, lyr){
  songs.forEach(s => { s.lyrics = lyr.byKey[normKey(s.title)+"|"+normKey(s.artist)] || lyr.byTitle[normKey(s.title)] || []; });
}
function indexCatalog(){
  SONG_BY_ID = Object.fromEntries(SONGS.map(s => [s.id, s]));
  ARTIST_BY_ID = Object.fromEntries(ARTISTS.map(a => [a.id, a]));
  GENRES = [...new Set(SONGS.map(s => s.genre).filter(Boolean))].sort();
  applyLyricEdits();
  buildArtistSongIndex();
}
/* Map each artist id -> set of song ids they perform on. Includes the primary
   artist, name/featuring matches, AND lyric-section performers so members of a
   group (e.g. Zuubandz in a PerfekTenz track) get credit on their own profile. */
function buildArtistSongIndex(){
  ARTIST_SONG_IDS = {};
  const byName = {}; ARTISTS.forEach(a => { byName[normKey(a.name)] = a.id; });
  const add = (id, sid) => { if(!id) return; (ARTIST_SONG_IDS[id] || (ARTIST_SONG_IDS[id] = new Set())).add(sid); };
  const secCache = {};
  const psec = (sec) => { if(sec==null) return null; if(sec in secCache) return secCache[sec]; const r = (typeof parseSection==="function") ? parseSection(sec) : null; secCache[sec] = r; return r; };
  SONGS.forEach(s => {
    (s.artistIds || []).forEach(id => add(id, s.id));
    const pid = byName[normKey(s.artist)]; if(pid) add(pid, s.id);
    if(s.featuring){ String(s.featuring).split(/\s*[,&\/+\u00d7]\s*|\s+(?:feat\.?|ft\.?|featuring|with|and|x)\s+/i).forEach(n => { const id = byName[normKey(n)]; if(id) add(id, s.id); }); }
    (s.lyrics || []).forEach(l => { const info = psec(l.sec); if(info && info.artists) info.artists.forEach(a => { const id = a.id || byName[normKey(a.name)]; if(id) add(id, s.id); }); });
  });
}
function applyLyricEdits(){ try{ const ed=(state&&state.lyricEdits)||{}; for(const id in ed){ if(SONG_BY_ID[id] && Array.isArray(ed[id])) SONG_BY_ID[id].lyrics=ed[id]; } }catch(e){} }
let _catalogSig = "";
function catalogSig(songs, artists){
  const str = songs.map(x=>x.id).join(",") + "~" + artists.map(x=>x.id).join(",");
  let h=0; for(let i=0;i<str.length;i++){ h=(h*31 + str.charCodeAt(i))>>>0; }
  return songs.length + "|" + artists.length + "|" + h;
}
async function loadCatalog(){
  const [songsHTML, iconsHTML, lyricsHTML] = await Promise.all([
    fetchFirst(CONTENT_SOURCES.songs),
    fetchFirst(CONTENT_SOURCES.icons),
    fetchFirst(CONTENT_SOURCES.lyrics),
  ]);
  const songs = parseSongs(parseDoc(songsHTML));
  const artists = parseArtists(parseDoc(iconsHTML));
  attachLyrics(songs, parseLyrics(parseDoc(lyricsHTML)));
  if(!songs.length) throw new Error("No songs found in catalog");
  const sig = catalogSig(songs, artists);
  const changed = sig !== _catalogSig;
  SONGS = songs; ARTISTS = artists; indexCatalog(); _catalogSig = sig;
  if(changed){ state._wnBuilt=null; state._picks=null; }
  try{ localStorage.setItem(CATALOG_KEY, JSON.stringify({ songs: SONGS, artists: ARTISTS, ts: Date.now() })); }catch(e){}
  return { changed };
}
function loadCatalogCache(){
  try{
    const c = JSON.parse(localStorage.getItem(CATALOG_KEY) || "null");
    if(c && Array.isArray(c.songs) && c.songs.length){ SONGS = c.songs; ARTISTS = c.artists || []; indexCatalog(); _catalogSig = catalogSig(SONGS, ARTISTS); return c.ts || 0; }
  }catch(e){}
  return 0;
}
/* ---------- real-time catalog polling (keeps What's New fresh) ---------- */
let _catalogPollTimer=null, _refreshing=false;
async function refreshCatalog(){
  if(_refreshing) return; _refreshing=true;
  const prevS=SONGS.length, prevA=ARTISTS.length;
  try{
    const res = await loadCatalog();
    if(res.changed){
      softRefresh();
      const dS=SONGS.length-prevS, dA=ARTISTS.length-prevA;
      if(dS>0||dA>0){ const parts=[]; if(dS>0)parts.push(dS+" new song"+(dS>1?"s":"")); if(dA>0)parts.push(dA+" new artist"+(dA>1?"s":"")); toast("What\u2019s New updated", parts.join(" \u00B7 ")); }
    }
  }catch(e){}
  finally{ _refreshing=false; }
}
function startCatalogPolling(){
  if(_catalogPollTimer) return;
  _catalogPollTimer = setInterval(refreshCatalog, 60000);
  document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") refreshCatalog(); });
  window.addEventListener("focus", refreshCatalog);
}

/* Downscale + recompress an uploaded image so it reliably fits in localStorage.
   Full-screen backgrounds don't need more than ~1600px; JPEG keeps size tiny. */
function compressImageDataUrl(dataUrl, maxDim, quality){
  return new Promise((resolve,reject)=>{
    try{
      const im=new Image();
      im.onload=()=>{
        try{
          let w=im.naturalWidth||im.width, h=im.naturalHeight||im.height;
          if(!w||!h){ resolve(dataUrl); return; }
          const scale=Math.min(1, maxDim/Math.max(w,h));
          w=Math.max(1,Math.round(w*scale)); h=Math.max(1,Math.round(h*scale));
          const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
          const ctx=cv.getContext("2d"); ctx.drawImage(im,0,0,w,h);
          let out; try{ out=cv.toDataURL("image/jpeg", quality); }catch(e){ out=dataUrl; }
          resolve(out && out.length ? out : dataUrl);
        }catch(e){ resolve(dataUrl); }
      };
      im.onerror=()=>reject(new Error("bad image"));
      im.src=dataUrl;
    }catch(e){ reject(e); }
  });
}

const audio = state.audio; audio.preload="metadata";
function shuffleKeepFirst(arr, i){ let rest=arr.filter((_,x)=>x!==i); rest=rest.filter(s=>!(s&&s.id&&state.dislikes.has(s.id))); for(let k=rest.length-1;k>0;k--){ const j=Math.floor(Math.random()*(k+1)); [rest[k],rest[j]]=[rest[j],rest[k]]; } return [arr[i],...rest]; }

function loadIndex(i, list, autoplay=true){ const q=list||state.queue; if(i<0||i>=q.length) return; _starLastTU=-1; state.abA=null; state.abB=null; state.index=i; const song=q[i]; if(audio.src!==song.audioUrl) audio.src=song.audioUrl; audio.load(); if(autoplay){ const p=audio.play(); if(p&&p.catch) p.catch(()=>{}); } }

function nextTrack(manual=false){ const q=state.queue; if(!q.length) return; if(state.repeat==="one"&&!manual){ loadIndex(state.index,q,true); return; } let n=state.index+1; if(n>=q.length){ if(state.repeat==="all"||manual) n=0; else { audio.pause(); return; } } loadIndex(n,q,true); }
function prevTrack(){ const q=state.queue; if(!q.length) return; if(audio.currentTime>3){ audio.currentTime=0; return; } let p=state.index-1; if(p<0)p=q.length-1; loadIndex(p,q,true); }

const paletteCache = new Map();
function extractPalette(url){ return new Promise(res=>{ if(!url) return res(null); if(paletteCache.has(url)) return res(paletteCache.get(url)); const im=new Image(); im.crossOrigin="anonymous"; let done=false; const fin=v=>{ if(!done){done=true; paletteCache.set(url,v); res(v);} }; const to=setTimeout(()=>fin(null),6000); im.onload=()=>{ clearTimeout(to); try{ const s=36,cv=document.createElement("canvas"); cv.width=s; cv.height=s; const ctx=cv.getContext("2d",{willReadFrequently:true}); ctx.drawImage(im,0,0,s,s); const d=ctx.getImageData(0,0,s,s).data; const buk={}; for(let i=0;i<d.length;i+=4){ if(d[i+3]<125) continue; const r=d[i],g=d[i+1],b=d[i+2]; const mx=Math.max(r,g,b),mn=Math.min(r,g,b),light=(mx+mn)/2,sat=mx===mn?0:(mx-mn)/(255-Math.abs(mx+mn-255)+1e-6); const key=(r>>4)+"-"+(g>>4)+"-"+(b>>4); if(!buk[key]) buk[key]={r:0,g:0,b:0,n:0,s:0,l:0}; const k=buk[key]; k.r+=r;k.g+=g;k.b+=b;k.n++;k.s+=sat;k.l+=light; } let arr=Object.values(buk).map(k=>({r:Math.round(k.r/k.n),g:Math.round(k.g/k.n),b:Math.round(k.b/k.n),n:k.n,sat:k.s/k.n,light:k.l/k.n})); if(!arr.length) return fin(null); arr.forEach(c=>{ const lp=(c.light>230||c.light<22)?0.25:1; c.score=c.n*(0.35+c.sat)*lp; }); arr.sort((a,b)=>b.score-a.score); const pick=[]; for(const c of arr){ if(pick.every(p=>Math.abs(p.r-c.r)+Math.abs(p.g-c.g)+Math.abs(p.b-c.b)>60)) pick.push(c); if(pick.length>=3) break; } while(pick.length<2&&arr.length) pick.push(arr[pick.length]||arr[0]); fin(pick.map(c=>({r:c.r,g:c.g,b:c.b}))); }catch(e){ fin(null);} }; im.onerror=()=>{ clearTimeout(to); fin(null); }; im.src=url; }); }

function dateMs(str){ if(!str) return 0; const t=Date.parse(str); return isNaN(t)?0:t; }
function relDate(str){ const t=dateMs(str); if(!t) return esc(str||""); const diff=Date.now()-t, day=86400000; if(diff<day*2) return "Just added"; const d=Math.floor(diff/day); if(d<7) return d+" days ago"; const w=Math.floor(d/7); if(w<5) return w+(w===1?" week ago":" weeks ago"); const mo=Math.floor(d/30); if(mo<12) return mo+(mo===1?" month ago":" months ago"); const y=Math.floor(d/365); return y+(y===1?" year ago":" years ago"); }
function artistSongs(id){ const set=ARTIST_SONG_IDS[id]; if(set) return vis(SONGS.filter(s=>set.has(s.id))); return vis(SONGS.filter(s=>(s.artistIds||[]).includes(id))); }

function buildWhatsNew(){
  const bydate=vis([...SONGS]).sort((a,b)=>dateMs(b.creationDate)-dateMs(a.creationDate));
  const recentSongs=bydate.slice(0,3);
  const latest={}; SONGS.forEach(s=>{ const t=dateMs(s.creationDate); (s.artistIds||[]).forEach(id=>{ if(t>(latest[id]||0)) latest[id]=t; }); });
  const withSongs=ARTISTS.filter(a=>artistSongs(a.id).length);
  const recentArtists=[...withSongs].sort((a,b)=>(latest[b.id]||0)-(latest[a.id]||0)).slice(0,3);
  const recentIds=new Set(recentArtists.map(a=>a.id));
  const pool=withSongs.filter(a=>!recentIds.has(a.id));
  const randomArtist=pool.length?pool[Math.floor(Math.random()*pool.length)]:null;
  const slides=[];
  for(let i=0;i<3;i++){ if(recentSongs[i]) slides.push({kind:"song",song:recentSongs[i]}); if(recentArtists[i]) slides.push({kind:"artist",artist:recentArtists[i]}); }
  if(randomArtist) slides.push({kind:"rediscover",artist:randomArtist});
  return slides;
}

let wnTimer=null;
function stopWN(){ if(wnTimer){ clearInterval(wnTimer); wnTimer=null; } }
function startWN(){ stopWN(); if((state._wnCount||0)<2) return; wnTimer=setInterval(()=>goWN((state.wnIndex||0)+1,true), 5600); }
function goWN(i, auto){
  const n=state._wnCount||0; if(!n) return;
  state.wnIndex=((i%n)+n)%n;
  const track=$("#wn-track"); if(track) track.style.transform=`translateX(-${state.wnIndex*100}%)`;
  $$('#wn-dots [data-act="wn-dot"]').forEach((d,di)=>{ d.className=`wn-dot h-2 rounded-full transition-all duration-300 ${di===state.wnIndex?'w-7 bg-white':'w-2 bg-white/30 hover:bg-white/60'}`; });
  $$('#wn-track .wn-slide').forEach((sl,si)=>sl.classList.toggle('wn-active', si===state.wnIndex));
  if(!auto) startWN();
}
function wireWN(){
  stopWN();
  if(!$(".wn-viewport")) return;
  $$('#wn-track .wn-slide').forEach((sl,si)=>sl.classList.toggle('wn-active', si===(state.wnIndex||0)));
  const sec=$('[data-testid="whats-new"]');

function viewLibrary(){
  let list=vis(SONGS.slice());
  if(state.query){ const q=state.query.toLowerCase(); list=list.filter(s=>s.title.toLowerCase().includes(q)||s.artist.toLowerCase().includes(q)||(s.writtenBy||"").toLowerCase().includes(q)); }
  else if(state.genre!=="all"){ list=list.filter(s=>s.genre===state.genre); }

function lsBytes(k){ try{ const v=localStorage.getItem(k); if(v==null) return 0; return (k.length+v.length)*2; }catch(e){ return 0; } }
function fmtBytes(b){ b=b||0; if(b<1024) return b+" B"; if(b<1024*1024) return (b/1024).toFixed(b<10240?1:0)+" KB"; return (b/1048576).toFixed(2)+" MB"; }
function groupBytes(g){ return g.keys.reduce((a,k)=>a+lsBytes(k),0); }
function treeshTotalBytes(){ let t=0; try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k && k.indexOf("treesh")===0) t+=lsBytes(k); } }catch(e){} return t; }
function storageSection(tab){

      <span class="shrink-0 font-doto text-xs text-white/60" data-testid="storage-size-${g.id}">${fmtBytes(bytes)}</span>
      <button data-act="storage-clear-group" data-group="${g.id}" data-testid="storage-clear-${g.id}" aria-label="Clear ${g.label}" class="press grid h-9 w-9 shrink-0 place-items-center rounded-full border border-white/12 bg-white/5 text-white/60 transition-colors hover:bg-white/10 hover:text-rose-300 ${empty?'pointer-events-none opacity-30':''}"><i data-lucide="trash-2" style="width:15px;height:15px"></i></button>
    </div>`; }).join("");
  return `<section data-testid="settings-storage" class="${tab==='account'?'':'hidden'} rounded-3xl border border-white/10 bg-white/[0.04] p-5 sm:p-6">

    <p class="mb-4 pl-11 text-sm text-white/50">Everything in Treesh is saved only on this device. Review what\u2019s stored and free up space.</p>

      <div class="mt-3 h-2.5 w-full overflow-hidden rounded-full bg-white/10"><div id="storage-gauge-bar" class="h-full rounded-full bg-[color:var(--treesh-purple)]" style="width:${pct}%;transition:width var(--treesh-dur-3,420ms) var(--treesh-ease,ease)"></div></div>
    </div>
    <div class="mt-4 space-y-2.5" data-testid="storage-groups">${rows}</div>
    <button data-act="storage-clear-all" data-testid="storage-clear-all-button" class="press mt-4 inline-flex w-full items-center justify-center gap-2 rounded-2xl border border-rose-500/30 bg-rose-500/10 py-3 text-sm font-semibold text-rose-200 transition-colors hover:bg-rose-500/20"><i data-lucide="trash-2" style="width:16px;height:16px"></i>Clear all Treesh data</button>
  </section>`;
}
function updateStorageEstimate(){
  const el=document.getElementById("storage-quota-text"); if(!el) return;
  if(navigator.storage && navigator.storage.estimate){
    navigator.storage.estimate().then(est=>{ const el2=document.getElementById("storage-quota-text"); if(!el2) return; if(est && est.quota){ const free=Math.max(0,(est.quota||0)-(est.usage||0)); el2.textContent="~"+fmtBytes(free)+" free on device"; } else { el2.textContent="Device estimate unavailable"; } }).catch(()=>{ const el2=document.getElementById("storage-quota-text"); if(el2) el2.textContent="Device estimate unavailable"; });
  } else { el.textContent="Device estimate unavailable"; }
}

let _io=null;
function prefersReduced(){ return !!state.perfMode; }
function applyPerfMode(){ document.documentElement.classList.toggle("perf-mode", !!state.perfMode); if(state.perfMode){ const st=document.getElementById("stars"); if(st) st.style.display="none"; } }
function animateView(){
  const v=$("#view"); if(!v) return;
  if(_io){ _io.disconnect(); _io=null; }
  if(prefersReduced()) return;
  let kids=[...v.children];
  if(kids.length===1 && kids[0].children && kids[0].children.length>1) kids=[...kids[0].children];
  kids.forEach((el,i)=>{ el.classList.remove("reveal-stagger"); void el.offsetWidth; el.style.animationDelay=(Math.min(i,8)*55)+"ms"; el.classList.add("reveal-stagger"); });
  const items=v.querySelectorAll(".grid > *");
  if(items.length>6){
    _io=new IntersectionObserver((ents)=>{ ents.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("io-in"); if(_io) _io.unobserve(e.target); } }); }, {rootMargin:"0px 0px -6% 0px", threshold:0.04});
    items.forEach(el=>{ el.classList.add("io-reveal"); _io.observe(el); });
  }
}

/* ---------- preserve inner scroll positions across re-renders ---------- */
function _domPath(el, root){ const path=[]; let n=el; while(n && n!==root){ const parent=n.parentNode; if(!parent) break; const idx=Array.prototype.indexOf.call(parent.children, n); if(idx<0) break; path.push(idx); n=parent; } return path.reverse().join('.'); }
function _elByPath(root, path){ if(path==='') return root; const parts=path.split('.'); let n=root; for(let i=0;i<parts.length;i++){ const idx=+parts[i]; if(!n||!n.children||!n.children[idx]) return null; n=n.children[idx]; } return n; }
function captureScroll(root){ const map=[]; if(!root) return map; const all=root.querySelectorAll('*'); for(let i=0;i<all.length;i++){ const el=all[i]; if((el.scrollLeft>0||el.scrollTop>0) && (el.scrollWidth>el.clientWidth+1||el.scrollHeight>el.clientHeight+1)){ map.push([_domPath(el,root), el.scrollLeft, el.scrollTop]); } } return map; }
function restoreScroll(root, map){ if(!root||!map||!map.length) return; for(let i=0;i<map.length;i++){ const rec=map[i]; const el=_elByPath(root, rec[0]); if(el){ if(rec[1]) el.scrollLeft=rec[1]; if(rec[2]) el.scrollTop=rec[2]; } } }

function renderView(animate=false){
  const v=$("#view"); if(!v) return;
  const _scrollMap=captureScroll(v);
  const _prevY=(typeof window!=='undefined')?(window.scrollY||window.pageYOffset||0):0;
  { const fsc=document.getElementById("instrum-fs"); if(fsc&&fsc.childElementCount>0 && !(state.view==="instrum"&&state.instrum&&state.instrum.fs)){ fsc.innerHTML=""; if(state.instrum) state.instrum.fs=false; } }
  let html="";
  switch(state.view){
    case "library": html=viewLibrary(); break;
    case "artists": html=viewArtists(); break;
    case "artist": html=viewArtistDetail(); break;
    case "favorites": html=viewFavorites(); break;
    case "playlists": html=viewPlaylists(); break;
    case "playlist": html=viewPlaylistDetail(); break;
    case "settings": html=viewSettings(); break;
    case "game": html=viewGame(); break;
    case "instrum": html=viewInstrum(); break;
    case "picks": html=viewPicks(); break;
    default: html=viewLibrary();
  }
  v.innerHTML=html; icons();
  restoreScroll(v, _scrollMap);
  if(!animate){ try{ window.scrollTo(0,_prevY); }catch(e){} }
  if(state.view==="instrum" && state.instrum && state.instrum.started) requestAnimationFrame(()=>{ if(state.instrum && state.instrum.playing) iHighlightCol(state.instrum.visStep); });
  state._renderedActiveId = curSong() && curSong().id;
  if(animate){ v.classList.remove("view-in"); void v.offsetWidth; v.classList.add("view-in"); animateView(); }
  if(state.view==="library") wireWN(); else stopWN();
  // wire settings live zodiac + avatar preview
  const bday=$("#set-bday"); if(bday){ const updSB=()=>{ syncDateField(bday); const z=zodiac(bday.value); const el=$("#set-zodiac"); if(el) el.textContent=z; const zw=$("#set-zodiac-wrap"); if(zw) zw.classList.toggle("hidden",!z); }; bday.addEventListener("input",updSB); bday.addEventListener("change",updSB); }
  const ai=$("#set-avatar-input"); if(ai){ ai.addEventListener("change",e=>{ const f=e.target.files&&e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ state._tmpAvatar=r.result; const av=$("#set-avatar"); if(av) av.innerHTML=img(r.result,'h-full w-full object-cover'); }; r.readAsDataURL(f); }); }
  document.querySelectorAll(".bg-image-input").forEach(bgi=>{ bgi.addEventListener("change",e=>{ const f=e.target.files&&e.target.files[0]; if(!f) return; if(f.size>12*1024*1024){ toast("Image too large","Use one under 12 MB"); return; } if((state.bgImages||[]).length>=3){ toast("Limit reached","You can save up to 3 images"); return; } const r=new FileReader(); r.onload=()=>{ compressImageDataUrl(r.result, 1600, 0.82).then(small=>{ state.bgImages=(state.bgImages||[]).filter(Boolean); state.bgImages.push(small); state.bgIndex=state.bgImages.length-1; const prevBg=state.bg; state.bg="custom"; const ok=bgSaveImages(); if(!ok){ state.bgImages.pop(); state.bgIndex=Math.max(0,state.bgImages.length-1); state.bg=prevBg; bgSaveImages(); applyTheme(); renderView(); toast("Storage full","Couldn\u2019t save \u2014 remove an image and try again"); return; } LS.set("treesh_bg","custom"); applyTheme(); renderView(); toast("Background added", `Image ${state.bgIndex+1} of ${state.bgImages.length}`); }).catch(()=>toast("Couldn\u2019t read image","Try a different file")); }; r.readAsDataURL(f); }); });
  const ff=$("#set-font-file"); if(ff){ ff.addEventListener("change",e=>{ const f=e.target.files&&e.target.files[0]; if(!f) return; if(f.size>3*1024*1024){ toast("Font too large","Use one under 3 MB"); return; } const r=new FileReader(); r.onload=()=>{ try{ state.customFont={data:r.result, name:(f.name||'Custom').replace(/\.[^.]+$/,'')}; state.uiFont=""; _customFontLoaded=false; LS.set("treesh_custom_font",state.customFont); applyUiFont(); renderView(); toast("Custom font applied", state.customFont.name); }catch(err){ toast("Couldn\u2019t load font"); } }; r.readAsDataURL(f); }); }
  iRenderMenu();
  if(state.view==="settings" && (state.settingsTab||"display")==="account") updateStorageEstimate();
}

function profileStatsHtml(){

    <div class="mt-2.5 grid grid-cols-2 gap-2.5">${stat('Day streak',sr.streak||0,'flame')}${stat('New songs',Object.keys(sr.newSongs||{}).length,'disc-3')}${stat('Minutes',sr.totalMin||0,'clock')}${stat('Beats made',sr.beats||0,'drum')}</div>
    ${(sr.log&&sr.log.length)?`<div class="mt-2.5 space-y-1.5 rounded-2xl border border-white/10 bg-white/[0.03] p-3"><p class="mb-1 text-[10px] font-bold uppercase tracking-wide text-white/45">Recent rewards</p>${sr.log.slice(0,5).map(e=>`<div class="flex items-center justify-between gap-2 text-sm"><span class="clamp-1 text-white/70">${esc(e.r||'Reward')}</span><span class="shrink-0 font-semibold text-[color:var(--treesh-gold)]">+${e.a}</span></div>`).join("")}</div>`:''}

function wrapCanvasText(ctx, lines, maxW){
  const out=[];
  lines.forEach(line=>{
    const words=String(line).split(/\s+/); let cur="";
    words.forEach(w=>{ const test=cur?cur+" "+w:w; if(ctx.measureText(test).width>maxW && cur){ out.push(cur); cur=w; } else cur=test; });
    if(cur) out.push(cur); else if(!words.length) out.push("");
  });
  return out;
}
function shadeHex(hex, amt){ try{ const {r,g,b}=hexToRgb(hex); const f=v=>Math.max(0,Math.min(255,Math.round(v+amt))); return `rgb(${f(r)},${f(g)},${f(b)})`; }catch(e){ return hex; } }
function drawImageCover(ctx, img, x, y, w, h){ const iw=img.naturalWidth||img.width, ih=img.naturalHeight||img.height; if(!iw||!ih) return; const scale=Math.max(w/iw, h/ih); const dw=iw*scale, dh=ih*scale; ctx.drawImage(img, x+(w-dw)/2, y+(h-dh)/2, dw, dh); }
function roundRectPath(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
let _studioCover=null;
function ensureStudioCover(url){
  if(_studioCover && _studioCover.url===url) return _studioCover;
  const rec={url, img:null, ok:false, tainted:false}; _studioCover=rec;
  const tryLoad=(useCors)=>{ const im=new Image(); if(useCors) im.crossOrigin='anonymous'; im.onload=()=>{ if(_studioCover!==rec) return; rec.img=im; rec.ok=true; rec.tainted=!useCors; drawLyricCard(); }; im.onerror=()=>{ if(_studioCover!==rec) return; if(useCors){ tryLoad(false); } else { rec.ok=false; drawLyricCard(); } }; im.src=url; };
  tryLoad(true); return rec;
}
function drawLyricCard(){
  const cv=$("#lyric-canvas"); if(!cv) return;
  const s=SONG_BY_ID[state.studio.songId]; if(!s) return;
  const st=state.studio;
  const items=studioLines(s.id);
  const rawLines=items.map(x=> (st.edits && st.edits[x.i]!=null) ? st.edits[x.i] : x.text);
  const th=CARD_THEMES[st.theme]||CARD_THEMES[0];
  const accent = st.bgMode==='theme' ? (th.accent||'#fff') : '#ffffff';
  const ctx=cv.getContext("2d"); const W=1080,H=1080;
  const paint=()=>{
    ctx.clearRect(0,0,W,H); ctx.filter='none';
    // ---- background ----
    if(st.bgMode==='cover'){
      const rec=s.coverArt ? ensureStudioCover(s.coverArt) : null;
      if(rec && rec.ok && rec.img){
        ctx.fillStyle='#0c0c0f'; ctx.fillRect(0,0,W,H);
        ctx.save();
        if(st.coverShape==='circle'){ ctx.beginPath(); ctx.arc(W/2,H/2,Math.min(W,H)*0.47,0,Math.PI*2); ctx.clip(); }
        else if(st.coverShape==='rounded'){ roundRectPath(ctx,64,64,W-128,H-128,72); ctx.clip(); }
        if(st.blur>0) ctx.filter=`blur(${st.blur}px)`;
        const b=st.blur||0; drawImageCover(ctx, rec.img, -b, -b, W+b*2, H+b*2);
        ctx.restore(); ctx.filter='none';
      } else { const g=ctx.createLinearGradient(0,0,W,H); g.addColorStop(0,'#1a1030'); g.addColorStop(1,'#0c0c0f'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H); }
    } else if(st.bgMode==='color'){
      const g=ctx.createLinearGradient(0,0,W,H); g.addColorStop(0,st.color); g.addColorStop(1, shadeHex(st.color,-48)); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    } else {
      const g=ctx.createLinearGradient(0,0,W,H); g.addColorStop(0,th.a); g.addColorStop(1,th.b); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    }
    // ---- dim overlay ----
    if(st.dim>0){ ctx.fillStyle=`rgba(0,0,0,${st.dim})`; ctx.fillRect(0,0,W,H); }
    // ---- readability scrims ----
    const rg=ctx.createRadialGradient(W*0.2,H*0.15,50,W*0.2,H*0.15,700); rg.addColorStop(0,"rgba(255,255,255,0.10)"); rg.addColorStop(1,"rgba(255,255,255,0)"); ctx.fillStyle=rg; ctx.fillRect(0,0,W,H);
    const bs=ctx.createLinearGradient(0,H*0.52,0,H); bs.addColorStop(0,'rgba(0,0,0,0)'); bs.addColorStop(1,'rgba(0,0,0,0.55)'); ctx.fillStyle=bs; ctx.fillRect(0,0,W,H);
    // ---- decorative quote ----
    ctx.fillStyle="rgba(255,255,255,0.13)"; ctx.font='900 300px Georgia, serif'; ctx.textBaseline="alphabetic"; ctx.fillText("\u201C", 60, 340);
    // ---- top label ----
    ctx.fillStyle=accent; ctx.font='800 26px Manrope, sans-serif'; ctx.fillText("T R E E S H   \u00B7   L Y R I C S", 96, 150);
    // ---- lyric body (respect manual line breaks via \n) ----
    const body = rawLines.length ? rawLines.reduce((acc,l)=>acc.concat(String(l).split('\n')),[]) : ["Select lyrics to feature\u2026"];
    let fs=76; const total=body.join(" ").length;
    if(total>60) fs=62; if(total>120) fs=52; if(total>200) fs=44; if(total>320) fs=36;
    ctx.font=`800 ${fs}px Manrope, sans-serif`;
    let wrapped=wrapCanvasText(ctx, body, W-192);
    while(wrapped.length*(fs*1.28) > 560 && fs>26){ fs-=4; ctx.font=`800 ${fs}px Manrope, sans-serif`; wrapped=wrapCanvasText(ctx, body, W-192); }
    const lh=fs*1.3; const blockH=wrapped.length*lh; let y=Math.max(360,(H-260)/2 - blockH/2 + fs);
    ctx.fillStyle="#ffffff"; ctx.textBaseline="alphabetic";
    if(st.bgMode==='cover'){ ctx.shadowColor='rgba(0,0,0,0.4)'; ctx.shadowBlur=14; ctx.shadowOffsetY=2; }
    wrapped.forEach(ln=>{ ctx.fillText(ln,96,y); y+=lh; });
    ctx.shadowColor='transparent'; ctx.shadowBlur=0; ctx.shadowOffsetY=0;
    // ---- attribution ----

  pts+=bonus;
  g.lastAnswer=a; g.lastSim=sim; g.lastExact=exact; g.lastPoints=pts; g.lastBonus=bonus; g.lastAdlib=adlibHit; g.lastAdlibBonus=adlibHit?adlibBonus:0; g.lastTimedOut=!!timedOut; g.mode=mode||"type"; g.score+=pts;

function updateABMarkers(){ const m=$("#np-ab-markers"); if(!m) return; const d=state.duration||0; if(!d || state.abA==null){ m.innerHTML=""; return; } const clamp=x=>Math.max(0,Math.min(100,x)); const aP=clamp(state.abA/d*100); let html=""; if(state.abB!=null){ const bP=clamp(state.abB/d*100); html+=`<span class="absolute top-1/2 -translate-y-1/2 rounded-full bg-[color:var(--treesh-purple)]/25" style="left:${aP}%;width:${Math.max(0,bP-aP)}%;height:6px"></span>`; html+=`<span class="absolute top-1/2 -translate-y-1/2 h-3.5 w-[3px] rounded-full bg-white shadow" style="left:${bP}%"></span><span class="absolute -top-3.5 -translate-x-1/2 text-[9px] font-extrabold text-white" style="left:${bP}%">B</span>`; } html+=`<span class="absolute top-1/2 -translate-y-1/2 h-3.5 w-[3px] rounded-full bg-white shadow" style="left:${aP}%"></span><span class="absolute -top-3.5 -translate-x-1/2 text-[9px] font-extrabold text-white" style="left:${aP}%">A</span>`; m.innerHTML=html; }
function updateProgress(){ const s=curSong(); const d=state.duration||0,cur=state.currentTime||0; const pct=d?(cur/d*100):0;
  const mp=$("#mini-prog"); if(mp) mp.style.width=pct+"%";

function updateLyricHighlight(force){ if(!state.showLyrics||!state.lyricLines.length) return; const t=state.currentTime; let idx=-1; const s=curSong(); const lines=s&&s.lyrics||[]; for(let i=0;i<lines.length;i++){ if(lines[i].t<=t+0.15) idx=i; else break; } state.lyricLines.forEach((el,i)=>{ const active=i===idx; el.classList.toggle("text-white",active); el.classList.toggle("text-white/40",!active&&i>idx); el.classList.toggle("text-white/35",!active&&i<idx); el.style.textShadow=active?"0 2px 30px rgba(255,255,255,0.25)":""; el.style.transform=active?"scale(1.02)":""; el.style.transformOrigin="left"; }); updatePerformer(idx>=0?(lines[idx]&&lines[idx].sec):null); if(state.explainAuto&&idx>=0){ document.querySelectorAll('#np-lyrics [data-detail-panel]').forEach(p=>{ const pi=+p.getAttribute('data-detail-panel'); p.classList.toggle('hidden', pi!==idx); }); } const paused=!force&&Date.now()<_lyricUserScrollUntil; const rb=document.getElementById("lyric-resume"); if(rb) rb.classList.toggle("hidden",!paused); if(idx>=0&&!paused){ const el=state.lyricLines[idx]; const cont=$("#np-lyrics"); if(el&&cont){ const target=el.offsetTop-cont.clientHeight/2+el.clientHeight/2; cont.scrollTo({top:Math.max(target,0),behavior:"smooth"}); } } }

/* media session + palette on song change */
function onSongChange(){ const s=curSong(); if(!s) return; if("mediaSession"in navigator){ try{ navigator.mediaSession.metadata=new MediaMetadata({title:s.title,artist:s.artist,album:"Treesh",artwork:[{src:s.coverArt,sizes:"512x512",type:"image/jpeg"}]}); navigator.mediaSession.setActionHandler("play",()=>togglePlay()); navigator.mediaSession.setActionHandler("pause",()=>togglePlay()); navigator.mediaSession.setActionHandler("nexttrack",()=>nextTrack(true)); navigator.mediaSession.setActionHandler("previoustrack",()=>prevTrack()); }catch(e){} }
  state.palette=null;
  renderSidebarLibrary();
  if(state.npOpen) renderNP();   // refresh lyrics/title/art immediately on track change (fixes stale lyrics on next/prev)
  renderMini();
  extractPalette(s.coverArt).then(p=>{ state.palette=p; if(state.npOpen) renderNP(); });
}

let recog=null, listening=false, _voiceSticky=false, _voiceHandled=false, _voiceHideT=null;
function initVoice(){ const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR){ recog=false; return; } recog=new SR(); recog.continuous=false; recog.interimResults=true; recog.lang="en-US";
  recog.onstart=()=>{ listening=true; if($("#voice-ov")) voiceSetState("listening"); };
  recog.onresult=e=>{ let t=""; for(let i=0;i<e.results.length;i++) t+=e.results[i][0].transcript; const ov=$("#voice-text"); if(ov){ ov.innerHTML=t?esc(t):`Say play, pause, next<span class="voice-dots"><span>.</span><span>.</span><span>.</span></span>`; ov.classList.toggle("text-white/50",!t); ov.classList.toggle("text-white",!!t); } if(e.results[e.results.length-1].isFinal) handleVoice(t.toLowerCase().trim()); };
  recog.onend=()=>{ listening=false; if(!$("#voice-ov")) return; if(_voiceSticky) return; if(_voiceHandled) hideVoice(); else voiceSetState("idle"); };
  recog.onerror=e=>{ listening=false; if(e.error==="aborted") return; if(e.error==="not-allowed"||e.error==="service-not-allowed") voiceSetState("denied"); else if(e.error==="no-speech") voiceSetState("nospeech"); else voiceSetState("error"); };
}
function toggleVoice(){ if($("#voice-ov")){ stopVoice(); return; } if(recog===null) initVoice(); _voiceHandled=false; showVoice(); if(!recog){ voiceSetState("unsupported"); return; } try{ recog.start(); }catch(err){ try{ recog.abort(); }catch(_){} voiceSetState("idle"); } }
function voiceRetry(){ if(!recog){ voiceSetState("unsupported"); return; } _voiceHandled=false; _voiceSticky=false; clearTimeout(_voiceHideT); voiceSetState("listening"); const go=()=>{ try{ recog.start(); }catch(e){ voiceSetState("idle"); } }; try{ recog.abort(); }catch(_){} setTimeout(go,140); }
function voiceBody(mode){
  if(mode==="listening"||mode==="idle"){
    const on=(mode==="listening");
    const sub=on?"Listening\u2026 speak now":"Tap the mic to speak";
    const orb=on
      ? `<div class="relative grid h-24 w-24 place-items-center" data-testid="voice-listening-orb"><span class="voice-pulse absolute inset-0"></span><span class="relative grid h-24 w-24 place-items-center rounded-full bg-[color:var(--treesh-purple)] text-white glow-purple"><i data-lucide="mic" style="width:34px;height:34px"></i></span></div>`
      : `<button data-act="voice-retry" aria-label="Start listening" data-testid="voice-listening-orb" class="press grid h-24 w-24 place-items-center rounded-full bg-[color:var(--treesh-purple)] text-white glow-purple transition-transform hover:scale-105"><i data-lucide="mic" style="width:34px;height:34px"></i></button>`;
    const mid=on
      ? `<div class="voice-wave" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>`
      : `<div class="flex h-[38px] items-center"><span class="text-sm text-white/45">Ready when you are</span></div>`;
    const primary=on
      ? `<button data-act="voice-stop" data-testid="voice-stop-button" class="press inline-flex h-11 items-center justify-center gap-2 rounded-2xl bg-[color:var(--treesh-purple)] text-sm font-semibold text-white glow-purple"><i data-lucide="check" style="width:16px;height:16px"></i>Done</button>`
      : `<button data-act="voice-retry" data-testid="voice-retry-button" class="press inline-flex h-11 items-center justify-center gap-2 rounded-2xl bg-[color:var(--treesh-purple)] text-sm font-semibold text-white glow-purple"><i data-lucide="mic" style="width:16px;height:16px"></i>Listen</button>`;
    return `<div class="flex flex-col items-center gap-5 text-center">
      <div class="flex w-full items-center justify-between">
        <div class="text-left"><p class="font-display text-sm uppercase tracking-[0.16em] text-white/90">Voice control</p><p class="mt-0.5 text-sm text-white/55">${sub}</p></div>
        <button data-act="voice-cancel" aria-label="Close" data-testid="voice-close-button" class="press grid h-9 w-9 place-items-center rounded-full border border-white/12 bg-white/5 text-white/70 hover:bg-white/10"><i data-lucide="x" style="width:17px;height:17px"></i></button>
      </div>
      ${orb}
      ${mid}
      <div class="w-full rounded-2xl border border-white/10 bg-white/5 p-3.5 text-left"><p class="text-[10px] font-semibold uppercase tracking-[0.2em] text-white/40">Transcript</p><p id="voice-text" data-testid="voice-live-transcript" class="mt-1 min-h-[24px] text-base font-semibold text-white/50">${on?`Say play, pause, next<span class="voice-dots"><span>.</span><span>.</span><span>.</span></span>`:`Tap the mic and say a command`}</p></div>
      <div class="flex flex-wrap justify-center gap-1.5">${["play","pause","next","previous","shuffle","play &lt;song&gt;"].map(c=>`<span class="rounded-full border border-white/10 bg-white/5 px-2.5 py-1 text-[11px] text-white/60">${c}</span>`).join("")}</div>
      <div class="grid w-full grid-cols-2 gap-2"><button data-act="voice-cancel" data-testid="voice-cancel-button" class="press h-11 rounded-2xl border border-white/12 bg-white/5 text-sm font-semibold text-white/85 hover:bg-white/10">Cancel</button>${primary}</div>
    </div>`;
  }
  const M={ unsupported:["mic-off","Voice not supported","This browser doesn\u2019t support voice control. Try Chrome on Android or desktop."], denied:["mic-off","Microphone blocked","Allow microphone access in your browser settings, then try again."], error:["triangle-alert","Something went wrong","Couldn\u2019t start voice control. Please try again."], nospeech:["ear","Didn\u2019t catch that","We didn\u2019t hear anything. Tap the mic and speak clearly."] }[mode]||["mic-off","Voice unavailable","Please try again."];
  return `<div class="flex flex-col items-center gap-4 text-center">
    <div class="grid h-16 w-16 place-items-center rounded-full border border-white/12 bg-white/5 text-white/70"><i data-lucide="${M[0]}" style="width:28px;height:28px"></i></div>
    <div><p class="font-display text-base uppercase tracking-[0.14em] text-white/90">${M[1]}</p><p data-testid="voice-live-transcript" class="mx-auto mt-1.5 max-w-[16rem] text-sm text-white/60">${M[2]}</p></div>
    <div class="grid w-full grid-cols-2 gap-2"><button data-act="voice-cancel" data-testid="voice-cancel-button" class="press h-11 rounded-2xl border border-white/12 bg-white/5 text-sm font-semibold text-white/85 hover:bg-white/10">Close</button><button data-act="voice-retry" data-testid="voice-retry-button" class="press inline-flex h-11 items-center justify-center gap-2 rounded-2xl bg-[color:var(--treesh-purple)] text-sm font-semibold text-white glow-purple"><i data-lucide="rotate-ccw" style="width:15px;height:15px"></i>Try again</button></div>
  </div>`;
}
function showVoice(){ clearTimeout(_voiceHideT); _voiceSticky=false; if($("#voice-ov")) return; const el=document.createElement("div"); el.id="voice-ov"; el.className="tr-fade-in fixed inset-0 z-[110] flex items-center justify-center p-4"; el.innerHTML=`<div data-act="voice-cancel" class="absolute inset-0 bg-black/60 backdrop-blur-md"></div><div data-voice-panel data-testid="voice-listening-overlay" class="tr-panel-in relative w-[min(92vw,420px)] rounded-[28px] glass-strong border border-white/12 p-6 pb-[calc(22px+env(safe-area-inset-bottom))] shadow-[var(--treesh-shadow)]"><div data-voice-body>${voiceBody("listening")}</div></div>`; document.body.appendChild(el); icons(); syncScrollLock(); }
function voiceSetState(mode){ const el=$("#voice-ov"); if(!el) return; const body=el.querySelector("[data-voice-body]"); if(!body) return; body.innerHTML=voiceBody(mode); icons(); const nonSticky=(mode==="listening"||mode==="idle"); _voiceSticky=!nonSticky; clearTimeout(_voiceHideT); if(_voiceSticky){ _voiceHideT=setTimeout(()=>{ if($("#voice-ov")) voiceSetState("idle"); }, 4200); } }
function stopVoice(){ _voiceSticky=false; clearTimeout(_voiceHideT); if(recog){ try{ recog.abort(); }catch(e){ try{ recog.stop(); }catch(_){} } } listening=false; hideVoice(); }
function hideVoice(){ clearTimeout(_voiceHideT); _voiceSticky=false; const el=$("#voice-ov"); if(el){ el.classList.remove("tr-fade-in"); el.classList.add("tr-fade-out"); const p=el.querySelector("[data-voice-panel]"); if(p){ p.classList.remove("tr-panel-in"); p.classList.add("tr-panel-out"); } setTimeout(()=>{ if(el.parentNode) el.remove(); syncScrollLock(); },200); } else { syncScrollLock(); } }
function handleVoice(t){ if(!t) return; _voiceHandled=true; const say=m=>toast(m); if(/(^|\s)(pause|stop)(\s|$)/.test(t)){ if(state.isPlaying)togglePlay(); say("Paused"); } else if(/(next|skip)/.test(t)){ nextTrack(true); say("Next track"); } else if(/(previous|back|last)/.test(t)){ prevTrack(); say("Previous track"); } else if(/shuffle/.test(t)){ toggleShuffle(); say("Shuffle toggled"); } else if(/repeat/.test(t)){ cycleRepeat(); say("Repeat toggled"); } else if(/^(search|find)\s+(.+)/.test(t)){ const q=t.replace(/^(search|find)\s+/,""); state.query=q; state.view="library"; setHash("library"); renderShell(); renderView(); const si=$("#search"); if(si) si.value=q; say("Searching \u201C"+q+"\u201D"); } else if(/^play\s+(.+)/.test(t)){ const q=t.replace(/^play\s+/,""); const hit=SONGS.find(s=>s.title.toLowerCase().includes(q)||s.artist.toLowerCase().includes(q)); if(hit){ playSong(hit,SONGS); say("Playing "+hit.title); } else { state.query=q; state.view="library"; renderShell(); renderView(); say("Looking for \u201C"+q+"\u201D"); } } else if(/(^|\s)(play|resume)(\s|$)/.test(t)){ if(!state.isPlaying&&curSong())togglePlay(); say("Playing"); } else { toast("Didn\u2019t catch that","\u201C"+t+"\u201D"); } }

function setHash(view,param){ const h=param?`#/${view}/${param}`:`#/${view}`; if(location.hash!==h){ history.pushState(null,"",h); } }
function navigate(view,param){ if(pageIsLocked(view)){ if(state.profileOpen) closeProfile(true); if(state.searchOpen) closeSearch(true); openPageLock(view,param); return; } if(state.profileOpen) closeProfile(true); if(state.searchOpen) closeSearch(true); state.view=view; state.param=param||null; setHash(view,param); renderShell(); renderView(true); window.scrollTo(0,0); syncScrollLock(); }
function parseHash(){ const h=location.hash.replace(/^#\//,""); if(!h) return {view:"library"}; const parts=h.split("/"); return {view:parts[0]||"library",param:parts[1]?decodeURIComponent(parts[1]):null}; }
window.addEventListener("hashchange",()=>{ if(state.profileOpen) closeProfile(true); const {view,param}=parseHash(); state.view=view; state.param=param; renderShell(); renderView(true); });
window.addEventListener("popstate",()=>{ if(state.profileOpen) closeProfile(true); const {view,param}=parseHash(); state.view=view; state.param=param; renderShell(); renderView(true); });

document.addEventListener("input", e=>{
  const el=e.target.closest("[data-act]"); if(!el) return; const act=el.dataset.act;
  if(act==="viz-sensitivity"){ state.viz.sensitivity=+el.value; LS.set("treesh_viz",state.viz); return; }
  if(act==="set-nav-color"){ state.navColor=el.value; LS.set("treesh_nav_color",el.value); applyCustomColors(); return; }
  if(act==="set-topbar-color"){ state.topbarColor=el.value; LS.set("treesh_topbar_color",el.value); applyCustomColors(); return; }
  if(act==="set-row-color"){ state.rowColor=el.value; LS.set("treesh_row_color",el.value); applyCustomColors(); return; }
  if(act==="set-label-text"){ state.label.text=el.value; LS.set("treesh_label",state.label); applyLabelStyle(); return; }
  if(act==="set-label-bg"){ state.label.bg=el.value; LS.set("treesh_label",state.label); applyLabelStyle(); return; }
  if(act==="set-label-border-color"){ state.label.borderColor=el.value; LS.set("treesh_label",state.label); applyLabelStyle(); return; }
  if(act==="perf-opt-custom-color"||act==="perf-opt-bg-color"||act==="perf-opt-pill-color"||act==="perf-opt-pill-border-color"){ const key=act==="perf-opt-bg-color"?"bgColor":act==="perf-opt-pill-color"?"pillColor":act==="perf-opt-pill-border-color"?"pillBorderColor":"customColor"; state.perfOpts[key]=el.value; savePerfOpts(); const lbl=el.closest("label"); if(lbl) lbl.style.background=el.value; const pv=document.getElementById("perf-preview"); if(pv){ pv.innerHTML=perfPreviewHtml(); icons(); } return; }
  if(act==="perf-opt-bg-opacity"||act==="perf-opt-pill-border-opacity"){ const key=act==="perf-opt-bg-opacity"?"bgOpacity":"pillBorderOpacity"; state.perfOpts[key]=+el.value; savePerfOpts(); const pv=document.getElementById("perf-preview"); if(pv){ pv.innerHTML=perfPreviewHtml(); icons(); } return; }
  if(act==="set-label-bg-opacity"){ state.label.bgA=+el.value; LS.set("treesh_label",state.label); applyLabelStyle(); return; }
  const S=state.instrum; if(!S) return; const p=S.project; const ti=+el.dataset.ti;
  if(act==="i-bpm"){ p.bpm=Math.max(40,Math.min(220,parseInt(el.value)||90)); document.querySelectorAll('[data-act="i-bpm"]').forEach(x=>{ if(x!==el) x.value=p.bpm; }); }
  else if(act==="i-swing"){ p.swing=+el.value; }
  else if(act==="i-master"){ p.master=+el.value; if(_iMaster) _iMaster.gain.value=p.master; }
  else if(act==="i-vol"){ if(p.tracks[ti]) p.tracks[ti].vol=+el.value; }
  else if(act==="i-note"){ if(p.tracks[ti]){ p.tracks[ti].note=el.value; iDeselectPreset(); iPushHistory(); } }
  else if(act==="i-name"){ p.name=el.value; }
});
/* commit slider/tempo tweaks to undo history when a gesture ends */
document.addEventListener("change", e=>{
  if(e.target && e.target.id==="i-import-input"){ const f=e.target.files&&e.target.files[0]; if(f) iImportData(f); e.target.value=""; return; }
  const el=e.target.closest("[data-act]"); if(!el) return; const act=el.dataset.act;

document.addEventListener("click", e=>{
  const t=e.target.closest("[data-act]"); if(!t) return; const act=t.dataset.act; const id=t.dataset.id;
  if(act && act.indexOf('lock-page-toggle-')===0){ togglePageLock(act.slice(17)); return; }
  switch(act){
    case "lock-setup": openLockSetup(false); break;
    case "lock-change": openLockSetup(true); break;
    case "lock-remove": lockRemove(); break;
    case "lock-toggle-app": toggleAppLock(); break;
    case "lock-setup-type": if(state._lockSetup){ state._lockSetup.type=t.dataset.t; renderLockSetupModal(); } break;
    case "lock-setup-next": if(state._lockSetup){ state._lockSetup.step='cred'; state._lockSetup.err=''; renderLockSetupModal(); } break;
    case "lock-setup-back": if(state._lockSetup){ state._lockSetup.step='type'; state._lockSetup.err=''; renderLockSetupModal(); } break;
    case "lock-setup-save": lockSetupSave(); break;
    case "lock-key": lockKeyPress(t.dataset.d); break;
    case "lock-back": lockBackspace(); break;
    case "lock-submit": lockSubmit(); break;
    case "lock-toggle-show": state._lockShow=!state._lockShow; renderLockScreen(); break;
    case "lock-cancel": closeLockScreen(()=>navigate('library')); break;
    case "nav": navigate(t.dataset.view); break;
    case "nav-view": navigate(t.dataset.view); break;
    case "view-all-picks": navigate("picks"); break;
    case "perf-artist": openPerfMenu(t.dataset.name, t.dataset.id||null); break;
    case "song-facts": openSongFacts(t.dataset.name, t.dataset.id||null); break;
    case "play-song": { const s=SONG_BY_ID[id]; if(s){ closeModal(); playSong(s,[s]); } break; }
    case "perf-mode-toggle": { state.perfMode=!state.perfMode; LS.set("treesh_perf",state.perfMode); applyPerfMode(); toast(state.perfMode?"Performance mode on":"Performance mode off"); renderView(); break; }
    case "perf-opt-show": { state.perfOpts.show=!state.perfOpts.show; savePerfOpts(); const pc=$("#perf-controls"); if(pc) pc.classList.toggle("opacity-40",!state.perfOpts.show); if(pc) pc.classList.toggle("pointer-events-none",!state.perfOpts.show); const btn=$('#perf-show-toggle'); if(btn) btn.setAttribute("aria-checked",state.perfOpts.show); renderView(); break; }
    case "perf-opt-size": { state.perfOpts.size=t.dataset.val; savePerfOpts(); refreshPerfSettings(); break; }
    case "perf-opt-layout": { state.perfOpts.layout=t.dataset.val; savePerfOpts(); refreshPerfSettings(); break; }
    case "perf-opt-scheme": { state.perfOpts.scheme=t.dataset.val; savePerfOpts(); refreshPerfSettings(); break; }
    case "perf-opt-rolepos": { state.perfOpts.rolePos=t.dataset.val; savePerfOpts(); refreshPerfSettings(); break; }
    case "perf-opt-pos": { state.perfOpts.pos=t.dataset.val; savePerfOpts(); refreshPerfSettings(); break; }
    case "perf-opt-pill-border": { state.perfOpts.pillBorder=!state.perfOpts.pillBorder; savePerfOpts(); refreshPerfSettings(); break; }
    case "perf-opt-reset": { state.perfOpts={show:true, size:"md", scheme:"accent", layout:"pill", pos:"top", rolePos:"inline", customColor:"#c3ab69", bgColor:"#000000", pillColor:"#ffffff", bgOpacity:0.5, pillBorder:false, pillBorderColor:"#ffffff", pillBorderOpacity:1}; savePerfOpts(); refreshPerfSettings(); toast("Performer options reset"); break; }
    case "toggle-anim-bg": { state.animBg=!state.animBg; LS.set("treesh_anim_bg",state.animBg); applyUiPrefs(); toast(state.animBg?"Animated background on":"Animated background off"); renderView(); break; }
    case "toggle-ui-glow": { state.uiGlow=!state.uiGlow; LS.set("treesh_ui_glow",state.uiGlow); applyUiPrefs(); toast(state.uiGlow?"Interface glow on":"Interface glow off"); renderView(); break; }
    case "toggle-explain-auto": { state.explainAuto=!state.explainAuto; LS.set("treesh_explain_auto",state.explainAuto); toast(state.explainAuto?"Lyric meanings will auto-show":"Auto-show meanings off"); renderView(); if(state.npOpen) renderNP(); break; }

    case "viz-toggle-opt": { state.viz[t.dataset.opt]=!state.viz[t.dataset.opt]; LS.set("treesh_viz",state.viz); renderView(); break; }
    case "toggle-npviz": { state.npViz=!state.npViz; renderNP(); break; }
    case "instrum-start": instrumStart(); break;
    case "i-play": { const S=state.instrum; if(S){ S.playing?iStop():iPlay(); } break; }

    case "i-solo": { const tr=state.instrum&&state.instrum.project.tracks[+t.dataset.ti]; if(tr){ tr.solo=!tr.solo; iPushHistory(); renderInstrum(); } break; }

    case "i-save": iCloseMenu(); iSaveCurrent(); break;
