<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Treesh Blog — Post Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Special+Gothic+Expanded+One&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet" />
    <style>
        /* ===== Reset & Base ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --treesh-bg: #0a0a0b;
            --treesh-card: rgba(255, 255, 255, 0.045);
            --treesh-border: rgba(255, 255, 255, 0.08);
            --treesh-purple: #9328ff;
            --treesh-purple-soft: rgba(147, 40, 255, 0.2);
            --treesh-gold: #c3ab69;
            --treesh-text: #f0f0f5;
            --treesh-text-dim: rgba(255, 255, 255, 0.55);
            --treesh-shadow: 0 18px 60px rgba(0, 0, 0, 0.55);
            --treesh-glow: 0 0 0 1px rgba(147, 40, 255, 0.28), 0 0 28px rgba(147, 40, 255, 0.24);
            --font-stack: 'Manrope', system-ui, sans-serif;
        }

        body {
            background: var(--treesh-bg);
            color: var(--treesh-text);
            font-family: var(--font-stack);
            line-height: 1.6;
            padding: 1.5rem;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        /* ===== Background Blobs (same as blog) ===== */
        .bg-layer {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .bg-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            will-change: transform, opacity;
            animation: blobFloat 16s ease-in-out infinite alternate;
        }
        .bg-blob-1 {
            width: 60vh;
            height: 60vh;
            left: -10%;
            top: -8%;
            background: var(--treesh-purple);
            opacity: 0.25;
            animation-duration: 18s;
        }
        .bg-blob-2 {
            width: 50vh;
            height: 50vh;
            right: -8%;
            top: 30%;
            background: var(--treesh-gold);
            opacity: 0.15;
            animation-duration: 22s;
            animation-delay: -3s;
        }
        .bg-blob-3 {
            width: 70vh;
            height: 70vh;
            left: 10%;
            bottom: -15%;
            background: var(--treesh-purple);
            opacity: 0.18;
            animation-duration: 20s;
            animation-delay: -6s;
        }
        @keyframes blobFloat {
            0% {
                transform: translate(0, 0) scale(1) rotate(0deg);
            }
            33% {
                transform: translate(8%, -6%) scale(1.08) rotate(5deg);
            }
            66% {
                transform: translate(-6%, 10%) scale(0.95) rotate(-3deg);
            }
            100% {
                transform: translate(4%, -4%) scale(1.04) rotate(4deg);
            }
        }
        .bg-layer::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='1' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.035'/%3E%3C/svg%3E");
            opacity: 0.5;
            pointer-events: none;
        }

        .app-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            max-width: 1600px;
            margin: 0 auto;
            align-items: start;
            position: relative;
            z-index: 1;
        }

        @media (max-width: 1024px) {
            .app-layout {
                grid-template-columns: 1fr;
            }
        }

        /* ===== Form Panel ===== */
        .form-panel {
            background: var(--treesh-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--treesh-border);
            border-radius: 24px;
            padding: 1.8rem 1.8rem 2.2rem;
            box-shadow: var(--treesh-shadow);
            max-height: 90vh;
            overflow-y: auto;
            position: sticky;
            top: 1rem;
        }
        .form-panel::-webkit-scrollbar {
            width: 6px;
        }
        .form-panel::-webkit-scrollbar-thumb {
            background: var(--treesh-purple-soft);
            border-radius: 10px;
        }

        .form-panel .gen-header {
            font-family: 'Special Gothic Expanded One', var(--font-stack);
            font-size: 1.4rem;
            letter-spacing: 0.02em;
            margin-bottom: 0.2rem;
        }
        .form-panel .gen-sub {
            color: var(--treesh-text-dim);
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
        }

        .gen-group {
            margin-bottom: 1.2rem;
        }
        .gen-group label {
            display: block;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--treesh-text-dim);
            margin-bottom: 0.25rem;
        }
        .gen-group .gen-hint {
            font-size: 0.7rem;
            color: var(--treesh-text-dim);
            opacity: 0.6;
            margin-top: 0.15rem;
        }

        .gen-control {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--treesh-border);
            border-radius: 12px;
            padding: 0.6rem 0.9rem;
            color: var(--treesh-text);
            font-family: var(--font-stack);
            font-size: 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .gen-control:focus {
            outline: none;
            border-color: var(--treesh-purple);
            box-shadow: 0 0 0 3px var(--treesh-purple-soft);
        }
        .gen-control::placeholder {
            color: var(--treesh-text-dim);
            opacity: 0.35;
        }
        textarea.gen-control {
            resize: vertical;
            min-height: 60px;
        }

        .gen-inline {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .gen-inline .gen-group {
            flex: 1;
            min-width: 140px;
        }

        /* ===== Toolbar ===== */
        .gen-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.2rem;
            margin-bottom: 0.4rem;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            padding: 0.3rem 0.5rem;
            border: 1px solid var(--treesh-border);
        }
        .gen-toolbar button {
            background: transparent;
            border: none;
            color: var(--treesh-text-dim);
            font-size: 0.8rem;
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            font-family: var(--font-stack);
            white-space: nowrap;
        }
        .gen-toolbar button:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--treesh-text);
        }
        .gen-toolbar .sep {
            width: 1px;
            background: var(--treesh-border);
            margin: 0 0.15rem;
        }

        /* ===== Sections ===== */
        .gen-sections {
            margin-top: 0.5rem;
        }
        .gen-section-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--treesh-border);
            border-radius: 14px;
            padding: 1rem 1rem 0.8rem;
            margin-bottom: 0.8rem;
            transition: border-color 0.2s;
        }
        .gen-section-item:hover {
            border-color: rgba(255, 255, 255, 0.15);
        }
        .gen-section-item .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.6rem;
        }
        .gen-section-item .section-header .section-title {
            font-weight: 700;
            font-size: 0.9rem;
        }
        .gen-section-item .section-header .section-actions {
            display: flex;
            gap: 0.3rem;
        }
        .gen-section-item .section-header .section-actions button {
            background: transparent;
            border: none;
            color: var(--treesh-text-dim);
            cursor: pointer;
            padding: 0.1rem 0.4rem;
            border-radius: 6px;
            font-size: 0.9rem;
            transition: background 0.15s, color 0.15s;
        }
        .gen-section-item .section-header .section-actions button:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--treesh-text);
        }
        .gen-section-item .section-header .section-actions .del-btn:hover {
            color: #ff6b6b;
        }
        .gen-section-item .gen-group {
            margin-bottom: 0.6rem;
        }
        .gen-section-item .gen-group label {
            font-size: 0.6rem;
        }
        .gen-section-item .gen-group .gen-control {
            font-size: 0.85rem;
            padding: 0.4rem 0.7rem;
        }
        .gen-section-item .gen-group textarea.gen-control {
            min-height: 40px;
        }
        .gen-section-item .badge-group {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
            align-items: center;
        }
        .gen-section-item .badge-group input {
            flex: 1;
            min-width: 100px;
        }
        .gen-section-item .badge-group .badge-preview {
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 0.15rem 0.6rem;
            border-radius: 100px;
            background: var(--treesh-purple-soft);
            color: var(--treesh-purple);
            border: 1px solid rgba(147, 40, 255, 0.25);
            display: inline-block;
        }
        .gen-section-item .badge-group .badge-preview.gold {
            background: rgba(195, 171, 105, 0.15);
            color: var(--treesh-gold);
            border-color: rgba(195, 171, 105, 0.25);
        }
        .gen-section-item .readmore-check {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: var(--treesh-text-dim);
            margin-top: 0.3rem;
        }
        .gen-section-item .readmore-check input[type="checkbox"] {
            appearance: none;
            width: 16px;
            height: 16px;
            border: 2px solid var(--treesh-border);
            border-radius: 4px;
            background: transparent;
            cursor: pointer;
            flex-shrink: 0;
        }
        .gen-section-item .readmore-check input[type="checkbox"]:checked {
            background: var(--treesh-purple);
            border-color: var(--treesh-purple);
        }
        .gen-section-item .readmore-check input[type="checkbox"]:checked::after {
            content: "✓";
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .gen-add-section {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px dashed var(--treesh-border);
            border-radius: 14px;
            padding: 0.8rem;
            color: var(--treesh-text-dim);
            font-family: var(--font-stack);
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }
        .gen-add-section:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--treesh-purple);
            color: var(--treesh-text);
        }

        /* ===== Form Actions ===== */
        .gen-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid var(--treesh-border);
        }
        .btn-primary {
            background: var(--treesh-purple);
            color: #fff;
            border: none;
            padding: 0.6rem 1.8rem;
            border-radius: 100px;
            font-weight: 700;
            font-family: var(--font-stack);
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: var(--treesh-glow);
            transition: transform 0.15s, box-shadow 0.2s;
        }
        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 0 0 1px rgba(147, 40, 255, 0.5), 0 0 40px rgba(147, 40, 255, 0.35);
        }
        .btn-secondary {
            background: transparent;
            color: var(--treesh-text);
            border: 1px solid var(--treesh-border);
            padding: 0.6rem 1.4rem;
            border-radius: 100px;
            font-weight: 600;
            font-family: var(--font-stack);
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.2);
        }
        .btn-success {
            background: #2b9e5c;
            color: #fff;
            border: none;
            padding: 0.6rem 1.8rem;
            border-radius: 100px;
            font-weight: 700;
            font-family: var(--font-stack);
            font-size: 0.9rem;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s;
        }
        .btn-success:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(43, 158, 92, 0.3);
        }
        .btn-danger {
            background: transparent;
            color: #ff6b6b;
            border: 1px solid rgba(255, 107, 107, 0.3);
            padding: 0.6rem 1.4rem;
            border-radius: 100px;
            font-weight: 600;
            font-family: var(--font-stack);
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }
        .btn-danger:hover {
            background: rgba(255, 107, 107, 0.1);
            border-color: rgba(255, 107, 107, 0.5);
        }

        /* ===== Preview Panel ===== */
        .preview-panel {
            background: var(--treesh-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--treesh-border);
            border-radius: 24px;
            padding: 1.8rem 2rem 2rem;
            box-shadow: var(--treesh-shadow);
        }
        .preview-panel .preview-header {
            font-family: 'Special Gothic Expanded One', var(--font-stack);
            font-size: 1.2rem;
            letter-spacing: 0.02em;
            margin-bottom: 0.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .preview-panel .preview-sub {
            color: var(--treesh-text-dim);
            font-size: 0.8rem;
            margin-bottom: 1.2rem;
        }
        .preview-panel .preview-actions {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
        }
        .preview-panel .preview-actions .btn-sm {
            padding: 0.3rem 1.2rem;
            font-size: 0.8rem;
        }

        .preview-iframe-wrap {
            position: relative;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--treesh-border);
            background: var(--treesh-bg);
        }
        .preview-iframe-wrap iframe {
            display: block;
            width: 100%;
            height: 75vh;
            border: none;
            background: var(--treesh-bg);
        }

        /* ===== Copy feedback ===== */
        .copy-feedback {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--treesh-card);
            backdrop-filter: blur(24px);
            border: 1px solid var(--treesh-border);
            border-radius: 16px;
            padding: 0.8rem 1.8rem;
            color: var(--treesh-text);
            font-weight: 600;
            box-shadow: var(--treesh-shadow);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s, transform 0.3s;
            z-index: 999;
        }
        .copy-feedback.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===== Responsive ===== */
        @media (max-width: 1024px) {
            .form-panel {
                position: static;
                max-height: none;
            }
        }
        @media (max-width: 600px) {
            body {
                padding: 0.8rem;
            }
            .form-panel,
            .preview-panel {
                padding: 1.2rem 1rem;
            }
            .gen-inline {
                flex-direction: column;
            }
            .preview-iframe-wrap iframe {
                height: 60vh;
            }
            .gen-toolbar button {
                font-size: 0.7rem;
                padding: 0.15rem 0.35rem;
            }
        }
    </style>
</head>
<body>

    <!-- ===== Background Layer ===== -->
    <div class="bg-layer" aria-hidden="true">
        <div class="bg-blob bg-blob-1"></div>
        <div class="bg-blob bg-blob-2"></div>
        <div class="bg-blob bg-blob-3"></div>
    </div>

    <!-- ===== Copy Feedback Toast ===== -->
    <div class="copy-feedback" id="copyFeedback">Copied to clipboard</div>

    <div class="app-layout">

        <!-- =========================================================
               FORM PANEL
               ========================================================= -->
        <div class="form-panel" id="formPanel">
            <div class="gen-header">✎ Blog Post Generator</div>
            <p class="gen-sub">Start from scratch — fill in the fields, preview, and copy the final HTML.</p>

            <!-- Post Meta -->
            <div class="gen-group">
                <label for="postTitle">Title</label>
                <input type="text" class="gen-control" id="postTitle" placeholder="e.g. Treesh 3.0" />
            </div>
            <div class="gen-group">
                <label for="postHighlight">Highlight word (gradient)</label>
                <input type="text" class="gen-control" id="postHighlight" placeholder="e.g. 3.0" />
            </div>
            <div class="gen-group">
                <label for="postSubtitle">Subtitle</label>
                <input type="text" class="gen-control" id="postSubtitle" placeholder="e.g. Music to Live For — now with more of everything" />
            </div>

            <div class="gen-inline">
                <div class="gen-group">
                    <label for="postDate">Date</label>
                    <input type="date" class="gen-control" id="postDate" />
                </div>
                <div class="gen-group">
                    <label for="postTime">Time</label>
                    <input type="time" class="gen-control" id="postTime" />
                </div>
                <div class="gen-group">
                    <label for="postTimezone">Timezone</label>
                    <input type="text" class="gen-control" id="postTimezone" placeholder="e.g. EST" value="EST" />
                </div>
            </div>

            <!-- Intro -->
            <div class="gen-group">
                <label for="postIntro">Intro</label>
                <div class="gen-toolbar" data-target="postIntro">
                    <button type="button" data-cmd="bold"><b>B</b></button>
                    <button type="button" data-cmd="italic"><i>I</i></button>
                    <button type="button" data-cmd="strike"><s>S</s></button>
                    <span class="sep"></span>
                    <button type="button" data-cmd="h1">H1</button>
                    <button type="button" data-cmd="h2">H2</button>
                    <button type="button" data-cmd="h3">H3</button>
                    <button type="button" data-cmd="h4">H4</button>
                    <span class="sep"></span>
                    <button type="button" data-cmd="blockquote">“</button>
                    <button type="button" data-cmd="code">⟨⟩</button>
                    <button type="button" data-cmd="inlinecode">`</button>
                    <span class="sep"></span>
                    <button type="button" data-cmd="link">🔗</button>
                    <button type="button" data-cmd="image">🖼</button>
                    <span class="sep"></span>
                    <button type="button" data-cmd="ul">• list</button>
                    <button type="button" data-cmd="ol">1. list</button>
                    <span class="sep"></span>
                    <button type="button" data-cmd="hr">—</button>
                    <button type="button" data-cmd="clear">✕</button>
                </div>
                <textarea class="gen-control" id="postIntro" rows="3" placeholder="Intro paragraph(s)…"></textarea>
            </div>

            <!-- Sections -->
            <div class="gen-group">
                <label>Post Sections</label>
                <p class="gen-hint">Each section becomes a glass card. Badges appear above the heading; use "gold" for gold style.</p>
                <div class="gen-sections" id="sectionsList">
                    <!-- Rendered by JS -->
                </div>
                <button class="gen-add-section" id="addSectionBtn">+ Add section</button>
            </div>

            <!-- Bottom Line / CTA -->
            <div class="gen-group">
                <label for="bottomHeading">Bottom line heading</label>
                <input type="text" class="gen-control" id="bottomHeading" placeholder="e.g. Bottom Line" />
            </div>
            <div class="gen-group">
                <label for="bottomText">Bottom line text</label>
                <textarea class="gen-control" id="bottomText" rows="2" placeholder="Closing statement…"></textarea>
            </div>
            <div class="gen-inline">
                <div class="gen-group">
                    <label for="ctaText">CTA button text</label>
                    <input type="text" class="gen-control" id="ctaText" placeholder="e.g. → treesh.app" />
                </div>
                <div class="gen-group">
                    <label for="ctaUrl">CTA URL</label>
                    <input type="text" class="gen-control" id="ctaUrl" placeholder="https://treesh.app" />
                </div>
            </div>

            <!-- Form Actions -->
            <div class="gen-actions">
                <button class="btn-primary" id="previewBtn">Preview</button>
                <button class="btn-success" id="copyHtmlBtn">Copy HTML</button>
                <button class="btn-danger" id="clearBtn">Start fresh</button>
            </div>
        </div>

        <!-- =========================================================
               PREVIEW PANEL (iframe)
               ========================================================= -->
        <div class="preview-panel">
            <div class="preview-header">
                <span>Preview</span>
                <span class="preview-actions">
                    <button class="btn-secondary btn-sm" id="refreshPreviewBtn">⟳ Refresh</button>
                </span>
            </div>
            <p class="preview-sub">This preview renders exactly as the post will appear on the blog.</p>
            <div class="preview-iframe-wrap">
                <iframe id="previewIframe" srcdoc="<html><body style='background:#0a0a0b;color:#f0f0f5;font-family:Manrope,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;padding:2rem;'><p style='color:rgba(255,255,255,0.3);font-size:1.2rem;text-align:center;'>Fill out the form and click Preview.</p></body></html>"></iframe>
            </div>
        </div>

    </div>

    <!-- =========================================================
           JAVASCRIPT
           ========================================================= -->
    <script>
        (function() {
            'use strict';

            // ---- State ----
            const state = {
                sections: []
            };

            // ---- DOM refs ----
            const sectionsList = document.getElementById('sectionsList');
            const addSectionBtn = document.getElementById('addSectionBtn');
            const previewIframe = document.getElementById('previewIframe');
            const copyFeedback = document.getElementById('copyFeedback');

            // ---- Markdown tool definitions ----
            const MARKDOWN_TOOLS = {
                bold: { prefix: '**', suffix: '**', label: 'bold' },
                italic: { prefix: '*', suffix: '*', label: 'italic' },
                strike: { prefix: '~~', suffix: '~~', label: 'strikethrough' },
                h1: { prefix: '# ', suffix: '', label: 'heading 1' },
                h2: { prefix: '## ', suffix: '', label: 'heading 2' },
                h3: { prefix: '### ', suffix: '', label: 'heading 3' },
                h4: { prefix: '#### ', suffix: '', label: 'heading 4' },
                blockquote: { prefix: '> ', suffix: '', label: 'blockquote' },
                code: { prefix: '```\n', suffix: '\n```', label: 'code block' },
                inlinecode: { prefix: '`', suffix: '`', label: 'inline code' },
                link: { prefix: '[', suffix: '](url)', label: 'link' },
                image: { prefix: '![', suffix: '](image-url)', label: 'image' },
                ul: { prefix: '- ', suffix: '', label: 'bullet list' },
                ol: { prefix: '1. ', suffix: '', label: 'numbered list' },
                hr: { prefix: '\n---\n', suffix: '', label: 'horizontal rule' },
                clear: { prefix: '', suffix: '', label: 'clear', clear: true }
            };

            // ---- Apply markdown formatting to a textarea ----
            function applyMarkdown(textarea, cmd) {
                if (!textarea) return;
                const start = textarea.selectionStart;
                const end = textarea.selectionEnd;
                const selected = textarea.value.substring(start, end);
                const tool = MARKDOWN_TOOLS[cmd];
                if (!tool) return;

                if (tool.clear) {
                    // Clear formatting: remove markdown from selected text
                    if (selected) {
                        let cleaned = selected
                            .replace(/\*\*(.+?)\*\*/g, '$1')
                            .replace(/\*(.+?)\*/g, '$1')
                            .replace(/~~(.+?)~~/g, '$1')
                            .replace(/`(.+?)`/g, '$1')
                            .replace(/```\n?(.+?)\n?```/g, '$1')
                            .replace(/^#+ /gm, '')
                            .replace(/^> /gm, '')
                            .replace(/^-\s+/gm, '')
                            .replace(/^\d+\.\s+/gm, '')
                            .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
                            .replace(/!\[([^\]]+)\]\([^)]+\)/g, '$1');
                        textarea.value = textarea.value.substring(0, start) + cleaned + textarea.value.substring(end);
                        const newPos = start + cleaned.length;
                        textarea.selectionStart = textarea.selectionEnd = newPos;
                        textarea.focus();
                        textarea.dispatchEvent(new Event('input'));
                    }
                    return;
                }

                // For heading/list/blockquote: if line-based, apply to current line(s)
                if (['h1', 'h2', 'h3', 'h4', 'blockquote', 'ul', 'ol'].includes(cmd)) {
                    const before = textarea.value.substring(0, start);
                    const after = textarea.value.substring(end);
                    const lineStart = before.lastIndexOf('\n') + 1;
                    const lineEnd = after.indexOf('\n') + end;
                    const fullText = textarea.value;
                    const selectedLines = fullText.substring(lineStart, lineEnd);
                    const lines = selectedLines.split('\n').filter(l => l.trim() || l === '');
                    let replacement = '';
                    if (cmd === 'ul') {
                        replacement = lines.map(l => l.trim() ? '- ' + l.replace(/^[-*]\s+/, '') : '').join('\n');
                    } else if (cmd === 'ol') {
                        replacement = lines.map((l, i) => l.trim() ? (i + 1) + '. ' + l.replace(/^\d+\.\s+/, '') : '')
                        .join('\n');
                    } else {
                        const prefix = tool.prefix;
                        replacement = lines.map(l => l.trim() ? prefix + l.replace(new RegExp('^' + prefix), '') : '')
                            .join('\n');
                    }
                    textarea.value = fullText.substring(0, lineStart) + replacement + fullText.substring(lineEnd);
                    const newPos = lineStart + replacement.length;
                    textarea.selectionStart = textarea.selectionEnd = newPos;
                    textarea.focus();
                    textarea.dispatchEvent(new Event('input'));
                    return;
                }

                // For code block: handle multi-line
                if (cmd === 'code') {
                    if (selected) {
                        const lines = selected.split('\n');
                        if (lines.length > 1 || selected.includes('\n')) {
                            const replacement = '```\n' + selected + '\n```';
                            textarea.value = textarea.value.substring(0, start) + replacement + textarea.value.substring(
                            end);
                            const newPos = start + replacement.length;
                            textarea.selectionStart = textarea.selectionEnd = newPos;
                            textarea.focus();
                            textarea.dispatchEvent(new Event('input'));
                            return;
                        }
                    }
                }

                // Default: wrap selection
                let replacement = tool.prefix + selected + tool.suffix;
                if (cmd === 'link' && !selected) {
                    replacement = '[Link text](url)';
                }
                if (cmd === 'image' && !selected) {
                    replacement = '![Alt text](image-url)';
                }
                if (cmd === 'hr') {
                    replacement = '\n---\n';
                    // Insert at cursor position
                    textarea.value = textarea.value.substring(0, start) + replacement + textarea.value.substring(end);
                    const newPos = start + replacement.length;
                    textarea.selectionStart = textarea.selectionEnd = newPos;
                    textarea.focus();
                    textarea.dispatchEvent(new Event('input'));
                    return;
                }

                textarea.value = textarea.value.substring(0, start) + replacement + textarea.value.substring(end);
                const cursorOffset = tool.prefix.length;
                const newPos = start + replacement.length - (selected ? 0 : cursorOffset);
                textarea.selectionStart = textarea.selectionEnd = Math.min(newPos, textarea.value.length);
                textarea.focus();
                textarea.dispatchEvent(new Event('input'));
            }

            // ---- Wire up toolbars ----
            function wireToolbar(toolbar, textarea) {
                if (!toolbar || !textarea) return;
                toolbar.querySelectorAll('[data-cmd]').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.preventDefault();
                        applyMarkdown(textarea, this.dataset.cmd);
                    });
                });
            }

            // ---- Render sections in the form ----
            function renderSections() {

                                <label>Badges (comma separated, use "gold" for gold style)</label>
                                <div class="badge-group">

                                    <span class="badge-preview-wrap">${badgePreview}</span>
                                </div>
                            </div>
                            <div class="gen-group">
                                <label>Content</label>
                                <div class="gen-toolbar section-toolbar" data-target="section-${idx}">
                                    <button type="button" data-cmd="bold"><b>B</b></button>
                                    <button type="button" data-cmd="italic"><i>I</i></button>
                                    <button type="button" data-cmd="strike"><s>S</s></button>
                                    <span class="sep"></span>
                                    <button type="button" data-cmd="h1">H1</button>
                                    <button type="button" data-cmd="h2">H2</button>
                                    <button type="button" data-cmd="h3">H3</button>
                                    <button type="button" data-cmd="h4">H4</button>
                                    <span class="sep"></span>
                                    <button type="button" data-cmd="blockquote">“</button>
                                    <button type="button" data-cmd="code">⟨⟩</button>
                                    <button type="button" data-cmd="inlinecode">`</button>

                                    <button type="button" data-cmd="link">🔗</button>
                                    <button type="button" data-cmd="image">🖼</button>
                                    <span class="sep"></span>
                                    <button type="button" data-cmd="ul">• list</button>
                                    <button type="button" data-cmd="ol">1. list</button>
                                    <span class="sep"></span>
                                    <button type="button" data-cmd="hr">—</button>
                                    <button type="button" data-cmd="clear">✕</button>
                                </div>
                                <textarea class="gen-control section-content" rows="4" data-idx="${idx}" placeholder="Content…">${escAttr(sec.content || '')}</textarea>
                            </div>
                            <div class="readmore-check">
                                <input type="checkbox" class="section-readmore" data-idx="${idx}" ${sec.readMore ? 'checked' : ''} />
                                <label>Include in "Read more" section</label>

                        </div>
                    `;
                });
                sectionsList.innerHTML = html;

                // Wire up toolbars for each section
                document.querySelectorAll('.section-toolbar').forEach((toolbar, idx) => {
                    const textarea = document.querySelector(`.section-content[data-idx="${idx}"]`);
                    wireToolbar(toolbar, textarea);

                bindSectionEvents();

            // ---- HTML escaping for form values ----
            function escAttr(str) {
                if (!str) return '';
                return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            }

            // ---- Escape for JS string ----
            function escJs(str) {
                if (!str) return '';
                return str.replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\n/g, '\\n');
            }

            // ---- Slugify ----
            function slugify(text) {
                if (!text) return 'section-' + Date.now().toString(36);
                return text
                    .toLowerCase()
                    .replace(/[^a-z0-9\s-]/g, '')
                    .replace(/\s+/g, '-')
                    .replace(/-+/g, '-');
            }

            // ---- Bind section events ----
            function bindSectionEvents() {
                // Move up
                document.querySelectorAll('.move-up').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const idx = parseInt(this.dataset.idx);
                        if (idx > 0) {
                            [state.sections[idx], state.sections[idx - 1]] = [state.sections[idx - 1], state
                                .sections[idx]];
                            renderSections();
                            updatePreview();
                        }
                    });
                });

                // Move down
                document.querySelectorAll('.move-down').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const idx = parseInt(this.dataset.idx);
                        if (idx < state.sections.length - 1) {
                            [state.sections[idx], state.sections[idx + 1]] = [state.sections[idx + 1], state
                                .sections[idx]];
                            renderSections();
                            updatePreview();
                        }
                    });
                });

                // Delete
                document.querySelectorAll('.del-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const idx = parseInt(this.dataset.idx);
                        if (state.sections.length <= 1) {
                            alert('You need at least one section.');
                            return;
                        }
                        if (confirm(`Delete section "${state.sections[idx].heading || 'Untitled'}"?`)) {
                            state.sections.splice(idx, 1);
                            renderSections();
                            updatePreview();
                        }
                    });
                });

                // Input events
                document.querySelectorAll('.section-heading').forEach(inp => {
                    inp.addEventListener('input', function() {
                        const idx = parseInt(this.dataset.idx);
                        state.sections[idx].heading = this.value;
                        if (!state.sections[idx].id || state.sections[idx].id === '') {
                            state.sections[idx].id = slugify(this.value);
                            const idField = document.querySelector(`.section-id[data-idx="${idx}"]`);
                            if (idField) idField.value = state.sections[idx].id;
                        }
                        const header = this.closest('.gen-section-item').querySelector('.section-title');
                        if (header) header.textContent = this.value || 'Untitled';
                        updatePreview();
                    });
                });

                document.querySelectorAll('.section-id').forEach(inp => {
                    inp.addEventListener('input', function() {
                        const idx = parseInt(this.dataset.idx);
                        state.sections[idx].id = this.value.trim() || slugify(state.sections[idx].heading || '');
                        updatePreview();
                    });
                });

                document.querySelectorAll('.section-badges').forEach(inp => {
                    inp.addEventListener('input', function() {
                        const idx = parseInt(this.dataset.idx);
                        const raw = this.value;
                        state.sections[idx].badges = raw.split(',').map(s => s.trim()).filter(Boolean);
                        const wrap = this.closest('.badge-group').querySelector('.badge-preview-wrap');
                        const isGold = state.sections[idx].badges.includes('gold');
                        const filtered = state.sections[idx].badges.filter(b => b !== 'gold');
                        if (filtered.length) {
                            wrap.innerHTML =
                                `<span class="badge-preview${isGold ? ' gold' : ''}">${filtered.join(' ')}</span>`;
                        } else {
                            wrap.innerHTML = '';
                        }
                        updatePreview();
                    });
                });

                document.querySelectorAll('.section-content').forEach(inp => {
                    inp.addEventListener('input', function() {
                        const idx = parseInt(this.dataset.idx);
                        state.sections[idx].content = this.value;
                        updatePreview();
                    });
                });

                document.querySelectorAll('.section-readmore').forEach(chk => {
                    chk.addEventListener('change', function() {
                        const idx = parseInt(this.dataset.idx);
                        state.sections[idx].readMore = this.checked;
                        updatePreview();
                    });
                });
            }

            // ---- Markdown to HTML converter ----
            function renderMarkdown(text) {
                if (!text) return '';
                let html = text;
                // Code blocks first
                html = html.replace(/```\n?([\s\S]*?)\n?```/g, '<pre><code>$1</code></pre>');
                // Inline code
                html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
                // Bold
                html = html.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
                // Italic
                html = html.replace(/\*(.+?)\*/g, '<i>$1</i>');
                // Strikethrough
                html = html.replace(/~~(.+?)~~/g, '<s>$1</s>');
                // Links
                html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                // Images
                html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1" />');
                // Horizontal rule
                html = html.replace(/^---$/gm, '<hr />');
                // Headings
                html = html.replace(/^#### (.+)$/gm, '<h4>$1</h4>');
                html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
                html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
                html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
                // Blockquotes
                html = html.replace(/^> (.+)$/gm, '<blockquote><p>$1</p></blockquote>');
                // Lists: bullet
                html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
                html = html.replace(/((?:<li>.*<\/li>\s*)+)/g, function(match) {
                    if (match.includes('<ol>') || match.includes('<ul>')) return match;
                    return '<ul>' + match + '</ul>';
                });
                // Lists: numbered
                html = html.replace(/^(\d+)\. (.+)$/gm, '<li>$2</li>');
                html = html.replace(/((?:<li>.*<\/li>\s*)+)/g, function(match) {
                    if (match.includes('<ol>') || match.includes('<ul>')) return match;
                    if (match.includes('<ul>')) return match;
                    return '<ol>' + match + '</ol>';
                });
                // Clean up nested lists
                html = html.replace(/<ul>\s*<ul>/g, '<ul>');
                html = html.replace(/<\/ul>\s*<\/ul>/g, '</ul>');
                html = html.replace(/<ol>\s*<ol>/g, '<ol>');
                html = html.replace(/<\/ol>\s*<\/ol>/g, '</ol>');
                // Paragraphs: split by double newline
                html = html.split('\n\n').filter(p => p.trim()).map(p => {
                    // Skip if already wrapped in block-level tag
                    const trimmed = p.trim();
                    if (trimmed.startsWith('<') && (trimmed.startsWith('<h') || trimmed.startsWith('<p') ||
                            trimmed.startsWith('<ul') || trimmed.startsWith('<ol') || trimmed.startsWith(
                            '<blockquote') || trimmed.startsWith('<pre') || trimmed.startsWith('<hr'))) {
                        return p;
                    }
                    return `<p>${p}</p>`;
                }).join('');
                // Single newline → <br> (but only if not already wrapped)
                html = html.replace(/\n/g, '<br />');
                return html;
            }

            // ---- Generate the post HTML (for preview and export) ----
            function generatePostHTML() {
                const title = document.getElementById('postTitle').value.trim() || 'Untitled';
                const highlight = document.getElementById('postHighlight').value.trim() || '';
                const subtitle = document.getElementById('postSubtitle').value.trim() || '';
                const date = document.getElementById('postDate').value;
                const time = document.getElementById('postTime').value;
                const tz = document.getElementById('postTimezone').value.trim() || 'EST';
                let intro = document.getElementById('postIntro').value || '';
                const bottomHeading = document.getElementById('bottomHeading').value.trim() || 'Bottom Line';
                const bottomText = document.getElementById('bottomText').value || '';
                const ctaText = document.getElementById('ctaText').value.trim() || '→ treesh.app';
                const ctaUrl = document.getElementById('ctaUrl').value.trim() || 'https://treesh.app';

                // Build date string
                let dateStr = '';
                if (date) {
                    const d = new Date(date + 'T' + (time || '00:00'));
                    const options = { year: 'numeric', month: 'long', day: 'numeric' };
                    dateStr = d.toLocaleDateString('en-US', options);
                    if (time) {
                        const tParts = time.split(':');
                        let hrs = parseInt(tParts[0]);
                        const mins = tParts[1];
                        const ampm = hrs >= 12 ? 'PM' : 'AM';
                        hrs = hrs % 12 || 12;
                        dateStr += ` — ${hrs}:${mins} ${ampm} ${tz}`;
                    }
                }

                // Build sections
                let beforeSections = [];
                let afterSections = [];

                state.sections.forEach(sec => {
                    const id = sec.id || slugify(sec.heading || 'section');
                    const heading = sec.heading || 'Untitled';
                    const content = sec.content || '';
                    const badges = sec.badges || [];
                    const isGold = badges.includes('gold');
                    const filteredBadges = badges.filter(b => b !== 'gold');

                    const badgeHTML = filteredBadges.length ?
                        `<div style="display:flex; gap:0.6rem; flex-wrap:wrap; margin-bottom:0.2rem;">${filteredBadges.map(b => `<span class="badge${isGold ? ' gold' : ''}">${b}</span>`).join('')}</div>` :
                        '';

                    const glassClass = sec.readMore ? 'glass' : 'glass-strong';
                    const contentHTML = renderMarkdown(content);

                    const sectionHTML = `
                        <div class="${glassClass}" id="${id}">
                            ${badgeHTML}
                            <h2 style="margin-top:0.2rem;">${heading}</h2>
                            ${contentHTML}
                        </div>
                    `;

                    if (sec.readMore) {
                        afterSections.push(sectionHTML);
                    } else {
                        beforeSections.push(sectionHTML);
                    }
                });

                const beforeHTML = beforeSections.join('');
                const afterHTML = afterSections.join('');

                // TOC
                const tocLinks = state.sections.map(sec => {
                    const id = sec.id || slugify(sec.heading || 'section');
                    return `<a href="#${id}" class="toc-link">${sec.heading || 'Untitled'}</a>`;
                }).join('');

                const tocHTML = `
                    <div class="glass legend-toc visible">
                        <div class="legend-title">Jump to</div>
                        <div class="toc-grid">${tocLinks}</div>
                    </div>
                `;

                // Read more
                const readMoreHTML = afterSections.length ? `
                    <div class="read-more-wrap" id="readMoreWrap">
                        ${afterHTML}
                    </div>
                    <div style="text-align:center; margin:0.5rem 0 1.5rem;">
                        <button class="read-more-toggle" id="readMoreToggle" aria-expanded="false">Read more</button>
                    </div>
                ` : '';

                // Intro
                const introHTML = intro ? renderMarkdown(intro) : '';

                // Bottom
                const bottomHTML = `
                    <div class="glass-strong" style="text-align:center; padding:2.5rem 1.5rem; border:1px solid rgba(147,40,255,0.15);">
                        <h2 style="margin-top:0; font-size:2rem;">${bottomHeading}</h2>
                        <p style="font-size:1.1rem; max-width:600px; margin:0.5rem auto 1.8rem;">${bottomText}</p>
                        <p style="font-size:1.4rem; font-weight:700; margin-bottom:0.5rem;">3.0 is live. Go stream.</p>
                        <div style="display:flex; flex-wrap:wrap; justify-content:center; gap:0.8rem; margin-top:1rem;">
                            <a href="${ctaUrl}" class="cta">${ctaText}</a>
                            <span class="cta-outline" style="pointer-events:none;">Music to Live For.™</span>
                        </div>
                    </div>
                `;

                // Title
                const titleDisplay = highlight ? title.replace(highlight, `<span class="highlight">${highlight}</span>`) :
                title;

                return `
                    <div style="margin-bottom:1rem; padding-top:0.5rem;">
                        <div style="display:flex; align-items:center; gap:0.75rem; margin-bottom:1.5rem;">
                            <span style="background:var(--treesh-purple); width:8px; height:8px; border-radius:50%; display:inline-block; box-shadow:0 0 12px var(--treesh-purple);"></span>
                            <span style="font-size:0.7rem; font-weight:700; text-transform:uppercase; letter-spacing:0.12em; color:rgba(255,255,255,0.3);">Release Notes</span>
                        </div>
                        <h1 class="display-font glow-text">
                            ${titleDisplay}
                            <small>${subtitle}</small>
                        </h1>
                        <div class="divider"></div>
                    </div>

                    <div class="byline">
                        <div class="date">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                            <time datetime="${date}T${time||'00:00'}">${dateStr || 'Date TBD'}</time>
                        </div>
                        <div style="display:flex; gap:0.6rem; align-items:center;">
                            <span style="font-size:0.75rem; background:var(--treesh-purple-soft); padding:0.2rem 0.8rem; border-radius:100px; color:var(--treesh-purple);">3.0</span>
                        </div>
                    </div>

                    <div class="glass visible" style="margin-top:0.5rem;">
                        ${introHTML}
                    </div>

                    ${tocHTML}

                    <div id="postContent">
                        ${beforeHTML}
                        ${readMoreHTML}
                    </div>

                    ${bottomHTML}
                `;
            }

            // ---- Generate full standalone HTML ----
            function generateStandaloneHTML() {
                const postContent = generatePostHTML();

                // We need to embed the blog CSS + the post content
                // Grab the CSS from the current page's styles
                const styleTags = document.querySelectorAll('style');
                let css = '';
                styleTags.forEach(tag => {
                    css += tag.textContent + '\n';
                });

                // Add the blog-specific overrides
                const blogCSS = `

                        min-height: 100vh;
                    }
                    .container {

                    copyFeedback.classList.add('show');
                    setTimeout(() => copyFeedback.classList.remove('show'), 2500);
                }).catch(() => {
                    // Fallback

                    textarea.value = fullHTML;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);

                    setTimeout(() => copyFeedback.classList.remove('show'), 2500);
