<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Treesh · Blog Post Generator</title>
<meta name="description" content="Create beautiful Treesh blog posts. Write in markdown, preview live, export HTML." />
<meta name="theme-color" content="#0a0a0b" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Special+Gothic+Expanded+One&display=swap" rel="stylesheet">
<style>
  /* ====== Base tokens (from Treesh index) ====== */
  :root{
    --treesh-bg:#0a0a0b;
    --treesh-bg-1:#121214;
    --treesh-card:rgba(255,255,255,0.045);
    --treesh-border:rgba(255,255,255,0.10);
    --treesh-stroke:rgba(255,255,255,0.14);
    --treesh-purple:#9328ff;
    --treesh-purple-2:#b77aff;
    --treesh-purple-soft:rgba(147,40,255,0.22);
    --treesh-gold:#c3ab69;
    --treesh-text:#f0f0f5;
    --treesh-text-dim:rgba(255,255,255,0.62);
    --treesh-text-mute:rgba(255,255,255,0.42);
    --treesh-shadow:0 18px 60px rgba(0,0,0,0.55);
    --treesh-glow:0 0 0 1px rgba(147,40,255,0.28), 0 0 28px rgba(147,40,255,0.24);
    --font-sans:'Manrope',system-ui,sans-serif;
    --font-display:'Special Gothic Expanded One','Manrope',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--treesh-bg);
    color:var(--treesh-text);
    font-family:var(--font-sans);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    min-height:100vh;
  }
  ::selection{background:var(--treesh-purple-soft);color:#fff;}

  /* ====== Ambient blobs + noise ====== */
  .bg-layer{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
  .bg-blob{position:absolute;border-radius:50%;filter:blur(100px);will-change:transform;animation:blobFloat 20s ease-in-out infinite alternate;}
  .bg-blob-1{width:60vh;height:60vh;left:-12%;top:-10%;background:var(--treesh-purple);opacity:.28;}
  .bg-blob-2{width:55vh;height:55vh;right:-10%;top:35%;background:#5a1fa8;opacity:.22;animation-delay:-4s;}
  .bg-blob-3{width:70vh;height:70vh;left:20%;bottom:-25%;background:var(--treesh-purple);opacity:.18;animation-delay:-8s;}
  @keyframes blobFloat{
    0%{transform:translate(0,0) scale(1) rotate(0deg);}
    50%{transform:translate(6%,-4%) scale(1.08) rotate(4deg);}
    100%{transform:translate(-4%,6%) scale(.96) rotate(-3deg);}
  }
  .bg-layer::after{
    content:'';position:absolute;inset:0;pointer-events:none;opacity:.5;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='1' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
  }

  /* ====== Top bar ====== */
  .topbar{
    position:sticky;top:0;z-index:50;
    display:flex;align-items:center;justify-content:space-between;
    padding:1rem 1.4rem;
    background:rgba(10,10,11,0.55);
    backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
    border-bottom:1px solid var(--treesh-border);
  }
  .logo{font-family:var(--font-display);font-size:1.2rem;letter-spacing:.04em;color:var(--treesh-text);text-decoration:none;}
  .logo span{color:var(--treesh-purple);}
  .topbar .meta{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--treesh-text-mute);}

  /* ====== Layout ====== */
  .app{
    position:relative;z-index:1;
    display:grid;grid-template-columns:1fr;
    gap:1.5rem;
    padding:1.5rem 1.4rem 9rem;
    max-width:1600px;margin:0 auto;
  }
  @media(min-width:1024px){
    .app{
      grid-template-columns:1.05fr 1fr;
      padding:2rem 2rem 8rem;
      gap:2rem;
      align-items:start;
    }
    /* preview left, form right */
    .pane-preview{order:1;}
    .pane-form{order:2;}
  }

  /* ====== 3D Bubble form pane ====== */
  .pane{
    position:relative;
    border-radius:32px;
    padding:1.6rem;
    background:
      radial-gradient(120% 80% at 20% 0%, rgba(255,255,255,0.09), rgba(255,255,255,0.02) 50%),
      linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
    border:1px solid var(--treesh-stroke);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.14),
      inset 0 -30px 60px rgba(0,0,0,0.35),
      0 30px 80px rgba(0,0,0,0.55),
      0 0 0 1px rgba(147,40,255,0.06);
    backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  }
  .pane::before{
    content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:linear-gradient(180deg, rgba(255,255,255,0.14), transparent 40%);
    mix-blend-mode:screen;opacity:.55;
  }
  .pane-title{
    display:flex;align-items:center;justify-content:space-between;gap:.6rem;
    margin-bottom:1.2rem;
  }
  .pane-title h2{
    font-family:var(--font-display);font-weight:400;font-size:1rem;letter-spacing:.08em;text-transform:uppercase;
  }
  .pill{
    font-size:.62rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    padding:.28rem .7rem;border-radius:999px;
    background:var(--treesh-purple-soft);color:var(--treesh-purple);
    border:1px solid rgba(147,40,255,0.35);
  }

  /* ====== Bubble field ====== */
  .field{margin-bottom:1.1rem;}
  .field label{
    display:block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;
    color:var(--treesh-text-mute);margin-bottom:.5rem;padding-left:.2rem;
  }
  .bubble{
    position:relative;border-radius:20px;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02));
    border:1px solid rgba(255,255,255,0.10);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.18),
      inset 0 -14px 30px rgba(0,0,0,0.35),
      0 10px 24px rgba(0,0,0,0.35);
    transition:border-color .2s, box-shadow .25s, transform .2s;
  }
  .bubble:focus-within{
    border-color:rgba(147,40,255,0.55);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.22),
      inset 0 -14px 30px rgba(0,0,0,0.35),
      0 10px 30px rgba(147,40,255,0.22),
      0 0 0 4px rgba(147,40,255,0.10);
  }
  .bubble input, .bubble textarea, .bubble select{
    width:100%;border:none;outline:none;background:transparent;color:var(--treesh-text);
    font-family:var(--font-sans);font-size:.95rem;padding:.95rem 1.1rem;
    resize:none;
  }
  .bubble textarea{min-height:340px;line-height:1.6;font-size:.95rem;}
  .bubble input::placeholder,.bubble textarea::placeholder{color:var(--treesh-text-mute);}

  .row{display:grid;grid-template-columns:1fr;gap:1rem;}
  @media(min-width:640px){ .row.two{grid-template-columns:1fr 1fr;} }

  /* ====== Markdown toolbar ====== */
  .md-toolbar{
    display:flex;flex-wrap:wrap;gap:.35rem;
    padding:.5rem;margin-bottom:.5rem;border-radius:16px;
    background:linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
    border:1px solid rgba(255,255,255,0.08);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.12), inset 0 -8px 20px rgba(0,0,0,0.3);
  }
  .md-btn{
    display:inline-flex;align-items:center;justify-content:center;gap:.35rem;
    min-width:36px;height:34px;padding:0 .55rem;border-radius:10px;
    background:rgba(255,255,255,0.04);color:var(--treesh-text-dim);
    border:1px solid rgba(255,255,255,0.06);
    font-size:.82rem;font-weight:600;cursor:pointer;
    transition:all .18s ease;
  }
  .md-btn:hover{
    background:rgba(147,40,255,0.14);color:#fff;
    border-color:rgba(147,40,255,0.4);
    transform:translateY(-1px);
  }
  .md-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .md-sep{width:1px;background:rgba(255,255,255,0.08);margin:4px 4px;}

  /* ====== Tag input ====== */
  .tag-input{
    display:flex;flex-wrap:wrap;align-items:center;gap:.4rem;padding:.5rem .6rem;
  }
  .tag-input input{padding:.35rem .3rem;min-width:120px;flex:1;}
  .tag{
    display:inline-flex;align-items:center;gap:.35rem;
    font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
    padding:.28rem .6rem;border-radius:999px;
    background:var(--treesh-purple-soft);color:var(--treesh-purple);
    border:1px solid rgba(147,40,255,0.3);
  }
  .tag button{background:none;border:none;color:inherit;cursor:pointer;font-size:.9rem;line-height:1;}

  /* ====== Fixed action dock ====== */
  .dock{
    position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);
    z-index:90;
    display:flex;gap:.55rem;padding:.55rem;
    border-radius:999px;
    background:rgba(15,15,18,0.72);
    backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
    border:1px solid rgba(255,255,255,0.14);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.14),
      0 20px 50px rgba(0,0,0,0.55),
      0 0 0 1px rgba(147,40,255,0.08);
    max-width:calc(100vw - 1.6rem);
  }
  .dock-btn{
    display:inline-flex;align-items:center;gap:.5rem;
    padding:.85rem 1.25rem;border-radius:999px;
    font-family:var(--font-sans);font-weight:700;font-size:.86rem;letter-spacing:.02em;
    border:none;cursor:pointer;color:#fff;
    transition:transform .18s ease, box-shadow .2s ease, background .2s ease;
    white-space:nowrap;
  }
  .dock-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .dock-btn.primary{
    background:linear-gradient(135deg, var(--treesh-purple), #6a12c9);
    box-shadow:var(--treesh-glow), inset 0 1px 0 rgba(255,255,255,0.25);
  }
  .dock-btn.primary:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 0 0 1px rgba(147,40,255,0.55), 0 0 40px rgba(147,40,255,0.5), inset 0 1px 0 rgba(255,255,255,0.3);}
  .dock-btn.ghost{
    background:rgba(255,255,255,0.05);color:var(--treesh-text);
    border:1px solid rgba(255,255,255,0.10);
  }
  .dock-btn.ghost:hover{background:rgba(255,255,255,0.09);transform:translateY(-2px);}
  .dock-btn.danger{
    background:rgba(255,80,80,0.10);color:#ff9a9a;border:1px solid rgba(255,80,80,0.28);
  }
  .dock-btn.danger:hover{background:rgba(255,80,80,0.18);color:#fff;transform:translateY(-2px);}
  @media(max-width:520px){
    .dock-btn .lbl{display:none;}
    .dock-btn{padding:.85rem 1rem;}
  }

  /* ====== Toast ====== */
  .toast{
    position:fixed;left:50%;bottom:5.5rem;transform:translate(-50%, 12px);
    z-index:120;
    background:rgba(20,20,24,0.9);color:#fff;
    padding:.7rem 1.1rem;border-radius:999px;
    border:1px solid rgba(147,40,255,0.4);
    box-shadow:0 12px 30px rgba(0,0,0,0.5), 0 0 20px rgba(147,40,255,0.35);
    font-size:.82rem;font-weight:600;letter-spacing:.02em;
    opacity:0;pointer-events:none;
    transition:opacity .25s ease, transform .35s cubic-bezier(.22,1,.36,1);
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}

  /* ====== Preview overlay (mobile / animation source) ====== */
  .preview-modal{
    position:fixed;inset:0;z-index:80;
    background:rgba(6,6,8,0.72);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    opacity:0;pointer-events:none;
    transition:opacity .35s ease;
    display:flex;align-items:stretch;justify-content:center;
  }
  .preview-modal.open{opacity:1;pointer-events:auto;}
  .preview-sheet{
    position:relative;
    width:min(920px, 100%);
    margin:0;
    background:var(--treesh-bg);
    border-left:1px solid var(--treesh-border);
    box-shadow:-30px 0 80px rgba(0,0,0,0.6);
    overflow:hidden;
    display:flex;flex-direction:column;
    transform:translateX(60px) scale(.98);
    opacity:0;
    transition:transform .5s cubic-bezier(.22,1,.36,1), opacity .35s ease;
    margin-left:auto;
  }
  .preview-modal.open .preview-sheet{transform:translateX(0) scale(1);opacity:1;}
  .preview-close{
    position:absolute;top:1rem;right:1rem;z-index:5;
    width:38px;height:38px;border-radius:999px;
    background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14);
    color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background .2s, transform .2s;
  }
  .preview-close:hover{background:rgba(255,255,255,0.14);transform:rotate(90deg);}
  .preview-scroll{overflow:auto;flex:1;}

  /* ====== Desktop inline preview pane (blog design) ====== */
  .pane-preview{
    position:relative;
    border-radius:28px;
    overflow:hidden;
    border:1px solid var(--treesh-border);
    background:var(--treesh-bg);
    min-height:70vh;
    box-shadow:0 30px 80px rgba(0,0,0,0.55);
  }
  .pane-preview .preview-scroll{max-height:calc(100vh - 12rem);overflow:auto;}
  @media(max-width:1023px){
    .pane-preview{display:none;} /* only modal on mobile */
  }

  /* ====== BLOG PREVIEW styling (mirrors blog.html) ====== */
  .blog{
    max-width:760px;margin:0 auto;padding:2rem 1.5rem 4rem;position:relative;z-index:1;
    color:var(--treesh-text);
  }
  .blog .byline{
    display:flex;flex-wrap:wrap;gap:.6rem;justify-content:space-between;align-items:center;
    padding:.6rem 0;margin-bottom:1.4rem;
    border-bottom:1px solid var(--treesh-border);
    font-size:.82rem;color:var(--treesh-text-dim);
  }
  .blog h1.title{
    font-size:2.4rem;line-height:1.1;font-weight:800;letter-spacing:-.02em;margin-bottom:.4rem;
  }
  .blog h1.title .hl{
    background:linear-gradient(135deg, var(--treesh-purple), var(--treesh-purple-2));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  .blog .sub{color:var(--treesh-text-dim);font-size:1rem;margin-bottom:1.2rem;}
  .blog .glass-card{
    background:var(--treesh-card);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border:1px solid var(--treesh-border);border-radius:24px;
    padding:1.6rem 1.8rem;margin:1.4rem 0;
    box-shadow:var(--treesh-shadow);
  }
  .blog .divider{width:60px;height:3px;border-radius:10px;margin:1rem 0 .7rem;
    background:linear-gradient(90deg, var(--treesh-purple), transparent);}
  .blog h2{font-size:1.55rem;font-weight:700;margin:2rem 0 .5rem;letter-spacing:-.01em;}
  .blog h2 .gold{color:var(--treesh-gold);}
  .blog h3{font-size:1.15rem;font-weight:600;margin:1.2rem 0 .3rem;}
  .blog p,.blog li{color:var(--treesh-text-dim);line-height:1.7;margin:.6rem 0;}
  .blog a{color:var(--treesh-purple);font-weight:600;text-decoration:none;}
  .blog a:hover{color:var(--treesh-purple-2);text-decoration:underline;}
  .blog ul,.blog ol{padding-left:1.4rem;margin:.6rem 0 1rem;}
  .blog ul li{list-style:none;position:relative;padding-left:.4rem;}
  .blog ul li::before{content:"▹";color:var(--treesh-purple);font-weight:700;position:absolute;left:-1.2rem;}
  .blog blockquote{
    border-left:3px solid var(--treesh-purple);
    background:rgba(147,40,255,0.06);
    padding:.8rem 1.1rem;border-radius:0 14px 14px 0;
    margin:1rem 0;color:var(--treesh-text-dim);font-style:italic;
  }
  .blog img{max-width:100%;height:auto;border-radius:18px;margin:1rem 0;
    box-shadow:0 20px 50px rgba(0,0,0,0.5);border:1px solid var(--treesh-border);}
  .blog code{background:rgba(255,255,255,0.06);padding:.15rem .4rem;border-radius:6px;font-size:.9em;color:#e0c7ff;}
  .blog pre{background:#0f0f13;border:1px solid var(--treesh-border);border-radius:14px;padding:1rem;overflow:auto;margin:1rem 0;}
  .blog pre code{background:transparent;padding:0;color:#e6e6ee;}
  .blog .badge{
    display:inline-block;font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
    padding:.22rem .7rem;border-radius:100px;
    background:var(--treesh-purple-soft);color:var(--treesh-purple);
    border:1px solid rgba(147,40,255,0.3);margin:0 .3rem .3rem 0;
  }
  .blog hr{border:none;height:1px;background:var(--treesh-border);margin:2rem 0;}
  .blog .hero-img{margin:0 0 1.4rem;}

  /* ====== Blog preview ambient blobs (inside pane) ====== */
  .blog-bg{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
  .blog-bg .b{position:absolute;border-radius:50%;filter:blur(90px);opacity:.22;}
  .blog-bg .b1{width:40vh;height:40vh;left:-10%;top:-8%;background:var(--treesh-purple);}
  .blog-bg .b2{width:35vh;height:35vh;right:-10%;top:40%;background:#5a1fa8;opacity:.18;}

  /* Empty state */
  .empty{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:60vh;text-align:center;padding:2rem;color:var(--treesh-text-mute);
  }
  .empty .dot{
    width:64px;height:64px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%, var(--treesh-purple), transparent 70%);
    box-shadow:0 0 40px rgba(147,40,255,.5);margin-bottom:1rem;
  }

  /* scrollbar */
  .preview-scroll::-webkit-scrollbar{width:8px;}
  .preview-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.14);border-radius:999px;}

  /* image thumbs preview list */
  .thumbs{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.6rem;}
  .thumbs .t{
    position:relative;width:56px;height:56px;border-radius:12px;overflow:hidden;
    border:1px solid var(--treesh-border);background:#111;
  }
  .thumbs .t img{width:100%;height:100%;object-fit:cover;}
  .thumbs .t button{
    position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;
    background:rgba(0,0,0,.65);color:#fff;border:none;cursor:pointer;font-size:.7rem;line-height:1;
  }
</style>
</head>
<body>

<div class="bg-layer" aria-hidden="true">
  <div class="bg-blob bg-blob-1"></div>
  <div class="bg-blob bg-blob-2"></div>
  <div class="bg-blob bg-blob-3"></div>
</div>

<header class="topbar">
  <a class="logo" href="#">Tree<span>sh</span></a>
  <div class="meta">Blog Post Generator</div>
</header>

<main class="app">

  <!-- ===== Preview pane (desktop left) ===== -->
  <section class="pane-preview" aria-label="Live preview">
    <div class="blog-bg"><div class="b b1"></div><div class="b b2"></div></div>
    <div class="preview-scroll" id="previewScrollDesktop">
      <article class="blog" id="blogPreviewDesktop">
        <!-- filled by JS -->
      </article>
    </div>
  </section>

  <!-- ===== Form pane (desktop right) ===== -->
  <section class="pane pane-form" aria-label="Post form">
    <div class="pane-title">
      <h2>Compose · New Post</h2>
      <span class="pill">Draft</span>
    </div>

    <form id="postForm" onsubmit="return false;">
      <div class="row two">
        <div class="field">
          <label for="f-title">Title</label>
          <div class="bubble"><input id="f-title" placeholder="What's the drop?"/></div>
        </div>
        <div class="field">
          <label for="f-author">Author</label>
          <div class="bubble"><input id="f-author" placeholder="e.g. Treesh Editorial"/></div>
        </div>
      </div>

      <div class="row two">
        <div class="field">
          <label for="f-date">Date</label>
          <div class="bubble"><input id="f-date" type="date"/></div>
        </div>
        <div class="field">
          <label for="f-category">Category</label>
          <div class="bubble">
            <select id="f-category">
              <option>What's New</option>
              <option>Artist Spotlight</option>
              <option>Culture</option>
              <option>Tech</option>
              <option>Editorial</option>
            </select>
          </div>
        </div>
      </div>

      <div class="field">
        <label for="f-subtitle">Subtitle</label>
        <div class="bubble"><input id="f-subtitle" placeholder="One-liner that sells the piece"/></div>
      </div>

      <div class="field">
        <label>Tags</label>
        <div class="bubble tag-input" id="tagBox">
          <input id="f-tag-input" placeholder="Type & press Enter…"/>
        </div>
      </div>

      <div class="field">
        <label for="f-hero">Hero image URL</label>
        <div class="bubble"><input id="f-hero" placeholder="https://…"/></div>
      </div>

      <div class="field">
        <label>Content</label>
        <div class="md-toolbar" role="toolbar" aria-label="Markdown tools">
          <button type="button" class="md-btn" data-md="bold" title="Bold"><b>B</b></button>
          <button type="button" class="md-btn" data-md="italic" title="Italic"><i>I</i></button>
          <button type="button" class="md-btn" data-md="strike" title="Strikethrough"><s>S</s></button>
          <span class="md-sep"></span>
          <button type="button" class="md-btn" data-md="h2" title="Heading 2">H2</button>
          <button type="button" class="md-btn" data-md="h3" title="Heading 3">H3</button>
          <button type="button" class="md-btn" data-md="quote" title="Quote">
            <svg viewBox="0 0 24 24"><path d="M7 7h4v6H7zM13 7h4v6h-4z"/></svg>
          </button>
          <span class="md-sep"></span>
          <button type="button" class="md-btn" data-md="ul" title="Bullet list">
            <svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>
          </button>
          <button type="button" class="md-btn" data-md="ol" title="Numbered list">1.</button>
          <span class="md-sep"></span>
          <button type="button" class="md-btn" data-md="link" title="Link">
            <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 007 0l3-3a5 5 0 00-7-7l-1 1"/><path d="M14 11a5 5 0 00-7 0l-3 3a5 5 0 007 7l1-1"/></svg>
          </button>
          <button type="button" class="md-btn" data-md="code" title="Inline code">
            <svg viewBox="0 0 24 24"><path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/></svg>
          </button>
          <button type="button" class="md-btn" data-md="codeblock" title="Code block">{ }</button>
          <button type="button" class="md-btn" data-md="hr" title="Divider">—</button>
          <span class="md-sep"></span>
          <button type="button" class="md-btn" data-md="image-url" title="Insert image by URL">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>
          </button>
          <button type="button" class="md-btn" data-md="image-file" title="Upload image">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <input type="file" id="imgFileInput" accept="image/*" hidden multiple/>
        </div>
        <div class="bubble">
          <textarea id="f-content" placeholder="Write in markdown…&#10;&#10;## Section&#10;&#10;A paragraph with **bold**, *italic*, and [links](https://treesh.app).&#10;&#10;- bullet&#10;- bullet&#10;&#10;> A stand-out quote."></textarea>
        </div>
        <div class="thumbs" id="thumbs"></div>
      </div>
    </form>
  </section>
</main>

<!-- ===== Mobile / animated preview modal ===== -->
<div class="preview-modal" id="previewModal" role="dialog" aria-modal="true" aria-label="Preview">
  <div class="preview-sheet">
    <button class="preview-close" id="closePreview" aria-label="Close preview">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <div class="preview-scroll" id="previewScrollModal">
      <article class="blog" id="blogPreviewModal"></article>
    </div>
  </div>
</div>

<!-- ===== Fixed dock ===== -->
<nav class="dock" aria-label="Actions">
  <button class="dock-btn ghost" id="btnPreview" title="Preview">
    <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
    <span class="lbl">Preview</span>
  </button>
  <button class="dock-btn primary" id="btnCopy" title="Copy HTML">
    <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/></svg>
    <span class="lbl">Copy HTML</span>
  </button>
  <button class="dock-btn primary" id="btnDownload" title="Download HTML">
    <svg viewBox="0 0 24 24"><path d="M12 3v12M6 11l6 6 6-6M4 21h16"/></svg>
    <span class="lbl">Save</span>
  </button>
  <button class="dock-btn danger" id="btnReset" title="Start fresh">
    <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
    <span class="lbl">Start Fresh</span>
  </button>
</nav>

<div class="toast" id="toast">Copied!</div>

<script>
/* ============ State ============ */
const state = {
  title:'', author:'', date:'', category:"What's New",
  subtitle:'', tags:[], hero:'', content:''
};

const $ = (id) => document.getElementById(id);
const fields = ['title','author','date','category','subtitle','hero','content'];

/* ============ Persistence ============ */
const LS_KEY = 'treesh:blog-generator:v1';
function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return;
    Object.assign(state, JSON.parse(raw));
    fields.forEach(f => { if($('f-'+f)) $('f-'+f).value = state[f] || ''; });
    renderTags();
  }catch(e){}
}

/* ============ Field wiring ============ */
fields.forEach(f => {
  const el = $('f-'+f);
  if(!el) return;
  el.addEventListener('input', () => { state[f] = el.value; save(); renderPreview(); });
});

/* Default date today */
if(!state.date){ state.date = new Date().toISOString().slice(0,10); $('f-date').value = state.date; }

/* ============ Tags ============ */
const tagBox = $('tagBox');
const tagInput = $('f-tag-input');
tagInput.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter' || e.key === ','){
    e.preventDefault();
    const v = tagInput.value.trim().replace(/,$/,'');
    if(v){ state.tags.push(v); tagInput.value=''; save(); renderTags(); renderPreview(); }
  } else if(e.key === 'Backspace' && !tagInput.value && state.tags.length){
    state.tags.pop(); save(); renderTags(); renderPreview();
  }
});
function renderTags(){
  [...tagBox.querySelectorAll('.tag')].forEach(n=>n.remove());
  state.tags.forEach((t, i) => {
    const el = document.createElement('span');
    el.className = 'tag';
    el.innerHTML = `#${escapeHtml(t)} <button aria-label="Remove">×</button>`;
    el.querySelector('button').onclick = ()=>{ state.tags.splice(i,1); save(); renderTags(); renderPreview(); };
    tagBox.insertBefore(el, tagInput);
  });
}

/* ============ Markdown toolbar ============ */
const ta = $('f-content');
function wrapSel(before, after=before, placeholder=''){
  const s = ta.selectionStart, e = ta.selectionEnd;
  const sel = ta.value.slice(s,e) || placeholder;
  ta.setRangeText(before + sel + after, s, e, 'end');
  ta.focus();
  state.content = ta.value; save(); renderPreview();
}
function linePrefix(prefix){
  const s = ta.selectionStart, e = ta.selectionEnd;
  const before = ta.value.slice(0,s), sel = ta.value.slice(s,e), after = ta.value.slice(e);
  const startOfLine = before.lastIndexOf('\n')+1;
  const head = ta.value.slice(startOfLine, s);
  const block = (head + sel).split('\n').map(l=> prefix + l).join('\n');
  ta.value = ta.value.slice(0,startOfLine) + block + after;
  state.content = ta.value; save(); renderPreview();
  ta.focus();
}
function insertAtCursor(text){
  const s = ta.selectionStart;
  ta.setRangeText(text, s, s, 'end');
  state.content = ta.value; save(); renderPreview();
  ta.focus();
}
document.querySelectorAll('.md-btn[data-md]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const k = btn.dataset.md;
    switch(k){
      case 'bold': wrapSel('**','**','bold text'); break;
      case 'italic': wrapSel('*','*','italic'); break;
      case 'strike': wrapSel('~~','~~','strike'); break;
      case 'h2': linePrefix('## '); break;
      case 'h3': linePrefix('### '); break;
      case 'quote': linePrefix('> '); break;
      case 'ul': linePrefix('- '); break;
      case 'ol': linePrefix('1. '); break;
      case 'link': {
        const url = prompt('Link URL','https://');
        if(url) wrapSel('[',`](${url})`,'link text');
        break;
      }
      case 'code': wrapSel('`','`','code'); break;
      case 'codeblock': insertAtCursor('\n```\ncode\n```\n'); break;
      case 'hr': insertAtCursor('\n\n---\n\n'); break;
      case 'image-url': {
        const url = prompt('Image URL','https://');
        if(url){
          const alt = prompt('Alt text','') || '';
          insertAtCursor(`\n\n![${alt}](${url})\n\n`);
        }
        break;
      }
      case 'image-file': $('imgFileInput').click(); break;
    }
  });
});
$('imgFileInput').addEventListener('change', async (e)=>{
  const files = [...e.target.files];
  for(const f of files){
    const dataURL = await fileToDataURL(f);
    insertAtCursor(`\n\n![${f.name}](${dataURL})\n\n`);
    addThumb(dataURL);
  }
  e.target.value = '';
});
function fileToDataURL(file){
  return new Promise((res,rej)=>{
    const r = new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file);
  });
}
function addThumb(url){
  const t = document.createElement('div'); t.className='t';
  t.innerHTML = `<img src="${url}"/><button title="Remove reference">×</button>`;
  t.querySelector('button').onclick = ()=> t.remove();
  $('thumbs').appendChild(t);
}

/* ============ Tiny Markdown -> HTML ============ */
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));}
function mdToHtml(md){
  if(!md) return '';
  // Code blocks first
  let html = md.replace(/```([\s\S]*?)```/g, (m,code)=>`<pre><code>${escapeHtml(code.trim())}</code></pre>`);

  const lines = html.split('\n');
  const out = [];
  let i=0;
  while(i < lines.length){
    const line = lines[i];

    if(/^\s*$/.test(line)){ out.push(''); i++; continue; }
    if(/^\s*---\s*$/.test(line)){ out.push('<hr/>'); i++; continue; }

    let m;
    if(m = line.match(/^\s*#{3}\s+(.*)$/)){ out.push(`<h3>${inline(m[1])}</h3>`); i++; continue; }
    if(m = line.match(/^\s*#{2}\s+(.*)$/)){ out.push(`<h2>${inline(m[1])}</h2>`); i++; continue; }
    if(m = line.match(/^\s*#\s+(.*)$/)){ out.push(`<h2>${inline(m[1])}</h2>`); i++; continue; }

    if(/^\s*>\s?/.test(line)){
      const buf = [];
      while(i<lines.length && /^\s*>\s?/.test(lines[i])){ buf.push(lines[i].replace(/^\s*>\s?/,'')); i++; }
      out.push(`<blockquote>${inline(buf.join(' '))}</blockquote>`);
      continue;
    }
    if(/^\s*[-*]\s+/.test(line)){
      const buf=[];
      while(i<lines.length && /^\s*[-*]\s+/.test(lines[i])){ buf.push(`<li>${inline(lines[i].replace(/^\s*[-*]\s+/,''))}</li>`); i++; }
      out.push(`<ul>${buf.join('')}</ul>`); continue;
    }
    if(/^\s*\d+\.\s+/.test(line)){
      const buf=[];
      while(i<lines.length && /^\s*\d+\.\s+/.test(lines[i])){ buf.push(`<li>${inline(lines[i].replace(/^\s*\d+\.\s+/,''))}</li>`); i++; }
      out.push(`<ol>${buf.join('')}</ol>`); continue;
    }
    if(/^<pre>/.test(line)){
      // pre-formed code block
      const buf=[line]; i++;
      while(i<lines.length && !/<\/pre>$/.test(lines[i-1])){ buf.push(lines[i]); i++; }
      out.push(buf.join('\n'));
      continue;
    }
    // paragraph
    const buf=[line]; i++;
    while(i<lines.length && !/^\s*$/.test(lines[i]) && !/^\s*(#{1,3}\s|>|[-*]\s|\d+\.\s|---)/.test(lines[i])){
      buf.push(lines[i]); i++;
    }
    out.push(`<p>${inline(buf.join(' '))}</p>`);
  }
  return out.join('\n');
}
function inline(s){
  // image ![alt](src)
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+"([^"]+)")?\)/g,(m,alt,src)=>`<img src="${src}" alt="${escapeHtml(alt)}"/>`);
  // link [t](u)
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(m,t,u)=>`<a href="${u}" target="_blank" rel="noopener">${t}</a>`);
  // bold **x**
  s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  // italic *x*
  s = s.replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  // strike
  s = s.replace(/~~([^~]+)~~/g,'<del>$1</del>');
  // inline code
  s = s.replace(/`([^`]+)`/g,'<code>$1</code>');
  return s;
}

/* ============ Render preview ============ */
function fmtDate(iso){
  if(!iso) return '';
  try{
    const d = new Date(iso);
    return d.toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'});
  }catch(e){ return iso; }
}
function buildBlogHTML(){
  const title = state.title || 'Untitled Post';
  const badges = state.tags.map(t=>`<span class="badge">#${escapeHtml(t)}</span>`).join('');
  const hero = state.hero ? `<div class="hero-img"><img src="${state.hero}" alt=""/></div>` : '';
  const sub = state.subtitle ? `<p class="sub">${escapeHtml(state.subtitle)}</p>` : '';
  const bylineRight = [state.author && escapeHtml(state.author), fmtDate(state.date)].filter(Boolean).join(' · ');
  return `
    <div class="byline">
      <span>${escapeHtml(state.category||'')}</span>
      <span>${bylineRight}</span>
    </div>
    <h1 class="title"><span class="hl">${escapeHtml(title)}</span></h1>
    ${sub}
    <div>${badges}</div>
    <div class="divider"></div>
    ${hero}
    <div class="glass-card">
      ${mdToHtml(state.content) || '<p style="color:rgba(255,255,255,0.35)">Start typing to see your post come alive…</p>'}
    </div>
  `;
}
function renderPreview(){
  const html = buildBlogHTML();
  $('blogPreviewDesktop').innerHTML = html;
  $('blogPreviewModal').innerHTML = html;
}

/* ============ Export ============ */
function buildStandaloneHTML(){
  const title = state.title || 'Untitled Post';
  const desc = state.subtitle || `${title} — Treesh`;
  const body = buildBlogHTML();
  return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>${escapeHtml(title)} · Treesh</title>
<meta name="description" content="${escapeHtml(desc)}"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Special+Gothic+Expanded+One&display=swap" rel="stylesheet">
<style>
:root{--treesh-bg:#0a0a0b;--treesh-card:rgba(255,255,255,0.045);--treesh-border:rgba(255,255,255,0.10);--treesh-purple:#9328ff;--treesh-purple-2:#b77aff;--treesh-purple-soft:rgba(147,40,255,0.22);--treesh-gold:#c3ab69;--treesh-text:#f0f0f5;--treesh-text-dim:rgba(255,255,255,0.62);--treesh-shadow:0 18px 60px rgba(0,0,0,0.55);}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--treesh-bg);color:var(--treesh-text);font-family:'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.7;position:relative;overflow-x:hidden;}
.bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.bg .b{position:absolute;border-radius:50%;filter:blur(100px);}
.b1{width:60vh;height:60vh;left:-10%;top:-8%;background:var(--treesh-purple);opacity:.25;}
.b2{width:55vh;height:55vh;right:-8%;top:35%;background:#5a1fa8;opacity:.18;}
.b3{width:70vh;height:70vh;left:15%;bottom:-20%;background:var(--treesh-purple);opacity:.15;}
.container{max-width:820px;margin:0 auto;padding:3rem 1.5rem 4rem;position:relative;z-index:1;}
.byline{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:space-between;padding:.6rem 0;margin-bottom:1.4rem;border-bottom:1px solid var(--treesh-border);font-size:.82rem;color:var(--treesh-text-dim);}
h1.title{font-family:'Special Gothic Expanded One','Manrope',sans-serif;font-size:3rem;line-height:1.1;letter-spacing:-.02em;margin-bottom:.5rem;}
h1.title .hl{background:linear-gradient(135deg,var(--treesh-purple),var(--treesh-purple-2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.sub{color:var(--treesh-text-dim);font-size:1.1rem;margin-bottom:1.2rem;}
.glass-card{background:var(--treesh-card);backdrop-filter:blur(20px);border:1px solid var(--treesh-border);border-radius:24px;padding:1.8rem 2rem;margin:1.4rem 0;box-shadow:var(--treesh-shadow);}
.divider{width:60px;height:3px;border-radius:10px;margin:1rem 0 .8rem;background:linear-gradient(90deg,var(--treesh-purple),transparent);}
h2{font-size:1.7rem;font-weight:700;margin:2rem 0 .5rem;letter-spacing:-.01em;}
h3{font-size:1.2rem;font-weight:600;margin:1.4rem 0 .3rem;}
p,li{color:var(--treesh-text-dim);margin:.6rem 0;}
a{color:var(--treesh-purple);font-weight:600;text-decoration:none;}
a:hover{color:var(--treesh-purple-2);text-decoration:underline;}
ul,ol{padding-left:1.4rem;margin:.6rem 0 1rem;}
ul li{list-style:none;position:relative;padding-left:.4rem;}
ul li::before{content:"▹";color:var(--treesh-purple);font-weight:700;position:absolute;left:-1.2rem;}
blockquote{border-left:3px solid var(--treesh-purple);background:rgba(147,40,255,0.06);padding:.8rem 1.1rem;border-radius:0 14px 14px 0;margin:1rem 0;font-style:italic;color:var(--treesh-text-dim);}
img{max-width:100%;height:auto;border-radius:18px;margin:1rem 0;box-shadow:0 20px 50px rgba(0,0,0,0.5);border:1px solid var(--treesh-border);}
code{background:rgba(255,255,255,0.06);padding:.15rem .4rem;border-radius:6px;font-size:.9em;color:#e0c7ff;}
pre{background:#0f0f13;border:1px solid var(--treesh-border);border-radius:14px;padding:1rem;overflow:auto;margin:1rem 0;}
pre code{background:transparent;padding:0;color:#e6e6ee;}
.badge{display:inline-block;font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:.22rem .7rem;border-radius:100px;background:var(--treesh-purple-soft);color:var(--treesh-purple);border:1px solid rgba(147,40,255,0.3);margin:0 .3rem .3rem 0;}
hr{border:none;height:1px;background:var(--treesh-border);margin:2rem 0;}
.hero-img{margin:0 0 1.4rem;}
</style>
</head>
<body>
<div class="bg"><div class="b b1"></div><div class="b b2"></div><div class="b b3"></div></div>
<article class="container">
${body}
</article>
</body>
</html>`;
}

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), 1600);
}

$('btnCopy').addEventListener('click', async ()=>{
  const html = buildStandaloneHTML();
  try{
    await navigator.clipboard.writeText(html);
    toast('HTML copied to clipboard');
  }catch(e){
    // fallback
    const ta = document.createElement('textarea'); ta.value = html; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    toast('HTML copied');
  }
});
$('btnDownload').addEventListener('click', ()=>{
  const html = buildStandaloneHTML();
  const slug = (state.title || 'treesh-post').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60) || 'treesh-post';
  const blob = new Blob([html], {type:'text/html'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `${slug}.html`;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 200);
  toast('Downloaded '+a.download);
});
$('btnReset').addEventListener('click', ()=>{
  if(!confirm('Start fresh? Your current draft will be cleared.')) return;
  Object.assign(state, {title:'',author:'',date:new Date().toISOString().slice(0,10),category:"What's New",subtitle:'',tags:[],hero:'',content:''});
  fields.forEach(f => { if($('f-'+f)) $('f-'+f).value = state[f] || ''; });
  $('thumbs').innerHTML='';
  save(); renderTags(); renderPreview();
  toast('Fresh canvas ✨');
});

/* Preview modal (mobile / animation) */
const modal = $('previewModal');
$('btnPreview').addEventListener('click', ()=>{
  renderPreview();
  modal.classList.add('open');
  document.body.style.overflow='hidden';
});
$('closePreview').addEventListener('click', ()=>{
  modal.classList.remove('open');
  document.body.style.overflow='';
});
modal.addEventListener('click',(e)=>{ if(e.target===modal){ modal.classList.remove('open'); document.body.style.overflow=''; }});
document.addEventListener('keydown',(e)=>{ if(e.key==='Escape' && modal.classList.contains('open')){ modal.classList.remove('open'); document.body.style.overflow=''; }});

/* Init */
load();
renderPreview();
</script>
</body>
