<!DOCTYPE html>
<!--[if IE 8]><html class="lt-ie10 lt-ie9"> <![endif]-->
<!--[if IE 9]><html class="lt-ie10"> <![endif]-->
<!--[if gt IE 9]><!--> <html> <!--<![endif]-->
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.0.13/dist/css/select2.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/select2@4.0.13/dist/js/select2.min.js"></script>
  <script src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">


    
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Special+Gothic+Expanded+One&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Doto:wght@100..900&display=swap');
	
:root {
  --gold: #c3ab69;
  --black: #000;
  --white: #fff;
  --pink: #3C414C;
  --text-color: white;
  --border-color: rgba(255, 255, 255, 0.2);
  --background: black;
  --navBarHeight: 540px;
  --waveHeight: 100px;
  --purple: #9328ff;
  --main-font: "Manrope", sans-serif;
  --savionce-font: "Special Gothic Expanded One", sans-serif;
}
      
      
      body {
  width: 100%;
  height: auto;
  margin: 0 !important;
  touch-action: manipulation;
  overflow:auto;
  padding: 0 !important;
  background-size: cover;
  background-position: center;
  color: #101010;
  font-size: 0.9375rem;
  font-family: var(--main-font);
  font-weight: 400;
  scroll-behavior: smooth;
  text-shadow: 1px 1px 1px rgba(0, 0, 0, 0.004);
  scrollbar-face-color: black;
  scrollbar-base-color: black;
  scrollbar-arrow-color: gray;
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
  -moz-osx-font-smoothing: grayscale;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  -ms-text-size-adjust: none;
  -webkit-text-size-adjust: none;
}
      
      button,
      select,
      option,
      input,
      textarea {
        font-family:var(--main-font);
      }
      
*,
*::before,
*::after {
  box-sizing: border-box;
}
      
      
      #app {
        width:100%;
        height:auto;
        position:relative;
        display:block;
        margin:auto;
        padding:0px 20px;
        overflow:hidden;
      }
      
      #song_form {
        width:100%;
        height:auto;
        position:relative;
        display:block;
        padding-bottom:200px;
      }
      
      #song_form label {
        font-family:var(--savionce-font);
        display:block;
        font-weight:100;
        margin-bottom:10px;
        margin-top:30px;
      }
      
      #song_form input,
      #song_form select,
      #song_form textarea {
        font-size:1.5em;
        width:100%;
        padding:10px;
        margin:0px;
        display:block;
        position:relative;
      }
      
      
      #sidebar {
        width:270px;
        height:100%;
        background:var(--pink);
        position:fixed;
        top:0;
        right:0;
        z-index:3;
        color:white;
        font-family:var(--main-font);
        padding:10px;
        transform:translate3d(100%, 0, 0);
      }
      
      #code,
      #code pre {
        width:100%;
        position:relative;
        display:block;
        white-space: pre-wrap;
  word-break: break-word;
        font-family:var(--main-font);
      }
      
      #code {
        border:1px solid rgba(255, 255, 255, 0.2);
        padding:10px;
        border-radius:30px;
        background:rgba(0, 0, 0, 0.2);
      }
      
      #sidebar .body {
        height:auto;
        width:100%;
        overflow:auto;
        max-height:calc(100% - 100px);
      }
      
      #sidebar .body h1 {
        font-family:var(--savionce-font);
        font-weight:100;
        font-size:1rem;
        text-align:center;
        width:100%;
        display:block;
        padding:10px;
      }
      
      #sidebar .options {
        display:flex;
        align-items:center;
        justify-content:space-around;
        position:absolute;
        bottom:0;
        left:0;
        right:0;
        margin:auto;
        height:100px;
        width:calc( 100% - 20px);
      }
      
      #sidebar button,
      #song_form button {
        width:100%;
        position:relative;
        display:inline-block;
        vertical-align:middle;
        height:auto;
        font-weight:500;
        font-size:1.2rem;
        padding:15px;
        border-radius:30px;
        cursor:pointer;
      }
      
      
      #back-btn {
        width:100%;
        height:100%;
        position:fixed;
        top:0;
        left:0;
        background:black;
        color:white;
        font-size:4rem;
        z-index:-200;
        opacity:0;
        cursor:pointer;
      }
      
      #back-btn i {
        position:absolute;
        top:50%;
        left:0;
        right:0;
        margin:auto;
        transform: translateY(-50%);
      }
    </style>
  </head>
  
  <body>
    <div id="sidebar">
      <div class="body">
        <h1>Make sure code is correct</h1>
      <code id="code"></code>
      </div>
      
      <div class="options">
      <button type="button" id="copy">Copy Code</button>
		  <button type="button" id="publish">Publish</button>
      </div>
    </div>
    
    <div id="app">
      
      <div id="back-btn">
        <i class="fa fa-long-arrow-left"></i>
      </div>
      
      <h1>Treesh Track Coder</h1>
      
      
      <form id="song_form">
        <label>Main Artist</label>
        <select id="mainArtist"></select>
        
        <br>
        
        <label>Featured Artists</label>
        <select id="featuredArtists" multiple></select>
        
        <br>
        
        <label>Track URL</label>
        <input type="text" placeholder="Enter source URL" id="songSrc"/>
        
        <br>
        
        <label>Track Name</label>
        <input type="text" placeholder="Enter song's name" id="songName" />
        
        <br>
        
        <label>Cover Art</label>
        <input type="text" placeholder="Enter source URL" id="coverArt" />
        
        <br>
        
        <label>Date Created</label>
        <input type="date" id="dateCreated" />
        
        <br>
        
        <label>Genre</label>
        <select id="genre"></select>
        
        <br>
        
        <label>Mood</label>
       <select id="mood">
        </select>
        
        <br>
        
        <label>Written By</label>
        <input type="text" placeholder="Enter who wrote it" id="writtenBy" />
        
        <br>
        
        <label>Produced By</label>
        <input type="text" placeholder="Enter who produced it" id="producer" />
        
        <br>
        
        <label>Mixed By</label>
        <input type="text" placeholder="Enter who mixed it" id="mixer" />
        
        <br>
        
        <label>Videographer</label>
        <input type="text" placeholder="Enter who's the videographer" id="videographer" />
        
        <br>
        
        <label>Video</label>
        <input type="text" placeholder="Enter source URL" id="video" />
        
        <br>
        
        <label>Bio</label>
        <textarea placeholder="Enter a description of the song" id="bio"></textarea>
        
        <br>
        
        <label>Tags</label>
        <select id="tags" multiple></select>
        
        <br>
        
        <label>Done?</label>
        <button type="button" id="confirm">All Set!</button>
      </form>
    </div>
    
    <script>
   $(document).ready(function() {
     const theCodee = `<ul class="song" data-track="" data-artist-id="" data-artist="" data-featuring="" data-genre="" data-mood="" data-creation-date="" data-written-by="" data-producer="" data-mixer="" data-videographer="" data-coverart="" data-mp3="" data-video="" data-bio=""><span><section><img src="" alt="" class="coverart"></section><section><song-info-tag><h2></h2><h3></h3></song-info-tag></section></span></ul>`;

  $("#code").html(`<pre><code>${$("<div>").text(theCodee).html()}</code></pre>`);
     
     
  const mainSelect = $("#mainArtist");
  const featuredSelect = $("#featuredArtists");
  const transferArtists = "https://yvll.tumblr.com/icons.html .artist";

  function prependSelectOptions(selectId, options, placeholderText) {
    const $select = $(`#${selectId}`);
    $select.empty();

    // only for single selects, add placeholder option
    if (placeholderText && !$select.prop("multiple")) {
      $select.append(`<option value="">${placeholderText}</option>`);
    }

    for (let i = 0; i < options.length; i++) {
      const opt = options[i];
      if (typeof opt === "string") {
        $select.append(`<option value="${opt}">${opt}</option>`);
      } else if (typeof opt === "object" && opt.text) {
        let attr = "";
        for (let key in opt) {
          if (key !== "text") attr += ` ${key}="${opt[key]}"`;
        }
        $select.append(`<option${attr}>${opt.text}</option>`);
      }
    }
  }

  const genres = ["Hip Hop","Rap","Pop","R&B","Dance","Rock"];
  const moods = ["Happy","Sad","Exciting","Serious"];
  const tags = [{ text: "Explicit", "data-add": "data-explicit" }, { text: "Treesh Choice", "data-add": "data-treeshChoice" }];

  prependSelectOptions("genre", genres, "Select genre");
  prependSelectOptions("mood", moods, "Select mood");
  prependSelectOptions("tags", tags);

  $("<div>").load(transferArtists, function() {
  $(this).find(".artist").each(function() {
    let id = $(this).data("artist-id");
    let name = $(this).data("name").trim();
    mainSelect.append(`<option data-id="${id}">${name}</option>`);
    featuredSelect.append(`<option data-id="${id}">${name}</option>`);
  });

  // reorder the plain select before initializing select2
  $("select:not([multiple])").each(function() {
    let $select = $(this);
    let options = $select.find("option").toArray();
    options.sort((a, b) => $(a).text().localeCompare($(b).text()));
    $select.empty().append(options);

    let labelText = $(this).prev("label").text() || "an option";
    $select.prepend(`<option value="" selected disabled>Select ${labelText}</option>`);
  });
    
    function sortSelectOptions(selectId) {
  const $select = $(`#${selectId}`);
  const options = $select.find("option").toArray();

  options.sort((a, b) => $(a).text().localeCompare($(b).text()));

  $select.empty().append(options);
}
     
     sortSelectOptions("featuredArtists");
sortSelectOptions("tags");

  // now initialize select2 AFTER reorder
  $("#featuredArtists, #tags").select2({
    placeholder: "Select options",
    allowClear: true,
    closeOnSelect: false
  });
});

$("select").each(function() {
  $(this).find('option[value=""]').remove();
});
     
     function updateFeaturedOptions() {
  const mainId = $("#mainArtist").find("option:selected").data("id");

  $("#featuredArtists option").each(function() {
    const $opt = $(this);
    if ($opt.data("id") === mainId) {
      $opt.prop("disabled", true); 
    } else {
      $opt.prop("disabled", false); 
    }
  });

  $("#featuredArtists").select2();
}
$("#mainArtist").on("change", updateFeaturedOptions);

updateFeaturedOptions();

     
  function reorderSelect() {
    $("select:not[multiple]").each(function() {
      let $select = $(this);
      let options = $select.find("option").toArray();
      options.sort((a, b) => $(a).text().localeCompare($(b).text()));
      $select.empty().append(options);
      let labelText = $(this).prev("label").text() || "an option";
      $select.prepend(`<option value="" selected disabled>Select ${labelText}</option>`);
    });
    
  }
     

  function updateCode() {
  // main artist
  const main = $("#mainArtist option:selected");
  const mainId = main.data("id") || "";

  const mainName = main.text().trim() || "";

  // featured artists
  const featuredOptions = $("#featuredArtists option:selected");
  const featuredNames = featuredOptions.map(function() {
  return $(this).text().trim();
}).get().join(",");

  const featuredIds = featuredOptions.map(function() {
  return $(this).data("id") || "";
}).get().filter(Boolean);
    
const allIds = [...(mainId ? [mainId] : []), ...featuredIds].join(",");


  // other inputs
  const songSrc = $("#songSrc").val() || "";
  const songName = $("#songName").val() || "";
  const coverArt = $("#coverArt").val() || "";

  const dateInput = $("#dateCreated").val();
  let dateCreated = "";
  if(dateInput){
    const dateObj = new Date(dateInput);
    dateCreated = dateObj.toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
  }

  const genre = $("#genre").val() || "";
  const mood = $("#mood").val() || "";
  const writtenBy = $("#writtenBy").val() || "";
  const producer = $("#producer").val() || "";
  const mixer = $("#mixer").val() || "";
  const videographer = $("#videographer").val() || "";
  const video = $("#video").val() || "";

  // bio with <br> for line breaks
  const bioRaw = $("#bio").val() || "";
  const bio = bioRaw.replace(/(\r\n|\n|\r)/g, "<br>");

  // multiple tags
  const tagAttrs = $("#tags option:selected").map(function() {
    return $(this).data("add") ? ` ${$(this).data("add")}="true"` : "";
  }).get().join("");

  const theCode = `<ul class="song" data-track="${songName}" data-artist-id="${allIds}" data-artist="${mainName}" data-featuring="${featuredNames}" data-genre="${genre}" data-mood="${mood}" data-creation-date="${dateCreated}" data-written-by="${writtenBy}" data-producer="${producer}" data-mixer="${mixer}" data-videographer="${videographer}" data-coverart="${coverArt}" data-mp3="${songSrc}" data-video="${video}" data-bio="${bio}"${tagAttrs}><span><section><img src="${coverArt}" alt="${songName}" class="coverart"></section><section><song-info-tag><h2>${songName}</h2><h3>${mainName}</h3></song-info-tag></section></span></ul>`;

  $("#code").html(`<pre><code>${$("<div>").text(theCode).html()}</code></pre>`);
}


// trigger on any change/input
$("#song_form").on("input change", "input, select, textarea", updateCode);

     
     function syncArtistSelects() {
  const mainId = $("#mainArtist").find("option:selected").data("id")?.toString() || "";
  const featuredIds = ($("#featuredArtists").val() || []).map(String);

  // enable all options first
  $("#mainArtist option, #featuredArtists option").prop("disabled", false);

  // keep placeholder enabled
  $("#mainArtist option[value=''], #featuredArtists option[value='']").prop("disabled", false);

  // disable main artist in featured if selected
  if(mainId) {
    $("#featuredArtists option").each(function() {
      if($(this).data("id")?.toString() === mainId) $(this).prop("disabled", true);
    });
  }

  // disable featured artists in main if any selected
  if(featuredIds.length) {
    $("#mainArtist option").each(function() {
      if(featuredIds.includes($(this).data("id")?.toString())) $(this).prop("disabled", true);
    });
  }

  // refresh select2 to reflect changes visually
  $("#mainArtist, #featuredArtists").trigger("change.select2");
}

// call on change
$("#mainArtist, #featuredArtists").on("change", syncArtistSelects);

// initial sync
syncArtistSelects();

     
     let tl = gsap.timeline({ paused: true });
     
     tl.to("#sidebar", { opacity: 1, x: 0, duration: 0.6, ease: "power1.out" })
  .to("#app", {
    width: () => window.innerWidth - 310,
    height: window.innerWidth - 310,
    duration: 0.6,
    ease: "power1.out",
    background: "black",
    color: "white",
    position: "absolute",
    x: 15,
    top: "50%",
    yPercent: -50
  }, "<")
  .to("#song_form, #app h1", { opacity: 0, duration: 0.6, ease: "power1.out" }, "<")
  .to("#back-btn", { opacity: 1, zIndex: 200, duration: 0.6, ease: "power1.out" }, "<");
     
     $("#confirm").click(function() {
       tl.play();
     });
     
     $("#back-btn").click(function() {
       tl.reverse();
     });
     
     $("#copy").click(function() {
       var text = $("#code").text();
    navigator.clipboard.writeText(text).then(function() {
        console.log("copied");
    }).catch(function() {
        console.log("failed");
    });
     });

	   $("#publish").click(function() {
        updateCode();
		   
   const body = JSON.stringify({ content: code, message: "Prepend new song" });

  const res = await fetch("/api/update-song", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body
  });

  const result = await res.json();
  console.log(result);
  alert("Song pushed! Check GitHub to confirm.");
});
     });
});

    </script>
    
  </body>
</html>
