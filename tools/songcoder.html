        <select id="mainArtist" required></select>
        
        <br>
        
        <label>Track URL*</label>

        <br>
        
        <label>Cover Art*</label>
        <input type="text" placeholder="Enter source URL" id="coverArt" required />
        
        <br>
        
        <label>Genre*</label>
        <select id="genre" required></select>
        
        <br>
        
        <label>Featured Artists</label>

        <br>
        
        <label>Date Created</label>
        <input type="date" id="dateCreated" />

  function prependSelectOptions(selectId, options, placeholderText) {
    const $select = $(`#${selectId}`);
    $select.empty();

    // only for single selects, add placeholder option
    if (placeholderText && !$select.prop("multiple")) {
      $select.append(`<option value="">${placeholderText}</option>`);
    }

    for (let i = 0; i < options.length; i++) {
      const opt = options[i];
      if (typeof opt === "string") {
        $select.append(`<option value="${opt}">${opt}</option>`);
      } else if (typeof opt === "object" && opt.text) {
        let attr = "";
        for (let key in opt) {
          if (key !== "text") attr += ` ${key}="${opt[key]}"`;
        }
        $select.append(`<option${attr}>${opt.text}</option>`);
      }
    }
  }

  const genres = ["Hip Hop","Rap","Pop","R&B","Dance","Rock"];
  const moods = ["Happy","Sad","Exciting","Serious"];

  // reorder the plain select before initializing select2

    $select.empty().append(options);

    let labelText = $(this).prev("label").text() || "an option";

    function sortSelectOptions(selectId) {
  const $select = $(`#${selectId}`);
  const options = $select.find("option").toArray();

  options.sort((a, b) => $(a).text().localeCompare($(b).text()));

  $select.empty().append(options);
}

sortSelectOptions("tags");

let prevInput = {};

function updateCode() {
  const inputs = {
    mainArtist: $("#mainArtist").val(),
    featuredArtists: $("#featuredArtists").val() || [],
    songSrc: $("#songSrc").val(),
    songName: $("#songName").val(),
    coverArt: $("#coverArt").val(),
    dateCreated: $("#dateCreated").val(),
    genre: $("#genre").val(),
    mood: $("#mood").val(),
    writtenBy: $("#writtenBy").val(),
    producer: $("#producer").val(),
    mixer: $("#mixer").val(),
    videographer: $("#videographer").val(),
    video: $("#video").val(),
    bio: $("#bio").val(),
    tags: $("#tags").val() || []
  };

  if (JSON.stringify(inputs) === JSON.stringify(prevInput)) return;
  prevInput = { ...inputs };

  const mainOption = $("#mainArtist option:selected");
  songData.mainName = mainOption.text().trim() || songData.mainName;
  const mainId = mainOption.data("id");

  const featuredOptions = $("#featuredArtists option:selected");
  const featuredNamesArr = featuredOptions.map(function() { return $(this).text().trim(); }).get();
  songData.featuredNames = featuredNamesArr.join(",");
  const featuredIds = featuredOptions.map(function() { return $(this).data("id"); }).get().filter(Boolean);

  songData.allIds = [...(mainId ? [mainId] : []), ...featuredIds].join(",");

  if (inputs.songSrc) songData.songSrc = inputs.songSrc;
  if (inputs.songName) songData.songName = inputs.songName;
  if (inputs.coverArt) songData.coverArt = inputs.coverArt;
  if (inputs.dateCreated) {
    const d = new Date(inputs.dateCreated);
    if (!isNaN(d)) songData.dateCreated = d.toLocaleDateString("en-US", { month:"long", day:"numeric", year:"numeric" });
  }
  if (inputs.genre) songData.genre = inputs.genre;
  if (inputs.mood) songData.mood = inputs.mood;
  if (inputs.writtenBy) songData.writtenBy = inputs.writtenBy;
  if (inputs.producer) songData.producer = inputs.producer;
  if (inputs.mixer) songData.mixer = inputs.mixer;
  if (inputs.videographer) songData.videographer = inputs.videographer;
  if (inputs.video) songData.video = inputs.video;
  if (inputs.bio) songData.bio = inputs.bio.replace(/(\r\n|\n|\r)/g,"<br>");
  if (inputs.tags) {
    songData.tagAttrs = $("#tags option:selected").map(function() {
      return $(this).data("add") ? ` ${$(this).data("add")}="true"` : "";
    }).get().join("") || songData.tagAttrs;
  }

  let artistLine = songData.mainName;
  if (songData.featuredNames) {
    artistLine += " x " + songData.featuredNames.split(",").join(" x ");
  } 

  const theCode = `<ul class="song" data-track="${songData.songName}" data-artist-id="${songData.allIds}" data-artist="${songData.mainName}" data-featuring="${songData.featuredNames}" data-genre="${songData.genre}" data-mood="${songData.mood}" data-creation-date="${songData.dateCreated}" data-written-by="${songData.writtenBy}" data-producer="${songData.producer}" data-mixer="${songData.mixer}" data-videographer="${songData.videographer}" data-coverart="${songData.coverArt}" data-mp3="${songData.songSrc}" data-video="${songData.video}" data-bio="${songData.bio}"${songData.tagAttrs}><span><section><img src="${songData.coverArt}" alt="${songData.songName}" class="coverart"></section><section><song-info-tag><h2>${songData.songName}</h2><h3>${artistLine}</h3></song-info-tag></section></span></ul>`;

  $("#code").html(`<pre><code>${$("<div>").text(theCode).html()}</code></pre>`);
  $("#library").html(theCode);
}

$("#song_form").on("input change", "input, select, textarea", updateCode);



     
     function syncArtistSelects() {
  const mainId = $("#mainArtist").find("option:selected").data("id")?.toString() || "";
  const featuredIds = ($("#featuredArtists").val() || []).map(String);

  $("#mainArtist option, #featuredArtists option").prop("disabled", false);

  if(mainId) {
    $("#featuredArtists option").each(function() {

  if(featuredIds.length) {
    $("#mainArtist option").each(function() {
      if(featuredIds.includes($(this).data("id")?.toString())) $(this).prop("disabled", true);
    });
  }

  $("#mainArtist, #featuredArtists").trigger("change.select2");
}
     
$("#mainArtist, #featuredArtists").on("change", syncArtistSelects);

function buildCopy() {
  const mainOption = $("#mainArtist option:selected");
  const featuredOptions = $("#featuredArtists option:selected");

  const mainName = mainOption.text().trim() === defaults.mainName ? "" : mainOption.text().trim();
  const mainId = mainOption.data("id")?.toString() === defaults.allIds ? "" : mainOption.data("id")?.toString() || "";

  const featuredNamesArr = featuredOptions.map((_,el)=>$(el).text().trim()).get();
  const featuredNames = (featuredNamesArr.join(",") === defaults.featuredNames) ? "" : featuredNamesArr.join(",");

  const featuredIdsArr = featuredOptions.map((_,el)=>$(el).data("id")?.toString()).get().filter(Boolean);
  const allIds = ([mainId, ...featuredIdsArr].join(",") === defaults.allIds) ? "" : [mainId, ...featuredIdsArr].join(",");

  const songName = $("#songName").val() === defaults.songName ? "" : $("#songName").val();
  const songSrc = $("#songSrc").val() === defaults.songSrc ? "" : $("#songSrc").val();
  const coverArt = $("#coverArt").val() === defaults.coverArt ? "" : $("#coverArt").val();
  const dateCreated = $("#dateCreated").val() === defaults.dateCreated ? "" : $("#dateCreated").val();
 const genreVal = $("#genre").val();
const genre = (genreVal === null || genreVal === defaults.genre) ? "" : genreVal;

const moodVal = $("#mood").val();
const mood = (moodVal === null || moodVal === defaults.mood) ? "" : moodVal;
  const writtenBy = $("#writtenBy").val() === defaults.writtenBy ? "" : $("#writtenBy").val();
  const producer = $("#producer").val() === defaults.producer ? "" : $("#producer").val();
  const mixer = $("#mixer").val() === defaults.mixer ? "" : $("#mixer").val();
  const videographer = $("#videographer").val() === defaults.videographer ? "" : $("#videographer").val();
  const video = $("#video").val() === defaults.video ? "" : $("#video").val();
  const bio = $("#bio").val() === defaults.bio ? "" : $("#bio").val().replace(/(\r\n|\n|\r)/g,"<br>");
  const tagAttrs = $("#tags option:selected").map(function() { return $(this).data("add") ? ` ${$(this).data("add")}="true"` : ""; }).get().join("") || "";

  return `<ul class="song" data-track="${songName}" data-artist-id="${allIds}" data-artist="${mainName}" data-featuring="${featuredNames}" data-genre="${genre}" data-mood="${mood}" data-creation-date="${dateCreated}" data-written-by="${writtenBy}" data-producer="${producer}" data-mixer="${mixer}" data-videographer="${videographer}" data-coverart="${coverArt}" data-mp3="${songSrc}" data-video="${video}" data-bio="${bio}"${tagAttrs}><span><section><img src="${coverArt}" alt="${songName}" class="coverart"></section><section><song-info-tag><h2>${songName}</h2><h3>${mainName}${featuredNames ? " x "+featuredNames : ""}</h3></song-info-tag></section></span></ul>`;
}

$("#copy").click(function() {
  const text = buildCopy();
  navigator.clipboard.writeText(text)
    .then(()=>console.log("copied"))
    .catch(()=>console.log("failed"));
});

	

$("#publish").click(async function() {
  updateCode();

  const $btn = $(this);
  $btn.prop("disabled", true).text("Publishing...");

  const inputs = {
    songName: $("#songName").val() || "",
    songSrc: $("#songSrc").val() || "",
    coverArt: $("#coverArt").val() || "",
    genre: $("#genre").val(),
    mood: $("#mood").val(),
    writtenBy: $("#writtenBy").val() || "",
    producer: $("#producer").val() || "",
    mixer: $("#mixer").val() || "",
    videographer: $("#videographer").val() || "",
    video: $("#video").val() || "",
    bio: $("#bio").val() || "",
    mainArtist: $("#mainArtist").val(),
    featuredArtists: $("#featuredArtists").val() || []
  };

  const sanitized = {
    "data-track": inputs.songName === defaults.songName ? "" : inputs.songName,
    "data-mp3": inputs.songSrc === defaults.songSrc ? "" : inputs.songSrc,
    "data-coverart": inputs.coverArt === defaults.coverArt ? "" : inputs.coverArt,
    "data-genre": (!inputs.genre || inputs.genre === defaults.genre) ? "" : inputs.genre,
    "data-mood": (!inputs.mood || inputs.mood === defaults.mood) ? "" : inputs.mood,
    "data-written-by": inputs.writtenBy === defaults.writtenBy ? "" : inputs.writtenBy,
    "data-producer": inputs.producer === defaults.producer ? "" : inputs.producer,
    "data-mixer": inputs.mixer === defaults.mixer ? "" : inputs.mixer,
    "data-videographer": inputs.videographer === defaults.videographer ? "" : inputs.videographer,
    "data-video": inputs.video === defaults.video ? "" : inputs.video,
    "data-bio": inputs.bio === defaults.bio ? "" : inputs.bio.replace(/(\r\n|\n|\r)/g,"<br>"),
    "data-artist": inputs.mainArtist === defaults.mainName ? "" : inputs.mainArtist,
    "data-featuring": (inputs.featuredArtists.join(",") === defaults.featuredNames) ? "" : inputs.featuredArtists.join(",")
  };

  let allIdsVal = [];
  if (inputs.mainArtist && inputs.mainArtist !== defaults.mainName) allIdsVal.push($("#mainArtist option:selected").data("id"));
  if (inputs.featuredArtists.length) allIdsVal.push(...inputs.featuredArtists.map(id => $("#featuredArtists option[value='"+id+"']").data("id")));
  sanitized["data-artist-id"] = allIdsVal.join(",");

  const artistLine = (sanitized["data-artist"] || "") + (sanitized["data-featuring"] ? " x " + sanitized["data-featuring"].split(",").join(" x ") : "");
  const theCode = `<ul class="song" ${Object.entries(sanitized).map(([k,v])=>`${k}="${v}"`).join(" ")}><span><section><img src="${sanitized["data-coverart"]}" alt="${sanitized["data-track"]}" class="coverart"></section><section><song-info-tag><h2>${sanitized["data-track"]}</h2><h3>${artistLine}</h3></song-info-tag></section></span></ul>`;

  const body = JSON.stringify({ content: theCode, message: "Prepend new song" });

  try {
    const res = await fetch("https://treesh.vercel.app/api/update-song", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body
    });

    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Unknown error");

    alert("Song published successfully!");
    console.log(data);
  } catch (err) {
    console.error(err);
    alert("Failed to publish song: " + err.message);
  } finally {
    $btn.prop("disabled", false).text("Publish");
  }
});







     
     

$("#audioUpload").on("change", function(e) {
  const file = e.target.files[0];
  if (!file) return;

 
  $("#songSrc").val(URL.createObjectURL(file));
  $("#songName").val(file.name.replace(/\.[^/.]+$/, ""));
  $("#dateCreated").val(new Date().toISOString().split("T")[0]);

  
  jsmediatags.read(file, {
    onSuccess: function(tag) {
      const tags = tag.tags;

      if (tags.title) $("#songName").val(tags.title);
      if (tags.artist) $("#mainArtist").val(tags.artist); 
      if (tags.album) $("#writtenBy").val(tags.album);

      if (tags.picture) {
        let base64String = "";
        const data = tags.picture.data;
        const format = tags.picture.format;
        for (let i = 0; i < data.length; i++) {
          base64String += String.fromCharCode(data[i]);
        }
        const base64 = `data:${format};base64,${btoa(base64String)}`;
        $("#coverArt").val(base64);
        $("#coverArtPreview").attr("src", base64);
      }

      updateCode();
    },
    onError: function(error) {
      console.log("Error reading tags:", error);
    }
  });
});

});
