<script>
/* Force-clear any stale service worker + caches from earlier versions so updates always load */
(function(){ try{
  if('serviceWorker' in navigator){
    navigator.serviceWorker.getRegistrations().then(function(rs){
      var had = rs && rs.length>0;
      (rs||[]).forEach(function(r){ try{ r.unregister(); }catch(e){} });
      if(window.caches && caches.keys){ caches.keys().then(function(ks){ (ks||[]).forEach(function(k){ try{ caches.delete(k); }catch(e){} }); }).catch(function(){}); }
      if(had && navigator.serviceWorker.controller && !sessionStorage.getItem('treesh_sw_cleared')){
        try{ sessionStorage.setItem('treesh_sw_cleared','1'); }catch(e){}
        setTimeout(function(){ location.reload(); }, 400);
      }
    }).catch(function(){});
  } else if(window.caches && caches.keys){ caches.keys().then(function(ks){ (ks||[]).forEach(function(k){ try{ caches.delete(k); }catch(e){} }); }).catch(function(){}); }
}catch(e){} })();
</script>

<style>
  :root{
    --treesh-bg-0:#0a0a0b; --treesh-bg-1:#121214;
    --treesh-purple:#9328ff; --treesh-purple-soft:rgba(147,40,255,0.22);
    --treesh-gold:var(--treesh-purple); --treesh-stroke:rgba(255,255,255,0.14);
    --treesh-shadow:0 18px 60px rgba(0,0,0,0.55);
    --treesh-glow-purple:0 0 0 1px rgba(147,40,255,0.28),0 0 28px rgba(147,40,255,0.24);
    --treesh-glow-gold:var(--treesh-glow-purple);
  }
  *{ -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; background:var(--app-bg); color:var(--app-text); font-family:var(--treesh-font,'Manrope',system-ui,sans-serif); -webkit-font-smoothing:antialiased; overscroll-behavior-y:none; transition:background-color .3s ease, color .3s ease; }
  .font-display{ font-family:'Special Gothic Expanded One','Manrope',sans-serif; }
  .font-doto{ font-family:'Doto','Manrope',monospace; }
  .glass{ background:rgba(255,255,255,0.06); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border:1px solid var(--treesh-stroke); }
  .glass-strong{ background:rgba(255,255,255,0.09); backdrop-filter:blur(28px); -webkit-backdrop-filter:blur(28px); border:1px solid var(--treesh-stroke); }
  .glow-purple{ box-shadow:var(--treesh-glow-purple); }
  .glow-gold{ box-shadow:var(--treesh-glow-gold); }
  .no-scrollbar::-webkit-scrollbar{ display:none; } .no-scrollbar{ -ms-overflow-style:none; scrollbar-width:none; }
  .soft-scroll::-webkit-scrollbar{ width:8px;height:8px; } .soft-scroll::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.14); border-radius:999px; } .soft-scroll::-webkit-scrollbar-track{ background:transparent; }
  .clamp-1{ display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden; }
  .clamp-2{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  ::selection{ background:var(--treesh-purple-soft); color:#fff; }

  /* ===== Boot splash (paints instantly, before Tailwind CDN / app render — hides FOUC) ===== */
  #app-splash{ position:fixed; inset:0; z-index:9999; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(130% 120% at 50% 28%, #16101f 0%, #0b0a0e 55%, #08080a 100%);
    opacity:1; visibility:visible; transition:opacity .55s ease, visibility .55s ease; }
  #app-splash.splash-hide{ opacity:0; visibility:hidden; pointer-events:none; }
  #app-splash .splash-inner{ display:flex; flex-direction:column; align-items:center; gap:22px; transform:translateY(-3%); padding:24px; }
  #app-splash .splash-ring{ position:relative; display:grid; place-items:center; width:96px; height:96px; }
  #app-splash .splash-ring::before{ content:""; position:absolute; inset:0; border-radius:50%; border:2px solid rgba(147,40,255,0.18); }
  #app-splash .splash-ring::after{ content:""; position:absolute; inset:0; border-radius:50%; border:2px solid transparent; border-top-color:#9328ff; animation:splashSpin 1s linear infinite; box-shadow:0 0 26px rgba(147,40,255,0.32); }
  #app-splash .splash-eq{ display:flex; align-items:flex-end; gap:5px; height:40px; }
  #app-splash .splash-eq span{ width:6px; height:14px; border-radius:6px; background:linear-gradient(180deg,#c39bff,#9328ff); box-shadow:0 0 14px rgba(147,40,255,0.55); animation:splashEq 1.05s ease-in-out infinite; }
  #app-splash .splash-eq span:nth-child(1){ animation-delay:0s; }
  #app-splash .splash-eq span:nth-child(2){ animation-delay:.15s; }
  #app-splash .splash-eq span:nth-child(3){ animation-delay:.3s; }
  #app-splash .splash-eq span:nth-child(4){ animation-delay:.45s; }
  #app-splash .splash-eq span:nth-child(5){ animation-delay:.6s; }
  #app-splash .splash-word{ font-family:'Special Gothic Expanded One','Manrope',sans-serif; font-size:32px; line-height:1; letter-spacing:.16em; color:#fff; text-transform:uppercase; }
  #app-splash .splash-sub{ font-family:'Manrope',system-ui,sans-serif; font-size:11px; letter-spacing:.34em; text-transform:uppercase; color:rgba(255,255,255,0.4); }
  @keyframes splashSpin{ to{ transform:rotate(360deg); } }
  @keyframes splashEq{ 0%,100%{ height:12px; } 50%{ height:38px; } }
  @media (prefers-reduced-motion: reduce){
    #app-splash .splash-ring::after{ animation:none; }
    #app-splash .splash-eq span{ animation:none; height:26px; }
  }

  /* range sliders */
  input[type=range].tr{ -webkit-appearance:none; appearance:none; height:6px; border-radius:999px; background:linear-gradient(to right, var(--treesh-purple) var(--fill,0%), rgba(255,255,255,0.16) var(--fill,0%)); outline:none; cursor:pointer; width:100%; }
  input[type=range].tr::-webkit-slider-runnable-track{ -webkit-appearance:none; appearance:none; height:6px; border-radius:999px; background:transparent; border:none; }
  input[type=range].tr::-webkit-slider-thumb{ -webkit-appearance:none; appearance:none; margin-top:-4px; width:14px; height:14px; border-radius:50%; background:#fff; box-shadow:0 0 10px var(--treesh-purple); border:none; }
  input[type=range].tr::-moz-range-track{ height:6px; border-radius:999px; background:transparent; border:none; }
  input[type=range].tr::-moz-range-thumb{ width:14px; height:14px; border:none; border-radius:50%; background:#fff; box-shadow:0 0 10px var(--treesh-purple); }
  input[type=range].tr:focus,input[type=range].tr:hover,input[type=range].tr:active{ outline:none; box-shadow:none; background:linear-gradient(to right, var(--treesh-purple) var(--fill,0%), rgba(255,255,255,0.16) var(--fill,0%)); }
  input[type=range].tr:focus::-webkit-slider-runnable-track,input[type=range].tr:active::-webkit-slider-runnable-track,input[type=range].tr:hover::-webkit-slider-runnable-track{ background:transparent; }
  @property --ab-charge{ syntax:'<angle>'; inherits:false; initial-value:0deg; }
  .ab-charging{ position:relative; }
  .ab-charging::after{ content:""; position:absolute; inset:-4px; border-radius:9999px; pointer-events:none; background:conic-gradient(var(--treesh-purple) var(--ab-charge,0deg), rgba(255,255,255,0.14) 0deg); -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px)); mask:radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px)); animation:abCharge 1.5s linear forwards; }
  @keyframes abCharge{ from{ --ab-charge:0deg; } to{ --ab-charge:360deg; } }
  input[type=range].tr:focus-visible{ outline:none; }
  /* Equalizer vertical band sliders */
  .eq-col{ display:flex; flex-direction:column; align-items:center; gap:5px; flex:1 1 0; min-width:0; }
  .eq-track{ position:relative; height:120px; width:100%; }
  @media (min-width:640px){ .eq-track{ height:132px; } }
  .eq-track input[type=range]{ position:absolute; top:50%; left:50%; width:120px; height:20px; margin:0; transform:translate(-50%,-50%) rotate(-90deg); -webkit-appearance:none; appearance:none; background:transparent; outline:none; cursor:pointer; }
  @media (min-width:640px){ .eq-track input[type=range]{ width:132px; } }
  .eq-track input[type=range]::-webkit-slider-runnable-track{ height:5px; border-radius:999px; background:linear-gradient(to right, var(--treesh-purple) var(--fill,50%), rgba(255,255,255,0.14) var(--fill,50%)); }
  .eq-track input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; appearance:none; margin-top:-5px; width:15px; height:15px; border-radius:50%; background:#fff; box-shadow:0 0 8px var(--treesh-purple); border:none; }
  .eq-track input[type=range]::-moz-range-track{ height:5px; border-radius:999px; background:rgba(255,255,255,0.14); }
  .eq-track input[type=range]::-moz-range-progress{ height:5px; border-radius:999px; background:var(--treesh-purple); }
  .eq-track input[type=range]::-moz-range-thumb{ width:15px; height:15px; border:none; border-radius:50%; background:#fff; box-shadow:0 0 8px var(--treesh-purple); }
  /* Keep the Equalizer modal from blowing out on small screens */
  [data-testid="equalizer-modal"] > [data-act="modal-stop"]{ min-width:0; max-width:min(32rem, calc(100vw - 1.25rem)); overflow-x:hidden; }


  /* vinyl */
  .vinyl{ border-radius:50%; position:relative;
    background:repeating-radial-gradient(circle at center,rgba(255,255,255,0.045) 0px,rgba(255,255,255,0.045) 1px,rgba(0,0,0,0) 2px,rgba(0,0,0,0) 4px),radial-gradient(circle at 50% 50%,#1c1c20 0%,#0c0c0e 62%,#050506 100%);
    box-shadow:0 30px 80px rgba(0,0,0,0.6),inset 0 0 60px rgba(0,0,0,0.8); }
  .vinyl::after{ content:""; position:absolute; inset:8%; border-radius:50%; background:repeating-radial-gradient(circle at center,rgba(255,255,255,0.03) 0px,rgba(255,255,255,0.03) 1px,transparent 2px,transparent 5px); }
  .vinyl-label{ position:absolute; inset:33%; border-radius:50%; overflow:hidden; box-shadow:0 0 0 4px rgba(0,0,0,0.55),0 0 0 6px var(--treesh-purple-soft); background:#111; }
  .vinyl-hole{ position:absolute; top:50%; left:50%; width:10px; height:10px; border-radius:50%; background:#050506; transform:translate(-50%,-50%); box-shadow:0 0 0 2px rgba(255,255,255,0.15); z-index:3; }
  .spin{ animation:tspin 6s linear infinite; } .spin-paused{ animation-play-state:paused; }
  @keyframes tspin{ from{transform:rotate(0)} to{transform:rotate(360deg)} }

  /* equalizer */
  .eq{ display:inline-flex; align-items:flex-end; gap:2px; height:14px; }
  .eq span{ display:block; width:3px; height:100%; background:var(--treesh-purple); border-radius:2px; transform-origin:bottom; animation:teq .9s ease-in-out infinite; }
  .eq span:nth-child(2){ animation-delay:.15s } .eq span:nth-child(3){ animation-delay:.3s } .eq span:nth-child(4){ animation-delay:.45s }
  @keyframes teq{ 0%,100%{transform:scaleY(.3)} 50%{transform:scaleY(1)} }

  .shimmer{ background:linear-gradient(100deg,#fff 20%,var(--treesh-gold) 40%,#fff 60%); background-size:200% auto; -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; animation:tshim 6s linear infinite; }
  @keyframes tshim{ 0%{background-position:0% 50%} 100%{background-position:200% 50%} }

  .voice-pulse::before,.voice-pulse::after{ content:""; position:absolute; inset:0; border-radius:50%; border:2px solid var(--treesh-purple); animation:tping 1.6s cubic-bezier(0,0,0.2,1) infinite; }
  .voice-pulse::after{ animation-delay:.8s; }
  @keyframes tping{ 0%{transform:scale(1);opacity:.7} 100%{transform:scale(2.2);opacity:0} }
  /* voice assistant waveform + typing dots */
  .voice-wave{ display:flex; align-items:center; justify-content:center; gap:5px; height:38px; }
  .voice-wave span{ display:block; width:4px; height:100%; border-radius:999px; background:var(--treesh-purple); transform-origin:center; animation:vwave 1.05s ease-in-out infinite; }
  .voice-wave span:nth-child(1){animation-delay:-.9s} .voice-wave span:nth-child(2){animation-delay:-.7s} .voice-wave span:nth-child(3){animation-delay:-.5s} .voice-wave span:nth-child(4){animation-delay:-.3s} .voice-wave span:nth-child(5){animation-delay:-.15s} .voice-wave span:nth-child(6){animation-delay:-.45s} .voice-wave span:nth-child(7){animation-delay:-.65s}
  @keyframes vwave{ 0%,100%{transform:scaleY(.22)} 50%{transform:scaleY(1)} }
  .voice-dots span{ display:inline-block; animation:vdots 1.4s infinite; } .voice-dots span:nth-child(2){ animation-delay:.2s } .voice-dots span:nth-child(3){ animation-delay:.4s }
  @keyframes vdots{ 0%,60%,100%{opacity:.25} 30%{opacity:1} }

  /* ---------- motion system ---------- */
  .fade-in{ animation:tfade .34s cubic-bezier(.22,1,.36,1) both; } @keyframes tfade{ from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }
  .np-line{ transition:color .3s ease, transform .35s cubic-bezier(.22,1,.36,1), text-shadow .3s ease; }

  /* page / view navigation */
  .view-in{ animation:viewIn .42s cubic-bezier(.22,1,.36,1) both; } @keyframes viewIn{ from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:none} }
  /* scroll-reveal + staggered entrance */
  @keyframes trRevealUp{ from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:none} }
  .reveal-stagger{ animation:trRevealUp .5s cubic-bezier(.22,1,.36,1) both; }
  .io-reveal{ opacity:0; transform:translateY(18px); }
  .io-reveal.io-in{ opacity:1; transform:none; transition:opacity .6s cubic-bezier(.22,1,.36,1), transform .6s cubic-bezier(.22,1,.36,1); }
  html.perf-mode .reveal-stagger{ animation:none !important } html.perf-mode .io-reveal{ opacity:1 !important; transform:none !important }

  /* now-playing sheet */
  @keyframes npUp{ from{opacity:0;transform:translateY(7%)} to{opacity:1;transform:none} }
  @keyframes npDown{ from{opacity:1;transform:none} to{opacity:0;transform:translateY(9%)} }
  .np-entering{ animation:npUp .46s cubic-bezier(.22,1,.36,1) both; }
  .np-leaving{ animation:npDown .34s cubic-bezier(.4,0,1,.6) both; }
  @keyframes npContent{ from{opacity:0;transform:translateY(12px) scale(.99)} to{opacity:1;transform:none} }
  .np-content-in{ animation:npContent .38s cubic-bezier(.22,1,.36,1) both; }

  /* modal / popup */
  @keyframes backdropIn{ from{opacity:0} to{opacity:1} }
  @keyframes backdropOut{ from{opacity:1} to{opacity:0} }
  @keyframes panelIn{ from{opacity:0;transform:translateY(16px) scale(.95)} to{opacity:1;transform:none} }
  @keyframes panelOut{ from{opacity:1;transform:none} to{opacity:0;transform:translateY(10px) scale(.97)} }
  .backdrop-in{ animation:backdropIn .26s ease both; }
  .backdrop-out{ animation:backdropOut .2s ease both; }
  .panel-in{ animation:panelIn .4s cubic-bezier(.22,1,.36,1) both; }
  .panel-out{ animation:panelOut .2s cubic-bezier(.4,0,1,.6) both; }
  @keyframes obStep{ from{opacity:0;transform:translateX(22px)} to{opacity:1;transform:none} }
  .ob-step-in{ animation:obStep .34s cubic-bezier(.22,1,.36,1) both; }

  /* queue drawer */
  @keyframes drawerIn{ from{transform:translateX(100%)} to{transform:translateX(0)} }
  @keyframes drawerOut{ from{transform:translateX(0)} to{transform:translateX(100%)} }
  .drawer-in{ animation:drawerIn .42s cubic-bezier(.22,1,.36,1) both; }
  .drawer-out{ animation:drawerOut .3s cubic-bezier(.4,0,1,.6) both; }

  /* mini player */
  @keyframes miniUp{ from{opacity:0;transform:translateY(130%)} to{opacity:1;transform:none} }
  .mini-in{ animation:miniUp .5s cubic-bezier(.22,1,.36,1) both; }

  /* toast */
  @keyframes toastIn{ from{opacity:0;transform:translateY(-16px) scale(.95)} to{opacity:1;transform:none} }
  @keyframes toastOut{ from{opacity:1;transform:none} to{opacity:0;transform:translateY(-10px) scale(.98)} }
  .toast-in{ animation:toastIn .34s cubic-bezier(.22,1,.36,1) both; }
  .toast-out{ animation:toastOut .28s ease both; }

  /* micro interactions */
  .card-lift{ transition:transform .24s cubic-bezier(.22,1,.36,1), box-shadow .24s ease, border-color .24s ease; will-change:transform; }
  @media (hover:hover){ .card-lift:hover{ transform:translateY(-5px); } }
  .press{ transition:transform .13s ease; } .press:active{ transform:scale(.93); }

  /* My Music: hold-to-shuffle feedback + dropdown marker */
  @keyframes mmHold{ from{ box-shadow:0 0 0 0 rgba(147,40,255,0.0);} to{ box-shadow:0 0 0 6px rgba(147,40,255,0.18);} }
  .mm-play.mm-holding{ animation:mmHold 1.5s ease-out forwards; transform:scale(1.05); }
  .mm-menu > summary{ list-style:none; }
  .mm-menu > summary::-webkit-details-marker{ display:none; }
  .mm-menu > summary::marker{ content:""; }
  .libpl-menu > summary{ list-style:none; }
  .libpl-menu > summary::-webkit-details-marker{ display:none; }
  .libpl-menu > summary::marker{ content:""; }

  /* drag-to-reorder */
  .reorder-dragging{ opacity:.92; transform:scale(1.02); box-shadow:0 14px 40px rgba(0,0,0,0.5); background:rgba(255,255,255,0.06); position:relative; z-index:5; }
  [data-rhandle]{ cursor:grab; touch-action:none; }
  [data-rhandle]:active{ cursor:grabbing; }

  /* what's new carousel */
  .wn-img{ transform:scale(1.05); }
  .wn-slide.wn-active .wn-img{ animation:wnZoom 7.5s ease-out both; }
  @keyframes wnZoom{ from{ transform:scale(1.05) } to{ transform:scale(1.16) } }

  /* ---------- like / favorite hearts (reliable, no JIT dependency) ---------- */
  .tr-like svg,.tr-favline svg{ transition:transform .2s cubic-bezier(.34,1.56,.64,1),fill .18s ease,color .18s ease; }
  .tr-like.is-liked svg,.tr-favline.is-liked svg{ fill:var(--treesh-purple); color:var(--treesh-purple); filter:drop-shadow(0 0 5px var(--treesh-purple-soft)); }
  .tr-like.is-liked{ color:var(--treesh-purple); }
  .tr-dislike svg{ transition:transform .2s cubic-bezier(.34,1.56,.64,1),color .18s ease; }
  .tr-dislike.is-disliked svg{ color:var(--treesh-purple); filter:drop-shadow(0 0 5px var(--treesh-purple-soft)); }
  .tr-dislike.is-disliked{ color:var(--treesh-purple); }
  @keyframes dislikeShake{ 0%{transform:rotate(0)} 20%{transform:rotate(-14deg)} 40%{transform:rotate(11deg)} 60%{transform:rotate(-7deg)} 80%{transform:rotate(4deg)} 100%{transform:rotate(0)} }
  .dislike-shake{ animation:dislikeShake .45s ease; }
  @keyframes heartPop{ 0%{transform:scale(1)} 25%{transform:scale(1.55)} 45%{transform:scale(.82)} 70%{transform:scale(1.14)} 100%{transform:scale(1)} }
  .heart-pop{ animation:heartPop .5s cubic-bezier(.34,1.56,.64,1); }
  @keyframes heartUnpop{ 0%{transform:scale(1)} 40%{transform:scale(.68)} 100%{transform:scale(1)} }
  .heart-unpop{ animation:heartUnpop .34s ease; }

  /* floating heart burst particles */
  #fx-layer{ position:fixed; inset:0; z-index:200; pointer-events:none; overflow:hidden; }
  .fx-heart{ position:fixed; will-change:transform,opacity; pointer-events:none; animation:fxFloat var(--dur,900ms) cubic-bezier(.22,1,.36,1) forwards; }
  .fx-heart svg{ display:block; width:var(--size,16px); height:var(--size,16px); }
  @keyframes fxFloat{
    0%{ transform:translate(-50%,-50%) scale(.2) rotate(0deg); opacity:0; }
    18%{ opacity:1; transform:translate(-50%,-50%) scale(1) rotate(calc(var(--rot)*.3)); }
    100%{ transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(var(--end,.55)) rotate(var(--rot)); opacity:0; }
  }
  .fx-ring{ position:fixed; width:16px; height:16px; border-radius:999px; border:2px solid var(--treesh-purple); pointer-events:none; animation:fxRing .58s cubic-bezier(.22,1,.36,1) forwards; }
  @keyframes fxRing{ from{ transform:translate(-50%,-50%) scale(.4); opacity:.65; } to{ transform:translate(-50%,-50%) scale(3.8); opacity:0; } }

  /* ---------- like = one big heart floating up like a balloon ---------- */
  .fx-balloon{ position:fixed; z-index:200; pointer-events:none; animation:fxBalloonUp 1.5s cubic-bezier(.22,1,.36,1) forwards; }
  .fx-balloon-inner{ display:block; animation:fxSway 1.5s ease-in-out both; }
  .fx-balloon svg{ display:block; width:66px; height:66px; filter:drop-shadow(0 10px 26px var(--treesh-purple-soft)); }
  @keyframes fxBalloonUp{ 0%{ transform:translate(-50%,-50%) scale(.35); opacity:0; } 15%{ opacity:1; transform:translate(-50%,-66%) scale(1.1); } 78%{ opacity:1; } 100%{ transform:translate(calc(-50% + var(--sway,0px)),-370px) scale(.82); opacity:0; } }

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" onerror="this.onerror=null;var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js';s.onload=function(){try{lucide.createIcons();}catch(e){}};document.head.appendChild(s);"></script>
<script>
/* ============================================================
   TREESH 3.0 - single-file build. Data embedded below.
   User data (favorites, playlists, profile, theme) -> localStorage.
   Audio + cover art stream from external hosts (free, CORS-enabled).
   ============================================================ */
/* ---------- utils ---------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const icons = () => { try { if (window.lucide) lucide.createIcons(); } catch(e){} };
/* Global icon safety net: some render paths insert <i data-lucide> placeholders
   without a follow-up icons() call, so icons could vanish after scrolling / modal
   churn. Watch for newly inserted <i data-lucide> (placeholders only, never the
   converted <svg>) and convert them on the next frame. Debounced; cannot loop. */
let _iconTimer=null;
function scheduleIcons(){ if(_iconTimer) return; _iconTimer=setTimeout(()=>{ _iconTimer=null; if(window.lucide && document.querySelector('i[data-lucide]')) icons(); }, 30); }
function initIconWatch(){
  try{
    const mo=new MutationObserver(muts=>{
      for(let i=0;i<muts.length;i++){ const a=muts[i].addedNodes; if(!a||!a.length) continue;
        for(let x=0;x<a.length;x++){ const n=a[x]; if(!n||n.nodeType!==1) continue;
          if((n.tagName==='I' && n.hasAttribute('data-lucide')) || (n.querySelector && n.querySelector('i[data-lucide]'))){ scheduleIcons(); return; } } }
    });
    mo.observe(document.body,{childList:true,subtree:true});
  }catch(e){}
}
const esc = (s) => String(s==null?"":s).replace(/\u2014/g,'-').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const slug = (t) => (t||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"") || Math.random().toString(36).slice(2,8);
const VOICE_OK = (typeof window!=='undefined') && !!(window.SpeechRecognition||window.webkitSpeechRecognition);
const FALLBACK = "data:image/svg+xml;utf8," + encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><rect width='100%' height='100%' fill='#161618'/><text x='50%' y='53%' font-size='120' text-anchor='middle' fill='#3a3a40' font-family='sans-serif'>\u266A</text></svg>");
const img = (src, cls, extra="") => `<img src="${esc(src||FALLBACK)}" loading="lazy" onerror="this.src='${FALLBACK}'" class="${cls}" ${extra}>`;
function fmt(sec){ if(!sec||isNaN(sec)||sec===Infinity) return "0:00"; const m=Math.floor(sec/60),s=Math.floor(sec%60); return m+":"+(s<10?"0":"")+s; }
function zodiac(b){ if(!b) return ""; const p=String(b).split("-"); if(p.length<3) return ""; const mo=+p[1],d=+p[2]; if(!mo||!d||mo<1||mo>12) return ""; const S=[[1,19,"Capricorn"],[2,18,"Aquarius"],[3,20,"Pisces"],[4,19,"Aries"],[5,20,"Taurus"],[6,20,"Gemini"],[7,22,"Cancer"],[8,22,"Leo"],[9,22,"Virgo"],[10,22,"Libra"],[11,21,"Scorpio"],[12,21,"Sagittarius"]]; const e=S[mo-1]; return d<=e[1] ? e[2] : S[mo%12][2]; }
/* ---- age gate / parental controls ---- */
function ageFromDate(b){ if(!b) return null; const p=String(b).split("-"); if(p.length<3) return null; const y=+p[0],mo=+p[1],d=+p[2]; if(!y||!mo||!d) return null; const now=new Date(); let a=now.getFullYear()-y; const md=(now.getMonth()+1)*100+now.getDate(); if(md<(mo*100+d)) a--; return a; }
function userAge(){ const a=ageFromDate(state.profile&&state.profile.birthday); return (a!=null&&a>=0&&a<130)?a:null; }
function isUnderage(){ const a=userAge(); return a!==null && a<18; }
function explicitOK(){ return !isUnderage() || !!state.explicitUnlocked; }
function vis(list){ if(explicitOK()) return list; return (list||[]).filter(s=> s && !s.explicit); }
function bdayEditCount(){ return (state.bdayEdits!=null)?state.bdayEdits:((state.profile&&state.profile.birthday)?1:0); }
function bdayLocked(){ return bdayEditCount()>=2; }
function bumpBdayEdits(){ state.bdayEdits=bdayEditCount()+1; LS.set("treesh_bday_edits",state.bdayEdits); }

/* ============================================================
   LIVE CATALOG LOADER
   Data is fetched at runtime from same-origin content pages
   (/content/songs, /content/icons, /content/lyrics), parsed from
   HTML, normalized, and cached to localStorage. This keeps the app
   in sync with the live Treesh catalog with zero backend.
   ============================================================ */
let SONGS = [], ARTISTS = [], GENRES = [], SONG_BY_ID = {}, ARTIST_BY_ID = {}, ARTIST_SONG_IDS = {}, USER_SONGS = [];

const CONTENT_SOURCES = {
  songs:  ["content/songs",  "/content/songs",  "https://treesh.app/content/songs"],
  icons:  ["content/icons",  "/content/icons",  "https://treesh.app/content/icons"],
  lyrics: ["content/lyrics", "/content/lyrics", "https://treesh.app/content/lyrics"],
};
const CATALOG_KEY = "treesh_catalog_v3";

async function fetchFirst(urls){
  let lastErr;
  for(const u of urls){
    try{
      const ctrl = new AbortController(); const to = setTimeout(()=>ctrl.abort(), 15000);
      const r = await fetch(u, { cache:"no-store", signal: ctrl.signal }); clearTimeout(to);
      if(r.ok){ const t = await r.text(); if(t && t.trim().length > 40) return t; }
    }catch(e){ lastErr = e; }
  }
  throw lastErr || new Error("Unable to load "+urls[0]);
}
const parseDoc = (str) => new DOMParser().parseFromString(str, "text/html");
const attr = (el, name) => (el.getAttribute(name) || "").trim();
const normKey = (s) => String(s==null?"":s).toLowerCase().replace(/[\u2018\u2019\u201c\u201d]/g,"'").replace(/[^a-z0-9]+/g,"");

function parseSongs(doc){
  const used = new Set(), out = [];
  doc.querySelectorAll("ul.song").forEach((el, i) => {
    const title = attr(el,"data-track"), audioUrl = attr(el,"data-mp3");
    if(!title || !audioUrl) return; // skip template/empty rows
    const artist = attr(el,"data-artist"), aid = attr(el,"data-artist-id");
    let id = slug(artist + "-" + title) || ("track-" + i);
    while(used.has(id)) id = id + "-" + i;
    used.add(id);
    out.push({
      id, title, artist, artistIds: aid ? aid.split(",").map(x => x.trim()).filter(Boolean) : [],
      genre: attr(el,"data-genre"), mood: attr(el,"data-mood"),
      creationDate: attr(el,"data-creation-date"), writtenBy: attr(el,"data-written-by"),
      producer: attr(el,"data-producer"), mixer: attr(el,"data-mixer"),
      videographer: attr(el,"data-videographer"), featuring: attr(el,"data-featuring"),
      album: attr(el,"data-album"), label: attr(el,"data-label"),
      coverArt: attr(el,"data-coverart"), audioUrl, videoId: attr(el,"data-video"),
      bio: attr(el,"data-bio"), desc: attr(el,"data-desc"),
      explicit: el.hasAttribute("data-explicit"),
      treeshChoice: el.hasAttribute("data-treeshChoice") || el.hasAttribute("data-exclusive"),
      exclusive: el.hasAttribute("data-exclusive"),
      lyrics: [],
    });
  });
  return out;
}

function parseArtists(doc){
  const out = [];
  doc.querySelectorAll("article.artist").forEach(el => {
    const id = attr(el,"data-artist-id"); if(!id) return;
    const imgEl = el.querySelector("img.artist__image") || el.querySelector("img");
    const roleEl = el.querySelector(".artist__label .capital");
    const bg = attr(el,"data-bg");
    out.push({
      id, name: attr(el,"data-name"), bio: attr(el,"data-bio"),
      background: bg, bgPos: attr(el,"data-bg-pos") || "center",
      cashapp: attr(el,"data-cashapp"),
      role: roleEl ? roleEl.textContent.trim() : "Music Artist",
      image: (imgEl && imgEl.getAttribute("src")) || bg,
    });
  });
  return out;
}

function parseTimecode(str){
  if(!str) return 0;
  const parts = String(str).split(":").map(x => parseFloat(x));
  if(parts.some(isNaN)) return 0;
  if(parts.length === 3) return parts[0]*3600 + parts[1]*60 + parts[2];
  if(parts.length === 2) return parts[0]*60 + parts[1];
  return parts[0] || 0;
}
function parseLyrics(doc){
  const byKey = {}, byTitle = {};
  doc.querySelectorAll("div.lyric").forEach(el => {
    const track = attr(el,"data-track"), artist = attr(el,"data-artist");
    const lines = [];
    let curSec = null, pendingSec = null;
    el.querySelectorAll("p").forEach(p => {
      const text = p.textContent.trim(); if(!text) return;
      const dm = p.getAttribute("data-minutes"), ds = p.getAttribute("data-seconds");
      const hasM = dm!=null && dm.trim()!=="";
      const hasS = ds!=null && ds.trim()!=="";
      const hm = text.match(/^\[(.+)\]$/);
      if(hm){
        const inside = hm[1].trim();
        // section marker (e.g. "Verse 1: Artist"); skip pure repeat/adlib markers like "x2"
        if(/[a-zA-Z]/.test(inside) && !/^x\s*\d+$/i.test(inside)){ curSec = inside; pendingSec = inside; }
        return; // bracket lines are markers, not sung lyric lines
      }
      const t = hasM ? (dm.includes(":") ? parseTimecode(dm) : (parseFloat(dm)||0)) : (hasS ? (parseFloat(ds)||0) : null);
      if(t==null) return; // skip untimed, non-header text
      const explain = (p.getAttribute("data-explain")||"").trim();
      lines.push({ t, text, sec: curSec, explain }); pendingSec = null;
    });
    if(!lines.length) return;
    lines.sort((a,b) => a.t - b.t);
    if(pendingSec){ lines.push({ t:(lines.length?lines[lines.length-1].t:0)+0.01, text:"", sec:pendingSec, secOnly:true }); }
    byKey[normKey(track) + "|" + normKey(artist)] = lines;
    if(!byTitle[normKey(track)]) byTitle[normKey(track)] = lines;
  });
  return { byKey, byTitle };
}
function attachLyrics(songs, lyr){
  songs.forEach(s => { s.lyrics = lyr.byKey[normKey(s.title)+"|"+normKey(s.artist)] || lyr.byTitle[normKey(s.title)] || []; });
}
function indexCatalog(){
  SONG_BY_ID = Object.fromEntries(SONGS.map(s => [s.id, s]));
  ARTIST_BY_ID = Object.fromEntries(ARTISTS.map(a => [a.id, a]));
  GENRES = [...new Set(SONGS.map(s => s.genre).filter(Boolean))].sort();
  applyLyricEdits();
  buildArtistSongIndex();
}
/* Map each artist id -> set of song ids they perform on. Includes the primary
   artist, name/featuring matches, AND lyric-section performers so members of a
   group (e.g. Zuubandz in a PerfekTenz track) get credit on their own profile. */
function buildArtistSongIndex(){
  ARTIST_SONG_IDS = {};
  const byName = {}; ARTISTS.forEach(a => { byName[normKey(a.name)] = a.id; });
  const add = (id, sid) => { if(!id) return; (ARTIST_SONG_IDS[id] || (ARTIST_SONG_IDS[id] = new Set())).add(sid); };
  const secCache = {};
  const psec = (sec) => { if(sec==null) return null; if(sec in secCache) return secCache[sec]; const r = (typeof parseSection==="function") ? parseSection(sec) : null; secCache[sec] = r; return r; };
  SONGS.forEach(s => {
    if(s._user) return; // custom uploads never appear on a real Icon's profile
    (s.artistIds || []).forEach(id => add(id, s.id));
    const pid = byName[normKey(s.artist)]; if(pid) add(pid, s.id);
    if(s.featuring){ String(s.featuring).split(/\s*[,&\/+\u00d7]\s*|\s+(?:feat\.?|ft\.?|featuring|with|and|x)\s+/i).forEach(n => { const id = byName[normKey(n)]; if(id) add(id, s.id); }); }
    (s.lyrics || []).forEach(l => { const info = psec(l.sec); if(info && info.artists) info.artists.forEach(a => { const id = a.id || byName[normKey(a.name)]; if(id) add(id, s.id); }); });
  });
}
function applyLyricEdits(){ try{ const ed=(state&&state.lyricEdits)||{}; for(const id in ed){ if(SONG_BY_ID[id] && Array.isArray(ed[id])) SONG_BY_ID[id].lyrics=ed[id]; } }catch(e){} }

/* ================= Custom Music (IndexedDB) =================
   User-uploaded tracks are stored as Blobs in IndexedDB (bypasses the
   localStorage quota). They live in USER_SONGS (separate from the parsed
   catalog) and are merged into SONGS after every catalog (re)load so the
   60s catalog refresh never wipes them, and they never leak into the
   localStorage catalog cache. Object URLs are (re)generated on each load. */
const IDB_NAME="treesh_media", IDB_VER=1, IDB_STORE="tracks";
const USER_MAX_BYTES=30*1024*1024; // ~30 MB per track
let _idbPromise=null;
function idbOpen(){
  if(_idbPromise) return _idbPromise;
  _idbPromise=new Promise((res,rej)=>{
    let rq; try{ rq=indexedDB.open(IDB_NAME, IDB_VER); }catch(e){ return rej(e); }
    rq.onupgradeneeded=e=>{ const db=e.target.result; if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE,{keyPath:"id"}); };
    rq.onsuccess=e=>res(e.target.result);
    rq.onerror=e=>rej(e.target.error||new Error("IndexedDB open failed"));
  });
  return _idbPromise;
}
function idbTx(mode){ return idbOpen().then(db=>db.transaction(IDB_STORE, mode).objectStore(IDB_STORE)); }
function idbPut(rec){ return idbTx("readwrite").then(store=>new Promise((res,rej)=>{ const r=store.put(rec); r.onsuccess=()=>res(true); r.onerror=()=>rej(r.error); })); }
function idbGetAll(){ return idbTx("readonly").then(store=>new Promise((res,rej)=>{ const r=store.getAll(); r.onsuccess=()=>res(r.result||[]); r.onerror=()=>rej(r.error); })); }
function idbDelete(id){ return idbTx("readwrite").then(store=>new Promise((res,rej)=>{ const r=store.delete(id); r.onsuccess=()=>res(true); r.onerror=()=>rej(r.error); })); }
function idbGet(id){ return idbTx("readonly").then(store=>new Promise((res,rej)=>{ const r=store.get(id); r.onsuccess=()=>res(r.result||null); r.onerror=()=>rej(r.error); })); }
/* Wipe the IndexedDB media store (uploaded audio + cover art blobs). Clears the
   object store first (works even if a delete is blocked by open connections),
   then attempts to delete the whole database. */
function idbWipe(){
  return (async()=>{
    try{ const store=await idbTx("readwrite"); await new Promise((res)=>{ const r=store.clear(); r.onsuccess=()=>res(); r.onerror=()=>res(); }); }catch(e){}
    return new Promise((res)=>{ try{ const rq=indexedDB.deleteDatabase(IDB_NAME); rq.onsuccess=()=>res(true); rq.onerror=()=>res(true); rq.onblocked=()=>res(true); setTimeout(()=>res(true),1500); }catch(e){ res(true); } });
  })();
}
/* Full factory reset: erase ALL local data (localStorage + sessionStorage +
   IndexedDB) and reload to a clean URL so the app returns to its default state
   (Library view + Welcome/onboarding). */
async function eraseAllData(){
  try{ if(typeof audio!=="undefined" && audio){ audio.pause(); audio.removeAttribute("src"); audio.load(); } }catch(e){}
  try{ const rm=[]; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k && k.indexOf("treesh")===0) rm.push(k); } rm.forEach(k=>{ try{ localStorage.removeItem(k); }catch(e){} }); }catch(e){}
  try{ localStorage.clear(); }catch(e){}
  try{ sessionStorage.clear(); }catch(e){}
  try{ await idbWipe(); }catch(e){}
  try{ window.location.replace(location.origin+location.pathname); }
  catch(e){ try{ location.hash=""; }catch(_){} location.reload(); }
}


function userRecToSong(rec){
  const m=rec.meta||{};
  let audioUrl="", coverArt=FALLBACK;
  try{ if(rec.audioBlob) audioUrl=URL.createObjectURL(rec.audioBlob); }catch(e){}
  try{ if(rec.coverBlob) coverArt=URL.createObjectURL(rec.coverBlob); }catch(e){}
  return {
    id:rec.id, _user:true, source:"user",
    title:m.title||"Untitled", artist:m.artist||"You", artistIds:[],
    genre:m.genre||"My Music", mood:m.mood||"", creationDate:m.creationDate||"",
    writtenBy:m.writtenBy||"", producer:m.producer||"", mixer:m.mixer||"",
    videographer:m.videographer||"", featuring:m.featuring||"",
    album:m.album||"", label:m.label||"", coverArt, audioUrl, videoId:"",
    bio:"", desc:m.desc||"", explicit:!!m.explicit,
    treeshChoice:false, exclusive:false, lyrics:[], duration:rec.duration||0,
    _urls:[audioUrl, coverArt!==FALLBACK?coverArt:null].filter(Boolean)
  };
}
/* Rebuild SONGS as (catalog + user tracks) and re-index everything. */
function mergeUserSongs(){
  SONGS = SONGS.filter(s=>!s._user).concat(USER_SONGS);
  indexCatalog();
}
/* Extract an average/vibrant color (as "r,g,b") from a same-origin cover URL.
   Used to softly tint My Music cards and the Custom Studio. Returns null for
   remote/tainted images or near-gray covers so we can fall back to the accent. */
function avgColorFromUrl(url){
  return new Promise(res=>{
    if(!url){ res(null); return; }
    try{
      const im=new Image(); im.crossOrigin="anonymous";
      im.onload=()=>{ try{
        const s=24, c=document.createElement('canvas'); c.width=s; c.height=s;
        const ctx=c.getContext('2d'); ctx.drawImage(im,0,0,s,s);
        const d=ctx.getImageData(0,0,s,s).data;
        let r=0,g=0,b=0,n=0;
        for(let i=0;i<d.length;i+=4){ if(d[i+3]<128) continue; r+=d[i]; g+=d[i+1]; b+=d[i+2]; n++; }
        if(!n){ res(null); return; }
        r=Math.round(r/n); g=Math.round(g/n); b=Math.round(b/n);
        if(Math.max(r,g,b)-Math.min(r,g,b)<16){ res(null); return; }
        res([r,g,b]);
      }catch(e){ res(null); } };
      im.onerror=()=>res(null);
      im.src=url;
    }catch(e){ res(null); }
  });
}
async function computeUserGlows(){
  let changed=false;
  for(const s of USER_SONGS){
    if(s.glow!==undefined) continue;
    if(!s.coverArt || s.coverArt===FALLBACK){ s.glow=null; continue; }
    try{ const c=await avgColorFromUrl(s.coverArt); s.glow=c?(c[0]+","+c[1]+","+c[2]):null; if(c) changed=true; }catch(e){ s.glow=null; }
  }
  if(changed && typeof softRefresh==="function") softRefresh();
}
async function loadUserSongs(){
  try{
    const recs=await idbGetAll();
    recs.sort((a,b)=>(a.addedAt||0)-(b.addedAt||0));
    // revoke any previously-created object URLs before regenerating
    // ...but never revoke a blob URL that is currently playing (mobile background fix)
    const _curSrc=(state.audio&&state.audio.src)||"";
    USER_SONGS.forEach(s=>(s._urls||[]).forEach(u=>{ if(u&&u===_curSrc) return; try{ URL.revokeObjectURL(u); }catch(e){} }));
    USER_SONGS=recs.map(userRecToSong);
    mergeUserSongs();
    if(typeof softRefresh==="function") softRefresh();
    computeUserGlows();
  }catch(e){ console.warn("Custom music load failed:", e); }
}

let _catalogSig = "";
function catalogSig(songs, artists){
  const str = songs.map(x=>x.id).join(",") + "~" + artists.map(x=>x.id).join(",");
  let h=0; for(let i=0;i<str.length;i++){ h=(h*31 + str.charCodeAt(i))>>>0; }
  return songs.length + "|" + artists.length + "|" + h;
}
async function loadCatalog(){
  const [songsHTML, iconsHTML, lyricsHTML] = await Promise.all([
    fetchFirst(CONTENT_SOURCES.songs),
    fetchFirst(CONTENT_SOURCES.icons),
    fetchFirst(CONTENT_SOURCES.lyrics),
  ]);
  const songs = parseSongs(parseDoc(songsHTML));
  const artists = parseArtists(parseDoc(iconsHTML));
  attachLyrics(songs, parseLyrics(parseDoc(lyricsHTML)));
  if(!songs.length) throw new Error("No songs found in catalog");
  const sig = catalogSig(songs, artists);
  const changed = sig !== _catalogSig;
  SONGS = songs; ARTISTS = artists; indexCatalog(); _catalogSig = sig;
  if(changed){ state._wnBuilt=null; state._picks=null; }
  try{ localStorage.setItem(CATALOG_KEY, JSON.stringify({ songs: songs, artists: artists, ts: Date.now() })); }catch(e){}
  mergeUserSongs();
  return { changed };
}
function loadCatalogCache(){
  try{
    const c = JSON.parse(localStorage.getItem(CATALOG_KEY) || "null");
    if(c && Array.isArray(c.songs) && c.songs.length){ SONGS = c.songs; ARTISTS = c.artists || []; indexCatalog(); _catalogSig = catalogSig(SONGS, ARTISTS); return c.ts || 0; }
  }catch(e){}
  return 0;
}
/* ---------- real-time catalog polling (keeps What's New fresh) ---------- */
let _catalogPollTimer=null, _refreshing=false;
async function refreshCatalog(){
  if(_refreshing) return; _refreshing=true;
  const prevS=SONGS.length, prevA=ARTISTS.length;
  try{
    const res = await loadCatalog();
    if(res.changed){
      softRefresh();
      const dS=SONGS.length-prevS, dA=ARTISTS.length-prevA;

/* Downscale + recompress an uploaded image so it reliably fits in localStorage.
   Full-screen backgrounds don't need more than ~1600px; JPEG keeps size tiny. */
function compressImageDataUrl(dataUrl, maxDim, quality){
  return new Promise((resolve,reject)=>{
    try{
      const im=new Image();
      im.onload=()=>{
        try{
          let w=im.naturalWidth||im.width, h=im.naturalHeight||im.height;
          if(!w||!h){ resolve(dataUrl); return; }
          const scale=Math.min(1, maxDim/Math.max(w,h));
          w=Math.max(1,Math.round(w*scale)); h=Math.max(1,Math.round(h*scale));
          const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
          const ctx=cv.getContext("2d"); ctx.drawImage(im,0,0,w,h);
          let out; try{ out=cv.toDataURL("image/jpeg", quality); }catch(e){ out=dataUrl; }
          resolve(out && out.length ? out : dataUrl);
        }catch(e){ resolve(dataUrl); }
      };
      im.onerror=()=>reject(new Error("bad image"));
      im.src=dataUrl;
    }catch(e){ reject(e); }
  });
}

/* ---------- context-aware queue building (race-free) ----------

function resolveCtxList(tok){ if(!tok) return null;
  if(tok==='fav'||tok==='favorites') return favSongs();
  if(tok==='disliked') return dislikedSongs();
  if(tok.indexOf('pl:')===0){ const pl=(state.playlists||[]).find(p=>p.id===tok.slice(3)); if(pl) return vis((pl.songIds||[]).map(id=>SONG_BY_ID[id]).filter(Boolean)); }

  return null;
}

const paletteCache = new Map();
function extractPalette(url){ return new Promise(res=>{ if(!url) return res(null); if(paletteCache.has(url)) return res(paletteCache.get(url)); const im=new Image(); im.crossOrigin="anonymous"; let done=false; const fin=v=>{ if(!done){done=true; paletteCache.set(url,v); res(v);} }; const to=setTimeout(()=>fin(null),6000); im.onload=()=>{ clearTimeout(to); try{ const s=36,cv=document.createElement("canvas"); cv.width=s; cv.height=s; const ctx=cv.getContext("2d",{willReadFrequently:true}); ctx.drawImage(im,0,0,s,s); const d=ctx.getImageData(0,0,s,s).data; const buk={}; for(let i=0;i<d.length;i+=4){ if(d[i+3]<125) continue; const r=d[i],g=d[i+1],b=d[i+2]; const mx=Math.max(r,g,b),mn=Math.min(r,g,b),light=(mx+mn)/2,sat=mx===mn?0:(mx-mn)/(255-Math.abs(mx+mn-255)+1e-6); const key=(r>>4)+"-"+(g>>4)+"-"+(b>>4); if(!buk[key]) buk[key]={r:0,g:0,b:0,n:0,s:0,l:0}; const k=buk[key]; k.r+=r;k.g+=g;k.b+=b;k.n++;k.s+=sat;k.l+=light; } let arr=Object.values(buk).map(k=>({r:Math.round(k.r/k.n),g:Math.round(k.g/k.n),b:Math.round(k.b/k.n),n:k.n,sat:k.s/k.n,light:k.l/k.n})); if(!arr.length) return fin(null); arr.forEach(c=>{ const lp=(c.light>230||c.light<22)?0.25:1; c.score=c.n*(0.35+c.sat)*lp; }); arr.sort((a,b)=>b.score-a.score); const pick=[]; for(const c of arr){ if(pick.every(p=>Math.abs(p.r-c.r)+Math.abs(p.g-c.g)+Math.abs(p.b-c.b)>60)) pick.push(c); if(pick.length>=3) break; } while(pick.length<2&&arr.length) pick.push(arr[pick.length]||arr[0]); fin(pick.map(c=>({r:c.r,g:c.g,b:c.b}))); }catch(e){ fin(null);} }; im.onerror=()=>{ clearTimeout(to); fin(null); }; im.src=url; }); }

function normStr(s){ return String(s==null?"":s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim(); }

function fieldScore(text,qn,qTokens,qc){ const hn=normStr(text); if(!hn) return 0; const hc=hn.replace(/ /g,""); let sc=0; if(hn.includes(qn)) sc=Math.max(sc,100); if(qc && hc.includes(qc)) sc=Math.max(sc,88); const hTokens=hn.split(" ").filter(Boolean); let covered=0,tsum=0; for(const qt of qTokens){ let tb=0; for(const ht of hTokens){ if(ht===qt){tb=Math.max(tb,12);} else if(ht.startsWith(qt)){tb=Math.max(tb,9);} else if(qt.length>=2&&ht.includes(qt)){tb=Math.max(tb,6);} } if(tb===0&&qt.length>=3&&isSubseq(qt,hc)) tb=3; if(tb>0){covered++;tsum+=tb;} } if(qTokens.length&&covered===qTokens.length) sc=Math.max(sc,45+tsum); else if(covered>0) sc=Math.max(sc,tsum); if(sc===0&&qc.length>=3&&isSubseq(qc,hc)) sc=18; return sc; }

function dateMs(str){ if(!str) return 0; const t=Date.parse(str); return isNaN(t)?0:t; }
function relDate(str){ const t=dateMs(str); if(!t) return esc(str||""); const diff=Date.now()-t, day=86400000; if(diff<day*2) return "Just added"; const d=Math.floor(diff/day); if(d<7) return d+" days ago"; const w=Math.floor(d/7); if(w<5) return w+(w===1?" week ago":" weeks ago"); const mo=Math.floor(d/30); if(mo<12) return mo+(mo===1?" month ago":" months ago"); const y=Math.floor(d/365); return y+(y===1?" year ago":" years ago"); }
function artistSongs(id){ const set=ARTIST_SONG_IDS[id]; if(set) return vis(SONGS.filter(s=>set.has(s.id))); return vis(SONGS.filter(s=>(s.artistIds||[]).includes(id))); }

function buildWhatsNew(){
  const bydate=vis([...SONGS]).sort((a,b)=>dateMs(b.creationDate)-dateMs(a.creationDate));
  const recentSongs=bydate.slice(0,3);
  const latest={}; SONGS.forEach(s=>{ const t=dateMs(s.creationDate); (s.artistIds||[]).forEach(id=>{ if(t>(latest[id]||0)) latest[id]=t; }); });
  const withSongs=ARTISTS.filter(a=>artistSongs(a.id).length);
  const recentArtists=[...withSongs].sort((a,b)=>(latest[b.id]||0)-(latest[a.id]||0)).slice(0,3);
  const recentIds=new Set(recentArtists.map(a=>a.id));
  const pool=withSongs.filter(a=>!recentIds.has(a.id));
  const randomArtist=pool.length?pool[Math.floor(Math.random()*pool.length)]:null;
  const slides=[];
  for(let i=0;i<3;i++){ if(recentSongs[i]) slides.push({kind:"song",song:recentSongs[i]}); if(recentArtists[i]) slides.push({kind:"artist",artist:recentArtists[i]}); }
  if(randomArtist) slides.push({kind:"rediscover",artist:randomArtist});
  return slides;
}

function renderParentalModal(){
  const step=state._parentStep, err=state._parentErr||'';

function addUserGroup(){
  const nameEl=$("#group-name"), memEl=$("#group-members");
  const name=((nameEl&&nameEl.value)||"").trim();
  const members=(((memEl&&memEl.value)||"").split(/[,;]|\s*&\s*/).map(s=>s.trim()).filter(Boolean));

  if(members.length<2){ toast("Add at least two members","Separate names with commas"); if(memEl) memEl.focus(); return; }
  const list=getUserGroups();

  const ok=saveUserGroups(list);

}

function exportLyrics(){
  const data=state.lyricEdits||{}; const ids=Object.keys(data);
  if(!ids.length){ toast("Nothing to export yet","Save some lyrics first"); return; }
  const titles={}; ids.forEach(id=>{ const s=SONG_BY_ID[id]; if(s) titles[id]={title:s.title,artist:s.artist}; });
  const payload={ app:"treesh", type:"lyrics-backup", version:1, exportedAt:new Date().toISOString(), count:ids.length, titles, lyricEdits:data };
  try{
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob); const a=document.createElement("a");
    a.href=url; a.download="treesh-lyrics-backup.json"; document.body.appendChild(a); a.click();
    setTimeout(()=>{ try{ URL.revokeObjectURL(url); a.remove(); }catch(e){} }, 500);
    toast("Backup downloaded", ids.length+" track"+(ids.length!==1?"s":""));
  }catch(e){ toast("Couldn\u2019t export","Try again"); }
}
function importLyricsData(obj){
  try{
    const incoming = (obj && obj.lyricEdits && typeof obj.lyricEdits==='object') ? obj.lyricEdits : (obj && typeof obj==='object' ? obj : null);
    if(!incoming){ toast("That file isn\u2019t a lyrics backup"); return; }
    // validate shape: { id: [ {t?, text} , ... ] }
    let added=0, merged=0; state.lyricEdits=state.lyricEdits||{};
    Object.keys(incoming).forEach(id=>{
      const arr=incoming[id];
      if(!Array.isArray(arr)) return;
      const clean=arr.filter(l=>l&&typeof l==='object'&&typeof l.text==='string').map(l=>({ t:(typeof l.t==='number'?l.t:null), text:l.text }));
      if(!clean.length) return;
      if(state.lyricEdits[id]) merged++; else added++;
      state.lyricEdits[id]=clean;
    });
    if(!added && !merged){ toast("No lyrics found in that file"); return; }
    const ok=LS.set("treesh_lyric_edits", state.lyricEdits);
    if(typeof applyLyricEdits==="function") applyLyricEdits();
    if(typeof refreshDynamic==="function") refreshDynamic();
    if(state.view==='settings') renderView();
    toast(ok?"Lyrics imported":"Imported (storage full)", (added+merged)+" track"+((added+merged)!==1?"s":"")+(merged?` \u00b7 ${merged} updated`:""));
  }catch(e){ toast("Couldn\u2019t read that file","Make sure it\u2019s a Treesh backup"); }
}

async function deleteUserSongs(ids){
  ids=(ids||[]).filter(Boolean); if(!ids.length) return;
  try{
    const cur=curSong();
    for(const id of ids){
      if(cur && cur.id===id){ try{ audio.pause(); }catch(e){} }
      if(state.favorites&&state.favorites.has&&state.favorites.has(id)){ state.favorites.delete(id); saveFav(); }
      if(state.storageSel) delete state.storageSel[id];
      try{ await idbDelete(id); }catch(e){ console.warn("idbDelete failed",id,e); }
    }
    await loadUserSongs();
    refreshCustomMusicManage();
    updateCustomMusicStorage();
    toast(ids.length>1?(ids.length+" tracks removed"):"Track removed");
  }catch(e){ console.error("deleteUserSongs failed",e); toast("Couldn\u2019t remove"); }
}
function updateStorageEstimate(){
  const totalEl=document.getElementById("storage-total");
  const quotaEl=document.getElementById("storage-quota-text");
  const bar=document.getElementById("storage-gauge-bar");
  const lsTotal=treeshTotalBytes();
  idbGetAll().then(recs=>{
    recs=recs||[]; let idb=0; state._userSizes=state._userSizes||{};
    recs.forEach(r=>{ let sz=0; if(r.audioBlob&&r.audioBlob.size) sz+=r.audioBlob.size; if(r.coverBlob&&r.coverBlob.size) sz+=r.coverBlob.size; idb+=sz; if(r.id) state._userSizes[r.id]=sz; });
    state._idbBytes=idb;
    const total=lsTotal+idb;
    if(totalEl) totalEl.textContent=fmtBytes(total);
    const paint=(quota,usage)=>{
      state._storageQuota=quota||0;
      if(quota && quota>0){
        const usedForBar=Math.max(total, usage||0);           // reflect the real measured footprint if larger
        const pct=Math.min(100, Math.max(total>0?1:0, Math.round(usedForBar/quota*100)));
        if(bar) bar.style.width=pct+"%";
        const free=Math.max(0,(quota||0)-(usage||total));
        if(quotaEl) quotaEl.innerHTML=`<span class="text-white/70 font-semibold">${fmtBytes(free)}</span> free on device`;
      } else {
        if(bar) bar.style.width=(total>0?4:0)+"%";
        if(quotaEl) quotaEl.textContent="Device estimate unavailable";
      }
    };
    if(navigator.storage && navigator.storage.estimate){
      navigator.storage.estimate().then(est=>paint((est&&est.quota)||0,(est&&est.usage)||0)).catch(()=>paint(0,0));
    } else { paint(0,0); }
  }).catch(()=>{ if(totalEl) totalEl.textContent=fmtBytes(lsTotal); if(quotaEl) quotaEl.textContent="Device estimate unavailable"; });
}
function updateCustomMusicStorage(){
  const sizeEl=document.getElementById("custom-music-size"), subEl=document.getElementById("custom-music-sub");
  idbGetAll().then(recs=>{
    recs=recs||[]; let total=0; state._userSizes=state._userSizes||{};
    recs.forEach(r=>{ let sz=0; if(r.audioBlob&&r.audioBlob.size) sz+=r.audioBlob.size; if(r.coverBlob&&r.coverBlob.size) sz+=r.coverBlob.size; total+=sz; if(r.id){ state._userSizes[r.id]=sz; const el=document.getElementById("cms-size-"+r.id); if(el) el.textContent=fmtBytes(sz); } });
    if(sizeEl) sizeEl.textContent=fmtBytes(total);
    if(subEl) subEl.textContent=recs.length+" track"+(recs.length!==1?"s":"")+" on this device";
  }).catch(()=>{});
}

function animateView(){
  const v=$("#view"); if(!v) return;
  if(_io){ _io.disconnect(); _io=null; }
  if(prefersReduced()) return;
  let kids=[...v.children];
  if(kids.length===1 && kids[0].children && kids[0].children.length>1) kids=[...kids[0].children];
  kids.forEach((el,i)=>{ el.classList.remove("reveal-stagger"); void el.offsetWidth; el.style.animationDelay=(Math.min(i,8)*55)+"ms"; el.classList.add("reveal-stagger"); });
  const items=v.querySelectorAll(".grid > *");
  if(items.length>6){
    _io=new IntersectionObserver((ents)=>{ ents.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("io-in"); if(_io) _io.unobserve(e.target); } }); }, {rootMargin:"0px 0px -6% 0px", threshold:0.04});
    items.forEach(el=>{ el.classList.add("io-reveal"); _io.observe(el); });
  }
}

/* ---------- preserve inner scroll positions across re-renders ---------- */
function _domPath(el, root){ const path=[]; let n=el; while(n && n!==root){ const parent=n.parentNode; if(!parent) break; const idx=Array.prototype.indexOf.call(parent.children, n); if(idx<0) break; path.push(idx); n=parent; } return path.reverse().join('.'); }
function _elByPath(root, path){ if(path==='') return root; const parts=path.split('.'); let n=root; for(let i=0;i<parts.length;i++){ const idx=+parts[i]; if(!n||!n.children||!n.children[idx]) return null; n=n.children[idx]; } return n; }
function captureScroll(root){ const map=[]; if(!root) return map; const all=root.querySelectorAll('*'); for(let i=0;i<all.length;i++){ const el=all[i]; if((el.scrollLeft>0||el.scrollTop>0) && (el.scrollWidth>el.clientWidth+1||el.scrollHeight>el.clientHeight+1)){ map.push([_domPath(el,root), el.scrollLeft, el.scrollTop]); } } return map; }
function restoreScroll(root, map){ if(!root||!map||!map.length) return; for(let i=0;i<map.length;i++){ const rec=map[i]; const el=_elByPath(root, rec[0]); if(el){ if(rec[1]) el.scrollLeft=rec[1]; if(rec[2]) el.scrollTop=rec[2]; } } }

/* --- favorite-lyric / full-song playback --- */
let _snipTimer=null;
function playFavSong(id){ const s=SONG_BY_ID[id]; if(!s) return; clearTimeout(_snipTimer); if(state.profileOpen) closeProfile(); playSong(s,[s]); toast("Playing",s.title); }
function playLyricSnippet(id,i){
  const s=SONG_BY_ID[id]; if(!s) return; const lines=s.lyrics||[]; const line=lines[i]; if(!line){ playFavSong(id); return; }
  clearTimeout(_snipTimer);
  const start=Math.max(0,+line.t||0); const next=lines[i+1]; const end=(next?(+next.t||start+12):start+12)+5; const durMs=Math.max(1200,(end-start)*1000);
  const isCur=curSong()&&curSong().id===s.id;
  if(!isCur) playSong(s,[s]);
  let tries=0;
  const run=()=>{ tries++; try{ if(isCur||audio.readyState>=1||tries>14){ audio.currentTime=start; const pp=audio.play&&audio.play(); if(pp&&pp.catch)pp.catch(()=>{}); clearTimeout(_snipTimer); _snipTimer=setTimeout(()=>{ try{ audio.pause(); }catch(e){} }, durMs); return; } }catch(e){} setTimeout(run,80); };
  setTimeout(run, isCur?20:160);
  toast("Lyric snippet",s.title);
}

function saveFavLyrics(){ LS.set("treesh_fav_lyrics", state.favLyrics); }
function isFavLyric(songId,i){ return state.favLyrics.some(x=>x.songId===songId && x.i===i); }
function favLyricsForSong(songId){ return state.favLyrics.filter(x=>x.songId===songId).sort((a,b)=>a.i-b.i); }
function studioLines(songId){ const st=state.studio; if(!st||st.songId!==songId) return []; const tab=st.tab||'selected'; if(tab==='selected'){ return (st.picked||[]).slice().sort((a,b)=>a.i-b.i); } if(tab==='favorited'){ return favLyricsForSong(songId).slice().sort((a,b)=>a.i-b.i); } const s=SONG_BY_ID[songId]; return (s.lyrics||[]).map((l,i)=>({songId,i,t:l.t,text:l.text})).filter(x=>x.text && x.text.trim() && !/^\s*\[[^\]]*\]\s*$/.test(x.text)); }
function cardLines(){ const st=state.studio; if(!st) return []; return (st.picked||[]).slice().sort((a,b)=>a.i-b.i).slice(0,6); }
function isStudioPicked(i){ return (state.studio&&state.studio.picked||[]).some(p=>p.i===i); }

function toggleStudioPick(songId,i){ const st=state.studio; if(!st) return; st.picked=st.picked||[]; const idx=st.picked.findIndex(p=>p.i===i); if(idx>=0){ st.picked.splice(idx,1); } else { if(st.picked.length>=6){ toast("Cards show up to 6 lines"); return; } st.picked.push(studioPickEntry(songId,i)); } openLyricStudio(songId); }

  const s=SONG_BY_ID[songId]; if(!s) return;

}

    const bs=ctx.createLinearGradient(0,H*0.42,0,H); bs.addColorStop(0,hexA(ov,0)); bs.addColorStop(0.7,hexA(ov,0.4)); bs.addColorStop(1,hexA(ov,0.74)); ctx.fillStyle=bs; ctx.fillRect(0,0,W,H);

function lev(a,b){ const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let prev=Array.from({length:n+1},(_,j)=>j); for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++){ cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1)); } prev=cur; } return prev[n]; }

function submitAnswer(ans, mode, timedOut){

  else { correct = sim>=0.6; pts=Math.round(sim*100); }

  if(correct) bonus+=adlibBonus; else adlibHit=false;
  pts+=bonus;
  g.lastAnswer=a; g.lastSim=sim; g.lastExact=exact; g.lastPoints=pts; g.lastBonus=bonus; g.lastAdlib=adlibHit; g.lastAdlibBonus=adlibHit?adlibBonus:0; g.lastTimedOut=!!timedOut; g.mode=mode||"type"; g.score+=pts;
  if(correct){ g.streak++; if(g.streak>g.bestStreak) g.bestStreak=g.streak; } else g.streak=0;
  g.results.push({correct, sim, pts, exact}); g.answered=true;

}

/* Mobile: swipe down (from the top grab zone) to close the Now Playing player.
   Smooth, finger-following bottom-sheet gesture. Touch-only, so it never
   interferes with desktop mouse users. */
function wireNPSwipe(){
  const root=$("#np [data-np-root]");
  if(!root) return;
  let sy=0, sx=0, dy=0, active=false, decided=false, t0=0, raf=0, pend=0;
  const clearInline=()=>{ root.style.transition=""; root.style.transform=""; root.style.opacity=""; root.style.willChange=""; };
  const draw=()=>{ raf=0; if(!active) return; root.style.transform="translate3d(0,"+pend+"px,0)"; root.style.opacity=String(Math.max(0.55, 1-pend/900)); };
  const onStart=(e)=>{
    if(e.touches && e.touches.length>1) return;
    const tch=e.touches?e.touches[0]:e; const tgt=e.target;
    // Only start from the top grab zone (grabber pill + header). Prevents accidental closes.
    if(!tgt.closest('[data-np-drag-zone]')) return;
    sy=tch.clientY; sx=tch.clientX; dy=0; active=true; decided=false; t0=Date.now();
    root.style.transition="none"; root.style.willChange="transform,opacity";
  };
  const onMove=(e)=>{
    if(!active) return;
    const tch=e.touches?e.touches[0]:e;
    const ddy=tch.clientY-sy, ddx=tch.clientX-sx;
    if(!decided){ if(Math.abs(ddx)>Math.abs(ddy) && Math.abs(ddx)>10){ active=false; clearInline(); return; } if(Math.abs(ddy)>5) decided=true; else return; }
    if(ddy<=0){ dy=0; pend=0; if(!raf) raf=requestAnimationFrame(draw); return; }
    dy=ddy; e.preventDefault();
    pend=dy; if(!raf) raf=requestAnimationFrame(draw);
  };
  const onEnd=()=>{
    if(!active) return;
    active=false; if(raf){ cancelAnimationFrame(raf); raf=0; }
    const fast = dy>50 && (Date.now()-t0)<320;
    if(dy>130 || fast){
      root.style.transition="transform .24s cubic-bezier(.4,0,1,1), opacity .24s ease";
      root.style.transform="translate3d(0,100%,0)"; root.style.opacity="0";
      setTimeout(()=>{ closeNP(); }, 210);
    } else {
      root.style.transition="transform .24s cubic-bezier(.22,1,.36,1), opacity .24s ease";
      root.style.transform="translate3d(0,0,0)"; root.style.opacity="1";
      setTimeout(clearInline, 250);
    }
    dy=0; pend=0;
  };
  root.addEventListener("touchstart", onStart, {passive:true});
  root.addEventListener("touchmove", onMove, {passive:false});
  root.addEventListener("touchend", onEnd, {passive:true});
  root.addEventListener("touchcancel", onEnd, {passive:true});
}

/* ============================================================
   LYRIC STUDIO  (native LyricFlow rebuild - timestamp lyrics)
   Bridges into Treesh's existing lyric system:
     state.lyricEdits[songId] = [{t,text,sec,explain}]  (persisted)
   Uses a DEDICATED audio element so it never fights the main player.
   ============================================================ */
const _lsAudio = new Audio(); _lsAudio.preload="metadata";

function lsFmt(t){ if(!isFinite(t)||t<0) t=0; const m=Math.floor(t/60), s=Math.floor(t%60); return m+":"+(s<10?"0":"")+s; }
function lsFmtLRC(t){ if(!isFinite(t)||t<0) t=0; const m=Math.floor(t/60), s=Math.floor(t%60), cs=Math.floor((t%1)*100); return ("0"+m).slice(-2)+":"+("0"+s).slice(-2)+"."+("0"+cs).slice(-2); }

function lsIsSection(text){ return /^\s*\[[^\]]+\]\s*$/.test(text||""); }
function lsSectionLabel(text){ const m=(text||"").match(/^\s*\[([^\]]+)\]\s*$/); return m?m[1].trim():(text||"").trim(); }

/* Convert a song's stored lyrics into editable session items (keeps sections) */
function lsItemsFromSong(s){
  const items=[]; const lines=(s&&s.lyrics)||[]; let lastSec=null;
  lines.forEach(l=>{
    if(l.sec && l.sec!==lastSec){ items.push({type:'section', text:l.sec}); lastSec=l.sec; }
    if(l.text && String(l.text).trim()) items.push({type:'line', t:(typeof l.t==='number'?l.t:null), text:l.text, explain:l.explain||"", words:(l.words&&l.words.length?l.words.slice():null)});
  });
  return items;
}
/* Align new write-mode line texts to previous line items so timestamps (and word
   timings / explanations) survive edits. Unchanged lines keep their exact stamp
   (LCS anchors); edited-in-place lines keep their stamp positionally; only brand
   new lines start unstamped, and only removed lines lose their stamp. */
function lsAlignLines(oldItems, newTexts){
  const o=(oldItems||[]).map(it=>(it.text||'').trim()); const n=newTexts;
  const O=o.length, N=n.length;
  const res=new Array(N).fill(null); // {item, exact}
  if(!O){ return res; }
  // LCS dp on trimmed text
  const dp=Array.from({length:O+1},()=>new Array(N+1).fill(0));
  for(let i=O-1;i>=0;i--) for(let j=N-1;j>=0;j--){ dp[i][j]= o[i]===n[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]); }
  const usedOld=new Array(O).fill(false); let i=0,j=0;
  while(i<O && j<N){ if(o[i]===n[j]){ res[j]={item:oldItems[i],exact:true}; usedOld[i]=true; i++; j++; } else if(dp[i+1][j]>=dp[i][j+1]){ i++; } else { j++; } }
  // positional fallback: leftover old line items -> unmatched new lines, in order (in-place edits)
  const leftover=[]; for(let x=0;x<O;x++) if(!usedOld[x]) leftover.push(oldItems[x]);
  let up=0;
  for(let k=0;k<N;k++){ if(res[k]==null && up<leftover.length){ res[k]={item:leftover[up++],exact:false}; } }
  return res;
}
function lsParseWriteText(text, prevItems){
  const prevLineItems=(prevItems||[]).filter(it=>it.type==='line');
  const parsed=[]; // {isSection, text}
  (text||'').split(/\r?\n/).forEach(raw=>{
    const line=raw.replace(/\s+$/,''); if(!line.trim()) return;
    if(lsIsSection(line)) parsed.push({isSection:true, text:lsSectionLabel(line)});
    else parsed.push({isSection:false, text:line.trim()});
  });
  const newTexts=parsed.filter(p=>!p.isSection).map(p=>p.text);
  const aligned=lsAlignLines(prevLineItems, newTexts);
  const items=[]; let li=0;
  parsed.forEach(p=>{
    if(p.isSection){ items.push({type:'section', text:p.text}); return; }
    const a=aligned[li++]; const src=a&&a.item;
    const it={type:'line', t:(src&&src.t!=null?src.t:null), text:p.text, explain:(src&&src.explain)||''};
    if(src && a.exact && src.words && src.words.length) it.words=src.words.slice();
    items.push(it);
  });

}
function lsItemsToText(items){ return (items||[]).map(it=> it.type==='section' ? ('['+ (it.text||'').replace(/^\[|\]$/g,'') +']') : (it.text||'')).join("\n"); }
/* Expand [Section xN] loop tags: repeats the section block (header + its lines) N times. */
function lsExpandLoops(items){
  const src=items||[]; const out=[]; const loopRe=/\s*[x\u00d7]\s*(\d+)\s*$/i; let i=0;
  while(i<src.length){
    const it=src[i];
    if(it && it.type==='section'){
      const label=(it.text||''); const m=label.match(loopRe);
      let j=i+1; const block=[];
      while(j<src.length && !(src[j] && src[j].type==='section')){ block.push(src[j]); j++; }
      const reps = m? Math.max(1, Math.min(12, parseInt(m[1],10))) : 1;
      const cleanLabel = m? label.replace(loopRe,'').trim() : label;
      for(let r=0;r<reps;r++){ out.push(Object.assign({}, it, {text:cleanLabel})); block.forEach(b=>out.push(Object.assign({}, b))); }

function lsHasLoops(items){ const re=/\s*[x\u00d7]\s*\d+\s*$/i; return (items||[]).some(it=>it&&it.type==='section'&&re.test(it.text||'')); }
/* Inline emphasis for the LyricFlow preview: **bold** and *italic* (HTML-safe). */
function lsInlineFmt(text){ let s=esc(text||''); s=s.replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>'); s=s.replace(/\*([^*\n]+)\*/g,'<em>$1</em>'); return s; }
/* Strip emphasis markers for the plain player / LRC / saved lyrics. */
function lsStripFmt(text){ return String(text||'').replace(/\*\*([^*\n]+)\*\*/g,'$1').replace(/\*([^*\n]+)\*/g,'$1'); }

function lsBuildLRC(){
  const items=lsExpandLoops(state.ls.items||[]); const t=state.ls.title, a=state.ls.artist, al=state.ls.album;
  let out=""; if(t) out+="[ti:"+t+"]\n"; if(a) out+="[ar:"+a+"]\n"; if(al) out+="[al:"+al+"]\n"; out+="[by:Treesh Lyric Studio]\n\n";
  let pendingSec=null;
  items.forEach((it,idx)=>{
    if(it.type==='section'){ pendingSec=lsStripFmt(it.text); return; }
    const text=lsStripFmt((it.text||'').trim()); if(!text) return;
    const t2=(it.t!=null)? it.t : 0;
    if(pendingSec){ out+="["+lsFmtLRC(Math.max(0,t2-0.01))+"]["+pendingSec+"]\n"; pendingSec=null; }
    out+="["+lsFmtLRC(t2)+"]"+text+"\n";
  });
  return out.trim();
}
function lsOpenExport(){
  lsCommitEdits();
  const fmt=(state._lsExportFmt==='txt')?'txt':'lrc';
  const content = (fmt==='txt') ? lsItemsToText(state.ls.items) : lsBuildLRC();
  const seg=(id,label,ic)=>`<button data-act="ls-export-fmt" data-fmt="${id}" data-testid="ls-export-fmt-${id}" class="press inline-flex items-center gap-1.5 rounded-full px-3.5 py-1.5 text-xs font-semibold transition-colors ${fmt===id?'bg-[color:var(--treesh-purple)] text-white glow-purple':'border border-white/12 bg-white/5 text-white/70 hover:bg-white/10'}"><i data-lucide="${ic}" style="width:14px;height:14px"></i>${label}</button>`;
  const inner=`<h3 class="mb-1 flex items-center gap-2 text-lg font-bold"><i data-lucide="file-down" style="width:18px;height:18px"></i>Export lyrics</h3>
   <div class="mb-3 flex items-center gap-2">${seg('lrc','Timed .LRC','clock')}${seg('txt','Plain .txt','align-left')}</div>
   <p class="mb-3 text-xs text-white/55">${fmt==='txt'?'Plain lyrics with your section tags \u2014 great for sharing or re-importing.':'Standard timed-lyric format. Copy it or download the file.'}</p>
   <textarea id="ls-export-text" readonly class="no-scrollbar h-[42vh] w-full resize-none rounded-xl border border-white/12 bg-black/30 px-3 py-2.5 font-doto text-[12px] leading-relaxed text-white/85 outline-none">${esc(content)}</textarea>

function lsExportCopy(){ const ta=$("#ls-export-text"); if(!ta) return; const txt=ta.value; const label=(state._lsExportFmt==='txt')?'text':'.LRC'; const done=()=>toast("Copied "+label+" to clipboard"); try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done).catch(()=>{ ta.select(); document.execCommand&&document.execCommand("copy"); done(); }); } else { ta.select(); document.execCommand&&document.execCommand("copy"); done(); } }catch(e){ ta.select(); try{ document.execCommand("copy"); done(); }catch(_){} } }
function lsExportDownload(){ const fmt=(state._lsExportFmt==='txt')?'txt':'lrc'; const content=(fmt==='txt')?lsItemsToText(state.ls.items):lsBuildLRC(); const ext=(fmt==='txt')?'.txt':'.lrc'; const safe=(state.ls.title||"lyrics").replace(/[^a-z0-9\-_ ]/gi,'').trim()||"lyrics"; try{ const blob=new Blob([content],{type:"text/plain"}); const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=safe+ext; document.body.appendChild(a); a.click(); setTimeout(()=>{ try{ document.body.removeChild(a); URL.revokeObjectURL(url); }catch(e){} },200); toast("Downloaded "+safe+ext); }catch(e){ toast("Download not supported here"); } }

/* ---- Known artist groups (offline, extensible) ----
   Detects when several performers are actually one collective so their
   combined tag shows the group name (e.g. Black Barbie + ZuuBandz = "Perfekt Tenz").
   Seeded with known groups and mergeable with anything the catalog/user defines. */
const KNOWN_GROUPS_SEED=[{name:"PerfekTenz", members:["Black Barbie","ZuuBandz"]}];
function knownGroups(){
  let extra=[]; try{ const g=LS.get("treesh_groups",null); if(Array.isArray(g)) extra=g; }catch(e){}
  // also pull any groups the catalog artists may declare (a.members = [names])
  let cat=[]; try{ cat=(ARTISTS||[]).filter(a=>a&&Array.isArray(a.members)&&a.members.length).map(a=>({name:a.name, members:a.members})); }catch(e){}
  const all=[...KNOWN_GROUPS_SEED, ...cat, ...extra];
  const seen={}, out=[]; all.forEach(g=>{ if(!g||!g.name) return; const k=normKey(g.name); if(seen[k]) return; seen[k]=1; out.push({name:g.name, members:(g.members||[]).map(m=>String(m).trim()).filter(Boolean)}); });
  return out;
}
/* If a name IS a known group, return its members (else null). */
function groupMembers(name){ const k=normKey(name||""); if(!k) return null; const g=knownGroups().find(x=>normKey(x.name)===k); return g?g.members.slice():null; }
function canonicalGroupName(name){ const k=normKey(name||""); const g=knownGroups().find(x=>normKey(x.name)===k); return g?g.name:name; }
/* Given a set of member names, return the group name if they form a known group. */
function detectGroupName(names){
  const keys=(names||[]).map(n=>normKey(n)).filter(Boolean); if(keys.length<2) return null;
  const set={}; keys.forEach(k=>set[k]=1);
  for(const g of knownGroups()){
    const mk=g.members.map(m=>normKey(m)).filter(Boolean); if(mk.length<2) continue;
    // every collected name is a member AND we cover at least 2 members of that group
    const allAreMembers=keys.every(k=>mk.indexOf(k)>=0);
    const coverage=mk.filter(m=>set[m]).length;
    if(allAreMembers && coverage>=2) return g.name;
  }
  return null;
}
/* Stable accent colour per performer so verses are easy to scan while syncing. */
const PERFORMER_PALETTE=["#b98cff","#4aa8e0","#2bb6a6","#e8637e","#ef9a3c","#8fce5a","#e069c0","#7a83f0","#39cbd2","#f0b84a","#6ee0a6","#ff8f6b"];
function performerColor(name){ const k=normKey(name||""); if(!k) return "#b98cff"; let h=2166136261>>>0; for(let i=0;i<k.length;i++){ h^=k.charCodeAt(i); h=Math.imul(h,16777619)>>>0; } return PERFORMER_PALETTE[h % PERFORMER_PALETTE.length]; }
/* Pull the performer name out of a section label like "Verse 1: Black Barbie". */
function sectionPerformer(secText){ const s=String(secText||""); const ci=s.indexOf(':'); if(ci<0) return ""; return s.slice(ci+1).trim(); }

function lsPerformerOptions(){
  const s=(typeof SONG_BY_ID!=='undefined' && state.ls) ? SONG_BY_ID[state.ls.songId] : null;
  const main=((s&&s.artist)||(state.ls&&state.ls.artist)||"").trim();
  const featStr=(s&&s.featuring)||(state.ls&&state.ls.featuring)||"";
  const splitRe=/\s*[,&\/+\u00d7]\s*|\s+(?:feat\.?|ft\.?|featuring|with|and|vs\.?|x)\s+/i;
  const all=[]; const push=(n)=>{ n=(n||"").trim(); if(n && !all.some(a=>a.toLowerCase()===n.toLowerCase())) all.push(n); };
  let group=null;
  // Resolve the real member names from the catalog artist IDs (e.g. "7,5" -> Black Barbie, ZuuBandz)
  const idNames=[]; if(s && Array.isArray(s.artistIds) && typeof ARTIST_BY_ID!=='undefined'){ s.artistIds.forEach(id=>{ const a=ARTIST_BY_ID[id]; if(a && a.name && !idNames.some(n=>normKey(n)===normKey(a.name))) idNames.push(a.name); }); }
  const mainIsSingle = main && !splitRe.test(main);              // one credited name, no separators
  const mainMatchesAnId = idNames.some(n=>normKey(n)===normKey(main));
  if(mainIsSingle && idNames.length>=2 && !mainMatchesAnId){
    // Catalog group alias: a single artist NAME (e.g. "PerfekTenz") maps to several artist IDs.
    group = canonicalGroupName(main);
    idNames.forEach(push);
  } else {
    const mm=groupMembers(main);                                 // registry: the name itself is a known group
    if(mm && mm.length){ group=canonicalGroupName(main); mm.forEach(push); }
    else if(main){ String(main).split(splitRe).forEach(push); }  // split collabs in the main credit too
  }
  if(featStr) String(featStr).split(splitRe).forEach(push);
  idNames.forEach(push);                                          // make sure every credited artist can be tagged
  if(!group){ const g=detectGroupName(all); if(g) group=g; }      // members collected together form a known group
  return { main, all, group };
}
function lsWriteHtml(){
  const txt=lsItemsToText(state.ls.items);
  const TAGCHIPS=[['Verse',true],['Chorus',false],['Pre-Chorus',false],['Hook',false],['Bridge',false],['Intro',false],['Outro',false],['Refrain',false]];
  const sectionChips=TAGCHIPS.map(([tag,num])=>`<button data-act="ls-insert-tag" data-tag="${tag}" data-num="${num?1:0}" data-testid="ls-tag-${tag}" class="press shrink-0 whitespace-nowrap rounded-full border border-white/12 bg-white/5 px-3 py-1.5 text-xs font-semibold text-white/75 hover:bg-white/10"><span class="text-[color:var(--treesh-purple)]">[</span>${tag}${num?' #':''}<span class="text-[color:var(--treesh-purple)]">]</span></button>`).join('');

function lsInsertTag(tag, autonum, suffix){
  const ta=$("#ls-write"); if(!ta) return;
  let label=tag;
  if(autonum){ const re=new RegExp('\\['+tag.replace(/[-/\\^$*+?.()|[\]{}]/g,'\\$&')+'\\b','gi'); const n=((ta.value.match(re)||[]).length)+1; label=tag+' '+n; }
  if(suffix){ label=label+': '+suffix; }
  const ins='['+label+']';
  const start=(ta.selectionStart!=null)?ta.selectionStart:ta.value.length;
  const end=(ta.selectionEnd!=null)?ta.selectionEnd:ta.value.length;
  const before=ta.value.slice(0,start), after=ta.value.slice(end);
  const preNL=(before===''||before.endsWith('\n'))?'':'\n';
  ta.value = before + preNL + ins + '\n' + after;
  const caret=(before+preNL+ins+'\n').length;
  ta.focus(); try{ ta.setSelectionRange(caret,caret); }catch(e){}
  ta.dispatchEvent(new Event('input',{bubbles:true}));
  ta.scrollTop=ta.scrollHeight;
}

    const af=$("#ls-audio-file"); if(af && !af._wired){ af._wired=true; af.addEventListener("change",e=>{ const f=e.target.files&&e.target.files[0]; if(f) lsAttachAudio(f); e.target.value=""; }); }

      </div>`;
  }
  const listening=(mode==="listening"), speaking=(mode==="speaking"), thinking=(mode==="thinking"), paused=(mode==="paused");

  } else {
    transcript = `<div class="w-full rounded-2xl border border-white/10 bg-white/5 p-3.5 text-left">${_voiceLast.user?`<p class="text-[10px] font-semibold uppercase tracking-[0.2em] text-white/35">You said</p><p data-testid="voice-live-transcript" class="mb-2 text-base font-semibold text-white">${esc(_voiceLast.user)}</p>`:''}${_voiceLast.reply?`<p class="text-[10px] font-semibold uppercase tracking-[0.2em] text-[color:var(--treesh-purple)]">Treesh</p><p class="text-sm text-white/80">${esc(_voiceLast.reply)}</p>`:`<p data-testid="voice-live-transcript" class="text-sm text-white/40">Tap a command below, or the mic to speak.</p>`}</div>`;

function showVoice(){ if($("#voice-ov")) return; const el=document.createElement("div"); el.id="voice-ov"; el.className="tr-fade-in fixed inset-0 z-[110] flex items-center justify-center p-4"; el.innerHTML=`<div data-act="voice-cancel" class="absolute inset-0 bg-black/60 backdrop-blur-md"></div><div data-voice-panel data-testid="voice-listening-overlay" class="tr-panel-in relative flex max-h-[88vh] w-[min(94vw,440px)] flex-col overflow-hidden rounded-[28px] glass-strong border border-white/12 shadow-[var(--treesh-shadow)]"><div data-voice-body class="no-scrollbar min-h-0 flex-1 overflow-y-auto p-5 pb-[calc(20px+env(safe-area-inset-bottom))]">${voiceBodyHtml()}</div></div>`; document.body.appendChild(el); icons(); syncScrollLock(); }
function voiceToggleHelp(){ _voiceHelp=!_voiceHelp; voiceRender(); }
function voiceRetry(){ _voiceHelp=false; if(recog===null) initVoice(); if(!recog){ _voiceNoMic=true; _voiceMode="denied"; voiceRender(); return; } _voicePaused=false; _voiceNoMic=false; _voiceActive=true; _voiceSpeaking=false; voiceListen(); }
function voiceRun(cmd){ if(cmd) voiceRunSuggestion(cmd); }
/* ---- interpreter ---- */
function voiceMatchMacro(text){ const t=(text||'').toLowerCase().trim(); for(const mm of _voiceMacros){ const p=(mm.phrase||'').toLowerCase().trim(); if(!p) continue; if(t===p || t.includes(p) || (p.length>4 && p.includes(t))) return mm; } return null; }
function voiceRunMacro(mm){ const steps=mm.steps||[]; const out=[]; for(const s of steps){ let r=null; try{ r=voiceExec((s||'').toLowerCase().trim()); }catch(e){} if(r) out.push(r); } return out.length? ('Running \u201C'+mm.phrase+'\u201D. '+out.join(' ')) : ('I ran \u201C'+mm.phrase+'\u201D but nothing matched its steps.'); }
function voiceRunMacroById(id){ const mm=_voiceMacros.find(x=>x.id===id); if(mm) voiceRun(mm.phrase); }
function voiceInterpret(raw){
  let text=(raw||"").toLowerCase().trim();
  text=text.replace(/^(hey |ok |okay |yo )?(treesh|trish|trash|tree)[,\s]+/i,'').trim();
  text=text.replace(/\b(please|for me|go ahead and|can you|could you|would you|i want to|i wanna|i would like to|let's|lets)\b/g,' ').replace(/\s+/g,' ').trim();
  if(!text) return null;
  const mac=voiceMatchMacro(text); if(mac) return voiceRunMacro(mac);
  const parts=text.split(/\s+(?:then|and then|after that)\s+|\s*;\s*/).map(s=>s.trim()).filter(Boolean);
  const replies=[];
  for(const p of parts){ let r=null; try{ r=voiceExec(p); }catch(e){ r=null; } if(r) replies.push(r); }
  return replies.length? replies.join(' ') : null;
}

    if(!hit && art) hit=SONGS.find(s=> s.artist.toLowerCase().includes(art));
