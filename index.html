/* ---- Draggable / tappable scrubbers (mini player progress bar) ---- */
let _scrubbing=null;
function _scrubPct(el, clientX){ const r=el.getBoundingClientRect(); if(!r.width) return 0; return Math.max(0,Math.min(1,(clientX-r.left)/r.width)); }
function _scrubApply(el, p){ if(el.getAttribute("data-scrub")==="mini"){ const mp=document.getElementById("mini-prog"); if(mp) mp.style.width=(p*100)+"%"; } if(state.duration){ try{ audio.currentTime=p*state.duration; }catch(_){} state.currentTime=p*state.duration; } }
document.addEventListener("pointerdown", e=>{ const el=e.target&&e.target.closest&&e.target.closest("[data-scrub]"); if(!el) return; _scrubbing=el; try{ el.setPointerCapture(e.pointerId); }catch(_){} _scrubApply(el,_scrubPct(el,e.clientX)); e.preventDefault(); }, {passive:false});
document.addEventListener("pointermove", e=>{ if(!_scrubbing) return; _scrubApply(_scrubbing,_scrubPct(_scrubbing,e.clientX)); });
document.addEventListener("pointerup", e=>{ if(!_scrubbing) return; _scrubApply(_scrubbing,_scrubPct(_scrubbing,e.clientX)); _scrubbing=null; });
document.addEventListener("pointercancel", ()=>{ _scrubbing=null; });

/* ---- Hold the repeat button 3s to arm an A\u2013B loop (keeps the player uncluttered) ---- */
let _repeatHoldTimer=null, _repeatLongPressed=false, _repeatHoldEl=null, _repeatHoldXY=null;
function _cancelRepeatHold(){ clearTimeout(_repeatHoldTimer); _repeatHoldTimer=null; if(_repeatHoldEl){ _repeatHoldEl.classList.remove("ab-charging"); _repeatHoldEl=null; } _repeatHoldXY=null; }
document.addEventListener("pointerdown", e=>{ const rb=e.target&&e.target.closest&&e.target.closest("#np-repeat"); if(!rb) return; _repeatLongPressed=false; _repeatHoldEl=rb; _repeatHoldXY={x:e.clientX,y:e.clientY}; rb.classList.add("ab-charging"); clearTimeout(_repeatHoldTimer); _repeatHoldTimer=setTimeout(()=>{ _repeatLongPressed=true; if(_repeatHoldEl) _repeatHoldEl.classList.remove("ab-charging"); _repeatHoldEl=null; state.abA=state.currentTime||0; state.abB=null; if(navigator.vibrate){ try{navigator.vibrate(18);}catch(_){} } toast("Loop point A set","Tap repeat again to set point B"); renderNP(); }, 1500); });
document.addEventListener("pointermove", e=>{ if(!_repeatHoldEl||!_repeatHoldXY) return; const dx=e.clientX-_repeatHoldXY.x, dy=e.clientY-_repeatHoldXY.y; if(dx*dx+dy*dy>196) _cancelRepeatHold(); });
document.addEventListener("pointerup", _cancelRepeatHold);
document.addEventListener("pointercancel", _cancelRepeatHold);

/* keyboard shortcuts */
document.addEventListener("keydown", e=>{
  if(e.target && e.target.id==="voice-input"){ if(e.key==="Enter"){ e.preventDefault(); voiceSubmitTyped(); } else if(e.key==="Escape"){ e.preventDefault(); const inp=e.target; if(inp.value){ inp.value=""; _voiceTyped=""; } else voiceClose(); } return; }
  if(state.lsOpen){ if(lsKeydown(e)) return; }
  const tag=(e.target.tagName||""); if(["INPUT","TEXTAREA","SELECT"].includes(tag)||e.target.isContentEditable) return;
  if(e.key==="Escape"){ if($("#modal2").innerHTML){ closeModal2(); return; } if($("#modal").innerHTML){ closeModal(); return; } if(state.searchOpen){ closeSearch(); return; } if(state.profileOpen){ closeProfile(); return; } if(state.queueOpen){ closeQueue(); return; } if(state.npOpen){ closeNP(); return; } }
  if(!curSong()) return;
  if(e.code==="Space"){ e.preventDefault(); togglePlay(); }
  else if(e.code==="ArrowRight"&&e.shiftKey) nextTrack(true);
  else if(e.code==="ArrowLeft"&&e.shiftKey) prevTrack();
  else if(e.code==="ArrowRight") seekTo(Math.min(audio.currentTime+5,state.duration));
  else if(e.code==="ArrowLeft") seekTo(Math.max(audio.currentTime-5,0));
});

function init(){
  wnLoad();
  const {view,param}=parseHash(); state.view=view; state.param=param;
  applyUiFont(); applyCustomColors(); applyLabelStyle();
  renderShell(); renderView(true); renderMini();
  if(state.profile) checkDailyStars();
  // deep link ?song=
  const sp=new URLSearchParams(location.search); const songId=sp.get("song"); if(songId&&SONG_BY_ID[songId]){ playSong(SONG_BY_ID[songId],SONGS); state.npOpen=true; renderNP(); history.replaceState(null,"",location.pathname+location.hash); }

  if(!state.profile){ onboard={step:0,nick:"",bday:"",avatar:""}; setTimeout(renderOnboarding,400); }
  initSleep();

  else if(pageIsLocked(state.view)) openPageLock(state.view, state.param);

}

function iDoNewProject(){ const S=state.instrum; if(!S) return; if(S.playing) iStop(); iCleanupAudio(); S.project=instrumBlankProject(); S.history=[]; S.hi=-1; S.activePreset=null; if(_iMaster) _iMaster.gain.value=S.project.master; iPushHistory(); S.menu=false; renderInstrum(); toast("New project started","Empty grid"); }
function iNewProject(){ const S=state.instrum; if(!S) return; S.menu=false; if(iProjectDirty()){ renderInstrum(); openConfirm("Start a new project?","You have an active project with unsaved changes. Starting a new project will clear the grid and discard them.", ()=>{ iDoNewProject(); }); } else { iDoNewProject(); } }
function iExportData(){ const p=state.instrum.project; try{ const data=JSON.stringify({type:"treesh-beat",v:1,project:p},null,2); const blob=new Blob([data],{type:"application/json"}); const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=(p.name||"beat").replace(/[^a-z0-9]+/gi,"_").replace(/^_|_$/g,"")+".json"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); toast("Project data exported",p.name); }catch(e){ toast("Export failed"); } }
function iImportData(file){ const r=new FileReader(); r.onload=()=>{ try{ const obj=JSON.parse(r.result); const p=obj&&obj.project?obj.project:obj; if(!p||!Array.isArray(p.tracks)) throw new Error("bad"); const total=(p.bars||1)*16; p.tracks.forEach(tr=>{ if(!Array.isArray(tr.steps)) tr.steps=new Array(total).fill(false); }); p.id=p.id||instrumUID(); const S=state.instrum; iCleanupAudio(); S.project=JSON.parse(JSON.stringify(p)); iNormalizeAudioTracks(S.project); S.history=[]; S.hi=-1; S.activePreset=null; if(_iMaster) _iMaster.gain.value=S.project.master||0.9; iPushHistory(); S.menu=false; renderInstrum(); toast("Project imported",p.name||"Beat"); }catch(e){ toast("Import failed","Not a valid beat file"); } }; r.readAsText(file); }

  if(!tracks.length){ body=`<div class="idaw-empty" data-testid="idaw-empty"><i data-lucide="mic" style="width:24px;height:24px" class="mx-auto mb-2 opacity-60"></i>Record a vocal take or import audio to start your first track. Turn on <span class="font-semibold text-white/70">Beat backing</span> to perform over your beat.</div>`; }
  else {
    const ruler=`<div class="idaw-ruler" style="width:${laneW}px">`+Array.from({length:secs}).map((_,i)=>`<div class="idaw-tick" style="left:${i*IDAW_PPS}px">${i}s</div>`).join("")+`</div>`;
    const solo=tracks.some(x=>x.solo);
    const lanes=tracks.map(tr=>{ const clips=(tr.clips||[]).map(c=>{ const left=(c.start||0)*IDAW_PPS; const w=Math.max(26,(c.dur||0)*IDAW_PPS); return `<div class="idaw-clip" data-tid="${tr.id}" data-cid="${c.id}" style="left:${left}px;width:${w}px;border-color:${tr.color};background:${tr.color}22"><canvas data-wave="${c.id}" data-tid="${tr.id}" data-cid="${c.id}"></canvas><div class="idaw-clip-top"><span class="idaw-clip-name">${esc(c.name||"Take")}</span><button class="idaw-clip-del" data-act="i-clip-del" data-tid="${tr.id}" data-cid="${c.id}" aria-label="Delete clip"><i data-lucide="x" style="width:11px;height:11px"></i></button></div></div>`; }).join(""); return `<div class="idaw-lane" style="width:${laneW}px;height:${IDAW_TRACK_H}px;--idaw-beat:${IDAW_PPS}px">${clips}</div>`; }).join("");
    const phH=IDAW_RULER_H+tracks.length*(IDAW_TRACK_H+8);
    const strips=tracks.map(tr=>`<div class="idaw-strip" style="--tr-cell:${tr.color}"><div class="flex items-center gap-1.5"><span class="h-2.5 w-2.5 shrink-0 rounded-full" style="background:${tr.color}"></span><input value="${esc(tr.name)}" data-act="i-atrack-name" data-tid="${tr.id}" maxlength="20" aria-label="Track name" class="min-w-0 flex-1 bg-transparent text-[11px] font-bold text-white outline-none"><button data-act="i-atrack-del" data-tid="${tr.id}" aria-label="Delete track" class="press grid h-5 w-5 place-items-center rounded text-rose-300 hover:bg-rose-500/10"><i data-lucide="trash-2" style="width:12px;height:12px"></i></button></div><div class="flex items-center gap-1"><button data-act="i-atrack-mute" data-tid="${tr.id}" aria-label="Mute ${esc(tr.name)}" class="press grid h-6 w-6 shrink-0 place-items-center rounded-md border text-[10px] font-bold ${tr.mute?"border-rose-400/40 bg-rose-500/30 text-rose-100":"border-white/10 bg-white/5 text-white/50"}">M</button><button data-act="i-atrack-solo" data-tid="${tr.id}" aria-label="Solo ${esc(tr.name)}" class="press grid h-6 w-6 shrink-0 place-items-center rounded-md border text-[10px] font-bold ${tr.solo?"border-transparent bg-[color:var(--treesh-purple)] text-white":"border-white/10 bg-white/5 text-white/50"}">S</button><input type="range" min="0" max="1" step="0.05" value="${tr.vol}" data-act="i-atrack-vol" data-tid="${tr.id}" aria-label="${esc(tr.name)} volume" class="i-slider ml-0.5 min-w-0 flex-1"></div></div>`).join("");
    body=`<div class="flex gap-2">
       <div class="shrink-0 space-y-2" style="width:${IDAW_STRIP_W}px"><div style="height:${IDAW_RULER_H}px"></div>${strips}</div>
       <div class="relative min-w-0 flex-1 overflow-x-auto soft-scroll" id="i-audio-scroll">
         <div class="relative" style="width:${laneW}px"><div class="space-y-2">${ruler}${lanes}</div><div id="i-playhead" style="height:${phH}px"></div></div>
       </div>
    </div>`;
  }
  return `<div class="studio-panel mx-3 mt-3 p-3 sm:mx-4" data-testid="instrum-audio-panel">
     <div class="mb-2.5 flex items-center gap-1.5 text-[11px] font-bold uppercase tracking-wide text-white/45"><i data-lucide="audio-lines" style="width:14px;height:14px" class="text-[color:var(--treesh-purple)]"></i>Vocals &amp; Audio</div>
     ${controls}
     <div class="mt-3">${body}</div>
  </div>`;
}
/* ---------- Instrum render targets (view vs fullscreen overlay) ---------- */
function renderInstrum(animate){ if(state.instrum&&state.instrum.fs) renderInstrumFS(); else renderView(animate); iRenderMenu(); requestAnimationFrame(iAfterRender); }
function renderInstrumFS(){ const c=document.getElementById("instrum-fs"); if(!c) return; if(!state.instrum||!state.instrum.fs){ c.innerHTML=""; return; } const _sm=captureScroll(c); c.innerHTML=`<div class="fs-shell">${instrumStudioHtml(true)}</div>`; icons(); restoreScroll(c,_sm); requestAnimationFrame(()=>{ if(state.instrum&&state.instrum.playing) iHighlightCol(state.instrum.visStep); iAfterRender(); }); }
function iToggleFullscreen(){ const S=state.instrum; if(!S) return; S.fs=!S.fs; if(S.fs){ renderView(); renderInstrumFS(); } else { const c=document.getElementById("instrum-fs"); if(c) c.innerHTML=""; renderView(true); } iRenderMenu(); syncScrollLock(); }
/* ---------- Instrum history (undo / redo) ---------- */
function iSnapshot(){ return JSON.stringify(state.instrum.project); }
function iPushHistory(){ const S=state.instrum; if(!S) return; if(!S.history) S.history=[]; S.history=S.history.slice(0,(S.hi==null?-1:S.hi)+1); S.history.push(iSnapshot()); if(S.history.length>80){ S.history.shift(); } S.hi=S.history.length-1; iUpdateUndoUI(); }
function iUpdateUndoUI(){ const S=state.instrum; if(!S) return; const canUndo=S.history&&S.hi>0, canRedo=S.history&&S.hi<(S.history.length-1); const u=document.querySelector('[data-act="i-undo"]'), r=document.querySelector('[data-act="i-redo"]'); if(u) u.disabled=!canUndo; if(r) r.disabled=!canRedo; }
function iApplySnapshot(json){ const S=state.instrum; if(!S||!json) return; if(S.playing) iStop(); S.project=JSON.parse(json); if(_iMaster) _iMaster.gain.value=S.project.master; renderInstrum(); iUpdateUndoUI(); }
function iUndo(){ const S=state.instrum; if(!S||!S.history||S.hi<=0) return; S.hi--; iApplySnapshot(S.history[S.hi]); toast("Undo"); }
function iRedo(){ const S=state.instrum; if(!S||!S.history||S.hi>=S.history.length-1) return; S.hi++; iApplySnapshot(S.history[S.hi]); toast("Redo"); }
function iToggleMetronome(){ const S=state.instrum; if(!S) return; S.project.metronome=!S.project.metronome; document.querySelectorAll('[data-act="i-metronome"]').forEach(b=>b.classList.toggle("on",S.project.metronome)); toast(S.project.metronome?"Metronome on":"Metronome off"); }
function iOpenSaveDialog(){ const S=state.instrum; if(!S) return; const p=S.project; openPrompt("Name your beat", p.name||"Untitled beat", (name)=>{ p.name=(name||"").trim()||"Untitled beat"; iSaveProject(); }); }
function iBpmStep(delta){ const S=state.instrum; if(!S) return; const p=S.project; p.bpm=Math.max(40,Math.min(220,(p.bpm||90)+delta)); const inp=document.querySelector('[data-act="i-bpm"]'); if(inp) inp.value=p.bpm; }

/* branded boot splash: hide once the first real render is on screen (min display so it never flashes) */
let __splashStart = (typeof window!=="undefined" && window.__splashStart) ? window.__splashStart : Date.now();
function hideSplash(){ const s=document.getElementById("app-splash"); if(!s||s._hiding) return; s._hiding=true; const MIN=750; const wait=Math.max(0, MIN-(Date.now()-__splashStart)); setTimeout(()=>{ s.classList.add("splash-hide"); setTimeout(()=>{ try{ s.remove(); }catch(e){} }, 620); }, wait); }
try{ setTimeout(()=>{ try{ hideSplash(); }catch(e){} }, 7000); }catch(e){}
async function boot(){
  applyAccent(state.accent);
  applyTheme();
  starfield();
  initIconWatch();
  if(!window.lucide){ let _lt=0; const _li=setInterval(()=>{ _lt++; if(window.lucide){ clearInterval(_li); icons(); } else if(_lt>60){ clearInterval(_li); } }, 120); }
  const cachedTs = loadCatalogCache();
  if(cachedTs){
    init();                                  // instant boot from cache
    hideSplash();                            // reveal the ready app
    loadUserSongs();                         // load custom tracks from IndexedDB
    loadCatalog().then(res=>{ if(res.changed) softRefresh(); }).catch(()=>{}); // stale-while-revalidate
  } else {
    renderBootLoading();
    hideSplash();                            // reveal branded loading skeleton
    try{ await loadCatalog(); init(); loadUserSongs(); }
    catch(e){ console.error("Catalog load failed:", e); renderBootError(); }
  }
  startCatalogPolling();
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",boot); else boot();

/* --- Global UX protections: block accidental zoom, protect images, full-tap date picker --- */
(function(){
  try{
    window.addEventListener("wheel", e=>{ if(e.ctrlKey||e.metaKey) e.preventDefault(); }, {passive:false});
    window.addEventListener("keydown", e=>{ if((e.ctrlKey||e.metaKey) && (e.key==="+"||e.key==="-"||e.key==="="||e.key==="0")) e.preventDefault(); });
    ["gesturestart","gesturechange","gestureend"].forEach(ev=>document.addEventListener(ev, e=>{ e.preventDefault(); }));
    document.addEventListener("contextmenu", e=>{ if(e.target && e.target.closest && e.target.closest("input,textarea,[contenteditable]")) return; e.preventDefault(); });
    document.addEventListener("dragstart", e=>{ if(e.target && e.target.tagName==="IMG") e.preventDefault(); });
    document.addEventListener("click", e=>{ const d=e.target && e.target.closest && e.target.closest('input[type="date"]'); if(d && !d.disabled && typeof d.showPicker==="function"){ try{ d.showPicker(); }catch(_){} } });
    ["input","change"].forEach(ev=>document.addEventListener(ev, e=>{ const t=e.target; if(t && t.classList && t.classList.contains("tdf-native")) syncDateField(t); }));
  }catch(e){}
})();
</script>
