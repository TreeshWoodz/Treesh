        <script>
          $(document).ready(function() {

            $musicArtist.click(function () {
    var $this = $(this);
    var theName = $this.find(".artist__label p:first").text();
    var shortName = theName.replace(/[^a-z0-9]/g, "").toLowerCase();
    var theBG = $this.attr("data-bg");
    var theLocation = $("#icons .member[data-name='"+ theName +"']").find(".location").text();
    var $matchingMember = $("#icons .members").find(".member").filter(function () {
        return (
          $(this)
            .attr("data-name")
            .replace(/[^a-z0-9]/g, "")
            .toLowerCase() === shortName
        );
      })
      .first();

    $(".mm-menu #music_filters div[data-show]").hide();
          $(".mm-menu #music_filters div[data-show='icon']").show();
      
      $this.addClass("clicked").siblings().removeClass("clicked");

    $("#about_artist .about_artist-item").scrollTop(0);

    if ($matchingMember.length) {
      var theBio = $this.data("bio");
      
      if (!theBio || !theBio.trim()) {
        theBio = $matchingMember.data("quote");
      }
      
      $("#about_artist h1, .mm-menu .artist_picked, #about_artist .artist_name").text(theName);
      $("#about_artist .artist_location").text(theLocation);
      $("#about_artist .donate-btn, .mm-menu #music_filters .donate-btn").attr("data-cashapp", $this.attr("data-cashapp"));
      $("#about_artist .page_options h4").text("Icons | " + theName);
      
      if ( !$this.is("[data-cashapp]") ) {
          $("#about_artist .donate-btn").hide();
         $(".mm-menu #music_filters div[data-show='icon']").find(".donate-btn").remove();
      } else {
          $("#about_artist .donate-btn").show();
          $('<button type="button" class="donate-btn" data-action="donate to icon"><span><i class="fa-solid fa-circle-dollar-to-slot"></i></span> <span>Donate on CashApp</span></button>').insertBefore(".mm-menu .close-about_artists-btn");
      }
      
      if ( $this.hasClass("liked") ) {
          $("#about_artist .favorite-btn, #music_filter .favorite_icon-btn").addClass("clicked").find("p").text("Unlike");
          $(".mm-menu #music_filters .favorite_icon-btn").addClass("clicked");
          $(".mm-menu #music_filters .favorite_icon-btn span:last").html('Dislike <p class="artist_picked">'+ theName +'</p>');
      } else {
          $("#about_artist .favorite-btn, #music_filter .favorite_icon-btn").removeClass("clicked").find("p").text("Like");
          $(".mm-menu #music_filters .favorite_icon-btn").removeClass("clicked");
          $(".mm-menu #music_filters .favorite_icon-btn span:last").html('Like <p class="artist_picked">'+ theName +'</p>');
      }

      if ($this.hasClass("hyphenate_name")) {
        $("#about_artist h1").addClass("hyphenate");
      } else {
        $("#about_artist h1").removeClass("hyphenate");
      }

      $("#about_artist .desc p").text(theBio);
      $("#about_artist .artist__image").attr(
        "src",
        theBG
      );
      
      $("#about_artist div.artist__blur, .mm-menu .favorite_icon-btn span:first").css("background", "url('"+ theBG +"') center center / cover no-repeat");

      $matchingMember
        .find(".socials a:not('.music_link')")
        .clone()
        .appendTo("#about_artist .artist_socials-contain");
    } else {
      console.log("No matching member found for:", theName);
    }
    
    $("#about_artist .artist__image").css({
    "transition-delay": "0s",
    "transition-duration": "0.3s",
    "transform": "scale(1) translate3d(0, -50%, 0)",
    "opacity": 1
  });
  
  $("#about_artist .artist__ring").css({
    "transition-delay": "0.2s",
    "transition-duration": "0.3s",
    "transform": "scale(1) translate3d(0, -50%, 0)",
    "opacity": 1
  });
  
  $("#about_artist .artist__blur").css({
    "transition-delay": "0.3s",
    "transition-duration": "0.3s",
    "opacity": 1
  });
  });

            $(document).on("click", "#about_artist .trackss .song", function () {
    var theTrackName = $(this).attr("data-track");
    
    $("#music .grid .song[data-track='"+ theTrackName +"']").click();
  });
  
  $("#about_artist .top_artist_options").on("click", "button", function() {
                      var $this = $(this);
                      
                      if ( $("#music .artists .artist").hasClass("clicked") ) {
                      if ( $this.hasClass("favorite-btn") ) {
                          favoriteArtist($("#music .artists .artist.clicked"));
                          if ( $("#music .artists .artist.clicked").hasClass("liked") ) {
                              $this.removeClass("clicked").find("p").text("Like");
                          } else {
                              $this.addClass("clicked").find("p").text("Unlike");
                          }
                      }
                      }
                  });
            
const $artistTracksGrid = $("#about_artist .trackss").isotope({
  itemSelector: ".song",
  gutter: 0,
  percentPosition: true
});

                             

  if (localStorage.getItem("musicView") == "list") {
    $("#music .tracks, #about_artist .trackss").addClass("list_view");
    $grid.isotope("layout");
    $(".mm-menu .list_view-btn i")
      .removeClass()
      .addClass("fa-solid fa-border-all");
  } else {
    $("#music .tracks, #about_artist .trackss").removeClass("list_view");

    $tracksItems.each(function () {
      var $this = $(this);
      $this.find(".coverart").height($this.find(".coverart").width());
    });

    $grid.isotope("layout");
    $(".mm-menu .list_view-btn i").removeClass().addClass("fa-solid fa-list");
  }

          });
        </script>

</body>
