<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Paranormal RPG - Three.js Mobile</title>
    <style>
        :root {
            --bg: #000008;
            --text: #e8e0f0;
            --glow: #9966ff;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Segoe UI', 'Georgia', serif;
            height: 100vh;
            width: 100vw;
            position: fixed;
            inset: 0;
            touch-action: manipulation;
        }
        canvas {
            display: block;
            position: fixed;
            inset: 0;
            z-index: 1;
        }

        #hud {
            position: fixed;
            inset: 0;
            z-index: 10;
            pointer-events: none;
        }

        #top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 12px 14px;
            gap: 10px;
        }
        #health-mana {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 110px;
        }
        .bar-container {
            background: rgba(0, 0, 0, 0.55);
            border-radius: 10px;
            height: 14px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
        }
        .bar-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.3s ease;
        }
        .bar-fill.hp {
            background: linear-gradient(90deg, #cc2244, #ff4466);
        }
        .bar-fill.mp {
            background: linear-gradient(90deg, #2244cc, #4488ff);
        }
        .bar-label {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.6rem;
            color: #fff;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-shadow: 0 0 6px rgba(0, 0, 0, 0.7);
            pointer-events: none;
        }

        #score-area {
            text-align: center;
            color: #ffd;
            text-shadow: 0 0 20px rgba(255, 220, 100, 0.6);
            pointer-events: none;
        }
        #score-area .wave {
            font-size: 0.75rem;
            letter-spacing: 0.06em;
            opacity: 0.85;
        }
        #score-area .score {
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 0.05em;
        }

        #entity-name-display {
            font-size: 0.8rem;
            font-weight: 300;
            letter-spacing: 0.08em;
            color: #e8e0f0;
            text-shadow: 0 0 25px currentColor;
            text-align: right;
            min-width: 70px;
        }

        #ability-panel {
            position: fixed;
            bottom: 100px;
            right: 10px;
            z-index: 11;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: all;
        }
        .ability-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.35);
            background: rgba(20, 15, 35, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: #fff;
            position: relative;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }
        .ability-btn:active {
            transform: scale(0.88);
            border-color: #fff;
            box-shadow: 0 0 30px rgba(180, 140, 255, 0.6);
        }
        .ability-btn.on-cooldown {
            opacity: 0.4;
            filter: grayscale(0.6);
        }
        .ability-btn .cd-overlay {
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            pointer-events: none;
        }
        .ability-label {
            position: absolute;
            bottom: -16px;
            font-size: 0.5rem;
            color: #ccc;
            letter-spacing: 0.03em;
            text-align: center;
            width: 100%;
            pointer-events: none;
        }

        #entity-switch-row {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 11;
            display: flex;
            gap: 8px;
            pointer-events: all;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 95vw;
        }
        .entity-dot {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1.5px solid rgba(255, 255, 255, 0.3);
            background: rgba(10, 8, 20, 0.65);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }
        .entity-dot.active {
            border-color: #fff;
            box-shadow: 0 0 18px var(--dot-glow, rgba(180, 140, 255, 0.7));
            transform: scale(1.15);
            background: rgba(30, 20, 50, 0.8);
        }
        .entity-dot:active {
            transform: scale(0.9);
        }

        #joystick-zone {
            position: fixed;
            bottom: 30px;
            left: 10px;
            width: 130px;
            height: 130px;
            z-index: 9;
            pointer-events: all;
        }
        #joystick-base {
            position: absolute;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            border: 2px solid rgba(255, 255, 255, 0.2);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }
        #joystick-knob {
            position: absolute;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(220, 210, 255, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.6);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            box-shadow: 0 0 20px rgba(180, 150, 255, 0.5);
        }

        #death-overlay {
            position: fixed;
            inset: 0;
            background: rgba(80, 0, 0, 0.5);
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
            font-size: 2rem;
            color: #fff;
            letter-spacing: 0.1em;
            text-shadow: 0 0 60px #ff0000;
        }

        @media (max-width: 480px) {
            .ability-btn {
                width: 42px;
                height: 42px;
                font-size: 1rem;
            }
            #ability-panel {
                bottom: 85px;
                right: 6px;
                gap: 8px;
            }
            .entity-dot {
                width: 30px;
                height: 30px;
                font-size: 0.85rem;
            }
            #entity-switch-row {
                gap: 5px;
                bottom: 12px;
            }
            #joystick-zone {
                width: 110px;
                height: 110px;
                bottom: 20px;
                left: 4px;
            }
            #joystick-base {
                width: 70px;
                height: 70px;
            }
            #joystick-knob {
                width: 32px;
                height: 32px;
            }
        }
    </style>
</head>
<body>

    <div id="hud">
        <div id="top-bar">
            <div id="health-mana">
                <div class="bar-container" id="hp-container">
                    <div class="bar-fill hp" id="hp-fill" style="width:100%"></div>
                    <span class="bar-label">❤️ 100</span>
                </div>
                <div class="bar-container" id="mp-container">
                    <div class="bar-fill mp" id="mp-fill" style="width:100%"></div>
                    <span class="bar-label">💎 100</span>
                </div>
            </div>
            <div id="score-area">
                <div class="wave" id="wave-text">Wave 1</div>
                <div class="score" id="score-text">0 pts</div>
            </div>
            <div id="entity-name-display">👻 Ghost</div>
        </div>
    </div>

    <div id="ability-panel">
        <button class="ability-btn" id="ability-0" data-slot="0"><span>⚡</span><span class="ability-label">Skill 1</span></button>
        <button class="ability-btn" id="ability-1" data-slot="1"><span>💥</span><span class="ability-label">Skill 2</span></button>
        <button class="ability-btn" id="ability-2" data-slot="2"><span>🛡️</span><span class="ability-label">Skill 3</span></button>
    </div>

    <div id="entity-switch-row"></div>

    <div id="joystick-zone">
        <div id="joystick-base"></div>
        <div id="joystick-knob"></div>
    </div>

    <div id="death-overlay">💀 DEFEATED</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ─────────────────────────────────────
        // DOM REFS
        // ─────────────────────────────────────
        const hpFill = document.getElementById('hp-fill');
        const mpFill = document.getElementById('mp-fill');
        const hpLabel = document.querySelector('#hp-container .bar-label');
        const mpLabel = document.querySelector('#mp-container .bar-label');
        const waveText = document.getElementById('wave-text');
        const scoreText = document.getElementById('score-text');
        const entityNameDisplay = document.getElementById('entity-name-display');
        const abilityBtns = [document.getElementById('ability-0'), document.getElementById('ability-1'), document
            .getElementById('ability-2')
        ];
        const entitySwitchRow = document.getElementById('entity-switch-row');
        const joystickBase = document.getElementById('joystick-base');
        const joystickKnob = document.getElementById('joystick-knob');
        const joystickZone = document.getElementById('joystick-zone');
        const deathOverlay = document.getElementById('death-overlay');

        // ─────────────────────────────────────
        // THREE.JS SETUP
        // ─────────────────────────────────────
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);
        scene.fog = new THREE.FogExp2(0x0a0a18, 0.00018);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.5, 70);
        camera.position.set(0, 9, 11);
        camera.lookAt(0, 0, 0);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x1a1a3a, 2.5);
        scene.add(ambientLight);
        const moonLight = new THREE.DirectionalLight(0x8899cc, 3.5);
        moonLight.position.set(8, 14, 4);
        moonLight.castShadow = true;
        moonLight.shadow.mapSize.width = 1024;
        moonLight.shadow.mapSize.height = 1024;
        moonLight.shadow.camera.near = 0.5;
        moonLight.shadow.camera.far = 50;
        moonLight.shadow.camera.left = -20;
        moonLight.shadow.camera.right = 20;
        moonLight.shadow.camera.top = 20;
        moonLight.shadow.camera.bottom = -20;
        moonLight.shadow.bias = -0.0003;
        scene.add(moonLight);

        const playerLight = new THREE.PointLight(0xffffff, 15, 14, 1.5);
        playerLight.position.set(0, 2, 0);
        playerLight.castShadow = true;
        playerLight.shadow.mapSize.width = 512;
        playerLight.shadow.mapSize.height = 512;
        scene.add(playerLight);

        // ─────────────────────────────────────
        // WORLD
        // ─────────────────────────────────────
        const WORLD_SIZE = 45;
        const groundGeo = new THREE.PlaneGeometry(WORLD_SIZE, WORLD_SIZE);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x0d0d18, roughness: 0.55, metalness: 0.3 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.15;
        ground.receiveShadow = true;
        scene.add(ground);

        // Grid lines on ground
        const gridHelper = new THREE.PolarGridHelper(WORLD_SIZE / 2, 36, 20, 64, 0x222244, 0x222244);
        gridHelper.position.y = -0.13;
        scene.add(gridHelper);

        // Boundary ring
        const boundaryGeo = new THREE.TorusGeometry(WORLD_SIZE / 2 - 1, 0.15, 16, 100);
        const boundaryMat = new THREE.MeshBasicMaterial({ color: 0x334466, transparent: true, opacity: 0.5, depthWrite: false });
        const boundaryRing = new THREE.Mesh(boundaryGeo, boundaryMat);
        boundaryRing.rotation.x = -Math.PI / 2;
        boundaryRing.position.y = -0.1;
        boundaryRing.renderOrder = 1;
        scene.add(boundaryRing);

        // Environmental props
        const propsGroup = new THREE.Group();
        scene.add(propsGroup);
        const obstacleData = [];

        function addTree(x, z) {
            const group = new THREE.Group();
            const trunkGeo = new THREE.CylinderGeometry(0.15, 0.22, 2.5 + Math.random() * 2, 8);
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x332211, roughness: 0.7 });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = 1.3;
            trunk.castShadow = true;
            group.add(trunk);
            const foliageGeo = new THREE.ConeGeometry(0.8 + Math.random() * 0.6, 2.5 + Math.random() * 2, 10);
            const foliageMat = new THREE.MeshStandardMaterial({ color: 0x0a1a0a, roughness: 0.6, emissive: 0x001100,
                emissiveIntensity: 0.3 });
            const foliage = new THREE.Mesh(foliageGeo, foliageMat);
            foliage.position.y = 2.8;
            foliage.castShadow = true;
            group.add(foliage);
            group.position.set(x, -0.15, z);
            propsGroup.add(group);
            obstacleData.push({ x, z, radius: 1.0, group });
        }

        function addCrystal(x, z) {
            const group = new THREE.Group();
            const h = 1.2 + Math.random() * 2.5;
            const geo = new THREE.OctahedronGeometry(0.25 + Math.random() * 0.35, 0);
            const mat = new THREE.MeshStandardMaterial({
                color: new THREE.Color().setHSL(0.65 + Math.random() * 0.2, 0.7, 0.5 + Math.random() * 0.4),
                roughness: 0.2,
                metalness: 0.5,
                emissive: new THREE.Color().setHSL(0.65, 0.8, 0.3),
                emissiveIntensity: 0.7
            });
            const crystal = new THREE.Mesh(geo, mat);
            crystal.scale.set(1, h / 0.5, 1);
            crystal.position.y = h / 2;
            crystal.castShadow = true;
            group.add(crystal);
            const glowGeo = new THREE.SphereGeometry(0.4, 8, 8);
            const glowMat = new THREE.MeshBasicMaterial({ color: mat.emissive, transparent: true, opacity: 0.25, blending: THREE
                    .AdditiveBlending, depthWrite: false });
            const glow = new THREE.Mesh(glowGeo, glowMat);
            glow.position.y = h / 2;
            group.add(glow);
            group.position.set(x, -0.15, z);
            propsGroup.add(group);
            obstacleData.push({ x, z, radius: 0.7, group });
        }

        function addPillar(x, z) {
            const group = new THREE.Group();
            const h = 3 + Math.random() * 4;
            const geo = new THREE.CylinderGeometry(0.3, 0.45, h, 12);
            const mat = new THREE.MeshStandardMaterial({ color: 0x3a3a4a, roughness: 0.35, metalness: 0.5 });
            const pillar = new THREE.Mesh(geo, mat);
            pillar.position.y = h / 2;
            pillar.castShadow = true;
            group.add(pillar);
            const topGeo = new THREE.TorusGeometry(0.5, 0.08, 8, 16);
            const topMat = new THREE.MeshBasicMaterial({ color: 0x8866aa, transparent: true, opacity: 0.6, blending: THREE
                    .AdditiveBlending, depthWrite: false });
            const topRing = new THREE.Mesh(topGeo, topMat);
            topRing.position.y = h;
            topRing.renderOrder = 2;
            group.add(topRing);
            group.position.set(x, -0.15, z);
            propsGroup.add(group);
            obstacleData.push({ x, z, radius: 0.8, group });
        }

        for (let i = 0; i < 22; i++) {
            const x = (Math.random() - 0.5) * (WORLD_SIZE - 8);
            const z = (Math.random() - 0.5) * (WORLD_SIZE - 8);
            const r = Math.random();
            if (r < 0.4) addTree(x, z);
            else if (r < 0.75) addCrystal(x, z);
            else addPillar(x, z);
        }

        // Starfield
        const starGeo = new THREE.BufferGeometry();
        const starCount = 1500;
        const starPositionsArr = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const r = 28 + Math.random() * 22;
            starPositionsArr[i * 3] = Math.sin(phi) * Math.cos(theta) * r;
            starPositionsArr[i * 3 + 1] = Math.abs(Math.sin(phi) * Math.sin(theta) * r) + 2;
            starPositionsArr[i * 3 + 2] = Math.cos(phi) * r;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPositionsArr, 3));
        const starMat = new THREE.PointsMaterial({ color: 0xccccff, size: 0.08, blending: THREE.AdditiveBlending,
            depthWrite: false, transparent: true, opacity: 0.7 });
        const starfield = new THREE.Points(starGeo, starMat);
        starfield.renderOrder = 0;
        scene.add(starfield);

        // ─────────────────────────────────────
        // ENTITY CONFIGS
        // ─────────────────────────────────────
        const entityConfigs = {

                        speed: 14, size: 0.25 },

                        distance: 7 },

                        radius: 4.5 },

                        speed: 12, size: 0.35, explosive: true },
                    { name: 'Hell Stomp', icon: '💢', type: 'aoe', color: 0xff3300, dmg: 30, cost: 28, cd: 4.5,
                    radius: 5 },

                        distance: 8 },

                abilities: [
                    { name: 'Psychic Blast', icon: '🧠', type: 'projectile', color: 0xcc88ff, dmg: 16, cost: 15, cd: 1.2,
                        speed: 16, size: 0.2 },
                    { name: 'Teleport', icon: '✨', type: 'dash', color: 0xdd99ff, dmg: 0, cost: 20, cd: 2.5,
                    distance: 10 },

                        speed: 20, size: 0.22, chain: 3 },
                    { name: 'Energy Shield', icon: '🔷', type: 'shield', color: 0x44eeff, shield: 35, cost: 22, cd: 5.5,
                        duration: 3.5 },
                    { name: 'Overcharge', icon: '⚡', type: 'buff', color: 0x88ffff, buffSpeed: 1.6, buffDmg: 1.5,
                        cost: 28, cd: 8.0, duration: 4 },
                ],
            },
        };

        const entityKeys = ['ghost', 'demon', 'apparition', 'deity', 'god', 'energyBeing'];
        let currentEntityKey = 'ghost';
        let playerHp, playerMp, playerMaxHp, playerMaxMp;
        let playerShield = 0;
        let playerBuff = null; // { speedMul, dmgMul, endTime }
        let score = 0;
        let wave = 1;
        let enemiesRemaining = 0;
        let waveActive = false;
        let waveDelay = 2.0;
        let deathTimer = 0;
        let playerDead = false;

        // ─────────────────────────────────────
        // PLAYER
        // ─────────────────────────────────────
        const playerGroup = new THREE.Group();
        playerGroup.position.set(0, 0.5, 0);
        scene.add(playerGroup);
        let playerVelocity = new THREE.Vector3();
        let playerFacing = new THREE.Vector3(0, 0, -1);
        let coreMesh, coreGlowMesh;
        let playerParticleSystem, playerParticleData = [];
        const playerSecondaryMeshes = [];

        function clearPlayerVisual() {
            if (coreMesh) { playerGroup.remove(coreMesh);
                coreMesh.geometry?.dispose();
                coreMesh.material?.dispose();
                coreMesh = null; }
            if (coreGlowMesh) { playerGroup.remove(coreGlowMesh);
                coreGlowMesh.geometry?.dispose();
                coreGlowMesh.material?.dispose();
                coreGlowMesh = null; }
            playerSecondaryMeshes.forEach(m => { playerGroup.remove(m);
                m.geometry?.dispose();
                m.material?.dispose(); });
            playerSecondaryMeshes.length = 0;
            if (playerParticleSystem) { playerGroup.remove(playerParticleSystem);
                playerParticleSystem.geometry?.dispose();
                playerParticleSystem.material?.dispose();
                playerParticleSystem = null;
                playerParticleData = []; }
        }

        function buildPlayerVisual(key) {
            clearPlayerVisual();
            const cfg = entityConfigs[key];
            const coreGeo = new THREE.SphereGeometry(0.3, 32, 32);
            const coreMat = new THREE.MeshStandardMaterial({ color: cfg.coreColor, roughness: 0.15, metalness: 0.2,
                emissive: cfg.glowColor, emissiveIntensity: 1.8 });
            coreMesh = new THREE.Mesh(coreGeo, coreMat);
            coreMesh.castShadow = true;
            playerGroup.add(coreMesh);

            const glowGeo = new THREE.SphereGeometry(0.5, 24, 24);
            const glowMat = new THREE.MeshBasicMaterial({ color: cfg.glowColor, transparent: true, opacity: 0.35,
                blending: THREE.AdditiveBlending, depthWrite: false });
            coreGlowMesh = new THREE.Mesh(glowGeo, glowMat);
            coreGlowMesh.renderOrder = 2;
            playerGroup.add(coreGlowMesh);

            const haloGeo = new THREE.SphereGeometry(0.7, 16, 16);
            const haloMat = new THREE.MeshBasicMaterial({ color: cfg.glowColor, transparent: true, opacity: 0.13,
                blending: THREE.AdditiveBlending, depthWrite: false });
            const halo = new THREE.Mesh(haloGeo, haloMat);
            halo.renderOrder = 1;
            playerGroup.add(halo);
            playerSecondaryMeshes.push(halo);

            const ringGeo = new THREE.TorusGeometry(0.55, 0.04, 16, 32);
            const ringMat = new THREE.MeshBasicMaterial({ color: cfg.glowColor, transparent: true, opacity: 0.6,
                blending: THREE.AdditiveBlending, depthWrite: false });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.renderOrder = 3;
            ring.rotation.x = Math.PI * 0.5;
            playerGroup.add(ring);
            playerSecondaryMeshes.push(ring);

            const pc = 80;
            const pGeo = new THREE.BufferGeometry();
            const pPos = new Float32Array(pc * 3);
            playerParticleData = [];
            for (let i = 0; i < pc; i++) {
                const r = 0.4 + Math.random() * 1.5;
                const th = Math.random() * Math.PI * 2;
                const ph = Math.random() * Math.PI;
                pPos[i * 3] = Math.sin(ph) * Math.cos(th) * r;
                pPos[i * 3 + 1] = Math.sin(ph) * Math.sin(th) * r;
                pPos[i * 3 + 2] = Math.cos(ph) * r;
                playerParticleData.push({ baseR: r, baseTh: th, basePh: ph, speed: 0.5 + Math.random() * 2, phase: Math
                        .random() * Math.PI * 2 });
            }
            pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
            const pMat = new THREE.PointsMaterial({ color: cfg.particleColors[0], size: 0.08, blending: THREE
                    .AdditiveBlending, depthWrite: false, transparent: true, opacity: 0.8 });
            playerParticleSystem = new THREE.Points(pGeo, pMat);
            playerParticleSystem.renderOrder = 4;
            playerGroup.add(playerParticleSystem);
        }

        function resetPlayerStats() {
            const cfg = entityConfigs[currentEntityKey];
            playerMaxHp = cfg.maxHp;
            playerMaxMp = cfg.maxMp;
            playerHp = playerMaxHp;
            playerMp = playerMaxMp;
            playerShield = 0;
            playerBuff = null;
            playerDead = false;
            deathTimer = 0;
            playerGroup.position.set((Math.random() - 0.5) * 20, 0.5, (Math.random() - 0.5) * 20);
            playerGroup.visible = true;
            playerGroup.scale.setScalar(1);
            deathOverlay.style.opacity = '0';
        }

        buildPlayerVisual('ghost');
        resetPlayerStats();

        // ─────────────────────────────────────
        // ENEMIES
        // ─────────────────────────────────────
        const enemies = [];
        const enemyGroup = new THREE.Group();
        scene.add(enemyGroup);

        const enemyTypes = [
            { name: 'Shadow Wisp', hp: 25, speed: 3.5, dmg: 8, size: 0.5, color: 0x331144, glow: 0x662288, score: 10 },
            { name: 'Dark Phantom', hp: 45, speed: 4.5, dmg: 14, size: 0.7, color: 0x220022, glow: 0x883355, score: 25 },
            { name: 'Corrupted Knight', hp: 75, speed: 2.8, dmg: 22, size: 0.9, color: 0x1a0000, glow: 0xcc3333, score: 50 },
        ];

        function spawnEnemy(typeIndex) {
            const type = enemyTypes[Math.min(typeIndex, enemyTypes.length - 1)];
            const angle = Math.random() * Math.PI * 2;
            const dist = WORLD_SIZE / 2 - 3 + Math.random() * 5;
            const x = Math.cos(angle) * dist;
            const z = Math.sin(angle) * dist;
            const group = new THREE.Group();
            const bodyGeo = new THREE.SphereGeometry(type.size, 12, 12);
            const bodyMat = new THREE.MeshStandardMaterial({ color: type.color, roughness: 0.4, metalness: 0.3,
                emissive: type.glow, emissiveIntensity: 0.6 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.castShadow = true;
            group.add(body);
            const eyeGeo = new THREE.SphereGeometry(type.size * 0.35, 8, 8);
            const eyeMat = new THREE.MeshBasicMaterial({ color: type.glow, blending: THREE.AdditiveBlending,
                depthWrite: false });
            const eye = new THREE.Mesh(eyeGeo, eyeMat);
            eye.position.y = type.size * 0.4;
            eye.renderOrder = 2;
            group.add(eye);
            group.position.set(x, type.size * 0.9, z);
            enemyGroup.add(group);
            const enemy = {
                group,
                body,
                eye,
                type,
                hp: type.hp,
                maxHp: type.hp,
                speed: type.speed + Math.random() * 1.5,
                dmg: type.dmg,
                attackCooldown: 0,
                stuckTimer: 0,
                stuckDir: Math.random() * Math.PI * 2,
            };
            enemies.push(enemy);
            enemiesRemaining++;
            return enemy;
        }

        function spawnWave(waveNum) {
            const count = 3 + waveNum * 2;
            enemiesRemaining = 0;
            for (let i = 0; i < count; i++) {
                let typeIdx = 0;
                if (waveNum >= 3 && i % 3 === 0) typeIdx = 2;
                else if (waveNum >= 2 && i % 2 === 0) typeIdx = 1;
                spawnEnemy(typeIdx);
            }
            waveActive = true;
            waveText.textContent = `Wave ${waveNum}`;
        }

        function clearAllEnemies() {
            while (enemies.length > 0) {
                const e = enemies.pop();
                enemyGroup.remove(e.group);
                e.group.traverse(c => { if (c.geometry) c.geometry.dispose(); if (c.material) c.material.dispose(); });
            }
            enemiesRemaining = 0;
        }

        // ─────────────────────────────────────
        // PROJECTILES & EFFECTS
        // ─────────────────────────────────────
        const projectiles = [];
        const aoeEffects = [];
        const projectileGroup = new THREE.Group();
        scene.add(projectileGroup);

        function createProjectile(origin, dir, config, isPlayer = true) {
            const geo = new THREE.SphereGeometry(config.size || 0.22, 8, 8);
            const mat = new THREE.MeshBasicMaterial({ color: config.color, blending: THREE.AdditiveBlending,
                depthWrite: false, transparent: true, opacity: 0.9 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.copy(origin);
            mesh.renderOrder = 5;
            projectileGroup.add(mesh);
            const proj = {
                mesh,
                dir: dir.clone().normalize(),
                speed: config.speed || 12,
                dmg: config.dmg || 15,
                color: config.color,
                isPlayer,
                lifetime: 2.5,
                chain: config.chain || 0,
                chained: [],
                explosive: config.explosive || false,
                explodeRadius: config.explosive ? 3 : 0,
            };
            projectiles.push(proj);
            return proj;
        }

        function createAoeEffect(position, color, radius, duration = 0.6) {
            const geo = new THREE.RingGeometry(0.1, radius, 32);
            const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.8, blending: THREE
                    .AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
            const ring = new THREE.Mesh(geo, mat);
            ring.position.copy(position);
            ring.position.y += 0.1;
            ring.rotation.x = -Math.PI / 2;
            ring.renderOrder = 5;
            scene.add(ring);
            const effect = { mesh: ring, material: mat, duration, elapsed: 0, radius, color, position: position.clone() };
            aoeEffects.push(effect);
            return effect;
        }

        // ─────────────────────────────────────
        // GAME LOGIC
        // ─────────────────────────────────────
        function damagePlayer(amount) {
            if (playerDead) return;
            if (playerShield > 0) {
                const absorbed = Math.min(playerShield, amount);
                playerShield -= absorbed;
                amount -= absorbed;
            }
            if (amount > 0) {
                playerHp -= amount;
                if (playerHp <= 0) {
                    playerHp = 0;
                    killPlayer();
                }
            }
            updateHUD();
        }

        function killPlayer() {
            playerDead = true;
            deathTimer = 1.5;
            playerGroup.visible = false;
            deathOverlay.style.opacity = '1';
            createAoeEffect(playerGroup.position.clone(), 0xff0000, 3, 1.2);
            clearAllEnemies();
            waveActive = false;
            enemiesRemaining = 0;
            score = Math.max(0, score - 30);
            updateHUD();
        }

        function healPlayer(amount) {
            playerHp = Math.min(playerMaxHp, playerHp + amount);
            updateHUD();
        }

        function useMana(amount) {
            if (playerMp >= amount) {
                playerMp -= amount;
                updateHUD();
                return true;
            }
            return false;
        }

        function updateHUD() {
            const hpPct = Math.max(0, playerHp / playerMaxHp * 100);
            const mpPct = Math.max(0, playerMp / playerMaxMp * 100);
            hpFill.style.width = hpPct + '%';
            mpFill.style.width = mpPct + '%';
            hpLabel.textContent = `❤️ ${Math.ceil(playerHp)}${playerShield>0?' 🛡️':''}`;
            mpLabel.textContent = `💎 ${Math.ceil(playerMp)}`;
            scoreText.textContent = `${Math.floor(score)} pts`;
        }

        function getNearestEnemy(pos, maxRange = 20) {
            let nearest = null;
            let nearestDist = maxRange;
            for (const e of enemies) {
                const d = pos.distanceTo(e.group.position);
                if (d < nearestDist) { nearestDist = d;
                    nearest = e; }
            }
            return nearest;
        }

        function useAbility(slotIndex) {
            if (playerDead) return;
            const cfg = entityConfigs[currentEntityKey];
            const ability = cfg.abilities[slotIndex];
            if (!ability) return;
            if (!useMana(ability.cost)) return;
            if (abilityBtnCooldowns[slotIndex] > 0) return;
            abilityBtnCooldowns[slotIndex] = ability.cd;

            const pos = playerGroup.position.clone();
            const facing = playerFacing.clone();

            switch (ability.type) {
                case 'projectile': {
                    const origin = pos.clone().add(new THREE.Vector3(0, 0.8, 0)).add(facing.clone().multiplyScalar(0.6));
                    createProjectile(origin, facing, ability, true);
                    break;
                }
                case 'dash': {
                    const dashDir = facing.clone();
                    const endPos = pos.clone().add(dashDir.multiplyScalar(ability.distance));
                    endPos.x = THREE.MathUtils.clamp(endPos.x, -WORLD_SIZE / 2 + 2, WORLD_SIZE / 2 - 2);
                    endPos.z = THREE.MathUtils.clamp(endPos.z, -WORLD_SIZE / 2 + 2, WORLD_SIZE / 2 - 2);
                    for (const ob of obstacleData) {
                        const dx = endPos.x - ob.x;
                        const dz = endPos.z - ob.z;
                        if (Math.sqrt(dx * dx + dz * dz) < ob.radius + 0.6) {
                            endPos.x = pos.x;
                            endPos.z = pos.z;
                            break;
                        }
                    }
                    playerGroup.position.copy(endPos);
                    playerGroup.position.y = 0.5;
                    createAoeEffect(pos, ability.color, 2, 0.4);
                    if (ability.dmg > 0) {
                        for (const e of enemies) {
                            if (e.group.position.distanceTo(endPos) < 2.5) {
                                e.hp -= ability.dmg;
                                if (e.hp <= 0) killEnemy(e);
                            }
                        }
                    }
                    break;
                }
                case 'aoe': {
                    createAoeEffect(pos, ability.color, ability.radius, 0.7);
                    for (const e of enemies) {
                        if (e.group.position.distanceTo(pos) < ability.radius) {
                            e.hp -= ability.dmg;
                            if (e.hp <= 0) killEnemy(e);
                        }
                    }
                    if (ability.pull) {
                        for (const e of enemies) {
                            if (e.group.position.distanceTo(pos) < ability.radius) {
                                const pullDir = pos.clone().sub(e.group.position).normalize();
                                e.group.position.add(pullDir.multiplyScalar(3));
                            }
                        }
                    }
                    break;
                }
                case 'beam': {
                    const beamEnd = pos.clone().add(facing.clone().multiplyScalar(ability.range));
                    createAoeEffect(beamEnd, ability.color, 1.5, 0.5);
                    for (const e of enemies) {
                        const closestPt = new THREE.Vector3();
                        const line = new THREE.Line3(pos, beamEnd);
                        line.closestPointToPoint(e.group.position, true, closestPt);
                        if (closestPt.distanceTo(e.group.position) < ability.width + 0.5) {
                            e.hp -= ability.dmg;
                            if (e.hp <= 0) killEnemy(e);
                        }
                    }
                    break;
                }
                case 'heal': {
                    healPlayer(ability.heal);
                    createAoeEffect(pos, ability.color, 3, 0.6);
                    break;
                }
                case 'shield': {
                    playerShield = ability.shield;
                    createAoeEffect(pos, ability.color, 2.5, 0.5);
                    break;
                }
                case 'buff': {
                    playerBuff = { speedMul: ability.buffSpeed || 1.5, dmgMul: ability.buffDmg || 1.5, endTime: performance
                            .now() / 1000 + ability.duration };
                    createAoeEffect(pos, ability.color, 3, 0.5);
                    break;
                }
                case 'targeted_aoe': {
                    const nearest = getNearestEnemy(pos, ability.range);
                    const targetPos = nearest ? nearest.group.position.clone() : pos.clone().add(facing.clone().multiplyScalar(
                        8));
                    createAoeEffect(targetPos, ability.color, ability.radius, 0.7);
                    for (const e of enemies) {
                        if (e.group.position.distanceTo(targetPos) < ability.radius) {
                            e.hp -= ability.dmg;
                            if (e.hp <= 0) killEnemy(e);
                        }
                    }
                    break;
                }
            }
        }

        function killEnemy(enemy) {
            createAoeEffect(enemy.group.position.clone(), enemy.type.glow, 1.5, 0.5);
            score += enemy.type.score;
            enemyGroup.remove(enemy.group);
            enemy.group.traverse(c => { if (c.geometry) c.geometry.dispose(); if (c.material) c.material.dispose(); });
            const idx = enemies.indexOf(enemy);
            if (idx >= 0) enemies.splice(idx, 1);
            enemiesRemaining--;
            updateHUD();
            if (enemiesRemaining <= 0 && waveActive) {
                waveActive = false;
                waveDelay = 2.5;
                wave++;
                waveText.textContent = `Wave ${wave} incoming...`;
            }
        }

        // ─────────────────────────────────────
        // INPUT HANDLING
        // ─────────────────────────────────────
        let joystickActive = false;
        let joystickTouchId = null;
        let joystickBasePos = { x: 0, y: 0 };
        let joystickInput = { x: 0, y: 0 };
        const JOYSTICK_MAX_R = 40;

        const abilityBtnCooldowns = [0, 0, 0];
        const abilityBtnElements = abilityBtns;

        function getTouchPos(touch) {
            return { x: touch.clientX, y: touch.clientY };
        }

        joystickZone.addEventListener('touchstart', (e) => {
            if (joystickActive) return;
            const t = e.changedTouches[0];
            joystickTouchId = t.identifier;
            joystickActive = true;
            const rect = joystickZone.getBoundingClientRect();
            joystickBasePos = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
            joystickBase.style.opacity = '1';
            joystickKnob.style.opacity = '1';
            joystickBase.style.left = '50%';
            joystickBase.style.top = '50%';
            joystickKnob.style.left = '50%';
            joystickKnob.style.top = '50%';
            joystickInput = { x: 0, y: 0 };
            e.preventDefault();
        }, { passive: false });

        window.addEventListener('touchmove', (e) => {
            if (!joystickActive || joystickTouchId === null) return;
            for (const t of e.changedTouches) {
                if (t.identifier === joystickTouchId) {
                    const dx = t.clientX - joystickBasePos.x;
                    const dy = t.clientY - joystickBasePos.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const clampedDist = Math.min(dist, JOYSTICK_MAX_R);
                    const angle = Math.atan2(dy, dx);
                    const cx = Math.cos(angle) * clampedDist;
                    const cy = Math.sin(angle) * clampedDist;
                    joystickKnob.style.left = `calc(50% + ${cx}px)`;
                    joystickKnob.style.top = `calc(50% + ${cy}px)`;
                    joystickInput = { x: cx / JOYSTICK_MAX_R, y: cy / JOYSTICK_MAX_R };
                    e.preventDefault();
                }
            }
        }, { passive: false });

        window.addEventListener('touchend', (e) => {
            for (const t of e.changedTouches) {
                if (t.identifier === joystickTouchId) {
                    joystickActive = false;
                    joystickTouchId = null;
                    joystickBase.style.opacity = '0';
                    joystickKnob.style.opacity = '0';
                    joystickKnob.style.left = '50%';
                    joystickKnob.style.top = '50%';
                    joystickInput = { x: 0, y: 0 };
                }
            }
            // Check ability buttons
            for (const t of e.changedTouches) {
                const pos = getTouchPos(t);
                abilityBtns.forEach((btn, i) => {
                    const rect = btn.getBoundingClientRect();
                    const cx = rect.left + rect.width / 2;
                    const cy = rect.top + rect.height / 2;
                    const d = Math.sqrt((pos.x - cx) ** 2 + (pos.y - cy) ** 2);
                    if (d < rect.width * 1.2) {
                        useAbility(i);
                    }
                });
                // Check entity switch dots
                document.querySelectorAll('.entity-dot').forEach(dot => {
                    const rect = dot.getBoundingClientRect();
                    const cx = rect.left + rect.width / 2;
                    const cy = rect.top + rect.height / 2;
                    const d = Math.sqrt((pos.x - cx) ** 2 + (pos.y - cy) ** 2);
                    if (d < rect.width * 1.3 && dot.dataset.key) {
                        switchEntity(dot.dataset.key);
                    }
                });
            }
        });

        window.addEventListener('touchcancel', () => {
            joystickActive = false;
            joystickTouchId = null;
            joystickBase.style.opacity = '0';
            joystickKnob.style.opacity = '0';
            joystickInput = { x: 0, y: 0 };
        });

        // Mouse support for desktop
        let mouseDown = false;
        window.addEventListener('mousedown', (e) => {
            const x = e.clientX;
            if (x < window.innerWidth * 0.4) {
                mouseDown = true;
                joystickBasePos = { x: e.clientX, y: e.clientY };
                joystickBase.style.opacity = '1';
                joystickKnob.style.opacity = '1';
                joystickBase.style.left = '50%';
                joystickBase.style.top = '50%';
                joystickInput = { x: 0, y: 0 };
            }
            // Check ability buttons
            abilityBtns.forEach((btn, i) => {
                const rect = btn.getBoundingClientRect();
                if (x >= rect.left && x <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom) {
                    useAbility(i);
                }
            });
        });
        window.addEventListener('mousemove', (e) => {
            if (!mouseDown) return;
            const dx = e.clientX - joystickBasePos.x;
            const dy = e.clientY - joystickBasePos.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const clampedDist = Math.min(dist, JOYSTICK_MAX_R);
            const angle = Math.atan2(dy, dx);
            const cx = Math.cos(angle) * clampedDist;
            const cy = Math.sin(angle) * clampedDist;
            joystickKnob.style.left = `calc(50% + ${cx}px)`;
            joystickKnob.style.top = `calc(50% + ${cy}px)`;
            joystickInput = { x: cx / JOYSTICK_MAX_R, y: cy / JOYSTICK_MAX_R };
        });
        window.addEventListener('mouseup', () => {
            mouseDown = false;
            joystickBase.style.opacity = '0';
            joystickKnob.style.opacity = '0';
            joystickInput = { x: 0, y: 0 };
        });

        // Keyboard support
        const keys = {};
        window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true;
            e.preventDefault(); });
        window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false;
            e.preventDefault(); });
        window.addEventListener('keydown', e => {
            if (e.key >= '1' && e.key <= '3') useAbility(parseInt(e.key) - 1);
            if (e.key >= '4' && e.key <= '9' && parseInt(e.key) - 4 < entityKeys.length) switchEntity(entityKeys[
                parseInt(e.key) - 4]);
        });

        function switchEntity(key) {
            if (key === currentEntityKey) return;
            currentEntityKey = key;
            buildPlayerVisual(key);
            const cfg = entityConfigs[key];
            playerMaxHp = cfg.maxHp;
            playerMaxMp = cfg.maxMp;
            playerHp = Math.min(playerHp, playerMaxHp);
            playerMp = Math.min(playerMp, playerMaxMp);
            playerShield = 0;
            playerBuff = null;
            abilityBtnCooldowns[0] = abilityBtnCooldowns[1] = abilityBtnCooldowns[2] = 0;
            entityNameDisplay.textContent = cfg.emoji + ' ' + cfg.name;
            entityNameDisplay.style.color = '#' + cfg.glowColor.toString(16).padStart(6, '0');
            updateAbilityButtonLabels();
            updateEntityDots();
            updateHUD();
            createAoeEffect(playerGroup.position.clone(), cfg.glowColor, 2, 0.4);
        }

        function updateAbilityButtonLabels() {
            const cfg = entityConfigs[currentEntityKey];
            abilityBtns.forEach((btn, i) => {
                const ab = cfg.abilities[i];
                btn.querySelector('span:first-child').textContent = ab.icon;
                btn.querySelector('.ability-label').textContent = ab.name;
                btn.style.borderColor = '#' + ab.color.toString(16).padStart(6, '0');
            });
        }

        function updateEntityDots() {
            document.querySelectorAll('.entity-dot').forEach(dot => {
                dot.classList.toggle('active', dot.dataset.key === currentEntityKey);
            });
        }

        function createEntityDots() {
            entitySwitchRow.innerHTML = '';
            entityKeys.forEach(key => {
                const cfg = entityConfigs[key];
                const dot = document.createElement('div');
                dot.className = 'entity-dot';
                dot.dataset.key = key;
                dot.textContent = cfg.emoji;
                dot.style.setProperty('--dot-glow', cfg.cardGlow);
                dot.addEventListener('pointerdown', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    switchEntity(key);
                });
                if (key === currentEntityKey) dot.classList.add('active');
                entitySwitchRow.appendChild(dot);
            });
        }
        createEntityDots();
        updateAbilityButtonLabels();
        entityNameDisplay.textContent = '👻 Ghost';
        entityNameDisplay.style.color = '#aaccff';
        updateHUD();

        // ─────────────────────────────────────
        // GAME LOOP
        // ─────────────────────────────────────
        const clock = new THREE.Clock();
        let autoAttackTimer = 0;
        const AUTO_ATTACK_INTERVAL = 0.7;

        function animate(timestamp) {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.2);
            const now = timestamp / 1000;

            // Death handling
            if (playerDead) {
                deathTimer -= dt;
                if (deathTimer <= 0) {
                    resetPlayerStats();
                    wave = Math.max(1, wave - 1);
                    clearAllEnemies();
                    waveActive = false;
                    waveDelay = 1.5;
                    waveText.textContent = `Wave ${wave}`;
                }
                updateHUD();
                // Still update effects
                updateAoeEffects(dt);
                updateProjectiles(dt);
                renderer.render(scene, camera);
                return;
            }

            // Buff check
            if (playerBuff && now > playerBuff.endTime) {
                playerBuff = null;
            }

            // Mana regen
            const cfg = entityConfigs[currentEntityKey];
            playerMp = Math.min(playerMaxMp, playerMp + cfg.mpRegen * dt);
            if (playerShield > 0 && playerBuff === null) playerShield = Math.max(0, playerShield - dt * 3);

            // Ability cooldowns
            for (let i = 0; i < 3; i++) {
                if (abilityBtnCooldowns[i] > 0) {
                    abilityBtnCooldowns[i] -= dt;
                    if (abilityBtnCooldowns[i] < 0) abilityBtnCooldowns[i] = 0;
                    abilityBtns[i].classList.toggle('on-cooldown', abilityBtnCooldowns[i] > 0);
                }
            }

            // Keyboard input
            let kx = 0,
                ky = 0;
            if (keys['w'] || keys['arrowup']) ky += 1;
            if (keys['s'] || keys['arrowdown']) ky -= 1;
            if (keys['a'] || keys['arrowleft']) kx -= 1;
            if (keys['d'] || keys['arrowright']) kx += 1;
            const kLen = Math.sqrt(kx * kx + ky * ky);
            if (kLen > 1) { kx /= kLen;
                ky /= kLen; }
            if (kLen > 0.1) { joystickInput.x = kx;
                joystickInput.y = ky; } else if (!joystickActive && !mouseDown && kLen < 0.05) {
                joystickInput.x *= 0.85;
                joystickInput.y *= 0.85;
            }

            // Player movement
            const camForward = new THREE.Vector3();
            camera.getWorldDirection(camForward);
            camForward.y = 0;
            camForward.normalize();
            const camRight = new THREE.Vector3().crossVectors(camForward, new THREE.Vector3(0, 1, 0)).normalize();
            const moveDir = new THREE.Vector3()
                .addScaledVector(camForward, -joystickInput.y)
                .addScaledVector(camRight, joystickInput.x);
            const moveLen = moveDir.length();
            if (moveLen > 1) moveDir.normalize();
            const speed = cfg.speed * (playerBuff ? playerBuff.speedMul : 1);
            const velocity = moveDir.multiplyScalar(speed * moveLen);
            const newPos = playerGroup.position.clone().add(velocity.clone().multiplyScalar(dt));
            newPos.x = THREE.MathUtils.clamp(newPos.x, -WORLD_SIZE / 2 + 1.5, WORLD_SIZE / 2 - 1.5);
            newPos.z = THREE.MathUtils.clamp(newPos.z, -WORLD_SIZE / 2 + 1.5, WORLD_SIZE / 2 - 1.5);
            newPos.y = 0.5;
            let blocked = false;
            for (const ob of obstacleData) {
                const dx = newPos.x - ob.x;
                const dz = newPos.z - ob.z;
                if (Math.sqrt(dx * dx + dz * dz) < ob.radius + 0.55) { blocked = true; break; }
            }
            if (!blocked) playerGroup.position.copy(newPos);
            if (moveLen > 0.15) {
                playerFacing.copy(moveDir.normalize());
                const targetAngle = Math.atan2(playerFacing.x, playerFacing.z);
                playerGroup.rotation.y = THREE.MathUtils.lerp(playerGroup.rotation.y, targetAngle, dt * 10);
            }

            // Auto-attack
            autoAttackTimer -= dt;
            if (autoAttackTimer <= 0) {
                const nearest = getNearestEnemy(playerGroup.position, 11);
                if (nearest) {
                    autoAttackTimer = AUTO_ATTACK_INTERVAL;
                    const dir = nearest.group.position.clone().sub(playerGroup.position).normalize();
                    const origin = playerGroup.position.clone().add(new THREE.Vector3(0, 0.7, 0)).add(dir.clone().multiplyScalar(
                        0.5));
                    const dmg = 8 * (playerBuff ? playerBuff.dmgMul : 1);
                    createProjectile(origin, dir, { color: cfg.glowColor, dmg, speed: 16, size: 0.15 }, true);
                }
            }

            // Update player particles
            if (playerParticleSystem && playerParticleData.length > 0) {
                const pPos = playerParticleSystem.geometry.attributes.position.array;
                for (let i = 0; i < playerParticleData.length; i++) {
                    const pd = playerParticleData[i];
                    const angle = pd.baseTh + now * pd.speed;
                    const r = pd.baseR + Math.sin(now * 3 + pd.phase) * 0.3;
                    pPos[i * 3] = Math.sin(pd.basePh) * Math.cos(angle) * r;
                    pPos[i * 3 + 1] = Math.sin(pd.basePh) * Math.sin(angle) * r;
                    pPos[i * 3 + 2] = Math.cos(pd.basePh) * r;
                }
                playerParticleSystem.geometry.attributes.position.needsUpdate = true;
                const ci = Math.floor(now * 0.6) % cfg.particleColors.length;
                playerParticleSystem.material.color.set(cfg.particleColors[ci]);
            }
            if (coreGlowMesh) {
                const pulse = 1 + Math.sin(now * 3) * 0.08;
                coreGlowMesh.scale.setScalar(pulse);
            }
            playerLight.position.copy(playerGroup.position).add(new THREE.Vector3(0, 2, 0));
            playerLight.color.set(cfg.glowColor);
            playerLight.intensity = 12 + Math.sin(now * 2) * 3;

            // Camera follow
            const camTarget = playerGroup.position.clone().add(new THREE.Vector3(0, 1.5, 0));
            const camOffset = playerFacing.clone().multiplyScalar(-7).add(new THREE.Vector3(0, 5.5, 0));
            const desiredCamPos = camTarget.clone().add(camOffset);
            camera.position.lerp(desiredCamPos, dt * 3.5);
            camera.lookAt(camTarget);

            // Update projectiles
            updateProjectiles(dt);

            // Update AoE effects
            updateAoeEffects(dt);

            // Enemy AI
            for (const e of enemies) {
                const toPlayer = playerGroup.position.clone().sub(e.group.position);
                const dist = toPlayer.length();
                toPlayer.normalize();
                if (dist > 1.2) {
                    const moveSpeed = e.speed * dt;
                    const desired = e.group.position.clone().add(toPlayer.clone().multiplyScalar(moveSpeed));
                    let eBlocked = false;
                    for (const ob of obstacleData) {
                        const dx = desired.x - ob.x;
                        const dz = desired.z - ob.z;
                        if (Math.sqrt(dx * dx + dz * dz) < ob.radius + e.type.size * 0.9) { eBlocked = true; break; }
                    }
                    if (!eBlocked) {
                        e.group.position.copy(desired);
                        e.stuckTimer = 0;
                    } else {
                        e.stuckTimer += dt;
                        if (e.stuckTimer > 0.8) {
                            e.stuckDir += (Math.random() - 0.5) * 1.5;
                            e.stuckTimer = 0;
                        }
                        const strafe = new THREE.Vector3(Math.cos(e.stuckDir), 0, Math.sin(e.stuckDir)).multiplyScalar(
                            moveSpeed * 0.6);
                        const altPos = e.group.position.clone().add(strafe);
                        altPos.x = THREE.MathUtils.clamp(altPos.x, -WORLD_SIZE / 2 + 2, WORLD_SIZE / 2 - 2);
                        altPos.z = THREE.MathUtils.clamp(altPos.z, -WORLD_SIZE / 2 + 2, WORLD_SIZE / 2 - 2);
                        e.group.position.copy(altPos);
                    }
                }
                e.group.position.y = e.type.size * 0.9;
                e.group.lookAt(playerGroup.position);
                // Attack
                e.attackCooldown -= dt;
                if (dist < 1.8 && e.attackCooldown <= 0) {
                    e.attackCooldown = 1.3 + Math.random() * 0.5;
                    damagePlayer(e.dmg);
                    createAoeEffect(playerGroup.position.clone().add(new THREE.Vector3(0, 0.5, 0)), 0xff3333, 1, 0.3);
                }
                // Update eye glow
                e.eye.material.opacity = 0.5 + Math.sin(now * 6 + e.group.position.x) * 0.4;
            }

            // Wave management
            if (!waveActive && enemies.length === 0) {
                waveDelay -= dt;
                if (waveDelay <= 0) {
                    spawnWave(wave);
                    waveDelay = 999;
                }
            }

            // Update HUD periodically
            updateHUD();
            starfield.rotation.y += dt * 0.015;

            renderer.render(scene, camera);
        }

        function updateProjectiles(dt) {
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                p.mesh.position.add(p.dir.clone().multiplyScalar(p.speed * dt));
                p.lifetime -= dt;
                if (p.lifetime <= 0) {
                    removeProjectile(i);
                    continue;
                }
                // Check collision with enemies (player projectiles)
                if (p.isPlayer) {
                    for (const e of enemies) {
                        if (p.chain && p.chained.includes(e)) continue;
                        if (p.mesh.position.distanceTo(e.group.position) < 1.0) {
                            const dmg = p.dmg * (playerBuff ? playerBuff.dmgMul : 1);
                            e.hp -= dmg;
                            createAoeEffect(p.mesh.position.clone(), p.color, 0.6, 0.25);
                            if (e.hp <= 0) killEnemy(e);
                            if (p.chain && p.chained.length < p.chain) {
                                p.chained.push(e);
                                const nextEnemy = getNearestEnemy(p.mesh.position, 8);
                                if (nextEnemy && !p.chained.includes(nextEnemy)) {
                                    p.dir = nextEnemy.group.position.clone().sub(p.mesh.position).normalize();
                                    p.lifetime = Math.max(p.lifetime, 0.6);
                                } else { removeProjectile(i); break; }
                            } else if (p.explosive) {
                                for (const e2 of enemies) {
                                    if (p.mesh.position.distanceTo(e2.group.position) < p.explodeRadius) {
                                        e2.hp -= p.dmg * 0.7;
                                        if (e2.hp <= 0) killEnemy(e2);
                                    }
                                }
                                createAoeEffect(p.mesh.position.clone(), p.color, p.explodeRadius, 0.5);
                                removeProjectile(i);
                                break;
                            } else { removeProjectile(i); break; }
                        }
                    }
                }
                // Boundary check
                if (Math.abs(p.mesh.position.x) > WORLD_SIZE / 2 || Math.abs(p.mesh.position.z) > WORLD_SIZE / 2) {
                    removeProjectile(i);
                }
            }
        }

        function removeProjectile(index) {
            const p = projectiles[index];
            projectileGroup.remove(p.mesh);
            p.mesh.geometry.dispose();
            p.mesh.material.dispose();
            projectiles.splice(index, 1);
        }

        function updateAoeEffects(dt) {
            for (let i = aoeEffects.length - 1; i >= 0; i--) {
                const e = aoeEffects[i];
                e.elapsed += dt;
                const progress = e.elapsed / e.duration;
                e.material.opacity = Math.max(0, 0.8 * (1 - progress));
                e.mesh.scale.setScalar(1 + progress * 2);
                if (progress >= 1) {
                    scene.remove(e.mesh);
                    e.mesh.geometry.dispose();
                    e.material.dispose();
                    aoeEffects.splice(i, 1);
                }
            }
        }

        // ─────────────────────────────────────
        // STARTUP
        // ─────────────────────────────────────
        spawnWave(1);
        waveDelay = 999;
        updateHUD();

        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        requestAnimationFrame(animate);

        console.log('🕯️✨ Paranormal RPG Ready! ✨🕯️');
        console.log('👻 Choose your entity | 🕹️ Joystick to move | 🔮 Tap ability buttons');
        console.log('💀 Defeat shadow creatures | 🌟 Survive the waves');
        console.log('Desktop: WASD move | 1-3 abilities | 4-9 switch entities');
    </script>
</body>
</html>
