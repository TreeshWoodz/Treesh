    <body>
    
    <div id="lyrics">
        
    </div>

<form>
    <textarea id="input"></textarea>
    <button type="button" id="addLyrics">Add Lyrics</button>
    
    <input id="audioUploader" type="file" accept="audio/*">
    
    <button type="button" id="play" data-file="none">Play</button>
    <audio id="player" controls></audio>
    
    <button type="button" id="set">Set Time</button>
  <button type="button" id="unset">Unset</button>
    <button type="button" id="sync">Sync</button>
    
    <button type="button" id="new">New</button>
</form>

<script>
  $(document).ready(function() {

    var input = $("#input");
    var lyrics = $("#lyrics");
    

    // load saved lyrics including <p> and <br>
    var savedLyricsData = localStorage.getItem("lyricsData");
    if (savedLyricsData) {
        var data = JSON.parse(savedLyricsData);
        for (var i = 0; i < data.length; i++) {
            var item = data[i];
            if (item.type === "p") {
                lyrics.append('<p class="' + item.classes + '">' + item.text + '</p>');
            } else if (item.type === "br") {
                lyrics.append("<br>");
            }
        }
    }

    // save lyrics + classes + span content + <br>
    function saveLyrics() {
        var lyricsData = [];
        $("#lyrics").contents().each(function() {
            if (this.nodeType === 1) { // element node
                lyricsData.push({
                    type: this.tagName.toLowerCase(),
                    text: $(this).html(),
                    classes: $(this).attr("class") || ""
                });
            }
        });
        localStorage.setItem("lyricsData", JSON.stringify(lyricsData));
    }
    
    
    if ( $("#lyrics p.set").length ) {
        $("#unset").show();
      } else {
        $("#unset").hide();
      }
    
    
    

$("#addLyrics").on("click", function(e) {
    var value = input.val();
    if (!value) return;

    // normalize line breaks (\r\n, \r, \n) → \n
    value = value.replace(/\r\n/g, "\n").replace(/\r/g, "\n");

    // split into lines
    var lines = value.split("\n");

    lines.forEach(function(line) {
        line = line.trim();
        if (line !== "") {
            $("<p data-minutes></p>").text(line).appendTo(lyrics);
        } else {
            lyrics.append("<br>");
        }
    });

    saveLyrics();
    input.val("");
    e.preventDefault();

    // scroll to bottom
    lyrics.scrollTop(lyrics[0].scrollHeight);
});



    $("form").on("submit", function(e) {
        e.preventDefault();
    });

    let db;
    let player = document.getElementById("player");

    let request = indexedDB.open("audioDB", 1);

    request.onupgradeneeded = function(e) {
        db = e.target.result;
        db.createObjectStore("files");
    };

    request.onsuccess = function(e) {
        db = e.target.result;
        loadSavedAudio();
    };

    document.getElementById("audioUploader").addEventListener("change", function(e) {
        let file = e.target.files[0];
        if (!file) return;

        let tx = db.transaction("files", "readwrite");
        let store = tx.objectStore("files");
        store.put(file, "savedAudio");

        let url = URL.createObjectURL(file);
        player.src = url;
        player.hidden = false;
        localStorage.setItem("audioReady", "true");
    });

    function loadSavedAudio() {
        let ready = localStorage.getItem("audioReady");
        if (!ready) return;

        let tx = db.transaction("files", "readonly");
        let store = tx.objectStore("files");
        let getReq = store.get("savedAudio");

        getReq.onsuccess = function(e) {
            let file = e.target.result;
            if (file) {
                let url = URL.createObjectURL(file);
                player.src = url;
                player.hidden = false;
                document.getElementById("play").dataset.file = "ready";
            }
        };
    }

document.getElementById("play").addEventListener("click", function() {
    if (!player.src) {
        alert("Upload an audio file first!");
        return;
    }

    var startTime = 0; // default to beginning

    var selectedP = $("#lyrics p.selected");

    if (selectedP.length) {
        // get previous <p> with a span
        var prevP = selectedP.prevAll("p").filter(function() {
            return $(this).find("span").length && $(this).find("span").text().trim() !== "";
        }).first();

        if (prevP.length) {
            var timeText = prevP.find("span").text().trim();
            var parts = timeText.split(/[:.]/);
            if (parts.length === 3) {
                startTime = parseInt(parts[0], 10) * 60 
                          + parseInt(parts[1], 10) 
                          + parseInt(parts[2], 10) / 100;
            }
        }
        // if no previous p has span, startTime stays 0
    }

    player.currentTime = startTime;
    player.play();

    // sync highlighting
    function syncLyrics() {
        var current = player.currentTime;
        $("#lyrics p").removeClass("sync");

        $("#lyrics p").each(function() {
            var $this = $(this);
            var spanText = $this.find("span").text().trim();
            if (!spanText) return;

            var parts = spanText.split(/[:.]/);
            var start = parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10) + parseInt(parts[2], 10) / 100;

            var nextP = $this.next("p");
            var end = Number.POSITIVE_INFINITY;
            if (nextP.length && nextP.find("span").text().trim() !== "") {
                var nextParts = nextP.find("span").text().trim().split(/[:.]/);
                end = parseInt(nextParts[0], 10) * 60 + parseInt(nextParts[1], 10) + parseInt(nextParts[2], 10) / 100;
            }

            if (current >= start && current < end) {
                $this.addClass("sync");
                return false;
            }
        });
    }

    player.addEventListener("timeupdate", syncLyrics);
});

    $("#lyrics").on("click", "p", function() {
        var $this = $(this);

        if (!$this.hasClass("set")) {
            $this.addClass("selected").siblings().removeClass("selected");

            if ($this.find("span").length === 0) {
                $this.append(" <span></span>");
            }
        } else {
          if ( !$(this).hasClass("unset") ) {
            $(this).addClass("unset");
          } else {
            $(this).removeClass("unset");
          }
        }
    });

    function formatTime(time) {
        var minutes = Math.floor(time / 60);
        var seconds = Math.floor(time % 60);
        var milliseconds = Math.floor((time % 1) * 100);

        var m = ("0" + minutes).slice(-2);
        var s = ("0" + seconds).slice(-2);
        var ms = ("0" + milliseconds).slice(-2);

        return m + ":" + s + "." + ms;
    }

    function updateSelected() {
        var current = formatTime(player.currentTime);

        $("#lyrics p").each(function() {
            var $p = $(this);
            var spanTime = $p.find("span").text();

            if ($p.hasClass("selected") && !$p.hasClass("set")) {
                $p.find("span").text(current);
            }

            if (spanTime === current) {
                $p.addClass("selected").siblings().removeClass("selected");
            }
        });
    }

    player.addEventListener("timeupdate", updateSelected);
    player.addEventListener("seeking", updateSelected);

    $("#set").click(function() {
        $("#lyrics p.selected").addClass("set").removeClass("selected").next("p").addClass("selected");

        if ($("#lyrics p.selected").find("span").length === 0) {
            $("#lyrics p.selected").append(" <span></span>");
        }
      
      if ( $("#lyrics p.set").length ) {
        $("#unset").show();
      } else {
        $("#unset").hide();
      }

        saveLyrics();
    });

    $("#new").click(function() {
        $("#lyrics").empty();
        localStorage.removeItem("lyricsData");
        $("#player").attr("src", "").hide();
        localStorage.removeItem("audioReady");
        $("#input").val("");
    });
    
    $("#sync").click(function() {
       $("#lyrics p").removeClass("selected unset");
      
      $("#lyrics").scrollTop(0);
      
       player.currentTime.fromStart;
      
      $("#play").click();
        
    });
    
    $("#lyrics p.selected").removeClass("selected");
    
    
    $("#lyrics p").each(function() {
      if ( !$(this).hasClass("set") ) {
        $(this).find("span").remove();
      }
      
      if ( $(this).hasClass("sync") ) {
        $(this).removeClass("sync");
      }
    });
    
    
    $("#unset").click(function() {
      $("#lyrics p.unset").removeClass("unset set sync").find("span").remove();
      
      saveLyrics();
    });

});


</script>
  
</body>
