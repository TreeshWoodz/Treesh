<script>
  $(document).ready(function() {

    var input = $("#input");
    var lyrics = $("#lyrics");
    

    // load saved lyrics including <p> and <br>
  var savedLyricsData = localStorage.getItem("lyricsData");
if (savedLyricsData) {
    var data = JSON.parse(savedLyricsData);
    var textContent = "";

    for (var i = 0; i < data.length; i++) {
        var item = data[i];

        if (item.type === "p") {
            var $classes = item.classes || "";
            var hasSet = $classes.split(" ").includes("set");

            var spanMatch = item.text.match(/<span[^>]*>(.*?)<\/span>/);
            var spanText = spanMatch ? spanMatch[1].trim() : "";

            // remove brackets from spanText (so we can rebuild with brackets)
            spanText = spanText.replace(/^\[|\]$/g, "").trim();

            // remove span from text to get lyric text only
            var lyricText = item.text.replace(/<span[^>]*>.*?<\/span>/g, "").trim();

            // skip completely empty lines
            if (spanText === "" && lyricText === "") continue;

            // rebuild <p> content in #lyrics
            var newPText = "<span>" + (spanText ? spanText : "") + "</span> " + lyricText;
            lyrics.append('<p class="' + $classes + '">' + newPText + '</p>'); 

            // add to textarea with * if set
            var lineOutput = "";
            if (hasSet) lineOutput += "*";
            if (spanText) lineOutput += "[" + spanText + "] ";
            lineOutput += lyricText;

            textContent += lineOutput + "\n";

        } else if (item.type === "br") {
            lyrics.append("<br>");
            textContent += "\n";
        }
    }

    $("#input").val(textContent.trim());
}





    // save lyrics + classes + span content + <br>
    function saveLyrics() {
        var lyricsData = [];
        $("#lyrics").contents().each(function() {
            if (this.nodeType === 1) { // element node
                lyricsData.push({
                    type: this.tagName.toLowerCase(),
                    text: $(this).html(),
                    classes: $(this).attr("class") || ""
                });
            }
        });
        localStorage.setItem("lyricsData", JSON.stringify(lyricsData));
    }



    $("form").on("submit", function(e) {
        e.preventDefault();
    });

    let db;
    let player = document.getElementById("player");

    let request = indexedDB.open("audioDB", 1);

    request.onupgradeneeded = function(e) {
        db = e.target.result;
        db.createObjectStore("files");
    };

    request.onsuccess = function(e) {
        db = e.target.result;
        loadSavedAudio();
    };

    document.getElementById("audioUploader").addEventListener("change", function(e) {
        let file = e.target.files[0];
        if (!file) return;

        let tx = db.transaction("files", "readwrite");
        let store = tx.objectStore("files");
        store.put(file, "savedAudio");

        let url = URL.createObjectURL(file);
        player.src = url;
        player.hidden = false;
        localStorage.setItem("audioReady", "true");
    });

    function loadSavedAudio() {
        let ready = localStorage.getItem("audioReady");
        if (!ready) return;

        let tx = db.transaction("files", "readonly");
        let store = tx.objectStore("files");
        let getReq = store.get("savedAudio");

        getReq.onsuccess = function(e) {
            let file = e.target.result;
            if (file) {
                let url = URL.createObjectURL(file);
                player.src = url;
                player.hidden = false;
                document.getElementById("play").dataset.file = "ready";
            }
        };
    }

document.getElementById("play").addEventListener("click", function() {
    if (!player.src) {
        alert("Upload an audio file first!");
        return;
    }

    var startTime = 0; // default to beginning
    var selectedP = $("#lyrics p.selected");

    if (selectedP.length) { 
        // get previous <p> with a span
        var prevP = selectedP.prevAll("p").filter(function() {
            return $(this).find("span").length && $(this).find("span").text().trim() !== "";
        }).first();

        if (prevP.length) {
            var timeText = prevP.find("span").text().trim();
            var parts = timeText.split(/[:.]/);
            if (parts.length === 3) {
                startTime = parseInt(parts[0], 10) * 60 
                          + parseInt(parts[1], 10) 
                          + parseInt(parts[2], 10) / 100; 
            }
        }
    }

    if ( $("#lyrics p").hasClass("unset") && $("#lyrics p").hasClass("clicked") ) {
      player.currentTime = $("#lyrics p.unset.clicked span").text();
    } else {
      player.currentTime = startTime;
    }
  
  
    player.play();

    function parseTimeString(s) {
        if (!s) return NaN;
        var m = s.replace(/^\s+|\s+$/g, "").match(/(\d+):(\d+)(?:\.(\d+))?/);
        if (!m) return NaN;
        var min = parseInt(m[1], 10);
        var sec = parseInt(m[2], 10);
        var frac = m[3] ? parseFloat("0." + m[3]) : 0;
        return min * 60 + sec + frac;
    }

    function getTimeFromP($p) {
        var spanText = $p.find("span").text().trim();
        if (spanText) return parseTimeString(spanText.replace(/[\[\]]/g, ""));
        var text = $p.text().trim();
        var brackMatch = text.match(/^\[?(\d+:\d+(?:\.\d+)?)\]?/);
        if (brackMatch) return parseTimeString(brackMatch[1]);
        return NaN;
    }

    function syncLyrics() {
        var current = player.currentTime;
        $("#lyrics p").removeClass("sync");

        $("#lyrics p").each(function() {
            var $this = $(this);
            var start = getTimeFromP($this);
            if (isNaN(start)) return;

            var nextP = $this.next("p");
            var end = Number.POSITIVE_INFINITY;
            if (nextP.length) {
                var nextTime = getTimeFromP(nextP);
                if (!isNaN(nextTime)) end = nextTime;
            }

            if (current >= start && current < end) {
                $this.addClass("sync");

                // only update timestamp if not 'set'
                if (!$this.hasClass("set") && $this.hasClass("selected")) {
                    var lyricText = $this.clone().children("span").remove().end().text().trim();
                    $this.find("span").html("[" + formatTime(current) + "]");
                }
                return false; // break loop
            }
        });
    }

    function formatTime(time) {
        var minutes = Math.floor(time / 60);
        var seconds = Math.floor(time % 60);
        var milliseconds = Math.floor((time % 1) * 100);

        var m = ("0" + minutes).slice(-2);
        var s = ("0" + seconds).slice(-2);
        var ms = ("0" + milliseconds).slice(-2);

        return m + ":" + s + "." + ms;
    }

    player.addEventListener("timeupdate", syncLyrics);
});

    

    $("#lyrics").on("click", "p", function() {
        var $this = $(this);
      
      $this.addClass("clicked").siblings().removeClass("clicked");
      
      if ( $(this).hasClass("set") ) {
        $("#set").text("Unset Time");
        $("#lyrics p").removeClass("selected");
      } else {
        $("#set").text("Set Time");
        $this.addClass("selected").siblings().removeClass("selected");
      }
    });

    function formatTime(time) {
        var minutes = Math.floor(time / 60);
        var seconds = Math.floor(time % 60);
        var milliseconds = Math.floor((time % 1) * 100); 

        var m = ("0" + minutes).slice(-2);
        var s = ("0" + seconds).slice(-2);
        var ms = ("0" + milliseconds).slice(-2);

        return m + ":" + s + "." + ms;
    }

    function updateSelected() {
        var current = formatTime(player.currentTime);

        $("#lyrics p").each(function() {
            var $p = $(this);
            var spanTime = $p.find("span").text();

            if ($p.hasClass("selected") && !$p.hasClass("set")) {
                $p.find("span").text("[" + current + "]");
            }

            if (spanTime === current) {
                $p.addClass("selected").siblings().removeClass("selected");
            }
        });
    }

    player.addEventListener("timeupdate", updateSelected);
    player.addEventListener("seeking", updateSelected);

    $("#set").click(function() {
      if ( $(this).text() === "Set Time" ) {
    if (!player.paused && !player.ended && player.currentTime > 0) { // only if audio is playing
        $("#lyrics p.selected")
            .addClass("set")
            .removeClass("selected")
            .next("p")
            .addClass("selected");
      
    }
        } else {
          $("#lyrics p.clicked.set").removeClass("set clicked");
        }

        saveLyrics();
});


    $("#new").click(function() {
        $("#lyrics").empty();
        localStorage.removeItem("lyricsData");
        $("#player").attr("src", "").hide();
        localStorage.removeItem("audioReady");
        $("#input").val("");
      location.reload(true);
    });
    
    $("#refresh").click(function() {
      location.reload(true);
    });
    
    $("#lyrics p").removeClass("clicked sync selected");
    
    $("#lyrics p").each(function() {
    var $p = $(this);
    var text = $p.html().trim(); // use html in case there are existing spans

    // match either [00:00.00] or 00:00.00 at start of line
    var match = text.match(/^\[?\d{2}:\d{2}\.\d{2}\]?/);
    if (match) {
        var timestamp = match[0];

        // ensure brackets
        if (!timestamp.startsWith("[")) timestamp = "[" + timestamp + "]";

        // replace first occurrence with <span>[timestamp]</span>
        text = text.replace(match[0], "<span>" + timestamp + "</span>");
        $p.html(text);
    } else {
        // ensure at least an empty span exists
        if ($p.find("span").length === 0) {
            $p.prepend("<span></span> ");
        }
    }
});
    
    
 $("#next").click(function() {

        // Next → input to lyrics
        $("#text").hide();
        $("#lyrics").show();
        $(this).text("Back");
        $("button[for='lyrics']").removeClass("inactive");

            var match = line.match(/^(\[?\d{2}:\d{2}\.\d{2}\]?)(.*)/);

                timestamp = match[1];
                text = match[2].trim();
                if (!timestamp.startsWith("[")) timestamp = "[" + timestamp + "]";
            }

            if (this.tagName === "P") {
                var $p = $(this);
                if (timestamp) $p.html("<span>" + timestamp + "</span> " + text);
                else $p.html("<span></span> " + text);

                if (isSet) $p.addClass("set"); // apply class only
            } else if (this.tagName === "BR") {
                if (line !== "") {
                    var $p = $('<p data-minutes></p>');
                    if (timestamp) $p.html("<span>" + timestamp + "</span> " + text);
                    else $p.html("<span></span> " + text);

                    if (isSet) $p.addClass("set");
                    $(this).replaceWith($p);
                }
            }
        });

        // append extra lines if input is longer
        if (lines.length > $("#lyrics p, #lyrics br").length) {
            for (var i = $("#lyrics p, #lyrics br").length; i < lines.length; i++) {

                    isSet = true;
                    line = line.slice(1).trim();
                }
                if (line === "") {
                    $("#lyrics").append("<br>");
                    continue;
                }
                var match = line.match(/^(\[?\d{2}:\d{2}\.\d{2}\]?)(.*)/);
                var timestamp = "";
                var text = line;
                if (match) {
                    timestamp = match[1];
                    text = match[2].trim();
                    if (!timestamp.startsWith("[")) timestamp = "[" + timestamp + "]";
                }
                var $p = $('<p data-minutes></p>');
                if (timestamp) $p.html("<span>" + timestamp + "</span> " + text);
                else $p.html("<span></span> " + text);

                if (isSet) $p.addClass("set");
                $("#lyrics").append($p);
            }
        }

    } else {
        // Back → input to textarea
$("#text").show();
$("#lyrics").hide();
$(this).text("Next");
$("button[for='lyrics']").addClass("inactive");

var inputText = "";
$("#lyrics").contents().each(function() {
    if (this.nodeType === 1) {
        if (this.tagName === "P") {
            var $p = $(this);
            var spanText = $p.find("span").text().trim(); // timestamp including brackets
            var lineText = $p.clone().children("span").remove().end().text().trim(); // lyric text only

            // prepend * before timestamp if 'set'
            var lineOutput = "";
            if ($p.hasClass("set")) lineOutput += "*";
            if (spanText) lineOutput += spanText + " ";
            lineOutput += lineText;

            inputText += lineOutput + "\n";

        } else if (this.tagName === "BR") inputText += "\n";
    }
});
$("#input").val(inputText);

    }
});





    
    $("#save").click(function() {
      saveLyrics();
    });

    
    $("#input").on("keyup", function() {
    var lines = $(this).val().split("\n");
    var $lyrics = $("#lyrics");
    var existing = $lyrics.contents(); // existing <p> and <br>

    lines.forEach(function(line, i) {
        line = line.trim();
        var $el = existing.eq(i);

        if (line === "") {
            // empty line → <br>
            if ($el.length && $el[0].tagName === "BR") {
                // already a <br>, do nothing
            } else if ($el.length && $el[0].tagName === "P") {
                // replace <p> with <br>, keep the next <p> untouched
                $el.replaceWith("<br>");
            } else {
                // append new <br>
                $lyrics.append("<br>");
            }
        } else {
            // non-empty line → <p>
            if ($el.length && $el[0].tagName === "P") {
                // update text but keep existing classes
                var classes = $el.attr("class") || "";
                $el.html("<span></span> " + line); // DO NOT reassign classes here
            } else if ($el.length && $el[0].tagName === "BR") {
                // replace <br> with new <p> without touching next <p>
                var $newP = $("<p data-minutes></p>").html("<span></span> " + line);
                $newP.insertBefore($el);
                $el.remove();
            } else {
                // append new <p>
                $("<p data-minutes></p>").html("<span></span> " + line).appendTo($lyrics);
            }
        }
    });

    // remove any extra old elements if input lines are shorter
    if (existing.length > lines.length) {
        existing.slice(lines.length).remove();
    }

    saveLyrics();
});


    
    
    
    $("#next-line").click(function() {
  if (!$(this).hasClass("inactive")) {
    let $selected = $("#lyrics p.selected");

    if (!$selected.length) {
      $selected = $("#lyrics p:eq(0)").addClass("selected");
      
      if ($selected.find("span").length === 0) {
                $this.prepend(" <span></span> ");
            }
    } else {
      $selected
        .removeClass("selected")
        .nextAll("p").first()
        .addClass("selected")
        .siblings().removeClass("selected");
      $selected = $("#lyrics p.selected"); // update reference
      
      if ($selected.find("span").length === 0) {
                $this.prepend(" <span></span> ");
            }
    }
    

    // Scroll container if selected p is below visible area
    let container = $("#lyrics");
    let selectedTop = $selected.position().top; // relative to container
    let selectedBottom = selectedTop + $selected.outerHeight();
    let containerHeight = container.height();
    let scrollTop = container.scrollTop();

    if (selectedBottom > containerHeight) {
      container.scrollTop(scrollTop + selectedBottom - containerHeight + 5); // +5 for padding
    } else if (selectedTop < 0) {
      container.scrollTop(scrollTop + selectedTop - 5); // scroll up if above 
    }
  }
});

    $("#lyrics").hide();
    
    if ($("#lyrics").css("display") === "none") {
    $("button[for='lyrics']").addClass("inactive");
      }
    
    
    $("#clear-time").click(function() {
      $("#lyrics p.clicked:not(.set) span").text("");
    });
    
    
    $("#download").click(function() {
    var output = "";
    var lastWasBR = false;

    $("#lyrics").contents().each(function() {
        if (this.nodeType === 1) { // element node
            if (this.tagName === "P") {
                var $p = $(this);
                var spanText = $p.find("span").text().trim();
                spanText = spanText.replace(/^\[|\]$/g, "");

                var text = $p.clone().find("span").remove().end().text().trim();

                var pTag = "<p";
                if (spanText) pTag += ' data-minutes="' + spanText + '"';
                pTag += ">" + text + "</p>";

                output += pTag + "\n";
                lastWasBR = false;

            } else if (this.tagName === "BR") {
                if (!lastWasBR) { // prevent double <br>
                    output += "<br>\n";
                    lastWasBR = true;
                }
            }
        }
    });

    // remove trailing <br> at the end
    output = output.replace(/(<br>\s*)+$/i, "");

    navigator.clipboard.writeText(output).then(function() {
        console.log("Lyrics copied!");
    }).catch(function(err) {
        console.error("Failed to copy: ", err);
    });
});
