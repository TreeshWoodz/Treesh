<script>
function saveMetadata() {

  $("#metadata").find("input").each(function() {

  $(document).ready(function() {
                                 
          var savedMetadata = localStorage.getItem("metadata");

  if (savedMetadata) {
    var metadata = JSON.parse(savedMetadata);
  
    $("#metadata").find("input[type=text]").each(function() {
      var placeholder = $(this).attr("placeholder");

    var input = $("#input");
    var lyrics = $("#lyrics");
    

    // load saved lyrics including <p> and <br>
  var savedLyricsData = localStorage.getItem("lyricsData");
if (savedLyricsData) {
    var data = JSON.parse(savedLyricsData);
    var textContent = "";

    for (var i = 0; i < data.length; i++) {
        var item = data[i];

        if (item.type === "p") {
            var $classes = item.classes || "";
            var hasSet = $classes.split(" ").includes("set");

            var spanMatch = item.text.match(/<span[^>]*>(.*?)<\/span>/);
            var spanText = spanMatch ? spanMatch[1].trim() : "";

            // remove brackets from spanText (so we can rebuild with brackets)
            spanText = spanText.replace(/^\[|\]$/g, "").trim();

            // remove span from text to get lyric text only
            var lyricText = item.text.replace(/<span[^>]*>.*?<\/span>/g, "").trim();

            // skip completely empty lines
            if (spanText === "" && lyricText === "") continue;

            // rebuild <p> content in #lyrics
            var newPText = "<span>" + (spanText ? spanText : "") + "</span> " + lyricText;
            lyrics.append('<p class="' + $classes + '">' + newPText + '</p>'); 

            // add to textarea with * if set
            var lineOutput = "";
            if (hasSet) lineOutput += "*";
            if (spanText) lineOutput += "[" + spanText + "] ";
            lineOutput += lyricText;

            textContent += lineOutput + "\n";

        } else if (item.type === "br") {
            lyrics.append("<br>");
            textContent += "\n";
        }
    }

    $("#input").val(textContent.trim());
}





    // save lyrics + classes + span content + <br>
    function saveLyrics() {
        var lyricsData = [];
        $("#lyrics").contents().each(function() {
            if (this.nodeType === 1) { // element node
                lyricsData.push({
                    type: this.tagName.toLowerCase(),
                    text: $(this).html(),
                    classes: $(this).attr("class") || "" 
                });
            }
        });
        localStorage.setItem("lyricsData", JSON.stringify(lyricsData));
    }
 


    $("form").on("submit", function(e) {
        e.preventDefault();
    });

    let db;
    let player = document.getElementById("player");

    let request = indexedDB.open("audioDB", 1);

    request.onupgradeneeded = function(e) {
        db = e.target.result;
        db.createObjectStore("files");
    };

    request.onsuccess = function(e) {
        db = e.target.result;
        loadSavedAudio();
    };

    document.getElementById("audioUploader").addEventListener("change", function(e) {
        let file = e.target.files[0];
        if (!file) return;

        let tx = db.transaction("files", "readwrite");
        let store = tx.objectStore("files");
        store.put(file, "savedAudio");
        
      $("#audio-btn").attr("data-status", "play").html('<i class="fa-solid fa-play"></i>');
      
      if ($("#lyrics").css("display") === "block") {
      $("#next-line").removeClass("inactive");
        }
      
        let url = URL.createObjectURL(file);
        player.src = url;
        player.hidden = false;
        localStorage.setItem("audioReady", "true");
    });

    function loadSavedAudio() {
        let ready = localStorage.getItem("audioReady");
        if (!ready) return;

        let tx = db.transaction("files", "readonly");
        let store = tx.objectStore("files");
        let getReq = store.get("savedAudio");
      $("#audio-btn").attr("data-status", "play").html('<i class="fa-solid fa-play"></i>');
      
      if ($("#lyrics").css("display") === "block") {
      $("#next-line").removeClass("inactive");
        }
      
        getReq.onsuccess = function(e) {
          
            let file = e.target.result;
            if (file) {
                let url = URL.createObjectURL(file);
                player.src = url;
                player.hidden = false;
                document.getElementById("play").dataset.file = "ready";
            }
        };
    }

    function playAudio() {
    if (!player.src) {
        alert("Upload an audio file first!");
        return;
    }

    var selectedP = $("#lyrics p.selected");
    var startTime = 0;
       
      if (!$("#lyrics p").hasClass("selected")) {
            $selected = $("#lyrics p:eq(0)").addClass("selected");
            if ($selected.find("span").length === 0) {
                $selected.prepend(" <span></span> ");
            }
        }

    if (selectedP.length) {
        // get previous <p> with a span
        var prevP = selectedP.prevAll("p").filter(function() {
            return $(this).find("span").length && $(this).find("span").text().trim() !== "";
        }).first();

        if (prevP.length) {
            startTime = parseTimeString(prevP.find("span").text().trim());
        }
    }
    
      $("#audio-btn").attr("data-status", "pause").html('<i class="fa-solid fa-stop"></i>');
    player.currentTime = startTime;
    player.play();
}

function parseTimeString(s) {
    if (!s) return 0;
    s = s.replace(/[\[\]]/g, "");
    var m = s.match(/(\d+):(\d+)(?:\.(\d+))?/);
    if (!m) return 0;
    var min = parseInt(m[1], 10);
    var sec = parseInt(m[2], 10);
    var frac = m[3] ? parseInt(m[3], 10) / Math.pow(10, m[3].length) : 0;
    return min * 60 + sec + frac;
}

function formatTime(time) {
    var minutes = Math.floor(time / 60);
    var seconds = Math.floor(time % 60);
    var milliseconds = Math.floor((time % 1) * 100);
    return ("0" + minutes).slice(-2) + ":" + ("0" + seconds).slice(-2) + "." + ("0" + milliseconds).slice(-2);
}

function getTimeFromP($p) {
    var spanText = $p.find("span").text().trim();
    if (spanText) return parseTimeString(spanText);
    return NaN;
}

function syncLyrics() {
    var current = player.currentTime;
    var isRecording = $("#next-line").hasClass("go");

    $("#lyrics p").removeClass("sync");

    // get all valid lyric lines (skip [Hook:], [Verse:], etc)
    var $validLyrics = $("#lyrics p").filter(function() {
        var text = $(this).clone().children("span").remove().end().text().trim();
        var time = getTimeFromP($(this));
        return !/^\s*\[.*?\]\s*$/.test(text) && !isNaN(time);
    });

    $validLyrics.each(function(index) {
        var $this = $(this);
        var start = getTimeFromP($this);
        var next = $validLyrics.eq(index + 1);
        var end = next.length ? getTimeFromP(next) : Number.POSITIVE_INFINITY;

        if (current >= start && current < end) {
            $this.addClass("sync"); 

            // only scroll if NOT recording AND not the last lyric
            if (!isRecording && index !== $validLyrics.length - 1) {
                $("#lyrics").animate({
                    scrollTop: ($this.position().top - 5) + $("#lyrics").scrollTop() - $("#lyrics").height()/2
                }, 200);
            }

            // update timestamp if recording
            if (isRecording && $this.hasClass("selected") && !$this.hasClass("set")) {
                $this.find("span").html("[" + formatTime(current) + "]");
            }

            return false; // stop once we find current line
        }
    });
}


player.addEventListener("timeupdate", syncLyrics);
    
document.getElementById("play").addEventListener("click", function() {
  playAudio();
});

});

if ( $(this).attr("data-status") === "upload" && !player.src) {

          }
}
                                                
                                                
});
    
    

    $("#lyrics").on("click", "p", function() {
        var $this = $(this);
      
      
      if ( $(this).hasClass("set") ) {

        $("#set, #clear-time").addClass("inactive");

      } else {
        $("#set").removeClass("inactive");
        
        var spanText = $(this).find("span").text().trim();
      if (spanText !== "") {
        $("#clear-time").removeClass("inactive");
      }
        
        $(this).addClass("clicked");
      }
      
      if ( $("#lyrics p").hasClass("set") || $("#lyrics p").hasClass("clicked") ) {
        $("#refresh").removeClass("inactive");
      } else {
        $("#refresh").addClass("inactive");
      }
      
    });

    function formatTime(time) {
        var minutes = Math.floor(time / 60);
        var seconds = Math.floor(time % 60);
        var milliseconds = Math.floor((time % 1) * 100); 

        var m = ("0" + minutes).slice(-2);
        var s = ("0" + seconds).slice(-2);
        var ms = ("0" + milliseconds).slice(-2);

        return m + ":" + s + "." + ms;
    }

    function updateSelected() {
        var current = formatTime(player.currentTime);

        $("#lyrics p").each(function() {
            var $p = $(this);
            var spanTime = $p.find("span").text();

            if ($p.hasClass("selected") && !$p.hasClass("set") && $("#next-line").hasClass("go")) {
                $p.find("span").text("[" + current + "]");
            }

            if (spanTime === current) {
                $p.addClass("selected").siblings().removeClass("selected");
            }
        });
    }

    player.addEventListener("timeupdate", updateSelected);
    player.addEventListener("seeking", updateSelected);

    $("#set").click(function() {
    var $selected = $("#lyrics p.clicked");
    var spanText = $selected.find("span").text().trim();

    if ($(this).find("span").text() === "Set") {
        if (spanText !== "") {
            $selected.addClass("set")
                     .removeClass("selected")
                     .next("p").addClass("selected");
        }
    } else {
      $("#set i").removeClass().addClass("fa-solid fa-check");
        $("#lyrics p.clicked.set").removeClass("set clicked");
    }

    saveLyrics();
});

    
    $("#lyrics").on("click", function(e) {
  if (e.target !== this || $("#next-line").data("status") !== "record") return

  const $lyricsP = $("#lyrics p");

    $("#lyrics p").each(function() {

    // match either [00:00.00] or 00:00.00 at start of line
    var match = text.match(/^\[?\d{2}:\d{2}\.\d{2}\]?/);
    if (match) {
        var timestamp = match[0];

        // ensure brackets
        if (!timestamp.startsWith("[")) timestamp = "[" + timestamp + "]";

        // replace first occurrence with <span>[timestamp]</span>
        text = text.replace(match[0], "<span>" + timestamp + "</span>");
        $p.html(text);
    } else {
        // ensure at least an empty span exists
        if ($p.find("span").length === 0) {

        }

});
    
    
 $("#next").click(function() {

                line = line.slice(1).trim();

            if (line === "") {
                if (this.tagName === "P") $(this).replaceWith("<br>");
                return;
            }

            // match timestamp at start
            var match = line.match(/^(\[?\d{2}:\d{2}\.\d{2}\]?)(.*)/);
            var timestamp = "";
            var text = line;

            if (match) {
                timestamp = match[1];
                text = match[2].trim();
                if (!timestamp.startsWith("[")) timestamp = "[" + timestamp + "]";
            }

            if (this.tagName === "P") {
                var $p = $(this);
                if (timestamp) $p.html("<span>" + timestamp + "</span> " + text);
                else $p.html("<span></span> " + text);

                if (isSet) $p.addClass("set"); // apply class only
            } else if (this.tagName === "BR") {

                var match = line.match(/^(\[?\d{2}:\d{2}\.\d{2}\]?)(.*)/);
                var timestamp = "";
                var text = line;
                if (match) {
                    timestamp = match[1];
                    text = match[2].trim();
                    if (!timestamp.startsWith("[")) timestamp = "[" + timestamp + "]";
                }
                var $p = $('<p data-minutes></p>');
                if (timestamp) $p.html("<span>" + timestamp + "</span> " + text);
                else $p.html("<span></span> " + text);

    $("#next-line").click(function() {
    if (!$(this).hasClass("inactive")) {
        let $selected = $("#lyrics p.selected");

      if ( $(this).attr("data-status") === "next line" ) {
        if (!$("#lyrics p").hasClass("selected")) {
            $selected = $("#lyrics p:eq(0)").addClass("selected");
            if ($selected.find("span").length === 0) {
                $selected.prepend(" <span></span> ");
            }
        } else {
            // find next <p> with actual lyrics
            let $next = $selected.nextAll("p").filter(function() {
                let text = $(this).clone().children("span").remove().end().text().trim();
                return text && !(/^\[.*\]$/.test(text));
            }).first();

            // if no next, wrap around to first valid lyric
            if (!$next.length) {
                $next = $("#lyrics p").filter(function() {
                    let text = $(this).clone().children("span").remove().end().text().trim();
                    return text && !(/^\[.*\]$/.test(text));
                }).first();
            }

            $selected.removeClass("selected");
            $next.addClass("selected").siblings().removeClass("selected");
            $selected = $next;

            if ($selected.find("span").length === 0) {
                $selected.prepend(" <span></span> ");
            }
        }

        // Scroll container if selected p is below visible area
        let container = $("#lyrics");
        let selectedTop = $selected.position().top;
        let selectedBottom = selectedTop + $selected.outerHeight();
        let containerHeight = container.height();
        let scrollTop = container.scrollTop();

        if (selectedBottom > containerHeight) {
            container.scrollTop(scrollTop + selectedBottom - containerHeight);
        } else if (selectedTop < 0) {
            container.scrollTop(scrollTop + selectedTop);
        }
    }

      $(this).addClass("go").attr("data-status", "next line").find("span").text("Next line");
      playAudio();

    }

    $("#download").click(function() {
    var output = "";
    var lastWasBR = false;

    $("#lyrics").contents().each(function() {
        if (this.nodeType === 1) { // element node
            if (this.tagName === "P") {
                var $p = $(this);
                var spanText = $p.find("span").text().trim();
                spanText = spanText.replace(/^\[|\]$/g, "");

                var text = $p.clone().find("span").remove().end().text().trim();

                var pTag = "<p";
                if (spanText) pTag += ' data-minutes="' + spanText + '"';
                pTag += ">" + text + "</p>";

                output += pTag + "\n";
                lastWasBR = false;

            } else if (this.tagName === "BR") {
                if (!lastWasBR) { // prevent double <br>
                    output += "<br>\n";
                    lastWasBR = true;
                }
            }
        }
    });

    // remove trailing <br> at the end
    output = output.replace(/(<br>\s*)+$/i, "");

    navigator.clipboard.writeText(output).then(function() {
        console.log("Lyrics copied!");
    }).catch(function(err) {
        console.error("Failed to copy: ", err);
    });
});

      <script>
            $("#lrc").click(function() {
    var lrcContent = "";

    $("#lyrics p").each(function() {
        // get the text content only
        var line = $(this).text().trim();
        if (line) {
            lrcContent += line + "\n";
        }
    });

    // create a Blob
    var blob = new Blob([lrcContent], { type: "text/plain;charset=utf-8" });
    var url = URL.createObjectURL(blob);

    // create temporary link to trigger download
    var a = document.createElement("a");
    a.href = url;
    a.download = "lyrics.lrc";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
});
            </script>

    $("#song-list").addClass("loading");

    // 2. Make AJAX Request using a RELATIVE PATH for same-site compatibility
    $.get("/content/lyrics.html") 
        
        // SUCCESS Handler
        .done(function(data) {
            var html = $(data);
            var $songContainer = $("#song-list .contain");
            $songContainer.empty();
            
            var itemCount = 0; 

            // 🎯 ROBUST SELECTOR FIX: Find the '.lyric' elements, whether they are top-level
            // fragments or nested inside the <body> tag of the full HTML document.
            html.filter(".lyric").add(html.find(".lyric")).each(function() {
                var $lyric = $(this);
                
                // Content is nested inside the .metadata div as per your example
                var $metadata = $lyric.find(".metadata");
                
                var artist = $metadata.find(".artist").text(); 
                var track = $metadata.find(".track").text();

                    itemCount++;

                    var section =
                        '<div class="item">' +
                            '<div class="section">' +
                                '<p class="artist">' + artist + '</p>' +
                                '<p class="name">' + track + '</p>' +
                            '</div>' +
                            '<div class="section">' +
                                '<button type="button" class="pick">Choose</button>' +
                            '</div>' +
                        '</div>';

                    $songContainer.append(section);
                }
            });
            
            // 3. Finalize Loading State (Run once after all content is appended)
            $("#song-list").removeClass("loading");
            $("#song-list").addClass("go");
            
            // Optional: Display message if no songs were found
            if (itemCount === 0) {
                 $songContainer.html('<p class="info">Content loaded, but no valid song items were found. Check your HTML structure.</p>');

        })

        // FAIL Handler for network/CORS issues
        .fail(function(jqXHR, textStatus, errorThrown) {

            // Display an error message to the user
            $("#song-list .contain").html('<p class="error">Failed to load songs. Check the browser console for details (e.g., a 404 error).</p>');
            
            // Stop the loading spinner
            $("#song-list").removeClass("loading");
        });
});
