    background:transparent url('https://64.media.tumblr.com/f8eec3393bd83a9e672be2fdc3a804d2/e0ab06015c6ffb03-84/s1280x1920/ded168b02241c5322219f0e26fb183ec2572b915.pnj') center/cover no-repeat;

  }

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>

  <body>
    
    
    <div id="yellow" class="bg"></div>
    <div id="blue" class="bg"></div>
    <div id="pink" class="bg"></div>
    <div id="bg" class="bg"></div>
    
    <div id="intro" class="modal">
      <div class="top section">
      </div>
      
      <div class="center section">
        <img src="https://64.media.tumblr.com/afc5e3c443853dc94ff73b12682556cc/5e1bb4f1b00f2a8b-2d/s1280x1920/f968bcb5d8e0f0d45c5c0467b3d93ddf0dc47a4f.pnj" class="logo" alt="U'N'Verse City" />

          <button type="button" id="start" class="btn">Start Game</button>
          <button type="button" class="btn">Credits</button>
        </div>
      </div>
      
      <div class="bottom section">
      </div>
    </div>
    
    <div id="intro2">
      <img src="https://64.media.tumblr.com/14d1c522b101e33afe4865ccec03ae1a/68c2d0ef66acc3ed-98/s1280x1920/03914276623009f7c4f87568df6aa9cd5a07e3b0.pnj" class="character" alt="SAVIONCE" />
      <img src="https://64.media.tumblr.com/34ddec1669fd8905128205f3de468790/68c2d0ef66acc3ed-26/s640x960/589cd96eeab1cf55cb24f6ed22f18c4ce268f040.pnj" class="character2" alt="London Llaflare" />
      
      <div id="nickname">
        <button type="button">Use from Treesh</button>
        <button type="button" id="new_nickname-btn">New Nickname</button>
        
        <input type="text" placeholder="Type a name" id="nicknameInput" />
      </div>
    </div>
    
    <div id="dialogue">
      <div class="character_name">SAVIONCE</div>
      <div class="body"></div>
      
      <div class="options">
        <button type="button" class="next">Continue</button>
      </div>
    </div>
    
    <script>
      gsap.registerPlugin(ScrollTrigger, ScrollToPlugin, Draggable, InertiaPlugin, ScrollSmoother, EasePack);
      
      const $body = $("body")[0];
      const $html = $("html")[0];
      const $bg = $("#bg")[0];
      let bgs = $(".bg");
      
      let nickname = "Treesh";
      
      let introAni = gsap.timeline();
      
      const intro = $("#intro")[0];
      const intro2 = $("#intro2");
      const introLogo = $("#intro .logo")[0];
      let menuBtns = $("#intro .menu .btn");
      
      const intro2Character = $("#intro2 .character");
      const intro2Character2 = $("#intro2 .character2");
      const dialogue = $("#dialogue");
      const dialogueCharacterName = dialogue.find(".character_name");
      const dialogueMsg = dialogue.find(".body");
      
      const newNicknameBtn = $("#new_nickname-btn");
      const $startBtn = $("#start");
      
      let intro2Msgs = [
  {
    character: "SAVIONCE",
    Msgs: [
      { text: "Ah. The new guy that the city has been raving about." },
      { text: "What brings you here? You think you'll fit in?" },
      { text: "This is <b>U'N'Verse City</b>. A city built from the ground up for rappers." },
      { text: "Since you're here, it doesn't hurt to get to know you." },
      { text: "What's your name? Stage name? Nickname? Whatever you wanna be called." }
    ]
  },
  {
    character: "SAVIONCE",
    Msgs: [
      { text: "Cool. Nice to meet you, <b>{nickname}</b>." },
      { text: "I'm going to go take you to the city if that's alright with you." }
    ]
  },
  {
    character: "London",
    Msgs: [
      { text: "Another loser?", action: bringInLondonIntro2 },
      { text: "SAVIONCE... Why are you bringing THAT in our city?" }
    ]
  }
];

      
      function changeDialogue(characterName, msg) {
        dialogueCharacterName.text(characterName);
        dialogueMsg.html(msg);
      }
      
      function playDialogue(characterName, msg) {
        $("#dialogue .word").remove();
        
  const tl = gsap.timeline();

  tl.fromTo(dialogue, {
    opacity: 0,
    y: 40,
    scale: 0.8
  }, {
    opacity: 1,
    y: 0,
    scale: 0.9,
    duration: 0.6,
    ease: "circ.out",
    onComplete: () => {
      changeDialogue(characterName, msg);
      typeText("#dialogue .body");
    }
  });
}
      
      function stopDialogue(onComplete) {
        gsap.to(dialogue, {
          opacity: 0,
          y: 40,
          scale: 0.8,
          duration: 0.6,
          ease: "circ.out",
          onComplete: () => {
            $("#dialogue .body").empty();
      if (onComplete) onComplete(); 
          }
        });
      }

function typeText(selector) {
  const el = $(selector);
  const text = el.text();
  el.text(""); // clear old text

  const words = text.split(/(\s+)/); // keep spaces in split

  words.forEach(word => {
    const wordSpan = $("<span class='word'></span>");
    [...word].forEach(char => {
      const charSpan = $("<span></span>").text(char);
      wordSpan.append(charSpan);
    });
    el.append(wordSpan);
  });

  gsap.fromTo(`${selector} .word span`, 
    { opacity: 0 }, 
    { opacity: 1, duration: 0.04, stagger: 0.04, ease: "none" }
  );
}


      
      function loadGame() {
        introAni.to(introLogo, {
          opacity: 1,
          scale: 1,
          duration: 1,
          y: "50%",
          delay: 1, 
          rotate: 360,
          ease: "bounce.out",
          onComplete: () => {
            gsap.to(introLogo, {
          y: 0,
          ease: "bounce.out"
            });
          }
        }).to(introLogo, {
          repeat: -2,
          yoyo: true,
          filter: "drop-shadow(0px 0px 20px purple)",
          duration: 1, 
          ease: "power4.out"
        }).to(bgs, {
          opacity: 1,
          scale: 1,
          stagger: 0.2, 
          borderRadius: 0, 
          height: "120%",
          width: "120%",
          top: "-10%",
          left: "-10%",
          duration: 1,
          ease: "power1.out",
          onComplete: () => {
            bgAnimation();
          }
        }, "-=0.3").to(menuBtns, {
          opacity: 1,
          y: 0,
          scale: 1.6,
          stagger: 0.15,
          duration: 0.3,
          ease: "power4.out"
        }, "-=0.9").to(menuBtns, {
          scale: 1,
          stagger: 0.15,
          duration: 0.3,  
          ease: "power4.out"
        }, "-=0.3");
      }
      
      
      let bgAni = gsap.timeline();
      
       function bgAnimation() {
    bgAni.to("#bg", {
      scale: 1.2,
      x: 30,
      y: 30,
      duration: 10,
      ease: "sine.inOut",
      yoyo: true,
      repeat: -1
    });
  }
      
      let startGameAni = gsap.timeline();
      
      function startGame() {
        startGameAni.to(menuBtns, {
          opacity: 0,
          y: 40,
          duration: 1,
          stagger: 0.2,
          ease: "power1.out"
        }).to(introLogo, {
          scale: 10,
          opacity: 0,
          duration: 3,
          ease: "circ.out",
          y: "50%"
        }).to(".bg", {
          scale: 0,
          stagger: -0.2,
          y: "10%",
          x: "10%",
          borderRadius: "100%",
          width: window.innerWidth,
          height: window.innerWidth,
          opacity: 0,
          duration: 1,
          ease: "circ.out",
          onComplete: function() {
            intro.remove();
          }
        }, "-=2")
        .fromTo(intro2Character, {
          opacity: 0,
          x: 30,
          scale: 0.7
        }, {
          opacity: 1,
          x: 0,
          scale: 1,
          duration: 4,
          ease: "circ.out"
        }).to({}, {
  duration: 0, 
  onComplete: () => {
    playDialogue("SAVIONCE", intro2Msgs[0].Msgs[0].text);
  }
}, "-=2");;
        
         
      }
      
      
      function bringInLondonIntro2() {
        gsap.fromTo(intro2Character2, {
          opacity: 0,
          x: 100,
          scale: 0.7
        }, {
          opacity: 1,
          x: 0,
          scale: 1,
          duration: 4,
          ease: "circ.out"
        });
        
        gsap.to(intro2Character, {
          x: -100,
          opacity: 0.6,
          duration: 2,
          ease: "circ.out"
        });
      }
      
      
      
      

      
      $(document).ready(function() {
        
        loadGame();
         
        $(document).on("click", "#start", function() {
          startGame();
        });
        
        
        let currentMsgIndex = 0;

        let sceneIndex = 0;
let msgIndex = 0;
let charData = intro2Msgs[sceneIndex];
        
$(document).on("click", "#dialogue .options button", function() {
  msgIndex++;

  if (msgIndex >= charData.Msgs.length) {
    // scene logic stays the same
    if (sceneIndex === 0) {
      stopDialogue(() => {
        gsap.to(intro2Character, { opacity: 0.3, duration: 0.6, ease: "ease.out" });
        gsap.fromTo("#nickname button", 
          { opacity: 0, y: 40, scale: 0.8 },
          { opacity: 1, y: 0, stagger: 0.2, scale: 1, ease: "circ.out" }
        );
      });
      return;
    }

    if (sceneIndex === 1) {
      stopDialogue(() => {
        sceneIndex = 2;
        msgIndex = 0;
        charData = intro2Msgs[sceneIndex];
        playDialogue(charData.character, charData.Msgs[msgIndex].text);
        if (charData.Msgs[msgIndex].action) charData.Msgs[msgIndex].action();
      });
      return;
    }

    if (sceneIndex === 2) {
      stopDialogue(() => {
        gsap.to("#intro2 .character", { x: -100, duration: 0.3, ease: "power1.out" });
      });
      return;
    }
  }

  let msgObj = charData.Msgs[msgIndex];

  // run action if it exists
  if (msgObj.action) msgObj.action();

  playDialogue(charData.character, msgObj.text);
});



        
        $(document).on("click", "#new_nickname-btn", function() {
  const tll = gsap.timeline();

  tll.to("#nickname button", {
    opacity: 0,
    y: 40,
    scale: 0.8,
    ease: "circ.out",
    zIndex: -1000,
    duration: 0.4
  })
  .fromTo("#nickname input", 
    { opacity: 0, y: -40, scale: 0.8, zIndex: -20 },
    { opacity: 1, y: 0, scale: 1, ease: "circ.out", duration: 0.4, zIndex: 20 }
  );
});
       

$("#nickname input").on("keydown", function(e) {
  if (e.key === "Enter") {
    nickname = $(this).val();

    gsap.to("#nickname input", { opacity: 0, y: -40, scale: 0.8, zIndex: -20, ease: "circ.out", duration: 0.4 });

    gsap.to("#intro2 .character", { opacity: 1, duration: 0.3, ease: "power1.out" });

    sceneIndex = 1;
    msgIndex = 0;
    charData = intro2Msgs[sceneIndex];

    // update each message's text dynamically
    charData.Msgs.forEach(m => {
      m.text = m.text.replace("{nickname}", nickname);
    });

    playDialogue(charData.character, charData.Msgs[msgIndex].text);

    // run action if first message has one
    if (charData.Msgs[msgIndex].action) charData.Msgs[msgIndex].action();
  }
});






        
        });
      
    </script>
